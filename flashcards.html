<title>LC 복습 카드</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style id="app-css">
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

:root{
  --ground:#E9ECF0; --card:#FFFFFF; --card-2:#F5F6F8; --line:#D5DAE2; --line-soft:#E4E8EE;
  --ink:#1C2128; --ink-2:#5B6470; --muted:#8A93A0; --faint:#B5BCC6;
  --rule-red:#C9412B; --rule-blue:#9DB4D6; --rule-blue-soft:#DCE5F1;
  --accent:#2F5FAB; --accent-ink:#FFFFFF;
  --easy:#2E7D4F; --medium:#B7791F; --hard:#B33A3A;
  --pri:#B7791F; --pri-bg:#FBF0D9;
  --easy-bg:#E3F1E8; --medium-bg:#F7EBD3; --hard-bg:#F5DEDE;
  --shadow:0 1px 2px rgba(28,33,40,.06), 0 10px 28px -14px rgba(28,33,40,.25);
  --shadow-lift:0 2px 4px rgba(28,33,40,.08), 0 24px 48px -20px rgba(28,33,40,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#14171C; --card:#1E232B; --card-2:#252B34; --line:#343B46; --line-soft:#2B323C;
    --ink:#E6E9EE; --ink-2:#9AA3AF; --muted:#727B88; --faint:#4E5662;
    --rule-red:#D9553F; --rule-blue:#3D5170; --rule-blue-soft:#2A3547;
    --accent:#7FA6E8; --accent-ink:#0F1520;
    --easy:#6FC493; --medium:#E0B25E; --hard:#E4756B;
    --pri:#E0B25E; --pri-bg:#3A3220;
    --easy-bg:#1E3328; --medium-bg:#3A2F17; --hard-bg:#3B2222;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.6);
    --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 24px 48px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#14171C; --card:#1E232B; --card-2:#252B34; --line:#343B46; --line-soft:#2B323C;
  --ink:#E6E9EE; --ink-2:#9AA3AF; --muted:#727B88; --faint:#4E5662;
  --rule-red:#D9553F; --rule-blue:#3D5170; --rule-blue-soft:#2A3547;
  --accent:#7FA6E8; --accent-ink:#0F1520;
  --easy:#6FC493; --medium:#E0B25E; --hard:#E4756B;
  --easy-bg:#1E3328; --medium-bg:#3A2F17; --hard-bg:#3B2222;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.6);
  --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 24px 48px -20px rgba(0,0,0,.7);
}

body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ───────── shell ───────── */
.wrap{max-width:640px;min-width:0;margin:0 auto;padding:0 0 80px}

.top{position:sticky;top:0;z-index:5;background:var(--ground);padding:14px 16px 10px;border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand .cnt{font-size:12px;color:var(--muted);letter-spacing:.02em}
.brand .grow{flex:1}
.theme{width:30px;height:30px;border-radius:8px;color:var(--muted);display:grid;place-items:center;font-size:15px}
.theme:hover{background:var(--card-2);color:var(--ink)}

.tracks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.track{padding:8px 4px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.track em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;color:var(--muted)}
.track[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.track[aria-pressed="true"] em{color:var(--card);opacity:.7}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:7px 4px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"] em{color:var(--ink-2)}

.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;color:var(--ink-2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] em{color:var(--accent-ink);opacity:.8}

/* ───────── list ───────── */
.list{padding:6px 12px 0}
.group{margin-top:14px}
.group-h{display:flex;align-items:baseline;gap:8px;padding:6px 6px 6px;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.group-h em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-weight:500;letter-spacing:0;text-transform:none}
.rows{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;width:100%;padding:11px 14px 11px 12px;text-align:left;border-top:1px solid var(--line-soft);position:relative}
.row:first-child{border-top:0}
.row:hover{background:var(--card-2)}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.row[data-r="1"]::before{background:color-mix(in oklab,var(--rule-red) 45%,transparent)}
.row[data-r="2"]::before{background:color-mix(in oklab,var(--rule-red) 70%,transparent)}
.row[data-r="3"]::before{background:var(--rule-red)}
.row .n{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.row .t{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.3;min-width:0;overflow-wrap:anywhere}
.row.unsolved .t{color:var(--ink-2);font-weight:400}
.row.unsolved .n{color:var(--muted)}
.row .meta{display:flex;align-items:center;gap:8px}
.diff{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.diff.E{color:var(--easy);background:var(--easy-bg)}
.diff.M{color:var(--medium);background:var(--medium-bg)}
.diff.H{color:var(--hard);background:var(--hard-bg)}
.diff.T1,.diff.T2,.diff.T3{width:auto;padding:0 6px;font-size:10.5px}
.diff.T1{color:var(--hard);background:var(--hard-bg)}
.diff.T2{color:var(--medium);background:var(--medium-bg)}
.diff.T3{color:var(--easy);background:var(--easy-bg)}
.rv{display:flex;gap:2px;width:22px}
.rv i{flex:1;height:8px;border-radius:2px;background:var(--line)}
.rv[data-r="1"] i:nth-child(1),.rv[data-r="2"] i:nth-child(-n+2),.rv[data-r="3"] i{background:var(--rule-red)}
.row.unsolved .rv i{background:var(--line-soft)}
.row.pri::before{background:var(--pri)}
.row.pri .t{color:var(--ink);font-weight:500}
.row.pri .n{color:var(--pri)}
.pri-badge{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--pri);background:var(--pri-bg);border-radius:6px;padding:2px 6px;line-height:1.4}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}

/* ───────── study ───────── */
.study{position:fixed;inset:0;z-index:20;background:var(--ground);display:none;flex-direction:column}
.study.open{display:flex}
.s-top{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.s-top .pos{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.s-top .cat{font-size:12px;color:var(--ink-2)}
.s-top .grow{flex:1}
.s-top .x{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);font-size:18px}
.s-top .x:hover{background:var(--card-2);color:var(--ink)}

.stage{flex:1;min-height:0;min-width:0;padding:6px 14px 10px;perspective:1400px}
.card{position:relative;width:100%;height:100%;max-width:560px;margin:0 auto;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1)}
.card.flipped{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.face{position:absolute;inset:0;min-width:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:16px;box-shadow:var(--shadow-lift);display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.face.back{transform:rotateY(180deg)}
/* index-card top rule: thickness = review level */
.face::before{content:"";display:block;flex:none;height:var(--rule-h,2px);background:var(--rule-c,var(--rule-blue))}
.card[data-r="0"]{--rule-h:2px;--rule-c:var(--rule-blue)}
.card[data-r="1"]{--rule-h:4px;--rule-c:var(--rule-red)}
.card[data-r="2"]{--rule-h:7px;--rule-c:var(--rule-red)}
.card[data-r="3"]{--rule-h:11px;--rule-c:var(--rule-red)}
.f-body{flex:1;min-height:0;overflow-y:auto;padding:20px 22px 22px}
.f-head{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.f-num{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:500;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.f-num small{font-size:16px;color:var(--muted);margin-right:1px}
.f-badges{display:flex;gap:6px;align-items:center;margin-left:auto}
.tag{font-size:10.5px;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);padding:2px 7px;border-radius:999px}
.f-title{margin:0 0 14px;font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
.f-desc{font-size:15px;line-height:1.65;color:var(--ink-2);max-width:62ch}
.f-foot{margin-top:auto;padding-top:16px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted)}
.f-foot a{color:var(--accent);text-decoration:none;font-weight:500}
.f-foot a:hover{text-decoration:underline}
.f-foot .hint{margin-left:auto}
.f-unsolved{display:inline-block;font-size:11.5px;color:var(--muted);border:1px dashed var(--line);padding:2px 8px;border-radius:6px;margin-bottom:12px}
.f-cat{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);line-height:30px}
.f-qs{margin:0 0 14px;padding-left:22px;font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.f-qs li{margin:4px 0}
.f-file{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}
/* markdown 전문 */
.md{font-size:14.5px;line-height:1.7;color:var(--ink);overflow-wrap:anywhere}
.md h2{font-size:16px;margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--line-soft);line-height:1.35}
.md h2:first-child{margin-top:0;padding-top:0;border-top:0}
.md h3{font-size:14px;margin:16px 0 6px;color:var(--ink-2)}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin:2px 0}
.md blockquote{margin:0 0 12px;padding:6px 12px;border-left:3px solid var(--rule-blue);color:var(--ink-2);background:var(--card-2);border-radius:0 6px 6px 0;font-size:13.5px}
.md blockquote p{margin:0}
.md code{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--card-2);padding:1px 5px;border-radius:4px;color:var(--ink)}
.md pre{margin:10px 0;padding:10px 12px;border-radius:8px;background:var(--card-2);border-left:2px solid var(--rule-blue);overflow-x:auto;-webkit-overflow-scrolling:touch}
.md pre code{background:none;padding:0;font-size:12px;line-height:1.55;color:var(--ink-2);white-space:pre}
.md .tbl{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.md table{border-collapse:collapse;font-size:13px;min-width:100%}
.md th,.md td{border:1px solid var(--line-soft);padding:6px 8px;text-align:left;vertical-align:top}
.md th{background:var(--card-2);font-weight:600;white-space:nowrap}
.md hr{border:0;border-top:1px solid var(--line-soft);margin:16px 0}
.md a{color:var(--accent)}
.md img{max-width:100%}
@media (max-width:480px){ .md{font-size:14px} .md pre code{font-size:11px} .md table{font-size:12px} }
.f-pri{display:inline-block;font-size:11.5px;font-weight:600;color:var(--pri);background:var(--pri-bg);padding:2px 8px;border-radius:6px;margin:0 6px 12px 0}

/* back */
.b-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--rule-red);margin:0 0 10px}
.cx{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
.cx b{font-weight:500;color:var(--muted);margin-right:6px}
.note{font-size:14.5px;line-height:1.7;color:var(--ink)}
.note .p{white-space:pre-wrap;overflow-wrap:anywhere}
.ncode{margin:10px 0;padding:10px 12px;border-radius:8px;background:var(--card-2);
  border-left:2px solid var(--rule-blue);overflow-x:auto;
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;line-height:1.55;white-space:pre;color:var(--ink-2);
  -webkit-overflow-scrolling:touch}
@media (max-width:480px){ .ncode{font-size:11px;padding:8px 10px} }
.note:empty::before{content:"아직 노트가 없습니다. Core/LC 의 @note 를 채우면 여기 나타납니다.";color:var(--muted)}
.appr{margin-top:18px;border-top:1px solid var(--line-soft);padding-top:10px}
.appr summary{cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
.appr summary::-webkit-details-marker{display:none}
.appr summary::after{content:"▾";margin-left:auto;transition:transform .15s}
.appr[open] summary::after{transform:rotate(180deg)}
.ap{margin-top:12px;padding-left:12px;border-left:2px solid var(--rule-blue)}
.ap .nm{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:3px}
.ap .dt{font-size:13px;color:var(--ink-2);line-height:1.6}
.ap .c{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);margin-top:4px}

.s-bar{display:grid;grid-template-columns:44px 1fr auto 1fr;align-items:center;gap:8px;padding:8px 14px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.s-bar .close{font-size:20px;color:var(--ink-2);padding:0}
.s-bar button{height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:500;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.s-bar button:hover{background:var(--card-2)}
.s-bar button:disabled{opacity:.35;cursor:default}
.s-bar .flip{padding:0 18px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.s-bar .flip:hover{background:var(--accent)}

/* ───────── desktop: list | card ───────── */
.s-empty{flex:1;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:40px}
.s-empty kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink-2)}
@media (min-width:900px){
  body{display:grid;grid-template-columns:420px minmax(0,1fr);height:100vh;overflow:hidden}
  #root{overflow-y:auto;height:100vh;border-right:1px solid var(--line)}
  .wrap{max-width:none;padding-bottom:40px}
  .study{position:static;display:flex;height:100vh;background:var(--card-2)}
  .study .s-top{padding:16px 20px 8px}
  .stage{padding:8px 28px 12px}
  .card{max-width:640px}
  .s-bar{max-width:640px;margin:0 auto;width:100%;padding-bottom:18px}
  .s-bar .close{display:none}
}
@media (max-width:480px){
  .f-body{padding:16px 18px 18px}
  .f-num{font-size:26px}
  .f-title{font-size:20px}
}
</style>

<div id="root"></div>
<div id="study" class="study" aria-hidden="true"></div>

<script id="app-doc" type="text/plain">
복습 카드 (LC · CS · AI · OOD) 데이터 규약

■ 원본 (리포: Core/)
    LC/*/*.cpp          @status / @review / @time / @space / @note 가 진실. cards_meta.json 은 설명·접근법 씨앗
    LC/next.md          "## 우선순위 A" 표의 번호가 카드에 A 배지로 붙는다
    CS/*/*.md           파일 1개 = 카드 1개. 앞면 = Q 제목들, 뒷면 = 파일 전문. 완료·재복습은 CS/tracker.md
    AI/*/*/*.md         위와 같음. 티어(T1-T3)는 파일 상단 "> THEORY · inference · T1" 줄. 상태는 AI/tracker.md
    OOD/NN_*/design.md  앞면 = 단계 목록, 뒷면 = 전문. 상태는 OOD/tracker.md
    LC/cards.tmpl.html  이 파일. UI 껍데기
    LC/build_cards.py   위 전부  →  LC/cards.html
    LC/cards.html       빌드 산출물. 직접 고치지 말 것. beenpow.github.io/flashcards.html 로 복사

■ 갱신 절차
    1) 원본을 고친다 (.cpp 헤더 / .md / tracker)
    2) python3 Core/LC/build_cards.py
    3) cp Core/LC/cards.html ../beenpow.github.io/flashcards.html

■ 카드 하나 = { track, id, num, title, diff, cat, catName, tags, link, desc, qs[], md, file,
                approaches[], solved, review, time, space, note, date, pri }
    review 0~3 = 복습 필요도 (LC: .cpp @review / CS·AI: Review Log 가 "재복습" 이면 2)
    카드 윗줄 두께와 목록의 빨간 세로선이 이 값을 그대로 보여준다.
    뒷면 .md 는 marked.js(cdnjs) 로 렌더. 로드 실패 시 평문으로 보여준다.
</script>

   "note": "Time complexity 가 생각보다 높지 않다.\n각 숫자에 +/- 두 갈래뿐이라 다 펼쳐도 2^20 = 약 10^6.\n제약을 먼저 계산해보면 naive 로 충분하다는 게 바로 나온다.\n\n0 은 +0 과 -0 이 다른 조합으로 세어진다.\n{0} 타겟 0 의 답이 1 이 아니라 2 인 이유.\n\n[DP 유도] 내 dfs 에서 출발해서 dp[j] += dp[j-num] 까지\n\n    (1) 내 dfs\n        int dfs(int idx, int sum) {\n            if (idx == n) return (sum == target) ? 1 : 0;\n            return dfs(idx+1, sum + nums[idx]) + dfs(idx+1, sum - nums[idx]);\n        }\n        dfs(idx, sum) = \"idx 번째부터 끝까지 부호를 붙여 target 에 닿는 방법의 수\"\n\n    (2) 같은 질문이 여러 번 온다\n        nums = {1,1,1} 이면 dfs(2, 0) 이 두 번 불림 (+1-1 경로, -1+1 경로).\n        질문이 같으면 답도 같은데 매번 끝까지 계산한다.\n\n    (3) 답을 적어둔다 = memo = DP\n        map<pair<int,int>, int> memo;\n        if (memo.count({idx,sum})) return memo[{idx,sum}];\n        return memo[{idx,sum}] = dfs(...) + dfs(...);\n        로직은 그대로. 같은 질문에 두 번 답하지 않을 뿐.\n        (idx, sum) 조합이 20 x 2001 = 4만 가지뿐이라 계산도 최대 4만 번.\n\n    (4) memo 를 격자로 그리면 표\n        세로 idx, 가로 sum. dfs 는 필요한 칸만 채우는데,\n        끝(idx = n)에서부터 거꾸로 모든 칸을 순서대로 채우면 재귀가 필요 없다.\n        for (idx = n-1; idx >= 0; idx--)\n            for (sum = -1000; sum <= 1000; sum++)\n                dp[idx][sum] = dp[idx+1][sum + nums[idx]] + dp[idx+1][sum - nums[idx]];\n\n    (5) 두 번째 인자를 sum 에서 p 로 ⭐️\n        dp[idx][sum] = dp[idx+1][sum + num] + dp[idx+1][sum - num]      (4)\n                ↓ sum(부호 합) 대신 p(P 무더기 합) 를 적는다\n        dp[idx][p]   = dp[idx+1][p + num]   + dp[idx+1][p]              (5)\n                       (P 에 넣음)            (N 에 넣음. p 그대로)\n        바뀐 건 오른쪽 가지 하나. sum - num 이 p 로.\n        나무 모양은 그대로, 칸의 숫자만 바뀜. sum = 2p - (앞까지 합) 이라 같은 정보.\n        음수가 사라짐. p 는 0 에서 올라가기만 한다.\n\n    (5') 앞에서부터 세도 같다 ⭐️\n        부분집합 개수는 순서 무관이라 idx 를 0 부터 올려도 답이 같다.\n        dp[idx][p] = dp[idx+1][p + num] + dp[idx+1][p]                  (5)  뒤에서부터\n                ↓ 방향 뒤집기. j = \"앞 k 개로 만든 합\"\n        dp[k][j]   = dp[k-1][j - num]   + dp[k-1][j]                    (5') 앞에서부터\n                     (씀)                 (안 씀)\n\n    "md": "## Q1: Asynchronous와 Parallel의 차이는?\n\n| | Async | Parallel |\n|---|---|---|\n| 핵심 | 기다리지 않고 다른 일을 함 | 동시에 여러 일을 실행 |\n| 스레드 | 단일 스레드도 가능 | 반드시 멀티 스레드/코어 |\n| 목적 | I/O 대기 시간 활용 | CPU 연산 분산 |\n| 예시 | JS async/await, Python asyncio | OpenMP, std::thread |\n\n비유:\n- **Async**: 커피 주문하고 자리 가서 책 읽다가, 진동벨 울리면 커피 받으러 감\n- **Parallel**: 바리스타 3명이 동시에 커피 3잔 만듦\n\n---\n\n## Q2: Concurrency vs Parallelism?\n\n- **Concurrency (동시성)**: 여러 작업을 번갈아가며 진행. 논리적으로 동시. 단일 코어에서도 가능.\n- **Parallelism (병렬성)**: 여러 작업을 물리적으로 동시 실행. 멀티 코어 필요.\n\n```\nConcurrency (1 core):   [A][B][A][B][A][B]  (시분할)\nParallelism (2 cores):  [AAAA]\n                        [BBBB]  (진짜 동시)\n```\n\nConcurrency ⊃ Parallelism. 병렬은 동시성의 한 형태.\n\n---\n\n## Q3: I/O-bound vs CPU-bound에서의 선택?\n\n**I/O-bound** (네트워크, 디스크, DB):\n- Async가 효율적 → 대기 시간에 다른 요청 처리\n- 스레드 적게 써도 높은 throughput\n- 예: Node.js (싱글 스레드 + 이벤트 루프)로 수만 동시 연결 처리\n\n**CPU-bound** (연산, 이미지 처리, ML):\n- Parallel이 필요 → 실제로 CPU를 더 쓰려면 멀티코어 활용\n- Async는 의미 없음 (기다리는 시간이 없으니까)\n- 예: 4코어에서 4스레드로 행렬 곱셈\n\n---\n\n## Follow-up: Event loop란?\n\n```\nwhile (true) {\n    events = poll();  // I/O 완료된 이벤트 확인\n    for (event in events) {\n        handle(event);  // 콜백 실행\n    }\n}\n```\n\n단일 스레드가 이벤트를 순회하며 처리. 블로킹 없이 I/O 완료를 감지.\nNode.js, Python asyncio, Nginx의 핵심 아키텍처.\n",

   "md": "## Q1: 멀티스레드 환경에서 deadlock 예시?\n\n```cpp\nstd::mutex m1, m2;\n\n// Thread A               // Thread B\nm1.lock();                m2.lock();\n// ... work ...            // ... work ...\nm2.lock();  // 대기        m1.lock();  // 대기\n// → Deadlock!\n```\n\nThread A는 m2를 기다리고, Thread B는 m1을 기다림 → 원형 대기.\n\n---\n\n## Q2: 코드 레벨에서 deadlock 방지법?\n\n**1. Lock ordering (가장 실용적):**\n```cpp\n// 항상 m1 먼저, m2 나중\nvoid threadA() { lock(m1); lock(m2); }\nvoid threadB() { lock(m1); lock(m2); }  // 같은 순서!\n```\n\n**2. std::lock (C++):**\n```cpp\nstd::lock(m1, m2);  // 둘 다 한번에 잡거나, 둘 다 안 잡음\nstd::lock_guard<std::mutex> lg1(m1, std::adopt_lock);\nstd::lock_guard<std::mutex> lg2(m2, std::adopt_lock);\n```\n\n**3. Try-Lock with timeout:**\n```cpp\nif (m1.try_lock_for(100ms)) {\n    if (m2.try_lock_for(100ms)) {\n        // 성공\n    } else {\n        m1.unlock();  // 롤백\n    }\n}\n```\n\n---\n\n## Q3: Java/Python에서는?\n\n**Java:**\n```java\nsynchronized(obj1) {\n    synchronized(obj2) { }  // nested lock → deadlock 위험\n}\n// 해결: ReentrantLock + tryLock(timeout)\n```\n\n**Python (GIL 있는데 deadlock 가능?):**\n- GIL은 CPU-bound 작업에서만 보호\n- I/O 작업 중엔 GIL 해제 → 여전히 lock 순서 문제 발생 가능\n- threading.Lock 여러 개 사용 시 deadlock 가능\n\n---\n\n## Follow-up: Deadlock detection 도구?\n\n- **Java**: `jstack` (thread dump), JConsole\n- **C++**: ThreadSanitizer (`-fsanitize=thread`)\n- **DB**: PostgreSQL `pg_locks` 뷰, MySQL `SHOW ENGINE INNODB STATUS`\n- **일반**: Resource allocation graph 그려보기\n",

   "md": "## Q1: Producer-Consumer 문제란?\n\n공유 버퍼를 두고:\n- **Producer**: 데이터를 생성해서 버퍼에 넣음\n- **Consumer**: 버퍼에서 데이터를 꺼내 처리\n\n문제:\n- 버퍼 가득 찼을 때 producer는 대기해야 함\n- 버퍼 비었을 때 consumer는 대기해야 함\n- 동시 접근 시 race condition 방지 필요\n\n---\n\n## Q2: C++로 구현하면?\n\n```cpp\n#include <queue>\n#include <mutex>\n#include <condition_variable>\n\nstd::queue<int> buffer;\nconst int MAX_SIZE = 10;\nstd::mutex mtx;\nstd::condition_variable cv_full, cv_empty;\n\nvoid producer(int item) {\n    std::unique_lock<std::mutex> lock(mtx);\n    cv_full.wait(lock, [] { return buffer.size() < MAX_SIZE; });\n    buffer.push(item);\n    cv_empty.notify_one();\n}\n\nint consumer() {\n    std::unique_lock<std::mutex> lock(mtx);\n    cv_empty.wait(lock, [] { return !buffer.empty(); });\n    int item = buffer.front();\n    buffer.pop();\n    cv_full.notify_one();\n    return item;\n}\n```\n\n핵심: mutex (상호배제) + condition_variable (대기/신호).\n\n---\n\n## Q3: Condition variable은 왜 필요한가요? busy-wait와의 차이?\n\n**Busy-wait (polling):**\n```cpp\nwhile (buffer.empty()) { }  // CPU 100% 소모하며 대기\n```\n\n**Condition variable:**\n```cpp\ncv.wait(lock, predicate);  // OS가 스레드를 sleep시킴, 깨워줄 때까지 CPU 안 씀\n```\n\n차이: busy-wait는 CPU 낭비. CV는 스레드를 블록시키고 신호 받으면 깨움.\n\n### 튜터링 메모 (헷갈렸던 핵심)\n\n- **busy-wait(polling) vs blocking**: polling은 `while`로 계속 확인(=CPU 낭비). sleep(N초)로 확인해도 낭비거나 늦음. blocking은 조건 될 때까지 완전히 잠(CPU 0%).\n- **CV는 timer가 아니라 event(신호) 기반**. `wait()`는 몇 초 아니라 \"깨워질 때까지\" 무기한 잠.\n- **감시자(watcher)는 없다**: 자는 스레드는 CV의 wait queue에 담겨 CPU에서 내려감, 즐히하여 지켜보는 주체가 없음. 깨우는 건 **notify()**를 호출하는 스레드가 직접 프로듀서 → OS가 큐에서 하나 꺼내 runnable로. (초인종 비유: 대기자가 감시자 없이, 벨을 눌러 사람이 직접 깨움)\n- **wait()은 mutex를 자동으로 놓고 잠**. 안 놓으면 상대가 buffer 못 건드려 영원 못 깨남 → deadlock. 깨날 때 mutex 다시 잡고 나옴.\n- **조건 확인은 `if`가 아니라 `while`**: 깨나도 조건 여전히 안 맞을 수 있음(다른 consumer가 먼저 채감 / spurious wakeup). C++ `cv.wait(lock, predicate)`는 내부적으로 while+predicate 이걸 처리해줌.\n\n---\n\n## Follow-up: 실제 어디서 쓰이나요?\n\n- **메시지 큐** (Kafka, RabbitMQ) - producer가 메시지 발행, consumer가 구독\n- **스레드 풀** - task queue에 작업 넣으면 worker thread가 꺼내 실행\n- **I/O 버퍼** - 네트워크에서 받은 데이터를 버퍼에 쌓고 처리 스레드가 소비\n- **파이프라인** - 영상 인코딩 (읽기 → 디코딩 → 인코딩 → 쓰기)\n",

   "md": "## Q1: Race condition이 뭔가요?\n\n두 개 이상의 스레드/프로세스가 공유 자원에 동시에 접근할 때, 실행 순서에 따라 결과가 달라지는 상황.\n\n예: 두 스레드가 `counter++` 실행\n```\nThread A: read counter (0)\nThread B: read counter (0)\nThread A: write counter (1)\nThread B: write counter (1)  ← 기대값 2인데 결과는 1\n```\n\n`counter++`가 atomic하지 않기 때문. (read → increment → write 3단계)\n\n---\n\n## Q2: Race condition을 어떻게 해결하나요?\n\n1. **Mutex (Mutual Exclusion)** - lock 잡은 스레드만 critical section 진입. 나머지는 대기.\n2. **Semaphore** - 카운터 기반. N개까지 동시 접근 허용.\n3. **Atomic operation** - `std::atomic<int>` 같이 하드웨어 레벨에서 원자적 실행 보장.\n4. **Lock-free 자료구조** - CAS(Compare-And-Swap) 기반으로 lock 없이 동시성 처리.\n\n---\n\n## Q3: Mutex와 Semaphore 차이는?\n\n| | Mutex | Semaphore |\n|---|---|---|\n| 동시 접근 수 | 1 (binary) | N (counting) |\n| 소유권 | Lock한 스레드만 unlock 가능 | 누구나 signal 가능 |\n| 용도 | 상호 배제 | 리소스 카운팅, 신호 전달 |\n\nMutex는 \"화장실 열쇠\" (1명만 사용), Semaphore는 \"주차장 빈 자리 수\".\n\n---\n\n## Follow-up: C++에서 race condition 방지 코드 예시?\n\n```cpp\n#include <mutex>\n\nstd::mutex mtx;\nint counter = 0;\n\nvoid increment() {\n    std::lock_guard<std::mutex> lock(mtx);\n    counter++;  // critical section\n}\n```\n\n`lock_guard`는 스코프 벗어나면 자동 unlock (RAII 패턴).\n",

   "md": "## Q1: Reader-Writer 문제란?\n\n공유 자원에 대해:\n- **Reader**: 동시에 여러 명이 읽어도 OK (읽기는 충돌 안 함)\n- **Writer**: 쓸 때는 혼자만 접근 (읽기도 차단)\n\n단순 mutex로 하면? 읽기끼리도 blocking → 불필요한 성능 저하.\n→ 읽기는 동시 허용하되, 쓰기만 배타적으로 하고 싶음.\n\n⚠️ 헷갈렸던 지점: **일반 mutex는 \"틀린\" 게 아니라 \"느린\" 것.**\n정확성은 완벽함 (writer가 reader를 막는 건 원래 맞는 동작).\n문제는 안 막아도 되는 reader-reader까지 직렬화한다는 것 — 읽기끼리는 아무도 값을 안 바꾸니 애초에 충돌하지 않음.\n\n| | Reader | Writer |\n|---|--------|--------|\n| **Reader** | 동시 OK | 배타 |\n| **Writer** | 배타 | 배타 |\n\n4칸 중 동시 허용 가능한 건 1칸뿐인데, 일반 mutex는 그 1칸마저 막음. 그 1칸을 되찾는 게 RW lock.\n단, 쓰기가 잦으면 reader 카운트 관리 비용 때문에 그냥 mutex가 나을 수도 있음.\n\n---\n\n## Q2: C++에서 어떻게 구현?\n\n```cpp\n#include <shared_mutex>\n\nstd::shared_mutex rw_mutex;\nint data = 0;\n\nvoid reader() {\n    std::shared_lock<std::shared_mutex> lock(rw_mutex);\n    // 여러 reader 동시 접근 가능\n    std::cout << data;\n}\n\nvoid writer(int val) {\n    std::unique_lock<std::shared_mutex> lock(rw_mutex);\n    // writer는 단독 접근\n    data = val;\n}\n```\n\n- `shared_lock`: 읽기 잠금 (여러 개 동시 OK)\n- `unique_lock`: 쓰기 잠금 (하나만)\n\n---\n\n## Q3: Starvation 문제는?\n\n**Reader-preference**: reader가 계속 들어오면 writer가 영원히 대기\n**Writer-preference**: writer 대기 중이면 새 reader 차단\n\n해결: fairness policy. 대기 순서대로 처리하거나, writer에게 우선순위.\n\n⚠️ 헷갈렸던 지점: **굶는 쪽은 reader가 아니라 writer.**\nreader들은 다 잘 통과함 — 아무도 안 굶음. writer 혼자 못 들어감.\n이유: writer는 \"reader 수 == 0\"일 때만 진입 가능한데,\nreader들이 겹쳐서 계속 도착하면 그 카운트가 0을 찍는 순간이 안 옴.\n\n```\nR1 ─────────\n   R2 ─────────\n      R3 ─────────     reader 수가 0이 되질 않음\nW  ..대기..대기..대기..  ← 영원히 진입 실패\n```\n\nwriter-preference가 이걸 푸는 방식: writer가 큐에 들어오면 **새 reader를 막음**\n→ 진행 중인 reader만 끝나면 카운트가 0을 찍음.\n\n⚠️ 주의: **C++ 표준은 shared_mutex의 우선순위 정책을 규정하지 않음** (구현체 재량).\n특히 리눅스의 libstdc++는 pthread_rwlock 기반인데 glibc 기본값이 reader-preference라,\n`shared_mutex`를 쓴다고 writer starvation이 자동 해결되지 않음.\n보장이 필요하면 명시적으로 writer-preference 락을 쓰거나 직접 구현해야 함.\n\n---\n\n## Follow-up: 실제 어디서 쓰이나요?\n\n- **DB 락**: SELECT는 shared lock, UPDATE는 exclusive lock\n- **캐시**: 읽기 빈번, 갱신은 가끔\n- **설정 파일**: 여러 스레드가 읽지만 hot reload 시에만 쓰기\n- **RWLock in Java**: `ReadWriteLock` 인터페이스\n",

   "md": "## Q1: Thread pool이란? 왜 쓰나요?\n\n미리 생성해둔 스레드 집합. 작업이 들어오면 유휴 스레드에 할당.\n\n```\n[Task Queue] → [Thread 1] (busy)\n             → [Thread 2] (idle) ← 새 작업 할당\n             → [Thread 3] (busy)\n```\n\n왜?\n- **스레드 생성/소멸 비용 절감** - 매 요청마다 생성하면 오버헤드 큼\n- **자원 제한** - 무한정 스레드 생성 방지 (메모리, context switch)\n- **응답 시간 향상** - 이미 만들어져 있으니 바로 실행\n\n---\n\n## Q2: Thread pool 크기는 어떻게 정하나요?\n\n**CPU-bound 작업:**\n- 스레드 수 ≈ CPU 코어 수\n- 그 이상은 context switch만 늘어남\n\n**I/O-bound 작업:**\n- 스레드 수 > 코어 수 (I/O 대기 중 다른 스레드 실행)\n- 경험적 공식: `threads = cores * (1 + wait_time / compute_time)`\n\n**실무:**\n- 웹서버: 보통 수백 스레드 (대부분 I/O 대기)\n- 연산 서버: 코어 수와 동일\n\n---\n\n## Q3: C++에서의 간단한 thread pool?\n\n```cpp\nclass ThreadPool {\n    std::vector<std::thread> workers;              // 미리 만들어둘 worker 스레드들\n    std::queue<std::function<void()>> tasks;       // 공유 버퍼. producer 가 넣고 consumer 가 꺼냄\n    std::mutex mtx;                                // tasks 를 보호하는 자물쇠\n    std::condition_variable cv;                    // \"일 들어왔다\" 를 알리는 신호\n    bool stop = false;                             // 종료 플래그\n\npublic:\n    ThreadPool(int n) {\n        for (int i = 0; i < n; i++) {\n            // emplace_back 이 벡터 안에서 스레드를 바로 생성한다.\n            // [this] 로 캡처해야 람다 안에서 tasks/mtx/cv 같은 멤버를 쓸 수 있다.\n            workers.emplace_back([this] {\n                while (true) {                     // worker 는 죽을 때까지 이 루프를 돈다\n                    std::function<void()> task;    // 꺼낸 작업을 담을 자리. 락 밖에서도 쓰려고 여기 선언\n                    {                              // ── 락 구간 시작 ──\n                        std::unique_lock<std::mutex> lock(mtx);\n\n                        // 조건이 거짓이면 락을 놓고 잠든다.\n                        // 놓는 게 핵심. 안 놓으면 enqueue 가 락을 못 잡아 영원히 안 깨어남.\n                        // 깨어나면 락을 다시 잡고 조건을 재확인한다.\n                        cv.wait(lock, [this] { return stop || !tasks.empty(); });\n\n                        // 종료 신호가 왔고 남은 일도 없을 때만 빠져나간다.\n                        // stop 만 보고 나가면 큐에 남은 작업이 버려진다.\n                        if (stop && tasks.empty()) return;\n\n                        task = std::move(tasks.front());   // 복사 대신 이동\n                        tasks.pop();\n                    }                              // ── 락 해제 ──\n\n                    // ★ 작업 실행은 반드시 락 밖에서.\n                    // 락 안에서 돌리면 worker 가 몇 개든 한 번에 하나씩만 실행돼\n                    // 스레드 풀의 의미가 사라진다. 큐를 만질 때만 락이 필요하다.\n                    task();\n                }\n            });\n        }\n    }\n\n    ~ThreadPool() {\n        {\n            std::lock_guard<std::mutex> lock(mtx);\n            stop = true;                    // 종료 플래그 세우고\n        }\n        cv.notify_all();                    // 자고 있는 worker 를 전부 깨운다. one 이 아니라 all\n        for (auto& w : workers) w.join();   // 다 끝날 때까지 기다린다\n    }\n\n    void enqueue(std::function<void()> task) {\n        {                                          // 큐에 넣는 동안만 잠근다\n            std::lock_guard<std::mutex> lock(mtx);\n            tasks.push(std::move(task));\n        }                                          // ← 여기서 락 해제\n        // 락을 푼 뒤에 깨운다.\n        // 잡은 채로 깨우면 깨어난 worker 가 락을 못 잡고 다시 잠들어 한 번 헛돈다.\n        cv.notify_one();\n    }\n};\n```\n\n### 락은 언제 잡히고 언제 풀리나\n\n```\nworker 쪽\n    unique_lock 생성          ->  잡음\n    cv.wait 진입, 조건 거짓    ->  놓음. 자는 동안 계속 놓은 상태   ★\n    깨어남                    ->  다시 잡음. 조건 재확인\n        조건이 거짓           ->  다시 놓고 잠 (while 이라 반복)\n        조건이 참             ->  잡은 채로 wait 를 빠져나옴\n    tasks.front(), pop()      ->  잡은 상태로 큐를 만짐\n    스코프 } 끝               ->  놓음\n    task() 실행               ->  놓은 상태. 작업이 몇 초 걸리든 무관\n\nenqueue 쪽\n    lock_guard 생성           ->  잡음\n    tasks.push                ->  잡은 상태\n    스코프 } 끝               ->  놓음\n    cv.notify_one             ->  놓은 뒤에 깨움\n```\n\n요약: 락은 tasks 큐를 읽고 쓰는 순간에만 잡힌다.\n자는 동안과 작업을 실행하는 동안은 놓는다.\n\n`if` 가 아니라 `while` 로 반복 확인하는 이유는 두 가지다.\n하나, 작업 1개에 worker 여럿이 깨어나면 먼저 잡은 하나만 가져가고 나머지는 빈 큐를 보게 된다.\n둘, 아무도 깨우지 않았는데 OS 가 깨우는 spurious wakeup 이 표준상 허용된다.\n그래서 깨어났다고 조건이 참이라고 믿으면 안 된다.\n\n원래 노트의 코드에는 소멸자가 없었다.\n`stop` 을 true 로 만드는 곳이 없고 join 도 안 하면, ThreadPool 이 파괴될 때\njoin/detach 안 된 스레드 때문에 `std::terminate` 로 프로그램이 죽는다.\n종료는 모두에게 알려야 하므로 `notify_one` 이 아니라 `notify_all` 이다.\n\n본질: Producer-Consumer 패턴 + 미리 생성된 worker threads.\n\n---\n\n## Follow-up: 다른 언어에서는?\n\n- **Java**: `ExecutorService`, `ThreadPoolExecutor`\n- **Python**: `concurrent.futures.ThreadPoolExecutor`\n- **Go**: goroutine + channel (언어 레벨에서 경량 스레드 지원)\n",

   "md": "> 🔏 트랜잭션은 산성(ACID)이다 - 강력하게 데이터를 보호한다!\n\n## Q1: ACID가 뭔지 각각 설명해보세요.\n\n- **Atomicity** - 트랜잭션은 전부 성공하거나 전부 실패. 중간 상태 없음. (은행 이체: 출금 + 입금 둘 다 되거나 둘 다 안 되거나)\n- **Consistency** - 트랜잭션 전후로 DB가 항상 valid한 상태 유지. 정의된 제약조건(FK, unique 등) 위반 불가.\n- **Isolation** - 동시에 실행되는 트랜잭션들이 서로 간섭 안 함. 각각 혼자 실행되는 것처럼 보임.\n- **Durability** - commit된 트랜잭션은 시스템 장애와도 유지됨. (디스크에 write + WAL)\n\n---\n\n## Q2: Isolation Level 4가지를 설명해보세요.\n\n상황: 내 계좌에 100만원. 트랜잭션 A가 읽는 중에, 트랜잭션 B가 50만원 입금.\n\n**Read Uncommitted:**\n- B가 commit 하기도 전에 A가 150만원으로 읽음\n- B가 rollback하면? A는 존재하지 않는 150만원을 본 거 (dirty read)\n- 사실상 안 쓰임\n\n**Read Committed:**\n- A가 처음 읽으면 100만원\n- B가 50만원 입금하고 commit\n- A가 다시 읽으면 150만원 - \"어? 아까 100만원이었는데?\" (non-repeatable read)\n\n**Repeatable Read:**\n- A가 처음 읽으면 100만원\n- B가 commit하든 말든, A가 다시 읽어도 100만원 (스냅샷 고정)\n- 근데 B가 새 계좌를 INSERT하면 그건 보일 수 있음 (phantom read)\n\n**Serializable:**\n- A가 끝날 때까지 B는 아예 대기, A 입장에선 세상이 안 변함\n- 가장 안전하지만 가장 느림\n\n> 위로 갈수록 빠르지만 위험, 아래로 갈수록 안전하지만 느림.\n\n| Level | Dirty Read | Non-repeatable Read | Phantom Read |\n|-------|-----------|---------------------|--------------|\n| Read Uncommitted | O | O | O |\n| Read Committed | X | O | O |\n| Repeatable Read | X | X | O |\n| Serializable | X | X | X |\n\n실무: Read Committed (PostgreSQL default) 또는 Repeatable Read (MySQL InnoDB default).\n\n실무에서는 보통 Read Committed (PostgreSQL default) 또는 Repeatable Read (MySQL InnoDB default) 사용.\n\n---\n\n## Q3: Atomicity는 실제로 어떻게 구현되나요?\n\n**WAL (Write-Ahead Logging):**\n1. 변경 사항을 먼저 로그에 기록\n2. 그 다음에 실제 데이터 변경\n3. Crash 발생 시 로그를 보고 undo (rollback) 또는 redo (재적용)\n\n---\n\n## Follow-up: NoSQL은 ACID를 포기하나요?\n\n전부는 아님.\n- MongoDB 4.0+: multi-document ACID 지원\n- DynamoDB: 단일 item은 ACID, cross-item은 eventual consistency (Transactions API로 가능)\n- 대부분 NoSQL은 CAP theorem에서 A+P를 선택 → C(consistency)를 완화\n",

   "md": "## Q1: DB 인덱스란? 왜 쓰나요?\n\n테이블의 검색 속도를 올리기 위한 자료구조. 책의 목차와 같음.\n\n- 인덱스 없이: full table scan → O(n)\n- 인덱스 있으면: B-tree 탐색 → O(log n)\n\ntrade-off: 읽기 빨라지지만, 쓰기 시 인덱스 갱신 비용 추가 + 저장 공간 사용.\n\n---\n\n## Q2: B-tree 인덱스 vs Hash 인덱스?\n\n| | B-tree | Hash |\n|---|--------|------|\n| 구조 | 균형 트리 | 해시 테이블 |\n| 범위 검색 | O (>, <, BETWEEN) | X (= 만 가능) |\n| 정렬 | O (ORDER BY 활용) | X |\n| 등가 검색 | O(log n) | O(1) |\n| 용도 | 대부분의 경우 (기본값) | 정확한 값 매칭만 필요할 때 |\n\n대부분의 DB는 B-tree가 기본. Hash는 특수한 경우에만.\n\n---\n\n## Q3: 인덱스를 언제 만들어야 하나요?\n\n**만들어야 할 때:**\n- WHERE 절에 자주 쓰이는 컬럼\n- JOIN 조건 컬럼\n- ORDER BY, GROUP BY 대상 컬럼\n- Cardinality가 높은 컬럼 (값의 종류가 다양)\n\n**만들면 안 되는 경우:**\n- 테이블이 작을 때 (full scan이 오히려 빠름)\n- 쓰기가 매우 빈번한 테이블\n- Cardinality가 낮은 컬럼 (성별처럼 값이 2~3개)\n\n---\n\n## Follow-up: Composite index (복합 인덱스)란?\n\n여러 컬럼을 합쳐서 하나의 인덱스로.\n\n```sql\nCREATE INDEX idx ON orders(user_id, created_at);\n```\n\n**Leftmost prefix rule**: (user_id)만 조건이어도 사용 가능. 하지만 (created_at)만 있으면 사용 불가.\n- `WHERE user_id = 1 AND created_at > ...` → 사용 O\n- `WHERE user_id = 1` → 사용 O\n- `WHERE created_at > ...` → 사용 X (앞 컬럼 생략)\n",

   "md": "## Q1: JOIN 종류와 차이를 설명해보세요.\n\n```\nTable A                Table B\n| id | name |          | id | dept  |\n| 1  | Kim  |          | 1  | Eng   |\n| 2  | Lee  |          | 3  | Sales |\n| 3  | Park |          |    |       |\n```\n\n| JOIN | 결과 | 설명 |\n|------|------|------|\n| INNER JOIN | Kim-Eng, Park-Sales (매칭만) | 양쪽 다 있는 것만 |\n| LEFT JOIN | Kim-Eng, Lee-NULL, Park-Sales | 왼쪽 전부 + 오른쪽 매칭 |\n| RIGHT JOIN | Kim-Eng, Park-Sales, NULL-Sales(id=3) | 오른쪽 전부 + 왼쪽 매칭 |\n| FULL OUTER JOIN | 양쪽 전부 (매칭 없으면 NULL) | 합집합 |\n| CROSS JOIN | 모든 조합 (3x2 = 6행) | 카르테시안 곱 |\n\n### 정식 결과 표 (JOIN 조건: A.id = B.id)\n\n**INNER JOIN - 양쪽 다 있는 것만 (교집합)**\n\n| A.id | A.name | B.id | B.dept |\n|------|--------|------|--------|\n| 1 | Kim | 1 | Eng |\n| 3 | Park | 3 | Sales |\n\n**LEFT JOIN - 왼쪽(A) 전부 + 오른쪽 매칭 (없으면 NULL)**\n\n| A.id | A.name | B.id | B.dept |\n|------|--------|------|--------|\n| 1 | Kim | 1 | Eng |\n| 2 | Lee | NULL | NULL |\n| 3 | Park | 3 | Sales |\n\n**RIGHT JOIN - 오른쪽(B) 전부 + 왼쪽 매칭 (없으면 NULL)**\n이 예시에선 B의 모든 id가 A에도 있어서 INNER JOIN이랑 결과 동일.\n만약 B에 id=5가 있었다면 `NULL-NULL-5-...` 행이 추가.\n\n**FULL OUTER JOIN - 양쪽 전부 (매칭 없으면 NULL)**\n이 예시에선 LEFT JOIN이랑 결과 동일 (B에 A에 없는 행이 없어서).\n\n**CROSS JOIN - 카르테시안 곱 (3 x 2 = 6행)**\n\n| A.id | A.name | B.id | B.dept |\n|------|--------|------|--------|\n| 1 | Kim | 1 | Eng |\n| 1 | Kim | 3 | Sales |\n| 2 | Lee | 1 | Eng |\n| 2 | Lee | 3 | Sales |\n| 3 | Park | 1 | Eng |\n| 3 | Park | 3 | Sales |\n\n### 벤 다이어그램 감\n\n- **INNER** = A ∩ B (교집합)\n- **LEFT** = A 전체 + (A ∩ B)\n- **RIGHT** = B 전체 + (A ∩ B)\n- **FULL** = A ∪ B (합집합)\n- **CROSS** = A x B (모든 조합, 조건 없음)\n\n---\n\n## Q2: INNER JOIN vs LEFT JOIN 언제 쓰나요?\n\n**INNER JOIN:**\n- 양쪽 다 데이터 있을 때만 의미있는 경우\n- 예: 주문 + 상품 (상품 없는 주문은 의미 없음)\n\n**LEFT JOIN:**\n- 왼쪽 테이블 기준으로 전부 보고 싶을 때\n- 예: 모든 고객 + 주문 (주문 없는 고객도 보고 싶음)\n\n---\n\n## Q3: JOIN 성능 최적화?\n\n1. **인덱스** - JOIN 조건 컬럼에 인덱스 필수\n2. **작은 테이블을 driving table로** - 옵티마이저가 보통 알아서 함\n3. **필요한 컬럼만 SELECT** - 불필요한 데이터 전송 줄임\n4. **WHERE 조건 먼저** - JOIN 전에 필터링하면 대상 row 줄어듦\n\n### 4가지 상세 설명\n\n**1. 인덱스 (JOIN 컬럼에 필수)**\n- JOIN은 \"A의 각 행에 대해 B에서 매칭 찾기\"\n- 인덱스 없으면 매빈 B를 처음부터 훑음 (O(N²))\n- 인덱스 있으면 B.id로 즉시 점프 (O(N log N))\n\n```\n10만 x 10만 = 100억 비교 → 10만 x log(10만) ≈ 200만 비교 (500배 빠름)\n```\n\n**2. Driving table (바깥 루프로 훑는 테이블) = 작은 걸로**\n- JOIN 흐름: `for each row in driving: find match in other`\n- 바깥 루프가 작을수록 반복 횟수 줄어듦\n\n```\n100행 driving → 100 x log(10만) = 1,700\n10만행 driving → 10만 x log(100) = 66만 (약 400배 느림)\n```\n\n- 실무: DB 옵티마이저가 통계로 알아서 결정 (개념 감만 알면 됨)\n\n**3. 필요한 컬럼만 SELECT (SELECT * 지양)**\n- `SELECT *` = 모든 컬럼을 메모리에 올리고 네트워크로 전송\n- 컬럼 100개 중 실제 쓰는 건 2~3개면 낭비\n\n```sql\n-- 나쁨: SELECT * FROM A JOIN B ON A.id = B.id;\n-- 좋음: SELECT A.name, B.dept FROM A JOIN B ON A.id = B.id;\n```\n\n**4. WHERE 조건 먼저 (JOIN 전에 필터링)**\n- JOIN 대상 자체를 줄이면 JOIN 작업이 작아짐\n\n```sql\n-- 나쁨: 전부 JOIN 후 필터\nSELECT * FROM orders o JOIN users u ON o.user_id = u.id\nWHERE o.created_at > '2026-07-01';\n-- → 10만 x 10만 JOIN 다 하고 1000행만 남김\n\n-- 좋음: 필터 먼저 후 JOIN\nSELECT * FROM (SELECT * FROM orders WHERE created_at > '2026-07-01') o\nJOIN users u ON o.user_id = u.id;\n-- → 1000 x 10만 JOIN (훨씬 작음)\n```\n\n- 실무: 좋은 옵티마이저는 자동으로 WHERE를 앞으로 당김(predicate pushdown)\n\n**공통 원리:** \"JOIN 작업의 크기를 줄이자\"\n- 인덱스로 검색 빠르게\n- Driving 작게\n- 컬럼 줄이기\n- 필터 먼저 → JOIN 대상 줄이기\n\n시험/면접 단골 = **인덱스 + WHERE 먼저**.\n\n---\n\n## Follow-up: Self JOIN이란?\n\n같은 테이블을 자기 자신과 JOIN.\n\n```sql\n-- 같은 부서 동료 찾기\nSELECT a.name, b.name\nFROM employees a\nJOIN employees b ON a.dept_id = b.dept_id\nWHERE a.id != b.id;\n```\n\n용도: 계층 구조 (매니저-부하), 같은 테이블 내 비교.\n",

   "md": "> 2026-09-24 재작성. 정의를 따로 외우지 않고, 아래 테이블 하나를 단계별로 벗겨내며 본다.\n\n## 기준 테이블 — 수강신청\n\n이 파일의 Q1 부터 Follow-up 까지 **전부 이 테이블 하나** 를 놓고 답한다.\n\n| 학생ID | 이름 | 학과 | 학과장 | 과목 | 담당교수 | 학점 |\n|---|---|---|---|---|---|---|\n| 1001 | 김철수 | CS | 박교수 | DB, OS | 이교수 | A |\n| 1002 | 이영희 | EE | 최교수 | 회로 | 정교수 | B |\n\nPK 후보 = `(학생ID, 과목)`\n\n이 테이블은 1NF, 2NF, 3NF 를 **전부** 위반한다.\n하나씩 벗겨낸다.\n\n---\n\n## Q1: 정규화란? 왜 하나요?\n\n데이터 중복을 줄이고 무결성을 높이기 위해 테이블을 분리하는 과정.\n\n위 테이블에서 실제로 뭐가 문제인지 보면:\n\n- **Update anomaly** — CS 학과장이 바뀌면 CS 학생이 적힌 **모든 줄** 을 고쳐야 한다. 하나라도 놓치면 학과장이 두 명이 된다\n- **Insert anomaly** — 아직 수강생이 없는 새 과목은 **넣을 자리가 없다.** PK 가 `(학생ID, 과목)` 이라 학생ID 없이는 행을 못 만든다\n- **Delete anomaly** — 1002 가 수강을 취소하면 **EE 학과장이 최교수** 라는 사실까지 같이 사라진다\n\n중복이 문제인 게 아니라, **중복 때문에 생기는 이 세 가지** 가 문제다.\n\n---\n\n## Q2: 1NF ~ 3NF 를 설명해보세요.\n\n### 1NF — 한 칸에 값 하나 (atomic)\n\n`\"DB, OS\"` 가 한 칸에 들어있다.\n행을 쪼갠다.\n\n| 학생ID | 이름 | 학과 | 학과장 | 과목 | 담당교수 | 학점 |\n|---|---|---|---|---|---|---|\n| 1001 | 김철수 | CS | 박교수 | DB | 이교수 | A |\n| 1001 | 김철수 | CS | 박교수 | OS | 김교수 | B |\n| 1002 | 이영희 | EE | 최교수 | 회로 | 정교수 | B |\n\n이제 `(학생ID, 과목)` 이 PK 로 성립한다.\n대신 김철수의 이름·학과·학과장이 **중복되기 시작한다.** → 2NF 로.\n\n### 2NF — PK 한 칸만 알아도 값이 정해지는 컬럼 빼내기\n\n> 교과서 용어로는 \"부분 함수 종속 제거\".\n\nPK 가 `(학생ID, 과목)` 두 칸이다.\n각 컬럼을 하나씩 짚으면서 **그 값을 알아내려면 무엇이 필요한지** 물어본다.\n\n```\n\"담당교수\" 를 알고 싶다\n    과목이 DB 라는 것만 알면  ->  이교수. 끝.\n    학생이 누구인지는 안 물어봐도 된다\n\n\"학점\" 을 알고 싶다\n    과목이 DB 라는 것만으로는  ->  모른다. 누구의 DB 학점인지 알 수 없다\n    학생ID 가 1001 이라는 것만으로도  ->  모른다. 어느 과목 학점인지 알 수 없다\n    둘 다 있어야  ->  A. 그제서야 정해진다\n```\n\n| 컬럼 | 값을 알려면 필요한 것 | 판정 |\n|---|---|---|\n| 이름, 학과, 학과장 | `학생ID` 만 | 한 칸으로 충분 |\n| 담당교수 | `과목` 만 | 한 칸으로 충분 |\n| 학점 | `학생ID` + `과목` 둘 다 | 두 칸 다 필요 |\n\n**PK 두 칸을 다 물어봐야 답이 나오는 컬럼만 이 테이블에 남긴다.**\n한 칸만 물어봐도 답이 나오면, 그 컬럼은 **그 한 칸이 PK 인 테이블** 로 가야 한다.\n\n**`학점` 만 진짜 수강 정보** 고, 나머지는 각자 자기 테이블로 간다.\n\n**학생** — PK `학생ID`\n\n| 학생ID | 이름 | 학과 | 학과장 |\n|---|---|---|---|\n| 1001 | 김철수 | CS | 박교수 |\n| 1002 | 이영희 | EE | 최교수 |\n\n**과목** — PK `과목`\n\n| 과목 | 담당교수 |\n|---|---|\n| DB | 이교수 |\n| OS | 김교수 |\n| 회로 | 정교수 |\n\n**수강** — PK `(학생ID, 과목)`\n\n| 학생ID | 과목 | 학점 |\n|---|---|---|\n| 1001 | DB | A |\n| 1001 | OS | B |\n| 1002 | 회로 | B |\n\n김철수가 10과목을 들어도 **`학생` 에는 한 줄** 이다.\n개명해도 한 줄만 고치면 된다.\n\n⚠️ **PK 가 두 칸 이상일 때만 나오는 문제다.**\nPK 가 한 칸이면 \"한 칸만 알아도\" 라는 질문 자체가 성립하지 않아서 2NF 는 자동으로 만족된다.\n\n### 3NF — PK 에서 바로 안 나오고 중간에 한 번 들르는 컬럼 빼내기\n\n> 교과서 용어로는 \"이행 함수 종속 제거\".\n\n`학생` 테이블에 아직 남았다.\n같은 질문을 다시 한다 — **학과장을 알려면 무엇이 필요한가.**\n\n```\n학생ID 1001 을 안다\n    -> 학과가 CS 라는 걸 먼저 찾고\n    -> 그 CS 로 학과장이 박교수라는 걸 찾는다\n\n학생ID 에서 바로 안 나온다. 학과를 한 번 들른다.\n```\n\nPK 는 `학생ID` 인데, 학과장은 **PK 가 아닌 컬럼(`학과`)** 을 보고 정해진다.\n그래서 CS 학생이 100명이면 `박교수` 가 100번 적힌다.\n학과장이 바뀌면 100줄을 고쳐야 한다 → Q1 의 Update anomaly.\n\n**학생** — PK `학생ID`\n\n| 학생ID | 이름 | 학과 |\n|---|---|---|\n| 1001 | 김철수 | CS |\n| 1002 | 이영희 | EE |\n\n**학과** — PK `학과`\n\n| 학과 | 학과장 |\n|---|---|\n| CS | 박교수 |\n| EE | 최교수 |\n\n`과목`, `수강` 은 2NF 단계 그대로다.\n이제 학과장 교체는 `학과` 한 줄만 고치면 끝난다.\n\n### 최종 — 테이블 4개\n\n```\n학생(학생ID, 이름, 학과)          FK: 학과 -> 학과.학과\n학과(학과, 학과장)\n과목(과목, 담당교수)\n수강(학생ID, 과목, 학점)          FK: 학생ID -> 학생.학생ID,  과목 -> 과목.과목\n```\n\n### 세 줄 요약\n\n```\n1NF   한 칸에 값 하나        \"DB, OS\" 를 쪼갠다\n2NF   PK 두 칸이 다 필요한가  한 칸만 알아도 정해지는 컬럼을 뺀다  (복합 PK 일 때만)\n3NF   PK 에서 바로 나오는가   중간에 다른 컬럼을 들르는 컬럼을 뺀다\n```\n\n**2NF 와 3NF 는 같은 질문을 두 번 하는 것이다.** ⭐️\n질문은 하나 — **\"이 컬럼 값을 알려면 무엇이 필요한가.\"**\n\n- 답이 **PK 한 칸** 이면 → 2NF 위반\n- 답이 **PK 가 아닌 다른 컬럼** 이면 → 3NF 위반\n- 답이 **PK 전체** 여야만 제자리\n\n### 그럼 2NF 와 3NF 는 뭐가 다른가\n\n거의 같다. 차이는 하나뿐이다 — **답으로 나온 게 PK 안에 있느냐.**\n\n```\n2NF 위반   학과장을 알려면?  ->  학생ID      <- PK 의 일부\n3NF 위반   학과장을 알려면?  ->  학과        <- PK 가 아님\n```\n\n실제로 `학과장` 은 **두 단계에 모두 걸린다.**\n\n| 시점 | 테이블 | PK | `학과장` 을 알려면 | 판정 |\n|---|---|---|---|---|\n| 1NF 직후 | 수강신청 | `(학생ID, 과목)` | `학생ID` | PK 의 **일부** → 2NF 위반 |\n| 2NF 직후 | 학생 | `학생ID` | `학과` | PK 가 **아님** → 3NF 위반 |\n\n2NF 로 한 번 떼어냈더니, 이번엔 PK 가 아닌 `학과` 로 정해져서 또 걸렸다.\n\n> **2NF 는 PK 를 덜 쓰는 컬럼을 잡고, 3NF 는 PK 를 안 쓰는 컬럼을 잡는다.**\n\n---\n\n## Q3: 비정규화(Denormalization)는 언제 하나요?\n\n위에서 테이블 하나가 **4개** 가 됐다.\n\n```\n학생(학생ID, 이름, 학과)\n학과(학과, 학과장)\n과목(과목, 담당교수)\n수강(학생ID, 과목, 학점)\n```\n\n이제 성적표 한 장을 뽑으려면 **JOIN 3번** 이다.\n읽기가 쓰기보다 훨씬 많은 시스템이면 이 비용이 매번 붙는다.\n\n그래서 의도적으로 중복을 되돌린다.\n예를 들어 `수강` 에 `이름` 과 `담당교수` 를 복사해두면 JOIN 없이 바로 뽑힌다.\n\n**언제 쓰나:**\n- 읽기 >> 쓰기 (분석, 대시보드, 리포트)\n- 자주 함께 조회되는 데이터\n- 캐시 테이블, materialized view\n\n**대가:** Q1 의 anomaly 가 그대로 돌아온다.\n이름이 바뀌면 `학생` 과 `수강` 두 곳을 고쳐야 하고, 하나라도 놓치면 불일치가 생긴다.\n\n정규화는 **쓰기 안전** 을, 비정규화는 **읽기 속도** 를 산다.\n공짜가 없고 어느 쪽에 비용을 낼지만 고른다.\n\n---\n\n## Follow-up: 면접에서 \"이 스키마 정규화해보세요\" 나오면?\n\n위 테이블을 벗겨낸 순서 그대로 밟으면 된다.\n\n1. **한 칸에 값이 여러 개인가** → 있으면 행을 쪼갠다 (1NF)\n2. **PK 가 두 칸 이상인가** → 맞으면, 한 칸만 알아도 정해지는 컬럼을 찾아 뗀다 (2NF)\n3. **PK 에서 바로 안 나오는 컬럼이 있나** → 중간에 다른 컬럼을 들르면 뗀다 (3NF)\n4. 각 단계에서 분리한 테이블을 **FK 로 연결** 한다\n\n말할 때는 단계 이름보다 **어떤 anomaly 가 사라지는지** 를 같이 붙이면 좋다.\n예: \"학과장을 분리하면 학과장 교체 시 한 줄만 고치면 됩니다.\"\n",

   "md": "> 2026-10-01 재작성. 아래 수강 DB 하나를 서버 늘려가며 본다.\n\n## 기준 — 수강 DB 가 커졌다\n\n[normalization.md](normalization.md) 에서 만든 테이블 그대로다.\n\n```\n학생(학생ID, 이름, 학과)      1억 명\n수강(학생ID, 과목, 학점)      30억 행\n```\n\n서버 1대. 디스크 2TB.\n압력 세 개가 동시에 들어온다.\n\n```\n(a) 성적 조회 SELECT     초당 5만 번    학기 내내\n(b) 수강신청 INSERT      초당 3만 번    학기 시작 전 일주일\n(c) 디스크              30억 행이 2TB 를 넘는다\n```\n\n읽기 · 쓰기 · 용량.\n**셋이 다른 압력이라서 해법도 다르다.**\n\n---\n\n## Q1: Replication 과 Sharding 의 차이는?\n\n```\nReplication  같은 걸 여러 벌           Sharding  다른 걸 나눠서\n\n서버1  수강 30억 행   디스크 2TB       서버1  학생ID 1~5000만    15억 행  1TB\n  ↓ 복사                               서버2  학생ID 5000만~1억  15억 행  1TB\n서버2  수강 30억 행   디스크 2TB\n                                       학생ID 1001 은 서버1 에만 있다\n두 서버 내용이 같다\n쓰기는 서버1, 읽기는 아무 데나\n```\n\n| 압력 | Replication | Sharding |\n|---|---|---|\n| (a) 읽기 | O 복사본에 분산 | O 샤드에 분산 |\n| (b) 쓰기 | **X** 서버1 혼자 받는다 | O 샤드별로 독립 |\n| (c) 용량 | **X** 한 벌이 여전히 2TB | O 쪼갤수록 줄어든다 |\n\n**(c) 가 둘을 가르는 지점이다.** ⭐️\n복사본을 100대로 늘려도 **한 대당 30억 행** 이다.\n2TB 에 안 들어가는 건 몇 대를 붙여도 안 들어간다.\n\n> 여러 벌은 읽기만 나눠진다.\n> 나눠 담아야 쓰기와 용량이 나눠진다.\n\n---\n\n## Q2: Sharding 이 셋 다 푸는데 왜 Replication 을 쓰나?\n\n**서버1 이 죽었을 때가 다르다.**\n\n```\nReplication  서버2 가 전체를 갖고 있다  ->  승격하면 서비스 계속\nSharding     서버1 조각이 그냥 없다     ->  5000만 명분 조회 불가\n```\n\n쪼갠 조각은 짐을 나누지만 **대신 답할 사람이 없다.**\n복사본은 짐을 나누면서 **동시에 보험이다.**\n\n### 둘은 배타적이 아니다 — 겹쳐 쓴다\n\n```\n서버1   학생ID 1 ~ 5000만        쓰기 받음\n서버2   학생ID 1 ~ 5000만        서버1 복사본, 읽기만\n서버3   학생ID 5000만 ~ 1억      쓰기 받음\n서버4   학생ID 5000만 ~ 1억      서버3 복사본, 읽기만\n```\n\n서버1 과 서버2 는 내용이 같고, 서버1 과 서버3 은 다르다.\n가로로 쪼개고 세로로 복사한다.\n하나만 쓰면 반쪽만 풀린다.\n\nDynamoDB, MongoDB 가 이 구조다.\n\n---\n\n## Q3: Shard key 를 어떻게 고르나?\n\nshard key = **이 행을 어느 서버에 넣을지 정하는 함수의 입력** 이다.\n\n```\n서버번호 = f(shard key)\n```\n\n보는 건 두 가지뿐이다.\n\n```\n1. 고르게 흩어지나        한 대만 터지지 않나\n2. 쿼리가 한 대로 끝나나   아니면 전부 뒤져야 하나\n```\n\n서버 4대로 후보 셋을 비교한다.\n\n| 기준 | 분포 | 주력 쿼리 `WHERE 학생ID=1001` | 판정 |\n|---|---|---|---|\n| 학생ID | 2500만씩 균등 | 서버1 하나 | **좋다** |\n| 신청 날짜 | 신청 주간 INSERT 가 **1대에 전부** | 언제 신청했는지 몰라 4대 전부 | 최악 |\n| 학과 | CS 2000만 vs 고전문헌 50명, **2.5배 쏠림** | 학과를 먼저 조회해야 샤드를 안다 | 애매 |\n\n**날짜가 최악인 이유** — 시간은 한 방향으로만 흐른다.\n항상 \"지금\" 이 들어가는 서버 하나만 때려 맞는다.\n서버를 늘려도 일하는 건 1대다. 설계에 쏠림이 박혀 있어서 못 고친다.\n\n**학과는 고칠 수 있다** — CS 를 더 쪼개면 균형이 맞는다. 운영으로 때운다.\n\n**학생ID 의 단점은 받아들인다** — `WHERE 학과='CS'` 가 4대를 다 뒤진다.\n그건 하루 몇 번 돌리는 리포트고, 성적표는 초당 5만 번이다.\n\n### 원칙 ⭐️\n\n> **가장 많이 들어오는 쿼리의 `WHERE` 컬럼을 shard key 로 잡는다.**\n\n모든 쿼리가 빨라지는 shard key 는 없다.\n**어느 쿼리를 포기할지 고르는 일이다.**\n쿼리 패턴이 바뀌면 답도 바뀐다 — 학과 단위 분석이 주력이면 `학과` 가 1등이다.\n\n### 범위 vs 해시\n\n```\n범위   서버번호 = 학생ID / 2500만        1001 -> 서버1,  9999만 -> 서버4\n해시   서버번호 = hash(학생ID) % 4       1001 -> 서버3,  1002 -> 서버1\n```\n\n범위로 쪼개면 신입생은 번호가 항상 가장 커서 **마지막 서버로만 들어간다.**\n\n| | 범위 쿼리 | 신규 데이터 쏠림 |\n|---|---|---|\n| 범위 | O | **X** |\n| 해시 | **X** 흩어져서 전부 뒤짐 | O |\n\n### 용어 두 개\n\n- **Hot shard** — 한 서버에만 트래픽이나 데이터가 쏠린 상태. 날짜 샤딩이 전형\n- **Scatter-gather** — 전 서버에 뿌리고 결과를 모으는 것. **가장 느린 서버가 전체 속도를 정한다**\n\n---\n\n## Q4: Replica 에서 읽으면 방금 쓴 게 보이나?\n\n```\n비동기 복제 (기본값)\n  t=0.000  서버1 에 INSERT\n  t=0.001  서버1 이 \"완료\" 응답         <- 사용자는 여기서 성공을 본다\n  t=0.035  서버2 에 반영\n\n  t=0.010 에 서버2 로 읽기가 가면  ->  안 보인다\n```\n\n이 시간차가 **Replication lag** 이다.\n보통 수 ms, 쓰기가 몰리면 몇 초까지 벌어진다.\n\n동기 복제로 바꾸면 lag 은 0 이지만 대가가 두 개다.\n\n```\n1. 쓰기 응답이 복사본 수만큼 느려진다        0.001초 -> 0.035초\n2. 서버2 가 죽으면 서버1 도 쓰기를 못 받는다  보험이 발목을 잡는다\n```\n\n그래서 **비동기가 기본값** 이다.\n\n### Read-your-own-writes\n\n남의 데이터가 1초 늦는 건 괜찮다.\n**내가 방금 쓴 건 즉시 보여야 한다.**\n신청 성공을 봤는데 목록이 비면 사용자는 버그로 본다.\n\n해법 — **본인 데이터 읽기만 primary 로 보낸다.**\n\n```\n\"내 수강 목록\"   -> 서버1 (primary)\n\"전교 통계\"      -> 서버2 (replica)\n```\n\n읽기 분산을 포기하는 범위를 본인 데이터로 **한정** 하는 거라, 전체 읽기의 극히 일부만 primary 로 간다.\n\n---\n\n## 한 장 요약\n\n```\n쪼갠다  Sharding      쓰기 · 용량이 나눠진다\n                      shard key = 주력 쿼리의 WHERE 컬럼\n                      나머지 쿼리는 scatter-gather 감수\n\n복사한다 Replication   읽기가 나눠지고 보험이 생긴다\n                      비동기 기본 -> lag 있음\n                      내가 쓴 건 primary 에서 읽어 가린다\n\n둘은 다른 축이라 겹쳐 쓴다\n```\n\n세 압력에 해법 하나씩 붙이면 끝이다.\n\n```\n(a) 읽기   복사한다\n(b) 쓰기   쪼갠다\n(c) 용량   쪼갠다\n     +     죽을 때를 대비해 조각마다 복사해둔다\n```\n",

   "md": "## Q1: 주요 SQL 절 6가지와 각 역할은?\n\n| 절 | 역할 |\n|-----|------|\n| SELECT | 어떤 컬럼을 가져올지 (+집계) |\n| FROM | 어떤 테이블에서 |\n| WHERE | 행 필터링 (그룹화 전) |\n| GROUP BY | 특정 컬럼 기준으로 묶기 |\n| HAVING | 그룹 필터링 (그룹화 후) |\n| ORDER BY | 결과 정렬 |\n\n(+ LIMIT: 반환 행 수 제한)\n\n---\n\n## Q2: 작성 순서 vs 실행 순서? (핵심)\n\n**작성(우리가 쓰는) 순서:**\nSELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY\n\n**실행(DB가 처리하는) 순서:**\nFROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY\n\n핵심: **FROM이 먼저(데이터 가져오기), SELECT는 거의 마지막.**\n그래서 SELECT에서 만든 별칭(alias)을 WHERE에서 못 씀 (WHERE가 먼저 실행되니까).\n\n---\n\n## Q3: WHERE vs HAVING 차이는?\n\n- **WHERE**: 그룹화 **전**, 개별 행 필터, 집계함수(COUNT 등) 사용 불가.\n- **HAVING**: 그룹화 **후**, 그룹 필터, 집계함수 사용 가능.\n\n```sql\nSELECT dept, COUNT(*)\nFROM employees\nWHERE salary > 3000     -- 개별 행 먼저 거르고\nGROUP BY dept\nHAVING COUNT(*) > 5     -- 묶인 그룹 중에서 거름\n```\n\n---\n\n## Follow-up: GROUP BY와 집계 함수?\n\nCOUNT, SUM, AVG, MAX, MIN - GROUP BY로 묶은 그룹마다 계산.\nGROUP BY 없이 집계함수만 쓰면 전체가 한 그룹.\n",

   "md": "## Q1: SQL과 NoSQL의 핵심 차이는?\n\n| | SQL (Relational) | NoSQL |\n|---|---|---|\n| 스키마 | 고정 스키마 (테이블, 컬럼) | 유연/스키마리스 |\n| 관계 | JOIN으로 테이블 간 관계 표현 | 비정규화, 중첩 문서 |\n| 확장 | 수직 확장 (scale up) 위주 | 수평 확장 (scale out) 설계 |\n| 일관성 | ACID 보장 | 보통 eventual consistency |\n| 예시 | PostgreSQL, MySQL | MongoDB, DynamoDB, Redis, Cassandra |\n\n> ⚠️ **헷갈림 주의:** \"자유로운\" 건 **관계 표현이 아니라 스키마**다.\n> 관계(JOIN) 표현은 오히려 **SQL이 더 강함**. NoSQL은 JOIN이 약해서\n> 비정규화(한 문서에 다 넣기)/중첩/앱 코드로 처리한다.\n> - SQL: 스키마 고정 + **관계 강함**(JOIN)\n> - NoSQL: 스키마 유연(자유로움) + **관계 약함**\n\n---\n\n## Q2: NoSQL의 종류?\n\n| 타입 | 구조 | 용도 | 예시 |\n|------|------|------|------|\n| Document | JSON 문서 | 유연한 스키마, 중첩 데이터 | MongoDB |\n| Key-Value | key → value | 캐싱, 세션 | Redis, DynamoDB |\n| Wide-Column | row key + column family | 대규모 시계열, 로그 | Cassandra, HBase |\n| Graph | 노드 + 엣지 | 관계 탐색 (소셜, 추천) | Neo4j |\n\n---\n\n## Q3: 언제 뭘 쓰나요?\n\n**SQL 선택:**\n- 데이터 관계가 복잡 (JOIN 빈번)\n- 트랜잭션 ACID가 중요 (금융, 주문)\n- 스키마가 안정적\n\n**NoSQL 선택:**\n- 대규모 수평 확장 필요\n- 스키마가 자주 바뀜\n- 읽기/쓰기 성능이 최우선\n- 비정형 데이터 (로그, 이벤트, 문서)\n\n---\n\n## Follow-up: CAP Theorem이란?\n\n분산 시스템에서 동시에 3가지를 다 만족시킬 수 없음:\n- **C (Consistency)** - 모든 노드가 같은 데이터를 봄\n- **A (Availability)** - 모든 요청에 응답\n- **P (Partition Tolerance)** - 네트워크 분할에도 동작\n\n네트워크 분할은 피할 수 없으므로 실질적으로 CP vs AP 선택:\n- CP: MongoDB, HBase (일관성 우선, 일부 요청 거부 가능)\n- AP: Cassandra, DynamoDB (가용성 우선, 일시적 불일치 허용)\n\n### Partition(분할)이란\n\n분산 시스템에서 노드 간 네트워크가 끊겨 서로 소식을 모르는 상태.\n\n```\n정상: [노드A] ←통신→ [노드B]\n분할: [노드A] ×끊김× [노드B]  ← 서로 동기화 불가\n```\n\n현실에서 네트워크 단절은 못 피함 → P는 사실상 필수 → **실제 선택은 C vs A**.\n\n### 은행 잔액 예시 (핵심 직관)\n\n노드 A, B 연결이 끊긴 상태, 사용자가 A에 \"잔액 업데이트\"함,\n이때 다른 사용자가 B에 \"잔액 조회\"하면?\n\n- **CP (일관성 우선)**: \"A랑 동기화 안 돼 최신값 확인 못 함 → **응답 거부**\"\n  - 틀린 값 주느니 안 줌. 예: 은행, 결제\n- **AP (가용성 우선)**: \"동기화 안 됐지만 **내가 아는 값이라도 응답**\" (옛날 값일 수 있음)\n  - 나중에 맞춰짐 = eventual consistency. 예: SNS 좋아요 수, 조회수\n\n> 한 줄: 분할 시 **\"틀린 값 주느니 거부\"(CP)** vs **\"옛날 값이라도 응답\"(AP)**.\n\n### ⚠️ 흔한 오해\n\n\"항상 셋 중 둘만\"이 아니라, **분할이 일어난 순간에만** C vs A를 고름.\n평상시(분할 없을 때)는 C도 A도 다 만족.\n\n### SQL vs NoSQL 연결\n\n- SQL(RDBMS): 보통 단일 서버 → ACID 강한 일관성 (C 중시)\n- NoSQL: 여러 노드 수평 확장 → 대부분 A 위해 C 완화 (eventual consistency = AP)\n",

   "md": "## Q1: TCP 3-way handshake를 설명해보세요.\n\nTCP 연결 수립 과정:\n\n```\nClient                  Server\n  |--- SYN (seq=x) --->|          1. 클라이언트가 연결 요청\n  |<-- SYN+ACK (seq=y, ack=x+1) --|  2. 서버가 수락 + 자기 SYN\n  |--- ACK (ack=y+1) -->|         3. 클라이언트가 확인\n  |     [연결 성립]      |\n```\n\n왜 3번? 양쪽 다 \"보내기/받기 능력\"을 확인해야 하니까. 2번이면 서버가 클라이언트의 수신 능력을 확인 못 함.\n\n핵심 관점 - TCP는 양방향이라 원래 SYN 2개 + ACK 2개(각 방향마다 연결 수립)가 필요:\n```\nClient → Server: SYN                (나 연결하고 싶어)\nServer → Client: SYN + ACK          (너 받았어 + 나도 연결하고 싶어) ← 2단계에서 ACK와 SYN 합쳐짐\nClient → Server: ACK                (너 신호 받았어)\n```\n원래 4개인데 서버의 ACK+SYN을 하나로 합쳐서 3번으로 줄인 것.\n\n---\n\n## Q2: 4-way teardown은?\n\nTCP 연결 종료 과정:\n\n```\nClient                  Server\n  |--- FIN --->|                1. 클라이언트: 나 보낼 거 끝남\n  |<-- ACK ----|                2. 서버: 확인 (아직 보낼 게 남았을 수 있음)\n  |<-- FIN ----|                3. 서버: 나도 다 보냄\n  |--- ACK --->|                4. 클라이언트: 확인\n  |  [TIME_WAIT]  |\n```\n\n왜 4번? 양쪽이 독립적으로 종료를 결정, 서버가 ACK 보낸 뒤에도 데이터를 더 보낼 수 있음 (half-close).\n\n핵심 관점 - 종료도 FIN 2개 + ACK 2개:\n```\nClient → Server: FIN   (나 보낼 거 다 끝났어)\nClient ← Server: ACK   (오케이 인지했어)\nClient ← Server: FIN   (나도 이제 다 보냈어) ← 여기가 3번\nClient → Server: ACK   (오케이 확인)\n```\n수립은 서버가 ACK+SYN을 합쳐서 3번인데, 종료는 서버가 \"ACK(받았어)\"와 \"FIN(나도 끝)\" 사이에\n아직 보낼 데이터가 남아있을 수 있어서(half-close) 둘을 못 합침 → 4번.\n\n---\n\n## Q3: TIME_WAIT 상태는 왜 필요한가요?\n\n클라이언트가 마지막 ACK 보낸 후 일정 시간(보통 2*MSL = 60초) 대기하는 상태.\n\n이유:\n1. **마지막 ACK 유실 대비** - 서버가 FIN 재전송하면 다시 ACK 보내줄 수 있음\n2. **이전 연결의 패킷이 새 연결에 섞이는 것 방지** - 같은 포트로 즉시 새 연결 맺으면 지연된 패킷이 새 연결에 도착할 수 있음\n\n---\n\n## Follow-up: SYN Flood 공격이란?\n\n- 공격자가 SYN만 대량으로 보내고 ACK를 안 보냄\n- 서버는 각 SYN에 대해 half-open 연결을 유지 → 메모리 소진\n- 방어: SYN cookies (상태 저장 없이 SYN+ACK 응답), rate limiting\n",

   "md": "## Q1: DNS란? 동작 과정을 설명해보세요.\n\n**DNS (Domain Name System)** - 도메인 이름을 IP 주소로 변환하는 시스템, 인터넷의 전화번호부.\n\n조회 과정 (www.google.com):\n```\n1. 브라우저 캐시 확인\n2. OS 캐시 확인 (/etc/hosts)\n3. Local DNS Resolver (ISP) 캐시 확인\n4. Root DNS Server → \".com\" 담당 서버 주소 반환\n5. TLD DNS Server (.com) → \"google.com\" 담당 서버 주소 반환\n6. Authoritative DNS Server → 최종 IP 주소 반환\n7. 결과 캐시 (TTL 동안)\n```\n\n### 쉽게 외우기 - \"집에서부터 점점 멀리 물어본다\"\n\n가까운 캐시부터 확인하고, 없으면 점점 상위 서버로 계층 조회:\n```\n1. 브라우저 캐시     \"나 최근에 본 적 있나?\"\n2. OS 캐시           \"컴퓨터가 기억하나?\"\n3. Resolver (ISP)    \"통신사 DNS가 아나?\"\n   ↳ 여기도 없으면 계층적으로 물어봄;\n4. Root 서버         \".com은 누가 담당?\"\n5. TLD 서버 (.com)   \"google.com은 누가 담당?\"\n6. Authoritative     \"최종 IP 알려줌!\"\n7. 캐시에 저장 (TTL)\n```\n\n### 4개 서버 역할 (앞의 셋은 안내만, Authoritative만 진짜 답)\n\n**1. Resolver (리졸버) - \"심부름꾼\"**\n- 보통 ISP(통신사)나 회사가 운영하는 DNS 서버\n- 네 컴퓨터가 \"google.com IP 뭐야?\"라고 물어보면 → 대신 여기저기 찾아다녀서 답을 가져다줌\n- 너 대신 뛰어다니는 심부름꾼/대리인\n\n**2. Root 서버 (루트) - \"안내데스크 최상위\"**\n- DNS 계층의 최상위\n- 실제 IP는 모름, 대신 **\".com은 저쪽 TLD 서버한테 물어봐\"**라고 안내만\n- 전 세계에 13개 그룹 (고정)\n\n**3. TLD 서버 (Top-Level Domain) - \"도메인 종류별 담당\"**\n- .com, .org, .net, .kr 같은 최상위 도메인별 서버\n- .com TLD 서버는 → **\"google.com은 저쪽 Authoritative 서버가 담당해\"**라고 안내\n- 여전히 실제 IP는 모름, 다음 단계 안내만\n\n**4. Authoritative 서버 (권위 서버) - \"진짜 답 가진 곳\"**\n- google.com의 실제 IP를 가진 최종 서버\n- google이 자기 도메인 관리하는 서버\n- 여기서 진짜 IP 반환 (\"142.250.x.x야!\")\n\n**핵심**: Root → TLD → Authoritative = 점점 좁혀가는 계층. **Authoritative만 실제 IP 반환.**\n**왜 계층적?** 도메인 수십억 개를 한 서버가 다 가짐 → 분담(확장성 + 분산 관리).\n\n---\n\n## Q2: Recursive vs Iterative query?\n\n**Recursive**: 클라이언트가 resolver에게 요청 → resolver가 알아서 끝까지 찾아줌, 클라이언트는 최종 답만 받음.\n**Iterative**: 각 서버가 \"나는 모르지만, 여기 물어봐\" 식으로 다음 서버 주소만 알려줌, Resolver가 직접 반복 질의.\n\n보통: 클라이언트 → resolver는 recursive, resolver → 각 DNS 서버는 iterative.\n\n### 설계 이해 - \"누가 발품을 파느냐\"\n\n**Recursive (재귀) - \"대신 다 해줘\"**\n- 질문자는 **최종 답(IP)만** 받음, 중간 과정은 받는 쪽이 다 책임.\n- 예: 너 → Resolver, \"google.com IP?\" → Resolver \"잠깐, 내가 찾아올게\" → \"142.250.x.x야!\"\n- 비유: 비서한테 \"이 일 처리해줘\" → 알아서 다 하고 결과만 보고\n\n**Iterative (반복) - \"다음 어디긴 알려줘\"**\n- 각 서버가 최종 답 대신 **\"다음에 누구한테 물어봐\"**만 알려줌, 질문자 직접 반복.\n- 예: Resolver → Root \"몰라, .com은 TLD한테\" → Resolver → TLD \"몰라, Authoritative한테\"\n- 비유: 안내데스크가 \"3층 가세요\" → 3층 가니 \"301호\" → 내가 계속 이동\n\n**실제로는 둘 다 섞임:**\n```\n너 —[Recursive]—> Resolver —[Iterative]—> Root\n                            —[Iterative]—> TLD\n                            —[Iterative]—> Authoritative\n```\n- 너 → Resolver = **Recursive** (통째로 맡김)\n- Resolver → 각 서버 = **Iterative** (Resolver가 직접 Root→TLD→Authoritative 반복)\n\n---\n\n## Q3: DNS가 UDP를 쓰는 이유는?\n\n- 요청/응답이 보통 단일 패킷에 들어감 (512 bytes 이하)\n- 연결 설정 오버헤드 없이 빠르게 응답\n- 실패하면 단순히 재요청 (자체 timeout + retry)\n\n예외: Zone transfer (서버 간 전체 레코드 복제)는 데이터가 크므로 TCP 사용.\n\n---\n\n## Follow-up: DNS 레코드 타입?\n\n| 타입 | 용도 |\n|------|------|\n| A | 도메인 → IPv4 |\n| AAAA | 도메인 → IPv6 |\n| CNAME | 도메인 → 다른 도메인 (별칭) |\n| MX | 메일 서버 지정 |\n| NS | 네임서버 지정 |\n| TXT | 임의 텍스트 (SPF, 도메인 인증 등) |\n",

   "md": "## Q1: HTTP와 HTTPS의 차이?\n\n| | HTTP | HTTPS |\n|---|------|-------|\n| 포트 | 80 | 443 |\n| 암호화 | 없음 (평문) | TLS로 암호화 |\n| 보안 | 도청, 변조 가능 | 기밀성 + 무결성 + 인증 |\n| 속도 | 약간 빠름 | TLS handshake 오버헤드 |\n\nHTTPS = HTTP + TLS. 전송 계층에서 암호화할 뿐, HTTP 프로토콜 자체는 동일.\n\n---\n\n## Q2: TLS Handshake 과정은?\n\n```\nClient                                  Server\n  |--- ClientHello (지원 cipher) --->|\n  |<-- ServerHello + 인증서 ----------|\n  |   [인증서 검증: CA 체인 확인]      |\n  |--- Key Exchange (premaster) --->|\n  |   [양쪽 session key 생성]         |\n  |<-- Finished ----------------------|\n  |--- Finished ------>|\n  |   [암호화 통신 시작]              |\n```\n\n핵심: 비대칭 암호화로 session key를 안전하게 교환 → 이후 대칭 암호화로 실제 데이터 전송 (빠르니까).\n\n---\n\n## Q3: HTTP/1.1 vs HTTP/2 vs HTTP/3 차이는?\n\n| | HTTP/1.1 | HTTP/2 | HTTP/3 |\n|---|----------|--------|--------|\n| 전송 | TCP | TCP | **UDP (QUIC)** |\n| 멀티플렉싱 | X (한 요청씩) | O (하나의 TCP에 다중 스트림) | O |\n| Head-of-line blocking | TCP + HTTP 레벨 | TCP 레벨만 | 없음 |\n| 헤더 압축 | X | HPACK | QPACK |\n\nHTTP/3가 UDP인 이유: TCP의 HOL blocking 문제를 근본적으로 해결하기 위해.\n\n---\n\n## Follow-up: 대칭 vs 비대칭 암호화?\n\n- **대칭**: 같은 키로 암호화/복호화. 빠름. (AES) → 데이터 전송에 사용\n- **비대칭**: 공개키로 암호화, 개인키로 복호화. 느림. (RSA, ECDH) → 키 교환에 사용\n- TLS는 둘 다 사용: 비대칭으로 키 합의 → 대칭으로 실제 통신\n",

   "md": "## Q1: Load balancer란? 왜 필요한가요?\n\n들어오는 트래픽을 여러 서버에 분산시키는 장치/소프트웨어.\n\n필요한 이유:\n- **가용성** - 한 서버 죽어도 나머지가 처리\n- **확장성** - 서버 추가만으로 용량 증가\n- **성능** - 하나의 서버에 과부하 방지\n\n위치: 클라이언트 ↔ [Load Balancer] ↔ 서버 풀\n\n---\n\n## Q2: 로드 밸런싱 알고리즘 종류?\n\n| 알고리즘 | 방식 |\n|----------|------|\n| Round Robin | 순서대로 돌아가며 분배 |\n| Weighted Round Robin | 서버 성능에 따라 가중치 부여 |\n| Least Connections | 현재 연결 수 가장 적은 서버로 |\n| IP Hash | 클라이언트 IP 기반 해시 → 같은 서버로 (sticky session) |\n| Random | 무작위 선택 |\n\n### IP Hash 만 목적이 다르다 ⭐️\n\n나머지 넷은 **고르게 나누는 게** 목적이다.\nIP Hash 는 반대로 **같은 곳으로 계속 보내는 게** 목적이다.\n\n왜 그러고 싶냐면, **세션 상태가 서버 메모리에 있을 때** 다.\n로그인 정보나 장바구니를 1번 서버가 들고 있는데\n다음 요청이 2번 서버로 가면 \"누구세요?\" 가 된다.\n이게 **sticky session** 이다.\n\n대가도 있다.\n- 그 서버가 죽으면 거기 붙어 있던 세션이 통째로 날아간다\n- 특정 서버에만 트래픽이 몰릴 수 있다 (고르게 나누기를 포기했으니까)\n\n그래서 요즘은 세션을 서버 밖으로 빼는 쪽을 택한다.\nRedis 같은 공용 저장소에 세션을 두면 어느 서버로 가든 상관없어지고,\nIP Hash 를 쓸 이유 자체가 사라진다.\n\n---\n\n## Q3: L4 vs L7 Load Balancer?\n\nL4 / L7 은 OSI 계층 번호다. 4계층 Transport 냐, 7계층 Application 이냐.\n\n**봉투만 보느냐, 뜯어서 편지를 읽느냐** 의 차이다. ⭐️\n\n클라이언트가 `GET /api/users` 를 보냈다고 하자.\n\n```\n[L4]  보는 것 : 출발지 IP:포트  ->  목적지 IP:포트      (봉투 겉면)\n      하는 일 : \"TCP 연결 하나 왔네\" -> 3번 서버에 그대로 꽂아줌\n      모르는 것 : /api/users 인지 /static/logo.png 인지 전혀 모름\n\n[L7]  보는 것 : HTTP 메서드, URL, 헤더, 쿠키           (편지 내용)\n      하는 일 : \"/api/ 로 시작하네\"  -> API 서버 풀로\n               \"/static/ 이네\"      -> 정적 파일 서버 풀로\n```\n\n### 왜 L4 가 빠른가\n\n파싱을 안 한다.\n헤더 몇 바이트만 보고 패킷을 그대로 넘긴다.\n내용이 암호화돼 있어도 상관없다. 어차피 안 읽으니까.\n\n### 왜 L7 이 느린가\n\n연결을 **자기가 받아서 끝낸다.**\n클라이언트와 TLS 를 맺고, 복호화하고, HTTP 를 파싱해서 읽는다.\n그러고 나서 서버와 **새 연결을 따로** 맺는다.\n\n```\nL4 :  클라이언트 ————————— 서버        연결 1개를 그냥 통과시킴\nL7 :  클라이언트 ——— LB ——— 서버        연결이 2개가 됨\n```\n\n그래서 **SSL 종료가 L7 의 일이다.**\n내용을 읽으려면 어차피 풀어야 하니까.\nL4 는 안 한다. 못 하는 게 아니라 풀 이유가 없다.\n\n### 정리\n\n| | L4 (Transport) | L7 (Application) |\n|---|-----------------|-------------------|\n| 판단 기준 | IP, Port, TCP/UDP 헤더 | HTTP 헤더, URL, Cookie, Body |\n| 연결 | 통과시킴 (1개) | 끊고 새로 맺음 (2개) |\n| 속도 | 빠름 (파싱 없음) | 느림 (복호화 + 파싱) |\n| 기능 | 단순 분산 | URL 기반 라우팅, 캐싱, SSL 종료 |\n| 예시 | AWS NLB | AWS ALB, Nginx, HAProxy |\n\n**L7 만 할 수 있는 일은 전부 \"내용을 읽어야 가능한 것\" 이다.**\nURL 기반 라우팅, 쿠키 기반 분배, 응답 캐싱, SSL 종료.\n\"이걸 하려면 편지를 뜯어야 하나?\" 를 물으면 어느 쪽 일인지 바로 갈린다.\n\n---\n\n## Follow-up: Health check란?\n\n- Load balancer가 주기적으로 서버에 요청 보내서 살아있는지 확인\n- 응답 없거나 에러 → unhealthy로 마킹 → 트래픽 안 보냄\n\n**Q1 의 \"가용성\" 을 실제로 만들어내는 게 이것이다.** ⭐️\n\"한 대 죽어도 나머지가 처리한다\" 가 성립하려면 **죽은 걸 알아야** 한다.\nhealth check 가 없으면 죽은 서버로 계속 보내고, 그 요청은 전부 실패한다.\nQ1 의 세 이유 중 가용성이 말로만 남는다.\n",

   "qs": [
    "Q1: OSI 계층을 설명해보세요.",
    "Q2: TCP/IP 4계층과 매핑하면?",
    "Q3: 데이터가 각 계층을 지나갈 때 어떻게 변하나요?",
    "Follow-up: 면접에서 \"google.com 치면 무슨 일이 일어나나요?\" 물어보면?"

   "md": "## Q1: OSI 계층을 설명해보세요.\n\n| # | Layer | 역할 | 프로토콜/장비 |\n|---|-------|------|---------------|\n| 7 | Application | 사용자와 직접 상호작용 | HTTP, FTP, DNS, SMTP |\n| 6 | Presentation | 데이터 형식 변환, 암호화 | SSL/TLS, JPEG, JSON |\n| 5 | Session | 연결 세션 관리 | NetBIOS, RPC |\n| 4 | Transport | end-to-end 신뢰성, 포트 | TCP, UDP |\n| 3 | Network | 라우팅, 논리 주소 | IP, ICMP, Router |\n| 2 | Data Link | 프레임, 물리 주소 | Ethernet, MAC, Switch |\n| 1 | Physical | 비트 전송, 전기 신호 | Cable, Hub, NIC |\n\n암기: \"All People Seem To Need Data Processing\" (위→아래)\n\n**아래 4계층 감 잡기 - \"무엇으로 찾아가는지\":**\n- **Transport (Segment)** = \"어느 **프로그램**?\" (포트 번호로 앱 구분)\n- **Network (Packet)** = \"어느 **컴퓨터**?\" (IP 주소로 라우팅)\n- **Data Link (Frame)** = \"**같은 랜 안**에서 어느 카드?\" (MAC 주소)\n- **Physical (Bits)** = 그냥 **선/전파**로 흐름\n\n위로 갈수록 논리적/추상적, 아래로 갈수록 물리적.\n장비 매핑: Router=3(Network) / Switch=2(Data Link) / Hub·Cable=1(Physical).\n\n---\n\n## Q2: TCP/IP 4계층과 매핑하면?\n\n| TCP/IP | OSI 매핑 |\n|--------|----------|\n| Application | 7 + 6 + 5 |\n| Transport | 4 |\n| Internet | 3 |\n| Network Access | 2 + 1 |\n\n실무에서는 TCP/IP 모델을 더 많이 씀, OSI는 개념 설명용.\n\n---\n\n## Q3: 데이터가 각 계층을 지나갈 때 어떻게 변하나요?\n\n```\n[Application] Data\n[Transport]   Segment = TCP Header + Data\n[Network]     Packet  = IP Header + Segment\n[Data Link]   Frame   = MAC Header + Packet + Trailer\n[Physical]    Bits    = 전기/광 신호\n```\n\n보내는 쪽: 위→아래 (encapsulation, 헤더 추가)\n받는 쪽: 아래→위 (decapsulation, 헤더 제거)\n\n### ⚠️ 헷갈리기 쉬운 것 - \"감싸는 순서 vs 시간 순서\"\n\nL3에서 IP 붙이고 → L2에서 MAC 붙이는 건 **한 번의 전송을 위한 포장 과정**이지,\n\"IP 붙여서 목적지 도착한 후에 그 다음에 L2 씀\"이 아님.\n\n**하나의 패킷을 보낼 때 매번 이렇게 포장 (양파처럼):**\n```\n[HTTP 데이터]\n[TCP 헤더 | HTTP 데이터]                                    ← L7\n[IP 헤더 | TCP 헤더 | HTTP 데이터]                           ← L4 감쌈 (port)\n[MAC 헤더 | IP 헤더 | TCP 헤더 | HTTP 데이터]                 ← L3 감쌈 (IP)\n  |||||                                                    ← L2 감쌈 (MAC)\n  전선/무선 (L1 비트로 나감)\n```\n\n### hop마다 뭐가 벗겨지고 다시 씌워지나\n\n**핵심: 라우터 지날 때마다 L2(MAC)는 벗기고 다시 씌워짐. L3(IP)는 유지.**\n\n내 노트북 → R1 → R2 → google 서버 (3 hop) 예시:\n```\n[내 노트북]\n  포장:  MAC=R1주소 | IP=구글서버 | TCP | HTTP\n  |||||                            ↓ 케이블\n[R1 라우터]\n  L2 벗김 → IP 헤더 보고 \"R2로 보내야겠다\" 판단\n  다시 포장:  MAC=R2주소 | IP=구글서버 | TCP | HTTP    ← MAC만 R2로, IP 그대로\n  |||||                            ↓\n[R2 라우터]\n  또 L2 벗김 → IP 보고 \"구글서버로 보내야겠다\"\n  다시 포장:  MAC=구글서버 | IP=구글서버 | TCP | HTTP   ← MAC만 서버로\n  |||||                            ↓\n[구글 서버] 도착\n  L2 벗김 → L3 벗김(IP 나 맞네) → L4 벗김(port 나 맞네) → HTTP 처리\n```\n\n### 왜 이렇게 하나 (직관 + 우체국 비유)\n\n- **IP (L3)** = \"최종 목적지 우편번호\". **바뀌지 않음.** 최종 도착지 표시.\n- **MAC (L2)** = \"다음 우체국 주소\", **hop마다 바뀜.** 지금 바로 넘길 상대만 표시.\n\n**우체국 비유:**\n- 서울 우체국 → 대전 우체국 → 부산 우체국 → 최종 집\n- 봉투 최종 주소(부산 XX동) = **IP**, 안 바뀜\n- 각 우체국이 \"다음 어디로 넘겼나\"에 붙었다 뗐다 = **MAC**, 매번 바뀜\n\n### 왜 L2/L3 분리 (설계 이유)\n\n- **L3** = 전략가 (\"서버까지 어떻게 갈까 - 전체 여정\")\n- **L2** = 배송기사 (\"일단 옆 라우터한테 어떻게 넘길까 - 한 hop만\")\n\n만약 없으면?\n- L3 없이 L2만: MAC은 지역적이라 인터넷 전체 라우팅 불가\n- L2 없이 L3만: 실제 물리 매체(Ethernet/WiFi/광섬유)에 붙일 방법 없음\n\n**즉 L2/L3는 시간상 나눠지는 게 아니라 역할이 나눠짐. 매 hop마다 협업.**\n\n### 요약 한 줄\n\n> 매 hop마다 L2 벗기고/다시 씌우기. L3(IP)는 유지. 최종 도착 후에야 L4→L7까지 순서대로 벗김.\n\n| 헤더 | 언제 바뀌나 | 무엇을 가리키나 |\n|------|------------|----------------|\n| MAC (L2) | **hop마다** 바뀜 | 다음 한 hop 상대 |\n| IP (L3) | 안 바뀜 | 최종 목적지 |\n| Port (L4) | 안 바뀜 | 목적지의 어느 앱 |\n\n**⚠️핵심 오해 방지 - 한 통신은 매번 7→1→선→1→7 왕복:**\n계층을 \"7→4→6→7 순서로 골라 다니는\" 게 아님. **한 번의 통신은 항상 계층 전체를 왕복**함.\n\"DNS → TCP handshake → TLS → HTTP\" 같은 순서는 **여러 번의 통신**을 나열한 것 -\n각 통신마다 다를 뿐, 실제 전기 신호는 매번 7→1을 다 거침.\n\n```\n통신 1 (DNS 조회):     내PC[7→1] → 선 → DNS서버[1→7] → 응답 [7→1→선→1→7]\n통신 2 (TCP handshake): 내PC[4→1] → 선 → 구글서버[1→4] → ACK 왕복 3번\n통신 3 (TLS handshake): 내PC[6→1] → 선 → 구글서버[1→6] → 인증서/키 교환\n통신 4 (HTTP GET):      내PC[7→1] → 선 → 구글서버[1→7] → HTML응답 [7→1→선→1→7]\n```\n\n---\n\n## Follow-up: 면접에서 \"google.com 치면 무슨 일이 일어나나요?\" 물어보면?\n\n1. DNS 조회 → IP 획득\n2. TCP 3-way handshake (port 443)\n3. TLS handshake\n4. HTTP GET / 요청\n5. 서버 응답 (HTML)\n6. 브라우저 렌더링 (DOM → CSSOM → Layout → Paint)\n",

   "md": "## Q1: REST와 gRPC의 핵심 차이는?\n\n| | REST | gRPC |\n|---|------|------|\n| 프로토콜 | HTTP/1.1 (주로) | HTTP/2 |\n| 데이터 형식 | JSON (텍스트) | Protocol Buffers (바이너리) |\n| 계약 | 느슨 (OpenAPI 선택적) | 엄격 (.proto 파일 필수) |\n| 스트리밍 | 제한적 | 양방향 스트리밍 지원 |\n| 브라우저 지원 | 네이티브 | 제한적 (grpc-web 필요) |\n\n### HTTP/1.1 vs HTTP/2\n\n주문 서비스가 재고를 세 개 물어보는 상황이다.\n\n```\nHTTP/1.1   연결 하나에 요청 하나씩. 앞 응답을 받아야 다음을 보낸다\n\n  연결   [38번?] ---> [답] ---> [39번?] ---> [답] ---> [40번?] ---> [답]\n\n  줄을 서서 기다린다. 그래서 연결을 여러 개 맺어 억지로 늘린다\n```\n\n```\nHTTP/2     연결 하나에 여러 요청을 동시에 흘려보낸다\n\n  연결   [38번?][39번?][40번?]  --->\n                    <---  [답][답][답]     먼저 온 것부터, 순서 상관없이\n```\n\n연결 하나를 계속 재사용하니 매번 새로 맺는 비용도 없다.\n헤더도 압축해서 보낸다.\n\n초당 5만 번이면 **줄 서서 기다리냐 동시에 보내냐** 가 큰 차이가 된다.\n\n---\n\n## Q2: 각각 언제 쓰나요?\n\n**REST:**\n- 외부 공개 API (브라우저, 모바일 클라이언트)\n- 간단한 CRUD\n\n      POST     /items        Create    만들기\n      GET      /items/38     Read      읽기\n      PUT      /items/38     Update    고치기\n      DELETE   /items/38     Delete    지우기\n\n- 사람이 읽기 쉬운 응답이 필요할 때\n- 캐싱이 중요할 때 (HTTP 캐시 활용)\n\n**gRPC:**\n- 마이크로서비스 간 내부 통신 (low latency 필요)\n- 양방향 스트리밍 (채팅, 실시간 피드)\n- 강타입 계약이 중요할 때\n- 높은 throughput (바이너리라 작고 빠름)\n\n---\n\n## Q3: Protocol Buffers란?\n\nGoogle이 만든 바이너리 직렬화 포맷, `.proto` 파일에 스키마 정의 → 코드 자동 생성.\n\n```protobuf\nmessage User {\n  string name = 1;\n  int32 age = 2;\n}\n```\n\nJSON 대비 장점:\n- 크기 3~10배 작음\n- 파싱 속도 빠름\n- 타입 안전성 (codegen)\n- 스키마 진화 지원 (필드 추가 시 하위 호환)\n\n단점: 사람이 직접 읽기 어려움.\n\n---\n\n## Follow-up: REST의 핵심 제약조건은?\n\n1. **Stateless** - 서버가 클라이언트 상태 저장 안 함. 매 요청에 필요한 정보 다 포함.\n2. **Client-Server** - 관심사 분리\n3. **Cacheable** - 응답에 캐시 가능 여부 명시\n4. **Uniform Interface** - 일관된 인터페이스 (URI로 자원 식별, HTTP method로 동작)\n5. **Layered System** - 클라이언트는 직접 서버인지 프록시인지 모름\n",

   "qs": [
    "Q1: TCP와 UDP의 핵심 차이는?",
    "Q2: TCP가 신뢰성을 보장하는 매커니즘은?",
    "Q3: UDP를 쓰는데 어느 정도 신뢰성이 필요하면 어떻게 하나요?",
    "Follow-up: 왜 DNS는 UDP를 쓰나요?"
   ],
   "md": "## Q1: TCP와 UDP의 핵심 차이는?\n\n| | TCP | UDP |\n|---|-----|-----|\n| 연결 | Connection-oriented (3-way handshake) | Connectionless |\n| 신뢰성 | 보장 (ACK, 재전송, 순서 보장) | 미보장 |\n| 속도 | 느림 (오버헤드) | 빠름 |\n| 용도 | HTTP, FTP, Email | DNS, 스트리밍, 게임, VoIP |\n\n핵심: TCP는 **신뢰성**, UDP는 **속도**.\n\n---\n\n## Q2: TCP가 신뢰성을 보장하는 매커니즘은?\n\n1. **Sequence number** - 패킷 순서 보장\n2. **ACK** - 수신 확인. 못 받으면 재전송\n3. **Checksum** - 데이터 무결성 확인\n4. **Flow control** - Sliding window로 수신자 처리 속도에 맞춤\n5. **Congestion control** - 네트워크 혼잡 시 전송 속도 조절 (slow start, AIMD)\n\n---\n\n## Q3: UDP를 쓰는데 어느 정도 신뢰성이 필요하면 어떻게 하나요?\n\nApplication layer에서 직접 구현, 예:\n- 게임: 중요한 패킷만 ACK + 재전송, 나머지는 drop 허용\n- QUIC (HTTP/3): UDP 위에 자체 신뢰성/멀티플렉싱 구현\n\n---\n\n## Follow-up: 왜 DNS는 UDP를 쓰나요?\n\n- 요청/응답이 단일 패킷에 들어갈 만큼 작음 (보통 512 bytes 이하)\n- 연결 설정 오버헤드(3-way handshake) 없이 빠르게 응답\n- 못 받으면 그냥 다시 보내면 됨 (간단한 retry로 충분)\n- 단, zone transfer 같은 대용량 데이터는 TCP 사용\n",

   "md": "## Q1: Factory Pattern이란?\n\n객체 생성 로직을 별도 클래스/메서드로 분리. 클라이언트가 구체 클래스를 몰라도 됨.\n\n```cpp\nclass Shape {\npublic:\n    virtual void draw() = 0;\n};\n\nclass Circle : public Shape { void draw() override { /*...*/ } };\nclass Square : public Shape { void draw() override { /*...*/ } };\n\nclass ShapeFactory {\npublic:\n    static Shape* create(string type) {\n        if (type == \"circle\") return new Circle();\n        if (type == \"square\") return new Square();\n        return nullptr;\n    }\n};\n\n// 사용\nShape* s = ShapeFactory::create(\"circle\");\ns->draw();\n```\n\n장점: 새 Shape 추가 시 Factory만 수정, 클라이언트 코드 변경 없음.\n\n---\n\n## Q2: Singleton Pattern이란?\n\n클래스의 인스턴스가 하나만 존재하도록 보장.\n\n```cpp\nclass Logger {\n    static Logger* instance;\n    Logger() {}  // private 생성자\npublic:\n    static Logger* getInstance() {\n        if (!instance) instance = new Logger();\n        return instance;\n    }\n    void log(string msg) { /*...*/ }\n};\n```\n\n용도: 로거, 설정 관리, DB 커넥션 풀.\n\n주의: 멀티스레드에서 race condition → `std::call_once` 또는 C++11 이후 지역 static 변수 활용:\n```cpp\nstatic Logger& getInstance() {\n    static Logger instance;  // thread-safe in C++11+\n    return instance;\n}\n```\n\n---\n\n## Q3: Observer Pattern이란?\n\n객체 상태 변경 시 등록된 관찰자들에게 자동 통지.\n\n```cpp\nclass Observer {\npublic:\n    virtual void update(int value) = 0;\n};\n\nclass Subject {\n    vector<Observer*> observers;\n    int state;\npublic:\n    void attach(Observer* o) { observers.push_back(o); }\n    void setState(int val) {\n        state = val;\n        for (auto o : observers) o->update(val);\n    }\n};\n```\n\n실제 사용:\n- GUI 이벤트 리스너\n- Pub/Sub 메시징\n- React의 상태 변경 → 리렌더링\n\n---\n\n## Follow-up: Strategy Pattern?\n\n알고리즘을 캡슐화해서 런타임에 교체 가능하게.\n\n```cpp\nclass SortStrategy {\npublic:\n    virtual void sort(vector<int>&) = 0;\n};\n\nclass QuickSort : public SortStrategy { /*...*/ };\nclass MergeSort : public SortStrategy { /*...*/ };\n\nclass Sorter {\n    SortStrategy* strategy;\npublic:\n    void setStrategy(SortStrategy* s) { strategy = s; }\n    void doSort(vector<int>& data) { strategy->sort(data); }\n};\n```\n\nif-else 분기 대신 객체로 동작을 교체. Open/Closed principle 적용의 전형.\n",

   "qs": [
    "Q1: Abstraction, Encapsulation, Inheritance, Polymorphism을 각각 설명해보세요.",

   ],
   "md": "**니모닉: \"A PIE\" (A 파이)**\n- **A**bstraction (추상화)\n- **P**olymorphism (다형성)\n- **I**nheritance (상속)\n- **E**ncapsulation (캡슐화)\n\n## Q1: Abstraction, Encapsulation, Inheritance, Polymorphism을 각각 설명해보세요.\n\n**Abstraction (추상화):**\n- 복잡한 내부를 숨기고 필요한 인터페이스만 노출\n- 예: `drive()` 호출하면 엔진/변속기 내부는 몰라도 됨\n\n**Encapsulation (캡슐화):**\n- 데이터 + 메서드를 하나로 묶고, 외부 접근 제한 (private/public)\n- 내부 구현 변경해도 외부 영향 없음\n\n**Inheritance (상속):**\n- 기존 클래스를 확장해서 새 클래스 생성. 코드 재사용.\n- `class Dog : public Animal { }`\n\n**Polymorphism (다형성):**\n- 같은 인터페이스로 다른 동작, 런타임에 실제 타입에 맞는 메서드 호출.\n- `Animal* a = new Dog(); a->speak();` → \"Woof\"\n\n---\n\n## Q2: Encapsulation과 Abstraction 차이는?\n\n헷갈리기 쉬운 부분:\n\n- **Abstraction**: \"무엇을\" 보여줄지 결정 (인터페이스 설계)\n- **Encapsulation**: \"어떻게\" 숨길지 구현 (접근 제어자)\n\nAbstraction은 설계 단계, Encapsulation은 구현 단계.\n\n예: 리모컨의 버튼 = abstraction (복잡한 회로 숨김), private 회로 = encapsulation (접근 차단).\n\n---\n\n## Q3: Polymorphism의 두 가지 형태?\n\n**Compile-time (Static) - Overloading:**\n```cpp\nint add(int a, int b);\ndouble add(double a, double b);  // 같은 이름, 다른 파라미터\n```\n\n**⚠️ Overloading vs Overriding 각인 (어원):**\n- **Overloading** = **Load(짐)**을 여러 개 쌓음 = 같은 이름에 여러 버전 실음 → **static** (컴파일러가 선택)\n- **Overriding** = **Ride(올라탐)** = 부모 함수 위에 올라타 덮어씀 → **dynamic** (런타임 결정)\n\n**Runtime (Dynamic) - Overriding:**\n```cpp\nclass Animal { virtual void speak() { cout << \"...\"; } };\nclass Dog : public Animal { void speak() override { cout << \"Woof\"; } };\n\nAnimal* a = new Dog();\na->speak();  // \"Woof\" (vtable 통해 런타임 결정)\n```\n\n면접에서 물어보면 둘 다 언급하고, 주로 runtime polymorphism에 대해 깊이 설명.\n\n---\n\n## Follow-up: Composition over Inheritance란?\n\n- 상속: \"is-a\" 관계, 강한 결합, 부모 변경 시 자식에 영향.\n- 구성: \"has-a\" 관계, 느슨한 결합, 동작을 주입.\n\n```cpp\n// 상속: Dog IS-A Animal\nclass Dog : public Animal { };\n\n// 구성: Car HAS-A Engine\nclass Car {\n    Engine engine;  // 교체 가능, 유연\n};\n```\n\nGOF: \"상속보다 구성을 선호하라.\" 상속은 다형성 필요할 때만.\n",

   "tags": [],

   "desc": "",
   "qs": [
    "Q1: SOLID 각각 한 줄로 설명해보세요.",
    "Q2: Open/Closed를 실제로 어떻게 적용하나요?",
    "Q3: Dependency Inversion 예시?",
    "Follow-up: SOLID을 항상 다 지켜야 하나요?"
   ],
   "md": "## Q1: SOLID 각각 한 줄로 설명해보세요.\n\n- **S** - Single Responsibility: 클래스는 하나의 이유로만 변경되어야 함.\n- **O** - Open/Closed: 확장에는 열려있고, 수정에는 닫혀있어야 함.\n- **L** - Liskov Substitution: 자식 클래스는 부모 클래스를 대체할 수 있어야 함.\n- **I** - Interface Segregation: 클라이언트가 사용하지 않는 메서드에 의존하면 안 됨.\n- **D** - Dependency Inversion: 상위 모듈이 하위 모듈에 직접 의존하지 말고, 추상화에 의존해야 함.\n\n---\n\n## Q2: Open/Closed를 실제로 어떻게 적용하나요?\n\n나쁜 예:\n```cpp\ndouble area(Shape s) {\n    if (s.type == CIRCLE) return pi * s.r * s.r;\n    if (s.type == RECT) return s.w * s.h;\n    // 새 도형 추가할 때마다 이 함수 수정 필요\n}\n```\n\n좋은 예:\n```cpp\nclass Shape {\npublic:\n    virtual double area() = 0;\n};\n\nclass Circle : public Shape {\n    double area() override { return pi * r * r; }\n};\n// 새 도형 = 새 클래스 추가, 기존 코드 수정 없음.\n```\n\n**참고: virtual 함수 2종류**\n\n| | 선언 | 동작 |\n|---|------|------|\n| Pure virtual | `virtual double area() = 0;` | 구현 없음, 자식이 **반드시** override. 이게 있으면 추상 클래스 → 객체 생성 불가 |\n| 일반 virtual | `virtual double area() { return 0; }` | 기본 구현 있음, 자식이 override **선택**. 안 하면 부모 구현 사용 |\n\n- 구현 있는 건 → 그대로 쓸 수 있고\n- 구현 없는 건(`= 0`) → 무조건 상속받아 override 해야 함\n\n`virtual`의 의미: \"런타임에 실제 객체 타입의 버전을 호출해라\" (dynamic dispatch via vtable). 안 붙이면 포인터 타입 기준 정적 바인딩.\n\n```cpp\nAnimal* a = new Dog();\na->speak();  // virtual이면 Dog::speak(), 아니면 Animal::speak()\n```\n\n---\n\n## Q3: Dependency Inversion 예시?\n\n**뜻**: 상위 모듈(비즈니스 로직)이 하위 모듈(concrete 구현)에 직접 의존하지 말고, 둘 다 **추상화(인터페이스)에 의존**해라.\n\n- 의존 방향을 \"뒤집는다(inversion)\"는 의미\n- 상위 모듈 → concrete class (X)\n- 상위 모듈 → 인터페이스 ← concrete class (O)\n- 결과: 구현체를 자유롭게 교체 가능, 결합도 낮아짐\n\n**나쁜 예:** OrderService(핸드폰)가 MySQL(특정 케이블)에 납땜됨\n```cpp\nclass MySQLDatabase {\npublic:\n    void save(string data) { /* MySQL에 저장 */ }\n};\n\nclass OrderService {\n    MySQLDatabase db;                     // MySQL을 콕 집어서 들고 있음\npublic:\n    void placeOrder(string order) {\n        db.save(order);                   // MySQL에 직접 저장\n    }\n};\n// 문제: PostgreSQL로 바꾸려면 OrderService 내부 코드를 뜯어고쳐야 함\n```\n\n**좋은 예:** OrderService(핸드폰)는 Database(USB-C 규격)만 바라봄\n```cpp\n// 1. 규격(인터페이스) 정의 - USB-C 포트\nclass Database {\npublic:\n    virtual void save(string data) = 0;\n    virtual ~Database() {}\n};\n\n// 2. 규격을 따르는 concrete 구현들 - 각종 케이블\nclass MySQLDatabase : public Database {\npublic:\n    void save(string data) override { /* MySQL에 저장 */ }\n};\n\nclass PostgresDatabase : public Database {\npublic:\n    void save(string data) override { /* Postgres에 저장 */ }\n};\n\n// 3. 상위 모듈 - 핸드폰, 어떤 케이블인지 모름, 규격만 앎.\nclass OrderService {\n    Database& db;                          // \"Database면 아무거나\"\npublic:\n    OrderService(Database& d) : db(d) {}   // 외부에서 꽂아줌 (의존성 주입)\n    void placeOrder(string order) {\n        db.save(order);                    // 규격에 대고 호출\n    }\n};\n\n// 사용처에서 원하는 걸 꽂아줌\nMySQLDatabase mysql;\nOrderService svc(mysql);                   // MySQL 꽂기\n// PostgresDatabase pg; OrderService svc(pg);  // Postgres로 교체해도 OrderService 코드 변경 0\n```\n\n핵심: OrderService를 짜는 시점에 어떤 DB 쓸지 몰라도 됨. `Database` 규격만 정해두면, 실제 DB는 외부에서 주입.\n테스트할 때 mock DB 주입 가능 → 테스트 용이성 향상.\n\n---\n\n## Follow-up: SOLID을 항상 다 지켜야 하나요?\n\n아님. Over-engineering 주의, 예:\n- 간단한 스크립트에 SOLID 풀세트 적용하면 오히려 복잡\n- 팀 규모, 프로젝트 수명에 따라 적절히 trade-off\n- \"변경이 예상되는 곳\"에 집중 적용하는 게 실무적\n",

   "md": "## Q1: Context switch란?\n\nCPU가 현재 실행 중인 프로세스/스레드를 멈추고, 다른 프로세스/스레드로 전환하는 과정.\n\n순서:\n1. 현재 프로세스 상태를 PCB에 저장 (레지스터, PC, stack pointer)\n2. 스케줄러가 다음 프로세스 선택\n3. 선택된 프로세스의 PCB에서 상태 복원\n4. 실행 재개\n\n---\n\n## Q2: Context switch의 비용은?\n\n**직접 비용:**\n- 레지스터 저장/복원\n- 메모리 매핑 변경 (page table 교체)\n- 커널 모드 진입/복귀\n\n**간접 비용 (더 큼):**\n- CPU cache 무효화 (cache cold start)\n- TLB flush (프로세스 전환 시)\n- Pipeline flush\n\n일반적으로 수 마이크로초 ~ 수십 마이크로초. 빈번하면 성능에 큰 영향.\n\n---\n\n## Q3: 스레드 간 context switch가 프로세스 간보다 빠른 이유는?\n\n같은 프로세스 내 스레드는:\n- 같은 address space 공유 → page table 교체 불필요\n- TLB flush 불필요\n- 캐시 hit 확률 높음 (공유 메모리)\n\n저장/복원할 것: 레지스터, PC, stack pointer 정도만.\n\n---\n\n## Follow-up: Context switch가 언제 발생하나요?\n\n- **Timer interrupt** - time slice 만료 (preemptive scheduling)\n- **I/O 요청** - 현재 프로세스가 blocking I/O 호출\n- **System call** - 커널 서비스 요청\n- **Higher priority process** - 더 높은 우선순위 프로세스가 ready 상태로 전환\n",

   "qs": [
    "Q1: Deadlock이란? 발생 조건 4가지는?",
    "Q2: Deadlock을 어떻게 해결하나요?",

   "md": "## 기준 코드 — 계좌 이체\n\n이 파일의 Q1 부터 Follow-up 까지 **전부 이 코드 하나** 를 놓고 답한다.\n목록을 외우는 게 아니라, 이 코드에서 뭐가 어디에 있는지를 본다.\n\n```cpp\nstruct Account { int id; int balance; mutex mtx; };\nAccount acc1{1, 1000, {}};   // 락이 지키는 건 balance. mutex 자체는 자원이 아니다\nAccount acc2{2, 1000, {}};\n\nvoid transfer(Account& from, Account& to, int amount) {\n    from.mtx.lock();          // ①\n    to.mtx.lock();            // ②\n    from.balance -= amount;\n    to.balance   += amount;\n    to.mtx.unlock();\n    from.mtx.unlock();\n}\n\n// 두 스레드가 동시에\ntransfer(acc1, acc2, 100);   // 스레드1\ntransfer(acc2, acc1, 100);   // 스레드2\n```\n\n이 코드는 멈춘다.\n왜 멈추는지가 Q1, 어떻게 살릴지가 Q2, 정확히 어디서 엇갈리는지가 Q3 다.\n\n---\n\n## Q1: Deadlock이란? 발생 조건 4가지는?\n\n두 개 이상의 프로세스가 서로 상대방이 가진 자원을 기다리면서 무한히 대기하는 상태.\n\n**4가지 조건이 위 코드의 어디에 있는지:**\n\n| 조건 | 이 코드의 어디 |\n|---|---|\n| **Mutual Exclusion** | `mutex` 다. 한 번에 한 스레드만 그 계좌의 balance 를 건드린다 |\n| **Hold and Wait** | ① 을 쥔 채로 ② 를 기다린다. 놓지 않고 기다리는 게 핵심이다 |\n| **No Preemption** | 남이 쥔 `mtx` 를 뺏어올 방법이 없다. 놓을 때까지 기다릴 뿐이다 |\n| **Circular Wait** | 스레드1 은 acc2 를, 스레드2 는 acc1 을 기다린다. 화살표가 고리를 이룬다 |\n\n네 줄이 전부 이 6줄짜리 함수 안에 있다.\n그래서 이런 코드는 특별히 이상하지 않아도 데드락이 난다.\n\n### 외우는 법: PEACH 🍑\n\n```\nP   No Preemption      뺏을 수 없다\nE   Mutual Exclusion   나만 쓴다\nA   All four           넷 다 있어야 데드락이다\nC   Circular Wait      고리를 이룬다\nH   Hold and Wait      쥔 채로 기다린다\n```\n\n**A 는 조건이 아니라 성질이다.** ⭐️\n네 조건이 **전부** 모여야 데드락이 생긴다.\n뒤집으면 **하나만 깨도 안 생긴다.**\n\nA 를 빼먹으면 PEACH 는 그냥 외운 글자 네 개로 끝난다.\nA 가 있어야 Q2 가 성립한다 — **해결책이란 곧 \"넷 중 하나를 깨는 방법\" 이다.**\n\n---\n\n## Q2: Deadlock을 어떻게 해결하나요?\n\n같은 코드를 놓고, 네 가지 답이 있다.\n\n### P — Prevention (예방): 코드를 고쳐서 조건 하나를 없앤다\n\n**Circular Wait 를 깬다.** 인자 순서가 아니라 **id 순서** 로 잠근다.\n\n```cpp\nAccount& first  = (from.id < to.id) ? from : to;\nAccount& second = (from.id < to.id) ? to   : from;\nfirst.mtx.lock();\nsecond.mtx.lock();\n```\n\n누가 어떤 순서로 부르든 항상 id 작은 것부터 잠근다.\n고리가 생길 수 없다. → 자세한 건 Q3.\n\n### A — Avoidance (회피): 잠그기 전에 안전한지 계산한다\n\n이체 요청이 올 때마다 \"지금 이 둘을 잠그면 교착 가능성이 생기나\" 를 미리 따져보고 허락한다.\nBanker's Algorithm 이 이것이다.\n계좌 이체에는 과하다. 매 요청마다 계산 비용이 붙는다.\n\n### I — Ignorance (무시): 아무것도 안 한다\n\n그냥 둔다.\n멈추면 사람이 재시작한다.\n\n**실제 대부분의 OS 가 고르는 게 이것이다.** ⭐️\n데드락은 자주 안 나서 앞의 셋이 수지가 안 맞는다.\n모래에 머리 박는다고 **타조 알고리즘** 이라고 부른다.\n\n### D — Detection + Recovery (탐지 + 복구): 터진 뒤에 수습한다\n\n누가 누구를 기다리는지 그래프로 들고 있다가 사이클이 생기면 잡아낸다.\n잡으면 한쪽 `transfer` 를 강제로 취소하고 롤백한다.\nDB 엔진이 실제로 이렇게 한다.\n\n### 외우는 법: PAID 💰\n\n```\nP   Prevention            코드를 고쳐서 조건 하나를 없앤다\nA   Avoidance             잠그기 전에 안전한지 계산한다\nI   Ignorance             그냥 둔다        <- 실제 답\nD   Detection + Recovery  터지면 잡아서 롤백한다\n```\n\n네 글자에 네 전략이 정확히 맞는다. 채운 글자가 없다.\n\n뜻도 통한다. 결국 **비용을 어디에 치를 것인가** 의 선택이다.\n\n| | 값을 치르는 지점 |\n|---|---|\n| Prevention | 설계 단계. 제약이 세져서 자원 활용도가 떨어진다 |\n| Avoidance | 할당할 때마다. 매번 안전한지 계산해야 한다 |\n| Ignorance | 안 치른다. 대신 가끔 멈춘다 |\n| Detection | 터진 뒤에. 탐지 비용 + 롤백 대가 |\n\n데드락은 공짜로 못 없앤다.\n어디서 PAID 할지만 고를 수 있다.\n\n---\n\n## Q3: 정확히 어디서 엇갈리나?\n\n같은 `from.mtx.lock()` 한 줄인데, `from` 이 가리키는 게 호출마다 다르다.\n\n```\ntransfer(acc1, acc2)   ->  from = acc1,  to = acc2   ->  acc1 잠그고 acc2 기다림\ntransfer(acc2, acc1)   ->  from = acc2,  to = acc1   ->  acc2 잠그고 acc1 기다림\n```\n\n함수 안에서는 둘 다 \"내 것 먼저\" 라는 같은 규칙이다.\n바깥에서 보면 잠그는 순서가 정반대다.\n\n```\n나쁜 코드 :  인자 순서대로 잠근다    -> 호출자마다 순서가 달라짐\n좋은 코드 :  id 순서대로 잠근다      -> 누가 부르든 순서가 같음\n```\n\n**왜 하필 id 인가** ⭐️\n\"먼저 온 쪽\" 이나 \"잔액이 많은 쪽\" 같은 **호출 시점에 달린 기준이면 안 된다.**\n누가 언제 부르든 같은 답이 나오는 **고정된 전역 기준** 이어야 순서가 통일된다.\nid 는 계좌에 박혀 있어서 절대 안 변한다. 그래서 쓸 수 있다.\n\n먼저 잠글 것을 못 잡은 쪽은 **아무것도 안 쥔 채** 기다린다.\nHold and Wait 도 같이 깨진다.\n\n순서를 통일하기 어려우면 `lock(m1, m2)` 로 두 락을 한꺼번에 잡는 방법도 있다.\n\n⚠️ 전제는 **동시 실행** 이다.\n두 호출을 순차로 하면 락 구간이 안 겹쳐서 순서가 반대여도 데드락이 안 난다.\n\n---\n\n## Follow-up: Deadlock vs Livelock vs Starvation?\n\n같은 코드를 **잘못 고치면** Livelock 이 나온다.\n\n```cpp\nvoid transfer(Account& from, Account& to, int amount) {\n    while (true) {\n        from.mtx.lock();\n        if (to.mtx.try_lock()) break;   // 둘 다 잡았다 -> 진행\n        from.mtx.unlock();              // 못 잡았으면 내 것도 놓고 양보한다\n    }\n    ...\n}\n```\n\n\"쥔 채로 기다리지 말고 양보하자\" 는 발상 자체는 맞다.\n그런데 두 스레드의 박자가 맞으면 **잡고 → 실패 → 놓고 → 다시 잡고** 를 영원히 반복한다.\n\n**멈춰 있지 않다. CPU 도 계속 쓴다. 그런데 아무도 이체를 못 끝낸다.**\n\n| | 상태 | 누가 못 하나 |\n|---|---|---|\n| **Deadlock** | **멈춰 있다.** 아무도 안 움직인다 | 걸린 전원 |\n| **Livelock** | **계속 움직인다.** 상태는 바뀌는데 진행이 없다 | 걸린 전원 |\n| **Starvation** | 시스템은 잘 돌아간다 | **특정 하나만** 계속 밀린다 |\n\nDeadlock 과 Livelock 은 **아무도 진행 못 한다** 는 결과가 같다.\n다른 건 멈춰 있느냐 바쁘게 움직이느냐다.\n그래서 Livelock 이 더 찾기 어렵다 — CPU 가 돌고 있어서 멈춘 것처럼 안 보인다.\n\nStarvation 은 결이 다르다.\n남들은 다 잘 돌아가는데 특정 스레드만 계속 순서가 안 온다.\n→ `concurrency/reader_writer.md` 의 writer starvation 이 같은 이야기다.\n\n복도 비유로 묶으면:\n\n```\nDeadlock    서로 마주 서서 아무도 안 비킨다\nLivelock    서로 동시에 같은 쪽으로 비켜서 또 막힌다. 계속 움직이는데 못 지나간다\nStarvation  나만 계속 뒤로 밀린다. 남들은 잘 지나간다\n```\n",

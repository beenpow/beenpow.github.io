<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LC Flashcards — Amazon30d + Blind75</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0f2f9;
  --surface: #ffffff;
  --surface2: #f4f5fc;
  --surface3: #eaecf8;
  --border: #dde0f0;
  --border2: #c4c9e8;
  --text: #1a1d30;
  --text2: #3d4270;
  --muted: #7880aa;
  --easy: #15803d; --medium: #b45309; --hard: #dc2626;
  --amazon: #c97200; --blind: #6d28d9;
  --solved: #15803d; --unsolved: #9ca3c0;
  --fire: #dc2626;
  --flip-duration: 0.45s;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
}

/* ── HEADER ─────────────────────────── */
header {
  background: #ffffff;
  border-bottom: 1px solid var(--border);
  padding: 14px 28px 12px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 8px rgba(100,110,180,0.08);
}
.header-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
header h1 {
  font-size: 1.1rem; font-weight: 700;
  background: linear-gradient(90deg, #6d28d9, #2563eb);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  flex-shrink: 0; letter-spacing: -0.01em;
}
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat {
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 4px 12px; border-radius: 20px;
  font-size: 0.76rem; color: var(--muted);
}
.stat span { color: var(--text); font-weight: 700; }

.filter-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.filter-divider {
  width: 1px; height: 22px; background: var(--border2);
  margin: 0 4px; flex-shrink: 0;
}
.filter-btn {
  padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--muted); cursor: pointer; font-size: 0.8rem;
  font-family: inherit; transition: all 0.15s; letter-spacing: 0.01em;
}
.filter-btn:hover { border-color: var(--border2); color: var(--text2); background: var(--surface3); }
/* Source filter active states */
.filter-btn.src.active {
  background: linear-gradient(135deg, #6d28d9, #2563eb);
  border-color: transparent; color: #fff; font-weight: 600;
  box-shadow: 0 2px 10px rgba(109,40,217,0.3);
}
.filter-btn.src.amazon.active { background: linear-gradient(135deg, #b45309, #f59e0b); border-color: transparent; color: #fff; box-shadow: 0 2px 10px rgba(180,83,9,0.3); }
.filter-btn.src.blind.active  { background: linear-gradient(135deg, #6d28d9, #a78bfa); border-color: transparent; color: #fff; box-shadow: 0 2px 10px rgba(109,40,217,0.35); }
/* Sub-filter active states */
.filter-btn.sub.active {
  background: rgba(202,138,4,0.15); border-color: rgba(202,138,4,0.55);
  color: #b45309; font-weight: 600;
}
.filter-btn.sub.fire.active { background: rgba(220,38,38,0.1); border-color: rgba(220,38,38,0.4); color: #dc2626; font-weight: 600; }
.filter-btn.sub.solved-btn.active { background: rgba(21,128,61,0.1); border-color: rgba(21,128,61,0.4); color: #15803d; font-weight: 600; }

/* ── GRID ───────────────────────────── */
main { padding: 20px 28px 60px; max-width: 1440px; margin: 0 auto; }
.section-label {
  display: flex; align-items: center; gap: 10px;
  margin: 34px 0 12px;
  font-size: 0.8rem; font-weight: 700;
  color: var(--text2);
  letter-spacing: 0.06em; text-transform: uppercase;
}
.section-label::before {
  content: '';
  display: inline-block;
  width: 4px; height: 1.1em;
  border-radius: 2px;
  background: linear-gradient(160deg, #6d28d9, #2563eb);
  flex-shrink: 0;
}
.section-label::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--border2), transparent);
}
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }

/* ── MINI CARD ──────────────────────── */
.mini-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 14px 12px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.mini-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(100,110,200,0.13);
  border-color: var(--border2);
}
.mini-card.solved { border-top: 2px solid var(--solved); padding-top: 12px; }
.mini-card.unsolved { border-top: 2px solid var(--unsolved); padding-top: 12px; opacity: 0.75; }
.mini-card.unsolved:hover { opacity: 1; }

/* Top row: num on left, [review 🔥] + [dot] on right — NO overlap */
.mini-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 6px; margin-bottom: 7px;
}
.mini-num { font-size: 0.7rem; color: var(--muted); font-weight: 500; }
.mini-top-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.review-dots { font-size: 0.62rem; line-height: 1; }
.solved-dot   { width: 8px; height: 8px; border-radius: 50%; background: var(--solved); box-shadow: 0 0 5px rgba(21,128,61,0.4); }
.unsolved-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--unsolved); }

.mini-title { font-size: 0.87rem; font-weight: 600; line-height: 1.35; margin-bottom: 9px; color: var(--text); }
.mini-badges { display: flex; flex-wrap: wrap; gap: 4px; }
.badge { font-size: 0.67rem; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
.badge.easy   { background: rgba(21,128,61,0.1);  color: var(--easy);   border: 1px solid rgba(21,128,61,0.25); }
.badge.medium { background: rgba(180,83,9,0.1);   color: var(--medium); border: 1px solid rgba(180,83,9,0.25); }
.badge.hard   { background: rgba(220,38,38,0.1);  color: var(--hard);   border: 1px solid rgba(220,38,38,0.25); }
.badge.amazon { background: rgba(201,114,0,0.1);  color: var(--amazon); border: 1px solid rgba(201,114,0,0.25); }
.badge.blind  { background: rgba(109,40,217,0.1); color: var(--blind);  border: 1px solid rgba(109,40,217,0.25); }

/* ── STUDY OVERLAY ──────────────────── */
#overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(10,12,30,0.55);
  backdrop-filter: blur(8px);
  z-index: 200; align-items: center; justify-content: center; padding: 20px;
}
#overlay.active { display: flex; }
.overlay-inner { width: 100%; max-width: 700px; }
.overlay-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.overlay-counter { color: rgba(255,255,255,0.6); font-size: 0.82rem; }
.nav-btn {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #fff;
  padding: 8px 18px; border-radius: 10px; cursor: pointer; font-size: 0.82rem;
  font-family: inherit; transition: all 0.15s;
}
.nav-btn:hover { background: rgba(255,255,255,0.22); }
.close-btn {
  background: transparent; border: none; color: rgba(255,255,255,0.5); cursor: pointer;
  font-size: 1.2rem; padding: 4px 8px; border-radius: 6px; transition: all 0.15s;
}
.close-btn:hover { color: #fff; background: rgba(255,255,255,0.12); }

/* ── FLASHCARD FLIP ─────────────────── */
.flashcard-container { perspective: 1400px; height: 490px; }
.flashcard {
  width: 100%; height: 100%; position: relative;
  transform-style: preserve-3d;
  transition: transform var(--flip-duration) cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}
.flashcard.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0; backface-visibility: hidden;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 18px; padding: 30px; overflow-y: auto;
  box-shadow: 0 24px 60px rgba(10,20,80,0.18);
}
.card-back { transform: rotateY(180deg); }

/* ── CARD FRONT ─────────────────────── */
.card-front-num { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
.card-front-title { font-size: 1.55rem; font-weight: 700; margin-bottom: 14px; line-height: 1.2; letter-spacing: -0.02em; color: var(--text); }
.card-front-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
.card-front-desc { color: var(--text2); line-height: 1.75; font-size: 0.93rem; }
.card-front-solved {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.76rem; font-weight: 600; padding: 4px 12px; border-radius: 20px;
}
.card-front-solved.yes { background: rgba(21,128,61,0.1); color: var(--solved); border: 1px solid rgba(21,128,61,0.25); }
.card-front-solved.no  { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.card-front-link {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 20px; font-size: 0.78rem; color: var(--blind); text-decoration: none;
  background: rgba(109,40,217,0.07); padding: 5px 12px; border-radius: 8px;
  border: 1px solid rgba(109,40,217,0.18); transition: all 0.15s;
}
.card-front-link:hover { background: rgba(109,40,217,0.13); }

/* ── CARD BACK ──────────────────────── */
.back-label {
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted); margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.back-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.approach-block {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; margin-bottom: 10px;
  border-left: 3px solid var(--blind);
}
.approach-name { font-size: 0.88rem; font-weight: 700; color: var(--text); margin-bottom: 7px; }
.approach-detail { font-size: 0.83rem; color: var(--text2); line-height: 1.65; margin-bottom: 10px; }
.approach-complexity {
  font-size: 0.73rem; font-family: 'SF Mono', 'Cascadia Code', monospace;
  color: var(--easy); background: rgba(21,128,61,0.08);
  padding: 4px 10px; border-radius: 8px; display: inline-block;
  border: 1px solid rgba(21,128,61,0.2);
}
.notes-block {
  background: rgba(201,114,0,0.05); border: 1px solid rgba(201,114,0,0.18);
  border-radius: 12px; padding: 14px; margin-top: 10px;
  border-left: 3px solid var(--amazon);
}
.notes-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--amazon); margin-bottom: 8px; }
.notes-text { font-size: 0.83rem; color: var(--text2); line-height: 1.65; }

/* ── SHORTCUTS ──────────────────────── */
.hint { margin-top: 12px; }
.shortcuts { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.shortcut { font-size: 0.72rem; color: rgba(255,255,255,0.45); display: flex; align-items: center; gap: 4px; }
.key {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
  padding: 2px 7px; border-radius: 5px; font-family: monospace;
  color: rgba(255,255,255,0.7); font-size: 0.7rem;
}

/* ── EMPTY STATE ────────────────────── */
.empty { text-align: center; padding: 80px 20px; color: var(--muted); font-size: 0.95rem; }

/* ── RESPONSIVE ─────────────────────── */
@media (max-width: 640px) {
  /* Header */
  header { padding: 12px 16px 10px; }
  .header-top { gap: 10px; margin-bottom: 8px; }
  header h1 { font-size: 1rem; }
  .stats { gap: 6px; }
  .stat { font-size: 0.72rem; padding: 3px 9px; }
  .filter-row { gap: 5px; }
  .filter-btn { font-size: 0.75rem; padding: 4px 11px; }
  .filter-divider { display: none; }

  /* Grid */
  main { padding: 14px 12px 50px; }
  .section-label { font-size: 0.72rem; margin: 22px 0 8px; }
  .card-grid { grid-template-columns: 1fr 1fr; gap: 8px; }

  /* Mini card */
  .mini-card { padding: 11px 11px 10px; border-radius: 10px; }
  .mini-title { font-size: 0.8rem; margin-bottom: 7px; }
  .badge { font-size: 0.62rem; padding: 2px 6px; }

  /* Overlay */
  #overlay { padding: 12px; align-items: flex-end; }
  .overlay-inner { max-width: 100%; }
  .overlay-nav { margin-bottom: 8px; }
  .nav-btn { padding: 7px 14px; font-size: 0.78rem; }
  .overlay-counter { font-size: 0.76rem; }

  /* Flashcard */
  .flashcard-container { height: 420px; }
  .card-face { padding: 22px 20px; border-radius: 14px; }
  .card-front-title { font-size: 1.2rem; margin-bottom: 10px; }
  .card-front-badges { gap: 5px; margin-bottom: 16px; }
  .card-front-desc { font-size: 0.86rem; line-height: 1.65; }
  .card-front-link { font-size: 0.74rem; padding: 4px 10px; margin-top: 14px; }
  .approach-block { padding: 13px; margin-bottom: 8px; }
  .approach-name { font-size: 0.84rem; }
  .approach-detail { font-size: 0.79rem; margin-bottom: 8px; }
  .approach-complexity { font-size: 0.69rem; padding: 3px 8px; }
  .notes-block { padding: 12px; }
  .notes-text { font-size: 0.79rem; }

  /* Shortcuts */
  .shortcuts { gap: 10px; }
  .shortcut { font-size: 0.68rem; }
}

/* show/hide hints by device */
.mobile-only { display: none; }
.desktop-only { display: flex; }
@media (max-width: 640px) {
  .mobile-only { display: flex; }
  .desktop-only { display: none; }
}

@media (max-width: 380px) {
  .card-grid { grid-template-columns: 1fr; }
  .flashcard-container { height: 400px; }
  .card-front-title { font-size: 1.1rem; }
}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>⚡ LC Flashcards</h1>
    <div class="stats" id="stats"></div>
  </div>
  <div class="filter-row" id="filters">
    <button class="filter-btn src active" data-src="all">All</button>
    <button class="filter-btn src amazon" data-src="amazon">Amazon30d</button>
    <button class="filter-btn src blind" data-src="blind">Blind75</button>
    <div class="filter-divider"></div>
    <button class="filter-btn sub" data-sub="unsolved">❌ 미풀이</button>
    <button class="filter-btn sub fire" data-sub="review">🔥 리뷰 필요</button>
    <button class="filter-btn sub solved-btn" data-sub="solved">✅ 풀이 완료</button>
  </div>
</header>

<main id="main"></main>

<!-- Study Overlay -->
<div id="overlay">
  <div class="overlay-inner">
    <div class="overlay-nav">
      <button class="nav-btn" id="prev-btn">← Prev</button>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="overlay-counter" id="counter"></span>
        <button class="close-btn" id="close-btn">✕</button>
      </div>
      <button class="nav-btn" id="next-btn">Next →</button>
    </div>
    <div class="flashcard-container">
      <div class="flashcard" id="flashcard">
        <div class="card-face card-front" id="card-front"></div>
        <div class="card-face card-back" id="card-back"></div>
      </div>
    </div>
    <div class="hint">
      <div class="shortcuts desktop-only">
        <span class="shortcut"><span class="key">Space</span> 뒤집기</span>
        <span class="shortcut"><span class="key">←</span><span class="key">→</span> 이전/다음</span>
        <span class="shortcut"><span class="key">Esc</span> 닫기</span>
      </div>
      <div class="shortcuts mobile-only">
        <span class="shortcut">탭하면 뒤집기 · 버튼으로 이동</span>
      </div>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// PROBLEM DATA
// tags: B=Blind75, A=Amazon30d
// review: 0-3 (0=none, 1=🔥, 2=🔥🔥, 3=🔥🔥🔥)
// solved: true/false
// approaches: [{name, detail, tc, sc}]
// myNotes: string
// ─────────────────────────────────────────────
const PROBLEMS = [
// ═══════════════════════════════════════════════════
// 1. Array / HashMap
// ═══════════════════════════════════════════════════
{
  num:1, title:"Two Sum", diff:"E", tags:["B"], cat:"Array / HashMap",
  solved:true, review:0,
  link:"https://leetcode.com/problems/two-sum/",
  desc:"정수 배열 nums와 target이 주어질 때, 합이 target이 되는 두 원소의 인덱스를 반환. 정확히 하나의 답이 존재하고, 같은 원소를 두 번 쓸 수 없음.",
  approaches:[
    {name:"HashMap (One-pass)", detail:"순회하면서 target − nums[i]가 map에 있으면 반환. 없으면 nums[i]를 map에 추가.", tc:"O(n)", sc:"O(n)"},
    {name:"Brute Force", detail:"이중 루프로 모든 (i, j) 쌍 확인.", tc:"O(n²)", sc:"O(1)"}
  ],
  myNotes:""
},
{
  num:49, title:"Group Anagrams", diff:"M", tags:["B"], cat:"Array / HashMap",
  solved:true, review:0,
  link:"https://leetcode.com/problems/group-anagrams/",
  desc:"문자열 배열 strs에서 애너그램끼리 묶어서 반환.",
  approaches:[
    {name:"Sorted string as key", detail:"각 단어를 정렬해서 HashMap의 key로 사용. 같은 key끼리 그룹핑.", tc:"O(n·k·log k)", sc:"O(n·k)"},
    {name:"Char count as key", detail:"26자리 freq 배열을 tuple로 key 사용 (정렬 없이 O(k)).", tc:"O(n·k)", sc:"O(n·k)"}
  ],
  myNotes:""
},
{
  num:128, title:"Longest Consecutive Sequence", diff:"M", tags:["B"], cat:"Array / HashMap",
  solved:true, review:2,
  link:"https://leetcode.com/problems/longest-consecutive-sequence/",
  desc:"정렬되지 않은 정수 배열에서 가장 긴 연속 수열의 길이를 O(n)에 반환.",
  approaches:[
    {name:"HashSet + Sequence Start", detail:"모든 값을 set에 넣고, n−1이 set에 없는 값(시작점)에서만 카운트 시작. 중복 탐색 방지.", tc:"O(n)", sc:"O(n)"}
  ],
  myNotes:""
},
{
  num:121, title:"Best Time to Buy and Sell Stock", diff:"E", tags:["A","B"], cat:"Array / HashMap",
  solved:true, review:0,
  link:"https://leetcode.com/problems/best-time-to-buy-and-sell-stock/",
  desc:"prices[i] = i번째 날 주가. 하루 매수 하루 매도로 최대 이익 계산. 이익 없으면 0 반환.",
  approaches:[
    {name:"One-pass min tracking", detail:"최솟값 min_price를 갱신하며 순회. 각 날에서 profit = price − min_price. max_profit 업데이트.", tc:"O(n)", sc:"O(1)"},
    {name:"Brute Force", detail:"모든 (buy, sell) 쌍 O(n²).", tc:"O(n²)", sc:"O(1)"}
  ],
  myNotes:""
},
{
  num:5, title:"Longest Palindromic Substring", diff:"M", tags:["B"], cat:"Array / HashMap",
  solved:true, review:3,
  link:"https://leetcode.com/problems/longest-palindromic-substring/",
  desc:"문자열 s에서 가장 긴 팰린드롬 부분문자열을 반환.",
  approaches:[
    {name:"Expand Around Center", detail:"각 인덱스(홀수 길이)와 각 인접 쌍(짝수 길이)을 기준으로 양쪽 확장. O(n²)/O(1).", tc:"O(n²)", sc:"O(1)"},
    {name:"Manacher's Algorithm", detail:"모든 위치의 팰린드롬 반경을 O(n)에 계산. 이전 계산 결과 재활용.", tc:"O(n)", sc:"O(n)"}
  ],
  myNotes:"Manacher's O(n) 가능 → 꼭 익혀두기"
},
{
  num:169, title:"Majority Element", diff:"E", tags:["A"], cat:"Array / HashMap",
  solved:true, review:1,
  link:"https://leetcode.com/problems/majority-element/",
  desc:"n개 원소 배열에서 n/2번 초과 등장하는 majority element 반환. 항상 존재.",
  approaches:[
    {name:"Boyer-Moore Voting", detail:"candidate와 count 유지. count=0이면 candidate 교체. count는 같으면 +1 다르면 −1.", tc:"O(n)", sc:"O(1)"},
    {name:"HashMap", detail:"빈도 세고 n/2 초과인 것 반환.", tc:"O(n)", sc:"O(n)"}
  ],
  myNotes:"Boyer-Moore Voting Algorithm 필수! 공간 O(1) 가능."
},
{
  num:217, title:"Contains Duplicate", diff:"E", tags:["A","B"], cat:"Array / HashMap",

}
];

// ─────────────────────────────────────────────
// APP STATE
// ─────────────────────────────────────────────
let srcFilter = 'all';   // 'all' | 'amazon' | 'blind'
let subFilter = null;    // null | 'unsolved' | 'review' | 'solved'
let filteredProblems = [...PROBLEMS];
let studyIndex = 0;
let isFlipped = false;

// ─────────────────────────────────────────────
// FILTER
// ─────────────────────────────────────────────
function applyFilters() {
  // 1. Source filter
  let base;
  switch (srcFilter) {
    case 'amazon': base = PROBLEMS.filter(p => p.tags.includes('A')); break;
    case 'blind':  base = PROBLEMS.filter(p => p.tags.includes('B')); break;
    default:       base = [...PROBLEMS]; break;
  }
  // 2. Sub-filter (stacked on top)
  switch (subFilter) {
    case 'unsolved': filteredProblems = base.filter(p => !p.solved); break;
    case 'review':   filteredProblems = base.filter(p => p.review > 0); break;
    case 'solved':   filteredProblems = base.filter(p => p.solved); break;
    default:         filteredProblems = base; break;
  }
  renderGrid();
  updateStats();
}

// ─────────────────────────────────────────────
// RENDER GRID
// ─────────────────────────────────────────────
function getReviewEmoji(r) {
  if (r === 0) return '';
  return '🔥'.repeat(r);
}
function getDiffClass(d) { return d === 'E' ? 'easy' : d === 'M' ? 'medium' : 'hard'; }
function getDiffLabel(d) { return d === 'E' ? 'Easy' : d === 'M' ? 'Medium' : 'Hard'; }

function renderGrid() {
  const main = document.getElementById('main');
  if (filteredProblems.length === 0) {
    main.innerHTML = '<div class="empty">해당 조건의 문제가 없습니다.</div>';
    return;
  }
  // Group by category
  const grouped = {};
  filteredProblems.forEach(p => {
    if (!grouped[p.cat]) grouped[p.cat] = [];
    grouped[p.cat].push(p);
  });
  let html = '';
  for (const cat in grouped) {
    html += `<div class="section-label">${cat}</div><div class="card-grid">`;
    grouped[cat].forEach(p => {
      const idx = filteredProblems.indexOf(p);
      const solvedClass = p.solved ? 'solved' : 'unsolved';
      const dot = p.solved
        ? '<div class="solved-dot" title="풀었음"></div>'
        : '<div class="unsolved-dot" title="미풀이"></div>';
      const review = p.review > 0 ? `<span class="review-dots">${'🔥'.repeat(p.review)}</span>` : '';
      const tagBadges = p.tags.map(t =>
        t === 'A' ? '<span class="badge amazon">Amazon</span>' : '<span class="badge blind">Blind75</span>'
      ).join('');
      html += `
        <div class="mini-card ${solvedClass}" onclick="openStudy(${idx})">
          <div class="mini-top">
            <div class="mini-num">#${p.num}</div>
            <div class="mini-top-right">
              ${review}
              ${dot}
            </div>
          </div>
          <div class="mini-title">${p.title}</div>
          <div class="mini-badges">
            <span class="badge ${getDiffClass(p.diff)}">${getDiffLabel(p.diff)}</span>
            ${tagBadges}
          </div>
        </div>`;
    });
    html += '</div>';
  }
  main.innerHTML = html;
}

// ─────────────────────────────────────────────
// STATS
// ─────────────────────────────────────────────
function updateStats() {
  const total = PROBLEMS.length;
  const solved = PROBLEMS.filter(p => p.solved).length;
  const amazon = PROBLEMS.filter(p => p.tags.includes('A')).length;
  const amazonSolved = PROBLEMS.filter(p => p.tags.includes('A') && p.solved).length;
  const blind = PROBLEMS.filter(p => p.tags.includes('B')).length;
  const blindSolved = PROBLEMS.filter(p => p.tags.includes('B') && p.solved).length;
  const needReview = PROBLEMS.filter(p => p.review > 0).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat">전체 <span>${solved}/${total}</span></div>
    <div class="stat">Amazon <span>${amazonSolved}/${amazon}</span></div>
    <div class="stat">Blind75 <span>${blindSolved}/${blind}</span></div>
    <div class="stat">🔥 리뷰 <span>${needReview}</span></div>
  `;
}

// ─────────────────────────────────────────────
// STUDY MODE
// ─────────────────────────────────────────────
function openStudy(idx) {
  studyIndex = idx;
  isFlipped = false;
  document.getElementById('overlay').classList.add('active');
  renderCard();
}

function closeStudy() {
  document.getElementById('overlay').classList.remove('active');
  isFlipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
}

function renderCard() {
  const p = filteredProblems[studyIndex];
  if (!p) return;

  // Update counter
  document.getElementById('counter').textContent = `${studyIndex + 1} / ${filteredProblems.length}`;

  // Reset flip
  const fc = document.getElementById('flashcard');
  fc.classList.remove('flipped');
  isFlipped = false;

  // FRONT
  const solvedBadge = p.solved
    ? '<span class="card-front-solved yes">✅ 풀었음</span>'
    : '<span class="card-front-solved no">⬜ 미풀이</span>';
  const tagBadges = p.tags.map(t =>
    t === 'A' ? '<span class="badge amazon">Amazon30d</span>' : '<span class="badge blind">Blind75</span>'
  ).join('');
  const review = p.review > 0 ? `<span class="badge" style="background:rgba(248,81,73,0.15);color:#f85149;border:1px solid rgba(248,81,73,0.3)">${'🔥'.repeat(p.review)} 리뷰</span>` : '';
  document.getElementById('card-front').innerHTML = `
    <div class="card-front-num">#${p.num}</div>
    <div class="card-front-title">${p.title}</div>
    <div class="card-front-badges">
      ${solvedBadge}
      <span class="badge ${getDiffClass(p.diff)}">${getDiffLabel(p.diff)}</span>
      ${tagBadges}
      ${review}
    </div>
    <div class="card-front-desc">${p.desc}</div>
    <a class="card-front-link" href="${p.link}" target="_blank" onclick="event.stopPropagation()">🔗 LeetCode에서 보기 →</a>
  `;

  // BACK
  let approachesHtml = p.approaches.map(a => `
    <div class="approach-block">
      <div class="approach-name">${a.name}</div>
      <div class="approach-detail">${a.detail}</div>
      <span class="approach-complexity">Time ${a.tc} &nbsp;|&nbsp; Space ${a.sc}</span>
    </div>
  `).join('');

  let notesHtml = '';
  if (p.myNotes && p.myNotes.trim()) {
    notesHtml = `
      <div class="notes-block">
        <div class="notes-label">📝 내 노트 / 후기</div>
        <div class="notes-text">${p.myNotes}</div>
      </div>
    `;
  }

  document.getElementById('card-back').innerHTML = `
    <div class="back-label">💡 풀이 접근법</div>
    ${approachesHtml}
    ${notesHtml}
  `;
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
}

function goNext() {
  if (studyIndex < filteredProblems.length - 1) {
    studyIndex++;
    renderCard();
  }
}

function goPrev() {
  if (studyIndex > 0) {
    studyIndex--;
    renderCard();
  }
}

// ─────────────────────────────────────────────
// EVENT LISTENERS
// ─────────────────────────────────────────────
document.getElementById('flashcard').addEventListener('click', flipCard);
document.getElementById('close-btn').addEventListener('click', closeStudy);
document.getElementById('next-btn').addEventListener('click', goNext);
document.getElementById('prev-btn').addEventListener('click', goPrev);
document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) closeStudy();
});

document.addEventListener('keydown', function(e) {
  const overlay = document.getElementById('overlay');
  if (!overlay.classList.contains('active')) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft') goPrev();
  if (e.key === 'Escape') closeStudy();
});

// Source filter buttons
document.querySelectorAll('.filter-btn.src').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn.src').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    srcFilter = this.dataset.src;
    applyFilters();
  });
});

// Sub-filter buttons (toggle)
document.querySelectorAll('.filter-btn.sub').forEach(btn => {
  btn.addEventListener('click', function() {
    const val = this.dataset.sub;
    if (subFilter === val) {
      // toggle off
      subFilter = null;
      document.querySelectorAll('.filter-btn.sub').forEach(b => b.classList.remove('active'));
    } else {
      subFilter = val;
      document.querySelectorAll('.filter-btn.sub').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
    }
    applyFilters();
  });
});

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
applyFilters();
</script>
</body>
</html>

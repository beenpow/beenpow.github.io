   "md": "> THEORY · fundamentals · T3\n\n## Q1: 임베딩이란 무엇이고 cosine similarity 로 비교하는 이유는?\n\n**30초.** 임베딩은 텍스트를 고정 길이 벡터로 바꾼 것으로, 뜻이 비슷하면 벡터가 가깝게 학습된다.\ncosine 은 벡터 길이를 무시하고 방향만 비교해 \"문서 길이\" 가 아니라 \"뜻\" 을 재기 위해서다.\n\n내적은 길이에 영향을 받아 긴 문서가 유리해진다.\ncosine = 내적 / (길이 × 길이) 라 -1 에서 1 사이다.\n임베딩 모델(bge · e5 · OpenAI text-embedding) 은 대조학습으로 \"같은 뜻 쌍은 가깝게, 다른 쌍은 멀게\" 학습된다.\n보통 벡터를 정규화해 저장하면 cosine 이 내적과 같아져 빠르다.\n\n## Q2: ANN(HNSW 등) 은 왜 필요하고 정확도와 무엇을 바꾸나요?\n\n**30초.** 문서 1 억 개 중 가장 가까운 10 개를 찾으려면 1 억 번 내적을 해야 하는데, ANN 은 그래프(HNSW) 나 양자화(IVF-PQ) 로 수천 번만 보고 거의 같은 답을 낸다.\n정확도(recall@k) 를 조금 내주고 속도를 수백 배 산다.\n\nHNSW 는 다층 그래프에서 위층의 성긴 노드로 대략 위치를 잡고 아래층에서 좁힌다.\nrecall 95% 에 1 ms 수준이다.\nFAISS · Milvus · pgvector 가 구현체다.\n\"정확 검색이 필요한가\" 를 먼저 물어야 하고 대부분 아니다.\n\n## Q3: RAG 의 파이프라인(청킹 → 임베딩 → 검색 → 프롬프트) 을 그려보세요. 어디서 품질이 깨지나요?\n\n**30초.** 문서를 청크(수백 토큰)로 자르고 → 각 청크를 임베딩해 벡터 DB 에 넣고 → 질문을 임베딩해 가까운 청크 k 개를 꺼내 → 프롬프트에 붙여 LLM 에 보낸다.\n\n```\n문서 ──청킹──▶ 청크들 ──임베딩──▶ 벡터 DB\n질문 ──임베딩──▶ 검색(top-k) ──▶ [질문 + 청크들] ──▶ LLM ──▶ 답\n```\n\n깨지는 지점은 청킹(답이 두 청크에 걸쳐 잘림), 검색(뜻은 비슷한데 답이 없는 청크), 프롬프트(청크가 많아 LLM 이 중간을 무시), 생성(청크에 없는 걸 지어냄).\n각 단계를 따로 평가해야 어디가 문제인지 안다.\n\n## Follow-up: RAG 와 긴 컨텍스트, 파인튜닝은 각각 언제 고르나요?\n\n**30초.** 지식이 자주 바뀌거나 출처가 필요하면 RAG, 문서가 컨텍스트에 다 들어가고 한 번만 쓰면 긴 컨텍스트, 형식·말투·도메인 어휘를 바꾸려면 파인튜닝이다.\n\nRAG 는 지식 주입이 아니라 \"참고 자료 제공\" 이고, 파인튜닝은 지식 주입이 약하고 형식 학습이 강하다.\n긴 컨텍스트는 간단하지만 매 요청 토큰 비용이 든다(프리픽스 캐시로 완화).\n셋을 섞는 게 보통이다: 파인튜닝으로 형식, RAG 로 최신 사실.\n\n",

   "qs": [
    "Q1: precision · recall · F1 · AUC 는 각각 언제 중요하나요?",
    "Q2: perplexity 는 무엇을 재고 왜 LLM 비교에 한계가 있나요?",
    "Q3: LLM-as-judge 는 언제 쓰고 무엇을 조심해야 하나요?",
    "Q4: 라벨러 간 일치도(IAA) 는 왜 재고, Fleiss κ 와 Krippendorff α 는 뭐가 다른가요?"
   ],
   "md": "> THEORY · fundamentals · T3\n\n## Q1: precision · recall · F1 · AUC 는 각각 언제 중요하나요?\n\n**30초.** precision 은 \"양성이라 한 것 중 진짜\" (오경보 비용이 클 때), recall 은 \"진짜 중 잡은 것\" (놓치는 비용이 클 때), F1 은 둘의 조화평균(둘 다 중요할 때), AUC 는 임계값에 무관한 순위 품질(임계값을 나중에 정할 때) 이다.\n\n스팸 필터는 precision(정상 메일을 스팸으로 보내면 안 됨), 암 검진은 recall(놓치면 안 됨).\n클래스 불균형이면 accuracy 는 무의미하고 F1 이나 AUC 를 본다.\n\n## Q2: perplexity 는 무엇을 재고 왜 LLM 비교에 한계가 있나요?\n\n**30초.** perplexity 는 모델이 다음 토큰을 평균적으로 얼마나 헷갈리는지(exp(평균 cross-entropy)) 다.\n낮을수록 좋지만, 토크나이저가 다르면 비교가 안 되고, 특정 능력(추론·지시 따르기)과 상관이 약하다.\n\n같은 텍스트에서 perplexity 10 은 \"매 토큰에서 10 개 중 하나를 고르는 수준\".\n사전학습 중 진행을 보는 데는 좋다.\n모델 간 비교는 같은 토크나이저여야 하고(바이트 단위로 정규화하기도 함), 채팅 품질은 perplexity 가 낮아도 나쁠 수 있다.\n그래서 벤치마크(MMLU · GSM8K · HumanEval) 와 사람 평가를 같이 본다.\n\n## Q3: LLM-as-judge 는 언제 쓰고 무엇을 조심해야 하나요?\n\n**30초.** 사람 평가가 너무 비쌀 때 강한 LLM(GPT-4 급) 에게 두 답 중 어느 게 나은지 고르게 하는 것이다.\n조심할 것은 위치 편향(먼저 보인 답 선호), 길이 편향(긴 답 선호), 자기 선호(같은 모델 계열 선호), 그리고 판정 모델 자체의 능력 한계다.\n\n쌍을 양쪽 순서로 두 번 물어 위치 편향을 상쇄하고, 사람 평가 일부와 일치도를 재서 판정 모델을 검증한다.\nMT-Bench · AlpacaEval · Arena-Hard 가 이 방식이다.\n\"판정 모델이 못 푸는 문제는 판정도 못 한다\" 가 한계다.\n\n## Q4: 라벨러 간 일치도(IAA) 는 왜 재고, Fleiss κ 와 Krippendorff α 는 뭐가 다른가요?\n\n**30초.** 라벨이 사람 판단이면 라벨 자체가 얼마나 믿을 만한지(사람끼리 얼마나 일치하나) 를 먼저 재야 모델 성능 숫자가 의미가 있다.\nFleiss κ 는 범주형 라벨에서 우연 일치를 뺀 일치도고, Krippendorff α 는 순서형·구간형 라벨과 결측을 다룰 수 있어 더 범용이다.\n\nCARE 에서 라벨이 1-5 순서형이고 라벨러마다 결측이 있어 Fleiss 는 부적합했다.\nFleiss 는 \"4 와 5\" 와 \"1 과 5\" 의 불일치를 같게 보고, 라벨 분포가 한쪽에 쏠리면 κ paradox(일치율이 높은데 κ 가 낮음) 가 난다.\nKrippendorff α(ordinal) 0.634 를 메인으로, 분포 쏠림에 강한 Gwet AC2 를 보조로 썼다.\n이진으로 바꾸면 다수결 정확도 96.6% 인데 κ·α 는 0.38 로 떨어지는 걸 paradox 로 설명했다. ⭐️\n\n---\n\n### 손댄 곳\n\n- CARE 논문 IAA 계산 (NLP/01-CARE/05-IAA/): Fleiss 부적합 판정, Krippendorff α(ordinal) 0.634 메인 + Gwet AC2 보조, κ paradox 설명\n",

   "qs": [
    "Q1: cross-entropy 가 분류·언어모델의 기본 loss 인 이유는?",
    "Q2: SGD → momentum → Adam → AdamW 로 가면서 무엇이 더해졋나요?",

   ],
   "md": "> THEORY · fundamentals · T3\n\n## Q1: cross-entropy 가 분류·언어모델의 기본 loss 인 이유는?\n\n**30초.** 모델이 내는 확률 분포와 정답(one-hot) 사이의 거리를 재는 가장 자연스러운 척도고, 정답 토큰의 확률을 최대화하는 것(maximum likelihood) 과 같다.\n\n-log p(정답) 이라 정답 확률이 1 이면 0, 0 에 가까우면 무한대로 커서 틀린 걸 강하게 벌준다.\nsoftmax 와 합치면 gradient 가 (예측 확률 - 정답) 으로 깔끔하다.\n언어모델의 \"다음 토큰 예측\" 이 정확히 이것이고, perplexity 는 exp(cross-entropy) 다.\n\n## Q2: SGD → momentum → Adam → AdamW 로 가면서 무엇이 더해졋나요?\n\n**30초.** SGD 는 gradient 방향으로 lr 만큼, momentum 은 이전 방향을 관성으로 더해 진동을 줄이고, Adam 은 파라미터마다 gradient 크기로 lr 을 자동 조절하고(2 차 모멘트), AdamW 는 weight decay 를 gradient 가 아니라 가중치에 직접 적용해 Adam 과 L2 의 충돌을 고쳤다.\n\nAdam 은 m(1 차)·v(2 차) 두 상태를 FP32 로 들고 있어 파라미터의 2 배 메모리가 든다.\n7B 면 56 GB 다.\nZeRO-1 이 이걸 샤딩하는 이유다.\nLLM 은 전부 AdamW(β1 0.9, β2 0.95) 다.\n\n## Q3: learning rate warmup 과 cosine decay 는 왜 쓰나요?\n\n**30초.** warmup 은 초기에 lr 을 0 에서 천천히 올려 Adam 의 2 차 모멘트 추정이 안정되기 전 큰 스텝을 막고, cosine decay 는 끝으로 가며 lr 을 부드럽게 줄여 최솟값 근처에서 진동하지 않게 한다.\n\n처음 몇천 스텝은 gradient 통계가 없어 Adam 이 과대 스텝을 낸다.\nwarmup 없이 큰 lr 로 시작하면 발산한다.\ncosine 은 \"처음엔 크게 탐색, 끝엔 작게 수렴\" 을 한 곡선으로 준다.\nWSD(warmup-stable-decay) 처럼 중간을 평평하게 두는 변형도 쓰인다.\n\n## Q4: gradient clipping 은 무엇을 막나요?\n\n**30초.** gradient 의 norm 이 임계값(보통 1.0)을 넘으면 그 비율로 줄여서, 한 배치의 이상치가 파라미터를 폭발시키는 걸 막는다.\n\nRNN 시절 gradient 폭발 대책이었고 트랜스포머도 쓴다.\nloss spike 의 1 차 방어선이다.\n\"gradient norm 로그\" 가 학습 모니터링의 기본 지표인 이유다.\nclipping 이 자주 걸리면 lr 이 너무 크다는 신호다.\n\n",

    "Q1: BatchNorm 은 무엇을 어느 축으로 정규화하나요? 왜 추론 때 다르게 동작하나요?",
    "Q2: LayerNorm 은 BatchNorm 과 축이 어떻게 다른가요? 왜 트랜스포머는 LayerNorm 을 쓰나요?",
    "Q3: 정규화가 학습을 안정시키는 이유를 한 문장으로?"
   ],
   "md": "> THEORY · fundamentals · T3\n\n## Q1: BatchNorm 은 무엇을 어느 축으로 정규화하나요? 왜 추론 때 다르게 동작하나요?\n\n**30초.** 배치 축으로, 즉 같은 feature 를 배치 안 모든 샘플에 걸쳐 평균 0 분산 1 로 맞춘다.\n추론 때는 배치가 없거나 1 이라 학습 중 저장한 이동평균(running mean/var) 을 쓴다.\n\n학습·추론 동작이 달라 버그가 잘 난다(eval 모드 깜빡).\n배치가 작으면 통계가 불안정하다.\nCNN 에서 표준이었고 트랜스포머에는 안 쓴다.\n\n## Q2: LayerNorm 은 BatchNorm 과 축이 어떻게 다른가요? 왜 트랜스포머는 LayerNorm 을 쓰나요?\n\n**30초.** LayerNorm 은 샘플 하나 안에서 feature 축으로 정규화한다.\n배치 크기와 무관하고 학습·추론이 같다.\n트랜스포머는 시퀀스 길이가 가변이고 토큰마다 독립적으로 정규화해야 해서 LayerNorm 이 맞는다.\n\nBatchNorm 은 토큰 위치마다 배치 통계를 내야 하는데 패딩과 가변 길이 때문에 엉망이 된다.\nLayerNorm 은 토큰 하나(4096 차원) 안에서만 계산하니 그런 문제가 없다.\nRMSNorm 은 LayerNorm 에서 평균 빼기를 뺀 것이다.\n\n## Q3: 정규화가 학습을 안정시키는 이유를 한 문장으로?\n\n**30초.** 각 층의 입력 분포를 고정해 뒤 층이 앞 층의 변화에 매번 적응할 필요가 없게 하고, 값의 스케일을 묶어 큰 lr 을 써도 발산하지 않게 한다.\n\n정규화가 없으면 깊은 층의 activation 이 폭발하거나 0 이 된다.\nresidual 과 pre-norm 이 합쳐져 100 층짜리 모델이 학습되는 것이다.\n\n",

   "md": "> THEORY · gpu · T1\n\n## Q1: SM · warp · thread block 의 관계를 설명해보세요. warp 가 32 인 게 왜 중요한가요?\n\n**30초.** SM 은 독립 연산 유닛(H100 은 132 개), warp 는 SM 이 한 명령을 동시에 적용하는 스레드 32 개 묶음, thread block 은 프로그래머가 짠 스레드 묶음으로 SM 하나에 올라간다.\n\nthread block 은 warp 단위로 잘려 SM 의 스케줄러에 들어간다.\nwarp 32 개 스레드는 같은 명령을 같은 순간에 실행한다(SIMT).\n그래서 32 개가 같은 길로 가야 빠르고, if 로 갈라지면(divergence) 양쪽을 차례로 돌아 느려진다.\n메모리 접근도 32 개가 연속 주소를 읽어야 한 번에 가져온다(coalescing).\n32 는 하드웨어가 한 번에 처리하는 폭이라 성능의 기본 단위다. ⭐️\n\n## Q2: HBM · L2 · shared memory(SRAM) · register 의 크기와 대역폭을 대략 말해보세요 (H100 기준).\n\n**30초.** HBM 80 GB · 3.35 TB/s, L2 50 MB, shared memory SM 당 228 KB (약 33 TB/s 급), register SM 당 256 KB.\n\n| 층 | 크기 (H100 SXM) | 대역폭 | 비고 |\n|---|---|---|---|\n| HBM3 | 80 GB | 3.35 TB/s | 가중치·KV 가 여기 |\n| L2 | 50 MB | 수 TB/s | 자동 캐시 |\n| shared memory (SRAM) | 228 KB / SM | 수십 TB/s 합산 | 프로그래머가 직접 쓰는 캐시 |\n| register | 256 KB / SM | 가장 빠름 | 스레드 전용 |\n\nHBM 과 SRAM 사이 대역폭 차가 10 배라 \"HBM 을 몇 번 왕복하나\" 가 커널 속도를 정한다.\nFlashAttention 이 빠른 이유가 이 표에 있다.\n출처: NVIDIA H100 datasheet, CUDA C Programming Guide.\n\n## Q3: tensor core 는 무엇을 빨리 하나요? 어떤 연산은 혜택이 없나요?\n\n**30초.** 행렬곱(matmul)을 하드웨어로 한 번에 하는 유닛이라 matmul 이 아닌 연산(softmax·LayerNorm·elementwise)은 혜택이 없다.\n\ntensor core 는 작은 행렬 블록(예: 16×16) 곱을 한 명령으로 처리한다.\nBF16 입력, FP32 누적이 기본이고 FP8 은 2 배 빠르다.\nH100 BF16 dense 약 990 TFLOPS 가 전부 tensor core 숫자다.\n일반 CUDA core 의 FP32 는 67 TFLOPS 라 15 배 차이다.\n그래서 모델 연산의 90% 이상인 matmul 은 빠른데, 나머지 10% 의 elementwise 가 시간을 먹어 fusion 이 중요해진다.\n\n## Q4: GPU 와 CPU 가 근본적으로 다른 설계 목표는?\n\n**30초.** CPU 는 한 스레드를 빨리(큰 캐시·분기 예측·낮은 레이턴시), GPU 는 수천 스레드를 한꺼번에(작은 캐시·높은 처리량·레이턴시는 다른 warp 로 숨김) 설계했다.\n\nCPU 코어는 레이턴시를 줄이는 데 트랜지스터를 쓴다.\nGPU 는 레이턴시를 줄이지 않고, 한 warp 가 메모리를 기다리는 동안 다른 warp 를 실행해 숨긴다.\n그래서 GPU 는 \"같은 일을 많은 데이터에\" 가 맞고, 분기 많고 순차적인 일은 CPU 가 맞다.\n추론 서버에서 토크나이즈·스케줄링은 CPU, 행렬곱은 GPU 인 이유다.\n\n## Follow-up: 메모리 대역폭 3.35 TB/s 와 연산 ~1000 TFLOPS 가 뜻하는 ridge point 는 어디인가요?\n\n**30초.** 약 295 FLOP/byte 다.\n읽은 바이트 하나당 295 번 연산해야 연산기가 꽉 찬다.\n\n990e12 / 3.35e12 ≈ 295.\n배치 1 decode 의 matvec 은 가중치 2 바이트 읽어 2 FLOP 하니 1 FLOP/byte 로 295 분의 1 만 쓴다.\n배치 295 쯤 돼야 ridge point 에 닿는다.\n이 숫자 하나가 \"decode 는 배치를 키워야 한다\" 의 근거다.\n\n",

   "qs": [
    "Q1: arithmetic intensity(FLOPs/byte) 를 정의하고 ridge point 가 무엇인지 설명해보세요.",
    "Q2: 큰 matmul 과 decode 의 matvec 은 roofline 어디에 떨어지나요? 왜?",
    "Q3: attention 은 compute-bound 인가요 memory-bound 인가요? 시퀀스 길이에 따라 어떻게 바뀌나요?",
    "Q4: MFU 와 MBU 는 무엇을 재고 어떻게 계산하나요?",

   "md": "> THEORY · gpu · T1\n\n## Q1: arithmetic intensity(FLOPs/byte) 를 정의하고 ridge point 가 무엇인지 설명해보세요.\n\n**30초.** arithmetic intensity 는 메모리에서 읽은 바이트당 연산 횟수(FLOP/byte), ridge point 는 그 값이 peak FLOPS / peak 대역폭 과 같아지는 지점이다.\n\nroofline 은 x 축 intensity, y 축 달성 FLOPS 인 그래프다.\n왼쪽은 대역폭 × intensity 로 올라가는 기울기(memory-bound), 오른쪽은 peak FLOPS 수평선(compute-bound) 이다.\n둘이 만나는 x 가 ridge point 다.\nH100 BF16 은 990 TFLOPS / 3.35 TB/s ≈ 295 FLOP/byte.\n커널의 intensity 가 295 보다 작으면 메모리가, 크면 연산이 한계다. ⭐️\n\n## Q2: 큰 matmul 과 decode 의 matvec 은 roofline 어디에 떨어지나요? 왜?\n\n**30초.** 큰 matmul 은 오른쪽(compute-bound), decode 의 matvec 은 맨 왼쪽(memory-bound) 이다.\n\nM×K 와 K×N 행렬곱은 2MNK FLOP 에 (MK + KN + MN) × 2 바이트를 읽고 쓴다.\nM=N=K=4096 이면 intensity ≈ 1365 로 ridge 를 넘는다.\ndecode 는 M=1(토큰 1 개) 이라 2K·N FLOP 에 K·N × 2 바이트, intensity ≈ 1 이다.\n가중치를 읽기만 하고 거의 안 쓰는 셈이다.\n배치 B 를 키우면 M=B 가 되어 intensity 가 B 에 비례해 오른다.\n\n## Q3: attention 은 compute-bound 인가요 memory-bound 인가요? 시퀀스 길이에 따라 어떻게 바뀌나요?\n\n**30초.** 시퀀스가 짧으면 memory-bound, 길어지면 compute-bound 쪽으로 간다.\n단 표준 구현은 n² 행렬을 HBM 에 쓰느라 항상 memory-bound 에 가깝다.\n\nQK^T 는 n×d · d×n 으로 2n²d FLOP 인데, 표준 구현은 n² 점수 행렬을 HBM 에 쓰고 softmax 하고 다시 읽는다.\n그 왕복이 n² × 바이트라 intensity 가 d 수준(128)에 머물러 ridge 아래다.\nFlashAttention 은 n² 왕복을 없애 읽기를 n·d 로 줄이고, 그러면 intensity 가 n 에 비례해 커져 긴 시퀀스에서 compute-bound 가 된다.\n\"attention 이 왜 빨라졌나\" 의 답은 FLOP 이 아니라 바이트다.\n\n## Q4: MFU 와 MBU 는 무엇을 재고 어떻게 계산하나요?\n\n**30초.** MFU 는 달성 FLOPS / peak FLOPS, MBU 는 달성 대역폭 / peak 대역폭이다.\ncompute-bound 면 MFU 를, memory-bound 면 MBU 를 본다.\n\nMFU = (모델 FLOP 수 × 초당 토큰) / peak FLOPS.\n7B 모델은 토큰당 약 2 × 7e9 = 14 GFLOP 이니, 초당 10,000 토큰이면 140 TFLOPS, H100 에서 MFU 14% 다.\nMBU = (가중치 + KV 읽은 바이트 × 초당 스텝) / peak 대역폭.\ndecode 배치 1 이 초당 200 스텝이면 14 GB × 200 = 2.8 TB/s, MBU 84% 다.\ndecode 는 MFU 가 한 자리인데 MBU 가 80% 를 넘는 게 정상이다.\n두 숫자를 같이 봐야 \"GPU 가 놀고 있다\" 와 \"이미 한계다\" 를 가른다.\n\n## Follow-up: memory-bound 인 커널을 빠르게 하는 방법은 무엇뿐인가요?\n\n**30초.** 읽는 바이트를 줄이는 것뿐이다.\n연산을 줄여도 안 빨라진다.\n\n양자화(바이트 ↓), fusion(중간 결과를 HBM 에 안 쓰기), 배치(같은 읽기로 더 많이 계산), 캐시 재사용(SRAM 에 올려두고 여러 번 쓰기)이 전부 그 한 줄이다.\n\"이 커널은 memory-bound 라서 FLOP 을 줄이는 최적화는 의미가 없다\" 고 말할 수 있으면 면접에서 통과다.\n\n",

    "Q1: kernel · grid · block 을 설명하고, 왜 launch 자체에 비용이 드나요?",
    "Q2: kernel fusion 은 무엇을 없애나요? LayerNorm + residual 을 합치면 왜 빨라지나요?",

   "md": "> THEORY · gpu · T2  \n> 구현 → engine/vllm/cuda_graphs_torch_compile.md\n\n## Q1: kernel · grid · block 을 설명하고, 왜 launch 자체에 비용이 드나요?\n\n**30초.** kernel 은 GPU 에서 돌리는 함수, grid 는 그 kernel 의 block 들 전체, block 은 함께 SM 하나에 올라가 shared memory 를 공유하는 스레드 묶음이다.\nlaunch 는 CPU 가 드라이버를 거쳐 GPU 에 \"이 kernel 을 이 grid 로 돌려라\" 를 넘기는 것이라 5-10 μs 가 든다.\n\nkernel 하나가 1 μs 짜리면 launch 가 본체보다 길다.\ndecode 한 스텝은 kernel 수백 개(레이어마다 matmul·norm·attention·activation)라 launch 만 수 ms 가 된다.\n7B decode 스텝의 이론 하한이 4 ms 인데 launch 가 그만큼이면 GPU 는 절반을 논다.\n\n## Q2: kernel fusion 은 무엇을 없애나요? LayerNorm + residual 을 합치면 왜 빨라지나요?\n\n**30초.** 중간 결과를 HBM 에 쓰고 다시 읽는 왕복을 없앤다.\nLayerNorm 과 residual 을 합치면 x 를 한 번 읽어 x + f(x) 를 계산하고 바로 정규화해 한 번만 쓴다.\n\n따로 하면 residual 커널이 읽기 2 번·쓰기 1 번, LayerNorm 커널이 읽기 1 번·쓰기 1 번이다.\n합치면 읽기 2 번·쓰기 1 번이다.\nelementwise 연산은 전부 memory-bound 라 바이트가 그대로 시간이다.\nlaunch 횟수도 2 → 1 이다. ⭐️\nvLLM 의 `fused_add_rms_norm`, SwiGLU 의 `silu_and_mul` 이 이것이다.\n\n## Q3: CUDA graph 는 어떤 오버헤드를 없애나요? 왜 decode 에 특히 효과가 있나요?\n\n**30초.** kernel launch 열 전체를 한 번 녹화(capture)해두고 다음부터는 \"이 그래프 재생\" 한 번으로 수백 개 kernel 을 띄운다.\nCPU 의 launch 오버헤드가 스텝당 1 번으로 준다.\n\ndecode 는 매 스텝 같은 kernel 열을 같은 모양으로 돌린다(배치 크기만 다름).\n그래서 배치 크기별로 그래프를 미리 잡아두고 재생한다.\nprefill 은 시퀀스 길이가 매번 달라 모양이 바뀌어 잡기 어렵다.\n작은 배치 decode 에서 CPU 오버헤드가 GPU 시간보다 클 때 2-3 배 빨라진다.\n대가는 입력 텐서 주소가 고정이어야 해서 메모리를 미리 잡아두는 것이다.\n\n## Q4: Triton 은 CUDA 와 무엇이 다르고 왜 쓰나요?\n\n**30초.** Python 으로 kernel 을 쓰면 컴파일러가 CUDA 로 바꿔주는 언어다.\n스레드 하나가 아니라 블록 단위로 생각하게 해서 메모리 coalescing·shared memory 관리를 컴파일러가 대신한다.\n\nCUDA 는 스레드 하나의 코드를 쓰고 32 개가 어떻게 메모리를 치는지 사람이 맞춘다.\nTriton 은 \"이 블록이 이 타일을 처리한다\" 만 쓰면 된다.\nFlashAttention 급 성능은 CUDA 가 여전히 우세지만, fusion 커널·양자화 커널 같은 건 Triton 으로 하루에 짠다.\nvLLM 의 attention 백엔드 하나와 MoE 커널 일부가 Triton 이다.\n\n## Follow-up: 작은 배치에서 GPU 가 놀고 있다면 어디를 의심하나요?\n\n**30초.** CPU 오버헤드(launch · Python · 스케줄링)가 GPU 시간을 넘어서 GPU 가 다음 kernel 을 기다리는 상태다.\n프로파일에서 kernel 사이 빈 틈(gap)으로 보인다.\n\n배치 1 decode 는 kernel 하나가 수 μs 라 launch 5 μs 가 틈이 된다.\n처방은 CUDA graph, fusion, 그리고 CPU 쪽을 다른 프로세스로 빼는 것(vLLM V1 의 EngineCore 분리)이다.\nGPU 사용률 지표가 낮은데 느리면 거의 이것이다.\n\n",

   "md": "> THEORY · gpu · T2\n\n## Q1: 느린 추론 서버를 받았습니다. IO · CPU · GPU · 통신 중 어디가 병목인지 어떤 순서로 가르나요?\n\n**30초.** 먼저 GPU 사용률과 커널 사이 틈을 본다.\nGPU 가 꽉 차면 커널 안(연산 vs 메모리), GPU 가 비면 CPU·IO·통신 중 누가 GPU 를 굶기는지로 간다.\n\n```\nnvidia-smi / GPU util 지표\n  ├─ 높음(90%+) → 커널 내부: ncu 로 memory-bound vs compute-bound\n  └─ 낮음       → GPU 가 기다림\n        ├─ CPU: py-spy / torch profiler CPU 트랙 (Python 오버헤드, 토크나이즈)\n        ├─ 통신: NCCL 커널 시간 (all-reduce 가 길면 TP 과다 또는 느린 링크)\n        └─ IO: 디스크·네트워크 대기 (모델 로드, KV 전송)\n```\n\n한 번에 한 가설만 세우고 그 가설이 참이면 보일 숫자를 먼저 정한다.\n그 숫자가 안 나오면 다음 가설이다.\n\n## Q2: nsys 와 ncu 는 각각 무엇을 보여주나요?\n\n**30초.** nsys(Nsight Systems) 는 타임라인이다. 어느 커널이 언제 얼마나 돌았고 사이에 뭐가 있나.\nncu(Nsight Compute) 는 커널 하나의 내부다. 그 커널이 메모리 대역폭을 몇 % 썼고 연산 유닛을 몇 % 썼나.\n\nnsys 로 \"어느 커널이 시간을 먹나\" 와 \"틈이 있나\" 를 찾고, 그 커널을 ncu 로 열어 roofline 어디에 있나를 본다.\nncu 는 커널을 여러 번 재실행해 느리니 nsys 로 후보를 좁힌 뒤 쓴다.\ntorch profiler 는 둘 사이로, Python 호출과 CUDA 커널을 한 타임라인에 보여준다.\n\n## Q3: torch profiler 트레이스에서 'GPU idle 구간' 을 보면 무엇을 의심하나요?\n\n**30초.** CPU 가 다음 커널을 아직 안 넘겼다는 뜻이다.\nPython 오버헤드, launch 비용, 동기화(`.item()`, `.cpu()`) 셋 중 하나다.\n\nGPU 트랙에 커널이 띄엄띄엄 있고 CPU 트랙에 Python 함수가 길게 있으면 Python 이 범인이다.\nCPU 트랙도 비어 있으면 `cudaStreamSynchronize` 같은 동기화가 있는지 본다.\n`.item()` 하나가 스텝마다 GPU 를 CPU 에 맞춰 세운다.\n처방은 CUDA graph(launch 제거), 동기화 제거, 연산을 GPU 로 옮기기다.\n\n## Q4: Python 오버헤드가 GPU 를 굶기는 상황을 어떻게 확인하나요?\n\n**30초.** 같은 모델을 배치 1 과 배치 32 로 돌려 스텝 시간이 거의 같으면 CPU 바운드다.\nGPU 바운드면 배치에 비례해 늘어야 한다.\n\n더 직접적으로는 torch profiler 의 CPU 시간 합과 GPU 시간 합을 비교한다.\nCPU 합이 더 길면 GPU 는 그 차이만큼 놀았다.\npy-spy 로 Python 어디에 시간이 가는지 보면 토크나이즈·스케줄링·메타데이터 생성이 나온다.\nvLLM V1 이 EngineCore 를 분리하고 ModelRunner V2 가 입력 준비를 줄인 게 전부 이 측정에서 나왔다.\n\n## Follow-up: 실측 없이 '아마 메모리 때문' 이라 말하면 왜 안 되나요?\n\n**30초.** 메모리·연산·CPU·통신 중 어느 것이든 증상이 비슷하게 \"느리다\" 로 나와서, 가설만으로는 처방이 틀릴 확률이 높고 틀린 처방은 시간을 쓰고 효과가 없다.\n\nroadmap-19 에서 리뷰어가 \"메모리가 느는데 최악은?\" 을 물었을 때 추정 대신 실측으로 답했다.\n`.pth` 로 계측을 주입해 순간 메모리·호출 횟수·출력 동일성을 재서 \"512 tok 에서 8.0×, 8K 에서 1.4×, 절대 ≤ 10.5 MiB\" 를 냈다.\n그 숫자가 approve 를 받았다. ⭐️\n\"측정했다\" 와 \"그럴 것 같다\" 는 면접에서도 다르게 들린다.\n\n---\n\n### 손댄 곳\n\n- roadmap-19 실측 (9/22): .pth 로 계측 주입, 순간 메모리·호출 횟수·출력 동일성 측정, 리뷰어 질문에 데이터로 답함 · vllm-study/01-issues/roadmap-19-h2d-copy-coalescing/experiment/\n",

   "md": "> THEORY · inference · T1  \n> 구현 → engine/vllm/scheduler.md\n\n## Q1: LLM 추론은 왜 prefill 과 decode 두 단계로 나뉘나요?\n\n**30초.** 프롬프트는 한 번에 다 알고 있으니 통째로 처리하고(prefill), 생성은 한 토큰이 나와야 다음을 만들 수 있어서 하나씩 돈다(decode).\n\nprefill 은 토큰 N 개를 행렬 하나로 묶어 forward 한 번에 끝낸다.\ndecode 는 직전 토큰 하나를 입력으로 forward 를 돌려 다음 토큰 하나를 얻고, 그걸 다시 입력으로 넣는다.\n같은 가중치를 쓰지만 한 번에 처리하는 토큰 수가 N 대 1 이라 성격이 완전히 갈린다.\n\n## Q2: prefill 은 compute-bound, decode 는 memory-bound 라고 합니다. 왜 그런가요?\n\n**30초.** 둘 다 가중치 전체를 한 번 읽는데, prefill 은 그 가중치로 토큰 N 개를 계산하고 decode 는 토큰 1 개만 계산해서 그렇다.\n\n연산량은 토큰 수에 비례하고 메모리 읽기는 가중치 크기에 묶인다.\nprefill 은 읽은 바이트당 연산이 N 배라 연산이 병목(compute-bound), decode 는 바이트당 연산이 2 FLOP 수준이라 읽기가 병목(memory-bound) 이다.\n7B BF16 기준 가중치 14 GB 를 H100(3.35 TB/s) 이 읽는 데 약 4.2 ms 다.\ndecode 한 스텝은 아무리 빨라도 그 아래로 못 내려간다. ⭐️\n배치를 키우면 같은 가중치 읽기로 토큰을 여러 개 만들어 decode 도 compute 쪽으로 밀 수 있다.\n\n## Q3: TTFT · TPOT · ITL · throughput 은 각각 무엇을 재나요? 어느 단계가 어느 지표를 좌우하나요?\n\n**30초.** TTFT 는 첫 토큰까지(prefill 품질), TPOT/ITL 은 그 다음 토큰 사이 간격(decode 품질), throughput 은 초당 토큰 수(배치 효율)다.\n\n| 지표 | 뜻 | 좌우하는 단계 |\n|---|---|---|\n| TTFT | 요청 → 첫 토큰 | prefill + 대기열 |\n| TPOT | 토큰 간 평균 간격 (출력 길이로 나눈 값) | decode |\n| ITL | 토큰 간 실제 간격 (분포) | decode, 스케줄링 지터 |\n| throughput | 초당 생성 토큰 (시스템 전체) | 배치 크기 |\n\nTTFT 와 TPOT 는 사용자가 느끼는 것, throughput 은 운영자가 내는 비용이다.\n\n## Follow-up: batch 를 키우면 decode 의 어느 지표가 좋아지고 어느 지표가 나빠지나요?\n\n**30초.** throughput 은 좋아지고 TPOT 는 나빠진다.\n\n배치가 커지면 가중치 한 번 읽어 토큰을 더 많이 만드니 초당 토큰이 늘지만, 한 스텝의 연산이 늘어 각 요청의 토큰 간 간격은 길어진다.\n그래서 서빙은 \"TPOT 상한을 지키는 선에서 배치를 최대로\" 가 된다.\n\n",

    "Q1: static batching 은 GPU 를 왜 낭비하나요? 구체적 예로 설명해보세요.",

    "Q3: chunked prefill 은 어떤 문제를 풀나요? 긴 프롬프트 하나가 들어오면 decode 에 무슨 일이 생기나요?",

   "md": "> THEORY · inference · T1  \n> 구현 → engine/vllm/scheduler.md\n\n## Q1: static batching 은 GPU 를 왜 낭비하나요? 구체적 예로 설명해보세요.\n\n**30초.** 배치 안의 모든 요청이 끝날 때까지 기다려서, 짧은 요청이 끝난 자리가 빈 채로 돈다.\n\n요청 8 개를 묶었는데 하나는 2000 토큰, 일곱은 100 토큰이라 하자.\n100 스텝 뒤 일곱 자리가 비는데 새 요청을 못 넣고 1900 스텝을 1/8 효율로 돈다.\nGPU 는 바쁜데 유효 토큰은 거의 안 나온다.\n\n## Q2: continuous(iteration-level) batching 은 무엇을 바꿨나요?\n\n**30초.** 스케줄링 단위를 \"요청\" 에서 \"스텝(iteration)\" 으로 내렸다.\n\n매 decode 스텝마다 끝난 요청을 빼고 대기 중인 요청을 넣는다.\n빈 자리가 생기는 순간 채워지니 배치가 항상 꽉 찬다.\nOrca(OSDI '22) 가 제안했고 vLLM 이 PagedAttention 과 함께 기본으로 만들었다.\n정적 배치 대비 처리량이 수 배에서 열 배 이상 는다고 보고되지만, 수치는 워크로드에 따라 크게 다르다. ⭐️\n\n## Q3: chunked prefill 은 어떤 문제를 풀나요? 긴 프롬프트 하나가 들어오면 decode 에 무슨 일이 생기나요?\n\n**30초.** 긴 prefill 하나가 그 스텝을 통째로 먹어서 같은 배치의 decode 요청들이 토큰 하나를 기다리는 문제를 푼다.\n\nprefill 은 토큰 N 개를 한 번에 처리하니 N 이 크면 그 스텝이 길어진다.\ndecode 중이던 요청들은 그 스텝 동안 토큰을 못 받아 ITL 이 튄다.\nchunked prefill 은 긴 프롬프트를 조각으로 잘라 매 스텝에 decode 토큰들과 섞어 넣는다.\n스텝당 토큰 예산(max_num_batched_tokens) 안에서 decode 를 먼저 채우고 남는 자리에 prefill 조각을 넣는 식이다.\n\n## Q4: 메모리가 모자라면 요청을 어떻게 처리하나요? (preemption: recompute vs swap)\n\n**30초.** 우선순위 낮은 요청의 KV 블록을 뺏어 대기열로 돌려보내고(preempt), 나중에 다시 계산한다(recompute).\n\nKV 캐시는 요청이 끝나야 해제되는데 새 요청이 계속 들어오면 블록이 모자란다.\n가장 늦게 온 요청을 멈추고 블록을 회수한다.\n되살릴 때 두 가지였다.\nrecompute 는 KV 를 버리고 prefill 부터 다시 하고, swap 은 CPU 로 내렸다가 올린다.\nvLLM V1 은 recompute 만 쓴다.\nPCIe 왕복보다 다시 계산하는 게 빠르고 단순해서다.\n\n## Follow-up: continuous batching 이 가능해진 전제 조건은 무엇인가요? (KV 캐시 관리와의 관계)\n\n**30초.** KV 캐시를 요청마다 연속 메모리로 미리 잡지 않아야 한다.\n\n정적 할당이면 요청의 최대 길이만큼 메모리를 예약해두니 빈 자리에 새 요청을 넣을 수 없다.\nPagedAttention 이 블록 단위로 그때그때 할당하기 때문에 끝난 요청의 블록을 바로 새 요청에 줄 수 있다.\ncontinuous batching 과 PagedAttention 은 한 쌍이다.\n\n",

   "md": "> THEORY · inference · T1  \n> 구현 → engine/vllm/kv_connector_pd.md, engine/dynamo/disaggregated_pd.md\n\n## Q1: prefill 과 decode 를 같은 GPU 에서 돌리면 서로 어떻게 방해하나요?\n\n**30초.** prefill 은 한 스텝을 길게 먹어 decode 요청들의 토큰 간격(ITL)을 튀게 하고, decode 는 작은 배치로 GPU 연산을 놀게 해 prefill 처리량을 깎는다.\n\n둘은 성격이 반대다.\nprefill 은 compute-bound 라 큰 배치가 좋고, decode 는 memory-bound 라 가중치 읽기를 나눠 쓸 만큼만 모이면 된다.\n한 GPU 에서 섞으면 어느 쪽에도 최적이 아닌 스텝 크기로 돈다.\nchunked prefill 이 완화하지만 간섭을 없애진 못한다.\n\n## Q2: P/D 를 분리하면 무엇이 좋아지고, 대신 새로 생기는 비용은 무엇인가요?\n\n**30초.** TTFT 와 ITL 을 각각 따로 최적화하고 P·D 를 독립적으로 스케일할 수 있다.\n대신 KV 캐시를 P 에서 D 로 옮기는 전송과, 두 풀을 묶는 라우팅·조율이 새로 생긴다.\n\n좋아지는 것은 decode 쪽 ITL 안정성과 prefill 쪽 배치 효율이다.\nP 와 D 에 다른 병렬화(P 는 TP 크게, D 는 TP 작게·배치 크게)를 쓸 수도 있다.\n비용은 요청마다 KV 전체(7B·4K 면 2 GB)를 네트워크로 옮기는 것, 그리고 P·D 비율이 틀리면 한쪽이 논다는 것이다. ⭐️\n\n## Q3: KV 캐시를 P 에서 D 로 옮기는 데 얼마나 걸리나요? 어떤 링크(NVLink/RDMA/PCIe)를 타나요?\n\n**30초.** NVLink 면 수 ms, RDMA(InfiniBand 400 Gb/s ≈ 50 GB/s) 면 2 GB 에 약 40 ms, PCIe 를 거치면 그 이상이다.\n\n같은 노드 안이면 NVLink(H100 900 GB/s) 로 GPU 간 직접 복사가 가장 빠르다.\n노드를 넘으면 RDMA 로 GPU 메모리에서 GPU 메모리로 간다(GPUDirect).\n호스트 버퍼를 거치는 경로(kv_buffer_device=cpu) 는 PCIe 를 두 번 타서 느리지만 범용적이다.\n전송 시간이 prefill 시간과 비슷하면 분리 이득이 사라진다.\n\n## Q4: P 와 D 의 비율은 어떻게 정하나요?\n\n**30초.** 입력 길이와 출력 길이의 비율로 정한다.\n입력이 길면 P 를 늘리고 출력이 길면 D 를 늘린다.\n\nP 하나가 초당 처리하는 prefill 토큰과 D 하나가 감당하는 동시 decode 요청 수를 프로파일로 재서 SLA(TTFT·TPOT) 안에 들어오는 최소 조합을 고른다.\n워크로드가 바뀌면 비율도 바뀌어야 해서 planner 가 동적으로 조정한다.\nDynamo 의 SLA planner 가 이 역할이다.\n\n## Follow-up: P/D 분리가 오히려 손해인 상황은?\n\n**30초.** 입력이 짧고 출력이 긴 워크로드, 또는 KV 전송이 prefill 보다 오래 걸리는 환경이다.\n\n입력 100 토큰짜리 채팅은 prefill 이 몇 ms 라 분리해도 간섭이 거의 없고 전송 비용만 남는다.\n노드 간 네트워크가 느리면 KV 2 GB 를 옮기는 동안 그냥 다시 계산하는 게 빠르다.\n작은 배포(GPU 2-4 장)는 풀을 둘로 나누면 각각이 너무 작아져 배치 효율이 떨어진다.\n\n---\n\n### 손댄 곳\n\n- vLLM PR #54483 (머지 2026-10-01): NIXL host-buffer KV 복사 그룹 간 coalescing, copy_blocks 호출 7→1 · vllm-study/01-issues/roadmap-19-h2d-copy-coalescing/\n- P/D 한 GPU 실기동 함정 (9/22): 동시 기동 시 KV 예산 0, kv_buffer_device=cpu 호스트 버퍼 크기 · vllm-study/02-env/pod-setup.md\n",

   "qs": [
    "Q1: KV 캐시는 왜 필요한가요? 없으면 토큰 하나 생성에 얼마가 드나요?",
    "Q2: KV 캐시 크기 공식을 써보세요. 어떤 변수가 지배하나요?",
    "Q3: 7B · 32 layer · 4096 컨텍스트 · BF16 · batch 1 의 KV 캐시는 대략 몇 GB 인가요?",
    "Q4: KV 캐시를 줄이는 방법 4가지와 각각의 대가는?",
    "Follow-up: 긴 컨텍스트에서 가중치보다 KV 캐시가 더 큰 메모리를 먹는 지점은 어디인가요?"
   ],
   "md": "> THEORY · inference · T1  \n> 구현 → engine/vllm/paged_attention_block_manager.md\n\n---\n\n## 0-1. 개념: Q, K, V 가 뭔가\n\n\"가중치\" 라는 말이 두 가지로 쓰이니 먼저 가른다.\n\n| 용어 | 뭔가 | 바뀌나 |\n|---|---|---|\n| W_Q, W_K, W_V | 학습된 모델 파라미터. 행렬 3개 | 학습 끝나면 고정 |\n| w₁, w₂, w₃ | attention 점수를 softmax 한 값. \"얼마나 볼지\" 비율 | 토큰마다 새로 계산 |\n\n- 토큰마다 입력 벡터 x 에 세 행렬을 곱해 벡터 3개를 만든다\n  - q = x·W_Q, k = x·W_K, v = x·W_V\n- 도서관 비유\n\n```\nq (query)  = 지금 토큰이 던지는 질문      \"나 앞에 뭐가 있었지?\"\nk (key)    = 각 과거 토큰이 붙인 라벨     \"나는 주어야\" \"나는 목적어야\"\nv (value)  = 각 과거 토큰이 실제로 주는 내용\n```\n\n- 계산 순서\n  - 지금 토큰의 q 를 과거 토큰들의 k 와 하나씩 내적. 크면 연관성 높음\n  - 그 점수를 softmax 로 비율 w 로 바꿈. 합이 1\n  - 그 비율대로 v 를 섞음. 이게 attention 출력\n- \"가장 연관성 높은 하나를 고른다\" 가 아니라 **연관성 비율대로 과거 토큰들의 v 를 가중 평균**\n\n예시: \"나는 밥을 먹\" 에서 \"먹\" 토큰\n\n```\n\"먹\" 의 q₃:  \"누가 뭘 먹는 거지?\"\n\n        k₁ \"나는\"(주어)     k₂ \"밥을\"(목적어)     k₃ \"먹\"(자기)\n연관성      높음               높음                 낮음\nw           0.4                0.5                  0.1\n\n출력 = 0.4·v₁ + 0.5·v₂ + 0.1·v₃\n     = \"나는\" 과 \"밥을\" 의 정보를 많이 섞은 벡터\n```\n\n- KV 캐시와의 연결\n  - 비교 대상 k 와 섞을 재료 v 는 과거 토큰 것을 매번 다시 씀 → 이 둘만 저장\n  - q 는 지금 토큰이 던지는 질문이라 한 번 쓰고 버림\n\n---\n\n## 0-2. 예시: 숫자로 보는 KV 캐시\n\n레이어 1개, 헤드 1개, 벡터 길이 2.\n\"라벨\" \"내용\" 은 비유고, 실체는 둘 다 숫자 벡터다.\n차이는 쓰임새 하나: k 는 q 와 **내적** 되고, v 는 점수대로 **더해진다**.\n\n상황 설정.\n\n| 구분 | 토큰 | 뭘 하나 |\n|---|---|---|\n| 이미 처리됨 (프롬프트) | \"나는\" \"밥을\" \"먹\" | 단계 1 - 3. k, v 를 만들어 캐시에 쌓음 |\n| 지금 생성 중 | \"는다\" (4번째) | 단계 4. 자기 q, k, v 만 새로 계산, 캐시의 k, v 로 attention |\n\n**단계 1. 토큰마다 k, v 가 나온다**\n\n```\nx₁ = [1, 0]   \"나는\"   →   k₁ = [2, 0]      v₁ = [5, 1]\nx₂ = [0, 1]   \"밥을\"   →   k₂ = [0, 2]      v₂ = [1, 7]\nx₃ = [1, 1]   \"먹\"     →   k₃ = [1, 1]      v₃ = [3, 3]     q₃ = [1, 3]\n```\n\n**단계 2. \"먹\" 의 attention**\n\n```\n점수:  q₃·k₁ = 1·2 + 3·0 = 2\n       q₃·k₂ = 1·0 + 3·2 = 6      ← \"밥을\" 쪽이 더 맞는다\n       q₃·k₃ = 1·1 + 3·1 = 4\n\nsoftmax → w ≈ (0.02, 0.86, 0.12)\n출력 = 0.02·v₁ + 0.86·v₂ + 0.12·v₃  ≈ 거의 v₂, \"밥을\" 의 정보\n```\n\n**단계 3. 여기까지 처리한 뒤 캐시에 남은 것**\n\n```\n   K = [ 2, 0 ]  ← k₁ \"나는\"      V = [ 5, 1 ]  ← v₁\n       [ 0, 2 ]  ← k₂ \"밥을\"          [ 1, 7 ]  ← v₂\n       [ 1, 1 ]  ← k₃ \"먹\"            [ 3, 3 ]  ← v₃\n\n   q₁ q₂ q₃ 는 없음. 쓰고 버렸음.\n```\n\n숫자 12개. 이게 캐시 전부다.\n\n**단계 4. 4번째 토큰 \"는다\" 생성**\n\n```\nx₄ = [1, 1]  ──► 새로 계산:  q₄ = [2, 1]   k₄ = [1, 2]   v₄ = [0, 4]\n\n캐시에 k₄, v₄ 한 행씩만 추가\n\n   K = [ 2, 0 ]      V = [ 5, 1 ]\n       [ 0, 2 ]          [ 1, 7 ]\n       [ 1, 1 ]          [ 3, 3 ]\n       [ 1, 2 ] ◄new     [ 0, 4 ] ◄new\n\n점수 = q₄ 와 K 의 각 행 내적 = [4, 2, 3, 4]\nsoftmax → w ≈ [0.37, 0.05, 0.14, 0.37]\n출력 = Σ wᵢ · vᵢ   (V 의 네 행을 그 비율로 섞음)\n```\n\n**단계 5. 캐시가 없었다면**\n\n```\nx₁ ──► k₁ v₁   ┐\nx₂ ──► k₂ v₂   │  이 6개를 또 계산. 결과는 단계 3 의 표와 똑같음\nx₃ ──► k₃ v₃   ┘\nx₄ ──► q₄ k₄ v₄\n```\n\n- 4번째 토큰에서 벡터 6개를 아낌. 100번째에서는 198개\n- 안 아끼면 총량 O(n²)\n- 정리: KV 캐시 = **지금까지 토큰들의 k 행, v 행을 두 행렬에 쌓아둔 것**. 새 토큰은 자기 k, v 한 행씩만 붙임\n- 위는 레이어 1개 기준. 레이어 32개면 \"나는\" 하나에 k₁ 이 32개, v₁ 이 32개 (레이어마다 x₁ 이 다른 벡터로 변해 들어감)\n\n---\n\n## Q1: KV 캐시는 왜 필요한가요? 없으면 토큰 하나 생성에 얼마가 드나요?\n\n**30초.** 이전 토큰들의 K 와 V 는 바뀌지 않으니 저장해두고, 새 토큰의 Q 만 계산해 붙인다.\n\n- 없으면: 토큰 하나 만들 때마다 지금까지의 모든 토큰에 대해 K·V 를 다시 계산\n  - t 번째 토큰 비용 O(t), 전체 생성 O(n²)\n- 있으면: 토큰당 forward O(1) 번 + attention 읽기 O(t)\n- 한 줄 요약: **계산을 메모리로 바꾼 것**\n\n---\n\n## Q2: KV 캐시 크기 공식을 써보세요. 어떤 변수가 지배하나요?\n\n**30초.** `2 × L × n_kv_heads × head_dim × bytes × seq × batch`.\n\n- 2 = K 와 V\n- L = 레이어 수\n- n_kv_heads × head_dim = 레이어당 K (또는 V) 한 토큰의 크기\n- 지배 변수 = **seq × batch** ⭐️\n  - 가중치는 고정, 이건 요청이 길어지고 많아질수록 선형으로 증가\n\n변수 풀이 (0-2 예시 기준)\n\n| 변수 | 뜻 | 예시에서 |\n|---|---|---|\n| seq | K 행렬의 행 수 = 지금까지 토큰 수. 프롬프트 + 생성 모두 | 4 |\n| head_dim | 행 하나의 길이 = k 벡터의 숫자 개수 | 2. 실제는 128 |\n| 2 | K 와 V. 크기가 같음 | |\n| bytes | 숫자 하나의 크기. FP32 4, BF16 2, FP8 1 | |\n| batch | 동시 처리 중인 요청 수. 요청마다 K, V 따로 | 1 |\n| L | 레이어 수. 토큰 하나를 뽑을 때 32층을 순서대로 통과, 층마다 k v 가 따로 생김 | 1 |\n| n_kv_heads | 한 층 안에서 W_K 를 몇 벌 쓰나. 헤드마다 k v 따로 | 1 |\n\n- 레이어 = 토큰 하나를 뽑는 파이프라인. 토큰을 32번 만드는 게 아님\n- 헤드 = 한 층 안에서 동시에 보는 눈 여러 개\n- 외우기: 토큰 한 행의 크기 (헤드 × 길이 × 바이트) 를, 층 수만큼, 토큰 수만큼, 요청 수만큼, K 와 V 두 번\n- 계산 예: 2 × 128 × 2 B × 1200 × 8 = 4.8 MB, × 32층 × 32헤드 ≈ 4.9 GB\n\n---\n\n## Q3: 7B · 32 layer · 4096 컨텍스트 · BF16 · batch 1 의 KV 캐시는 대략 몇 GB 인가요?\n\n**30초.** 약 2 GB.\n\n- Llama-2-7B: L=32, MHA 라 n_kv_heads=32, head_dim=128, BF16 2 바이트\n- 토큰당 = 2 × 32 × 32 × 128 × 2 = 524,288 B = **512 KB**\n- 4096 토큰 → 512 KB × 4096 = **2 GB**\n- 비교: 가중치 14 GB 에 요청 하나가 2 GB 추가\n  - 배치 8 이면 16 GB 로 가중치보다 커짐\n\n---\n\n## Q4: KV 캐시를 줄이는 방법 4가지와 각각의 대가는?\n\n**30초.** 헤드를 줄이거나(GQA·MLA), 바이트를 줄이거나(양자화), GPU 밖으로 내리거나(offload), 겹치는 걸 공유한다(prefix caching).\n\n공식의 변수 하나를 줄이면 캐시가 준다. 방법마다 어느 변수를 건드리는지 붙여서 본다.\n\n| 방법 | 뭘 하나 | 줄이는 변수 | 대가 |\n|---|---|---|---|\n| GQA / MQA | 헤드 32개가 k, v 를 각자 만들지 않고 몇 개가 하나를 공유. Llama-3 는 32개 헤드가 k v 8벌만 씀 | n_kv_heads (32 → 8, 4배) | 품질 소폭, 학습 때 정해야 함 |\n| MLA | k, v 를 작은 latent 벡터로 눌러서 저장하고 쓸 때 복원 | n_kv_heads × head_dim 묶음 | 복원 연산 추가, 전용 커널 |\n| KV 양자화 (FP8/INT8) | 숫자를 BF16 대신 FP8 로 저장 | bytes (2 → 1) | 미세한 품질 저하, 스케일 관리 |\n| Offload (CPU/SSD) | GPU 메모리 대신 CPU 메모리나 SSD 에 둠 | 없음. 놓는 장소만 바꿈 | 다시 올릴 때 PCIe 대역폭 |\n| Prefix caching | 요청 여러 개가 같은 앞부분 (시스템 프롬프트) 을 공유하면 그 k v 를 한 번만 저장 | seq × batch 합계 (공유 구간은 1벌) | 해시 관리, 히트 안 되면 이득 없음 |\n\n---\n\n## Follow-up: 긴 컨텍스트에서 가중치보다 KV 캐시가 더 큰 메모리를 먹는 지점은 어디인가요?\n\n**30초.** seq × batch 가 가중치 크기 / 토큰당 KV 를 넘는 순간부터다.\n\n- 7B: 14 GB / 512 KB ≈ **28K 토큰**\n- 배치 7 × 4K 컨텍스트, 또는 요청 하나 28K 면 KV = 가중치\n- 결론: 긴 컨텍스트 서빙은 모델 크기보다 **KV 예산 싸움**\n",

    "Q3: 병목이 어디서 생기는지 prefill·decode·KV 전송·네트워크 순으로 짚어보세요.",
    "Q4: 레이턴시 vs 처리량 vs 비용의 트레이드오프를 어떤 손잡이로 조절하나요?",
    "Follow-up: 장애(GPU 한 대 죽음, 요청 폭주) 가 나면 어디서 무엇이 먼저 무너지나요?"
   ],
   "md": "> THEORY · inference · T1  \n> 구현 → engine/dynamo/architecture.md\n\n## Q1: 'LLM 서빙 시스템을 설계해보라' 는 질문에 첫 2분 동안 무엇을 물어야 하나요? (요구사항·지표)\n\n**30초.** 모델 크기, 트래픽(QPS·동시 요청), 입출력 길이 분포, 지켜야 할 지표(TTFT·TPOT p50/p99), 예산(GPU 수·종류)을 묻는다.\n\n이 다섯 개가 설계를 결정한다.\n모델 크기와 GPU 가 병렬화(TP 필요 여부)를 정하고, 입출력 길이가 P/D 분리 여부와 KV 예산을 정하고, 지표가 배치 상한을 정한다.\n\"어떤 모델을 몇 명이 어떻게 쓰나\" 를 숫자로 받아내는 게 첫 2분이다.\n\n## Q2: 게이트웨이 → 라우터 → 엔진 풀 → 오토스케일러 구조를 그리고 각 층의 책임을 말해보세요.\n\n**30초.** 게이트웨이는 인증·레이트리밋·큐잉, 라우터는 어느 엔진에 보낼지(캐시·부하), 엔진 풀은 실제 추론(vLLM 등), 오토스케일러는 풀 크기와 P/D 비율이다.\n\n```\n클라이언트 → [게이트웨이] → [라우터] → [엔진 풀 (P 풀 / D 풀)] → 응답 스트림\n                                ↑                 ↓ 지표\n                           [오토스케일러 / planner]\n```\n\n| 층 | 책임 | 실패하면 |\n|---|---|---|\n| 게이트웨이 | 인증, 요청 검증, 토큰 수 제한, 과부하 시 429 | 엔진이 쓰레기 요청·폭주를 직접 맞음 |\n| 라우터 | 프리픽스 캐시 히트 · 부하 · 모델/LoRA 매칭으로 엔진 선택 | 캐시 못 쓰고 한 엔진에 몰림 |\n| 엔진 풀 | continuous batching, KV 관리, 병렬화 | 여기가 비용의 전부 |\n| 오토스케일러 | SLA 보고 레플리카·P/D 비율 조정 | 피크에 TTFT 폭발, 야간에 GPU 낭비 |\n\n## Q3: 병목이 어디서 생기는지 prefill·decode·KV 전송·네트워크 순으로 짚어보세요.\n\n**30초.** prefill 은 연산(긴 입력이 몰리면 TTFT), decode 는 KV 메모리(동시 요청이 쌓이면 preemption), KV 전송은 네트워크(P/D 분리 시), 네트워크는 스트리밍 응답 처리다.\n\n| 병목 | 증상 | 손잡이 |\n|---|---|---|\n| prefill 연산 | TTFT p99 상승 | chunked prefill, P 풀 증설, 프리픽스 캐시 |\n| decode KV 메모리 | preemption 증가, 처리량 정체 | 배치 상한, KV 양자화, GQA 모델, offload |\n| KV 전송 | P/D 에서 TTFT 에 전송 시간이 더해짐 | NVLink 안에 P/D 두기, RDMA, 분리 포기 |\n| 네트워크·게이트웨이 | 토큰은 나오는데 클라이언트가 늦게 받음 | 스트리밍 경로 점검, 게이트웨이 수평 확장 |\n\nGPU 사용률이 높은데 토큰이 안 나오면 prefill 쪽, 사용률이 낮은데 느리면 decode·KV 쪽을 본다. ⭐️\n\n## Q4: 레이턴시 vs 처리량 vs 비용의 트레이드오프를 어떤 손잡이로 조절하나요?\n\n**30초.** 배치 크기 하나가 셋을 동시에 움직이고, 나머지는 양자화·병렬화·P/D 비율이다.\n\n| 손잡이 | 레이턴시 | 처리량 | 비용 |\n|---|---|---|---|\n| 배치 ↑ | TPOT ↑ | ↑ | GPU 당 ↓ |\n| TP ↑ | ↓ (레이어 연산 분산) | 통신 때문에 GPU 당 ↓ | ↑ |\n| 양자화 | ↓ | ↑ | ↓ |\n| P/D 분리 | ITL 안정 | ↑ | 조율·전송 비용 ↑ |\n| 모델 작게 / spec decode | ↓ | ↑ | ↓ / 품질 리스크 |\n\n면접에서는 \"TPOT 상한을 SLA 로 두고 그 안에서 배치를 최대화, 안 되면 양자화, 그래도 안 되면 GPU 추가\" 순서로 말하면 된다.\n\n## Follow-up: 장애(GPU 한 대 죽음, 요청 폭주) 가 나면 어디서 무엇이 먼저 무너지나요?\n\n**30초.** GPU 하나가 죽으면 그 위의 진행 중 요청이 전부 날아가고, 폭주하면 대기열이 먼저 쌓여 TTFT 가 무너진다.\n\nGPU 장애는 그 엔진의 KV 가 사라지는 것이라 요청을 다른 엔진에서 처음부터 다시 돈다(request migration 이 있으면 KV 를 옮겨 이어간다).\n폭주는 엔진이 아니라 게이트웨이에서 막아야 한다.\n엔진까지 들어오면 preemption 이 연쇄로 일어나 모든 요청이 느려진다.\n게이트웨이 429 와 대기열 상한이 첫 방어선이다.\n\n",

   "qs": [
    "Q1: weight-only 양자화(INT4 GPTQ/AWQ) 와 weight+activation 양자화(FP8/INT8) 는 무엇이 다르고 각각 언제 쓰나요?",
    "Q2: PTQ 와 QAT 의 차이는?",
    "Q3: LLM activation 에 outlier 가 있으면 왜 단순 양자화가 깨지나요? AWQ·SmoothQuant 는 어떻게 피하나요?",
    "Q4: KV 캐시도 양자화할 수 있나요? 무엇을 얻고 무엇을 잃나요?",
    "Follow-up: 양자화 후 품질 저하를 어떻게 측정하나요? perplexity 만으로 충분한가요?"
   ],
   "md": "> THEORY · inference · T1  \n> 구현 → engine/vllm/quantization_impl.md\n\n## Q1: weight-only 양자화(INT4 GPTQ/AWQ) 와 weight+activation 양자화(FP8/INT8) 는 무엇이 다르고 각각 언제 쓰나요?\n\n**30초.** weight-only 는 가중치만 작게 저장하고 계산은 BF16 으로 하니 메모리 병목(decode·작은 배치)에 맞고, W+A 는 activation 까지 저정밀로 바꿔 저정밀 tensor core 를 쓰니 연산 병목(prefill·큰 배치)에 맞다.\n\n| | 줄이는 것 | 계산 | 언제 |\n|---|---|---|---|\n| weight-only (INT4 GPTQ/AWQ) | 가중치 읽기 바이트 4배 ↓ | 읽을 때 BF16 으로 풀어서 계산 (dequant 비용) | decode, 배치 작을 때, VRAM 이 한계일 때 |\n| W+A (FP8/INT8) | 가중치 + activation 2배 ↓ | FP8 tensor core 로 바로 계산, 2배 빠름 | prefill, 배치 클 때, Hopper 이상 |\n\ndecode 는 가중치 읽기가 병목이니 바이트를 줄이는 게 그대로 속도다.\nprefill 은 연산이 병목이니 저정밀 연산 유닛을 써야 빨라진다.\n\n## Q2: PTQ 와 QAT 의 차이는?\n\n**30초.** PTQ 는 학습 끝난 모델을 그대로 양자화하고, QAT 는 양자화 오차를 학습에 넣어 모델이 적응하게 한다.\n\nPTQ 는 몇 분이면 되고 LLM 양자화는 거의 전부 PTQ 다(GPTQ·AWQ·FP8).\nQAT 는 재학습이 필요해 비싸지만 INT4 이하 극저정밀에서 품질을 지킨다.\nLLM 은 학습 비용 때문에 PTQ 를 잘 만드는 쪽으로 발전했다.\n\n## Q3: LLM activation 에 outlier 가 있으면 왜 단순 양자화가 깨지나요? AWQ·SmoothQuant 는 어떻게 피하나요?\n\n**30초.** 소수의 채널에 다른 것보다 수십 배 큰 값이 있어서, 그 범위에 스케일을 맞추면 나머지 값이 전부 0 근처로 뭉개진다.\n\n양자화는 [min, max] 를 몇 단계로 나누는 것이다.\noutlier 하나가 max 를 100 으로 만들면 대부분의 값(1 미만)이 한두 단계에 몰린다.\nAWQ 는 activation 이 큰 채널의 가중치를 중요하게 보고 그 채널에 스케일을 더 준다.\nSmoothQuant 는 activation 의 outlier 를 가중치 쪽으로 수학적으로 옮겨 둘 다 양자화하기 쉽게 만든다.\n둘 다 \"어디가 중요한지를 activation 통계로 본다\" 가 핵심이다. ⭐️\n\n## Q4: KV 캐시도 양자화할 수 있나요? 무엇을 얻고 무엇을 잃나요?\n\n**30초.** 할 수 있고, KV 메모리가 절반이 되어 배치나 컨텍스트가 2배 는다.\n\nFP8 KV 는 K·V 를 저장할 때 스케일과 함께 8비트로 쓰고 attention 계산 전에 푼다.\n얻는 것은 KV 예산 2배, 그래서 처리량이다.\n잃는 것은 attention 점수의 미세한 오차와 스케일 관리 복잡도다.\n가중치 양자화보다 품질 영향이 작은 편이라 서빙에서 자주 켠다.\n\n## Follow-up: 양자화 후 품질 저하를 어떻게 측정하나요? perplexity 만으로 충분한가요?\n\n**30초.** perplexity 는 첫 필터고, 실제 과제 벤치마크와 생성 샘플 비교까지 봐야 한다.\n\nperplexity 는 전체 분포의 평균 오차라 특정 능력(수학·코드·긴 추론)이 깨지는 걸 못 잡는다.\n양자화 전후를 같은 벤치마크(MMLU·GSM8K·HumanEval 등)로 돌리고, 긴 생성에서 반복·붕괴가 생기는지 샘플로 확인한다.\n\"품질 저하는 측정하는 것이지 가정하는 게 아니다\" 가 면접에서 기대하는 태도다.\n\n",

   "qs": [
    "Q1: draft 모델이 k 개를 제안하고 target 모델이 한 번에 검증한다는 게 왜 빨라지나요?",
    "Q2: 검증이 '공짜' 에 가까운 이유는? decode 가 memory-bound 라는 사실과 어떻게 연결되나요?",
    "Q3: acceptance rate 가 낮으면 어떻게 되나요? 손익분기는 어디인가요?",

    "Follow-up: 출력 분포가 target 모델과 정확히 같다는 걸 어떻게 보장하나요? (rejection sampling)"
   ],
   "md": "> THEORY · inference · T1  \n> 구현 → engine/vllm/spec_decode_impl.md\n\n## Q1: draft 모델이 k 개를 제안하고 target 모델이 한 번에 검증한다는 게 왜 빨라지나요?\n\n**30초.** target 모델 forward 한 번에 토큰 1 개가 아니라 k 개를 확정할 수 있어서다.\n\n작은 draft 가 k 개를 빠르게 제안한다.\ntarget 은 그 k 개를 prefill 처럼 한 번에 넣어 각 위치의 확률을 얻는다.\n앞에서부터 맞는 만큼 받아들이고 첫 틀린 자리에서 target 의 토큰으로 교체한다.\n한 번의 target forward 에 1 개 이상, 최대 k+1 개가 나온다.\n\n## Q2: 검증이 '공짜' 에 가까운 이유는? decode 가 memory-bound 라는 사실과 어떻게 연결되나요?\n\n**30초.** decode 의 target forward 는 가중치 읽기가 병목이라, 토큰 1 개를 넣든 k 개를 넣든 시간이 거의 같다.\n\ndecode 는 memory-bound 다.\n14 GB 가중치를 읽는 4 ms 동안 토큰 1 개 분량의 연산만 하고 있다.\n그 자리에 토큰 k 개를 넣어도 읽기는 그대로고 연산만 조금 늘어 시간이 거의 안 변한다.\n남는 연산 여유를 검증에 쓰는 것이다. ⭐️\n배치가 커서 이미 compute-bound 면 이 여유가 없어 이득이 줄어든다.\n\n## Q3: acceptance rate 가 낮으면 어떻게 되나요? 손익분기는 어디인가요?\n\n**30초.** acceptance rate α 가 낮으면 draft 비용만 쓰고 토큰은 거의 안 늘어서 오히려 느려진다.\n\n스텝당 기대 토큰 수는 (1 - α^(k+1)) / (1 - α) 다.\nα=0.8, k=5 면 약 3.7 개, α=0.3 이면 약 1.4 개다.\ndraft 를 k 번 돌리는 비용 + target 한 번이 target 만 1 번 돈 것보다 싸야 이득이다.\nα 가 0.5 밑이면 대개 손해다.\nα 는 모델 쌍과 도메인에 따라 달라 실측해야 한다.\n\n## Q4: draft 모델 없이 하는 방법(n-gram, EAGLE, Medusa, MTP)은 각각 draft 를 어디서 가져오나요?\n\n**30초.** n-gram 은 프롬프트에서, EAGLE·Medusa 는 target 의 hidden state 에 붙인 작은 head 에서, MTP 는 target 모델 안에 학습된 다음-토큰 head 에서 가져온다.\n\n| 방식 | draft 출처 | 특징 |\n|---|---|---|\n| n-gram | 프롬프트·출력에 이미 나온 패턴 매칭 | 모델 없음, 요약·코드처럼 반복 많은 입력에 좋음 |\n| Medusa | target 마지막 hidden 에 head 여러 개 | 별도 모델 없음, 위치마다 독립 예측 |\n| EAGLE / EAGLE3 | hidden state 받는 작은 트랜스포머 | 앞 토큰 정보를 써서 Medusa 보다 정확 |\n| MTP (DeepSeek) | 학습 때부터 넣은 multi-token head | 모델과 함께 나옴, 가장 높은 α |\n\n별도 draft 모델이 없으니 메모리를 안 먹고 배포가 단순하다.\n\n## Follow-up: 출력 분포가 target 모델과 정확히 같다는 걸 어떻게 보장하나요? (rejection sampling)\n\n**30초.** rejection sampling 으로, draft 가 제안한 토큰을 target 확률 대비로 확률적으로 받아들이거나 거절하면 최종 분포가 target 과 수학적으로 같아진다.\n\ndraft 확률 q, target 확률 p 일 때 토큰을 min(1, p/q) 확률로 받는다.\n거절되면 (p - q)⁺ 를 정규화한 분포에서 다시 뽑는다.\n이렇게 하면 어떤 draft 를 써도 출력 분포는 target 그대로다.\n속도만 바뀌고 품질은 안 바뀐다는 보장이 여기서 나온다.\n\n",

    "Q3: 학습의 병렬화와 추론의 병렬화는 목표가 어떻게 다른가요?",

   "md": "> THEORY · inference · T2  \n> 구현 → engine/vllm/distributed_executor.md\n\n## Q1: TP · PP · DP · EP 를 추론에 쓸 때 각각 무엇을 나누나요?\n\n**30초.** TP 는 레이어 안 행렬을 GPU 들이 나눠 계산, PP 는 레이어 묶음을 나눠 순서대로, DP 는 모델을 통째로 복제해 요청을 나눠, EP 는 MoE expert 를 나눈다.\n\n| | 나누는 것 | GPU 당 메모리 | 레이턴시 | 처리량 |\n|---|---|---|---|---|\n| TP | 가중치 행렬 | 1/N | ↓ (연산 분산) | GPU 당 ↓ (통신) |\n| PP | 레이어 stage | 1/N | 변화 없음 (순차) | 파이프라이닝으로 ↑ |\n| DP | 없음 (복제) | 전부 | 변화 없음 | N 배 |\n| EP | expert | expert 1/N | all-to-all 비용 | MoE 필수 |\n\n추론은 KV 캐시도 나눠야 해서 TP 면 KV 도 head 축으로 1/N 이다.\n\n## Q2: TP 는 왜 노드 안(NVLink)에서만 쓰나요? 통신 패턴이 어떻게 되나요?\n\n**30초.** TP 는 레이어마다 all-reduce 를 두 번 하니 decode 한 스텝(수 ms)에 통신이 64 번(32 층 × 2) 들어가고, 이걸 PCIe 나 네트워크로 하면 통신이 계산보다 길어진다.\n\nall-reduce 는 attention 출력 뒤 한 번, FFN 출력 뒤 한 번이다.\nNVLink(900 GB/s, 레이턴시 수 μs) 면 7B 의 activation(배치 × 4096 × 2B) 왕복이 수십 μs 로 묻힌다.\nInfiniBand(50 GB/s, 레이턴시 수십 μs) 면 통신만으로 스텝이 2 배 는다.\n그래서 TP 는 노드 안 8 장이 상한이다. ⭐️\n\n## Q3: 학습의 병렬화와 추론의 병렬화는 목표가 어떻게 다른가요?\n\n**30초.** 학습은 처리량(토큰/초/GPU)만 보지만, 추론은 레이턴시 SLA(TTFT·TPOT) 를 지키면서 처리량을 내야 한다.\n그리고 추론은 KV 캐시라는 가변 메모리가 있다.\n\n학습은 배치를 마음대로 키워 compute-bound 로 만들 수 있다.\n추론은 TPOT 상한 때문에 배치를 무한히 못 키운다.\n학습은 메모리가 가중치 + gradient + optimizer 로 고정이고, 추론은 가중치 + KV(요청 수에 비례) 다.\n그래서 추론은 \"TP 로 레이턴시 맞추고 DP 로 처리량\" 이고, 학습은 \"메모리 맞추는 최소 TP/PP 에 DP 최대\" 다.\n\n## Q4: 모델이 GPU 한 장에 들어가면 DP 가 TP 보다 나은 이유는?\n\n**30초.** DP 는 통신이 0 이고 각 복제본이 독립적으로 continuous batching 을 하니 GPU 당 처리량이 가장 높다.\nTP 는 통신 비용을 내고 레이턴시를 사는 것이라 들어가는데 쪼갤 이유가 없다.\n\n7B 는 H100 한 장에 가중치 14 GB + KV 60 GB 가 된다.\nTP=2 로 쪼개면 레이턴시가 조금 줄지만 all-reduce 비용과 두 장 사이 동기화 때문에 두 장 합산 처리량이 DP=2 보다 낮다.\nTP 를 쓰는 건 (1) 안 들어가거나 (2) 레이턴시 SLA 를 한 장으로 못 맞출 때다.\nPR #57648 이 고친 DP placement group 이 이 \"복제본을 여러 노드에 깔기\" 의 기반이다.\n\n## Follow-up: 레이턴시를 줄이려면 TP, 처리량을 늘리려면 DP 라고 하는데 왜인가요?\n\n**30초.** TP 는 한 요청의 연산을 N 장이 나눠 하니 그 요청의 스텝 시간이 줄어 TPOT 가 내려가고, DP 는 요청을 N 개 복제본에 흩뿌려 동시에 처리하니 초당 토큰이 N 배가 된다.\n\nTP 는 \"한 요청을 빨리\", DP 는 \"많은 요청을 동시에\" 다.\n배치 1 사용자 한 명의 체감은 TP 가 좌우하고, 비용(토큰당 달러)은 DP 가 좌우한다.\n실전은 TP 를 SLA 가 허락하는 최소로 두고 나머지를 전부 DP 로 돈다.\n\n---\n\n### 손댄 곳\n\n- vLLM PR #57648 (머지 2026-09-29): DP placement groups 에서 ray[default] 의존 제거, 4× GPU 실기동 2→4 · dynamo-study/01-issues/todo-T2-vllm-dp-placement-list-nodes/\n",

   "qs": [
    "Q1: 시스템 프롬프트가 같은 요청 100개가 오면 무엇을 재사용할 수 있나요?",
    "Q2: 프리픽스 캐시는 무엇을 키로 쓰나요? 왜 블록 단위인가요?",
    "Q3: 엔진이 여러 대일 때 라우터가 캐시를 알아야 하는 이유는?",
    "Q4: 캐시 적중(locality) 과 부하 분산(load) 이 충돌하면 어떻게 정하나요?",
    "Follow-up: 캐시 히트율을 높이려다 한 엔진에 몰리면 어떤 지표가 나빠지나요?"
   ],
   "md": "> THEORY · inference · T2  \n> 구현 → engine/vllm/prefix_caching_impl.md, engine/dynamo/kv_router.md\n\n## Q1: 시스템 프롬프트가 같은 요청 100개가 오면 무엇을 재사용할 수 있나요?\n\n**30초.** 시스템 프롬프트 부분의 KV 캐시다.\n100 개 요청이 같은 2000 토큰 접두사를 가지면 그 prefill 을 한 번만 하고 블록을 공유한다.\n\nprefill 은 compute-bound 라 비싸고, 같은 토큰 열은 같은 KV 를 낸다(causal 이라 뒤에 뭐가 오든 앞부분은 같다).\n첫 요청이 만든 블록을 다음 요청이 그대로 가리키면 2000 토큰 prefill 이 사라져 TTFT 가 크게 준다.\nRAG 의 문서, few-shot 예시, 멀티턴 대화의 이전 턴도 전부 접두사다.\n\n## Q2: 프리픽스 캐시는 무엇을 키로 쓰나요? 왜 블록 단위인가요?\n\n**30초.** 블록 안 토큰 ID 들과 **앞 블록의 해시** 를 합쳐 만든 해시다.\n블록 단위인 건 KV 가 블록으로 관리되고, 토큰 단위 해시는 너무 많아서다.\n\n앞 블록 해시를 넣는 이유가 핵심이다.\n블록 3 의 KV 는 블록 1·2 의 내용에 의존하니(attention 이 앞을 본다) 같은 16 토큰이라도 앞이 다르면 다른 KV 다.\n그래서 해시가 체인이 되고, 접두사가 같은 만큼만 히트가 난다. ⭐️\n멀티모달 입력·LoRA ID 도 해시에 섞여야 다른 조건에서 잘못 재사용하지 않는다.\n\n## Q3: 엔진이 여러 대일 때 라우터가 캐시를 알아야 하는 이유는?\n\n**30초.** 캐시는 각 엔진의 GPU 메모리에 있어서, 같은 접두사 요청이 다른 엔진으로 가면 히트가 안 난다.\n라우터가 \"어느 엔진에 이 접두사가 있나\" 를 알아야 캐시가 쓸모가 있다.\n\n엔진 4 대에 랜덤 라우팅이면 히트율이 1/4 로 떨어진다.\n단순히 \"같은 사용자는 같은 엔진\" (sticky) 도 되지만, 시스템 프롬프트 공유처럼 사용자가 달라도 접두사가 같은 경우를 못 잡는다.\n엔진이 KV 블록 해시를 이벤트로 알려주면 라우터가 radix tree 로 들고 있다가 겹치는 엔진으로 보낸다.\nDynamo 의 kv-router 가 그것이다.\n\n## Q4: 캐시 적중(locality) 과 부하 분산(load) 이 충돌하면 어떻게 정하나요?\n\n**30초.** \"캐시 덕에 줄어드는 prefill 토큰\" 과 \"그 엔진이 지금 쥐고 있는 부하\" 를 같은 단위(토큰 또는 시간)로 환산해 더하고 최소를 고른다.\n\ncost = (요청 토큰 - 캐시 겹침 토큰) + 부하.\n겹침이 많아도 그 엔진이 꽉 찼으면 부하 항이 커져 다른 데로 간다.\nDynamo 는 겹친 블록 × 16 을 토큰으로 바꿔 빼고, 활성 KV 블록과 대기 요청을 부하로 더한다.\nargmin 만 쓰면 한 엔진에 몰릴 수 있어 온도를 둔 softmax 샘플링을 섞기도 한다.\n\n## Follow-up: 캐시 히트율을 높이려다 한 엔진에 몰리면 어떤 지표가 나빠지나요?\n\n**30초.** 그 엔진의 TPOT 와 대기열이 나빠지고, 다른 엔진은 논다.\n전체 처리량이 떨어지고 p99 TTFT 가 튄다.\n\n캐시 히트는 prefill 을 아끼지만 decode 는 그대로 그 엔진에서 돈다.\n히트율 100% 인 엔진 하나에 모든 decode 가 몰리면 KV 가 꽉 차 preemption 이 시작된다.\n그래서 cost 에 부하 항이 반드시 있어야 하고, 라우터 평가도 히트율 하나가 아니라 TTFT·TPOT 분포로 한다.\n\n---\n\n### 손댄 곳\n\n- Dynamo kv-router 4건: policy fallback 관측성(T4), admission best overlap(#12303), KV 복구 진행률(#12314), DP rank 게이지(#10696) · dynamo-study/01-issues/\n",

   "qs": [
    "Q1: greedy · temperature · top-k · top-p 는 각각 확률 분포를 어떻게 바꾸나요?",
    "Q2: repetition penalty 는 어디에 곱하나요?",
    "Q3: beam search 는 왜 LLM 채팅에선 잘 안 쓰나요?",
    "Q4: JSON 만 내보내게 강제하는(structured output) 원리는? 어느 단계에 개입하나요?",

   "md": "> THEORY · inference · T2  \n> 구현 → engine/vllm/sampling_structured_output.md\n\n## Q1: greedy · temperature · top-k · top-p 는 각각 확률 분포를 어떻게 바꾸나요?\n\n**30초.** greedy 는 최댓값 하나, temperature 는 logits 를 T 로 나눠 분포를 뾰족하게(T<1) 또는 평평하게(T>1), top-k 는 상위 k 개만 남기고, top-p 는 누적 확률이 p 가 되는 만큼만 남긴 뒤 샘플링한다.\n\n| | 하는 일 | 효과 |\n|---|---|---|\n| greedy | argmax | 결정적, 반복 잘 생김 |\n| temperature T | softmax(logits / T) | T→0 greedy, T↑ 다양성 ↑ |\n| top-k | 상위 k 개 밖은 확률 0 | 꼬리의 이상한 토큰 차단 |\n| top-p (nucleus) | 누적 p 까지만 | 분포가 뾰족하면 적게, 평평하면 많이 남김 |\n| min-p | 최대 확률의 p 배 미만 차단 | top-p 보다 적응적 |\n\n보통 temperature 0.7 + top-p 0.9 처럼 섞어 쓴다.\n순서는 temperature → top-k → top-p → 샘플링이다.\n\n## Q2: repetition penalty 는 어디에 곱하나요?\n\n**30초.** 이미 나온 토큰의 logit 에 곱한다(양수면 나누고 음수면 곱해 확률을 낮춘다).\n\nlogit > 0 이면 logit / penalty, logit < 0 이면 logit × penalty.\npenalty 1.0 이 무효, 1.1-1.3 이 보통이다.\nfrequency penalty(횟수 비례 빼기)와 presence penalty(나왔으면 고정값 빼기)는 OpenAI 식 변형이다.\n너무 세면 꼭 반복해야 하는 단어(the, 쉼표)까지 막아 문장이 깨진다.\n\n## Q3: beam search 는 왜 LLM 채팅에선 잘 안 쓰나요?\n\n**30초.** 긴 생성에서 확률 높은 경로가 \"안전하고 뻔한\" 쪽으로 수렴해 반복과 평범함이 심하고, 빔 수만큼 KV 캐시와 계산이 늘어서다.\n\nbeam search 는 매 스텝 상위 b 개 시퀀스를 유지하며 누적 로그확률이 가장 높은 걸 고른다.\n번역·요약처럼 정답이 좁은 과제에는 좋다.\n열린 대화에서는 확률 최대화가 사람다움과 어긋난다(likelihood trap).\n서빙 비용도 b 배라 vLLM 도 beam search 를 핵심 경로에서 빼고 별도 구현으로 뺐다.\n\n## Q4: JSON 만 내보내게 강제하는(structured output) 원리는? 어느 단계에 개입하나요?\n\n**30초.** 매 스텝 \"문법상 다음에 올 수 있는 토큰\" 집합을 계산해 그 밖의 logits 를 -∞ 로 막은 뒤 샘플링한다.\n개입 지점은 logits 가 나온 직후, softmax 전이다.\n\nJSON 스키마나 정규식을 상태 기계(FSM/문법)로 바꾸고, 현재 상태에서 가능한 토큰의 bitmask 를 만든다.\n토큰 ≠ 문자라 토큰이 문법 경계를 넘나드는 처리가 핵심이고, xgrammar · outlines · guidance 가 그 라이브러리다.\n모델은 그대로고 샘플링만 제약하니 재학습이 없다. ⭐️\nmask 계산이 스텝마다 돌아서 CPU 비용이 붙고, 그래서 미리 컴파일해 캐시한다.\n\n## Follow-up: logits processor 란 무엇이고 어디에 끼워 넣나요?\n\n**30초.** logits 가 나온 뒤 샘플링 전에 끼워 넣는 함수다.\n`f(logits, 지금까지 토큰) → 수정된 logits` 형태로, temperature · penalty · 금지 토큰 · 문법 제약이 전부 이 자리에 있다.\n\nvLLM 은 요청마다 다른 processor 를 배치 단위로 적용해야 해서 batched 구현(`v1/sample/logits_processor`) 을 따로 둔다.\nmin_tokens(EOS 금지), logit_bias, bad_words 가 내장이고 custom 도 플러그인으로 끼울 수 있다.\n\n",

   "md": "> THEORY · training · T1\n\n## Q1: DDP 는 무엇을 복제하고 무엇을 통신하나요? 어느 시점에?\n\n**30초.** 모델 전체를 GPU 마다 복제하고, 데이터만 나눠 각자 forward·backward 한 뒤 gradient 를 all-reduce 로 평균해 같은 모델을 유지한다.\n\n각 GPU 가 다른 미니배치로 gradient 를 구한다.\nbackward 가 끝나면(실제로는 레이어별로 끝나는 대로 겹쳐서) gradient 를 all-reduce 한다.\n모든 GPU 가 같은 평균 gradient 로 같은 업데이트를 하니 모델이 계속 같다.\n통신량은 스텝당 모델 크기 × 2 (ring all-reduce) 다.\n모델이 GPU 한 장에 들어가야 쓸 수 있다.\n\n## Q2: FSDP/ZeRO 1 · 2 · 3 는 각각 무엇을 샤딩하나요? 메모리와 통신이 어떻게 바뀌나요?\n\n**30초.** ZeRO-1 은 optimizer 상태, ZeRO-2 는 + gradient, ZeRO-3(=FSDP) 는 + 파라미터까지 GPU 마다 1/N 씩만 들고 필요할 때 모은다.\n\n| | 샤딩하는 것 | GPU 당 메모리 (N 장) | 통신 |\n|---|---|---|---|\n| DDP | 없음 | 파라미터 + grad + optimizer 전부 | all-reduce (grad) |\n| ZeRO-1 | optimizer 상태 (Adam 은 파라미터의 2배) | 그 부분 1/N | reduce-scatter + all-gather |\n| ZeRO-2 | + gradient | | 같음 |\n| ZeRO-3 / FSDP | + 파라미터 | 전부 1/N | forward·backward 마다 파라미터 all-gather |\n\nZeRO-3 는 레이어를 계산하기 직전에 그 레이어 파라미터를 all-gather 로 모으고 끝나면 버린다.\n메모리는 N 배 줄지만 통신이 늘어 노드 안 NVLink 에서 쓴다.\nAdam 의 optimizer 상태(m, v 가 FP32) 가 파라미터보다 커서 ZeRO-1 만으로도 효과가 크다.\n\n## Q3: TP · PP · SP(CP) 는 무엇을 나누고 어떤 통신이 생기나요? 표로 정리해보세요.\n\n**30초.** TP 는 레이어 안의 행렬을 열·행으로 쪼개고, PP 는 레이어 묶음을 GPU 에 나누고, SP/CP 는 시퀀스를 토큰 축으로 나눈다.\n\n| | 나누는 것 | 생기는 통신 | 어디서 |\n|---|---|---|---|\n| TP | 한 레이어의 가중치 행렬 (열/행 분할) | 레이어마다 all-reduce 2회 (attention · FFN) | 노드 안 NVLink |\n| PP | 레이어 묶음 (stage) | stage 경계에서 activation 전달 (point-to-point) | 노드 간 |\n| SP / CP | 시퀀스 (토큰 축) | attention 에서 K·V 교환 (ring) | 긴 컨텍스트 |\n| DP / FSDP | 데이터 (+ 파라미터 샤딩) | gradient all-reduce / 파라미터 all-gather | 어디든 |\n| EP | MoE 의 expert | all-to-all (토큰을 expert 로 보내고 받기) | 노드 안·간 |\n\n큰 모델은 보통 TP(노드 안 8장) × PP(노드 간) × DP(나머지) 를 겹친다(3D parallelism).\n\n## Q4: 노드 안은 TP, 노드 간은 PP/DP 라는 관행은 왜 생겼나요?\n\n**30초.** TP 는 레이어마다 all-reduce 를 두 번 해서 통신이 잦고 큰데, 노드 안 NVLink(900 GB/s) 는 버티고 노드 간 InfiniBand(50 GB/s) 는 못 버텨서다.\n\nTP 통신은 forward·backward 레이어마다 일어나니 레이어 수 × 2 × 스텝 수만큼이다.\nPP 는 stage 경계에서만 activation 을 넘기고 DP 는 스텝 끝에 한 번이라 빈도가 낮다.\n느린 링크에는 빈도 낮은 통신을 둔다.\n그래서 TP 는 8 (노드 안 GPU 수) 로 막고 그 위를 PP·DP 로 늘린다. ⭐️\n\n## Follow-up: PP 의 bubble 은 왜 생기고 1F1B 는 어떻게 줄이나요?\n\n**30초.** bubble 은 첫 micro-batch 가 마지막 stage 에 닿기 전까지 앞 stage 들이 노는 시간이고, 1F1B 는 forward 와 backward 를 번갈아 끼워 넣어 그 빈 시간을 채운다.\n\nstage 가 S 개면 단순 파이프라인은 처음 S-1 스텝 동안 뒤 stage 가 놀고, 끝에서 앞 stage 가 논다.\nmicro-batch 를 M 개로 쪼개면 bubble 비율이 (S-1)/M 로 준다.\n1F1B 는 micro-batch 하나의 forward 가 끝나면 바로 그것의 backward 를 돌려 activation 메모리도 줄인다.\n그래도 bubble 은 0 이 안 되어 PP 는 TP 보다 효율이 낮고, 노드 간에 어쩔 수 없을 때 쓴다.\n\n",

   "qs": [
    "Q1: RLHF 파이프라인(SFT → RM → PPO)을 단계별로 설명해보세요.",
    "Q2: DPO 는 RM 과 PPO 를 어떻게 없앴나요? 무엇을 잃나요?",
    "Q3: GRPO 는 PPO 와 뭐가 다른가요?",
    "Q4: RL 학습 루프에서 vLLM 같은 추론 엔진이 왜 들어가나요? (rollout) 가중치는 어떻게 동기화하나요?",
    "Follow-up: reward hacking 은 무엇이고 어떻게 막나요?"
   ],
   "md": "> THEORY · training · T2  \n> 구현 → engine/vllm/fault_tolerance_rl.md\n\n## Q1: RLHF 파이프라인(SFT → RM → PPO)을 단계별로 설명해보세요.\n\n**30초.** SFT 로 지시를 따르는 형식을 가르치고, 사람이 매긴 선호 쌍으로 reward model(RM) 을 학습하고, 그 RM 점수를 보상으로 PPO 로 정책(LLM)을 업데이트한다.\n\n```\n1. SFT     : (프롬프트, 좋은 답) 쌍으로 지도학습 → 정책 π_SFT\n2. RM      : 같은 프롬프트에 답 A·B 를 보여주고 사람이 고름 → \"A > B\" 쌍으로 점수 모델 학습\n3. PPO     : π 가 답을 생성 → RM 이 점수 → 점수를 올리는 방향으로 π 업데이트\n             + KL(π ‖ π_SFT) 패널티로 원래 모델에서 너무 멀어지지 않게\n```\n\n3 단계에서 정책·RM·참조 모델·value 모델 네 개가 동시에 메모리에 있어 비싸다.\n생성(rollout) 단계가 추론이라 vLLM 같은 엔진이 들어간다.\n\n## Q2: DPO 는 RM 과 PPO 를 어떻게 없앴나요? 무엇을 잃나요?\n\n**30초.** 선호 쌍 (좋은 답, 나쁜 답) 으로 정책을 직접 학습하는 loss 를 유도해, RM 학습과 PPO 샘플링을 없앴다.\n잃는 것은 \"새 답을 생성해 평가받는\" 탐색이다. 데이터에 있는 쌍 안에서만 배운다.\n\nDPO loss 는 \"좋은 답의 로그확률 - 참조 모델 로그확률\" 이 \"나쁜 답의 그것\" 보다 크게 만든다.\nRM 이 암묵적으로 정책 안에 들어가 있다는 수학적 동치에서 나온다.\n구현이 SFT 와 비슷하게 단순하고 안정적이다.\n대가는 분포 밖 탐색이 없어 PPO 보다 상한이 낮다는 평이고, 그래서 추론 능력(수학·코드)은 RL 쪽이 다시 주류다.\n\n## Q3: GRPO 는 PPO 와 뭐가 다른가요?\n\n**30초.** value 모델을 없애고, 같은 프롬프트에 답 G 개를 생성해 그룹 안의 평균·표준편차로 각 답의 advantage 를 구한다.\n\nPPO 는 \"이 상태가 얼마나 좋은가\" 를 추정하는 value 모델이 필요해 메모리와 학습 불안정이 따랐다.\nGRPO 는 그룹 내 상대 비교로 그걸 대체한다: advantage = (보상 - 그룹 평균) / 그룹 표준편차.\nDeepSeek-R1 이 이 방식으로 추론 능력을 끌어올렸다.\n보상이 규칙 기반(정답 일치, 코드 통과)이면 RM 도 필요 없어 더 단순해진다.\n\n## Q4: RL 학습 루프에서 vLLM 같은 추론 엔진이 왜 들어가나요? (rollout) 가중치는 어떻게 동기화하나요?\n\n**30초.** RL 은 매 스텝 정책이 답을 수백 개 생성해야 하는데(rollout), 학습 프레임워크의 generate 는 느려서 추론 엔진이 그 자리를 맡는다.\n가중치는 학습 스텝마다 바뀌니 학습 쪽 GPU 에서 추론 엔진 GPU 로 밀어넣어야 한다.\n\nrollout 이 RL 시간의 대부분이다.\ncontinuous batching·PagedAttention 이 있는 vLLM 이 훨씬 빠르다.\n동기화는 (1) 학습 프로세스가 가중치를 모아 vLLM worker 에 CUDA IPC/NCCL broadcast 로 쓰기, (2) 같은 GPU 에 두 개를 colocate 하고 포인터만 넘기기, (3) 체크포인트 저장 후 리로드(느림) 중 하나다.\nvLLM 은 `collective_rpc` 로 worker 의 `load_weights` 를 부르는 API 와 v0.29 의 `sharded_rdt` P2P 백엔드를 제공한다.\n\n## Follow-up: reward hacking 은 무엇이고 어떻게 막나요?\n\n**30초.** 정책이 RM 의 허점을 찾아 \"사람이 좋아할 답\" 이 아니라 \"RM 이 높게 주는 답\" 을 만드는 것이다.\n길게 쓰기, 자신감 있는 어투, 특정 표현 반복이 전형이다.\n\nRM 은 유한한 데이터로 학습된 근사라 분포 밖에서 틀린다.\n막는 법은 KL 패널티(참조 모델에서 멀어지지 않게), RM 앙상블, 규칙 기반 보상 병행, 그리고 RM 을 주기적으로 새 데이터로 재학습하는 것이다.\n\"보상이 올라가는데 사람 평가는 안 오른다\" 가 감지 신호다.\n\n",

   "qs": [
    "Q1: all-reduce · all-gather · reduce-scatter · all-to-all 이 각각 무엇을 하나요? 어느 병렬화가 어느 것을 쓰나요?",
    "Q2: ring all-reduce 의 통신량은 N 에 따라 어떻게 되나요? tree 는 언제 쓰나요?",

   "md": "> THEORY · training · T2\n\n## Q1: all-reduce · all-gather · reduce-scatter · all-to-all 이 각각 무엇을 하나요? 어느 병렬화가 어느 것을 쓰나요?\n\n**30초.** all-reduce 는 모두의 값을 합쳐 모두가 갖고, all-gather 는 각자 조각을 모두가 전부 갖고, reduce-scatter 는 합친 결과를 조각내 각자 하나씩, all-to-all 은 각자가 N 개 조각을 N 명에게 하나씩 보낸다.\n\n| collective | 입력 → 출력 | 쓰는 곳 |\n|---|---|---|\n| all-reduce | 각자 벡터 → 모두 같은 합 | DDP gradient, TP 레이어 출력 |\n| all-gather | 각자 조각 → 모두 전체 | FSDP 파라미터 모으기, TP 일부 |\n| reduce-scatter | 각자 벡터 → 합의 1/N 조각 | FSDP gradient, sequence parallel |\n| all-to-all | 각자 N 조각 → 상대별로 하나씩 | MoE 토큰 dispatch/combine |\n| broadcast | 하나 → 모두 | 가중치 초기 배포 |\n\n병렬화 기법은 결국 \"어느 collective 를 어디에 넣나\" 다.\n\n## Q2: ring all-reduce 의 통신량은 N 에 따라 어떻게 되나요? tree 는 언제 쓰나요?\n\n**30초.** ring 은 GPU 당 송수신량이 2(N-1)/N × 데이터 ≈ 2 × 데이터로 N 과 무관해 대역폭 최적이고, 레이턴시는 N 에 비례해 는다.\ntree 는 레이턴시가 log N 이라 작은 메시지나 노드 수가 많을 때 쓴다.\n\nring 은 데이터를 N 조각으로 나눠 이웃에게만 보내며 N-1 번 돌아 reduce-scatter 하고, 다시 N-1 번 돌아 all-gather 한다.\n큰 gradient(GB 단위)는 대역폭이 전부라 ring 이다.\n작은 텐서(decode 의 activation)는 N-1 번 홉의 레이턴시가 지배해 tree 나 NVLink SHARP 가 낫다.\nNCCL 이 크기와 토폴로지를 보고 자동으로 고른다.\n\n## Q3: NVLink · PCIe · InfiniBand 의 대역폭을 대략 말해보세요.\n\n**30초.** NVLink(H100 NVSwitch) 900 GB/s 양방향, PCIe Gen5 x16 약 64 GB/s 단방향, InfiniBand NDR 400 Gb/s = 50 GB/s 포트당.\n\n| 링크 | 대역폭 | 어디 |\n|---|---|---|\n| NVLink 4 + NVSwitch (H100) | 900 GB/s / GPU | 노드 안 8 장 전부 연결 |\n| PCIe Gen5 x16 | 64 GB/s | GPU ↔ CPU, NIC |\n| InfiniBand NDR | 50 GB/s / 포트 (노드당 8 포트면 400 GB/s) | 노드 간 |\n| HBM3 | 3,350 GB/s | GPU 안 |\n\nNVLink 와 IB 가 18 배 차이라 \"TP 는 노드 안\" 이 나온다.\n숫자는 NVIDIA 공개 스펙이고 실측은 70-80% 다.\n\n## Q4: all-reduce = reduce-scatter + all-gather 인 이유는?\n\n**30초.** 합친 결과를 모두가 가지려면, 먼저 각자 담당 조각을 모아 합치고(reduce-scatter), 그 조각들을 모두에게 돌리면(all-gather) 된다.\n두 단계 합이 all-reduce 다.\n\nring all-reduce 가 정확히 이 두 단계로 구현된다.\nFSDP 는 이 둘을 떼어 쓴다.\nbackward 에서 gradient 를 reduce-scatter 만 하고(각자 자기 샤드만 받음), forward 에서 파라미터를 all-gather 만 한다.\nall-reduce 를 쪼개 쓰니 통신량은 같은데 메모리는 1/N 이다. ⭐️\n\n## Follow-up: MoE 의 all-to-all 이 다른 collective 보다 비싼 이유는?\n\n**30초.** 다른 collective 는 패턴이 고정이라 ring 처럼 최적화할 수 있는데, all-to-all 은 누가 누구에게 얼마를 보내는지가 토큰마다 달라 통신량이 불균형하고 N² 개 흐름이 동시에 생긴다.\n\nMoE 는 라우터 결과에 따라 어느 GPU 로 몇 토큰이 가는지가 매 스텝 바뀐다.\n스위치에 N² 흐름이 몰려 혼잡하고, 가장 많이 받는 GPU 가 전체를 기다리게 한다.\ndecode 는 토큰이 적어 대역폭보다 레이턴시가 문제다.\n그래서 DeepEP 처럼 RDMA 를 직접 쓰는 전용 구현이 나왔고, EPLB 가 불균형을 줄인다.\n\n",

   "md": "> THEORY · training · T2  \n> 구현 → engine/vllm/multimodal_lora.md\n\n## Q1: full fine-tuning 과 PEFT 의 차이, 메모리는 각각 어디에 드나요?\n\n**30초.** full FT 는 모든 파라미터를 업데이트하고, PEFT 는 작은 추가 파라미터만 학습한다.\nfull FT 메모리는 파라미터 + gradient + optimizer(Adam 은 파라미터의 2 배 FP32) 로 파라미터의 약 8 배, PEFT 는 base 가중치(추론 메모리)에 추가 파라미터분만 더 든다.\n\n7B full FT 는 7B × (2 + 2 + 8 + 4 master) ≈ 112 GB 에 activation 까지 더해 H100 여러 장이다.\nLoRA 는 base 14 GB + 어댑터 수십 MB 와 그 gradient/optimizer 라 한 장에 들어간다.\nPEFT 는 \"base 는 얼리고 작은 것만 학습\" 이 핵심이다.\n\n## Q2: LoRA 는 왜 low-rank 분해가 먹히나요? rank r 은 무엇을 조절하나요?\n\n**30초.** fine-tuning 으로 생기는 가중치 변화 ΔW 가 실제로는 저차원(rank 가 낮음)이라는 관찰에서, ΔW 를 d×r 과 r×d 두 작은 행렬 B·A 의 곱으로 근사한다.\nr 은 그 근사의 차원이고, 클수록 표현력과 파라미터가 는다.\n\nW' = W + BA, W 는 얼리고 B(d×r)·A(r×d) 만 학습한다.\nd=4096, r=16 이면 파라미터가 4096² = 16.7M 에서 2 × 4096 × 16 = 131K 로 128 배 준다.\nr 은 8-64 가 보통이고 더 키워도 효과가 포화한다.\n추론 때 BA 를 W 에 합쳐 넣으면(merge) 속도 손실이 0 이다. ⭐️\nattention 의 W_Q·W_V 에만 붙여도 대부분 충분하다.\n\n## Q3: QLoRA 는 LoRA 에 무엇을 더했나요?\n\n**30초.** base 모델을 4 비트(NF4)로 양자화해 올리고 그 위에 LoRA 를 붙였다.\nbase 메모리가 1/4 가 되어 65B 모델을 48 GB GPU 한 장에서 fine-tuning 할 수 있다.\n\nforward 때 4 비트 가중치를 BF16 으로 풀어 계산하고 LoRA 가중치만 BF16 으로 학습한다.\n양자화 오차는 LoRA 가 어느 정도 보상한다.\npaged optimizer(optimizer 상태를 CPU 로 페이징)와 double quantization(양자화 상수도 양자화) 이 더 들어갔다.\n속도는 dequant 비용 때문에 LoRA 보다 느리다.\n\n## Q4: LoRA 어댑터 여러 개를 한 서버에서 서빙할 때 무엇이 공유되고 무엇이 분리되나요?\n\n**30초.** base 가중치와 KV 캐시 구조는 공유하고, 어댑터 B·A 행렬만 요청마다 다르다.\n한 배치에 어댑터가 다른 요청들이 섞이면 base matmul 은 한 번에 하고 어댑터 부분만 요청별로 따로 곱한다.\n\n어댑터를 merge 하면 어댑터마다 모델 사본이 필요해 멀티 서빙이 안 된다.\nunmerged 로 두면 x·W 는 배치 전체에 한 번, x·A·B 는 요청별 어댑터로 따로다.\npunica 의 SGMV 커널이 \"배치 안의 서로 다른 어댑터 행렬곱\" 을 한 커널로 처리한다.\nvLLM 은 어댑터를 GPU 에 N 개 상주시키고 LRU 로 교체한다.\n\n## Follow-up: SFT 데이터 품질이 양보다 중요하다는 말은 왜 나오나요?\n\n**30초.** SFT 는 모델이 \"이미 아는 것을 어떤 형식으로 꺼낼지\" 를 배우는 단계라 지식 주입이 아니고, 나쁜 예시 하나가 그 형식을 오염시키기 때문이다.\n\nLIMA 논문(1000 개 고품질 예시로 충분)이 대표 근거다.\n양이 많고 질이 낮으면 모델이 틀린 답의 패턴, 장황함, 거절 과잉을 배운다.\n사전학습 때 없던 지식을 SFT 로 넣으려 하면 환각이 늘어난다는 보고도 있다.\n\"SFT 는 형식, 지식은 사전학습, 선호는 RLHF\" 로 역할을 가르면 면접 답이 정리된다.\n\n",

   "md": "> THEORY · training · T2\n\n## Q1: FP32 · FP16 · BF16 · FP8 의 지수/가수 비트와 각각의 장단점은?\n\n**30초.** 지수 비트는 범위, 가수 비트는 정밀도다.\nFP32 는 둘 다 넉넉하고, FP16 은 범위가 좁고, BF16 은 FP32 의 범위에 정밀도만 깎았고, FP8 은 둘 다 최소다.\n\n| 형식 | 부호/지수/가수 | 최대값 | 상대 정밀도 | 특징 |\n|---|---|---|---|---|\n| FP32 | 1/8/23 | 3.4e38 | 6e-8 | 기준. master weight, 누적 |\n| FP16 | 1/5/10 | 65,504 | 1e-3 | 정밀하지만 범위 좁아 overflow |\n| BF16 | 1/8/7 | 3.4e38 | 4e-3 | FP32 범위, 정밀도 1/8 |\n| FP8 E4M3 | 1/4/3 | 448 | 6e-2 | 가중치·activation (범위보다 정밀도) |\n| FP8 E5M2 | 1/5/2 | 57,344 | 1.2e-1 | gradient (정밀도보다 범위) |\n\n바이트가 반으로 줄면 메모리 대역폭도 반, tensor core 속도는 2 배다.\n\n## Q2: 왜 BF16 이 학습 기본값이 됐나요? FP16 과 뭐가 다른가요?\n\n**30초.** FP32 와 지수 비트가 같아(8) 범위가 똑같아서 overflow/underflow 걱정 없이 그냥 바꿔 끼울 수 있다.\nFP16 은 범위가 65,504 라 gradient·activation 이 넘치거나 0 이 되어 loss scaling 이 필요했다.\n\n딥러닝은 큰 수와 작은 수가 다 나오지만 유효숫자 2-3 자리면 충분하다.\nBF16 은 그 요구에 딱 맞춰 범위를 지키고 정밀도를 버렸다.\nAmpere 부터 tensor core 가 BF16 을 지원하면서 사실상 기본이 됐다.\nFP16 은 추론 쪽에 남아 있고(범위가 좁아도 추론은 값이 안정적), 학습은 BF16 이다. ⭐️\n\n## Q3: mixed precision 에서 master weight 를 FP32 로 두는 이유와 loss scaling 이 필요한 이유는?\n\n**30초.** 가중치 업데이트 Δw = lr × grad 는 가중치보다 수천 배 작아서 BF16/FP16 가수로는 더해도 변화가 사라진다(1.0 + 0.0001 = 1.0).\n그래서 더하는 쪽은 FP32 로 둔다.\nloss scaling 은 FP16 전용으로, 작은 gradient 가 0(underflow) 이 되기 전에 loss 에 큰 수를 곱해 범위 안으로 밀어넣고 업데이트 때 다시 나눈다.\n\nforward·backward 는 BF16/FP16 으로 빨리 하고, optimizer 가 FP32 master 에 더한 뒤 다시 BF16 으로 캐스팅해 다음 스텝에 쓴다.\n메모리는 파라미터당 FP32 4 + BF16 2 = 6 바이트에 Adam 상태 8 바이트가 더 든다.\nBF16 은 범위가 FP32 와 같아 loss scaling 이 필요 없다.\n\n## Q4: 저정밀도로 누적(accumulate)하면 무슨 일이 생기나요?\n\n**30초.** 작은 값을 큰 값에 더할 때 가수 비트 밖으로 밀려 버려진다.\n수천 개를 BF16 으로 누적하면 뒤에 더하는 값들이 전부 사라져 합이 틀린다.\n\nBF16 가수 7 비트는 유효숫자 약 2.4 자리다.\n1000 + 1 은 1000 이 되고(1001 을 표현 못 함), 4096 개를 더하면 처음 몇 개만 남는다.\n그래서 matmul 은 입력이 BF16 이어도 **누적은 FP32** 로 한다.\ntensor core 가 그렇게 설계돼 있다.\nsoftmax 의 합, LayerNorm 의 분산, attention 의 PV 합이 전부 누적이라 FP32 가 필요한 자리다.\n\n## Follow-up: softmax 행합이 1 이어야 하는 성질이 BF16 역전파에서 왜 깨질 수 있나요?\n\n**30초.** softmax 출력 p 의 gradient dS = p ⊙ (dP - rowsum(dP ⊙ p)) 는 수학적으로 각 행의 합이 정확히 0 이다.\n그런데 dS 를 BF16 으로 라운딩하면 원소마다 ±0.4% 오차가 붙고, 그 합이 0 이 아니라 작은 상수가 되어 다음 곱(dS · K)에 편향으로 들어간다.\n\n행 길이가 수천이면 오차가 상쇄되지 않고 누적될 수 있다.\nGProj 논문(arXiv 2609.34272)이 이걸 \"행합 0 이 깨진다\" 로 분석하고 FA 역전파에서 dS 를 FP32 로 유지하거나 보정하는 수정을 제안했다.\nDao-AILab PR #2893/#2908 이 Blackwell sparse-MLA 경로를 고쳤고 Hopper dense 는 미수정으로 추정된다.\nShicheng 과의 접점이 이 지점이다(Study/1-3.md).\n\n---\n\n### 손댄 곳\n\n- Shicheng Study 1-3.md: FA3 역전파 dS BF16 라운딩, GProj 논문(arXiv 2609.34272), Dao-AILab PR #2893/#2908\n",

   "md": "> THEORY · training · T3\n\n## Q1: next-token prediction 하나로 어떻게 그 많은 능력이 나오나요?\n\n**30초.** \"다음 토큰을 맞추려면\" 문법·사실·추론·세계 지식이 전부 필요해서, 그 하나의 목표가 그 모든 것을 압축하도록 강제한다.\n\n\"프랑스의 수도는\" 다음 토큰을 맞추려면 지리를 알아야 하고, 코드의 다음 줄을 맞추려면 프로그래밍을 알아야 한다.\n인터넷 규모 텍스트에서 이걸 수조 번 하면 그 패턴들이 가중치에 들어간다.\n목표가 단순한 덕에 라벨이 필요 없고(self-supervised) 데이터가 무한하다.\n능력이 \"창발\" 하는 것처럼 보이는 건 loss 가 조금 내려갈 때 특정 과제가 갑자기 되기 때문이다.\n\n## Q2: scaling laws(Chinchilla) 가 말하는 것은? 파라미터와 데이터를 어떻게 배분하나요?\n\n**30초.** 주어진 연산 예산에서 loss 를 최소로 하려면 파라미터와 데이터를 비슷한 비율로 키워야 하고, 대략 파라미터 1 개당 토큰 20 개가 적정이라는 것이다.\n\nChinchilla(2022) 이전에는 데이터 대비 모델이 너무 컸다(GPT-3 175B 에 300B 토큰).\n70B 모델에 1.4T 토큰이 같은 연산으로 더 좋았다.\n이후 추론 비용을 고려해 \"작은 모델에 훨씬 많은 토큰\" 으로 더 기울었다(Llama-3-8B 는 15T 토큰, 1875 토큰/파라미터).\n학습 연산은 한 번이고 추론은 수십억 번이라 작은 모델이 유리하다.\n\n## Q3: 학습 데이터 파이프라인에서 중복 제거·필터링이 왜 중요한가요?\n\n**30초.** 중복은 모델이 특정 문장을 외우게(memorization) 해서 일반화를 해치고 평가 데이터 오염을 만들며, 저품질 텍스트는 그 패턴을 그대로 배우게 한다.\n\n같은 문서가 100 번 들어가면 모델이 그걸 통째로 재생한다.\n중복 제거(MinHash) 만으로 같은 연산에서 성능이 오른다는 보고가 많다.\n품질 필터(언어 판별 · perplexity 필터 · 분류기)는 데이터 양을 줄이지만 토큰당 가치를 올린다.\n\"데이터가 모델이다\" 가 최근 몇 년의 결론이다.\n\n## Follow-up: 학습 중 loss spike 가 나면 무엇을 의심하나요?\n\n**30초.** 특정 배치의 이상 데이터, learning rate 가 너무 큼, 수치 불안정(BF16 overflow · attention logits 폭발) 셋을 본다.\n\n처방은 체크포인트로 돌아가 그 배치를 건너뛰기, lr 낮추기, gradient clipping 확인, QK-norm 같은 안정화다.\n큰 모델은 spike 가 흔해서 자동 롤백 로직을 둔다.\n\"어느 스텝에 어느 데이터였나\" 를 추적할 수 있는 파이프라인이 있어야 디버깅이 된다.\n\n",

   "md": "> THEORY · transformer · T1  \n> 구현 → engine/vllm/attention_backends.md\n\n## Q1: Attention 이 하는 일을 Q·K·V 로 설명해보세요. 각각 무엇을 뜻하나요?\n\n**30초.** 각 토큰이 \"내가 찾는 것(Q)\" 으로 다른 토큰들의 \"이름표(K)\" 를 훑어 얼마나 볼지 정하고, 그 비율로 \"내용물(V)\" 을 섞어 가져온다.\n\nQ·K·V 는 같은 입력 x 에 서로 다른 행렬 W_Q·W_K·W_V 를 곱해 만든다.\nQK^T 가 토큰 쌍마다 \"얼마나 관련 있나\" 점수가 되고, softmax 로 합이 1 인 가중치로 바꾼 뒤 V 를 가중합한다.\n결과는 토큰마다 \"문맥을 섞어 넣은 새 표현\" 이다.\n한 줄: `Attention(Q,K,V) = softmax(QK^T / √d) V`.\n\n## Q2: 왜 QK^T 를 √d 로 나누나요? 안 나누면 어떻게 되나요?\n\n**30초.** d 가 커지면 QK^T 의 내적 값이 √d 에 비례해 커져서 softmax 가 한 토큰에 몰리고 gradient 가 사라진다.\n\nQ·K 의 각 성분이 평균 0, 분산 1 이면 내적의 분산은 d 다.\nd=128 이면 표준편차 11 짜리 값들이 softmax 에 들어가 거의 one-hot 이 된다.\n√d 로 나누면 분산이 1 로 돌아와 softmax 가 부드럽게 분포된다.\n안 나누면 학습 초기에 attention 이 한 곳만 보고 gradient 가 흐르지 않는다. ⭐️\n\n## Q3: causal mask 는 왜 필요하고 어디에 적용되나요?\n\n**30초.** 디코더가 미래 토큰을 보면 \"다음 토큰 예측\" 이 정답을 베끼는 문제가 되기 때문에, 위치 i 가 i 보다 뒤를 못 보게 막는다.\n\nQK^T 를 계산한 뒤 softmax 전에 j > i 인 자리에 -∞ 를 더한다.\nsoftmax 를 지나면 그 자리가 0 이 되어 미래 V 가 섞이지 않는다.\n학습 때는 시퀀스 전체를 한 번에 넣어도 각 위치가 자기 앞만 보게 되고, 추론 때는 자연스럽게 지금까지 생성된 것만 보게 된다.\n\n## Q4: 시퀀스 길이 n, 차원 d 일 때 attention 의 시간·공간 복잡도는?\n\n**30초.** 시간 O(n²d), 공간 O(n²) (점수 행렬) 다.\n\nQK^T 가 n×d 와 d×n 의 곱이라 n²d 번 곱한다.\nn×n 점수 행렬을 만들어 softmax 하니 공간이 n² 이다.\nFFN 은 O(nd²) 라 n 이 d(수천) 보다 작으면 FFN 이, 크면 attention 이 지배한다.\nFlashAttention 은 이 n² 행렬을 HBM 에 쓰지 않아 공간을 O(n) 으로 줄인다.\n시간 복잡도는 그대로다.\n\n## Follow-up: self-attention 과 cross-attention 의 차이는?\n\n**30초.** self 는 Q·K·V 가 전부 같은 시퀀스에서 나오고, cross 는 Q 는 디코더에서 K·V 는 인코더 출력에서 나온다.\n\ncross-attention 은 번역처럼 입력 시퀀스를 보면서 출력을 만드는 enc-dec 구조에 있다.\nGPT 계열 decoder-only 는 self-attention 만 쓴다.\n멀티모달 모델이 이미지 토큰을 텍스트가 보게 할 때 cross-attention 을 쓰기도 한다.\n\n",

    "Q2: MQA 와 GQA 는 무엇을 줄이려고 나왔나요? KV 캐시 크기와 어떻게 연결되나요?",

   "md": "> THEORY · transformer · T1  \n> 구현 → engine/vllm/paged_attention_block_manager.md\n\n## Q1: Multi-Head Attention 은 왜 쓰나요? head 하나와 뭐가 다른가요?\n\n**30초.** head 하나는 토큰 쌍마다 \"관련도\" 를 숫자 하나로만 재는데, 여러 head 는 서로 다른 관계(문법·지시·위치)를 동시에 본다.\n\nd_model 을 h 개 head 로 쪼개 각 head 가 d_model/h 차원에서 attention 을 따로 한다.\n결과를 이어붙이고 W_O 로 섞는다.\nhead 마다 다른 W_Q·W_K·W_V 라 다른 패턴을 배운다.\n연산량은 head 하나를 d_model 전체로 한 것과 같아 공짜로 표현력을 얻는다.\n\n## Q2: MQA 와 GQA 는 무엇을 줄이려고 나왔나요? KV 캐시 크기와 어떻게 연결되나요?\n\n**30초.** KV 캐시를 줄이려고 K·V head 수를 Q head 보다 적게 둔 것이다.\n\nMHA 는 Q·K·V head 수가 같다(Llama-2-7B 는 32·32·32).\nMQA 는 K·V head 를 1 개로 줄여 모든 Q head 가 공유한다.\nGQA 는 그 중간으로, Q head 몇 개가 K·V head 하나를 나눠 쓴다(Llama-3-8B 는 Q 32, KV 8).\nKV 캐시 공식의 n_kv_heads 가 32 → 8 이 되니 캐시가 4배 준다. ⭐️\ndecode 가 memory-bound 라 이게 그대로 속도와 배치 크기로 이어진다.\n\n## Q3: MLA(DeepSeek) 는 GQA 와 뭐가 다른가요? 왜 KV 캐시가 더 작아지나요?\n\n**30초.** GQA 는 head 수를 줄이고, MLA 는 K·V 를 저차원 latent 벡터 하나로 압축해 저장한 뒤 쓸 때 복원한다.\n\nMLA 는 K 와 V 를 따로 저장하지 않고 c = W_down · x 라는 작은 벡터만 캐시한다(DeepSeek-V2 는 512 차원).\nattention 때 c 에 W_up 을 곱해 K·V 를 만든다.\n저장 크기가 n_kv_heads × head_dim 이 아니라 latent 차원이라 GQA 보다 더 작다.\n대가는 복원 행렬곱과 전용 커널(FlashMLA)이다.\nRoPE 는 압축하면 깨져서 작은 별도 차원을 따로 둔다.\n\n## Follow-up: GQA 로 바꾸면 품질은 왜 크게 안 떨어지나요?\n\n**30초.** K·V 는 \"무엇이 어디 있나\" 를 담는 쪽이라 head 간에 비슷한 정보가 많고, Q 쪽 다양성은 그대로 남아서다.\n\n실험적으로 MHA 모델을 GQA 로 바꿔 짧게 추가 학습(uptraining)하면 품질이 거의 돌아온다.\n처음부터 GQA 로 학습한 Llama-3 는 MHA 대비 품질 손실이 보고되지 않는다.\nMQA(1 head) 까지 가면 손실이 보여서 8 정도가 현재의 타협점이다.\n\n",

    "Q1: 표준 attention 이 느린 진짜 이유는 FLOPs 인가요 메모리인가요?",

   "md": "> THEORY · transformer · T2  \n> 구현 → engine/vllm/attention_backends.md\n\n## Q1: 표준 attention 이 느린 진짜 이유는 FLOPs 인가요 메모리인가요?\n\n**30초.** 메모리다.\n표준 attention 은 n×n 점수 행렬을 HBM 에 쓰고 softmax 하고 다시 읽는데, 이 왕복이 FLOP 보다 훨씬 비싸다.\n\nQK^T 2n²d FLOP 은 H100 이 금방 한다.\nn² 행렬을 HBM 에 쓰고 읽는 바이트가 n² × 2 × 2(write + read) 이고, n=8K 면 256 MB 를 세 번(QK^T, softmax, PV) 왕복한다.\narithmetic intensity 가 d 수준(128)에 머물러 ridge point(295) 아래, 즉 memory-bound 다.\n빠르게 하려면 바이트를 줄여야 한다. ⭐️\n\n## Q2: FlashAttention 이 '한 번도 n×n 행렬을 HBM 에 쓰지 않는' 방법을 설명해보세요 (tiling).\n\n**30초.** Q·K·V 를 SRAM 에 들어가는 블록으로 잘라, 블록 쌍마다 점수 → softmax → V 곱까지 SRAM 안에서 끝내고 결과만 누적한다.\nn×n 행렬이 통째로 존재하는 순간이 없다.\n\n```\nfor Q 블록 i:\n    acc = 0, running max/sum 초기화\n    for K,V 블록 j:\n        S_ij = Q_i · K_j^T        (SRAM)\n        P_ij = exp(S_ij - max)    (SRAM, online softmax 로 보정)\n        acc += P_ij · V_j         (SRAM)\n    O_i = acc / sum               (HBM 에 한 번 쓰기)\n```\n\nHBM 왕복이 n² 에서 n·d 로 줄고, 긴 시퀀스에서 compute-bound 로 넘어간다.\nbackward 는 n² 행렬을 저장하지 않고 다시 계산한다(recompute).\n\n## Q3: online softmax 는 어떻게 블록 단위로 softmax 를 맞추나요?\n\n**30초.** softmax 는 전체 최댓값과 전체 합을 알아야 하는데 블록 단위로는 모른다.\n그래서 \"지금까지의 최댓값 m 과 합 l\" 을 들고 가다 새 블록에서 더 큰 값이 나오면 이전 누적을 e^{m_old - m_new} 로 다시 스케일한다.\n\n블록 j 까지의 결과를 exp(S - m_j) 기준으로 모았다고 하자.\n블록 j+1 에서 m_{j+1} > m_j 가 나오면, 이전 누적 acc 와 합 l 에 exp(m_j - m_{j+1}) 을 곱해 새 기준으로 맞추고 더한다.\n수학적으로 끝에 가면 전체를 한 번에 한 것과 같다.\n이 보정 덕에 한 패스로 끝난다.\n\n## Q4: FA2 → FA3 에서 무엇이 달라졌나요?\n\n**30초.** FA2 는 스레드 블록 간 일 나누기와 비행렬 연산을 줄여 GPU 활용률을 올렸고, FA3 는 Hopper 전용으로 TMA·비동기 WGMMA 로 메모리 이동과 행렬곱을 겹치고 FP8 을 지원한다.\n\nFA1 → FA2: 2배 (A100 에서 50-73% 활용률).\nFA2 → FA3: H100 에서 1.5-2배 (75% 활용률, FP8 은 1.2 PFLOPS).\nFA3 는 producer/consumer warp 를 나눠 한쪽이 다음 블록을 가져오는 동안 다른 쪽이 계산한다.\nBlackwell 은 또 다른 구현(FA4·CuTeDSL) 이다.\n\n## Follow-up: backward 에서 dS 를 BF16 으로 라운딩하면 왜 행합이 0 에서 깨지나요?\n\n**30초.** dS 의 각 행은 softmax gradient 라 정확히는 합이 0 인데, BF16 으로 라운딩하면 각 원소에 반올림 오차가 붙어 합이 0 에서 벗어나고, 그게 K 와 곱해져 dQ·dK 에 편향으로 들어간다.\n\nBF16 은 가수 7 비트라 상대 오차가 약 0.4% 다.\n행 원소가 수천 개면 오차가 상쇄되지 않고 누적될 수 있다.\nGProj 논문(arXiv 2609.34272)이 이 증상을 분석했고 Dao-AILab PR #2893/#2908 이 Blackwell sparse-MLA 경로를 FP32 로 고쳤다.\nHopper dense 경로는 미수정으로 추정되어 Shicheng 과의 접점으로 보고 있다(Study/3.md).\n\n---\n\n### 손댄 곳\n\n- Shicheng Wen 협업 학습 · USC/Research-Opportunity/Shicheng-Wen/Study/1.md 2.md 3.md (FA3 역전파 BF16 행합 문제, GProj 논문)\n",

   "md": "> THEORY · transformer · T2  \n> 구현 → engine/vllm/distributed_executor.md\n\n## Q1: MoE 가 dense 모델과 다른 점은? 파라미터는 많은데 왜 계산은 적나요?\n\n**30초.** FFN 하나 대신 expert FFN 여러 개(8-256)를 두고, 토큰마다 라우터가 top-k(1-8)개만 고른다.\n파라미터는 expert 수 배로 늘지만 토큰 하나는 k 개만 지나니 계산은 dense 와 비슷하다.\n\nMixtral 8x7B 는 expert 8 개 중 2 개, 총 47B 파라미터에 토큰당 활성 13B 다.\nDeepSeek-V3 는 256 개 중 8 개 + 공유 expert 1 개다.\n\"지식은 많이 저장하고 토큰마다 필요한 것만 꺼내 쓴다\" 가 뜻이다.\n대가는 메모리(전부 올려야 함)와 통신(EP)이다.\n\n## Q2: 라우터가 top-k 로 expert 를 고르는 과정을 설명해보세요.\n\n**30초.** 라우터는 작은 선형층이다.\n토큰 표현 x 에 W_r 을 곱해 expert 수만큼 점수를 내고, softmax 후 상위 k 개를 골라 그 가중치로 expert 출력을 합친다.\n\n```\nscores = softmax(x · W_r)          # [num_experts]\ntop_k  = 상위 k 개의 (index, weight)\ny      = Σ weight_i × Expert_i(x)   # 고른 것만 계산\n```\n\n라우터도 학습되지만 top-k 가 미분 불가라 고른 expert 의 가중치만으로 gradient 가 흐른다.\n어떤 expert 가 뭘 담당하는지는 학습이 정하고, 해석은 사후적이다.\n\n## Q3: load balancing loss 는 왜 필요한가요? 없으면 어떻게 되나요?\n\n**30초.** 라우터가 몇 개 expert 만 계속 고르면 그것들만 학습되고 나머지는 죽는다(collapse).\nload balancing loss 는 expert 별 토큰 수가 고르도록 추가 loss 를 준다.\n\nexpert i 가 받은 토큰 비율 f_i 와 라우터가 준 평균 확률 P_i 의 곱을 더한 Σ f_i × P_i 를 loss 에 더한다.\n고르게 분포하면 최소가 된다.\n없으면 초기에 조금 잘 된 expert 로 쏠려 사실상 dense 모델이 된다.\nDeepSeek-V3 는 loss 대신 bias 를 동적으로 조절하는 auxiliary-loss-free 방식을 쓴다.\n\n## Q4: Expert Parallel 은 무엇을 어디에 나누나요? all-to-all 이 왜 나오나요?\n\n**30초.** EP 는 expert 들을 GPU 에 나눠 놓는다(GPU 8 장이면 256 개 중 32 개씩).\n토큰은 자기가 고른 expert 가 있는 GPU 로 가야 하니 모든 GPU 가 서로 토큰을 보내고 받는 all-to-all 이 레이어마다 두 번(dispatch · combine) 생긴다.\n\nTP 로 expert 를 쪼개면 작은 행렬이 더 작아져 비효율이고, 전부 복제하면 메모리가 안 된다.\nEP 가 유일한 답이라 MoE 서빙은 all-to-all 성능이 전부다. ⭐️\ndecode 는 토큰이 적어 all-to-all 이 레이턴시 지배라 DeepEP 같은 전용 라이브러리가 나왔다.\n\n## Follow-up: EPLB(Expert Parallel Load Balancer) 는 무엇을 재배치하나요?\n\n**30초.** 실제 트래픽에서 expert 별 부하를 재서, 뜨거운 expert 는 여러 GPU 에 복제하고 식은 expert 는 한 GPU 에 몰아 각 GPU 의 토큰 수를 맞춘다.\n\n학습 때 균형을 맞췄어도 서빙 입력 분포는 다르다.\nEPLB 는 주기적으로 통계를 모아 배치표를 다시 짜고 가중치를 옮긴다.\n9/17 실측에서 elastic EP 로 랭크 수를 바꿀 때 EPLB 재구성이 함께 돌았고, NIXL 없이는 `--eplb-config.use_async=false` 가 필요했다.\n\n---\n\n### 손댄 곳\n\n- elastic EP + EPLB 실기동 (2026-09-17, 4× RTX PRO 5000, DeepSeek-V2-Lite) · dynamo-study/02-env/README.md '9/17 RunPod 실기동'\n",

    "Q1: Attention 은 왜 위치 정보가 없나요? 그래서 뭘 넣어주나요?",

   "md": "> THEORY · transformer · T2\n\n## Q1: Attention 은 왜 위치 정보가 없나요? 그래서 뭘 넣어주나요?\n\n**30초.** attention 은 집합 연산이라 토큰 순서를 바꿔도 결과가 같다(permutation equivariant).\n그래서 \"몇 번째인지\" 를 따로 넣어줘야 한다.\n\nQK^T 는 모든 쌍을 똑같이 보고 softmax 도 순서를 모른다.\n\"고양이가 개를\" 과 \"개가 고양이를\" 이 같아진다.\n위치 정보를 입력 임베딩에 더하거나(절대), Q·K 에 위치 의존 변환을 걸어(상대) 넣어준다.\n\n## Q2: sinusoidal 과 learned 의 차이는?\n\n**30초.** sinusoidal 은 위치마다 고정된 사인·코사인 값을 더하고, learned 는 위치 임베딩 테이블을 학습한다.\n\nsinusoidal 은 파라미터가 없고 학습 길이 밖도 값은 나오지만 품질은 보장 안 된다.\nlearned 는 테이블 크기가 최대 길이라 그 밖은 아예 없다.\n둘 다 \"절대 위치\" 라 토큰 쌍의 거리 정보가 간접적이다.\nGPT-2 가 learned, 원래 트랜스포머가 sinusoidal 이다.\n\n## Q3: RoPE 는 어떻게 동작하고 왜 상대 위치가 자연스럽게 나오나요?\n\n**30초.** Q 와 K 벡터를 위치 m 에 비례한 각도로 회전시킨다.\n회전된 Q_m · K_n 의 내적은 각도 차 (m - n) 에만 의존해서 상대 위치가 자동으로 나온다.\n\nd 차원을 2 개씩 짝지어 복소수로 보고, 위치 m 에서 e^{i m θ_k} 를 곱한다.\n내적은 e^{i(m-n)θ} 가 되어 절대 위치는 사라지고 차이만 남는다.\n임베딩에 더하는 게 아니라 attention 안에서 Q·K 에만 적용하니 V 와 잔차는 안 건드린다.\nLlama · Qwen · DeepSeek 전부 RoPE 다. ⭐️\n\n## Q4: ALiBi 는 RoPE 와 뭐가 다른가요?\n\n**30초.** ALiBi 는 회전 대신 attention 점수에 거리에 비례한 패널티(-m × |i-j|)를 그냥 더한다.\n\n파라미터도 없고 Q·K 도 안 바꾼다.\n\"먼 토큰은 덜 보라\" 는 편향을 head 마다 다른 기울기 m 으로 준다.\n학습 길이 밖으로 자연스럽게 늘어나는 게 장점이고, RoPE 보다 표현력이 낮다는 평이 있어 주류는 RoPE 다.\n\n## Follow-up: 학습 때보다 긴 컨텍스트를 쓰려면(YaRN 등) 무엇을 바꾸나요?\n\n**30초.** RoPE 의 회전 주파수 θ 를 늘려(base 를 키워) 긴 위치가 학습 때 본 각도 범위 안에 들어오게 한다.\nYaRN 은 주파수 대역마다 다르게 늘리고 attention 온도도 보정한다.\n\nRoPE 는 학습 길이 밖 위치에서 본 적 없는 각도가 나와 깨진다.\nposition interpolation 은 위치를 L_train / L_new 로 줄여 넣는다.\nNTK-aware 는 저주파(멀리 보는) 쪽만 늘리고, YaRN 은 그걸 대역별로 나눠 적용한다.\n짧은 추가 학습으로 4K → 128K 가 되는 이유다.\n\n",

   "qs": [
    "Q1: 디코더 블록 하나를 구성하는 요소를 순서대로 설명해보세요.",
    "Q2: residual connection 은 왜 필요한가요?",
    "Q3: pre-norm 과 post-norm 의 차이, 요즘 LLM 이 pre-norm 을 쓰는 이유는?",
    "Q4: LayerNorm 과 RMSNorm 의 차이는? 왜 RMSNorm 으로 바뀌었나요?",
    "Follow-up: 7B 모델이 왜 7B 인지 파라미터 수를 세어보세요 (어디에 몰려 있나요?)"
   ],
   "md": "> THEORY · transformer · T2\n\n## Q1: 디코더 블록 하나를 구성하는 요소를 순서대로 설명해보세요.\n\n**30초.** 입력 → (RMSNorm → self-attention → 잔차 더하기) → (RMSNorm → FFN → 잔차 더하기) → 출력. 이걸 L 번 쌓는다.\n\nattention 은 토큰끼리 정보를 섞고, FFN 은 토큰 하나 안에서 비선형 변환을 한다.\n둘 다 들어가기 전에 정규화하고(pre-norm), 나온 걸 입력에 더한다(residual).\nFFN 은 d → 4d(또는 SwiGLU 면 약 2.7d × 2) → d 로 넓혔다 좁히는 두 행렬이다.\n파라미터의 2/3 가 FFN 에 있다.\n\n## Q2: residual connection 은 왜 필요한가요?\n\n**30초.** 깊은 네트워크에서 gradient 가 층을 거치며 사라지지 않게 \"입력을 그대로 지나가는 길\" 을 하나 더 두는 것이다.\n\nx + f(x) 형태라 f 의 gradient 가 0 이어도 x 쪽으로 gradient 가 1 로 흐른다.\n각 층은 \"전부 새로 만드는 것\" 이 아니라 \"입력에 조금 더하는 것\" 만 배우면 되어 학습이 쉽다.\n32 층, 80 층을 쌓을 수 있는 이유다.\nresidual stream 이라는 표현이 여기서 나온다: 토큰 표현이 흐르는 줄기에 각 층이 더해 넣는다.\n\n## Q3: pre-norm 과 post-norm 의 차이, 요즘 LLM 이 pre-norm 을 쓰는 이유는?\n\n**30초.** post-norm 은 `Norm(x + f(x))`, pre-norm 은 `x + f(Norm(x))` 다.\npre-norm 은 잔차 길이 자체는 정규화하지 않아서 gradient 가 더 안정적으로 흘러 큰 모델이 warmup 없이도 잘 학습된다.\n\n원래 트랜스포머(2017)는 post-norm 이었다.\n깊어지면 잔차에 정규화가 걸려 gradient 가 층마다 줄어 학습이 불안정했다.\nGPT-2 부터 pre-norm 으로 바뀌었고 지금 LLM 은 거의 전부 pre-norm 이다.\n단점은 마지막 출력의 스케일이 커져서 맨 끝에 Norm 을 하나 더 둔다.\n\n## Q4: LayerNorm 과 RMSNorm 의 차이는? 왜 RMSNorm 으로 바뀌었나요?\n\n**30초.** LayerNorm 은 평균을 빼고 분산으로 나누는데, RMSNorm 은 평균을 안 빼고 RMS(제곱평균제곱근)로만 나눈다.\n계산이 줄고 성능은 같아서 바뀌었다.\n\nLayerNorm: (x - μ) / σ × γ + β.\nRMSNorm: x / RMS(x) × γ.\n평균 계산과 β 가 빠져 연산이 10-20% 줄고, 실험적으로 품질 차이가 없었다.\nLlama 계열이 전부 RMSNorm 이다. ⭐️\nmemory-bound 인 elementwise 연산이라 작은 절약도 그대로 시간이다.\n\n## Follow-up: 7B 모델이 왜 7B 인지 파라미터 수를 세어보세요 (어디에 몰려 있나요?)\n\n**30초.** Llama-2-7B 는 32 층 × (attention 4 × d² + FFN 3 × d × 11008) + embedding 2 × 32000 × d, d=4096 이면 약 6.7B.\n\n| 부분 | 계산 | 개수 |\n|---|---|---|\n| attention (W_Q·W_K·W_V·W_O) | 4 × 4096² | 67M / 층 |\n| FFN (SwiGLU 3 행렬) | 3 × 4096 × 11008 | 135M / 층 |\n| 층 합 | (67M + 135M) × 32 | 6.5B |\n| embedding + lm_head | 2 × 32000 × 4096 | 0.26B |\n\nFFN 이 전체의 약 2/3 다.\nMoE 는 이 FFN 을 expert 여러 개로 바꿔 파라미터는 늘리고 토큰당 계산은 유지한다.\n\n",

   "md": "> THEORY · transformer · T3\n\n## Q1: BPE 는 어떻게 vocab 을 만드나요?\n\n**30초.** 글자(바이트) 단위에서 시작해 \"가장 자주 붙어 나오는 쌍\" 을 하나로 합치는 걸 vocab 크기(32K-128K)에 닿을 때까지 반복한다.\n\n처음엔 256 바이트가 vocab 이다.\n말뭉치에서 가장 빈번한 인접 쌍(예: 't'+'h') 을 새 토큰 'th' 로 추가하고, 그걸 반영해 다시 센다.\n자주 나오는 단어는 한 토큰, 희귀한 단어는 여러 조각이 된다.\n인코딩은 학습된 merge 규칙을 순서대로 적용한다.\nLlama-3 는 128K vocab, GPT-4 는 100K 정도다.\n\n## Q2: 토큰 수가 비용·레이턴시와 어떻게 연결되나요?\n\n**30초.** 비용은 토큰 수로 청구되고, prefill 시간은 토큰 수에 비례하고, decode 는 토큰 하나당 한 스텝이라 출력 토큰 수가 그대로 생성 시간이다.\n\n같은 뜻이라도 영어 100 토큰이 한국어로는 150-200 토큰이 될 수 있다(vocab 이 영어 중심).\nKV 캐시도 토큰 수에 비례한다.\n토크나이저가 효율적일수록(한 토큰에 더 많은 글자) 같은 문장이 싸고 빠르다.\nvocab 을 키우면 토큰 수가 줄지만 embedding 과 lm_head 가 커진다.\n\n## Q3: 특수 토큰(BOS/EOS/PAD) 은 각각 어디서 쓰이나요?\n\n**30초.** BOS 는 시퀀스 시작(모델이 \"여기부터 새 문서\" 로 인식), EOS 는 끝(생성 중 이게 나오면 멈춤), PAD 는 배치에서 길이를 맞추는 빈 자리(attention mask 로 무시) 다.\n\n채팅 모델은 여기에 역할 구분 토큰(`<|user|>`, `<|assistant|>`) 이 더 있고, 채팅 템플릿이 그걸 붙인다.\nEOS 를 안 넣으면 모델이 안 멈추고, 템플릿이 틀리면 모델이 이상하게 답한다.\n서빙에서 `stop` 토큰 설정과 `min_tokens`(EOS 금지) 가 이 자리다.\n\n## Follow-up: 같은 문장이 모델마다 토큰 수가 다른 이유는?\n\n**30초.** 토크나이저가 다르기 때문이다.\nvocab 크기와 학습 말뭉치가 다르면 같은 문장이 다르게 쪼개진다.\n\nLlama-2(32K) 와 Llama-3(128K) 는 같은 영어 문장에서 토큰 수가 15% 정도 차이 난다.\n한국어·코드처럼 학습 데이터에 적은 언어는 차이가 더 크다.\n모델 비교 벤치마크에서 \"토큰/초\" 를 그대로 비교하면 토크나이저 차이가 섞인다.\n\n",

   "title": "Parking Lot",
   "diff": "M",
   "cat": "ood",
   "catName": "OOD",
   "tags": [],
   "link": "",
   "desc": "in-progress (1-5단계)",
   "qs": [
    "1. Requirements",

   "md": "@date: 2026-08-17\n@status: in-progress (1-5단계 완료: Requirements/Use Cases/Class Design/Method Signatures/Skeleton Code, 6 Trade-offs & Extensions 부터 이어서)\n@review: 0\n\n---\n\n## 1. Requirements\n\n### Functional\n\n- 총 3층, 층당 100대\n- motorcycle=small, car=medium, truck=large, 작은 것은 그것보다 큰 것에 주차가능\n- 층당 100자리 = motorcycle 20 / car 60 / truck 20. 층 간 편차는 없어요.\n- 요금\n  - 입차 : 티켓에 진입 시간 기록\n  - 출차 : (출차 시간 - 진입 시간) × 종류별 요금 계산\n  - motorcycle $1/hr, car $2/hr, truck $4/hr\n\n### Non-Functional\n\n- 동시성 : 여러 차가 동시에 입차후 같은 자리 두고 경쟁하는 상황\n- 확장성 : 나중에 층/빌딩 추가되어도 구조 안 깨지도록 설계\n- 가용성 : 자리 조회/배정이 빠르도록\n\n---\n\n## 2. Use Cases\n\n- Driver\n  - 입차 : parking gate 통과 + 자리 찾기\n  - 출차 : parking gate 통과 + 자리 제거\n  - 주차 : parking space 한 곳에 주차\n  - 요금 : 나가면서 정산\n- Administrator\n  - 빈 자리 갯수 조회 ( 차량 사이즈 별 )\n  - 만차 여부 판단\n  - 요금 계산\n\n---\n\n\n\n## 3. Class Design\n\n\n\n### 엔티티\n\n- Vehicle\n- ParkingSpot\n- Floor\n- ParkingLot\n- Ticket\n\n\n\n### 관계 (UML 감각)\n\n```\nParkingLot\n  - Floor\n    - ParkingSpot (abstract -> SmallSpot/MediumSpot/LargeSpot)\n      - Availability\n      - Vehicle type\n\nVehicle (abstract)\n  - Motorcycle\n  - Car\n  - Truck\n\nParkingSpot (abstract)\n  - SmallSpot\n  - MediumSpot\n  - LargeSpot\n\nParkingLot 1 – N Floor\nFloor 1 – N ParkingSpot\nTicket 1 – 1 Vehicle\nTicket 1 – 1 ParkingSpot\n```\n\n\n\n### 디자인 패턴\n\n\n| 지점                   | 패턴            | 이유          |\n| -------------------- | ------------- | ----------- |\n| Vehicle 생성 (type→객체) | **Factory**   | 생성 로직 한 곳에  |\n| 요금 계산 (종류/정책별)       | **Strategy**  | 계산 방식 교체 가능 |\n| ParkingLot (하나만)     | **Singleton** | 인스턴스 1개     |\n\n\n---\n\n\n\n## 4. Method Signatures\n\n```cpp\nenum class VehicleSize { Small, Medium, Large }\n\nclass Vehicle {\npublic:\n    virtual ~Vehicle() = default;\n    virtual VehicleSize getSize() const = 0;\n    const std::string& getLicensePlate() const;\nprotected:\n    std::string licensePlate;\n};\n\nclass Motorycycle : public Vehicle {\n  VehicleSize getSize() const override { return VehicleSize::Small; }\n};\nclass Car : public Vehicle {\n  VehicleSize getSize() const override { return VehicleSize::Medium; }\n};\nclass Truck : public Vehicle {\n  VehicleSize getSize() const override { return VehicleSize::Large; }\n};\n```\n\n```cpp\nclass ParkingSpot {\npublic:\n  ParkingSpot(string id, VehicleSize size);\n  bool isAvailable() const { return parkedVehicle_ == nullptr;}\n  VehicleSize getSize() const { return size_;}\n  const string& getId() const{return id_;}\n  bool canFit(const Vehicle& v) const { return v.getSize() <= size_;}\n\n  bool park(Vehicle* v);\n  Vehicle* vacate();\n\nprivate:\n  string id_;\n  VehicleSize size_;\n  Vehicle* parkedVehicle_ = nullptr;\n};\n```\n\n```cpp\nclass Floor {\n  Floor(int floorNumber, int smallCount, int mediumCount, int largetCount);\n\n  ParkingSpot* findAndReserve(VehicleSize size);\n  void release(ParkingSpot* spot);\n\n  int availableCount(VehicleSize size) const;\n  bool isFull() const;\n\nprivate:\n  int floorNumber_;\n  vector<unique_ptr<ParkingSpot>> spots_;\n  array<queue<ParkingSpot*>, 3> freeSpots_;\n};\n```\n\n```cpp\nusing Clock     = chrono::steady_clock;\nusing TimePoint = Clock::time_point;\nusing Duration  = Clock::duration;\n\nclass PricingStrategy {\npublic:\n  virtual ~PricingStrategy() = default;\n  virtual double calculate(VehicleSize size, Duration d) const = 0;\n};\n```\n\n```cpp\nclass ParkingLot {\npublic:\n  static ParkingLot& getInstance();\n  ParkingLot(const ParkingLot&) = delete;\n  ParkingLot& operator=(const ParkingLot&) = delete;\n\n  void setPricingStrategy(unique_ptr<PricingStrategy> p);\n\n  Ticket* parkVehicle(Vehicle* v);\n  double unparkVehicle(Ticket* t);\n\n  int availableCount(VehicleSize size) const;\n  bool isFull() const;\n\n  int getNextTicketId();\n  Ticket* addTicket(Vehicle* v, ParkingSpot* ps, Floor* f);\n  void removeTicket(Ticket* t);\n\nprivate:\n  ParkingLot() = default;\n  vector<unique_ptr<Floor>> floors_;\n  unique_ptr<PricingStrategy> pricing_;\n  vector<unique_ptr<Ticket>> activeTickets_;\n  int nextTicketId_ = 1;\n}\n```\n\n\n\n```cpp\nclass Floor;   // 전방 선언 — Ticket 이 Floor* 만 들고 있어서 정의는 아직 필요 없다\n\nclass Ticket {\npublic:\n  Ticket(string id, Vehicle* v, ParkingSpot* s, Floor* f, TimePoint entry);\n\n  const string& getId() const;\n  Vehicle* getVehicle() const;\n  ParkingSpot* getSpot() const;\n  Floor* getFloor() const;\n  TimePoint getEntryTime() const;\n\nprivate:\n  string id_;\n  Vehicle* vehicle_;\n  ParkingSpot* spot_;\n  Floor* floor_;          // 어느 층의 자리인지. 입차 때 이미 알던 정보를 버리지 않는다\n  TImePoint entryTime_;\n}\n\n```\n\n---\n\n\n\n\n\n\n\n## 5. Skeleton Code\n\n```cpp\nclass Floor {\n  Floor(int floorNumber, int smallCount, int mediumCount, int largetCount);\n\n  ParkingSpot* findAndReserve(VehicleSize size);\n  void release(ParkingSpot* spot);\n\n  int availableCount(VehicleSize size) const;\n  bool isFull() const;\n\nprivate:\n  int floorNumber_;\n  vector<unique_ptr<ParkingSpot>> spots_;\n  array<queue<ParkingSpot*>, 3> freeSpots_;\n};\n\nenum class VehicleSize { Small, Medium, Large }\n\nclass Vehicle {\npublic:\n    virtual ~Vehicle() = default;\n    virtual VehicleSize getSize() const = 0;\n    const std::string& getLicensePlate() const;\nprotected:\n    std::string licensePlate;\n};\n\nclass Ticket {\npublic:\n  Ticket(int id, Vehicle* v, ParkingSpot* s, Floor* f, TimePoint entry);\n\n  const string& getId() const;\n  Vehicle* getVehicle() const;\n  ParkingSpot* getSpot() const;\n  Floor* getFloor() const;\n  TimePoint getEntryTime() const;\n\nprivate:\n  int id_;\n  Vehicle* vehicle_;\n  ParkingSpot* spot_;\n  Floor* floor_;\n  TImePoint entryTime_;\n}\n\n\nclass HourlyPricing : public PricingStrategy {\npublic:\n  double calculate(VehicleSize size, Duration d) const override {\n    auto mins = chrono::duration_cast<chrono::minutes>(d).count();\n    long hours = (mins + 59) / 60;       // 1분이라도 넘기면 다음 시간으로 올린다\n    if (hours < 1) hours = 1;            // 최소 1시간은 받는다\n    return hours * rateOf(size);\n  }\n\nprivate:\n  static double rateOf(VehicleSize size) {\n    switch (size) {\n      case VehicleSize::Small:  return 1.0;   // motorcycle\n      case VehicleSize::Medium: return 2.0;   // car\n      case VehicleSize::Large:  return 4.0;   // truck\n    }\n    return 0.0;\n  }\n};\n\n\nTicket* ParkingLot::parkVehicle(Vehicle* v) {\n    ParkingSpot* ps = nullptr;\n    Floor* found = nullptr;               // 성공한 층을 루프 밖으로 들고 나온다\n    for (auto& floor : floors_) {\n      ps = floor->findAndReserve(v->getSize());\n      if (ps == nullptr) continue;\n      found = floor.get();                // unique_ptr 이라 .get()\n      break;\n    }\n    if (ps == nullptr) return nullptr;\n\n    Ticket* t = addTicket(v, ps, found);\n    return t;\n}\ndouble ParkingLot::unparkVehicle(Ticket* t) {\n  ParkingSpot* prkSpot = t->getSpot();\n  Vehicle* v = prkSpot->vacate();\n  t->getFloor()->release(prkSpot);\n\n  Duration d = Clock::now() - t->getEntryTime();     // t 를 지우기 전에 다 꺼낸다\n  double fee = pricing_->calculate(v->getSize(), d);\n\n  removeTicket(t);        // 여기서 t 가 파괴된다. 위 두 줄이 먼저여야 한다\n  return fee;\n}\n```\n\n---\n\n\n\n## 6. Trade-offs & Extensions\n\n---\n\n\n\n## @note (복습용 요약)\n\n\n| 지점                   | 패턴            | 이유          |\n| -------------------- | ------------- | ----------- |\n| Vehicle 생성 (type→객체) | **Factory**   | 생성 로직 한 곳에  |\n| 요금 계산 (종류/정책별)       | **Strategy**  | 계산 방식 교체 가능 |\n| ParkingLot (하나만)     | **Singleton** | 인스턴스 1개     |\n\n\n",

(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("app-state").textContent);

var CATNAME = {}; CATS.forEach(function(c){ CATNAME[c.key]=c.name; });
var KEY = "lccards.ui.v1";

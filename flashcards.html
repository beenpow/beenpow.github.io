   "qs": [
    "Q1: IPC 가 뭐고, 왜 커널을 거쳐야 하나?",
    "Q2: IPC 종류를 말해보라",
    "Q3: 뭘 쓸지 어떻게 고르나?",
    "Q4: fd 를 다른 프로세스에 넘길 수 있는 건 뭔가?",
    "Follow-up: 공유 메모리가 제일 빠른데 왜 다 그걸로 안 하나?"
   ],
   "md": "> 2026-10-27 작성. 10/26 Apple Core OS 스크린에서 \"Binder 외에 뭐가 있나\" 에 Binder 만 답했다.\n> 아래 Q2 표의 **첫 열을 순서대로 소리 내 읽을 수 있으면** 그 질문은 끝난다.\n\n---\n\n## Q1: IPC 가 뭐고, 왜 커널을 거쳐야 하나?\n\n주소 공간이 분리된 프로세스끼리 데이터나 신호를 주고받는 방법.\n스레드는 같은 주소 공간이라 IPC 가 필요 없다 (`process_vs_thread.md`).\n\n분리돼 있으니 한쪽이 쓴 메모리를 다른 쪽이 직접 못 본다.\n그래서 **커널이 중간에서 복사해주거나, 같은 물리 페이지를 양쪽에 매핑해준다.**\n전자가 파이프·소켓·메시지, 후자가 공유 메모리다.\n공유 메모리는 매핑을 만들 때만 커널이 끼고 그 뒤 읽고 쓰는 건 그냥 메모리 접근이다.\n\n---\n\n## Q2: IPC 종류를 말해보라\n\n**\"Binder 외에 뭐가 있나\" 의 답.** 첫 열을 위에서 아래로 읽는다. ⭐️\n\n| 종류 | 모양 | 커널 복사 | 쓰는 자리 |\n|---|---|---|---|\n| **파이프** | 한 방향 바이트 스트림. 경계 없음 | 2회 (쓰기 · 읽기) | 셸 `a \\| b`, 부모 → 자식 로그 |\n| **Unix 도메인 소켓** | 양방향 스트림 또는 데이터그램. **fd 를 넘길 수 있다** (SCM_RIGHTS) | 2회 | 데몬 ↔ 클라이언트의 기본. 같은 기계 안에서만 |\n| **공유 메모리** | 같은 물리 페이지를 둘 다 매핑 | **0** (매핑할 때만 개입) | 영상 프레임, 큰 버퍼. 동기화는 별도 |\n| **시그널** | 번호 하나. 데이터 없음 | 없음 | 종료 요청 (TERM), 자식 종료 알림 (CHLD), 타이머 |\n| **메시지 큐** | 경계 있는 메시지, 우선순위 | 2회 | POSIX mq. 실무에선 드묾 |\n| **Binder** | 동기 호출 (RPC). 객체 참조 · fd 전달 | 1회 (커널이 수신자 버퍼에 직접) | Android 의 모든 서비스 호출 |\n| **Mach 메시지** | 경계 있는 메시지. **포트 권한 자체를 담아 보낸다** | 1회 (큰 건 vm 매핑으로 0) | XNU 의 원시 IPC. 커널 객체도 포트로 다룬다 |\n| **XPC** | Mach 위의 직렬화 (dictionary) + 서비스 이름 해석 | Mach 와 같음 | Darwin 데몬 ↔ 앱의 표준. 요청 오면 launchd 가 그때 데몬을 띄움 |\n\n```c\n/* 기본 셋. 전부 POSIX, Darwin·Linux 둘 다 */\nint pfd[2]; pipe(pfd);                                   /* 파이프 */\nint sv[2];  socketpair(AF_UNIX, SOCK_STREAM, 0, sv);     /* Unix 소켓 */\nint shm = shm_open(\"/buf\", O_CREAT | O_RDWR, 0600);      /* 공유 메모리 */\nvoid *m = mmap(NULL, len, PROT_READ|PROT_WRITE, MAP_SHARED, shm, 0);\nkill(pid, SIGTERM);                                      /* 시그널 */\n```\n\n**Android ↔ Darwin 대응** (Core OS 면접이면 이 줄을 붙인다)\n\n| 자리 | Android | Darwin |\n|---|---|---|\n| 서비스 RPC | Binder. 이름 해석은 servicemanager | Mach 메시지 + XPC. 이름 해석은 launchd (bootstrap) |\n| 공유 메모리 | ashmem → memfd, Parcel 의 큰 blob | Mach `vm_remap`, IOSurface (GPU 버퍼) |\n| 로컬 소켓 | zygote 소켓, logd, adbd | syslogd, 많은 데몬의 로컬 포트 |\n| 시그널 | 같음 | 같음. launchd 가 TERM → KILL |\n\n---\n\n## Q3: 뭘 쓸지 어떻게 고르나?\n\n기준은 둘이다. **모양** 과 **양**.\n\n```\n모양   바이트 스트림이면 파이프·소켓\n       경계 있는 메시지면 mq·Binder·Mach\n       그냥 알림이면 시그널\n양     많으면 복사를 피해야 하니 공유 메모리.  IPC 로는 \"준비됐다\" 만 보낸다\n```\n\n큰 데이터를 소켓으로 보내면 복사 두 번(보내는 쪽 → 커널 → 받는 쪽)이 병목이다.\n그래서 Android 의 SurfaceFlinger 버퍼 큐, Darwin 의 IOSurface 는 프레임은 공유 메모리에 두고 핸들만 IPC 로 넘긴다.\n\n---\n\n## Q4: fd 를 다른 프로세스에 넘길 수 있는 건 뭔가?\n\n**Unix 소켓 (SCM_RIGHTS) · Binder · Mach 포트** 셋이다.\n파이프·시그널·mq 는 못 한다.\n\n\"열린 파일·소켓·공유 메모리 핸들을 다른 프로세스에 건네는\" 능력이 서비스 설계의 핵심이다.\n서비스가 클라이언트에 공유 메모리 fd 를 주는 패턴이 이걸로 된다.\n\nBinder 와 Mach 는 공통점이 하나 더 있다.\n**커널이 객체 참조를 센다.** 상대가 죽으면 커널이 알려준다 (Binder 의 death notification, Mach 의 dead-name notification).\n소켓은 EOF 로만 안다.\n\n```c\n/* Unix 소켓으로 fd 넘기기. 커널이 받는 쪽 fd 테이블에 새 번호로 복제해준다 */\nstruct msghdr mh = {0}; struct iovec io = { \"x\", 1 };\nchar cbuf[CMSG_SPACE(sizeof(int))];\nmh.msg_iov = &io; mh.msg_iovlen = 1; mh.msg_control = cbuf; mh.msg_controllen = sizeof cbuf;\nstruct cmsghdr *c = CMSG_FIRSTHDR(&mh);\nc->cmsg_level = SOL_SOCKET; c->cmsg_type = SCM_RIGHTS; c->cmsg_len = CMSG_LEN(sizeof(int));\nmemcpy(CMSG_DATA(c), &shm_fd, sizeof(int));\nsendmsg(sock, &mh, 0);\n```\n\n---\n\n## Follow-up: 공유 메모리가 제일 빠른데 왜 다 그걸로 안 하나?\n\n**동기화가 공짜가 아니다.**\n한쪽이 쓰는 중에 다른 쪽이 읽으면 깨진 데이터를 본다.\n프로세스 간 뮤텍스 (`PTHREAD_PROCESS_SHARED`), 세마포어, 또는 원자 연산 + 메모리 배리어가 따로 필요하다.\n\"공유 메모리로 빠르게\" 라고만 답하면 반쪽이다.\n\n### 틀리기 쉬운 것\n\n```\nX  파이프는 양방향          -> 한 방향. 양방향이면 파이프 두 개거나 socketpair\nX  시그널로 데이터를 보낸다   -> 번호만 간다 (sigqueue 로 int 하나). \"확인해봐\" 신호로만 쓰고 내용은 다른 채널로\nX  Mach 메시지 = 소켓 비슷   -> 핵심은 포트 권한(send right)이 capability 라는 것. 가진 프로세스만 말을 걸 수 있고, 샌드박스가 이걸로 제한한다\n```\n",

   "md": "## Q1: Mutex와 Semaphore 차이를 설명해보세요.\n\n| | Mutex | Semaphore |\n|---|-------|-----------|\n| 동시 접근 | 1개만 | N개까지 (counting) |\n| 소유권 | lock한 스레드만 unlock 가능 | 누구나 signal 가능 |\n| 목적 | 상호 배제 (mutual exclusion) | 리소스 카운팅 / 시그널링 |\n| 비유 | 화장실 열쇠 (1명) | 주차장 빈 자리 카운터 |\n\nBinary semaphore(값 0 or 1)와 mutex는 비슷해 보이지만, 소유권 개념이 다름.\n\n### 소유권이 왜 중요한가 — binary semaphore != mutex 인 이유\n\n```\nMutex      A가 lock    -> B가 unlock    X  (내가 잠근 건 나만 연다)\nSemaphore  A가 acquire -> B가 release   O\n```\n\n이 \"된다\"가 용도를 가른다. 소유자가 없어서 **서로 다른 스레드끼리 신호를 주고받을 수 있음**:\n\n```\nProducer 스레드:  버퍼에 넣고 -> sem.release()   \"하나 채웠다\"\nConsumer 스레드:  sem.acquire() -> 꺼냄          \"기다렸다 받는다\"\n```\n\nproducer_consumer.md 의 뼈대가 이것. Mutex로는 이 패턴이 안 만들어진다.\n\n-> Mutex = \"이 자원은 내 거\" (상호 배제)\n   Semaphore = \"몇 개 남았나 세기 + 남에게 신호\" (카운팅 + 시그널링)\n\n---\n\n## Q2: 각각 언제 쓰나요?\n\n**Mutex:**\n- Critical section 보호 (공유 변수 수정)\n- 파일 단독 접근\n- 하나의 자원을 하나의 스레드만 사용해야 할 때\n\n**Semaphore:**\n- Connection pool (최대 10개 연결 허용)\n- Producer-Consumer 패턴 (버퍼 빈 칸/찬 칸 카운트)\n- 스레드 간 순서 제어 (시그널링)\n\n---\n\n## Q3: C++에서의 사용 예시?\n\n**Mutex:**\n```cpp\nstd::mutex mtx;\n\nvoid critical() {\n    std::lock_guard<std::mutex> lock(mtx);\n    // 여기서 공유 자원 접근\n}  // 스코프 끝나면 자동 unlock\n```\n\n**Semaphore (C++20):**\n```cpp\nstd::counting_semaphore<3> sem(3);  // 최대 3개 동시 접근\n\nvoid access_resource() {\n    sem.acquire();     // 카운터 -1 (0이면 대기)\n    // 자원 사용\n    sem.release();     // 카운터 +1\n}\n```\n\n---\n\n## Follow-up: Spinlock이란?\n\n- Mutex의 변형. lock을 못 잡으면 sleep하지 않고 **busy-waiting** (반복 체크).\n- 장점: context switch 비용 없음\n- 단점: CPU 낭비\n- 용도: lock 보유 시간이 매우 짧을 때 (커널 내부, 멀티코어 환경)\n\n기준선: **lock 보유 시간 < context switch 비용(수 us)** 이면 spin이 이김.\n오래 잡을 거면 잠들어서 CPU를 남에게 양보하는 게 이득.\n(mutex로 대기 = 스레드가 blocked -> 스케줄러 개입 -> context switch.\n spinlock은 그걸 피하는 것. cf. user_kernel_mode.md Follow-up 2)\n",

    "Q1: Process와 Thread의 차이를 설명해보세요.",

   "md": "## Q1: Process와 Thread의 차이를 설명해보세요.\n\n**Process**는 독립적인 실행 단위. 각자 고유한 메모리 공간(code, data, heap, stack)을 가짐.\n프로세스 간 통신은 IPC(pipe, shared memory, socket 등)가 필요.\n\n**Thread**는 프로세스 내의 실행 흐름. 같은 프로세스의 스레드끼리 code, data, heap을 공유하고 stack만 개별 보유.\n그래서 context switch가 프로세스보다 가볍고, 통신도 공유 메모리로 바로 가능.\n\n---\n\n## Q2: 왜 멀티스레드가 멀티프로세스보다 선호되는 경우가 많나요?\n\n- Context switch 비용이 낮음 (메모리 공간 전환 불필요)\n- 스레드 간 데이터 공유가 쉬움 (IPC 없이 heap 공유)\n- 생성/소멸 비용이 프로세스보다 적음\n\n단점: 한 스레드가 crash하면 전체 프로세스에 영향. 동기화 이슈(race condition) 발생 가능.\n\n---\n\n## Q3: Context switch가 일어날 때 실제로 뭐가 저장/복원되나요?\n\nPCB(Process Control Block)에 저장되는 것:\n- Program Counter (다음 실행할 명령어 주소)\n- CPU 레지스터 값들\n- 메모리 관리 정보 (page table base register)\n- 프로세스 상태 (ready, running, waiting)\n\n스레드 context switch는 같은 프로세스 내라면 page table 전환이 불필요해서 더 빠름.\n\n---\n\n## Follow-up: 그럼 언제 멀티프로세스를 써야 하나요?\n\n- 격리가 중요할 때 (Chrome 탭 = 각각 프로세스, 하나 죽어도 다른 탭 안 죽음)\n- 보안상 메모리 분리가 필요할 때\n- 서로 다른 언어/런타임을 사용하는 경우\n",

   "md": "> 2026-10-27 작성. 10/26 Apple Core OS 스크린에서 \"pthreads 아세요\" 를 못 알아들었다.\n> 묻는 건 **이 함수들을 써 봤냐** 다. `deadlock.md` 의 계좌 이체 코드, `race_condition.md`, `mutex_vs_semaphore.md` 가 전부 이 API 다.\n\n---\n\n## Q1: pthreads 가 뭔가?\n\nC 에서 스레드를 만들고 동기화하는 **POSIX 표준 API**. 헤더 `pthread.h`.\nDarwin 은 libSystem 에 포함, Linux 는 glibc (옛 버전은 `-lpthread`).\n\n함수는 네 묶음이다. ⭐️\n\n| 묶음 | 함수 | 하는 일 |\n|---|---|---|\n| **생명주기** | `pthread_create` / `join` / `detach` / `exit` | 만들고, 기다리고, 떼어내고, 끝낸다 |\n| **상호 배제** | `pthread_mutex_*` / `rwlock_*` / `spin_*` | 한 번에 하나만 |\n| **대기·신호** | `pthread_cond_wait` / `signal` / `broadcast` | 조건이 될 때까지 재우고 깨운다 |\n| **부가** | `pthread_once` / `key_create` (TLS) / `attr_*` | 한 번만 초기화, 스레드별 저장소, 스택 크기 |\n\n```c\nint pthread_create(pthread_t *t, const pthread_attr_t *attr, void *(*fn)(void *), void *arg);\nint pthread_join(pthread_t t, void **ret);       /* 끝날 때까지 기다리고 반환값 수거 */\nint pthread_detach(pthread_t t);                 /* join 안 할 거면. 끝나면 알아서 정리 */\n\nint pthread_mutex_lock(pthread_mutex_t *m);      /* 잠근 스레드만 풀 수 있다 (소유자) */\nint pthread_mutex_trylock(pthread_mutex_t *m);   /* 못 잡으면 EBUSY, 안 기다림 */\nint pthread_mutex_unlock(pthread_mutex_t *m);\n\nint pthread_cond_wait(pthread_cond_t *c, pthread_mutex_t *m);  /* 뮤텍스를 풀고 잠들었다가, 깨면 다시 잡고 돌아옴 */\nint pthread_cond_signal(pthread_cond_t *c);      /* 하나 깨움 */\nint pthread_cond_broadcast(pthread_cond_t *c);   /* 전부 깨움 */\n```\n\n**오류 처리가 특이하다.** `errno` 를 안 쓰고 **반환값이 오류 코드** 다. 0 이 성공.\n`if (pthread_mutex_lock(&m) != 0)` 식으로 검사한다.\n\n---\n\n## Q2: `pthread_create` 의 인자 넷은? `join` 을 안 하면?\n\n| 인자 | 뜻 |\n|---|---|\n| `pthread_t *t` | 핸들 받을 곳 |\n| `attr` | 속성. NULL 이면 기본 (스택 크기 등) |\n| `void *(*fn)(void *)` | 실행할 함수. 인자 하나, 반환 하나, 둘 다 `void *` |\n| `void *arg` | 그 함수에 줄 인자. 여러 값이면 구조체 포인터 |\n\n```c\nstatic void *worker(void *arg) {\n    int id = *(int *)arg;\n    /* ... */\n    return NULL;            /* 반환값은 join 의 두 번째 인자로 전달됨 */\n}\npthread_t t; int id = 1;\npthread_create(&t, NULL, worker, &id);\npthread_join(t, NULL);\n```\n\n**join 을 안 하면** 스레드가 끝나도 스택·핸들이 남는다. 프로세스의 좀비와 같다.\n`join` 하거나 `detach` 해야 하고, 둘 다 안 하면 누수다.\n데몬에서 작업 스레드를 만들고 잊으면 핸들이 쌓인다.\n\n---\n\n## Q3: `cond_wait` 를 왜 `while` 로 감싸고, 왜 뮤텍스를 넘기나?\n\n```c\npthread_mutex_lock(&m);\nwhile (!ready)                      /* if 가 아니라 while */\n    pthread_cond_wait(&c, &m);      /* 뮤텍스를 넘긴다 */\n/* ready 가 참인 상태로 뮤텍스를 쥐고 있음 */\npthread_mutex_unlock(&m);\n```\n\n**while 인 이유: spurious wakeup.**\n신호 없이도 깰 수 있고, 깨서 뮤텍스를 다시 잡는 사이 다른 스레드가 조건을 바꿨을 수 있다.\n그래서 깨고 나서 조건을 다시 확인해야 한다.\n\n**뮤텍스를 넘기는 이유: lost wakeup.**\n\"조건 검사 → 잠들기\" 사이에 신호가 오면 영원히 못 깬다.\n`cond_wait` 는 **뮤텍스를 풀고 잠드는 것을 원자적으로** 해준다. 그래서 뮤텍스가 필요하다.\n\n조건 변수는 항상 **뮤텍스 + 조건 변수 + 상태 변수** 세 개가 한 묶음이다.\n조건 변수 혼자는 상태를 기억하지 않는다 (`producer_consumer.md`).\n\n---\n\n## Q4: Darwin 에서는 뭐가 다른가?\n\npthread 는 **Mach 스레드 위의 라이브러리** 다.\n커널(XNU)이 스케줄하는 건 Mach 스레드고, 뮤텍스 대기는 `psynch` 트랩으로 들어간다.\n\n| | Darwin | Linux |\n|---|---|---|\n| 커널 스레드 | Mach 스레드 | task (clone) |\n| 뮤텍스 대기 | psynch 트랩 | futex |\n| 기본 스택 | **512 KB** (메인은 8 MB) | 8 MB |\n| C11 threads | 지원 안 함 | glibc 2.28+ |\n\n기본 스택이 512 KB 라 작업 스레드에서 깊은 재귀가 메인보다 16 배 빨리 터진다.\n스택 크기는 `attr` 로 **create 전에** 정한다. 만든 뒤에는 못 바꾼다.\n\n---\n\n## Follow-up: 스레드가 있는 프로세스에서 fork 하면?\n\n**자식엔 fork 한 스레드만 복제된다.**\n다른 스레드가 잡고 있던 뮤텍스는 자식에서 영원히 잠긴 채다. 풀어줄 스레드가 없다.\n그래서 fork 뒤엔 바로 exec 하거나 async-signal-safe 함수만 쓴다.\n\n### 틀리기 쉬운 것\n\n```\nX  pthread_cancel 로 스레드를 끝낸다   -> 어디서 끊길지 몰라 뮤텍스를 잡은 채 죽을 수 있다. 플래그를 세우고 스스로 빠져나오게\nX  pthread_t 를 정수로 비교·출력      -> Darwin 은 포인터, Linux 는 unsigned long. 비교는 pthread_equal\nX  메인이 return 해도 스레드는 돈다    -> 메인이 return 하면 프로세스 전체가 끝난다 (exit). 메인은 join 하거나 pthread_exit 로 빠져야\nX  다른 스레드가 unlock 해도 된다     -> 기본 타입은 UB, errorcheck 타입은 EPERM. 소유자만 푼다. 세마포어와의 차이가 이것\n```\n",

   "md": "## Q1: 주요 스케줄링 알고리즘을 설명해보세요.\n\n| 알고리즘 | 방식 | 특징 |\n|----------|------|------|\n| FCFS | 먼저 온 순서대로 | 단순, Convoy effect 문제 |\n| SJF | 실행 시간 짧은 것 우선 | 평균 대기시간 최소. 실행 시간 예측 어려움 |\n| Round Robin | 시간 할당량(quantum)만큼 돌아가며 | 응답 시간 좋음. quantum 크기가 핵심 |\n| Priority | 우선순위 높은 것 먼저 | Starvation 가능 → aging으로 해결 |\n| MLFQ | 여러 큐 + 피드백 | 실제 OS에서 가장 많이 사용 |\n\n---\n\n## Q2: Preemptive vs Non-preemptive 차이는?\n\n- **Non-preemptive**: 프로세스가 자발적으로 CPU 반납할 때까지 대기. (FCFS, non-preemptive SJF)\n- **Preemptive**: OS가 강제로 CPU를 빼앗을 수 있음. (RR, preemptive SJF, priority)\n\n현대 OS는 대부분 preemptive. 하나의 프로세스가 CPU 독점하는 걸 방지.\n\n---\n\n## Q3: Round Robin에서 time quantum을 어떻게 정하나요?\n\n- **너무 작으면** → context switch 오버헤드가 실행 시간보다 커짐\n- **너무 크면** → FCFS랑 다를 게 없음 (응답 시간 증가)\n- 일반적으로 10~100ms, 전체 CPU burst의 80%가 quantum 내에 끝나도록 설정하는 게 규칙.\n\n---\n\n## Follow-up: Starvation과 Aging이란?\n\n- **Starvation**: 낮은 우선순위 프로세스가 영원히 실행 못 하는 상황\n- **Aging**: 대기 시간이 길어질수록 우선순위를 점진적으로 올려주는 기법, Starvation 방지.\n",

   "md": "> 2026-09-08 재작성. 목록을 외우는 대신 `printf` 한 줄에 전부 매단다.\n> 세 번(2/5, 3/5, 1.5/5) 낮은 점수가 나온 이유가 \"3가지 / 2x2 / 약자 3개\"를 따로 외우려 한 것이었음.\n> 2026-10-27 보강. 10/26 Apple Core OS 스크린에서 \"커널로 들어가는 경로\" 를 못 답해 다섯 단계 표와 Darwin 디테일을 그림 바로 아래에 추가.\n\n---\n\n## 기준점: `printf(\"hello\")` 가 화면에 찍히기까지\n\n```\nprintf(\"hello\")\n   |\n   |  libc 의 write() 래퍼            <- 아직 user mode. 그냥 함수 호출일 뿐\n   |\n   |  syscall 명령어  (= trap)         <- ★ 여기서 CPU 가 mode bit 을 뒤집는다\n   |     - 복귀 주소 + flags 저장\n   |     - 커널 스택으로 교체\n   |     - 커널이 등록해둔 진입점으로 점프\n   |\n   |  커널의 sys_write() 실행 -> 하드웨어 I/O\n   |\n   |  sysret -> 저장해둔 곳으로 복귀, mode bit 원상복구\n   v\nprintf 다음 줄\n```\n\n**이 그림 하나에서 아래가 전부 파생된다.**\n\n### 그림을 다섯 단계로 끊으면 (10/26 Apple 스크린에서 못 답한 질문)\n\n\"유저 코드가 커널로 들어가는 경로를 설명해보라\" 는 위 그림을 **다섯 단어** 로 말하는 것이다.\n**트랩 명령 · 모드 전환 · 커널 스택 · 번호 디스패치 · 복귀.** 이 순서대로만 말하면 된다. ⭐️\n\n| 단계 | 누가 | 하는 일 |\n|---|---|---|\n| 1 래퍼 | libc | 시스템 콜 **번호** 와 인자를 약속된 레지스터에 싣는다. 프로그램은 raw 트랩을 직접 안 쓴다 |\n| 2 트랩 | CPU | `svc` (arm64) / `syscall` (x86-64) 한 줄. 모드를 커널로 바꾸고, PC 를 커널 진입점(벡터 테이블)으로, 복귀 주소와 유저 상태를 보관 |\n| 3 저장·스택 교체 | 커널 진입 asm | 유저 레지스터 전부 저장. 스택을 그 스레드의 **커널 스택** 으로 교체. 유저 스택은 못 믿는다 |\n| 4 디스패치 | 커널 C | 번호가 범위 안인지 검사 → 테이블에서 핸들러 → 포인터 인자는 `copyin` 으로 검증하며 복사 → 실행 |\n| 5 복귀 | 커널 → CPU | 결과를 레지스터에, 레지스터 복원, `eret` / `sysret` 로 유저 모드. 시그널이 쌓여 있으면 복귀 직전에 핸들러로 |\n\n```asm\n; write(1, \"hi\\n\", 3) 이 Darwin arm64 에서 실제로 거치는 길\nmov  x16, #4        ; 1. 번호 (write = 4) 는 x16 에\nmov  x0,  #1        ;    fd\nadr  x1,  msg       ;    buf\nmov  x2,  #3        ;    len\nsvc  #0x80          ; 2. 트랩. 여기서 EL0 -> EL1\n                    ; 3-4. 커널: 레지스터 저장 -> 커널 스택 -> sysent[4] -> 결과 x0\n                    ; 5. eret. 다시 EL0. 래퍼가 x0 를 반환값으로, 오류면 errno 세팅\n```\n\n**틀리기 쉬운 두 가지**\n\n```\nX  \"시스템 콜 = 컨텍스트 스위치\"    -> 같은 스레드 안에서 모드만 바뀐다 (Q4). 커널 안에서 블록돼 다른 스레드로 넘어가면 그때 추가로 일어날 뿐\nX  \"커널이 유저 스택을 그대로 쓴다\"  -> 유저 스택은 조작돼 있을 수 있다. 스레드마다 별도 커널 스택이 있고, 포인터 인자도 copyin 으로 복사해서 쓴다\n```\n\n**Darwin 디테일 (Core OS 면접용)**\n\n| | Darwin (XNU) | Linux |\n|---|---|---|\n| 번호 공간 | 양수 = BSD 콜 (write, open, mmap), 음수 = Mach 트랩 (mach_msg, vm_allocate). 두 커널 계층이 한 입구를 나눠 쓴다 | 테이블 하나 |\n| 공개 ABI | libSystem 만. raw 번호는 릴리즈마다 바뀔 수 있어 정적 링크·직접 `svc` 는 깨진다 | 번호가 안정 ABI |\n| 관찰 | `dtruss -p PID`, `fs_usage` | `strace -p PID`, `perf trace` |\n\n비용은 모드 전환 자체가 수십 ns, 레지스터 저장·복원과 캐시·TLB 오염, Meltdown 이후 커널 페이지 테이블 분리까지 합치면 수백 ns 에서 1 µs.\n그래서 `read` 를 1 바이트씩 루프에서 부르면 느리고 stdio 버퍼링이 존재한다.\n`gettimeofday` 같은 건 커널이 읽기 전용 페이지를 유저에 매핑해둬서(Linux vDSO, Darwin commpage) 트랩 없이 읽는다.\n\n---\n\n## Q1: User mode 와 Kernel mode 의 차이는?\n\n| | User Mode | Kernel Mode |\n|---|-----------|-------------|\n| 권한 | 제한적, 하드웨어 직접 접근 불가 | 모든 명령어 + 하드웨어 접근 가능 |\n| 메모리 접근 | 자기 address space 만 | 모든 메모리 접근 가능 |\n| 실패 시 | 해당 프로세스만 crash | 전체 시스템 crash (kernel panic) |\n| 예시 | 앱 코드 실행 | 드라이버, 스케줄러, 메모리 관리 |\n\nCPU 의 mode bit 으로 구분 (0 = kernel, 1 = user).\n유저 코드는 이 비트를 **직접 못 쓴다.** 그런 명령어가 user mode 에서 금지되어 있다.\n\n---\n\n## Q2: 왜 `call` 이 아니라 `syscall` 인가?\n\n위 그림에서 제일 중요한 줄.\n\n```asm\ncall sys_write     ; X  점프할 주소를 내가 적는다\nsyscall            ; O  주소를 안 적는다. CPU 가 커널이 등록해둔 곳으로 보낸다\n```\n\n**문은 하나뿐이고, 그 문 위치는 커널이 정한다.**\n유저는 \"들어가겠다\"는 의사표시만 할 수 있다. 이게 보호(protection)의 핵심.\n\n`trap` = 이렇게 일부러 커널로 들어가려고 실행하는 명령어.\n**전환의 네 번째 종류가 아니라, syscall 이 들어가는 방법이다.** (Q3 과 헷갈리지 말 것)\n\n---\n\n## Q3: User -> Kernel 전환이 일어나는 경우는?\n\n`printf` 는 그중 **첫 번째** 경우일 뿐이다. 나머지 둘은 이렇게 갈린다:\n\n- **내가 부탁했나** -> **System call** (printf, file open, fork)\n- **내가 사고쳤나** -> **Exception** (divide by zero, page fault, segfault)\n- **밖에서 찔렀나** -> **Interrupt** (키보드, 타이머, 디스크 완료)\n\n부탁 / 사고 / 찔림. 앞의 둘은 **내 명령어가 원인**이고, interrupt 만 외부에서 온다.\n\n> 참고: 축 2개(의도적·비의도적 x 동기·비동기)로 보면 4칸 중 3칸만 찬다.\n> \"외부에서 오는 걸 내가 의도할 수는 없으니\" 그 칸이 빈다.\n> 다만 이건 정리용이지, 이걸 외워서 3개를 끄집어내려 하면 매번 하나씩 빠진다.\n> **부탁 / 사고 / 찔림으로 세는 게 낫다.**\n\n---\n\n## Q4: Mode switch 와 Context switch 는 다른가?\n\n**다르다. 세 번 다 여기서 틀렸다.**\n\n맨 위 `printf` 그림을 다시 보면, 저 흐름 어디에도 **\"프로세스를 바꾼다\"는 단계가 없다.**\n같은 프로세스가 권한만 잠깐 올렸다 내리는 것뿐.\n\n| | Mode switch | Context switch |\n|---|---|---|\n| 바뀌는 것 | 같은 프로세스의 **권한 레벨만** | **프로세스 자체**가 교체 |\n| 메모리 지도 | 그대로 | 통째로 교체 |\n| 비용 | 수백 ns | 수 us (수십 배) |\n\n### 반복해서 틀린 오답 두 개\n\n```\nX  \"저장을 안 해서 싸다\"        -> 저장한다. 안 하면 돌아갈 곳을 모른다\nX  \"비트 하나만 바꿔서 싸다\"     -> 복귀 주소 + flags 저장 + 스택 교체까지 한다\nO  \"프로세스를 안 바꿔서 싸다\"   -> 메모리 지도를 갈아끼울 필요가 없다\n```\n\n### 면접 한 줄\n\n> Mode switch 는 같은 프로세스에서 권한만 바뀌는 거라 주소공간이 그대로입니다.\n> Context switch 는 프로세스가 바뀌어서 페이지 테이블을 교체하고 캐시를 날려야 해서 훨씬 비쌉니다.\n\n---\n\n## Follow-up: 왜 이렇게 분리해놨나?\n\n**Protection.** 악의적이거나 버그 있는 프로그램이:\n- 다른 프로세스 메모리를 건드리는 것 방지\n- 하드웨어를 직접 조작하는 것 방지\n- OS 자체를 손상시키는 것 방지\n\n대가: mode 전환 비용 (수백 ns). 그래서 빈번한 system call 은 성능에 영향.\n\n---\n\n## 참고 (외우지 말 것)\n\nQ4 의 \"메모리 지도 교체\"가 실제로 무슨 일인지. **면접에서 이 약자들까지 묻는 경우는 드물다.**\nQ4 를 위 표 수준으로 말할 수 있으면 충분하고, 아래는 그 배경일 뿐이다.\n\n| 약자 | 원말 | 한 줄 |\n|---|---|---|\n| CR3 | Control Register 3 | \"지금 프로세스의 메모리 지도(페이지 테이블)가 어디 있는지\" 가리키는 레지스터 |\n| TLB | Translation Lookaside Buffer | 그 지도를 매번 보기 느려서 만든 캐시 |\n| PCB | Process Control Block | 프로세스 하나의 신상명세서 (지도 위치·레지스터·우선순위·열어둔 파일) |\n\n비유: CR3 = 지도책이 책장 어디 꽂혔는지 적힌 쪽지 / TLB = 자주 찾는 페이지를 적어둔 메모지.\n**지도책을 바꾸면 메모지는 전부 쓰레기** -> 버려야 함(TLB flush) -> 한동안 느려짐.\n이게 context switch 가 비싼 이유의 실체.\n\ncf. `context_switch.md`, `virtual_memory.md`\n",

   "md": "## Q1: Virtual memory란?\n\n각 프로세스에게 연속적이고 독립적인 메모리 공간이 있는 것처럼 보이게 하는 추상화.\n실제 물리 메모리(RAM)보다 큰 주소 공간을 제공.\n\n핵심 아이디어: 프로세스의 전체 메모리가 RAM에 있을 필요 없음. 지금 쓰는 부분만 RAM에, 나머지는 디스크(swap)에.\n\n---\n\n## Q2: Paging이 뭔가요?\n\n- Virtual memory를 고정 크기 **page** (보통 4KB)로 나눔\n- Physical memory를 같은 크기 **frame**으로 나눔\n- **Page table**이 virtual page → physical frame 매핑을 관리\n- 연속적인 virtual address가 불연속적인 physical address에 매핑될 수 있음\n\n장점: external fragmentation 없음 (고정 크기라서)\n\n---\n\n## Q3: Page fault가 뭐고, 어떻게 처리되나요?\n\n접근하려는 page가 RAM에 없을 때 발생하는 인터럽트.\n\n처리 순서:\n1. CPU가 page table에서 valid bit 확인 → invalid (RAM에 없음)\n2. Page fault trap 발생 → OS에 제어 넘어감\n3. 디스크에서 해당 page를 빈 frame에 로드\n4. Page table 업데이트 (valid bit 설정, frame 번호 기록)\n5. 중단됐던 명령어 재실행\n\nRAM이 꽉 차면? → Page replacement algorithm (LRU, FIFO, Clock 등)으로 victim page 선택 후 swap out.\n\n---\n\n## Follow-up: TLB란?\n\n**Translation Lookaside Buffer** - page table의 캐시.\n\n- Page table은 메모리에 있음 → 매 메모리 접근마다 page table 조회 = 2번 메모리 접근\n- TLB는 최근 사용된 page-frame 매핑을 CPU 내부에 캐시\n- TLB hit → 1번 메모리 접근으로 해결\n",

   "md": "> ENGINE · dynamo · T1  \n> 원리 → theory/inference/disaggregated_serving.md\n\n## Q1: Dynamo 에서 P/D 요청 흐름: decode worker 가 prefill 을 어디에 위임하고 KV 를 어떻게 받나요?\n\n**30초.** 라우터가 요청을 decode worker 에 보내고, decode worker 가 \"원격 prefill\" 로 판정하면 prefill worker 에 요청 + 자기 KV 블록 주소를 넘긴다.\nprefill worker 가 계산한 KV 를 NIXL 로 decode worker 의 블록에 직접 써넣고(write), decode 가 첫 토큰부터 이어간다.\n\n```\nrouter ──▶ decode worker (D)\n              │ 1. D 가 KV 블록을 먼저 할당 (vLLM scheduler, 외부 토큰으로 표시)\n              │ 2. prefill 요청 + D 의 NIXL 메타(블록 주소) 를 prefill worker (P) 에 전달\n              ▼\n           prefill worker (P)\n              │ 3. prefill 계산 → NIXL write 로 KV 를 D 블록에 직접 기록\n              │ 4. 완료 알림\n              ▼\n           D 가 decode 시작, 토큰 스트리밍\n```\n\nvLLM 단독의 NIXL pull(D 가 읽어옴) 과 방향이 다르다.\nDynamo 는 D 가 블록을 먼저 잡고 P 가 거기에 쓰는 쪽을 쓴다(버전에 따라 pull 도 지원).\nD 가 블록을 먼저 잡기 때문에 \"P 는 끝났는데 D 에 자리가 없다\" 가 안 생긴다.\n\n## Q2: conditional disaggregation 은 무엇을 기준으로 로컬 prefill 과 원격 prefill 을 가르나요?\n\n**30초.** 유효 ISL(프롬프트 토큰 - decode worker 에 이미 캐시된 토큰) 이 절대 임계치보다 작거나, 원래 ISL 대비 비율이 임계치보다 작으면 원격 prefill 을 건너뛰고 decode worker 가 직접 prefill 한다.\n\n`lib/kv-router/src/conditional_disagg.rs` 의 `should_bypass_remote_prefill` 이 결정한다.\n입력은 prompt_tokens, decode 쪽 캐시 토큰, P·D worker 가 바쁜지 여부다.\n짧은 프롬프트나 캐시가 많이 맞은 요청은 prefill 비용이 작아 KV 전송 비용이 더 크다.\n그런 요청까지 P 로 보내면 P 가 작은 일로 바쁘고 네트워크만 쓴다.\n\"분리가 손해인 요청은 분리하지 않는다\" 를 요청 단위로 적용한 것이다. ⭐️\n\n## Q3: request migration 은 어떤 장애에서 무엇을 옮기나요?\n\n**30초.** decode worker 가 죽거나 과부하일 때 진행 중 요청의 KV 와 생성 상태를 다른 decode worker 로 옮겨 처음부터 다시 하지 않고 이어간다.\n\n평범한 장애 처리는 요청을 실패시키거나 처음부터 재실행한다.\nmigration 은 KV 블록을 NIXL 로 새 worker 에 복사하고 \"여기까지 생성했다\" 를 넘겨 다음 토큰부터 계속한다.\n사용자는 잠깐의 지연만 본다.\nDynamo README 의 fault tolerance 항목에 canary health check 와 함께 들어 있다.\nP/D 분리 때문에 KV 를 옮기는 기계(NIXL)가 이미 있어서 가능해진 기능이다.\n\n## Q4: components/src/dynamo/vllm/ 이 vLLM 을 몽키패치하는 곳이 있습니다. 왜 그런 패치가 필요했고 어떻게 없어지나요?\n\n**30초.** Dynamo 가 쓰는 vLLM 버전(핀)에 버그나 빠진 기능이 있을 때 릴리스를 기다리지 않고 핸들러에서 함수를 덮어썼다.\nupstream vLLM 이 고쳐지고 핀이 그 버전으로 올라가면 패치를 지운다.\n\n| 패치 | 왜 있었나 | 어떻게 없어지나 |\n|---|---|---|\n| T2 `handlers.py:1536` `add_dp_placement_groups` | vLLM 이 `ray.util.state.list_nodes()` 로 대시보드 HTTP 요구 → `ray[default]` 없는 컨테이너에서 실패 | vLLM #57648 머지(9/29). v0.32.0 부터 포함. Dynamo 핀이 v0.30 이라 아직 제거 불가, 핀 상승 뒤 제거 PR |\n| T1 `main.py:873-886` Ray DP `num_gpu_blocks` | Ray DP 백엔드에서 `num_gpu_blocks` 가 None 이라 0 을 등록하던 워크어라운드 | vLLM #39364 (v0.28.0) 가 원인 해결. 핀이 이미 넘었으니 제거 가능, tzulingk 에게 이슈로 확인 |\n\n몽키패치는 \"upstream 에 고쳐야 할 것\" 의 목록이기도 하다.\nT2 가 그 경로였다: Dynamo 에서 발견 → vLLM 에 고침 → Dynamo 패치 제거.\n\n---\n\n### 손댄 곳\n\n- T2: handlers.py:1536 의 add_dp_placement_groups 몽키패치, upstream vLLM #57648 머지 후 핀 v0.32.0 대기 · todo-T2-vllm-dp-placement-list-nodes/\n- T1: main.py:873-886 Ray DP num_gpu_blocks 워크어라운드 (vLLM #39364 로 원인 해결) · todo-T1-ray-dp-num-gpu-blocks/\n",

    "Q1: Frontend → Router → Worker 로 요청이 흐르는 경로를 설명해보세요. 각각 어느 언어로 짜여 있나요?",

   "md": "> ENGINE · dynamo · T1  \n> 원리 → theory/inference/serving_system_design.md\n\n## Q1: Frontend → Router → Worker 로 요청이 흐르는 경로를 설명해보세요. 각각 어느 언어로 짜여 있나요?\n\n**30초.** 클라이언트 → Frontend(Rust, OpenAI 호환 HTTP, 토크나이즈) → Router(Rust, 어느 worker 로) → Worker(Python, vLLM/SGLang/TRT-LLM 을 감싼 핸들러) → 토큰 스트림이 역순으로 돌아온다.\n\n```\nHTTP ──▶ frontend (Rust)            components/src/dynamo/frontend\n            │  토크나이즈, 요청 → 내부 프로토콜\n            ▼\n         router  (Rust lib/kv-router + Python 래퍼)   worker 선택\n            ▼\n         worker  (Python)           components/src/dynamo/vllm | sglang | trtllm\n            │  엔진 호출, 스트리밍\n            ▼\n         (P/D 면 prefill worker ↔ decode worker 사이 NIXL)\n```\n\nFrontend 와 Router 는 레이턴시가 중요해 Rust, Worker 는 엔진이 Python 이라 Python 이다.\nPython 쪽은 `lib/bindings` 의 PyO3 바인딩으로 Rust 런타임을 부른다.\n\n## Q2: namespace · component · endpoint 모델은 무엇을 추상화하나요?\n\n**30초.** namespace 는 배포 단위(모델 하나의 서비스), component 는 그 안의 역할(frontend · router · prefill · decode), endpoint 는 component 가 노출하는 호출 가능한 함수(`generate` 등) 다.\n\n주소가 `namespace/component/endpoint` 로 계층을 이룬다.\n클라이언트(예: router) 는 `dynamo.vllm.generate` 같은 주소로 \"그 endpoint 를 가진 인스턴스들\" 을 디스커버리에서 찾아 그중 하나에 보낸다.\n인스턴스가 늘고 줄어도 주소는 안 바뀐다.\nK8s 의 Service 와 비슷한 추상화를 런타임 안에 넣은 것이다.\n\n## Q3: 서비스 디스커버리는 환경(K8s · etcd · NATS · file)마다 어떻게 다르나요?\n\n**30초.** K8s 위에서는 CRD 와 EndpointSlice 로 K8s 가 직접 알려주고, 밖에서는 etcd(등록·리스) 나 NATS(메시징) 또는 파일 기반을 쓴다.\n\n| 환경 | 디스커버리 | 메시징 |\n|---|---|---|\n| Kubernetes | Dynamo CRD + EndpointSlice | NATS 또는 직접 TCP |\n| 로컬 · Slurm | etcd (인스턴스 등록, TTL 리스) | NATS (요청 큐, 이벤트) |\n| 단순 테스트 | 파일 | 직접 |\n\n초기 버전은 etcd + NATS 가 필수였고, 지금은 K8s 네이티브가 기본이고 etcd/NATS 는 선택이다.\n런타임 코드는 `lib/runtime`, 전송은 `lib/runtime/src/transports/` (tcp · nats · zmq).\n버전마다 기본값이 바뀌어 왔으니 배포 전 현재 문서 확인이 필요하다.\n\n## Q4: Dynamo 가 vLLM 을 '교체' 하지 않고 '감싼다' 는 말은 무슨 뜻인가요?\n\n**30초.** vLLM 의 스케줄러·KV 관리·커널은 그대로 쓰고, 그 위에 \"여러 vLLM 인스턴스를 어떻게 묶고 어디로 요청을 보내고 몇 개를 띄울지\" 만 Dynamo 가 맡는다는 뜻이다.\n\nvLLM 하나는 GPU 몇 장짜리 엔진이다.\n수백 장이 되면 라우팅·P/D 분리·오토스케일·KV 티어링이 필요한데 그건 엔진 안의 일이 아니다.\nDynamo 는 그 층(오케스트레이터)이고, 엔진은 vLLM · SGLang · TRT-LLM 중 골라 끼운다.\n그래서 vLLM 에 기여한 것이 Dynamo 의 vLLM 핸들러에 그대로 영향을 준다(T2 가 그 예).\n\n## Follow-up: Rust 로 짠 부분과 Python 으로 짠 부분의 경계는 어디인가요? 왜 그렇게 나눴나요?\n\n**30초.** 요청 경로(frontend · router · 런타임 · KV 인덱싱 · KVBM) 는 Rust, 엔진을 감싸는 핸들러와 planner 는 Python 이다.\n핫패스는 Rust 로 레이턴시와 메모리를 잡고, 엔진·연구 코드가 Python 이라 그 경계는 Python 으로 열어둔 것이다.\n\n`lib/` 가 전부 Rust 크레이트(runtime · llm · kv-router · kvbm-* · tokens), `components/src/dynamo/` 가 Python 이다.\n라우터 로직을 Python 에 두면 요청마다 GIL 과 인터프리터 비용이 붙는다.\nRust 초급이면 Python 컴포넌트(vllm 핸들러 · planner) 부터 들어가는 게 맞고, 10/10 중 Rust 는 kv-router 4건이었다.\n\n",

   "md": "> ENGINE · dynamo · T1  \n> 원리 → theory/inference/prefix_caching_and_routing.md\n\n## Q1: 라우터가 각 worker 의 KV 캐시 내용을 어떻게 아나요? (KV events → radix tree)\n\n**30초.** 각 worker 의 vLLM 이 블록을 캐시에 넣거나 뺄 때마다 KV event(블록 해시 · 부모 해시 · 토큰 수)를 발행하고, 라우터가 그걸 받아 worker 별로 radix tree(접두사 트리)를 유지한다.\n새 요청이 오면 토큰을 블록 해시로 바꿔 트리에서 각 worker 와 몇 블록이 겹치는지 센다.\n\n이벤트는 ZMQ(`lib/kv-router/src/zmq_wire`) 나 NATS 로 흐른다.\n인덱서(`indexer/`)가 해시를 키로 트리를 쌓고, 조회 결과가 `OverlapScores`(worker → 겹치는 블록 수) 다.\n블록 하나가 16 토큰이라 `effective_cached_tokens = overlap_blocks × 16` 으로 환산한다.\nworker 가 죽거나 재시작하면 그 트리를 지우고 다시 받는다(`recovery/`).\n\n## Q2: 라우팅 cost 함수는 무엇과 무엇을 더하나요? (prefix overlap · load)\n\n**30초.** 유효 prefill 비용과 현재 부하다.\n요청의 토큰 수에서 그 worker 에 이미 캐시된 토큰을 빼면 \"새로 prefill 해야 할 토큰\" 이 나오고(`effective_prefill_tokens = isl - cached`), 거기에 worker 가 지금 쥐고 있는 활성 블록·대기 요청을 더해 가장 작은 worker 를 고른다.\n\n```\ncost(worker) = 새로 계산할 prefill 토큰 (ISL - 캐시 겹침 × 16)\n             + 부하 (활성 KV 블록 수, 대기 중 요청의 prefill 토큰)\n```\n\n캐시가 많이 겹치면 첫 항이 줄어 그 worker 가 유리하고, 그 worker 가 이미 바쁘면 둘째 항이 커져 다른 데로 간다.\n`scheduling/policy.rs` 의 WSPT(weighted shortest processing time) 계열 정책이 이 비용을 쓴다.\n단순 argmin 대신 온도를 둔 softmax 샘플링으로 한 worker 에 몰리는 걸 막는 옵션도 있다. ⭐️\n\n## Q3: 요청된 policy 이름이 없을 때 지금은 어떻게 동작하나요? 무엇이 빠져 있나요?\n\n**30초.** `policy_config.rs` 에서 이름을 찾아 없으면 조용히 기본 정책으로 떨어진다.\n운영자는 자기가 지정한 정책이 안 먹고 있다는 걸 알 길이 없다.\n\nT4 가 이 자리다(PeaBrane 본인이 남긴 TODO, `policy_config.rs:154`).\n이슈 없이 TODO 만 있어서 로그로 할지 메트릭으로 할지 먼저 물어야 했다.\n브랜치 `feat/kv-router-unknown-policy-observability` 에 bounded 로그(기존 `RateLimitedPublishFailure` 패턴 재사용) 로 구현해뒀고 949 테스트 통과.\n작지만 \"라우터가 무슨 정책으로 도는지 알 수 있나\" 라는 운영 질문에 바로 연결되는 수정이다.\n\n## Q4: admission 응답에 best overlap 을 노출하면 누가 무엇에 쓰나요?\n\n**30초.** 라우터가 요청을 받아들일 때(admission) \"가장 많이 겹친 worker 는 몇 블록이었나\" 를 응답에 실어주면, 클라이언트·planner·대시보드가 캐시 히트율을 요청 단위로 볼 수 있다.\n\n`non_max_overlap_selection` 이 내부적으로 이미 최대 겹침을 계산하고 있어서 필드 하나를 밖으로 뚫는 일이다(#12303).\n쓰는 쪽은 셋이다.\n클라이언트는 \"내 요청이 캐시를 탔나\" 를 알고, planner 는 캐시 히트율로 P 풀 크기를 조정하고, 대시보드는 라우팅 품질을 추적한다.\nflpanbin 이 pick-up 댓글만 남긴 상태라 양보 확인이 먼저였고, device 티어 겹침 vs 유효 겹침 중 어느 단위를 노출할지 PeaBrane 결정이 필요했다.\n\n## Follow-up: worker 가 재시작되면 라우터의 KV 상태는 어떻게 복구되나요?\n\n**30초.** 라우터가 그 worker 의 radix tree 를 비우고, worker 가 다시 올라오면 vLLM 이 현재 캐시 상태를 KV event 로 다시 발행해 트리를 재구성한다.\n그 사이 그 worker 는 \"캐시 없음\" 으로 취급된다.\n\n재구성 중에는 라우팅 품질이 떨어지는데 지금 그 진행률이 안 보인다.\n#12314 가 \"복구 진행률을 집계 로그로 남기자\" 였고, 저위험 로그 추가라 브랜치는 만들었지만 이슈 전제의 절반이 이미 main 에 없어 재확인이 필요하다.\n#10696 (DP rank 별 활성 요청 게이지) 도 같은 관측성 묶음이다.\n\n---\n\n### 손댄 곳\n\n- T4 policy fallback 관측성(lib/kv-router/src/scheduling/policy_config.rs:154) · #12303 admission best overlap · #12314 KV 복구 진행률 로그 · #10696 DP rank 활성 요청 게이지 · dynamo-study/01-issues/\n",

    "Q1: KVBM 이 다루는 티어(GPU → CPU → SSD → 원격/S3) 와 각 티어 사이 이동 정책은?",

   ],
   "md": "> ENGINE · dynamo · T2  \n> 원리 → theory/inference/kv_cache.md\n\n## Q1: KVBM 이 다루는 티어(GPU → CPU → SSD → 원격/S3) 와 각 티어 사이 이동 정책은?\n\n**30초.** G1 GPU → G2 CPU(pinned) → G3 로컬 SSD → G4 원격(S3·Azure Blob·분산 스토어) 네 티어고, 이동은 \"GPU 가 블록을 비울 때 아래 티어로 내리고(evict/offload), 프리픽스 히트가 나면 위로 올린다(onboard)\" 다.\n\n각 티어의 용량과 대역폭이 다르다.\nGPU 수십 GB · TB/s, CPU 수백 GB · 수십 GB/s(PCIe), SSD 수 TB · 수 GB/s, 원격 무제한 · 네트워크.\n정책은 티어마다 LRU 계열이고, 뜨거운 접두사(시스템 프롬프트)는 위에, 오래된 대화는 아래로 간다.\nDynamo README 의 \"tiered KV offload\" 가 이것이다.\n\n## Q2: kvbm-logical 과 kvbm-physical 은 무엇을 나눈 건가요?\n\n**30초.** logical 은 \"블록 해시 → 어느 티어의 어느 위치\" 라는 색인과 정책(어떤 블록을 어디 둘지), physical 은 실제 메모리 할당과 티어 간 복사(cudaMemcpy·NIXL·파일 IO) 다.\n\n`lib/kvbm-logical` 은 블록의 생애(등록·조회·축출)를 다루고 저장 매체를 모른다.\n`lib/kvbm-physical` 은 pinned 메모리 풀, 디스크 파일, 원격 객체를 할당하고 바이트를 옮긴다.\n나누면 정책을 바꿔도 전송 코드를 안 건드리고, 새 티어(새 스토리지)를 physical 에만 추가하면 된다.\nvLLM 의 KVCacheManager(논리) 와 attention 커널·copy_blocks(물리) 의 분리와 같은 모양이다. ⭐️\n\n## Q3: consolidator 는 무엇을 합치나요?\n\n**30초.** 여러 worker 가 각자 내린 KV 블록 중 같은 해시(같은 접두사)를 한 벌만 남기고, 어느 worker 든 그 벌을 쓸 수 있게 공유 티어에서 합친다.\n\nDP 로 엔진이 8 개면 같은 시스템 프롬프트 KV 가 8 개 GPU 에 각각 있다.\nCPU·SSD 티어로 내릴 때 8 벌을 다 저장하면 낭비다.\n`lib/kvbm-consolidator` 가 해시로 중복을 찾아 하나로 모으고 참조를 공유시킨다.\n결정적 블록 해시(vLLM v0.29)가 있어야 가능하다.\n\n## Q4: vLLM 쪽에서 KVBM 은 어떤 인터페이스(connector)로 붙나요?\n\n**30초.** vLLM 의 KV connector 인터페이스(`KVConnectorBase_V1`) 를 구현한 커넥터로 붙는다.\n스케줄러 쪽에서 \"이 블록은 KVBM 에 있다\" 를 외부 토큰으로 보고하고, worker 쪽에서 KVBM 이 GPU 블록으로 올려준다.\n\nvLLM 입장에서 KVBM 은 LMCache 나 OffloadingConnector 와 같은 자리의 또 하나의 커넥터다.\nP/D 전송(NIXL) 과 같이 쓰려면 MultiConnector 로 묶는다.\nKVBM 쪽 어댑터는 Rust 코어에 Python 바인딩을 얹은 것이다.\n\n## Follow-up: vLLM 자체 kv_offload 와 KVBM 은 역할이 어떻게 다른가요?\n\n**30초.** vLLM 의 kv_offload 는 엔진 하나 안의 GPU ↔ CPU 두 티어고, KVBM 은 엔진 여러 개가 공유하는 다중 티어 + 원격 스토리지 + 중복 제거다.\n\n작은 배포는 vLLM 내장으로 충분하다.\nDP 8 개 이상, 멀티노드, 오래된 대화를 디스크·S3 에 두고 다시 꺼내는 요구가 생기면 KVBM 이다.\n오케스트레이터(Dynamo)가 엔진 밖에서 KV 를 관리하는 것이라 엔진 종류(vLLM·SGLang·TRT-LLM)와 무관하게 쓸 수 있다는 게 차이다.\n\n",

   "md": "> ENGINE · dynamo · T2  \n> 원리 → theory/inference/disaggregated_serving.md\n\n## Q1: NIXL 이 추상화하는 것은 무엇인가요? 백엔드(UCX · RDMA · NVLink · GDS) 는 어떻게 고르나요?\n\n**30초.** \"메모리 A 에서 메모리 B 로 바이트를 옮겨라\" 를 장치(GPU·CPU·디스크·원격)와 전송 수단(UCX·RDMA·NVLink·GDS)에 상관없이 같은 API 로 추상화한다.\n백엔드는 양 끝의 메모리 종류와 사이의 링크를 보고 가장 빠른 것을 고른다.\n\nNVIDIA Inference Xfer Library.\n같은 노드 GPU ↔ GPU 는 NVLink(CUDA IPC), 노드 간 GPU ↔ GPU 는 RDMA(UCX 위), GPU ↔ 디스크는 GDS(GPUDirect Storage).\n추론 시스템이 P/D 전송·KV 오프로드·가중치 스트리밍(ModelExpress)에 전부 같은 라이브러리를 쓰게 하는 게 목적이다.\n`pip install nixl` 로 vLLM 과 함께 쓴다.\n\n## Q2: agent 와 metadata 교환은 왜 필요하고 언제 일어나나요?\n\n**30초.** agent 는 프로세스마다 하나인 NIXL 인스턴스고, metadata 는 \"내 agent 가 등록한 메모리 영역들의 주소·크기·접근 키\" 다.\n상대가 내 메모리에 RDMA 로 쓰거나 읽으려면 그 메타를 미리 받아야 하므로, 처음 통신하는 두 agent 는 메타를 교환한다(handshake).\n\nRDMA 는 상대 CPU 를 거치지 않고 메모리에 직접 쓴다.\n그래서 \"어디에 써도 되는지\" 를 사전에 알아야 하고, 그게 메타다.\nvLLM NixlConnector 는 ZMQ 사이드채널로 메타를 주고받고 `_remote_agents` 에 캐시한다.\n엔진이 재시작되면 메타가 바뀌니 다시 교환해야 하고, 죽은 엔진의 메타는 heartbeat 로 지운다.\nX1 의 3 결함이 전부 이 \"메타 캐시의 생애\" 를 다루는 락 경로에 있었다. ⭐️\n\n## Q3: descriptor 는 무엇을 가리키나요? 등록(register) 비용이 큰 이유는?\n\n**30초.** descriptor 는 \"이 메모리 영역(주소 · 길이 · 장치)\" 하나를 가리키는 핸들이고, 전송은 descriptor 목록(src 리스트 → dst 리스트) 으로 지시한다.\n등록(register) 이 비싼 건 RDMA NIC 가 그 메모리를 핀(pin)하고 주소 변환 테이블에 올려야 해서다.\n\nKV 블록 하나하나가 descriptor 가 된다.\n등록은 수 ms 단위라 요청마다 하면 안 되고, 기동 시 KV 캐시 전체를 한 번 등록해둔다.\n9/22 실측에서 `kv_buffer_device=cpu` 의 호스트 버퍼 2.2 GB 등록 때문에 P 기동이 160 초 걸렸다.\n그래서 전송 descriptor 를 모아 한 번에 보내는 게 중요하고, #54483 의 copy_blocks 코얼레싱도 같은 정신이다.\n\n## Q4: vLLM NixlConnector 와 Dynamo 는 NIXL 을 각각 어디에 쓰나요?\n\n**30초.** vLLM NixlConnector 는 P/D 사이 KV 블록 전송(pull 또는 push) 에 쓰고, Dynamo 는 그 위에 더해 KVBM 의 티어 간 이동, ModelExpress 의 GPU 간 가중치 스트리밍, request migration 의 KV 이동에 쓴다.\n\nvLLM 안에서는 커넥터 하나의 전송 엔진이다.\nDynamo 는 \"바이트를 옮기는 모든 곳\" 에 NIXL 을 깔아 전송 코드를 하나로 모았다.\n같은 라이브러리라 vLLM 에서 배운 NIXL 지식(메타 교환, descriptor, 완료 알림)이 Dynamo 코드 읽기에 그대로 쓰인다.\n\n## Follow-up: NIXL 전송이 끝났다는 걸 양쪽이 어떻게 합의하나요?\n\n**30초.** 전송을 시작한 쪽이 완료 상태를 폴링하거나 콜백을 받고, 상대에게는 별도 알림(notification) 을 보내야 한다.\nRDMA write 는 상대 CPU 가 모르게 쓰기 때문에 \"다 썼다\" 를 알려주는 메시지가 따로 필요하다.\n\nvLLM NIXL pull 모드에서 D 가 읽기를 끝내면 P 에 \"다 받았다\" 알림을 보내고 P 가 그걸 받아 블록을 free 한다.\n알림이 유실되면 P 블록이 영원히 잡혀 있어서 타임아웃이 있다.\n53368 은 이 완료 알림이 CPU 경로와 P2P 경로에서 어느 쪽에 귀속되는지(attribution) 가 어긋난 이슈였다.\n\n---\n\n### 손댄 곳\n\n- X1 handshake / heartbeat 경로의 락 규약, _remote_agents · _engine_last_active 축출 · pushmode-x1-remote-agents-lock-race/\n",

    "Q2: 프로파일링 단계에서 무엇을 재나요? profiler 컴포넌트는 어떤 곡선을 만드나요?",
    "Q3: global_planner 와 planner 의 차이는?",
    "Q4: AISimulate 는 실제 GPU 없이 무엇을 예측하나요?",
    "Follow-up: SLA 를 TTFT 로 잡을 때와 TPOT 로 잡을 때 P/D 비율이 어떻게 달라지나요?"
   ],
   "md": "> ENGINE · dynamo · T2  \n> 원리 → theory/inference/serving_system_design.md\n\n## Q1: planner 가 입력으로 받는 것(SLA · 프로파일 · 현재 부하) 과 출력(레플리카 수 · P/D 비율) 은?\n\n**30초.** 입력은 SLA(TTFT·TPOT 목표), 모델·GPU 의 프로파일 곡선(P 하나가 ISL 별로 내는 처리량, D 하나가 KV 부하별로 내는 TPOT), 현재 트래픽(요청률·ISL·OSL 분포) 이고, 출력은 P 레플리카 수와 D 레플리카 수(= P/D 비율) 다.\n\nplanner 는 \"지금 들어오는 트래픽을 SLA 안에 처리하는 최소 GPU 구성\" 을 주기적으로 다시 계산한다.\n결과를 Kubernetes 에 적용해 레플리카를 늘리고 줄인다.\n`components/src/dynamo/planner`, Python.\n\n## Q2: 프로파일링 단계에서 무엇을 재나요? profiler 컴포넌트는 어떤 곡선을 만드나요?\n\n**30초.** 배포 전에 P worker 하나와 D worker 하나를 띄워 합성 부하를 걸고, P 는 \"ISL 별 prefill 처리량(토큰/초)과 TTFT\", D 는 \"동시 요청(KV 사용률) 별 TPOT\" 곡선을 만든다.\n\n`components/src/dynamo/profiler` 가 한다.\n곡선이 있으면 \"TTFT 300 ms 를 지키려면 ISL 4K 요청 초당 N 개에 P 몇 대\" 를 계산할 수 있다.\nGPU 종류·TP 설정·양자화마다 곡선이 달라 조합마다 한 번씩 프로파일한다.\n이 곡선이 없으면 planner 는 추측밖에 못 한다.\n\n## Q3: global_planner 와 planner 의 차이는?\n\n**30초.** planner 는 namespace(모델 하나) 안의 P/D 레플리카를 조정하고, global_planner 는 여러 namespace(모델·배포) 사이에서 GPU 풀을 나눈다.\n\n모델 A 가 바쁘고 B 가 한가하면 global_planner 가 B 의 GPU 를 A 로 돌린다.\n단일 모델 서빙은 planner 만 있으면 되고, 멀티 테넌트에서 global 이 필요하다.\n`components/src/dynamo/global_planner`.\n\n## Q4: AISimulate 는 실제 GPU 없이 무엇을 예측하나요?\n\n**30초.** 프로파일 곡선과 트래픽 분포를 받아 \"이 구성이면 TTFT·TPOT·처리량이 얼마\" 를 시뮬레이션으로 예측하고, 여러 구성(P/D 비율·TP·배치)을 탐색해 최적을 낸다.\n\n실제 GPU 로 모든 조합을 돌려보면 수십 시간과 비용이 든다.\nAISimulate(이전 AIConfigurator) 는 그걸 오프라인으로 대신한다.\nzero-config deploy(DGDR) 가 \"모델 · 하드웨어 · SLA\" 만 받아 토폴로지를 정하는 것도 이 시뮬레이션 위에 있다.\n정확도는 프로파일 곡선 품질에 묶인다.\n\n## Follow-up: SLA 를 TTFT 로 잡을 때와 TPOT 로 잡을 때 P/D 비율이 어떻게 달라지나요?\n\n**30초.** TTFT 를 조이면 prefill 대기열을 줄여야 해서 P 가 늘고, TPOT 를 조이면 decode 배치를 작게 유지해야 해서 D 가 는다.\n\nTTFT 300 ms 와 TPOT 50 ms 를 둘 다 걸면 P 도 D 도 늘어 비용이 가장 높다.\nTTFT 만 느슨하게 풀면 P 를 줄이고 요청을 대기열에 조금 세워도 된다.\n\"어느 지표를 얼마나 양보할 수 있나\" 가 비용의 결정 변수고, planner 는 그 선택을 숫자로 바꿔주는 도구다.\n\n",

   "title": "Dynamo vs SGLang vs TensorRT-LLM vs llm-d",
   "diff": "T3",
   "cat": "engine/dynamo",
   "catName": "Dynamo",

   "qs": [
    "Q1: SGLang 의 RadixAttention 은 vLLM 의 prefix caching 과 무엇이 다른가요?",
    "Q2: TensorRT-LLM 이 vLLM 보다 빠를 수 있는 이유와 느릴 수 있는 이유는?",
    "Q3: llm-d · AIBrix · Dynamo 는 같은 층(오케스트레이터)인데 무엇이 다른가요?",
    "Q4: '왜 vLLM 이 아니라 Dynamo 에 기여했나' 에 어떻게 답하나요?"
   ],
   "md": "> ENGINE · dynamo · T3\n\n## Q1: SGLang 의 RadixAttention 은 vLLM 의 prefix caching 과 무엇이 다른가요?\n\n**30초.** RadixAttention 은 토큰 열 전체를 radix tree(접두사 트리) 로 들고 있어 임의 길이 접두사를 매칭하고, vLLM 은 16 토큰 블록 단위 해시 체인이라 블록 경계에서만 매칭된다.\n\nSGLang 은 토큰 단위라 히트가 더 세밀하고, 트리 구조 덕에 \"어느 접두사가 많이 쓰이나\" 가 바로 보여 LRU 축출도 트리에서 한다.\nvLLM 은 블록 단위라 구현이 단순하고 PagedAttention 과 자연히 맞물린다.\n결과적으로 히트율 차이는 블록 하나(16 토큰) 수준이고, 두 시스템 모두 프리픽스 캐시가 기본이다.\nDynamo 라우터가 블록 해시로 radix tree 를 만드는 건 둘을 합친 모양이다.\n\n## Q2: TensorRT-LLM 이 vLLM 보다 빠를 수 있는 이유와 느릴 수 있는 이유는?\n\n**30초.** TRT-LLM 은 모델을 미리 컴파일해 커널 융합·레이아웃을 그 GPU 에 맞춰 고정하니 같은 하드웨어에서 최고 성능을 낼 수 있고, 반대로 컴파일 시간·모델 지원 지연·유연성 부족 때문에 새 모델이나 동적 워크로드에서는 vLLM 이 낫거나 TRT-LLM 이 아예 못 돈다.\n\nTRT-LLM 은 NVIDIA 가 자기 GPU 전용으로 만들어 FP8·NVFP4 커널이 먼저 나온다.\nvLLM 은 Python 중심이라 새 모델이 며칠 안에 올라오고 커뮤니티가 크다.\n벤치마크 차이는 모델·배치·버전에 따라 뒤집히니 \"항상 TRT-LLM 이 빠르다\" 는 틀린 말이다.\nDynamo 는 셋을 다 백엔드로 받아 선택을 미룬다.\n\n## Q3: llm-d · AIBrix · Dynamo 는 같은 층(오케스트레이터)인데 무엇이 다른가요?\n\n**30초.** 셋 다 \"여러 엔진 인스턴스를 라우팅·스케일하는 층\" 인데, Dynamo 는 NVIDIA 가 P/D 분리·KV 티어링·NIXL 을 Rust 로 깊게 만든 것, llm-d 는 Red Hat·Google 이 K8s 네이티브(Gateway API Inference Extension) 로 vLLM 중심으로 만든 것, AIBrix 는 ByteDance 가 자기 운영 경험을 K8s 위에 올린 것이다.\n\n| | 주체 | 강점 | 엔진 |\n|---|---|---|---|\n| Dynamo | NVIDIA | P/D · KVBM · NIXL · planner, Rust 핫패스 | vLLM · SGLang · TRT-LLM |\n| llm-d | Red Hat · Google · IBM | K8s 표준(EPP) 준수, 가벼움 | vLLM |\n| AIBrix | ByteDance | 대규모 운영 기능(LoRA 관리 · 이종 GPU) | vLLM |\n\n2026-09 조사 때 Dynamo 를 1 순위, AIBrix 차선, llm-d 보류로 골랐다.\n\n## Q4: '왜 vLLM 이 아니라 Dynamo 에 기여했나' 에 어떻게 답하나요?\n\n**30초.** \"vLLM 에는 두 건을 머지했고, 그 과정에서 엔진 하나로는 안 풀리는 문제(여러 엔진의 KV 라우팅 · P/D 조율 · 스케일)가 그 위 층에 있다는 걸 봤다.\n그 층에서 NVIDIA 가 가장 깊게 만들고 있는 게 Dynamo 였고, vLLM 경험(NIXL · DP placement)이 그대로 먹히는 자리(`components/src/dynamo/vllm/`, `lib/kv-router`)가 있었다\" 로 답한다.\n\n실제 순서도 그랬다.\nDynamo 의 T2 몽키패치를 보고 vLLM 쪽을 고쳐 #57648 이 됐다.\n\"엔진에서 오케스트레이터로\" 는 추론 시스템을 아래에서 위로 올라간 경로라 자연스럽고, 면접관에게 두 층을 다 봤다는 신호가 된다.\n\n",

   "qs": [
    "Q1: event plane 은 무엇을 어디로 흘리나요? ZMQ 와 NATS 를 각각 언제 쓰나요?",
    "Q2: KV events 가 event plane 을 타는 흐름을 설명해보세요.",
    "Q3: metrics 와 tracing 은 어디서 수집되고 어디로 나가나요?",
    "Follow-up: ZMQ 이벤트 플레인을 암호화한다면 어느 층(CURVE · TLS 터널)에 넣어야 하고 무엇이 걸림돌인가요?"
   ],
   "md": "> ENGINE · dynamo · T3  \n> 원리 → engine/vllm/metrics_observability.md\n\n## Q1: event plane 은 무엇을 어디로 흘리나요? ZMQ 와 NATS 를 각각 언제 쓰나요?\n\n**30초.** event plane 은 요청 경로와 분리된 \"상태 변화 알림\" 채널이다.\nKV 블록 추가·제거, worker 부하, 라이프사이클 이벤트가 흐른다.\nZMQ 는 같은 노드·낮은 레이턴시(KV events 를 라우터로), NATS 는 노드 간·내구성(JetStream) 이 필요한 이벤트에 쓴다.\n\n요청 응답에 섞으면 응답이 느려지고, 요청이 없을 때는 상태가 안 전달된다.\n그래서 별도 채널이다.\n`lib/runtime/src/transports/` 에 zmq · nats · tcp 가 있다.\n\n## Q2: KV events 가 event plane 을 타는 흐름을 설명해보세요.\n\n**30초.** vLLM worker 가 블록을 캐시에 넣거나 빼면 `KVCacheEvent`(블록 해시 · 부모 해시 · 토큰 수 · 추가/제거) 를 발행하고, Dynamo 핸들러가 그걸 받아 event plane(ZMQ) 으로 라우터에 보낸다.\n라우터 인덱서가 받아 radix tree 를 갱신한다.\n\nvLLM 쪽은 `--kv-events-config` 로 발행을 켠다.\n이벤트는 순서가 중요해(추가 뒤 제거) 시퀀스 번호가 붙고, 유실되면 라우터가 그 worker 트리를 다시 받는다(#12314 의 복구).\n`lib/kv-router/src/zmq_wire` 가 수신 쪽이다.\n\n## Q3: metrics 와 tracing 은 어디서 수집되고 어디로 나가나요?\n\n**30초.** metrics 는 각 컴포넌트가 Prometheus 형식으로 노출하고(frontend 의 요청 수·지연, worker 의 엔진 지표 passthrough, 라우터의 선택 분포), tracing 은 OpenTelemetry 로 요청 하나가 frontend → router → P → D 를 지나는 span 을 이어 붙인다.\n\n#10696 의 DP rank 별 활성 요청 게이지가 frontend 메트릭에 라벨(worker_id · dp_rank · worker_type) 을 추가하는 일이었다.\n`active_request_counts()` 와 라벨 세트가 이미 있어 배선만 하면 됐다.\ntracing 은 P/D 분리에서 \"어느 단계가 느렸나\" 를 요청 단위로 보는 유일한 방법이다.\n\n## Follow-up: ZMQ 이벤트 플레인을 암호화한다면 어느 층(CURVE · TLS 터널)에 넣어야 하고 무엇이 걸림돌인가요?\n\n**30초.** ZMQ 자체의 CURVE(공개키 암호화) 를 켜는 것이 가장 자연스럽지만, Dynamo 가 쓰는 libzmq 빌드에 CURVE 가 컴파일돼 있지 않아 바로 안 된다.\n대안은 TLS 터널(사이드카)이나 애플리케이션 층 암호화다.\n\n#10809 는 `approved-for-pr` 라벨이 있었는데 NATS/TCP TLS 는 끝났고 ZMQ 만 아무도 안 했다.\n설계 옵션 A(CURVE, libzmq 재빌드 필요)·B(TLS 사이드카)·C(앱 층) 를 메모로 정리했다.\nlibzmq 에 CURVE 미컴파일을 실측으로 확인한 것이 그 메모의 핵심이고, 그래서 \"쉬운 작업\" 이 아니라 장기 후보로 분류했다.\n\n---\n\n### 손댄 곳\n\n- #10809 ZMQ 이벤트 플레인 암호화 설계 옵션 A/B/C, libzmq 에 CURVE 미컴파일 실측 · 10809-zmq-event-plane-encryption/\n",

   "md": "> ENGINE · dynamo · T3\n\n## Q1: Dynamo operator 와 DGD · DGDR CRD 는 각각 무엇을 선언하나요?\n\n**30초.** operator 는 Dynamo CRD 를 감시해 Pod·Service 를 만들고 유지하는 컨트롤러고, DGD(DynamoGraphDeployment) 는 \"frontend · router · P worker · D worker 를 각각 몇 개, 어떤 이미지·리소스로\" 를 선언하는 완성된 토폴로지, DGDR(…Request) 은 \"모델 · GPU · SLA\" 만 적으면 operator 가 DGD 를 만들어주는 요청이다.\n\nDGD 는 수동, DGDR 은 zero-config(베타) 다.\noperator 가 EndpointSlice 로 서비스 디스커버리를 K8s 네이티브로 처리한다.\nHelm 차트로 Dynamo Platform(operator + 의존성) 을 먼저 깐다.\n\n## Q2: Grove 의 topology-aware gang scheduling 은 어떤 문제를 푸나요? (NVL72)\n\n**30초.** TP 8 짜리 worker 는 Pod 8 개가 같은 NVLink 도메인(같은 노드, NVL72 면 같은 랙) 에 동시에 떠야 하는데, 기본 K8s 스케줄러는 Pod 를 하나씩 어디든 놓는다.\nGrove 는 \"이 Pod 묶음은 전부 같은 토폴로지 안에 한 번에(gang)\" 를 보장한다.\n\n하나만 다른 노드에 가면 TP 통신이 네트워크를 타서 쓸 수 없다.\n절반만 뜨고 나머지가 자원이 없어 못 뜨면 떠 있는 절반이 GPU 를 잡고 논다(partial scheduling).\nGrove 가 둘 다 막는다.\nNVL72(72 GPU 가 한 NVLink 도메인) 같은 큰 토폴로지에서 특히 필요하다.\n\n## Q3: EPP(Endpoint Picker Plugin) 는 Gateway API Inference Extension 안에서 어디에 서나요?\n\n**30초.** Gateway API Inference Extension 은 K8s 게이트웨이가 \"어느 백엔드 Pod 로 보낼지\" 를 외부 플러그인에 물을 수 있게 한 표준이고, EPP 는 그 플러그인 자리에 Dynamo 의 라우팅(KV 겹침 · 부하)을 끼운 것이다.\n\n게이트웨이(Envoy 등) → EPP 에 \"이 요청 어디로?\" → EPP 가 Dynamo 라우터 로직으로 Pod 선택 → 게이트웨이가 그 Pod 로 전달.\nDynamo frontend 를 안 쓰고 기존 게이트웨이를 쓰는 환경에서 라우팅 지능만 가져가는 경로다.\nllm-d 도 같은 표준을 쓴다.\n\n## Follow-up: zero-config deploy(DGDR) 는 무엇을 자동으로 정하나요?\n\n**30초.** TP 크기, P/D 분리 여부와 비율, 레플리카 수, 배치·KV 설정을 모델·GPU·SLA 에서 자동으로 정한다.\n\nAISimulate 의 탐색 결과를 DGD 로 변환하는 것이다.\n\"Llama-70B 를 H100 16 장에 TTFT 500 ms 로\" 만 적으면 나머지가 채워진다.\n베타라 복잡한 토폴로지는 아직 수동 DGD 가 필요하다.\n\n",

   "qs": [
    "Q1: E/P/D 세 단계로 나누면 무엇이 독립적으로 스케일되나요?",
    "Q2: embedding cache 는 무엇을 캐시하고 어디에 두나요?",

   ],
   "md": "> ENGINE · dynamo · T3  \n> 원리 → theory/inference/disaggregated_serving.md\n\n## Q1: E/P/D 세 단계로 나누면 무엇이 독립적으로 스케일되나요?\n\n**30초.** 이미지·비디오 인코더(E), 텍스트 prefill(P), decode(D) 가 각각 다른 GPU 풀에서 돌아 셋이 따로 스케일된다.\n\n인코더는 비전 모델이라 LLM 과 연산 모양이 다르고, 이미지가 많은 요청과 텍스트만인 요청이 섞이면 한 풀에서 효율이 떨어진다.\nE 를 떼면 이미지 트래픽이 늘 때 E 만 늘린다.\nE 의 출력(임베딩)은 KV 보다 작아 전송 부담도 적다.\n\n## Q2: embedding cache 는 무엇을 캐시하고 어디에 두나요?\n\n**30초.** 같은 이미지(해시가 같은)를 다시 인코딩하지 않게 인코더 출력 임베딩을 캐시한다.\nE worker 옆이나 공유 스토어에 둔다.\n\n멀티턴 대화에서 같은 이미지가 매 턴 다시 들어온다.\n인코딩은 비전 트랜스포머 forward 라 비싸다.\n이미지 콘텍츠 해시로 캐시하면 두 번째 턴부터 E 를 건너뛴다.\nvLLM 의 encoder cache(요청 안) 와 Dynamo 의 embedding cache(요청 사이·worker 사이) 는 범위가 다르다.\n\n## Q3: encoder 마이크로배처는 무엇을 모으고, 대기열 상한(backpressure)이 없으면 무슨 일이 생기나요?\n\n**30초.** 여러 요청의 이미지를 모아 인코더를 한 번에 돌려 GPU 효율을 올리는 것이고, 상한이 없으면 요청이 처리 속도보다 빨리 들어올 때 큐가 무한히 자라 메모리가 터지거나 뒤의 요청이 영원히 기다린다.\n\n`multimodal_utils/custom_encoder/batcher.py` 의 `submit()` 이 큐에 넣는데 크기 확인이 없었다(T3).\nbackpressure 정책은 둘 중 하나다.\n꽉 차면 즉시 거부(429 류) 하거나, 자리가 날 때까지 호출자를 기다리게(await) 한다.\n어느 쪽인지는 오너(furionw) 가 정할 일이라 이슈로 먼저 물어야 했고, 브랜치는 둘 다 가능하게 짜뒀다(56 테스트, 신규 11).\n\n---\n\n### 손댄 곳\n\n- T3: multimodal_utils/custom_encoder/batcher.py:31 submit() 에 대기열 상한 없음, 거부 vs 대기 정책 결정 필요 · todo-T3-encoder-batcher-backpressure/\n",

   "qs": [
    "Q1: vLLM 에서 TP 와 PP 는 어느 층에서 구현되나요? (model loader · worker · executor)",
    "Q2: Multiproc executor 와 Ray executor 는 각각 언제 쓰나요?",
    "Q3: DP 를 켤 때 DP coordinator 와 placement group 은 무엇을 하나요? 왜 Ray 가 필요하나요?",
    "Q4: elastic EP 는 무엇을 늘리고 줄이나요? EPLB 는 어느 시점에 expert 를 재배치하나요?",
    "Follow-up: DeepEP · MoonEP 같은 all-to-all 백엔드는 무엇을 대체하나요?"
   ],
   "md": "> ENGINE · vllm · T1  \n> 원리 → theory/inference/parallelism_for_inference.md\n\n## Q1: vLLM 에서 TP 와 PP 는 어느 층에서 구현되나요? (model loader · worker · executor)\n\n**30초.** TP 는 model loader 가 가중치를 랭크별로 잘라 올리고 레이어 코드(`ColumnParallelLinear` 등) 가 all-reduce 를 넣는 식으로 모델 층에서, PP 는 worker 가 자기 stage 의 레이어만 들고 activation 을 넘기는 식으로 worker 층에서, 둘을 어느 프로세스에 두느냐는 executor 층에서 구현된다.\n\n| 층 | TP | PP |\n|---|---|---|\n| model loader | 행렬을 열/행으로 쪼개 랭크마다 1/N 로드 | stage 에 속한 레이어만 로드 |\n| model 코드 | `*ParallelLinear` 가 forward 안에서 all-reduce / all-gather | `IntermediateTensors` 로 stage 경계 전달 |\n| worker | TP 그룹 통신 초기화 (NCCL) | 다음 stage worker 로 send/recv |\n| executor | 랭크 수만큼 프로세스 띄우고 같은 입력 브로드캐스트 | stage 수만큼 micro-batch 파이프라이닝 |\n\nTP 랭크들은 같은 `SchedulerOutput` 을 받아 같은 계산을 각자 1/N 씩 한다.\n\n## Q2: Multiproc executor 와 Ray executor 는 각각 언제 쓰나요?\n\n**30초.** 단일 노드면 Multiproc, 노드를 넘거나 DP 로 여러 엔진을 띄울 때 Ray 다.\n\n`MultiprocExecutor` 는 TP 랭크마다 서브프로세스를 만들고 shared memory 링버퍼로 입력을 브로드캐스트한다.\n오버헤드가 작고 의존성이 없다.\n`RayDistributedExecutor` 는 worker 를 Ray actor 로 띄워 어느 노드에 있어도 호출할 수 있다.\nRay 가 GPU 를 자원으로 관리하니 placement group 으로 \"이 랭크들은 같은 노드에\" 같은 제약을 걸 수 있다.\n멀티 노드 TP·PP 와 DP 는 Ray 가 거의 필수다.\n\n## Q3: DP 를 켤 때 DP coordinator 와 placement group 은 무엇을 하나요? 왜 Ray 가 필요하나요?\n\n**30초.** DP coordinator 는 여러 엔진(DP 랭크)의 스텝을 맞추고 요청을 분배하는 프로세스고, placement group 은 Ray 에 \"DP 랭크 r 의 TP worker 들을 어느 노드의 어느 GPU 에 묶어 놓아라\" 고 예약하는 것이다.\n\nDP 에서는 엔진이 N 개 돌고 각자 KV 캐시와 스케줄러를 가진다.\nMoE 모델은 EP 를 위해 모든 랭크가 같은 스텝을 밟아야 해서 coordinator(`v1/engine/coordinator.py`) 가 \"이번 스텝에 뭐라도 돌릴 랭크가 있나\" 를 맞춘다.\nplacement group(`v1/engine/utils.py` 의 `create/add_dp_placement_groups`) 은 Ray 가 노드별 GPU 수를 알아야 만들 수 있다.\n그 노드 정보를 얻는 `ray.util.state.list_nodes()` 가 대시보드 HTTP 를 요구해 `ray[default]` 없는 환경에서 죽었다.\nPR #57648 이 자매 함수의 선례(#23822)대로 `ray.nodes()` 기반으로 바꿨고, 4× GPU 에서 2 → 4 확장이 되는 걸 실기동으로 확인했다. ⭐️\n\n## Q4: elastic EP 는 무엇을 늘리고 줄이나요? EPLB 는 어느 시점에 expert 를 재배치하나요?\n\n**30초.** elastic EP 는 서빙 중에 DP 랭크(=EP 랭크) 수를 늘리거나 줄여 expert 를 다시 분배하는 것이고, EPLB 는 각 expert 가 받는 토큰 수를 재서 뜨거운 expert 를 복제하고 식은 expert 를 합치는 재배치다.\n\nEP 에서 expert 는 랭크들에 나뉘어 있고 토큰은 all-to-all 로 자기 expert 가 있는 랭크로 간다.\n특정 expert 에 토큰이 몰리면 그 랭크만 바쁘다.\nEPLB 는 주기적으로(스텝 수 기준) 부하 통계를 모아 expert 배치표를 다시 짜고 가중치를 옮긴다.\nelastic EP 는 랭크 수 자체를 바꾸니 그때도 EPLB 재구성이 돈다.\n9/17 실측: 시작 DP ≥ 2 여야 하고, NIXL 없으면 `--eplb-config.use_async=false`, 2 → 1 축소는 안 됐고 2 → 4 확장은 4 장이 필요했다.\n\n## Follow-up: DeepEP · MoonEP 같은 all-to-all 백엔드는 무엇을 대체하나요?\n\n**30초.** NCCL 의 범용 all-to-all 을 MoE 전용으로 짠 통신 라이브러리로 대체한다.\n토큰을 expert 랭크로 보내고 받는 dispatch/combine 을 더 낮은 레이턴시로 한다.\n\nDeepEP 는 DeepSeek 이 공개한 것으로 노드 안은 NVLink, 노드 간은 RDMA 를 직접 쓰고 low-latency 모드가 따로 있다.\nMoonEP 는 v0.31 에 들어온 또 다른 백엔드다.\ndecode 의 all-to-all 은 토큰 수가 적어 레이턴시가 전부라 범용 collective 로는 느리다.\nEP 서빙의 성능이 이 백엔드 선택으로 갈린다.\n\n---\n\n### 손댄 곳\n\n- PR #57648 (머지 9/29): add_dp_placement_groups 가 ray.util.state.list_nodes() 로 대시보드 HTTP 를 요구 → ray[default] 없는 환경에서 실패, 선례 #23822 방식으로 수정, 4× GPU 2→4 실기동 · todo-T2-vllm-dp-placement-list-nodes/\n- elastic EP 실기동 (9/17): 시작 DP≥2, --eplb-config.use_async=false, 축소 2→1 불가 · dynamo-study/02-env/README.md\n",

   "md": "> ENGINE · vllm · T1  \n> 원리 → theory/inference/disaggregated_serving.md\n\n## Q1: KVConnectorBase_V1 이 scheduler 쪽과 worker 쪽으로 나뉘는 이유는? 각 쪽은 무엇을 하나요?\n\n**30초.** \"어느 요청의 어느 블록을 외부와 주고받을지\" 는 스케줄러가 알고, \"실제 바이트를 옮기는 것\" 은 GPU 를 가진 worker 가 하기 때문에 역할이 둘로 갈린다.\n\n| 쪽 | 메서드 (`kv_connector/v1/base.py`) | 하는 일 |\n|---|---|---|\n| scheduler | `get_num_new_matched_tokens` | 이 요청의 토큰 중 외부(원격 P·캐시)에 이미 있는 게 몇 개인지 |\n| scheduler | `update_state_after_alloc` | 블록이 할당된 뒤 \"이 블록들로 받아라\" 상태 기록 |\n| scheduler | `build_connector_meta` | 이번 스텝 worker 에 보낼 전송 지시서 생성 |\n| scheduler | `request_finished` | 요청 종료 시 블록을 바로 free 할지 전송 끝까지 잡아둘지 |\n| worker | `start_load_kv` | forward 시작 전 원격 KV 를 로컬 블록으로 받기 시작 |\n| worker | `wait_for_layer_load` / `save_kv_layer` | 레이어 단위로 로드 대기 · 저장 (layer-wise 파이프라이닝) |\n| worker | `wait_for_save` | 이번 스텝 저장 완료 대기 |\n| worker | `get_finished` | 전송이 끝난 요청 ID 를 스케줄러에 보고 |\n\nscheduler 쪽은 CPU 프로세스(EngineCore), worker 쪽은 TP 랭크마다 하나다.\n둘은 `SchedulerOutput` 에 실린 connector metadata 로만 통신한다.\n\n## Q2: NixlConnector 의 pull 모드 흐름(P 가 KV 를 들고 기다리고 D 가 당긴다)을 단계별로 설명해보세요. handshake 와 heartbeat 는 왜 있나요?\n\n**30초.** P 가 prefill 을 끝내고 KV 를 자기 블록에 남겨둔 채 \"다 됐다\" 신호를 보내면, D 가 NIXL 로 그 블록을 자기 블록으로 읽어온다(RDMA read).\nhandshake 는 상대의 메모리 주소·블록 레이아웃을 교환하는 것, heartbeat 는 상대가 살아 있는지 확인해 죽은 엔진의 등록을 지우는 것이다.\n\n```\n1. D 가 요청을 받음. 라우터가 \"P 에서 prefill 됨\" 메타(엔진 ID · 블록 ID) 를 같이 줌\n2. D scheduler: get_num_new_matched_tokens → 프롬프트 전부가 \"외부에 있음\", 블록만 할당\n3. D worker: 처음 보는 P 엔진이면 handshake (ZMQ 사이드채널로 NIXL agent metadata · 블록 주소 교환)\n4. D worker: start_load_kv → NIXL read 로 P 블록 → D 블록 복사 (비동기)\n5. 완료되면 get_finished 로 보고, 스케줄러가 decode 시작\n6. P 는 D 의 수신 완료 알림을 받고서야 블록 free\n```\n\nheartbeat 가 없으면 죽은 P 의 agent 가 `_remote_agents` 에 영원히 남고, 그 위에 재핸드셰이크가 겹치면 상태가 어긋난다.\nX1 이 그 경로의 락 규약 위반 3건이었다.\n\n## Q3: kv_buffer_device=cpu 일 때 host buffer 는 무엇이고 copy_blocks 는 언제 호출되나요?\n\n**30초.** GPU 사이를 직접 RDMA 로 못 잇는 환경(이종 장비·NIC 미지원)에서, KV 를 CPU 고정 메모리(host buffer) 에 한 번 내려놓고 그걸 NIXL 로 옮긴다.\n`copy_blocks` 는 GPU 블록 ↔ host buffer 사이의 복사 커널이다.\n\nP 쪽은 `save_kv_to_host` 에서 GPU → host 로, D 쪽은 `sync_recved_kv_to_device` 에서 host → GPU 로 `copy_blocks` 를 부른다.\n원래 코드는 KV 캐시 그룹마다 따로 불렀다.\ngemma-3 처럼 그룹이 7 이면 요청당 7 번 커널을 띄운다.\nPR #54483 은 그룹들의 (src, dst) 블록 쌍을 합쳐 한 번에 부르게 바꿨다. ⭐️\nG=6 에서 4.95 ms → 1.27 ms, 호출 7 → 1, 출력 동일.\nhost buffer 는 GPU KV 캐시와 같은 크기로 잡히므로 `gpu_memory_utilization` 을 낮게 잡아야 한다(9/22 실측 0.12).\n\n## Q4: MultiConnector 는 무엇을 묶나요? 어떤 조합이 쓰이나요?\n\n**30초.** 커넥터 여러 개를 순서대로 묶어 하나처럼 보이게 한다.\n\"P/D 전송 + CPU 오프로드\" 처럼 한 요청의 KV 가 두 경로를 다 탈 때 쓴다.\n\n`MultiConnector` 는 `get_num_new_matched_tokens` 를 자식 순서대로 물어 첫 번째로 \"있다\" 고 답한 커넥터에 그 요청을 맡긴다.\nworker 쪽 호출은 전부 자식에 전달한다.\nNIXL(P/D) + LMCache(CPU/디스크 캐시) 조합이 대표적이다.\n53049 는 두 번째 커넥터가 로드를 맡았는데 첫 번째가 메타를 안 가진 상태에서 assert 가 터진 경계 조건이었다.\n\n## Follow-up: KV 전송이 실패하면 어떻게 알아내고 처리하나요? (_handle_failed_transfer)\n\n**30초.** NIXL 전송의 완료 콜백에 실패 상태가 오면 `get_finished` 대신 실패 목록으로 보고하고, 스케줄러가 그 요청의 외부 토큰을 0 으로 되돌려 로컬에서 prefill 을 다시 한다.\n\n`_handle_failed_transfer` 가 그 경로다.\nHMA(하이브리드 메모리 할당) 모델은 블록 레이아웃이 그룹마다 달라 실패 복구가 더 복잡하고, 로드맵 항목 10/18 이 그 미완 부분이다.\nDynamo 이슈 #12463 의 \"KV 전송 실패인데 HTTP 200 에 쓰레기 토큰\" 은 이 복구가 안 된 채 decode 가 시작된 증상이다.\n\n---\n\n### 손댄 곳\n\n- PR #54483 (머지 10/1): save_kv_to_host / sync_recved_kv_to_device 의 그룹별 copy_blocks 루프를 단일 호출로 병합, G=6 에서 4.95ms → 1.27ms · roadmap-19-h2d-copy-coalescing/\n- X1: push 모드 _remote_agents 락 규약 위반 3결함(A 동시 축출 assert · B defaultdict 오염 · C 흡수 상태), 하네스로 GPU 없이 재현 · pushmode-x1-remote-agents-lock-race/\n- 53049 MultiConnector late load assert · 53368 CPU vs P2P attribution · vllm-study/01-issues/\n",

    "Q1: PagedAttention 이 OS 의 가상 메모리에서 빌려온 아이디어는 무엇인가요? 블록 테이블은 무엇을 매핑하나요?",

   "md": "> ENGINE · vllm · T1  \n> 원리 → theory/inference/kv_cache.md\n\n## Q1: PagedAttention 이 OS 의 가상 메모리에서 빌려온 아이디어는 무엇인가요? 블록 테이블은 무엇을 매핑하나요?\n\n**30초.** 가상 메모리의 페이지처럼 KV 캐시를 고정 크기 블록(기본 16 토큰)으로 쪼개 비연속 물리 블록에 두고, 요청마다 \"논리 블록 → 물리 블록\" 표를 들고 다닌다.\n\n요청의 KV 가 연속 메모리여야 한다는 가정을 버렸다.\n요청은 토큰이 늘 때마다 블록 하나씩 받고, 블록은 GPU 어디에 있어도 된다.\nattention 커널이 블록 테이블을 보고 흩어진 블록을 모아 읽는다.\n그래서 요청 최대 길이만큼 예약할 필요가 없고(내부 단편화 제거), 끝난 요청의 블록이 바로 다른 요청에 간다.\nvLLM 논문(SOSP '23) 기준 기존 시스템의 KV 낭비 60-80% 가 4% 미만으로 줄었다.\n\n## Q2: KVCacheManager 가 블록을 할당·해제·공유하는 흐름을 설명해보세요.\n\n**30초.** 요청이 들어오면 프리픽스 캐시에서 이미 있는 블록을 찾고, 새 토큰 수만큼 `BlockPool` 에서 free 블록을 꺼내 블록 테이블에 붙이고, 요청이 끝나면 블록을 free 리스트로 돌려보내되 해시가 있으면 캐시로 남긴다.\n\n| 함수 (`v1/core/kv_cache_manager.py`) | 하는 일 |\n|---|---|\n| `get_computed_blocks` | 요청 토큰의 블록 해시로 이미 계산된 블록을 찾는다 (프리픽스 캐시 히트) |\n| `allocate_slots` | 이번 스텝에 필요한 새 블록 수를 계산해 할당. 모자라면 None 을 돌려 스케줄러가 preempt |\n| `free` | 요청 종료. 블록을 free 큐 끝에 넣는다 (LRU) |\n| `cache_blocks` | 꽉 찬 블록에 해시를 붙여 다음 요청이 재사용할 수 있게 |\n\nfree 큐가 LRU 라 \"해제됐지만 아직 덮어쓰이지 않은\" 블록은 캐시 히트가 될 수 있다.\n할당과 해제가 전부 스케줄러 쪽(CPU) 에서 일어나고 GPU 는 블록 테이블만 받는다.\n\n## Q3: hybrid KV cache manager 는 왜 필요한가요? sliding window 레이어와 full attention 레이어가 섞이면 무엇이 달라지나요?\n\n**30초.** 레이어마다 KV 를 유지하는 길이가 다르면 블록을 똑같이 나눠줄 수 없어서, 레이어를 \"같은 규칙\" 끼리 그룹으로 묶어 그룹마다 따로 관리한다.\n\nfull attention 레이어는 모든 토큰의 KV 를 끝까지 쥐지만, sliding window 레이어는 최근 W 토큰만 쥐고 나머지는 버려도 된다.\n한 KV 캐시 매니저로 둘을 똑같이 다루면 SW 레이어가 필요 없는 블록을 계속 쥔다.\n`KVCacheCoordinator` 가 그룹마다 `SingleTypeKVCacheManager` 를 두고, 요청 하나에 그룹 수만큼의 블록 테이블을 만든다.\nGemma-3 · Llama-4 같은 하이브리드 모델에서 KV 메모리가 크게 준다.\n상세는 `docs/design/hybrid_kv_cache_manager.md`.\n\n## Q4: KV 캐시 그룹(kv cache group)이란? 모델의 어떤 설정이 그룹 수를 정하나요?\n\n**30초.** KV 캐시 그룹은 \"같은 KV spec(헤드 수·head_dim·dtype·sliding window 유무) 을 가진 레이어 묶음\" 이고, 그룹 수는 모델 config 의 레이어 종류 수로 정해진다.\n\n전부 full attention 인 Llama 는 그룹 1 개다.\ngemma-3-1b 는 26 층이 full 4 + sliding window 22 인데, 그룹이 2 가 아니라 7 이었다.\nvLLM 이 그룹마다 블록 수를 맞추기 위해 레이어를 균등 분할하고 padding 레이어를 넣기 때문이다(기동 로그 'Add 2 padding layers').\n`kv_cache_utils` 의 그룹 계산 함수로 확인했다.\nKV connector 가 그룹마다 따로 복사하는 구조라, 이 그룹 수가 PR #54483 의 copy_blocks 호출 횟수(7) 였다. ⭐️\n\n## Follow-up: 블록 크기(block_size)를 크게·작게 하면 각각 무엇을 얻고 잃나요?\n\n**30초.** 크면 블록 테이블이 짧고 커널이 효율적이지만 마지막 블록의 빈 자리(내부 단편화)가 커지고 프리픽스 캐시 히트 단위가 거칠어진다.\n작으면 반대다.\n\nblock_size 16 이면 요청마다 평균 8 토큰이 빈다.\n128 이면 64 토큰이 비고, 프리픽스 캐시도 128 토큰 단위로만 맞아야 히트다.\n반면 블록이 크면 attention 커널이 한 블록에서 더 긴 연속 읽기를 해서 빠르다.\nFlashAttention 백엔드는 16 이 기본, FlashInfer 는 더 큰 값을 선호하는 식으로 백엔드가 정한다.\n\n---\n\n### 손댄 곳\n\n- gemma-3-1b 실측: 26층 = full 4 + SW 22, 윈도 512, kv_heads 1 → KV 캐시 그룹 7개, 기동 로그 'Add 2 padding layers' · vllm-study/01-issues/roadmap-19-h2d-copy-coalescing/experiment/\n",

   "md": "> ENGINE · vllm · T1  \n> 원리 → theory/inference/batching.md, theory/inference/autoregressive_decoding.md\n\n## Q1: 스케줄러가 매 step 에 결정하는 것은 무엇인가요? waiting · running 큐는 어떻게 움직이나요?\n\n**30초.** 이번 스텝에 \"어느 요청의 토큰 몇 개를 돌릴지\" 와 \"그걸 위해 KV 블록을 몇 개 줄지\" 를 정한다.\nrunning 큐를 먼저 채우고 남는 예산으로 waiting 에서 꺼낸다.\n\n`Scheduler.schedule()` (`v1/core/sched/scheduler.py`) 이 매 스텝 호출된다.\nrunning 요청들은 각각 토큰 1 개(decode) 또는 남은 prefill 조각을 요구하고, 스케줄러는 토큰 예산과 KV 블록이 되는 만큼 받아준다.\n그다음 waiting 큐 앞에서부터 새 요청을 꺼내 프리픽스 캐시를 확인하고 블록을 할당한다.\n결과물은 `SchedulerOutput` 하나로, 요청별 토큰 수와 블록 테이블 변경이 들어 있다.\nV1 은 prefill 과 decode 를 구분하지 않고 전부 \"이 요청에 토큰 n 개\" 로 본다. ⭐️\n\n## Q2: max_num_seqs 와 max_num_batched_tokens 는 각각 무엇을 제한하나요?\n\n**30초.** `max_num_seqs` 는 한 스텝에 들어가는 요청 수 상한, `max_num_batched_tokens` 는 한 스텝에 처리하는 토큰 수 상한이다.\n\ndecode 요청은 토큰 1 개씩이라 `max_num_seqs` 가 먼저 걸린다(기본 256 전후, GPU 에 따라 다름).\nprefill 은 요청 하나가 수천 토큰이라 `max_num_batched_tokens` 가 먼저 걸린다(기본 8192 전후).\n둘이 스텝 길이를 정하고, 그래서 ITL 과 처리량의 트레이드오프를 정한다.\n토큰 예산을 키우면 처리량이 늘고 ITL 이 길어진다.\n\n## Q3: chunked prefill 이 켜지면 한 step 의 토큰 예산을 prefill 과 decode 가 어떻게 나누나요?\n\n**30초.** 예산에서 running(decode) 요청들의 토큰을 먼저 빼고, 남는 양만 prefill 조각에 준다.\n그래서 긴 프롬프트가 들어와도 decode 가 밀리지 않는다.\n\nprefill 요청은 `num_computed_tokens` 가 프롬프트 길이에 닿을 때까지 여러 스텝에 걸쳐 조각으로 처리된다.\n한 조각의 크기는 \"남은 예산\" 과 `long_prefill_token_threshold` 중 작은 쪽이다.\nV1 은 chunked prefill 이 기본으로 켜져 있어 끄는 옵션이 아니라 예산을 조절하는 옵션만 있다.\nprefill 조각과 decode 토큰이 같은 forward 에 섞여 들어가고, attention 커널이 요청마다 query 길이가 다른 걸 처리한다.\n\n## Q4: preemption 이 일어나는 조건과 recompute 방식의 비용은?\n\n**30초.** 새 블록을 줘야 하는데 free 블록이 없을 때 일어난다.\nrunning 에서 가장 뒤(가장 늦게 들어왔거나 우선순위 낮은) 요청을 골라 블록을 전부 회수하고 waiting 맨 앞으로 돌려보낸다.\n\n희생자는 `running` 의 `max` 로 뽑는다(우선순위, 그다음 도착 시각).\n회수된 요청은 `num_computed_tokens` 가 0 으로 돌아가 다음에 prefill 부터 다시 한다(recompute).\n비용은 그 요청이 지금까지 한 prefill 연산 전부다.\n단 프리픽스 캐시가 켜져 있으면 블록이 아직 덮어쓰이지 않은 한 다시 히트가 나서 실제 손실은 작다.\nV1 에 swap 이 없는 이유다.\n\n## Follow-up: v0.31 에 들어온 --max-num-active-seqs 와 재작성된 waiting queue 는 무엇을 바꿨나요?\n\n**30초.** `--max-num-active-seqs` 는 \"진행 중(running + 아직 안 끝난)\" 요청 수의 상한으로, `max_num_seqs` 가 스텝 단위 배치 크기인 것과 달리 시스템이 동시에 들고 있는 요청 수를 제한한다.\nwaiting queue 재작성은 우선순위·도착순 정렬과 preempt 복귀 처리를 정리한 것이다.\n\n과부하에서 요청을 무한정 받아 전부 느려지는 대신 admission 에서 막는 손잡이다.\n게이트웨이가 없을 때 엔진 자체의 back-pressure 가 된다.\nv0.31.0 릴리스 노트 'Scheduling controls' 항목.\n\n",

   "qs": [
    "Q1: 요청 하나가 APIServer → EngineCore → Scheduler → ModelRunner → 응답까지 어떤 프로세스·큐를 거치나요?",
    "Q2: APIServer 와 EngineCore 가 별도 프로세스인 이유는? 둘 사이는 무엇으로 통신하나요?",
    "Q3: Executor(Multiproc vs Ray) 는 무엇을 추상화하나요?",
    "Q4: ModelRunner V2 가 V1 과 달라진 점은?",
    "Follow-up: EngineCore 가 죽었는데 포트를 잡고 있으면 다음 기동에 무슨 일이 생기나요?"
   ],
   "md": "> ENGINE · vllm · T1  \n> 원리 → theory/inference/serving_system_design.md\n\n## Q1: 요청 하나가 APIServer → EngineCore → Scheduler → ModelRunner → 응답까지 어떤 프로세스·큐를 거치나요?\n\n**30초.** HTTP 요청 → APIServer 프로세스(토크나이즈·`AsyncLLM`) → ZMQ 로 EngineCore 프로세스 → Scheduler 가 배치에 넣음 → ModelRunner 가 GPU forward → 토큰 ID 가 ZMQ 로 돌아와 detokenize → 스트리밍 응답.\n\n| 단계 | 어디 | 하는 일 |\n|---|---|---|\n| 1 | APIServer (`entrypoints/openai`) | 요청 파싱, 채팅 템플릿 |\n| 2 | `AsyncLLM` (`v1/engine/async_llm.py`) | `InputProcessor` 로 토크나이즈·멀티모달 처리, 요청 객체 생성 |\n| 3 | `EngineCoreClient` (`core_client.py`) | ZMQ 소켓으로 EngineCore 에 요청 push |\n| 4 | `EngineCoreProc` (`core.py`) | 입력 큐에서 꺼내 `Scheduler` 에 추가 |\n| 5 | `Scheduler` (`v1/core/sched/`) | 매 스텝 어떤 요청의 몇 토큰을 돌릴지 결정, KV 블록 할당 |\n| 6 | `ModelRunner` (`v1/worker/`) | 배치를 텐서로 만들어 forward, 샘플링 |\n| 7 | EngineCore → AsyncLLM | 출력 토큰 ID 를 ZMQ 로 반환 |\n| 8 | `OutputProcessor` + `Detokenizer` | 텍스트로 바꿔 요청별 스트림에 흘림 |\n\n5-6 이 GPU 를 쓰는 루프(busy loop)고 나머지는 전부 CPU 다.\n\n## Q2: APIServer 와 EngineCore 가 별도 프로세스인 이유는? 둘 사이는 무엇으로 통신하나요?\n\n**30초.** GPU 루프가 Python GIL 과 HTTP 처리에 방해받지 않게 하려고 분리했다.\n둘 사이는 ZMQ 소켓(msgpack 직렬화) 으로 통신한다.\n\nV0 는 한 프로세스라 토크나이즈·HTTP 파싱이 GPU 스텝 사이에 끼어 ITL 이 튀었다.\nV1 은 EngineCore 가 \"스케줄 → forward → 출력\" 만 반복하는 전용 프로세스다.\nAPIServer 는 그 사이에 다음 요청을 준비하고 지난 출력을 detokenize 한다.\n둘이 겹쳐 돌아서 GPU 가 CPU 를 기다리지 않는다. ⭐️\nAPIServer 를 여러 개 띄워 하나의 EngineCore 에 붙일 수도 있다.\n\n## Q3: Executor(Multiproc vs Ray) 는 무엇을 추상화하나요?\n\n**30초.** \"worker 가 몇 개고 어디 있나\" 를 숨긴다.\nEngineCore 는 Executor 에 `execute_model` 을 부르기만 하고, Executor 가 그걸 TP/PP worker 들에 뿌린다.\n\n`UniProcExecutor` 는 worker 1개를 같은 프로세스에, `MultiprocExecutor` 는 TP 랭크마다 프로세스를 띄워 shared memory 브로드캐스트로 입력을 보낸다.\n`RayDistributedExecutor` 는 여러 노드에 걸칠 때 Ray actor 로 worker 를 띄운다.\n스케줄러 코드는 셋 중 뭐가 쓰이는지 모른다.\n단일 노드는 Multiproc, 멀티 노드나 DP 는 Ray 가 기본이다.\n\n## Q4: ModelRunner V2 가 V1 과 달라진 점은?\n\n**30초.** 입력 준비를 GPU 쪽으로 더 옮기고 CUDA graph 와 샘플링을 재설계해 CPU 오버헤드를 더 깎았다.\n\nV1 ModelRunner 도 CPU 에서 배치 메타데이터(블록 테이블·위치)를 만들어 GPU 로 복사하는 비용이 남아 있었다.\nV2 는 persistent 버퍼와 GPU 쪽 인덱싱으로 그 복사를 줄이고, CUDA graph 메모리를 프로파일로 관리하고, 샘플링을 batch-sharded 로 바꿨다.\nv0.29 에 모든 모델의 기본이 됐고, DBO(dual batch overlap) 와 spec decode 가 그 위에서 돈다.\n상세는 `docs/design/model_runner_v2.md`.\n\n## Follow-up: EngineCore 가 죽었는데 포트를 잡고 있으면 다음 기동에 무슨 일이 생기나요?\n\n**30초.** 새 EngineCore 가 같은 ZMQ 포트를 열려다 `Address already in use` 로 죽고, GPU 메모리도 고아가 쥐고 있어 KV 예산이 모자란다.\n\nAPIServer 가 죽어도 자식 EngineCore 는 살아남을 수 있다.\n`nvidia-smi --query-compute-apps=pid` 로 GPU 를 쥔 PID 를 찾아 죽여야 한다.\n`pgrep -f EngineCore` 는 자기 자신을 매칭해 오진하니 `ps -eo comm` 을 쓴다.\n9/1 팟에서 두 번 겪었다.\n\n---\n\n### 손댄 곳\n\n- 고아 VLLM::EngineCore 가 GPU·ZMQ 포트를 잡아 'Address already in use' (9/1), pgrep -f 자기 매칭 오진 · vllm-study/02-env/pod-setup.md\n",

   "qs": [
    "Q1: FlashAttention · FlashInfer · Triton · FlashMLA 백엔드는 각각 언제 선택되나요?",
    "Q2: 백엔드 선택 로직은 무엇(GPU 세대·dtype·head size·MLA 여부)을 보나요?",
    "Q3: sparse MLA 는 무엇이고 어느 모델에 쓰이나요?",

   ],
   "md": "> ENGINE · vllm · T2  \n> 원리 → theory/transformer/flash_attention.md\n\n## Q1: FlashAttention · FlashInfer · Triton · FlashMLA 백엔드는 각각 언제 선택되나요?\n\n**30초.** 기본은 FlashAttention(FA2/FA3), Blackwell 이나 특정 조건은 FlashInfer, 그 둘이 못 다루는 모양은 Triton, MLA 모델은 FlashMLA 계열이다.\n\n| 백엔드 | 언제 |\n|---|---|\n| FlashAttention | Ampere·Hopper 기본. FA3 는 Hopper 전용 |\n| FlashInfer | Blackwell 우선, 양자화 KV·특정 head size, JIT 컴파일 |\n| Triton | CUDA 커널이 없는 모양(비표준 head_dim), 디버깅용 |\n| FlashMLA / sparse MLA | DeepSeek MLA 모델 |\n| TRT-LLM 커널 | 일부 Blackwell 경로 |\n\n`VLLM_ATTENTION_BACKEND` 환경변수로 강제할 수 있다.\n구현은 `v1/attention/backends/`.\n\n## Q2: 백엔드 선택 로직은 무엇(GPU 세대·dtype·head size·MLA 여부)을 보나요?\n\n**30초.** GPU compute capability, dtype(BF16/FP8), head_dim, KV 캐시 dtype, MLA 여부, sliding window·ALiBi 지원 여부를 순서대로 체크해 첫 번째로 전부 만족하는 백엔드를 고른다.\n\nHopper(sm90) 에 BF16 이면 FA3, Ampere 면 FA2.\nhead_dim 이 FA 지원 목록(64·128·256 등) 밖이면 Triton 으로 떨어진다.\nFP8 KV 캐시는 FlashInfer 가 더 넓게 지원한다.\n선택 결과가 기동 로그에 \"Using XXX backend\" 로 찍히니 성능이 이상하면 그 줄을 먼저 본다.\n\n## Q3: sparse MLA 는 무엇이고 어느 모델에 쓰이나요?\n\n**30초.** MLA 의 압축된 latent KV 에서 attention 을 할 때 모든 과거 토큰이 아니라 선택된 일부(top-k) 토큰만 보는 방식이다.\nDeepSeek-V3.2 계열부터 들어왔다.\n\n긴 컨텍스트에서 attention 의 KV 읽기가 병목인데, 관련 있는 토큰은 소수다.\n인덱서가 각 쿼리에 대해 볼 토큰을 고르고, 그 토큰들의 latent 만 읽는다.\n읽는 바이트가 n 에서 k 로 줄어 decode 가 빨라진다.\n전용 커널(SM100 sparse MLA, FlashMLA sparse) 이 필요하고, v0.30 의 HiSparse 가 그 KV 의 호스트 티어다.\n\n## Follow-up: 너무 새로운 GPU(sm120) 에서 'requires sm75 or higher' 가 나오는 이유는?\n\n**30초.** 커널이 컴파일된 아키텍처 목록에 그 GPU 가 없으면 \"지원 안 함\" 분기로 떨어지는데, 그 분기의 에러 메시지가 \"sm75 이상 필요\" 로 고정돼 있어 너무 낮은 GPU 와 너무 새 GPU 가 같은 메시지를 낸다.\n\n9/1 Blackwell(sm120) 에서 FlashInfer 샘플러가 이 메시지를 냈다.\nGPU 가 낮은 게 아니라 그 FlashInfer 빌드에 sm120 바이너리가 없었던 것이다.\n`VLLM_USE_FLASHINFER_SAMPLER=0` 으로 우회했다.\n메시지를 글자 그대로 믿으면 엉뚱한 데를 고친다.\n\n---\n\n### 손댄 곳\n\n- Blackwell(sm120) 에서 FlashInfer 샘플러 거부 → VLLM_USE_FLASHINFER_SAMPLER=0 우회 (9/1) · vllm-study/02-env/pod-setup.md\n",

   "md": "> ENGINE · vllm · T2  \n> 원리 → theory/inference/prefix_caching_and_routing.md\n\n## Q1: 블록 해시는 무엇으로 계산하나요? 앞 블록 해시가 왜 들어가나요?\n\n**30초.** `hash(앞 블록 해시, 이 블록의 토큰 ID 들, extra keys)` 다.\n앞 블록 해시가 들어가야 \"같은 16 토큰이라도 앞 내용이 다르면 다른 KV\" 를 구분한다.\n\n`v1/core/kv_cache_utils.py` 의 `hash_block_tokens` 가 계산한다.\n첫 블록의 부모 해시는 고정 시드다.\nextra keys 에 멀티모달 해시·LoRA ID·캐시 솔트가 들어가 조건이 다르면 해시도 다르다.\n꽉 찬 블록만 해시를 가진다. 마지막 미완성 블록은 캐시 대상이 아니다.\nv0.29 부터 해시가 프로세스 간 결정적(deterministic)이라 여러 엔진이 같은 해시를 쓸 수 있고, 그게 Dynamo 라우터가 블록 해시로 겹침을 셀 수 있는 전제다. ⭐️\n\n## Q2: 캐시 히트 시 스케줄러는 어떤 블록을 건너뛰고 어디서부터 prefill 하나요?\n\n**30초.** 요청의 토큰을 블록 해시 체인으로 바꿔 앞에서부터 캐시 테이블에서 찾고, 연속으로 맞은 마지막 블록까지를 `computed_blocks` 로 돌린다.\n스케줄러는 그 토큰 수를 `num_computed_tokens` 로 놓고 그다음 토큰부터 prefill 한다.\n\n`KVCacheManager.get_computed_blocks` 가 맞은 블록 목록과 토큰 수를 준다.\n그 블록들은 ref count 가 올라가 다른 요청이 쓰는 동안 해제되지 않는다.\nprefill 은 `num_computed_tokens` 이후부터만 돌아서 2000 토큰 시스템 프롬프트가 맞으면 그 뒤 50 토큰만 계산한다.\n히트는 블록 단위라 마지막 1 토큰이 어긋나면 그 블록은 통째로 다시 한다.\n\n## Q3: 멀티모달 입력은 해시에 어떻게 반영하나요?\n\n**30초.** 이미지는 토큰 ID 가 아니라 플레이스홀더 토큰 열로 들어가서 ID 만 보면 다른 이미지가 같은 해시가 된다.\n그래서 이미지 콘텐츠 해시를 extra keys 로 블록 해시에 섞는다.\n\n`mm_hashes` 가 요청 생성 때 계산되어 해당 이미지가 걸치는 블록들의 해시에 들어간다.\n같은 이미지 + 같은 프롬프트면 히트, 이미지만 바뀌면 그 블록부터 미스다.\nv0.31 의 \"prefix-cache key collision 수정\" 이 이 경계 조건들을 고친 것이다.\n\n## Q4: Mamba 같은 상태 모델에 prefix caching 을 하려면 무엇을 저장해야 하나요?\n\n**30초.** Mamba 류는 KV 가 아니라 고정 크기 상태(SSM state + conv state) 가 있어서, 접두사 끝에서의 상태 스냅샷을 저장해야 거기서 이어갈 수 있다.\n\nattention 은 블록마다 KV 가 독립적으로 쌓이지만 Mamba 상태는 시퀀스를 다 지나야 하나가 나온다.\n그래서 prefill 중간에 블록 경계마다 상태를 체크포인트로 떠둔다(\"internal prefill checkpoints\").\n히트 시 그 체크포인트를 복원하고 뒷부분만 돈다.\nv0.29 에 들어와 하이브리드(Mamba + attention) 모델 TTFT 가 9-25% 줄었다.\n\n## Follow-up: v0.29 의 deterministic prefix-cache hashing 은 무엇을 고쳤나요?\n\n**30초.** 해시 계산에 프로세스마다 다른 값(Python 의 랜덤 해시 시드 등)이 섞여 같은 토큰이 엔진마다 다른 해시가 되던 것을 고정했다.\n\n같은 프로세스 안에서는 문제가 없었다.\nP/D 분리, 여러 엔진의 캐시 공유, 외부 라우터의 겹침 계산은 전부 \"엔진 A 의 해시 = 엔진 B 의 해시\" 를 전제한다.\n그 전제가 깨져 있었고, 그래서 결정적 해시가 기본이 됐다.\n외부 KV 스토어(LMCache·Mooncake)와의 호환에도 필요하다.\n\n",

   "cat": "engine/vllm",

   "qs": [
    "Q1: vLLM 이 CUDA graph 를 캡처하는 단위와 시점은? 왜 배치 크기별로 따로 잡나요?",
    "Q2: piecewise compilation 은 무엇을 나누고 왜 attention 을 경계로 삼나요?",
    "Q3: optimization level(-O) 은 무엇을 켜고 끄나요?",
    "Q4: DBO(dual batch overlap) 는 무엇을 겹치나요?",
    "Follow-up: 컴파일 캐시가 깨지면 기동이 왜 느려지나요?"
   ],
   "md": "> ENGINE · vllm · T2  \n> 원리 → theory/gpu/cuda_basics.md\n\n## Q1: vLLM 이 CUDA graph 를 캡처하는 단위와 시점은? 왜 배치 크기별로 따로 잡나요?\n\n**30초.** decode 스텝 전체(또는 attention 을 뺀 조각)를 배치 크기 버킷(1·2·4·8·16...·max)별로 기동 시 캡처한다.\nCUDA graph 는 텐서 모양이 고정이라 배치마다 다른 그래프가 필요하다.\n\n실제 배치가 버킷 사이면 큰 쪽으로 패딩해 재생한다.\n캡처는 더미 입력으로 forward 를 한 번 돌리며 하고, 기동 시간과 GPU 메모리(그래프마다 activation 버퍼)를 먹는다.\n`-O3` 나 `cudagraph_mode` 로 FULL(전체) · PIECEWISE(attention 밖만) · NONE 을 고른다.\n`CudagraphDispatcher` (`v1/cudagraph_dispatcher.py`) 가 런타임에 배치 크기를 보고 어느 그래프를 재생할지 정한다.\n\n## Q2: piecewise compilation 은 무엇을 나누고 왜 attention 을 경계로 삼나요?\n\n**30초.** 모델 그래프를 attention 연산을 경계로 잘라 attention 밖은 torch.compile 로 컴파일·CUDA graph 캡처하고, attention 은 그대로 둔다.\nattention 은 시퀀스 길이·블록 테이블이 매 스텝 바뀌어 고정 모양 그래프에 안 들어가기 때문이다.\n\nattention 커널은 그 자체가 이미 최적화된 외부 커널(FA/FlashInfer)이라 컴파일 이득도 없다.\n그 사이의 matmul·norm·activation 은 모양이 배치에만 의존해 컴파일과 캡처가 잘 먹는다.\n`docs/design/torch_compile.md` 와 `cuda_graphs.md`.\nV1 의 기본 모드이고, FULL 모드는 attention 백엔드가 지원할 때만 된다.\n\n## Q3: optimization level(-O) 은 무엇을 켜고 끄나요?\n\n**30초.** -O0 은 컴파일 없음, -O1 은 torch.compile 만, -O2 는 + 커스텀 fusion 패스, -O3 은 + CUDA graph(piecewise) 까지다.\n\n| 레벨 | 켜는 것 | 비용 |\n|---|---|---|\n| O0 | 없음 (eager) | 기동 빠름, 디버깅용 |\n| O1 | torch.compile (inductor) | 기동 수십 초, 컴파일 캐시 |\n| O2 | + vLLM 커스텀 fusion 패스 (RMSNorm+quant 등) | 더 긴 컴파일 |\n| O3 | + CUDA graph 캡처 | 기동 수 분, GPU 메모리 |\n\n`docs/design/optimization_levels.md`.\n프로덕션은 O3, 코드 고치며 테스트할 땐 O0 이 빠르다.\n\n## Q4: DBO(dual batch overlap) 는 무엇을 겹치나요?\n\n**30초.** 한 스텝의 배치를 둘로 쪼개 micro-batch A 가 통신(all-to-all · all-reduce) 하는 동안 B 가 계산하도록 겹친다.\nMoE 의 all-to-all 이 GPU 를 세우는 시간을 숨긴다.\n\nEP 에서 레이어마다 dispatch · combine 통신이 있고 그동안 GPU 연산 유닛이 논다.\n두 micro-batch 를 번갈아 돌리면 한쪽 통신이 다른 쪽 계산과 겹친다.\nDeepSeek 이 학습에서 쓴 기법을 추론에 적용한 것이고 ModelRunner V2 위에 구현됐다(v0.30).\n`docs/design/dbo.md`.\n배치가 충분히 커야 둘로 나눠도 각각 효율이 나온다.\n\n## Follow-up: 컴파일 캐시가 깨지면 기동이 왜 느려지나요?\n\n**30초.** torch.compile 결과(inductor 커널)와 CUDA graph 는 캐시 디렉토리에 저장되는데, 그게 없거나 키(모델·설정·vLLM 버전)가 바뀌면 처음부터 다시 컴파일·캡처해 기동이 수 분 는다.\n\n캐시 위치는 `~/.cache/vllm/torch_compile_cache/`.\n컨테이너를 새로 띄우면 캐시가 없어 매번 느리고, 그래서 v0.30 의 Fast Start(weight cache daemon) 와 v0.31 의 CRIU 스냅샷이 기동 시간을 공격한다.\n\"같은 모델인데 이번만 기동이 느리다\" 면 캐시 미스를 먼저 의심한다.\n\n",

   "qs": [
    "Q1: GPU KV 캐시가 꽉 차면 어디로 내리나요? kv_offload/ 가 다루는 티어는?",
    "Q2: OffloadingConnector 와 SimpleCPUOffload 의 차이는?",
    "Q3: HiSparse(host tier for sparse MLA, v0.30) 는 무엇을 호스트에 두나요?",
    "Q4: offloading back-pressure 감지(v0.31) 는 어떤 상황을 막나요?"
   ],
   "md": "> ENGINE · vllm · T2  \n> 원리 → theory/inference/kv_cache.md\n\n## Q1: GPU KV 캐시가 꽉 차면 어디로 내리나요? kv_offload/ 가 다루는 티어는?\n\n**30초.** CPU 메모리(pinned host) 로 내리고, 그다음은 로컬 디스크나 외부 스토어(LMCache · Mooncake) 다.\n`v1/kv_offload/` 는 그 티어와 이동 정책(어느 블록을 언제 내리고 올리나) 을 담당한다.\n\nGPU 블록이 free 될 때 바로 버리지 않고 CPU 로 복사해두면, 같은 접두사가 다시 오면 prefill 대신 PCIe 로 올린다.\nPCIe 64 GB/s 로 2 GB KV 는 30 ms, prefill 로 다시 만들면 7B 4K 가 수십 ms 라 비슷하지만 긴 컨텍스트나 큰 모델에서는 올리는 쪽이 싸다.\nLRU 로 어느 블록을 내릴지 정하고, 올릴 때는 프리픽스 캐시처럼 블록 해시로 찾는다.\n`docs/features/kv_offloading_usage.md`.\n\n## Q2: OffloadingConnector 와 SimpleCPUOffload 의 차이는?\n\n**30초.** `OffloadingConnector` 는 KV connector 인터페이스 위에 구현된 범용 오프로드(백엔드 교체 가능, 비동기), `SimpleCPUOffloadConnector` 는 CPU 한 티어만 단순하게 붙인 경량 버전이다.\n\nOffloadingConnector 는 스케줄러 쪽에서 \"이 블록은 CPU 에 있으니 외부 토큰\" 으로 보고하고 worker 쪽에서 비동기 복사를 돈다.\nSimpleCPUOffload 는 설정이 적고 디버깅이 쉽다.\n둘 다 `kv_connector/v1/` 아래에 있고 `--kv-transfer-config` 로 고른다.\nP/D 전송(NIXL) 과 오프로드(CPU) 를 둘 다 쓰려면 MultiConnector 로 묶는다.\n\n## Q3: HiSparse(host tier for sparse MLA, v0.30) 는 무엇을 호스트에 두나요?\n\n**30초.** sparse MLA 모델의 KV 중 \"지금 스텝에 안 보는 토큰의 latent\" 를 호스트 메모리에 두고, 인덱서가 고른 토큰만 GPU 로 가져온다.\n\nsparse attention 은 매 스텝 전체 KV 중 k 개만 읽는다.\n그러면 나머지는 GPU 에 있을 필요가 없다.\nHiSparse(v0.30) 가 그 나머지를 호스트에 두고 GPU 압력이 올라가면 페이지를 내린다.\nGPU KV 예산이 컨텍스트 길이에서 풀려 128K 이상 컨텍스트를 작은 GPU 메모리로 서빙할 수 있다.\nv0.31 에서 MTP·chunked prefill 과의 조합을 고쳤다.\n\n## Q4: offloading back-pressure 감지(v0.31) 는 어떤 상황을 막나요?\n\n**30초.** 내리는 속도보다 free 가 빨라 CPU 쪽 복사가 밀리면, 큐가 무한히 쌓여 메모리가 터지거나 블록이 늦게 해제돼 스케줄러가 멈추는 상황을 막는다.\n\n오프로드는 비동기라 \"내리기 완료\" 를 기다리지 않고 블록을 재사용하려 한다.\nPCIe 가 포화하면 완료가 늦고, 그 사이 free 요청이 쌓인다.\nback-pressure 감지는 미완료 전송 수를 보고 한계를 넘으면 새 오프로드를 건너뛰거나 스케줄러를 늦춘다.\nv0.31 'Large-scale serving' 항목.\n\n",

   "md": "> ENGINE · vllm · T2  \n> 원리 → theory/inference/autoregressive_decoding.md\n\n## Q1: v1/metrics 가 내보내는 핵심 지표(TTFT · TPOT · queue time · KV usage) 는 어디서 측정되나요?\n\n**30초.** TTFT·TPOT 는 요청 객체의 타임스탬프(도착·첫 스케줄·첫 토큰·토큰마다) 차이로 AsyncLLM 쪽에서, queue time 은 스케줄러의 waiting 체류 시간으로, KV usage 는 KVCacheManager 의 사용 블록 / 전체 블록으로 EngineCore 에서 측정된다.\n\n`v1/metrics/` 에 `StatLoggerBase` 와 Prometheus 로거가 있다.\nEngineCore 가 스텝마다 `SchedulerStats`(running·waiting 수, KV 사용률, 프리픽스 캐시 히트) 를 출력에 실어 보낸다.\nAsyncLLM 이 요청별 `RequestStateStats` 로 지연 분포를 만든다.\n지표 이름은 `vllm:time_to_first_token_seconds`, `vllm:time_per_output_token_seconds`, `vllm:kv_cache_usage_perc` 등.\n`docs/design/metrics.md`.\n\n## Q2: Prometheus 로 노출되는 경로와 per-request metrics 의 차이는?\n\n**30초.** Prometheus 는 `/metrics` 엔드포인트에 집계된 히스토그램·게이지(시스템 전체), per-request metrics 는 응답 본문에 그 요청의 수치(TTFT, 토큰 수, 캐시 히트 토큰 등) 를 실어주는 것이다.\n\nPrometheus 는 운영자가 대시보드로 보는 용도라 요청 하나를 추적할 수 없다.\nper-request(`docs/features/per_request_metrics.md`) 는 클라이언트나 라우터가 \"이 요청이 왜 느렸나\" 를 볼 수 있게 한다.\nDynamo 의 admission overlap 노출(#12303)이 같은 방향이다.\n\n## Q3: KV connector 전용 metrics 는 무엇을 재나요?\n\n**30초.** 전송한 블록 수·바이트, 전송 소요 시간, 실패 횟수를 커넥터 종류별로 센다.\nP/D 분리에서 \"KV 이동이 병목인가\" 를 보는 지표다.\n\n`kv_connector/v1/metrics.py` 가 공통 인터페이스고 NIXL 커넥터가 전송 통계를 넣는다.\n53484 는 이 metrics 가 커넥터마다 제각각이라 공통 구조로 일반화하자는 이슈였다.\n48224 는 \"KV 처리량(bytes/s)\" 지표를 추가하는 것이었다.\n둘 다 작성자가 그 코드의 주인이어서 손대지 않았다.\n\n## Follow-up: 'KV 전송 처리량' 을 지표로 만든다면 분자·분모를 무엇으로 잡나요?\n\n**30초.** 분자는 \"전송 완료된 KV 바이트\", 분모는 \"전송에 쓴 시간\" 인데, 시간을 벽시계(wall clock)로 잡으면 동시 전송이 겹쳐 과대평가되고, 전송별 시간 합으로 잡으면 겹침이 과소평가된다.\n\n48224 에서 걸린 지점이 이것이다.\n요청 단위로 (바이트 / 그 요청의 전송 시간) 을 내고 분포로 보는 것과, 창(1초) 안의 총 바이트로 시스템 처리량을 내는 것은 다른 지표다.\n\"무엇을 세는지 한 문장으로 못 쓰면 잘못된 계측\" 이 여기서도 적용된다.\n\n---\n\n### 손댄 곳\n\n- 48224 KV throughput metric · 53484 connector metrics 일반화 · vllm-study/01-issues/\n",

   "qs": [
    "Q1: FP8 · NVFP4 · AWQ · GPTQ · GGUF 는 vLLM 에서 각각 어떤 커널 경로를 타나요?",
    "Q2: quantized KV cache(fp8) 는 어디서 변환이 일어나나요?",
    "Q3: online quantization 은 무엇을 런타임에 하나요?",
    "Q4: Fast Start(weight cache daemon, ipc_cache) 는 어떤 재시작 비용을 없애나요?"
   ],
   "md": "> ENGINE · vllm · T2  \n> 원리 → theory/inference/quantization.md\n\n## Q1: FP8 · NVFP4 · AWQ · GPTQ · GGUF 는 vLLM 에서 각각 어떤 커널 경로를 타나요?\n\n**30초.** FP8 은 cutlass/cuBLAS FP8 GEMM, NVFP4 는 Blackwell 전용 CuTeDSL 커널, AWQ/GPTQ 는 Marlin(INT4 weight-only dequant+GEMM 융합) 커널, GGUF 는 llama.cpp 호환 dequant 커널이다.\n\n| 포맷 | 커널 | 특징 |\n|---|---|---|\n| FP8 (W8A8) | cutlass FP8 GEMM, per-tensor/per-channel scale | Hopper 이상, 2 배 속도, prefill 에 유리 |\n| NVFP4 (W4A16/W4A4) | CuTeDSL, SM100/103 기본 (v0.30) | Blackwell 전용 |\n| AWQ / GPTQ (W4A16) | Marlin | dequant 를 GEMM 안에 융합, decode 에 유리 |\n| compressed-tensors (llm-compressor) | 포맷에 따라 위 커널 선택 | HF 허브의 표준 양자화 포맷 |\n| GGUF | 전용 dequant | llama.cpp 모델 호환 |\n| bitsandbytes | bnb 커널 | QLoRA 모델 로드 |\n\n`docs/features/quantization/` 에 포맷별 문서.\n모델 config 의 `quantization_config` 를 읽어 자동 선택한다.\n\n## Q2: quantized KV cache(fp8) 는 어디서 변환이 일어나나요?\n\n**30초.** attention 커널이 KV 를 쓸 때 FP8 로 캐스팅하고 스케일을 따로 저장, 읽을 때 스케일을 곱해 복원한다.\n변환은 attention 백엔드 안에서 일어난다.\n\n`--kv-cache-dtype fp8` 로 켠다.\n스케일은 레이어별로 모델 체크포인트에 있으면 쓰고(캘리브레이션된 값), 없으면 1.0 이라 정밀도가 떨어진다.\nFlashInfer 가 FP8 KV 를 가장 넓게 지원한다.\nKV 메모리가 반이 되어 같은 GPU 에서 배치나 컨텍스트가 2 배 늘고, decode 의 KV 읽기도 반이다.\n`docs/features/quantization/quantized_kvcache.md`.\n\n## Q3: online quantization 은 무엇을 런타임에 하나요?\n\n**30초.** 체크포인트는 BF16 인데 로드하면서 FP8 등으로 양자화하는 것이다.\n미리 양자화된 모델을 받을 수 없을 때 쓴다.\n\n`--quantization fp8` 처럼 지정하면 가중치를 올리는 시점에 변환한다.\n캘리브레이션 데이터가 없으니 per-tensor 스케일을 가중치 통계로만 잡아 오프라인 양자화보다 정밀도가 낮다.\nv0.30 의 \"targeted online quantization\" 은 특정 레이어만 고르는 옵션이다.\n`docs/features/quantization/online.md`.\n\n## Q4: Fast Start(weight cache daemon, ipc_cache) 는 어떤 재시작 비용을 없애나요?\n\n**30초.** 양자화된 가중치를 GPU 메모리에 한 번 올려두는 데몬을 두고, 엔진이 재시작할 때 디스크 로드·양자화를 건너뛰고 그 메모리를 IPC 로 받는다.\n\n재시작 비용은 (1) 디스크에서 체크포인트 읽기, (2) 온라인 양자화, (3) 컴파일·CUDA graph 캡처다.\nFast Start(`vllm preload`, `--load-format ipc_cache`) 는 1·2 를 없앤다.\nv0.31 의 CRIU 스냅샷은 프로세스 전체를 얼려 3 까지 없애려는 실험이다.\n오토스케일로 레플리카를 자주 띄우는 환경(Dynamo 의 ModelExpress 와 같은 문제)에서 기동 시간이 비용이라 이 기능들이 나왔다.\n\n",

   "qs": [
    "Q1: v1/spec_decode 가 지원하는 방식(ngram · EAGLE3 · MTP · DFlash · draft model) 은 draft 를 각각 어디서 얻나요?",
    "Q2: rejection sampler 는 어디에 끼고 무엇을 보장하나요?",
    "Q3: per-request acceptance stats 는 무엇을 재고 어디서 보나요?",
    "Follow-up: spec decode 가 PP 와 함께 돌 때 생기는 어려움은?"
   ],
   "md": "> ENGINE · vllm · T2  \n> 원리 → theory/inference/speculative_decoding.md\n\n## Q1: v1/spec_decode 가 지원하는 방식(ngram · EAGLE3 · MTP · DFlash · draft model) 은 draft 를 각각 어디서 얻나요?\n\n**30초.** ngram 은 지금까지의 토큰 열에서 패턴을 찾아 그 다음을 draft 로, EAGLE3 는 target 의 hidden state 를 받는 작은 트랜스포머에서, MTP 는 DeepSeek 모델에 내장된 다음-토큰 head 에서, DFlash 는 또 다른 head 기반 방식, draft model 은 별도 작은 모델에서 가져온다.\n\n| 방식 | draft 출처 | 메모리 | 설정 |\n|---|---|---|---|\n| ngram | 프롬프트·출력 안 패턴 매칭 | 없음 | `method: ngram`, 반복 많은 입력에 |\n| EAGLE / EAGLE3 | hidden state → 소형 트랜스포머 head | 수백 MB | 모델별 학습된 head 필요 |\n| MTP | 모델 내장 multi-token head | 모델에 포함 | DeepSeek-V3/R1 |\n| DFlash / DSpark | 학습된 draft head 변형 | 소형 | v0.30-31 추가 |\n| draft model | 별도 소형 LLM | 수 GB | 가장 범용, 가장 무거움 |\n\n전부 `v1/spec_decode/` 에 있고 `--speculative-config` 로 고른다.\n\n## Q2: rejection sampler 는 어디에 끼고 무엇을 보장하나요?\n\n**30초.** target forward 가 각 draft 위치의 확률을 내면, rejection sampler(`v1/sample/rejection_sampler.py`) 가 draft 확률과 비교해 앞에서부터 받아들이거나 거절하고, 첫 거절 자리에서 보정 분포로 토큰을 뽑는다.\n결과 분포가 target 과 정확히 같다는 걸 보장한다.\n\ngreedy 면 \"같으면 수락\" 으로 단순화된다.\n샘플링이면 min(1, p/q) 확률로 받고 거절 시 (p - q)⁺ 정규화 분포에서 뽑는다.\n배치 안의 요청마다 받아들인 길이가 달라 그다음 스텝의 블록 할당·위치가 가변이다.\n스케줄러가 \"이 요청은 이번 스텝 k+1 토큰 진행\" 을 받아 KV 블록을 그만큼 확정한다.\n\n## Q3: per-request acceptance stats 는 무엇을 재고 어디서 보나요?\n\n**30초.** 요청마다 \"draft 몇 개 제안, 몇 개 수락\" 을 세어 acceptance rate 와 스텝당 평균 토큰을 낸다.\nPrometheus 지표와 요청 응답의 metrics 필드로 본다.\n\n전체 평균 α 는 워크로드마다 다르고 요청마다도 다르다.\n코드 요청은 높고 창작은 낮다.\nper-request 통계(v0.29)가 있어야 \"spec decode 가 이 트래픽에 이득인가\" 를 운영 중에 판단할 수 있다.\nα 가 낮은데 켜두면 draft 비용만 쓴다.\n\n## Follow-up: spec decode 가 PP 와 함께 돌 때 생기는 어려움은?\n\n**30초.** draft 는 마지막 stage 의 hidden state 가 필요한데 PP 에서는 그게 마지막 GPU 에만 있어서, draft 를 생성하고 검증 결과를 첫 stage 로 돌려보내는 왕복이 파이프라인을 끊는다.\n\nPP 의 장점은 stage 들이 서로 다른 micro-batch 를 동시에 처리하는 것인데, spec decode 는 \"검증 결과를 보고 다음 입력을 정하는\" 의존성을 만든다.\nv0.30 의 \"MTP·EAGLE3 under PP\" 가 그 의존성을 파이프라인 안에 넣은 작업이다.\nTP 에서는 모든 랭크가 같은 hidden 을 가져서 문제가 없다.\n\n",

   "qs": [
    "Q1: v1/fault_tolerance 는 어떤 장애를 어떻게 감지·복구하나요?",
    "Q2: RL 루프에서 학습 쪽 가중치를 vLLM 에 어떻게 밀어넣나요? (sharded_rdt 등)",
    "Q3: 가중치 동기화 중 서빙은 어떻게 되나요?"
   ],
   "md": "> ENGINE · vllm · T3  \n> 원리 → theory/training/alignment_rlhf.md\n\n## Q1: v1/fault_tolerance 는 어떤 장애를 어떻게 감지·복구하나요?\n\n**30초.** DP 환경에서 엔진 하나(또는 그 안의 worker) 가 죽었을 때 다른 엔진이 계속 서빙하고, 죽은 엔진의 요청을 실패로 돌려주거나 재스케줄하며, 엔진을 다시 띄우는 것을 다룬다.\n\n`v1/fault_tolerance/` 가 DP coordinator 와 연동해 랭크 상태를 추적한다.\nTP 안에서 worker 하나가 죽으면 그 엔진 전체가 죽는다(NCCL 통신이 끊김).\n그래서 단위는 엔진이고, DP 가 있어야 복구가 의미 있다.\nDynamo 의 request migration 은 이 위에서 KV 까지 옮기는 상위 기능이다.\n\n## Q2: RL 루프에서 학습 쪽 가중치를 vLLM 에 어떻게 밀어넣나요? (sharded_rdt 등)\n\n**30초.** 학습 프로세스가 `collective_rpc(\"update_weights\", ...)` 로 모든 worker 에 가중치 로드를 지시하고, 데이터는 CUDA IPC(같은 노드) 나 NCCL broadcast · P2P 전송(다른 노드) 으로 넘긴다.\n`sharded_rdt`(v0.29) 는 샤딩된 체크포인트를 P2P 로 직접 보내는 새 백엔드다.\n\n가중치 전체(14 GB) 를 매 RL 스텝 옮겨야 해서 전송 경로가 RL 처리량을 정한다.\n학습이 FSDP 로 샤딩되어 있으면 vLLM 의 TP 레이아웃으로 다시 맞춰야 하고, `sharded_rdt` 가 그 변환을 포함한다.\nsparse update(바뀐 부분만) 도 v0.29 에 들어왔다.\n\n## Q3: 가중치 동기화 중 서빙은 어떻게 되나요?\n\n**30초.** 보통 서빙을 멈춘다.\nRL 은 \"생성 → 가중치 갱신 → 생성\" 이 단계적이라 갱신 중 생성 요청이 없다.\nsleep mode 로 KV 를 비우고 가중치만 바꾼 뒤 wake_up 한다.\n\n온라인 서빙 중 무중단 갱신은 별도 문제라 보통 새 인스턴스를 띄우고 트래픽을 옮긴다(blue-green).\nDynamo 의 ModelExpress 가 그 \"새 인스턴스에 가중치를 빨리 넣기\" 를 NIXL 로 한다.\n\n",

   "md": "> ENGINE · vllm · T3  \n> 원리 → theory/inference/kv_cache.md\n\n## Q1: gpu_memory_utilization 은 무엇의 비율인가요? 가중치·activation·KV 가 어떻게 나뉘나요?\n\n**30초.** GPU 전체 메모리 중 vLLM 이 쓸 비율(기본 0.9)이다.\n그 안에서 가중치가 고정으로 빠지고, profile run 으로 activation 최대치를 재서 빼고, 남는 전부가 KV 캐시 블록이 된다.\n\n```\nGPU 80 GB × 0.9 = 72 GB 예산\n  - 가중치 14 GB (7B BF16)\n  - activation 피크 (profile run 측정, 수 GB)\n  - CUDA graph 버퍼\n  = KV 캐시 약 55 GB → 블록 수\n```\n\n0.9 를 넘기면 다른 프로세스(디스플레이·모니터링)와 충돌하고, 낮추면 KV 가 준다.\n같은 GPU 에 두 인스턴스를 띄우려면 둘의 합이 1 미만이어야 한다.\n\n## Q2: profile run 은 무엇을 재서 KV 블록 수를 정하나요?\n\n**30초.** 기동 시 `max_num_batched_tokens` 토큰짜리 더미 배치를 forward 해 activation 피크 메모리를 실측하고, \"예산 - 가중치 - 그 피크\" 를 KV 블록 수로 바꾼다.\n\n이론으로 계산하지 않고 실제로 한 번 돌려 재는 이유는 attention 백엔드·fusion·dtype 마다 중간 버퍼가 달라서다.\n그래서 `max_num_batched_tokens` 를 키우면 KV 가 줄고, 블록 수가 기동 로그에 \"# GPU blocks: N\" 으로 찍힌다.\nN × block_size(16) 가 동시에 담을 수 있는 총 토큰이다.\n\n## Q3: 같은 GPU 에 두 인스턴스를 동시에 띄우면 왜 KV 가 0 이 되나요?\n\n**30초.** vLLM 이 KV 예산을 \"profile run 전후의 장치 전체 빈 메모리 변화\" 로 재는데, 옆 인스턴스가 그 사이에 가중치를 올리면 그걸 자기 activation 으로 오해해 KV 가 0 이 된다.\n\n9/22 에 P 와 D 를 한 GPU 에 동시에 띄우자 둘 다 `No available memory for the cache blocks` 로 죽었다.\nP 가 `/v1/models` 에 응답한 뒤 D 를 띄우면 정상이다.\n단독으로는 같은 설정이 멀쩡히 떠서 헷갈린다.\n`gpu_memory_utilization` 을 각각 0.4 로 줘도 동시 기동은 안 되고 순차가 답이다. ⭐️\n\n## Q4: sleep mode 는 무엇을 내리고 무엇을 남기나요?\n\n**30초.** level 1 은 가중치를 CPU 로 내리고 KV 캐시를 버려 GPU 를 거의 비우되 다시 올리면 빠르고, level 2 는 가중치까지 버려 재로드가 필요하다.\n\nRL 학습처럼 \"생성 → 학습 → 생성\" 을 반복할 때 생성 안 하는 동안 GPU 를 학습에 내주는 용도다.\n`sleep()` / `wake_up()` API.\n오토스케일에서 레플리카를 완전히 죽이지 않고 잠깐 비우는 데도 쓴다.\n`docs/features/sleep_mode.md`.\n\n---\n\n### 손댄 곳\n\n- 9/22 P/D 한 GPU 동시 기동 → 'No available memory for the cache blocks': 옆 인스턴스 가중치 로드를 자기 비-torch 사용량으로 셈. 순차 기동으로 해결 · vllm-study/02-env/pod-setup.md\n",

   "qs": [
    "Q1: 멀티모달 입력은 어디서 전처리되고 encoder cache 는 무엇을 캐시하나요?",
    "Q2: disaggregated encoder(EC connector) 는 무엇을 분리하나요?",
    "Q3: multi-LoRA 서빙에서 punica 커널은 무엇을 한 번에 처리하나요?",
    "Follow-up: LoRA resolver plugin 은 어디서 어댑터를 받아오나요?"
   ],
   "md": "> ENGINE · vllm · T3  \n> 원리 → theory/training/finetuning.md\n\n## Q1: 멀티모달 입력은 어디서 전처리되고 encoder cache 는 무엇을 캐시하나요?\n\n**30초.** 이미지는 APIServer 쪽 `InputProcessor` 에서 전처리(리사이즈·패치 분할)되고 해시가 계산되며, encoder cache 는 비전 인코더 출력(이미지 임베딩) 을 요청이 끝날 때까지 GPU 에 들고 있어 chunked prefill 로 조각나도 다시 인코딩하지 않게 한다.\n\n`EncoderCacheManager`(`v1/core/encoder_cache_manager.py`) 가 예산을 관리한다.\n인코더는 LLM forward 와 별도로 스케줄되고, 그 출력이 텍스트 토큰 사이 플레이스홀더 자리에 끼워진다.\n`docs/design/mm_processing.md`.\n\n## Q2: disaggregated encoder(EC connector) 는 무엇을 분리하나요?\n\n**30초.** 비전 인코더를 LLM 과 다른 GPU(또는 인스턴스) 에서 돌리고 임베딩만 전송한다.\nEC(encoder cache) connector 가 그 전송을 맡는다.\n\nP/D 분리와 같은 발상이다.\n인코더는 연산 모양이 다르고 이미지 트래픽은 텍스트와 비율이 다르다.\nDynamo 의 E/P/D 가 이것을 오케스트레이션 층에서 하고, vLLM 의 `disagg_encoder.md` · `ec_cpu_connector.md` 가 엔진 층 구현이다.\n\n## Q3: multi-LoRA 서빙에서 punica 커널은 무엇을 한 번에 처리하나요?\n\n**30초.** 배치 안 요청들이 서로 다른 LoRA 어댑터를 쓸 때, 요청별 A·B 행렬을 골라 x·A·B 를 한 커널에서 처리한다(SGMV: segmented gather matrix-vector).\n\n어댑터마다 커널을 따로 띄우면 어댑터 수만큼 launch 가 늘고 작은 행렬곱이 비효율이다.\npunica 커널은 어댑터 ID 로 가중치를 gather 해 세그먼트별로 묶어 한 번에 돈다.\nbase 모델 matmul 은 배치 전체 한 번, LoRA 부분만 이 커널이다.\n`docs/features/lora.md`.\n\n## Follow-up: LoRA resolver plugin 은 어디서 어댑터를 받아오나요?\n\n**30초.** 요청에 어댑터 이름이 왔는데 로컬에 없을 때 외부(HF 허브 · S3 · 파일시스템) 에서 받아오는 플러그인이다.\n\n`LoRAResolver` 인터페이스를 구현해 등록하면 vLLM 이 미등록 어댑터 요청을 받을 때 호출한다.\n동적으로 어댑터를 늘리는 멀티 테넌트 서빙에서 쓴다.\n`docs/design/lora_resolver_plugins.md`.\n\n",

   "qs": [
    "Q1: Sampler 가 batch-sharded 로 바뀐 이유는?",
    "Q2: custom logits processor 는 어디에 등록하고 어느 시점에 호출되나요?",
    "Q3: structured_output(xgrammar 등) 은 grammar 를 어떻게 logits mask 로 바꾸나요?",
    "Q4: reasoning parser 와 tool calling parser 는 출력을 어떻게 가르나요?",
    "Follow-up: watermarking(Gumbel-max, v0.30) 은 샘플링의 어디에 개입하나요?"
   ],
   "md": "> ENGINE · vllm · T3  \n> 원리 → theory/inference/sampling_decoding.md\n\n## Q1: Sampler 가 batch-sharded 로 바뀐 이유는?\n\n**30초.** 배치 안 요청마다 temperature · top-p · penalty 가 다른데, 요청별로 따로 돌리면 커널 수백 개가 되어 느리다.\nbatch-sharded 는 같은 설정끼리 묶어 한 커널로 돌리고, 전부 greedy 면 argmax 하나로 끝낸다.\n\n샘플링은 vocab(128K) × 배치 크기 텐서를 다루어 작지 않다.\n요청별 파라미터를 텐서로 모아 벡터화된 한 패스로 처리하는 게 V2 Sampler 다.\n`v1/sample/sampler.py`.\n\n## Q2: custom logits processor 는 어디에 등록하고 어느 시점에 호출되나요?\n\n**30초.** `--logits-processors` 로 클래스 경로를 등록하면 Sampler 가 logits 를 낸 직후, temperature 적용 전에 호출한다.\n요청마다 켜고 끌 수 있고 배치 단위로 한 번 호출된다.\n\nV1 의 logits processor 는 배치 전체 텐서를 받아 처리하는 인터페이스다(`v1/sample/logits_processor/`).\n요청이 추가·제거될 때 상태를 옮기는 `update_state` 훅이 있다.\n내장은 min_tokens · logit_bias · bad_words 고, 커스텀은 `docs/features/custom_logitsprocs.md`.\n\n## Q3: structured_output(xgrammar 등) 은 grammar 를 어떻게 logits mask 로 바꾸나요?\n\n**30초.** grammar(JSON 스키마 · 정규식 · EBNF) 를 컴파일해 상태 기계로 만들고, 매 스텝 현재 상태에서 허용되는 토큰 집합을 vocab 크기 bitmask 로 만들어 나머지 logits 에 -∞ 를 더한다.\n\nxgrammar 가 기본 백엔드고 guidance · outlines 도 된다.\n토큰이 문법 경계를 넘나드는 문제(`\"abc` 가 한 토큰) 를 바이트 단위 오토마톤으로 푼다.\n컴파일은 요청 시작 때 한 번(캐시됨), mask 계산은 스텝마다 CPU 에서 하고 GPU 로 올린다.\n`v1/structured_output/`, `docs/features/structured_outputs.md`.\n\n## Q4: reasoning parser 와 tool calling parser 는 출력을 어떻게 가르나요?\n\n**30초.** reasoning parser 는 `<think>...<\/think>` 같은 구분자로 추론 부분과 답 부분을 나눠 응답의 `reasoning_content` 와 `content` 필드로 보내고, tool calling parser 는 모델이 낸 함수 호출 텍스트(모델마다 형식이 다름)를 OpenAI 형식의 `tool_calls` JSON 으로 바꾼다.\n\n둘 다 생성 토큰을 스트리밍으로 받으며 상태 기계로 파싱한다.\n모델마다 파서가 따로 있다(`--reasoning-parser deepseek_r1`, `--tool-call-parser hermes`).\nstructured output 과 합치면 tool 인자를 스키마 강제로 낼 수 있다.\n\n## Follow-up: watermarking(Gumbel-max, v0.30) 은 샘플링의 어디에 개입하나요?\n\n**30초.** 샘플링 단계에서 각 토큰의 확률에 비밀 키로 만든 의사난수(Gumbel noise)를 더해 뽑는다.\n분포는 거의 그대로인데 키를 아는 사람은 생성된 텍스트에서 그 패턴을 통계적으로 검출할 수 있다.\n\nGumbel-max 트릭은 softmax 샘플링과 동치라 품질 손실이 없다.\nspec decode 와 함께 돌 수 있게 구현됐다(v0.30).\n`v1/watermarking/`.\n\n",

   "qs": [
    "Q1: bias 와 variance 를 과적합·과소적합과 연결해 설명해보세요.",
    "Q2: L1 과 L2 정규화는 가중치를 각각 어떻게 다르게 만드나요?",
    "Q3: dropout 은 왜 과적합을 줄이나요? 추론 때는 어떻게 하나요?",
    "Q4: early stopping 은 무엇을 보고 멈추나요?"
   ],
   "md": "> THEORY · fundamentals · T3\n\n## Q1: bias 와 variance 를 과적합·과소적합과 연결해 설명해보세요.\n\n**30초.** bias 는 모델이 단순해서 패턴을 못 잡는 오차(과소적합), variance 는 모델이 복잡해서 학습 데이터의 잡음까지 외우는 오차(과적합) 다.\n둘의 합이 일반화 오차고, 하나를 줄이면 다른 게 는다.\n\n학습 loss 는 낮은데 검증 loss 가 높으면 variance(과적합), 둘 다 높으면 bias(과소적합).\n처방이 반대다.\n과적합은 데이터 늘리기·정규화·모델 줄이기, 과소적합은 모델 키우기·더 오래 학습.\nLLM 은 데이터가 모델보다 커서 과적합이 드물고, fine-tuning 때 작은 데이터로 과적합이 난다.\n\n## Q2: L1 과 L2 정규화는 가중치를 각각 어떻게 다르게 만드나요?\n\n**30초.** L2 는 가중치 제곱 합에 패널티를 줘 전체를 조금씩 작게 만들고, L1 은 절댓값 합에 패널티를 줘 일부를 정확히 0 으로 만든다(sparse).\n\nL2 의 gradient 는 w 에 비례해 큰 가중치를 더 많이 줄인다.\nL1 의 gradient 는 부호만 있어 작은 가중치도 같은 속도로 0 을 향한다.\nAdamW 의 weight decay 가 L2 다.\nL1 은 feature selection 에 쓰이고 딥러닝에서는 드물다.\n\n## Q3: dropout 은 왜 과적합을 줄이나요? 추론 때는 어떻게 하나요?\n\n**30초.** 학습 때 뉴런을 확률 p 로 무작위로 끄면 특정 뉴런 조합에 의존하는 걸 막고, 매 스텝 다른 부분망을 학습하는 앙상블 효과가 난다.\n추론 때는 끄지 않고 출력을 (1-p) 로 스케일해 기대값을 맞춘다(또는 학습 때 1/(1-p) 로 미리 스케일).\n\n트랜스포머 초기엔 0.1 이 표준이었다.\n큰 LLM 사전학습은 데이터가 충분해 dropout 을 0 으로 두는 경우가 많다.\nfine-tuning 이나 작은 데이터에서는 다시 쓴다.\n\n## Q4: early stopping 은 무엇을 보고 멈추나요?\n\n**30초.** 검증 loss 를 매 epoch(또는 N 스텝) 재서, 몇 번(patience) 연속 개선이 없으면 멈추고 가장 좋았던 체크포인트를 쓴다.\n\n학습 loss 는 계속 내려가지만 검증 loss 는 어느 순간부터 오른다.\n그 지점이 과적합 시작이다.\n암묵적 정규화라 L2 없이도 비슷한 효과를 낸다.\nLLM 사전학습은 1 epoch 미만이라 안 쓰고, fine-tuning 에서 쓴다.\n\n",

var TRACKNAME = {lc:"LeetCode", cs:"CS 기초", ai:"AI 시스템", ood:"OOD"};
var ui = load(); if(!ui.track) ui.track="lc";
var root = document.getElementById("root"), study = document.getElementById("study");
var queue = [], pos = -1, flipped = false;

function load(){ try{ var r=localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return {seg:"review",cat:"all"}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ui)); }catch(e){} }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- theme ---------- */
function applyTheme(){
  var t = ui.theme;
  if(t==="dark"||t==="light") document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
}
function cycleTheme(){
  var order=["system","dark","light"], i=order.indexOf(ui.theme||"system");
  ui.theme = order[(i+1)%3]; save(); applyTheme(); render();
}

/* ---------- selection ---------- */
function cats(){ return CATS.filter(function(c){return c.track===ui.track;}); }
function catIdx(k){ for(var i=0;i<CATS.length;i++) if(CATS[i].key===k) return i; return 999; }
function tcards(){ return CARDS.filter(function(c){return c.track===ui.track;}); }
function segFilter(c){
  if(c.track!==ui.track) return false;
  if(ui.seg==="review") return c.solved && c.review>0;
  if(ui.seg==="unsolved") return !c.solved;
  return true;
}
function selected(){
  var xs = CARDS.filter(function(c){ return segFilter(c) && (ui.cat==="all"||c.cat===ui.cat); });
  function base(a,b){
    var d = catIdx(a.cat)-catIdx(b.cat); if(d) return d;
    if(ui.track==="lc"||ui.track==="ood") return (+a.num)-(+b.num);
    return String(a.diff).localeCompare(String(b.diff)) || a.title.localeCompare(b.title);
  }
  if(ui.seg==="review"){
    xs.sort(function(a,b){ return (b.review-a.review) || base(a,b); });
  }else{
    xs.sort(function(a,b){ return ((b.pri?1:0)-(a.pri?1:0)) || base(a,b); });
  }
  return xs;
}
function counts(){
  var r=0,u=0,xs=tcards();
  xs.forEach(function(c){ if(c.solved&&c.review>0) r++; if(!c.solved) u++; });
  return {review:r, all:xs.length, unsolved:u};
}

/* ---------- list ---------- */
function render(){
  var xs = selected(), k = counts(), all = tcards();
  var solved = all.filter(function(c){return c.solved;}).length;
  var themeIcon = ui.theme==="dark"?"●":ui.theme==="light"?"○":"◐";
  var isLC = ui.track==="lc";

  var h = '<div class="wrap"><div class="top">';
  h += '<div class="brand"><h1>'+esc(TRACKNAME[ui.track])+' 복습 카드</h1><span class="cnt mono">'+solved+' / '+all.length+(isLC?' 풀이':' 완료')+'</span><span class="grow"></span>';
  h += '<button class="theme" id="theme" title="테마" aria-label="테마 전환">'+themeIcon+'</button></div>';
  h += '<div class="tracks" role="tablist">';
  TRACKS.forEach(function(tr){
    var n = CARDS.filter(function(c){return c.track===tr[0] && c.solved && c.review>0;}).length;
    h += '<button class="track" role="tab" data-track="'+tr[0]+'" aria-pressed="'+(ui.track===tr[0])+'">'+tr[1]+(n?'<em>'+n+'</em>':'')+'</button>';
  });
  h += '</div>';
  h += '<div class="seg" role="tablist">';
  [["review","복습",k.review],["all","전체",k.all],["unsolved",isLC?"안 푼":"미학습",k.unsolved]].forEach(function(s){
    h += '<button role="tab" data-seg="'+s[0]+'" aria-pressed="'+(ui.seg===s[0])+'">'+s[1]+'<em>'+s[2]+'</em></button>';
  });
  h += '</div>';
  var cs = cats();
  if(cs.length>1){
    h += '<div class="chips">';
    h += '<button class="chip" data-cat="all" aria-pressed="'+(ui.cat==="all")+'">전체</button>';
    cs.forEach(function(c){
      var n = CARDS.filter(function(x){ return x.cat===c.key && segFilter(x); }).length;
      if(!n && ui.cat!==c.key) return;
      h += '<button class="chip" data-cat="'+c.key+'" aria-pressed="'+(ui.cat===c.key)+'">'+esc(c.name)+'<em>'+n+'</em></button>';
    });
    h += '</div>';
  }
  h += '</div>';

  h += '<div class="list">';
  if(!xs.length){
    h += '<div class="empty">'+(ui.seg==="review"?"복습할 카드가 없습니다.":isLC?"해당하는 문제가 없습니다.":"해당하는 카드가 없습니다.")+'</div>';
  }else if(ui.seg==="review" && ui.cat==="all"){
    // group by review level, highest first
    [3,2,1].forEach(function(lv){
      var g = xs.filter(function(c){return c.review===lv;});
      if(!g.length) return;
      h += '<div class="group"><div class="group-h">'+["","다시 보면 좋음","다시 볼 것","반드시 복습"][lv]+'<em>'+g.length+'</em></div><div class="rows">';
      g.forEach(function(c){ h += rowHTML(c); });
      h += '</div></div>';
    });
  }else{
    var cur=null;
    if(isLC && ui.seg==="unsolved" && ui.cat==="all"){
      var pa = xs.filter(function(c){return c.pri;});
      if(pa.length){
        h += '<div class="group"><div class="group-h">우선 A · 빈출인데 안 푼 것<em>'+pa.length+'</em></div><div class="rows">';
        pa.forEach(function(c){ h += rowHTML(c); });
        h += '</div></div>';
        xs = xs.filter(function(c){return !c.pri;});
      }
    }
    xs.forEach(function(c){
      if(c.cat!==cur){
        if(cur!==null) h += '</div></div>';
        cur=c.cat;
        var tot = all.filter(function(x){return x.cat===cur;}).length;
        var sv  = all.filter(function(x){return x.cat===cur && x.solved;}).length;
        h += '<div class="group"><div class="group-h">'+esc(CATNAME[cur]||cur)+'<em>'+sv+'/'+tot+'</em></div><div class="rows">';
      }
      h += rowHTML(c);
    });
    if(cur!==null) h += '</div></div>';
  }
  h += '</div></div>';
  root.innerHTML = h;
}
function rowHTML(c){
  return '<button class="row'+(c.solved?"":" unsolved")+(c.pri?" pri":"")+'" data-id="'+esc(c.id)+'" data-r="'+(c.solved?c.review:0)+'">'
    + '<span class="n">'+esc(c.num)+'</span>'
    + '<span class="t">'+esc(c.title)+'</span>'
    + '<span class="meta">'+(c.pri?'<span class="pri-badge">'+c.pri+'</span>':'')+(c.diff?'<span class="diff '+c.diff+'">'+c.diff+'</span>':'')
    + '<span class="rv" data-r="'+(c.solved?c.review:0)+'"><i></i><i></i><i></i></span></span>'
    + '</button>';
}

/* ---------- study ---------- */
var DESK = window.matchMedia("(min-width:900px)");
function drawEmpty(){
  study.innerHTML = '<div class="s-empty"><div>왼쪽에서 문제를 고르면 여기에 카드가 열립니다<br><br><kbd>←</kbd> <kbd>→</kbd> 이동 · <kbd>Space</kbd> 뒤집기 · <kbd>Esc</kbd> 닫기</div></div>';
}
function open(id){
  queue = selected();
  pos = queue.findIndex(function(c){return c.id===id;});
  if(pos<0){ queue=tcards(); pos=queue.findIndex(function(c){return c.id===id;}); }
  flipped=false;
  study.classList.add("open"); study.setAttribute("aria-hidden","false");
  if(!DESK.matches) document.body.style.overflow="hidden";
  drawStudy();
}
function close(){
  study.classList.remove("open"); study.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
  if(DESK.matches) drawEmpty();
}
function go(d){
  var n=pos+d; if(n<0||n>=queue.length) return;
  pos=n; flipped=false; drawStudy();
}
function flip(){ flipped=!flipped; study.querySelector(".card").classList.toggle("flipped",flipped); }

function noteHTML(s){
  if(!s) return "";
  var parts = String(s).split("```");
  var out = "";
  for(var i=0;i<parts.length;i++){
    var seg = parts[i];
    if(i%2===1){                                  // 펜스 안 = 코드/표
      out += '<div class="ncode">'+esc(seg.replace(/^\n/,"").replace(/\n$/,""))+'</div>';
    }else{
      var txt = seg.replace(/^\n/,"").replace(/\n$/,"");
      if(txt.trim()) out += '<div class="p">'+esc(txt)+'</div>';
    }
  }
  return out;
}
var MDCACHE = {};
function mdHTML(c){
  if(MDCACHE[c.id]) return MDCACHE[c.id];
  var out;
  if(window.marked && marked.parse){
    try{ out = marked.parse(c.md||"", {gfm:true, breaks:false}); }catch(e){ out = null; }
  }
  if(!out) out = noteHTML(c.md||"");
  out = out.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');
  MDCACHE[c.id] = out; return out;
}
function drawStudy(){
  var c = queue[pos]; if(!c) return;
  if(c.track!=="lc"){ drawStudyMD(c); return; }
  var r = c.solved ? c.review : 0;
  var tags = (c.tags||[]).map(function(t){
    return '<span class="tag">'+({A:"Amazon30d",B:"Blind75",N:"NC150"}[t]||t)+'</span>';
  }).join("");
  var front = '<div class="face front">'
    + '<div class="f-body">'
    + '<div class="f-head"><div class="f-num mono"><small>#</small>'+c.num+'</div><div class="f-badges"><span class="diff '+c.diff+'">'+c.diff+'</span>'+tags+'</div></div>'
    + '<h2 class="f-title">'+esc(c.title)+'</h2>'
    + (c.pri?'<span class="f-pri">우선 '+c.pri+' · 빈출</span>':'')
    + (c.solved?"":'<span class="f-unsolved">아직 안 푼 문제</span>')
    + '<p class="f-desc">'+esc(c.desc||"")+'</p>'
    + '<div class="f-foot"><a href="'+esc(c.link)+'" target="_blank" rel="noopener">LeetCode에서 열기 ↗</a>'
    + (c.date?'<span class="mono">'+esc(c.date)+'</span>':'')
    + '<span class="hint">탭하면 뒤집힘</span></div>'
    + '</div></div>';

  var cx = "";
  if(c.time||c.space){
    cx = '<div class="cx">'+(c.time?'<span><b>time</b>'+esc(c.time)+'</span>':'')+(c.space?'<span><b>space</b>'+esc(c.space)+'</span>':'')+'</div>';
  }
  var ap = "";
  if(c.approaches && c.approaches.length){
    ap = '<details class="appr"><summary>풀이 접근법 <em class="mono" style="font-style:normal">'+c.approaches.length+'</em></summary>';
    c.approaches.forEach(function(a){
      ap += '<div class="ap"><div class="nm">'+esc(a.name)+'</div><div class="dt">'+esc(a.detail)+'</div><div class="c">'+esc(a.tc)+' · '+esc(a.sc)+'</div></div>';
    });
    ap += '</details>';
  }
  var back = '<div class="face back"><div class="f-body">'
    + '<p class="b-label">내 노트</p>'
    + cx
    + '<div class="note">'+noteHTML(c.note||"")+'</div>'
    + ap
    + '</div></div>';

  study.innerHTML =
    '<div class="s-top"><span class="pos">'+(pos+1)+' / '+queue.length+'</span><span class="cat">'+esc(CATNAME[c.cat]||c.cat)+'</span><span class="grow"></span><button class="x" id="close" aria-label="닫기">×</button></div>'
    + '<div class="stage"><div class="card'+(flipped?" flipped":"")+'" data-r="'+r+'" id="card">'+front+back+'</div></div>'
    + '<div class="s-bar"><button class="close" id="close2" aria-label="닫기">×</button><button id="prev"'+(pos===0?" disabled":"")+'>← 이전</button><button class="flip" id="flip">뒤집기</button><button id="next"'+(pos===queue.length-1?" disabled":"")+'>다음 →</button></div>';
  ui.last = c.id; save();
}
function drawStudyMD(c){
  var r = c.solved ? c.review : 0;
  var head = c.track==="ood"
    ? '<div class="f-num mono"><small>#</small>'+esc(c.num)+'</div>'
    : '<div class="f-cat">'+esc(c.catName)+'</div>';
  var qs = (c.qs||[]).map(function(q){ return '<li>'+esc(q)+'</li>'; }).join("");
  var front = '<div class="face front"><div class="f-body">'
    + '<div class="f-head">'+head+'<div class="f-badges">'+(c.diff?'<span class="diff '+c.diff+'">'+c.diff+'</span>':'')+'</div></div>'
    + '<h2 class="f-title">'+esc(c.title)+'</h2>'
    + (c.solved?"":'<span class="f-unsolved">'+(c.desc?esc(c.desc):"아직 학습 전")+'</span>')
    + (qs?'<ol class="f-qs">'+qs+'</ol>':'<p class="f-desc">'+esc(c.desc||"")+'</p>')
    + '<div class="f-foot"><span class="f-file">'+esc(c.file)+'</span>'
    + (c.date?'<span class="mono">'+esc(c.date)+'</span>':'')
    + '<span class="hint">탭하면 뒤집힘</span></div>'
    + '</div></div>';
  var back = '<div class="face back"><div class="f-body">'
    + '<p class="b-label">전문</p>'
    + '<div class="md">'+mdHTML(c)+'</div>'
    + '</div></div>';
  study.innerHTML =
    '<div class="s-top"><span class="pos">'+(pos+1)+' / '+queue.length+'</span><span class="cat">'+esc(c.catName)+'</span><span class="grow"></span><button class="x" id="close" aria-label="닫기">×</button></div>'
    + '<div class="stage"><div class="card'+(flipped?" flipped":"")+'" data-r="'+r+'" id="card">'+front+back+'</div></div>'
    + '<div class="s-bar"><button class="close" id="close2" aria-label="닫기">×</button><button id="prev"'+(pos===0?" disabled":"")+'>← 이전</button><button class="flip" id="flip">뒤집기</button><button id="next"'+(pos===queue.length-1?" disabled":"")+'>다음 →</button></div>';
  ui.last = c.id; save();
}

/* ---------- events ---------- */
root.addEventListener("click", function(e){
  var t=e.target;
  var b;
  if((b=t.closest("[data-track]"))){ ui.track=b.dataset.track; ui.cat="all"; save(); render(); if(DESK.matches && !study.classList.contains("open")) drawEmpty(); return; }
  if((b=t.closest("[data-seg]"))){ ui.seg=b.dataset.seg; save(); render(); return; }
  if((b=t.closest("[data-cat]"))){ ui.cat=b.dataset.cat; save(); render(); return; }
  if((b=t.closest(".row"))){ open(b.dataset.id); return; }
  if(t.closest("#theme")){ cycleTheme(); return; }
});
study.addEventListener("click", function(e){
  var t=e.target;
  if(t.closest("a")) return;
  if(t.closest("#close")||t.closest("#close2")){ close(); return; }
  if(t.closest("#prev")){ go(-1); return; }
  if(t.closest("#next")){ go(1); return; }
  if(t.closest("#flip")){ flip(); return; }
  if(t.closest("summary")) return;
  if(t.closest(".face")){ flip(); return; }
});
document.addEventListener("keydown", function(e){
  if(!study.classList.contains("open")) return;
  if(e.key==="Escape") close();
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="ArrowRight") go(1);
  else if(e.key===" "||e.key==="Enter"){ if(!e.target.closest("summary,a,button")){ e.preventDefault(); flip(); } }
});
var tx=null, ty=null;
study.addEventListener("touchstart", function(e){ var p=e.changedTouches[0]; tx=p.clientX; ty=p.clientY; }, {passive:true});
study.addEventListener("touchend", function(e){
  if(tx===null) return;
  var p=e.changedTouches[0], dx=p.clientX-tx, dy=p.clientY-ty; tx=ty=null;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ go(dx<0?1:-1); }
}, {passive:true});

/* URL 해시: #cs → 트랙, #ai:theory/inference/kv_cache → 카드 열기, 끝에 ! 붙이면 뒷면 */
(function(){
  var hsh = decodeURIComponent((location.hash||"").slice(1)); if(!hsh) return;
  var want = hsh.replace(/!$/,"");
  var tr = want.split(":")[0];
  if(TRACKNAME[tr]){ ui.track = tr; ui.cat = "all"; if(want.indexOf(":")>=0) ui.hashOpen = want; }
})();
applyTheme();
render();
if(DESK.matches) drawEmpty();
if(ui.hashOpen){ var id = ui.hashOpen; delete ui.hashOpen; var fl = /!$/.test(location.hash); open(id); if(fl){ flipped=true; var cd=study.querySelector(".card"); if(cd) cd.classList.add("flipped"); } }
DESK.addEventListener("change", function(){
  if(DESK.matches){ document.body.style.overflow=""; if(!study.classList.contains("open")) drawEmpty(); }
  else if(!study.classList.contains("open")) study.innerHTML="";
});
})();
</script>

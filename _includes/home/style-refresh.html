<style>
/* ---- Editorial refresh (experimental override) ---- */

:root{
  --ink:#14161a;
  --body:#3f464f;
  --soft:#6d757e;
  --faint:#9aa1a9;
  --rule:#e9e9e6;
  --rule2:#f1f1ee;
  --paper:#fcfcfb;
  --accent:#14161a;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}

html,body{background:var(--paper)}

body,
.home-hero, .home-about, .home-links-wrap,
.home-projects, .home-education, .home-experience{
  font-family:var(--sans);
  font-feature-settings:"cv05" 1,"ss01" 1;
  color:var(--body);
}

main, footer > .footer_wrap, .nav-container {
  max-width: 1020px;
}

body.page-home main {
  max-width: 1020px;
  padding-top: 8px;
  padding-bottom: 96px;
}

/* Two-column shell ------------------------------------ */
.home-shell {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  column-gap: 76px;
  align-items: start;
}

.home-side {
  position: sticky;
  top: 40px;
  padding-top: 64px;
}

.home-body { padding-top: 64px; min-width: 0; }

/* first divider in the body column is redundant */
.home-body > .section-divider:first-child { display: none; }

@media (max-width: 900px) {
  .home-shell { grid-template-columns: 1fr; column-gap: 0; }
  .home-side { position: static; padding-top: 48px; padding-bottom: 8px; }
  .home-body { padding-top: 40px; }
}

.home-hero,
.home-about,
.home-links-wrap,
.home-projects,
.home-education,
.home-experience {
  font-size: 17px;
  line-height: 1.65;
  color: #1c2530;
}

/* Hero ------------------------------------------------ */
.home-hero { padding: 0 0 26px; }

.hero-name {
  font-family: var(--sans);
  font-size: 30px;
  font-weight: 600;
  line-height: 1.14;
  letter-spacing: -0.028em;
  color: var(--ink);
  margin-bottom: 15px;
}

.hero-name::after {
  content: "";
  display: block;
  width: 26px;
  height: 1px;
  background: #c8c8c2;
  margin-top: 15px;
}

.hero-title {
  font-size: 14.5px;
  line-height: 1.62;
  letter-spacing: -0.003em;
  color: var(--soft);
  margin-bottom: 22px;
}

.hero-keywords {
  list-style: none;
  padding: 0;
  margin: 0 0 24px 0;
  display: block;
}

.hero-keywords li {
  background: none;
  border: none;
  border-radius: 0;
  padding: 0 0 0 14px;
  margin-bottom: 5px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.01em;
  color: var(--soft);
  position: relative;
}

.hero-keywords li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 10px;
  width: 6px;
  height: 1px;
  background: #cfcfc9;
}

.links-row { flex-wrap: wrap; }

/* Section headings ------------------------------------ */
body.page-home .section-title,
.section-title {
  padding-left: 0;
  border-left: none;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--faint);
  font-weight: 500;
  border: none;
  padding: 0;
  margin: 0 0 24px 0;
}

.section-title::before,
.section-title::after { content: none; }

.section-divider { margin: 52px 0; }
.section-divider span { background: var(--rule); }

/* About ----------------------------------------------- */
.about-block {
  background: none;
  border: none;
  border-left: none;
  box-shadow: none;
  padding: 0;
}

.about-bullets { padding-left: 0; list-style: none; margin: 0; }

.about-bullets li {
  position: relative;
  padding-left: 18px;
  margin-bottom: 10px;
  font-size: 15px;
  line-height: 1.62;
  color: var(--body);
}

.about-bullets li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 12px;
  width: 6px;
  height: 1px;
  background: #c2c2bc;
}

/* Cards to editorial rows ----------------------------- */
.projects-grid,
.workedfor-grid { display: block; }

.project-card,
.workedfor-card {
  background: none;
  border: none;
  border-radius: 0;
  box-shadow: none;
  padding: 0 0 30px 0;
  margin: 0 0 30px 0;
  border-bottom: 1px solid var(--rule2);
}

.projects-grid > .project-card:last-child,
.workedfor-grid > .workedfor-card:last-child {
  border-bottom: none;
  margin-bottom: 0;
  padding-bottom: 0;
}

.project-title {
  display: block;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.018em;
  margin-bottom: 11px;
  color: var(--ink);
}

.project-bullets,
.workedfor-bullets {
  list-style: none;
  padding-left: 0;
  margin: 0 0 12px 0;
}

.project-bullets li,
.workedfor-bullets li {
  list-style: none;
  position: relative;
  padding-left: 18px;
  margin-bottom: 8px;
  color: var(--body);
  font-size: 14.5px;
  line-height: 1.6;
}

.project-bullets li::before,
.workedfor-bullets li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 11px;
  width: 6px;
  height: 1px;
  background: #c2c2bc;
}

.project-bullets li::marker,
.workedfor-bullets li::marker,
.about-bullets li::marker { content: ""; }

.project-url-line {
  color: #7b8794;
  font-size: 14.5px;
  padding-left: 0;
  margin-top: 10px;
}

.project-card .project-bullets,
.workedfor-right .workedfor-bullets {
  padding-left: 0;
  margin-left: 0;
}

.project-bullets li.project-url-line::before { content: none; }

.project-bullets li.project-url-line {
  padding-left: 0;
  margin-left: 0;
  color: #7b8794;
}

.project-tags {
  list-style: none;
  padding: 0;
  margin: 12px 0 0 0;
  display: flex;
  flex-wrap: wrap;
  gap: 0 16px;
}

.project-tags li {
  background: none;
  border: none;
  border-radius: 0;
  padding: 0;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--faint);
  letter-spacing: 0.01em;
  position: relative;
}

.project-tags li:not(:last-child)::after {
  content: "·";
  position: absolute;
  right: -10px;
  color: #c9d2da;
}

/* Experience ------------------------------------------ */
.workedfor-card {
  display: grid;
  grid-template-columns: 170px 1fr;
  gap: 0 28px;
}

.workedfor-company {
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: -0.012em;
  color: var(--ink);
  padding-top: 1px;
}

.workedfor-role {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--ink);
  margin-bottom: 11px;
}

.workedfor-period {
  font-family: var(--mono);
  font-weight: 400;
  color: var(--faint);
  font-size: 11.5px;
  margin-left: 8px;
}

/* Education ------------------------------------------- */
.education-row {
  background: none;
  border: none;
  box-shadow: none;
  padding: 0;
}

.edu-icon { display: none; }
.edu-text { font-size: 15px; color: var(--body); }
.edu-text strong { color: var(--ink); font-weight: 600; }
.edu-period { font-family: var(--mono); color: var(--faint); font-size: 11.5px; }

/* Links ----------------------------------------------- */
.links-row { gap: 10px; }

.link-pill {
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 7px;
  padding: 7px 13px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--body);
  box-shadow: none;
  transition: border-color .15s ease, color .15s ease;
}

.link-pill:hover { border-color: #b7b7b0; color: var(--ink); background: transparent; box-shadow: none; }
.link-pill.linkedin { color: var(--body); }

@media (max-width: 670px) {
  .workedfor-card { grid-template-columns: 1fr; gap: 6px; }
  .hero-name { font-size: 34px; }
  .hero-title { font-size: 17px; }
}

/* Facts (key-value) ----------------------------------- */
.facts{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:3px 26px;
  margin:14px 0 0;
  padding-top:11px;
  border-top:1px solid var(--rule2);
}

.facts div{
  font-family:var(--mono);
  font-size:11px;
  line-height:1.75;
  display:flex;
  gap:10px;
}

.facts b{
  flex:0 0 auto;
  min-width:74px;
  color:var(--faint);
  font-weight:400;
}

.facts span{color:var(--ink)}

@media (max-width:600px){
  .facts{grid-template-columns:1fr;gap:2px}
  .facts b{min-width:88px}
}

.project-url-line a, .home-body a { color: var(--body); text-decoration: none;
  border-bottom: 1px solid var(--rule); }
.project-url-line a:hover, .home-body a:hover { color: var(--ink); border-bottom-color: #b7b7b0; }

/* nav ------------------------------------------------- */
.nav a{
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--faint);
}
.nav a:hover, .nav a.active{ color: var(--ink); }
.nav{ padding: 22px 0 18px; }

/* Column rule ----------------------------------------- */
.home-shell{ position: relative; }

.home-body{
  border-left: 1px solid var(--rule);
  padding-left: 62px;
  margin-left: -14px;
}

/* Now block ------------------------------------------- */
.home-now{ margin-top: 30px; }

.now-block h3{
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--faint);
  font-weight: 500;
  margin: 0 0 11px;
}

.now-block ul{ list-style: none; padding: 0; margin: 0 0 24px; }

.now-block li{
  position: relative;
  padding-left: 16px;
  margin-bottom: 8px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--body);
}

.now-block .dot{
  position: absolute;
  left: 0;
  top: 7px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #1f7a5c;
  box-shadow: 0 0 0 3px rgba(31,122,92,.10);
}

.now-meta{
  margin: 0;
  padding-top: 16px;
  border-top: 1px solid var(--rule);
  display: grid;
  gap: 2px;
}

.now-meta div{ display: flex; gap: 10px; font-family: var(--mono); font-size: 11px; line-height: 1.8; }
.now-meta b{ flex: 0 0 76px; color: var(--faint); font-weight: 400; }
.now-meta span{ color: var(--ink); }

/* Item numbering -------------------------------------- */
.home-projects .projects-grid,
.home-experience .workedfor-grid{ counter-reset: item; }

.projects-grid > .project-card,
.workedfor-grid > .workedfor-card{ counter-increment: item; position: relative; }

.projects-grid > .project-card::before,
.workedfor-grid > .workedfor-card::before{
  content: counter(item, decimal-leading-zero);
  position: absolute;
  left: -48px;
  top: 3px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: #c4c4bd;
  letter-spacing: 0.04em;
}

@media (max-width: 900px){
  .home-body{ border-left: none; padding-left: 0; margin-left: 0; }
  .projects-grid > .project-card::before,
  .workedfor-grid > .workedfor-card::before{ display: none; }
  .home-now{ margin-top: 24px; }
}

/* Sticky section labels -------------------------------- */
body.page-home .section-title,
.section-title{
  position: sticky;
  top: 0;
  z-index: 4;
  background: var(--paper);
  padding-top: 10px;
  padding-bottom: 10px;
  margin-bottom: 14px;
}

/* Dividers off — the column rule and labels carry it ---- */
.home-body > .section-divider{ display: none; }
.home-projects, .home-education, .home-experience, .home-about{ padding-bottom: 46px; }
.home-about{ padding-bottom: 40px; }

/* Item affordance -------------------------------------- */
.project-card, .workedfor-card{ transition: none; }

.projects-grid > .project-card::before,
.workedfor-grid > .workedfor-card::before{ transition: color .15s ease; }

.projects-grid > .project-card:hover::before,
.workedfor-grid > .workedfor-card:hover::before{ color: var(--ink); }

.project-card:hover .project-title,
.workedfor-card:hover .workedfor-role{ color: #000; }

::selection{ background: #e8e8e2; color: var(--ink); }

/* Lead line in About ----------------------------------- */
.about-bullets li:first-child{
  font-size: 17px;
  line-height: 1.5;
  letter-spacing: -0.012em;
  color: var(--ink);
  margin-bottom: 16px;
  padding-left: 0;
}
.about-bullets li:first-child::before{ display: none; }

/* Footer ------------------------------------------------ */
footer{
  background: var(--paper) !important;
  border-top: 1px solid var(--rule);
  margin-top: 30px;
  padding: 34px 0 44px;
}
footer .information{ display: block; }
footer .myname{
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--faint);
  font-weight: 500;
  margin-bottom: 8px;
}
footer .email{
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--body) !important;
  border-bottom: 1px solid var(--rule);
}
footer .email:hover{ color: var(--ink) !important; border-bottom-color: #b7b7b0; }
footer .accounts{ margin-top: 18px; }
footer .accounts img{ width: 22px; height: 22px; opacity: .45; transition: opacity .15s ease; }
footer .accounts a:hover img{ opacity: .85; }
footer .copyright,
footer address > *:last-child{ font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

/* Kill the theme's card hover chrome ------------------- */
.project-card:hover,
.workedfor-card:hover,
.education-row:hover{
  background: none !important;
  border: none !important;
  border-bottom: 1px solid var(--rule2) !important;
  box-shadow: none !important;
  transform: none !important;
}

.projects-grid > .project-card:last-child:hover,
.workedfor-grid > .workedfor-card:last-child:hover{
  border-bottom: none !important;
}

.education-row:hover{ border-bottom: none !important; }

/* Patents ---------------------------------------------- */
.home-patents .project-title{
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.008em;
  line-height: 1.4;
  margin-bottom: 9px;
}

.home-patents .project-card{ padding-bottom: 22px; margin-bottom: 22px; }

.patents-note{
  margin: 6px 0 0;
  font-size: 13px;
  color: var(--soft);
}

.patents-note a{ font-family: var(--mono); font-size: 11.5px; margin-left: 6px; }
</style>

   "md": "> THEORY · inference · T1  \n> 구현 → engine/dynamo/architecture.md\n\n## 0. 먼저 알아둘 말\n\n| 말 | 뜻 |\n|---|---|\n| 서빙 | 학습이 끝난 모델을 서버에 올려 사용자 요청에 답하게 하는 일 |\n| 엔진 | 모델을 올리고 추론을 돌리는 서버 프로세스 하나 (예: vLLM 인스턴스) |\n| prefill · decode | 프롬프트 전체를 한 번에 처리하는 단계 · 토큰을 하나씩 생성하는 단계 |\n| KV 캐시 | 지나간 토큰들의 k, v 벡터 저장분. 요청마다 GPU 메모리를 차지 |\n| TTFT | Time To First Token. 요청부터 첫 토큰까지. prefill 이 좌우 |\n| TPOT · ITL | 토큰당 걸린 시간 · 토큰 사이 간격. decode 가 좌우 |\n| p50 · p99 | 요청을 빠른 순으로 줄 세웠을 때 50 % · 99 % 지점의 값. p99 는 느린 쪽 꼬리 |\n| QPS | 초당 들어오는 요청 수 |\n| SLA · SLO | 지키기로 약속한 성능 수준 · 그 안의 구체적 목표값 (예: TTFT p99 500 ms 이하) |\n| 처리량 | 초당 만들어 내는 토큰 수 |\n| 배치 | GPU 에서 한 번에 같이 처리하는 요청 묶음 |\n| TP | Tensor Parallelism. 모델 하나를 GPU 여러 장에 쪼개 올리는 것 |\n| P/D 분리 | prefill 전용 GPU 풀과 decode 전용 GPU 풀을 따로 두는 구조 |\n| 양자화 | 숫자를 더 적은 비트로 저장 (예: 16 비트 → 8 비트). 메모리와 시간이 줄고 품질이 조금 떨어질 수 있음 |\n| preemption | 진행 중인 요청을 멈추고 자원을 뺏는 것 |\n| 레플리카 | 같은 엔진의 복제본. 늘리면 감당하는 요청 수가 늘어남 |\n| 429 | \"요청이 너무 많다\" 는 HTTP 응답 코드. 과부하 때 요청을 거절하는 수단 |\n\n## Q1: 'LLM 서빙 시스템을 설계해보라' 는 질문에 첫 2분 동안 무엇을 물어야 하나요? (요구사항·지표)\n\n**30초 답**\n\n- 다섯 가지를 묻는다.\n  1. 모델 크기\n  2. 트래픽 (QPS, 동시 요청 수)\n  3. 입력 · 출력 길이 분포\n  4. 지켜야 할 지표 (TTFT · TPOT 의 p50 / p99)\n  5. 예산 (GPU 수와 종류)\n\n**자세히**\n\n| 받은 답 | 정해지는 설계 |\n|---|---|\n| 모델 크기 + GPU | 병렬화 (GPU 한 장에 안 들어가면 TP) |\n| 입력 · 출력 길이 | P/D 분리 여부, KV 캐시에 줄 메모리 |\n| 지표 | 배치 상한 (배치가 크면 토큰 하나가 느려지므로) |\n\n- \"어떤 모델을 몇 명이 어떻게 쓰나\" 를 숫자로 받아내는 게 첫 2분이다.\n\n## Q2: 게이트웨이 → 라우터 → 엔진 풀 → 오토스케일러 구조를 그리고 각 층의 책임을 말해보세요.\n\n**30초 답**\n\n- 게이트웨이: 인증, 레이트리밋 (사용자별 요청 수 제한), 대기열.\n- 라우터: 어느 엔진에 보낼지 결정 (캐시와 부하를 보고).\n- 엔진 풀: 실제 추론 (vLLM 등).\n- 오토스케일러: 풀 크기와 P/D 비율 조정.\n\n**자세히**\n\n```\n클라이언트 → [게이트웨이] → [라우터] → [엔진 풀 (P 풀 / D 풀)] → 응답 스트림\n                                ↑                 ↓ 지표\n                           [오토스케일러 / planner]\n```\n\n| 층 | 책임 | 실패하면 |\n|---|---|---|\n| 게이트웨이 | 인증, 요청 검증, 토큰 수 제한, 과부하 시 429 | 엔진이 쓰레기 요청·폭주를 직접 맞음 |\n| 라우터 | 엔진 선택. 기준은 프리픽스 캐시 적중 (같은 앞부분의 KV 를 이미 가진 엔진), 부하, 모델 · LoRA (모델에 덧붙이는 작은 추가 가중치) 일치 | 캐시 못 쓰고 한 엔진에 몰림 |\n| 엔진 풀 | continuous batching (스텝마다 끝난 요청을 빼고 새 요청을 넣는 배치 방식), KV 관리, 병렬화 | 여기가 비용의 전부 |\n| 오토스케일러 | SLA 보고 레플리카·P/D 비율 조정 | 피크에 TTFT 폭발, 야간에 GPU 낭비 |\n\n## Q3: 병목이 어디서 생기는지 prefill·decode·KV 전송·네트워크 순으로 짚어보세요.\n\n**30초 답**\n\n- prefill: 연산이 병목. 긴 입력이 몰리면 TTFT 가 오른다.\n- decode: KV 메모리가 병목. 동시 요청이 쌓이면 preemption 이 난다.\n- KV 전송: P/D 를 분리했을 때 네트워크가 병목.\n- 네트워크: 스트리밍 응답을 내보내는 경로가 병목.\n\n**자세히**\n\n| 병목 | 증상 | 손잡이 |\n|---|---|---|\n| prefill 연산 | TTFT p99 상승 | chunked prefill (긴 프롬프트를 조각내 여러 스텝에 나눠 넣기), P 풀 증설, 프리픽스 캐시 |\n| decode KV 메모리 | preemption 증가, 처리량 정체 | 배치 상한, KV 양자화, GQA 모델 (헤드끼리 k v 를 공유해 KV 가 작은 모델), offload (KV 를 CPU 메모리로 내리기) |\n| KV 전송 | P/D 에서 TTFT 에 전송 시간이 더해짐 | P 와 D 를 같은 서버 (NVLink: GPU 간 고속 링크) 에 두기, RDMA (서버 간 메모리 직접 복사), 분리 포기 |\n| 네트워크·게이트웨이 | 토큰은 나오는데 클라이언트가 늦게 받음 | 스트리밍 경로 점검, 게이트웨이 수평 확장 |\n\n- 빠른 판단 ⭐️\n  - GPU 사용률이 높고 첫 토큰이 늦다 (TTFT) → prefill 연산 쪽.\n  - GPU 사용률이 높고 토큰 간격이 길다 (TPOT) → decode 쪽. 배치가 너무 크거나 KV 메모리가 찼다.\n  - GPU 사용률이 낮은데 느리다 → GPU 밖. CPU, 동기화, 통신이 GPU 를 기다리게 한다.\n- GPU 사용률 (nvidia-smi) 은 커널이 돌고 있던 시간의 비율이다.\n  - decode 는 memory-bound 여도 커널이 계속 돌아서 사용률은 높게 나온다.\n  - 낮게 나오는 건 MFU (연산 장치를 쓴 비율) 다. 사용률과 다른 숫자다.\n\n## Q4: 레이턴시 vs 처리량 vs 비용의 트레이드오프를 어떤 손잡이로 조절하나요?\n\n**30초 답**\n\n- 배치 크기 하나가 레이턴시 · 처리량 · 비용 셋을 동시에 움직인다.\n- 나머지 손잡이는 양자화, 병렬화, P/D 비율이다.\n\n**자세히**\n\n| 손잡이 | 레이턴시 | 처리량 | 비용 |\n|---|---|---|---|\n| 배치 ↑ | TPOT ↑ | ↑ | GPU 당 ↓ |\n| TP ↑ | ↓ (레이어 연산 분산) | 통신 때문에 GPU 당 ↓ | ↑ |\n| 양자화 | ↓ | ↑ | ↓ |\n| P/D 분리 | ITL 안정 | ↑ | 조율·전송 비용 ↑ |\n| 모델 작게 / speculative decoding (작은 모델이 먼저 추측하고 큰 모델이 한 번에 검증) | ↓ | ↑ | ↓ / 품질 리스크 |\n\n- 면접에서 말할 순서:\n  1. TPOT 상한을 SLA 로 정한다.\n  2. 그 안에서 배치를 최대로 키운다.\n  3. 안 되면 양자화한다.\n  4. 그래도 안 되면 GPU 를 추가한다.\n\n## Follow-up: 장애(GPU 한 대 죽음, 요청 폭주) 가 나면 어디서 무엇이 먼저 무너지나요?\n\n**30초 답**\n\n- GPU 하나가 죽으면: 그 위에서 진행 중이던 요청이 전부 날아간다.\n- 요청이 폭주하면: 대기열이 먼저 쌓여 TTFT 가 무너진다.\n\n**자세히**\n\n| 장애 | 무슨 일이 생기나 | 대응 |\n|---|---|---|\n| GPU 한 대 죽음 | 그 엔진의 KV 캐시가 사라짐. 요청을 다른 엔진에서 처음부터 다시 돌려야 함 | 다른 엔진으로 재시도. request migration (진행 중 요청을 다른 엔진으로 옮기는 기능) 이 있으면 이어서 생성 |\n| 요청 폭주 | 엔진까지 들어오면 preemption 이 연쇄로 일어나 모든 요청이 느려짐 | 게이트웨이에서 막음. 429 응답과 대기열 상한이 첫 방어선 |\n\n\n## Follow-up 2: 실시간 요청 (회의 자막) 과 배치 작업 (회의 요약) 이 같은 GPU 풀을 쓰면 우선순위를 어떻게 지키나요?\n\n**30초 답**\n\n- 여기서 \"배치 작업\" 은 급하지 않은 묶음 처리 (회의 요약 등) 다. GPU 의 배치 (같이 처리하는 요청 묶음) 와 다른 말이다.\n- 요청 종류마다 SLO 를 따로 정한다. 실시간은 TTFT · TPOT p99, 배치 작업은 완료 시각과 비용이다.\n- 실시간은 높은 우선순위 큐와 예약 용량을 주고, 배치는 남는 용량에서 돌린다.\n- 실시간이 밀리면 배치부터 미루거나 preempt 한다.\n\n**자세히**\n\n| 손잡이 | 하는 일 | 대가 |\n|---|---|---|\n| 우선순위 스케줄링 | 대기열에서 실시간 먼저. 필요하면 배치 작업 요청을 멈춤 (vLLM `--scheduling-policy priority`) | 밀린 배치 작업의 재계산 비용 |\n| 용량 예약 · 풀 분리 | 실시간 전용 레플리카 확보 | 한가할 때 GPU 유휴 |\n| 배치 상한 · chunked prefill 크기 | 긴 배치 prefill 이 실시간 decode 를 막지 않게 | 처리량 ↓ |\n| 시간 이동 | 배치를 한가한 시간대 큐로 | 결과 지연을 허용해야 함 |\n| 어드미션 컨트롤 (요청을 받을지 말지 입구에서 결정) | 실시간 SLO 가 위험하면 배치 작업 접수를 늦춤 | 배치 작업 대기 증가 |\n\n- 말하는 순서: 클래스별 SLO 정의 → 우선순위 큐 → 용량 예약 → 넘치면 배치부터 밀기 → 클래스별 지표 모니터링.\n- 실시간 쪽은 스트리밍이 끊기는지 (토큰 간 간격 p99) 도 본다.\n",

   "md": "> THEORY · inference · T1  \n> 구현 → engine/vllm/kv_connector_pd.md, engine/dynamo/disaggregated_pd.md\n\n## 0. 먼저 알아둘 말\n\n| 말 | 뜻 |\n|---|---|\n| prefill (P) | 프롬프트 토큰 전체를 한 번에 처리하는 단계. KV 캐시를 만든다 |\n| decode (D) | 토큰을 하나씩 생성하는 단계. KV 캐시를 읽으며 이어 붙인다 |\n| P/D 분리 | prefill 전용 GPU 풀과 decode 전용 GPU 풀을 따로 두는 구조 |\n| KV 캐시 | 지나간 토큰들의 k, v 벡터 저장분. P 가 만든 것을 D 가 받아야 이어서 생성 가능 |\n| TTFT | Time To First Token. 요청부터 첫 토큰까지 걸린 시간. prefill 이 좌우 |\n| ITL · TPOT | 토큰 사이 간격 · 토큰당 걸린 시간. decode 가 좌우 |\n| compute-bound · memory-bound | 연산 능력이 한계인 상태 · 메모리 대역폭이 한계인 상태 |\n| TP | Tensor Parallelism. 모델 하나를 GPU 여러 장에 쪼개 올리는 것 |\n| NVLink | 같은 서버 안 GPU 끼리 잇는 전용 고속 링크 |\n| RDMA | 서버 사이에서 CPU 를 거치지 않고 메모리를 직접 복사하는 네트워크 방식 (InfiniBand 등) |\n| PCIe | CPU 메모리와 GPU 를 잇는 통로. 위 둘보다 느림 |\n| SLA | 지키기로 한 성능 목표 (예: TTFT p99 500 ms 이하) |\n\n## Q1: prefill 과 decode 를 같은 GPU 에서 돌리면 서로 어떻게 방해하나요?\n\n**30초 답**\n\n- prefill 은 스텝 하나를 길게 차지해서 decode 요청들의 토큰 간격 (ITL) 을 튀게 한다.\n- decode 는 배치가 작아 GPU 연산을 놀리므로 prefill 처리량을 깎는다.\n\n**자세히**\n\n| | prefill | decode |\n|---|---|---|\n| 성격 | compute-bound | memory-bound |\n| 좋아하는 조건 | 큰 배치로 연산 장치를 꽉 채움 | 가중치 읽기를 나눠 쓸 만큼만 모이면 됨 |\n| 한 스텝 길이 | 김 (토큰 수에 비례) | 짧음 |\n\n- 둘의 성격이 반대라, 한 GPU 에서 섞으면 어느 쪽에도 최적이 아닌 스텝 크기로 돈다.\n- chunked prefill (긴 프롬프트를 조각내 여러 스텝에 나눠 넣기) 이 완화하지만 간섭을 없애지는 못한다.\n\n## Q2: P/D 를 분리하면 무엇이 좋아지고, 대신 새로 생기는 비용은 무엇인가요?\n\n**30초 답**\n\n- 좋아지는 것: TTFT 와 ITL 을 따로 최적화하고, P 와 D 를 따로 늘리고 줄일 수 있다.\n- 새 비용: KV 캐시를 P 에서 D 로 옮기는 전송, 그리고 두 풀을 잇는 라우팅 · 조율.\n\n**자세히**\n\n| 얻는 것 | 내는 것 |\n|---|---|\n| decode 쪽 ITL 이 안정됨 | 요청마다 KV 전체를 네트워크로 옮김 (7B · 4K 토큰이면 약 2 GB) ⭐️ |\n| prefill 쪽 배치 효율 ↑ | P 와 D 비율이 틀리면 한쪽이 놂 |\n| P 와 D 에 다른 병렬화 가능 (P 는 TP 크게, D 는 TP 작게 · 배치 크게) | 라우터 · 조율 계층이 추가됨 |\n\n## Q3: KV 캐시를 P 에서 D 로 옮기는 데 얼마나 걸리나요? 어떤 링크(NVLink/RDMA/PCIe)를 타나요?\n\n**30초 답**\n\n- 같은 서버 안 NVLink 면 수 ms.\n- 서버 사이 RDMA 면 2 GB 에 약 40 ms.\n- CPU 메모리를 거치면 (PCIe) 그보다 더 걸린다.\n\n**자세히**\n\n| 경로 | 속도 | KV 2 GB 전송 | 비고 |\n|---|---|---|---|\n| NVLink (같은 서버) | H100 기준 900 GB/s | 수 ms | GPU 끼리 직접 복사. 가장 빠름 |\n| RDMA (서버 간, InfiniBand 400 Gb/s) | 약 50 GB/s | 약 40 ms | GPU 메모리 → GPU 메모리 직접 (GPUDirect) |\n| CPU 버퍼 경유 (vLLM `kv_buffer_device=cpu`) | PCIe 를 두 번 탐 | 더 김 | 느리지만 어디서나 동작 |\n\n- 전송 시간이 prefill 시간과 비슷해지면 분리한 이득이 사라진다.\n\n## Q4: P 와 D 의 비율은 어떻게 정하나요?\n\n**30초 답**\n\n- 입력 길이와 출력 길이의 비율로 정한다.\n- 입력이 길면 P 를, 출력이 길면 D 를 늘린다.\n\n**자세히**\n\n1. P 하나가 초당 처리하는 prefill 토큰 수를 잰다.\n2. D 하나가 감당하는 동시 decode 요청 수를 잰다.\n3. SLA (TTFT · TPOT) 를 만족하는 가장 작은 조합을 고른다.\n\n- 워크로드가 바뀌면 비율도 바뀌어야 한다. 그래서 planner (비율을 자동 조정하는 구성요소) 가 동적으로 맞춘다.\n- Dynamo 의 SLA planner 가 이 역할이다.\n\n## Follow-up: P/D 분리가 오히려 손해인 상황은?\n\n**30초 답**\n\n- 입력이 짧고 출력이 긴 워크로드.\n- KV 전송이 prefill 보다 오래 걸리는 환경.\n- GPU 가 몇 장 안 되는 작은 배포.\n\n**자세히**\n\n| 상황 | 왜 손해인가 |\n|---|---|\n| 입력 100 토큰짜리 채팅 | prefill 이 몇 ms 라 간섭이 거의 없다. 분리하면 전송 비용만 남는다 |\n| 서버 간 네트워크가 느림 | KV 2 GB 를 옮기는 동안 그냥 다시 계산하는 게 빠르다 |\n| GPU 2-4 장 | 풀을 둘로 나누면 각각이 너무 작아 배치 효율이 떨어진다 |\n\n---\n\n### 손댄 곳\n\n- vLLM PR #54483 (머지 2026-10-01): NIXL host-buffer KV 복사 그룹 간 coalescing, copy_blocks 호출 7→1 · vllm-study/01-issues/roadmap-19-h2d-copy-coalescing/\n- P/D 한 GPU 실기동 함정 (9/22): 동시 기동 시 KV 예산 0, kv_buffer_device=cpu 호스트 버퍼 크기 · vllm-study/02-env/pod-setup.md\n",

   "md": "> THEORY · inference · T1  \n> 구현 → engine/vllm/spec_decode_impl.md\n\n## 0. 먼저 알아둘 말\n\n| 말 | 뜻 |\n|---|---|\n| speculative decoding | 작은 모델이 다음 토큰 여러 개를 먼저 추측하고, 큰 모델이 한 번에 검증하는 가속 방법 |\n| target 모델 | 실제로 답을 내야 하는 큰 모델 |\n| draft 모델 | 추측을 맡는 작고 빠른 모델 |\n| k | draft 가 한 번에 제안하는 토큰 수 |\n| forward | 모델을 앞에서 뒤로 한 번 통과시키는 계산 |\n| prefill · decode | 토큰 여러 개를 한 번에 처리하는 단계 · 토큰을 하나씩 생성하는 단계 |\n| memory-bound · compute-bound | 메모리에서 가중치를 읽는 속도가 한계인 상태 · 연산 능력이 한계인 상태 |\n| acceptance rate (α) | draft 가 제안한 토큰이 받아들여지는 비율 |\n| hidden state | 모델 중간 층이 내놓는 벡터. 다음 토큰을 예측할 정보가 들어 있음 |\n| head | hidden state 를 받아 토큰 확률을 내는 작은 출력 층 |\n| 분포 | 다음 토큰 후보마다 매긴 확률 전체 |\n\n## Q1: draft 모델이 k 개를 제안하고 target 모델이 한 번에 검증한다는 게 왜 빨라지나요?\n\n**30초 답**\n\n- 원래는 target 모델 forward 한 번에 토큰 1 개만 나온다.\n- speculative decoding 은 forward 한 번에 최대 k+1 개를 확정한다.\n\n**자세히**\n\n1. 작은 draft 가 토큰 k 개를 빠르게 제안한다.\n2. target 은 그 k 개를 prefill 처럼 한 번에 넣어, 각 위치에서 자기라면 뭘 냈을지 확률을 얻는다.\n3. 앞에서부터 맞는 만큼 받아들인다.\n4. 처음 틀린 자리는 target 의 토큰으로 바꾸고, 그 뒤는 버린다.\n\n```text\ndraft 제안:   A  B  C  D  E      (k = 5)\ntarget 검증:  ✓  ✓  ✓  ✗\n결과:         A  B  C  D'        → forward 한 번에 4 개 확정\n```\n\n- target forward 한 번에 최소 1 개, 최대 k+1 개가 나온다.\n\n## Q2: 검증이 '공짜' 에 가까운 이유는? decode 가 memory-bound 라는 사실과 어떻게 연결되나요?\n\n**30초 답**\n\n- decode 에서 target forward 의 시간은 대부분 가중치를 메모리에서 읽는 데 쓴다.\n- 그래서 토큰 1 개를 넣든 k 개를 넣든 시간이 거의 같다.\n\n**자세히**\n\n- decode 는 memory-bound 다.\n- 예 (7B 모델, H100): 가중치 14 GB 를 읽는 데 약 4 ms 가 든다. 그동안 연산 장치는 토큰 1 개분만 계산하고 논다.\n- 그 자리에 토큰 k 개를 넣어도 읽는 양은 그대로다. 연산만 조금 늘어 시간이 거의 안 변한다.\n- 즉 남는 연산 여유를 검증에 쓰는 것이다. ⭐️\n- 반대로 배치가 커서 이미 compute-bound 면 남는 여유가 없다. 이때는 이득이 줄어든다.\n\n## Q3: acceptance rate 가 낮으면 어떻게 되나요? 손익분기는 어디인가요?\n\n**30초 답**\n\n- acceptance rate α 가 낮으면 draft 를 돌린 비용만 쓰고 토큰은 거의 안 늘어난다.\n- 그러면 오히려 느려진다.\n\n**자세히**\n\n- target forward 한 번에 확정되는 토큰 수의 기댓값: (1 - α^(k+1)) ÷ (1 - α).\n\n| α | k | forward 한 번당 기대 토큰 |\n|---|---|---|\n| 0.8 | 5 | 약 3.7 개 |\n| 0.3 | 5 | 약 1.4 개 |\n\n- 이득 조건: (draft 를 k 번 돌리는 시간 + target 1 번) 으로 얻는 토큰이, 같은 시간에 target 만 돌려 얻는 토큰보다 많아야 한다.\n- 속도 향상 = 기대 토큰 ÷ (1 + k × c).\n  - c = draft 한 번의 시간 ÷ target 한 번의 시간. draft 가 작을수록 c 가 작다.\n\n| α | k | c | 기대 토큰 | 속도 향상 |\n|---|---|---|---|---|\n| 0.8 | 5 | 0.05 | 3.7 | 3.7 ÷ 1.25 = 약 3 배 |\n| 0.5 | 5 | 0.05 | 1.97 | 1.97 ÷ 1.25 = 약 1.6 배 |\n| 0.5 | 5 | 0.2 | 1.97 | 1.97 ÷ 2 = 약 1 배. 이득 없음 |\n| 0.3 | 5 | 0.2 | 1.4 | 1.4 ÷ 2 = 0.7 배. 손해 |\n\n- α 하나로 손익이 갈리지 않는다. α 가 낮아도 draft 가 아주 싸면 이득이고, α 가 높아도 draft 가 비싸면 손해다.\n- α 는 모델 쌍과 도메인에 따라 다르다. 실측해야 한다.\n\n## Q4: draft 모델 없이 하는 방법(n-gram, EAGLE, Medusa, MTP)은 각각 draft 를 어디서 가져오나요?\n\n**30초 답**\n\n- n-gram: 프롬프트에 이미 나온 토큰 열에서 가져온다.\n- Medusa · EAGLE: target 의 hidden state 에 붙인 작은 head 에서 가져온다.\n- MTP: target 모델 안에 처음부터 학습해 넣은 head 에서 가져온다.\n\n**자세히**\n\n| 방식 | draft 출처 | 특징 |\n|---|---|---|\n| n-gram (연속한 토큰 n 개 묶음) | 프롬프트 · 출력에 이미 나온 같은 묶음을 찾아 그 뒤를 그대로 제안 | 모델 없음. 요약 · 코드처럼 반복이 많은 입력에 좋음 |\n| Medusa | target 마지막 hidden 에 head 여러 개 | 별도 모델 없음, 위치마다 독립 예측 |\n| EAGLE / EAGLE3 | hidden state 받는 작은 트랜스포머 | 앞 토큰 정보를 써서 Medusa 보다 정확 |\n| MTP (Multi-Token Prediction, DeepSeek) | 학습 때부터 넣은, 여러 토큰을 한 번에 예측하는 head | 모델과 함께 나옴. 따로 학습하거나 붙일 것이 없음 |\n\n- 넷 다 별도 draft 모델이 없다. 그래서 GPU 메모리를 거의 더 안 쓰고 배포가 단순하다.\n\n## Follow-up: 출력 분포가 target 모델과 정확히 같다는 걸 어떻게 보장하나요? (rejection sampling)\n\n**30초 답**\n\n- rejection sampling (제안을 확률적으로 받거나 거절하는 방법) 을 쓴다.\n- draft 가 제안한 토큰을 \"target 확률 ÷ draft 확률\" 에 따라 받거나 거절한다.\n- 이렇게 하면 최종 출력 분포가 target 과 수학적으로 같아진다.\n\n**자세히**\n\n- 기호: 제안된 토큰에 대해 draft 가 매긴 확률 q, target 이 매긴 확률 p.\n- 그 토큰을 min(1, p/q) 확률로 받는다.\n  - target 이 draft 보다 높게 봤으면 (p ≥ q) 무조건 받는다.\n  - 낮게 봤으면 그 비율만큼만 받는다.\n- 거절되면 (p - q)⁺ 를 정규화한 분포에서 다시 뽑는다.\n  - (p - q)⁺ = target 이 draft 보다 더 높게 본 만큼만 남긴 값 (음수는 0).\n  - 정규화 = 합이 1 이 되게 나누는 것.\n- 이렇게 하면 어떤 draft 를 써도 출력 분포는 target 그대로다.\n- 속도만 바뀌고 품질은 안 바뀐다는 보장이 여기서 나온다.\n\n",

   "md": "> THEORY · inference · T2  \n> 구현 → engine/vllm/prefix_caching_impl.md, engine/dynamo/kv_router.md\n\n## 0. 먼저 알아둘 말\n\n| 말 | 뜻 |\n|---|---|\n| 접두사 (prefix) | 여러 요청이 똑같이 갖고 있는 앞부분. 예: 시스템 프롬프트 |\n| KV 캐시 | 지나간 토큰들의 k, v 벡터 저장분 |\n| 블록 | KV 캐시를 담는 고정 크기 조각 (vLLM 은 토큰 16 개분) |\n| prefill | 프롬프트 토큰 전체를 한 번에 처리하는 단계. KV 캐시를 만든다 |\n| causal | 각 토큰이 자기 앞쪽 토큰만 본다는 성질. 뒤에 뭐가 와도 앞부분 계산은 안 바뀜 |\n| 해시 | 내용을 짧은 숫자 하나로 요약한 값. 내용이 같으면 해시도 같음 |\n| 엔진 | 모델을 올리고 추론을 돌리는 서버 프로세스 하나 (예: vLLM 인스턴스) |\n| 라우터 | 들어온 요청을 어느 엔진으로 보낼지 정하는 구성요소 |\n| TTFT · TPOT | 첫 토큰까지 걸린 시간 · 토큰당 걸린 시간 |\n| LoRA | 원래 모델에 덧붙이는 작은 추가 가중치. 같은 모델도 LoRA 가 다르면 결과가 다름 |\n\n## Q1: 시스템 프롬프트가 같은 요청 100개가 오면 무엇을 재사용할 수 있나요?\n\n**30초 답**\n\n- 시스템 프롬프트 부분의 KV 캐시를 재사용한다.\n- 요청 100 개가 같은 2000 토큰 접두사를 가지면, 그 prefill 을 한 번만 하고 블록을 공유한다.\n\n**자세히**\n\n- prefill 은 compute-bound (연산 능력이 한계) 라 비싸다.\n- 같은 토큰 열은 같은 KV 를 낸다. causal 이라 뒤에 뭐가 오든 앞부분은 같기 때문이다.\n- 첫 요청이 만든 블록을 다음 요청이 그대로 가리키면, 2000 토큰 prefill 이 사라져 TTFT 가 크게 준다.\n- 접두사가 되는 것들: 시스템 프롬프트, RAG 로 붙인 문서, few-shot 예시, 멀티턴 대화의 이전 턴.\n\n## Q2: 프리픽스 캐시는 무엇을 키로 쓰나요? 왜 블록 단위인가요?\n\n**30초 답**\n\n- 키 = 해시 (블록 안의 토큰 ID 들 + 바로 앞 블록의 해시).\n- 블록 단위인 이유: KV 가 원래 블록으로 관리되고, 토큰마다 해시를 만들면 너무 많다.\n\n**앞 블록 해시를 넣는 이유** ⭐️\n\n- 블록 3 의 KV 는 블록 1, 2 의 내용에 의존한다 (attention 이 앞을 보기 때문).\n- 그래서 같은 16 토큰이라도 앞 내용이 다르면 다른 KV 다.\n- 앞 블록 해시를 섞으면 해시가 사슬처럼 이어진다.\n- 결과: 접두사가 같은 구간까지만 캐시가 적중한다.\n\n```text\n요청 A: [시스템] → [문서] → [질문 X]\n요청 B: [시스템] → [문서] → [질문 Y]\n         └──── 적중 ────┘    └ 다름, 새로 계산\n```\n\n- 멀티모달 입력과 LoRA ID 도 해시에 섞는다. 조건이 다른데 잘못 재사용하는 일을 막기 위해서다.\n\n## Q3: 엔진이 여러 대일 때 라우터가 캐시를 알아야 하는 이유는?\n\n**30초 답**\n\n- 캐시는 각 엔진의 GPU 메모리 안에 있다.\n- 같은 접두사 요청이 다른 엔진으로 가면 적중하지 않는다.\n- 그래서 라우터가 \"어느 엔진에 이 접두사가 있나\" 를 알아야 한다.\n\n**자세히**\n\n| 라우팅 방식 | 결과 |\n|---|---|\n| 랜덤 (엔진 4 대) | 적중률이 약 1/4 로 떨어짐 |\n| sticky (같은 사용자는 같은 엔진) | 사용자가 달라도 접두사가 같은 경우 (공용 시스템 프롬프트) 를 놓침 |\n| cache-aware | 엔진이 갖고 있는 블록 해시를 라우터가 알고, 겹치는 엔진으로 보냄 |\n\n- cache-aware 구현: 엔진이 KV 블록 해시를 이벤트로 알려 준다.\n- 라우터는 그것을 radix tree (공통 앞부분을 공유하는 트리) 로 들고 있다가 가장 많이 겹치는 엔진을 찾는다.\n- Dynamo 의 kv-router 가 이 방식이다.\n\n## Q4: 캐시 적중(locality) 과 부하 분산(load) 이 충돌하면 어떻게 정하나요?\n\n**30초 답**\n\n- \"캐시 덕에 줄어드는 prefill 토큰\" 과 \"그 엔진이 지금 지고 있는 부하\" 를 같은 단위로 바꿔 더한다.\n- 그 합이 가장 작은 엔진을 고른다.\n\n**자세히**\n\n```text\ncost = (요청 토큰 수 - 캐시와 겹치는 토큰 수) + 부하\n```\n\n- 겹침이 많아도 그 엔진이 꽉 찼으면 부하 항이 커져 다른 엔진으로 간다.\n- Dynamo 의 계산:\n  - 겹친 블록 수 × 16 을 토큰으로 바꿔 뺀다.\n  - 사용 중인 KV 블록 수와 대기 요청을 부하로 더한다.\n- 항상 최솟값만 고르면 한 엔진에 몰릴 수 있다. 그래서 확률적으로 고르는 방식 (온도를 둔 softmax 샘플링) 을 섞기도 한다.\n\n## Follow-up: 캐시 히트율을 높이려다 한 엔진에 몰리면 어떤 지표가 나빠지나요?\n\n**30초 답**\n\n- 몰린 엔진의 TPOT 와 대기열이 나빠지고, 다른 엔진은 논다.\n- 전체 처리량이 떨어지고 TTFT p99 가 튄다.\n\n**자세히**\n\n- 캐시 적중은 prefill 만 아낀다. decode 는 그대로 그 엔진에서 돈다.\n- 적중률 100 % 인 엔진 하나에 decode 가 전부 몰리면 KV 메모리가 꽉 찬다.\n- 그러면 preemption (진행 중인 요청을 멈추고 자원을 뺏는 것) 이 시작된다.\n- 그래서 cost 에 부하 항이 반드시 있어야 한다.\n- 라우터 평가도 적중률 하나가 아니라 TTFT · TPOT 분포로 한다.\n\n---\n\n### 손댄 곳\n\n- Dynamo kv-router 4건: policy fallback 관측성(T4), admission best overlap(#12303), KV 복구 진행률(#12314), DP rank 게이지(#10696) · dynamo-study/01-issues/\n",

   "md": "> THEORY · gpu · T1  \n> 원리 → theory/gpu/roofline.md, theory/transformer/flash_attention.md\n\n## 0. 먼저 알아둘 말\n\n| 말 | 뜻 |\n|---|---|\n| 커널 | GPU 에서 실행하는 함수 하나 |\n| matmul | 행렬 × 행렬. C = A × B 에서 C 의 한 칸은 A 의 한 행과 B 의 한 열을 곱해 더한 값 |\n| naive | 아무 최적화 없이 정의 그대로 짠 구현 |\n| HBM | GPU 의 큰 메모리 (global memory). 크지만 오가는 데 시간이 듦 |\n| shared memory (SRAM) | 블록 안 스레드들이 같이 쓰는 작고 빠른 메모리 |\n| 레지스터 | 스레드 하나가 계산 중인 값을 두는 가장 빠른 공간 |\n| warp | 스레드 32 개 묶음. 하드웨어가 실행하는 단위 |\n| 타일 | 큰 행렬을 작은 메모리에 들어가게 자른 조각 |\n| bank | shared memory 를 나눈 32 개의 칸막이. 한 bank 는 동시에 한 번만 접근 가능 |\n| tensor core | 작은 행렬곱을 한 명령으로 하는 GPU 안의 전용 회로 |\n| MMA | Matrix Multiply-Accumulate. tensor core 를 쓰는 행렬곱 명령 |\n| arithmetic intensity | 옮긴 바이트 하나당 연산 횟수 (FLOP/byte). 높을수록 연산 장치를 잘 씀 |\n| memory-bound · compute-bound | 메모리 대역폭이 한계인 상태 · 연산 능력이 한계인 상태 |\n| ncu | 커널 하나의 하드웨어 사용률을 보여 주는 NVIDIA 프로파일러 |\n| cuBLAS | NVIDIA 가 만든 행렬 연산 라이브러리. 직접 짠 커널의 비교 기준 |\n| Ampere · Hopper | NVIDIA GPU 세대 이름. A100 이 Ampere, H100 이 Hopper |\n\n## Q1: naive matmul 커널을 어떤 순서로 빠르게 만드나요?\n\n**30초 답**\n\n- 핵심은 HBM 에서 같은 값을 여러 번 읽지 않게 하는 것이다.\n- 순서: coalescing → shared memory 타일링 → 레지스터 타일링 → 벡터화 로드 → tensor core → 비동기 복사.\n- 각 단계의 뜻은 아래 표에 있다.\n- 단계마다 같은 바이트로 더 많이 계산하게 된다 (arithmetic intensity ↑).\n\n**자세히**\n\n| 단계 | 바꾸는 것 | 줄이는 것 |\n|---|---|---|\n| 0 naive | 스레드 하나가 C 한 칸. A 의 행, B 의 열을 HBM 에서 매번 읽음 | (기준) 숫자 2 개 (FP32 로 8 바이트) 를 읽어 곱셈 1 + 덧셈 1. 완전 memory-bound |\n| 1 coalescing | warp 의 32 스레드가 인접 주소를 읽도록 인덱스 배치. 그러면 하드웨어가 요청을 묶어 처리 | 메모리 전송 횟수 |\n| 2 shared memory 타일링 | 블록이 A·B 타일을 SRAM 에 올리고 블록 안에서 재사용 | HBM 읽기 약 1/타일 크기 |\n| 3 레지스터 타일링 | 스레드 하나가 C 여러 칸 (예 8×8) 을 레지스터에 누적 | shared memory 읽기 |\n| 4 벡터화 로드 | 숫자를 하나씩이 아니라 4 개씩 한 명령으로 읽음 (`float4`, 128 비트) | 로드 명령 수 |\n| 5 tensor core | MMA 명령으로 작은 행렬곱을 통째로. 입력은 BF16 · FP8 (16 · 8 비트 숫자 형식) | 연산 시간 (compute-bound 가 된 뒤에 효과) |\n| 6 비동기 복사 | 다음 타일을 가져오는 동안 현재 타일을 계산. 버퍼를 2 개 두고 번갈아 씀 (double buffering) | 로드 대기 시간 |\n\n- 실제로는 단계마다 ncu 로 memory-bound 인지 compute-bound 인지 확인하고 다음 단계를 고른다.\n- 목표선은 cuBLAS 대비 몇 % 인가다.\n\n**shared memory 를 쓸 때의 함정: bank conflict**\n\n- shared memory 는 32 개의 bank (동시에 한 번씩만 접근할 수 있는 칸막이) 로 나뉜다.\n- 숫자 하나 (4 바이트) 마다 다음 bank 로 넘어간다. 32 개마다 같은 bank 로 돌아온다.\n- 같은 warp 의 스레드 여러 개가 같은 bank 의 서로 다른 주소를 동시에 읽으면, 하드웨어가 한 번에 하나씩 차례로 처리한다. 이것이 bank conflict 다.\n\n| 접근 모양 | bank | 결과 |\n|---|---|---|\n| 스레드 i 가 `a[i]` | 32 개가 전부 다른 bank | 충돌 없음. 한 번에 끝 |\n| 스레드 i 가 `a[i * 32]` (폭 32 인 배열의 한 열) | 32 개가 전부 같은 bank | 32 번에 나눠 처리. 최대 32 배 느림 |\n| 전부 같은 주소를 읽음 | 같은 bank, 같은 주소 | 충돌 없음 |\n\n- 처방: 배열 폭을 32 대신 33 으로 잡는다 (padding). 그러면 열 방향 접근이 bank 를 하나씩 건너뛴다.\n- 확인: ncu 에 bank conflict 횟수가 나온다.\n\n## Q2: 배열 합 (reduction) 커널은 어떻게 최적화하나요?\n\n**30초 답**\n\n- reduction 은 배열 전체를 값 하나로 줄이는 연산이다 (합, 최댓값 등).\n- 블록 안에서 트리 모양으로 절반씩 더한다. 8 개 → 4 개 → 2 개 → 1 개.\n- 마지막 32 개는 shared memory 대신 warp shuffle 로 더한다. 같은 warp 의 스레드끼리 레지스터 값을 직접 주고받는 명령이다.\n- 블록마다 나온 결과는 atomic 연산 하나 (여러 스레드가 동시에 써도 안전한 덧셈) 또는 두 번째 커널로 합친다.\n\n**자세히**\n\n| 단계 | 문제 | 처방 |\n|---|---|---|\n| 트리 (하나 건너 하나씩 일함) | `tid % 2 == 0` 같은 조건 때문에 같은 warp 안에서 일하는 스레드와 쉬는 스레드가 갈림 (divergence) | 앞쪽 절반의 연속된 스레드가 일하도록 인덱스를 바꿈 (sequential addressing) |\n| shared memory 트리 | 단계마다 `__syncthreads()` (블록 전체가 기다리는 배리어) 가 필요 | 마지막 warp 는 shuffle 로 동기화 없이 |\n| 로드 | 첫 단계에서 스레드 절반이 놂 | 읽으면서 바로 2 개씩 (또는 여러 개) 더함 |\n| 블록 간 합 | 블록끼리는 `__syncthreads()` 로 맞출 수 없음 | 블록당 `atomicAdd` 한 번, 또는 커널을 두 번 실행 (2-pass) |\n\n```cpp\n// warp 32 개 값의 합: 레지스터끼리 직접 교환\n// off 만큼 떨어진 스레드의 v 를 받아 더한다.\n// 16, 8, 4, 2, 1 다섯 번이면 0 번 스레드에 전체 합\nfor (int off = 16; off > 0; off >>= 1)\n    v += __shfl_down_sync(0xffffffff, v, off);\n```\n\n## Q3: softmax 는 왜 여러 번 읽어야 하고, 어떻게 한 번으로 줄이나요?\n\n**30초 답**\n\n- softmax 는 점수들을 합이 1 인 비율로 바꾸는 함수다. exp 가 넘치지 않게 최댓값을 먼저 빼는 방식이 \"안전한 softmax\" 다.\n- 안전한 softmax 는 최댓값 구하기 → 합 구하기 → 나누기 (정규화) 로 데이터를 3 번 읽는다.\n- online softmax 는 최댓값과 합을 한 번에 들고 가며, 최댓값이 바뀌면 지금까지의 합을 다시 스케일한다.\n- FlashAttention 은 여기에 V 곱까지 합쳐, attention 의 n×n 점수 행렬 (n = 토큰 수) 을 HBM 에 쓰지 않는다.\n\n**자세히**\n\n- 3 번 읽기 → 2 번 읽기 (online softmax) → attention 전체 1 번 (FlashAttention).\n- 보정 식과 타일링은 flash_attention.md Q2, Q3 에 있다.\n- 같은 아이디어 (한 번 훑으며 통계를 갱신) 가 LayerNorm 의 평균 · 분산 계산에도 쓰인다. 이 방법의 이름이 Welford 알고리즘이다.\n  - RMSNorm 은 평균 · 분산을 쓰지 않는다. 제곱의 합만 한 번 훑어 구하면 된다.\n\n## Q4: Hopper 에서 matmul 을 \"비동기로 만든다\" 는 건 무슨 뜻인가요? (cp.async → TMA · WGMMA)\n\n**30초 답**\n\n- 로드 (메모리에서 타일을 가져오기) 와 행렬곱을 서로 기다리지 않게 하는 것이다.\n- 비동기 = 요청만 해 두고 끝나기를 기다리지 않고 다른 일을 하는 방식.\n- Ampere 의 cp.async 는 HBM → shared memory 복사를 레지스터를 거치지 않고 비동기로 한다.\n- Hopper 의 TMA 는 타일 복사를 전용 하드웨어가 주소 계산까지 맡고, WGMMA 는 tensor core 행렬곱을 비동기로 발행한다.\n\n**자세히**\n\n| 기능 | 세대 | 하는 일 | 효과 |\n|---|---|---|---|\n| cp.async | Ampere | global → shared 비동기 복사 | 로드 중에도 스레드가 계산 가능 |\n| TMA | Hopper | 다차원 타일 복사를 하드웨어가 수행, 스레드 하나가 발행 | 주소 계산·로드 명령에 쓰던 레지스터·스레드 해방 |\n| WGMMA | Hopper | 워프 4 개 (128 스레드) 단위 비동기 MMA, 피연산자를 shared memory 에서 직접 읽음 | 행렬곱 중에 다음 일을 발행 |\n\n- 이걸 묶는 구조가 warp specialization (warp 마다 역할을 나누는 것) 이다.\n  - producer warp: TMA 로 다음 타일을 가져온다.\n  - consumer warp 그룹: WGMMA 로 계산한다.\n- FA3 (FlashAttention 3) 와 최신 GEMM 이 이 구조다.\n  - GEMM: General Matrix Multiply. 일반 행렬곱 루틴을 부르는 이름.\n  - 예: CUTLASS (NVIDIA 의 행렬곱 템플릿 라이브러리), DeepGEMM (DeepSeek 의 FP8 행렬곱 라이브러리).\n\n## Follow-up: 커널이 \"빨라졌다\" 는 걸 어떻게 증명하나요?\n\n**30초 답**\n\n- 먼저 정확성: 기준 구현 (PyTorch, cuBLAS) 과 허용 오차 안에서 결과가 같은지 본다.\n- 그다음 제대로 잰 시간: 워밍업 (재기 전에 미리 몇 번 실행), GPU 동기화, 여러 번 반복한 중앙값.\n- 마지막으로 위치: cuBLAS 대비 몇 % 인가, 하드웨어의 최대 대역폭 · 최대 연산량 중 몇 % 를 썼나.\n\n**자세히**\n\n- 정확성 검사 없이 시간만 보면 일을 덜 하는 커널이 1 등이 된다.\n- 측정 함정은 profiling.md Q5 에 정리했다.\n- 입력 크기를 여러 개로 잰다. 작은 크기에서 빠른 커널이 큰 크기에서 느릴 수 있다.\n",

   "md": "> THEORY · transformer · T2  \n> 구현 → engine/vllm/attention_backends.md\n\n## 0. 먼저 알아둘 말\n\n| 말 | 뜻 |\n|---|---|\n| attention | 각 토큰이 다른 토큰들을 얼마나 볼지 점수를 매기고, 그 비율대로 정보를 섞는 연산 |\n| Q · K · V | 토큰마다 만드는 벡터 3 종 (질문 · 라벨 · 내용). 토큰 n 개면 각각 n×d 행렬 |\n| n · d | n = 시퀀스 길이 (토큰 수). d = 헤드 하나의 벡터 길이 (보통 128) |\n| 점수 행렬 S | Q × Kᵀ. 모든 토큰 쌍의 점수라서 크기가 n×n |\n| softmax | 점수 한 줄을 합이 1 인 비율로 바꾸는 함수. 그 줄의 최댓값과 합이 필요 |\n| HBM | GPU 의 큰 메모리. 크지만 오가는 데 시간이 듦 |\n| SRAM (shared memory) | SM 안의 작고 빠른 메모리. 여기서 끝내면 HBM 왕복이 없음 |\n| 타일 (블록) | 큰 행렬을 SRAM 에 들어갈 크기로 자른 조각 |\n| FLOP | 부동소수점 연산 1 번 |\n| arithmetic intensity | 옮긴 바이트 하나당 연산 횟수 (FLOP/byte). H100 의 경계값 (ridge point) 은 약 295 |\n| memory-bound · compute-bound | 메모리 대역폭이 한계인 상태 · 연산 능력이 한계인 상태 |\n| forward · backward | 추론 방향 계산 · 학습 때 기울기 (gradient) 를 거꾸로 구하는 계산 |\n| BF16 · FP32 · FP8 | 숫자 형식. 숫자 하나에 16 · 32 · 8 비트 |\n\n## Q1: 표준 attention 이 느린 진짜 이유는 FLOPs 인가요 메모리인가요?\n\n**30초 답**\n\n- 메모리다.\n- 표준 attention 은 n×n 점수 행렬을 HBM 에 쓰고, softmax 하고, 다시 읽는다.\n- 이 왕복이 연산 (FLOP) 보다 훨씬 비싸다.\n\n**자세히**\n\n| 항목 | 양 | 평가 |\n|---|---|---|\n| 연산 | Q × Kᵀ 에 2n²d FLOP | H100 이 금방 한다 |\n| 메모리 | n² 개 숫자 × 2 바이트를 쓰고 다시 읽음 | n = 8K 면 헤드 하나에 약 128 MB. 이걸 세 단계에서 반복 |\n\n- 세 단계: Q × Kᵀ 결과 쓰기, softmax 결과 쓰기, V 와 곱하려고 다시 읽기.\n- 그래서 arithmetic intensity 가 d 수준 (약 128) 에 머문다. ridge point 295 아래라 memory-bound 다.\n- 빠르게 하려면 FLOP 이 아니라 바이트를 줄여야 한다. ⭐️\n\n## Q2: FlashAttention 이 '한 번도 n×n 행렬을 HBM 에 쓰지 않는' 방법을 설명해보세요 (tiling).\n\n**30초 답**\n\n- Q · K · V 를 SRAM 에 들어가는 타일로 자른다.\n- 타일 쌍마다 점수 → softmax → V 곱까지 SRAM 안에서 끝낸다.\n- 누적한 결과만 HBM 에 한 번 쓴다. n×n 행렬이 통째로 존재하는 순간이 없다.\n\n**자세히**\n\n```text\nfor Q 타일 i:\n    acc = 0, 지금까지의 최댓값 · 합 초기화\n    for K, V 타일 j:\n        S_ij = Q_i × K_jᵀ          (SRAM 안)\n        P_ij = exp(S_ij - 최댓값)   (SRAM 안. online softmax 로 보정, Q3)\n        acc += P_ij × V_j           (SRAM 안)\n    O_i = acc ÷ 합                  (HBM 에 한 번만 쓰기)\n```\n\n| | 표준 | FlashAttention |\n|---|---|---|\n| HBM 을 오가는 양 | n² 에 비례 | n·d 에 비례 |\n| 긴 시퀀스에서 | memory-bound | compute-bound 로 넘어감 |\n\n- backward 에서도 n×n 행렬을 저장해 두지 않는다. 필요할 때 다시 계산한다 (recompute).\n\n## Q3: online softmax 는 어떻게 블록 단위로 softmax 를 맞추나요?\n\n**30초 답**\n\n- softmax 는 한 줄 전체의 최댓값과 합을 알아야 한다. 타일 단위로는 아직 모른다.\n- 그래서 \"지금까지의 최댓값 m\" 과 \"지금까지의 합 l\" 을 들고 간다.\n- 새 타일에서 더 큰 값이 나오면, 이전에 모은 값들을 새 기준으로 다시 스케일한다.\n\n**자세히**\n\n1. 타일 j 까지는 exp(S - m_j) 기준으로 모았다.\n2. 타일 j+1 에서 더 큰 최댓값 m_{j+1} 이 나왔다.\n3. 이전 누적 acc 와 합 l 에 exp(m_j - m_{j+1}) 을 곱한다. 새 기준으로 맞추는 보정이다.\n4. 새 타일의 값을 더한다.\n\n- 끝까지 가면 전체를 한 번에 softmax 한 것과 수학적으로 같다.\n- 이 보정 덕에 데이터를 한 번만 훑고 끝난다.\n\n## Q4: FA2 → FA3 에서 무엇이 달라졌나요?\n\n**30초 답**\n\n- FA2: 스레드 블록 사이의 일 나누기를 개선하고 행렬곱이 아닌 연산을 줄여 GPU 활용률을 올렸다.\n- FA3: Hopper (H100 세대) 전용이다. 메모리 이동과 행렬곱을 겹쳐 돌리고 FP8 을 지원한다.\n\n**자세히**\n\n| 버전 | 속도 | 활용률 | 핵심 |\n|---|---|---|---|\n| FA1 → FA2 | 약 2 배 | A100 에서 50-73 % | 병렬화 개선, 비행렬 연산 감소 |\n| FA2 → FA3 | H100 에서 1.5-2 배 | 약 75 %. FP8 은 약 1.2 PFLOPS | TMA + 비동기 WGMMA, warp 역할 분리 |\n\n- TMA: 타일 복사를 전용 하드웨어가 맡는 Hopper 기능.\n- WGMMA: tensor core 행렬곱을 비동기로 발행하는 Hopper 명령.\n- warp 역할 분리: producer warp 가 다음 타일을 가져오는 동안 consumer warp 가 계산한다.\n- Blackwell (다음 세대) 은 또 다른 구현이다 (FA4, CuTeDSL).\n- TMA · WGMMA 설명은 kernel_optimization 카드 Q4 에 있다.\n\n## Follow-up: backward 에서 dS 를 BF16 으로 라운딩하면 왜 행합이 0 에서 깨지나요?\n\n**30초 답**\n\n- dS 는 점수 행렬 S 에 대한 기울기다. 각 행은 softmax 의 기울기라 정확히는 합이 0 이다.\n- BF16 으로 반올림하면 원소마다 오차가 붙어 합이 0 에서 벗어난다.\n- 그 오차가 K 와 곱해져 dQ · dK (Q 와 K 의 기울기) 에 편향으로 들어간다.\n\n**자세히**\n\n- BF16 은 가수 (유효숫자 부분) 가 7 비트라 상대 오차가 약 0.4 % 다.\n- 한 행의 원소가 수천 개면 오차가 서로 상쇄되지 않고 쌓일 수 있다.\n- GProj 논문 (arXiv 2609.34272) 이 이 증상을 분석했다.\n- Dao-AILab PR #2893 / #2908 이 Blackwell sparse-MLA 경로를 FP32 로 고쳤다.\n- Hopper dense 경로는 미수정으로 추정한다. Shicheng 과의 접점으로 보고 있다 (Study/3.md).\n\n---\n\n### 손댄 곳\n\n- Shicheng Wen 협업 학습 · USC/Research-Opportunity/Shicheng-Wen/Study/1.md 2.md 3.md (FA3 역전파 BF16 행합 문제, GProj 논문)\n",

   "md": "> THEORY · design · T1  \n> 원리 → theory/inference/serving_system_design.md\n\n- 문항: \"회의 요약용 LLM 을 초당 수백 요청, p95 500 ms 로 서빙하라.\"\n- 문항과 숫자는 전부 가정이다. 면접에서는 가정을 소리 내어 말하고 시작한다.\n\n## 0. 먼저 알아둘 말\n\n| 말 | 뜻 |\n|---|---|\n| QPS | 초당 들어오는 요청 수 |\n| p95 | 요청을 빠른 순으로 줄 세웠을 때 95 % 지점의 값. 느린 쪽 꼬리 |\n| TTFT | 요청부터 첫 토큰이 나올 때까지 걸린 시간 |\n| TPOT | 토큰 하나를 만드는 데 걸린 시간 |\n| prefill · decode | 입력 전체를 한 번에 처리하는 단계 · 토큰을 하나씩 만드는 단계 |\n| KV 캐시 | 지나간 토큰의 계산 결과 저장분. 요청마다 GPU 메모리를 차지 |\n| 연속 배칭 | 스텝마다 끝난 요청을 빼고 새 요청을 끼워 넣는 배치 방식 |\n| chunked prefill | 긴 입력을 조각내 여러 스텝에 나눠 넣는 것 |\n| P/D 분리 | prefill 전용 GPU 와 decode 전용 GPU 를 따로 두는 구조 |\n| 프리픽스 캐시 | 앞부분이 같은 요청끼리 KV 캐시를 재사용하는 것 |\n| 양자화 · FP8 | 숫자를 더 적은 비트로 저장 · 8 비트 숫자 형식 |\n| 레플리카 | 같은 엔진의 복제본 |\n| 콜드 스타트 | 새 엔진이 떠서 요청을 받을 수 있을 때까지 걸리는 준비 시간 |\n| 카나리 | 새 버전을 트래픽 일부에만 먼저 내보내 보는 배포 방식 |\n| 여유분 (headroom) | 피크와 장애에 대비해 계산값보다 더 잡는 용량 |\n\n## Q1: 45 분을 어떤 순서로 끌고 가나요?\n\n**30초 답**\n\n- 여섯 단계다: 요구사항 → 용량 암산 → 구조 → 핵심 결정 → 우선순위 → 장애와 운영.\n- 그림부터 그리지 않는다. 숫자를 먼저 받아야 구조가 정해진다.\n\n**자세히**\n\n| # | 단계 | 시간 | 내놓는 것 |\n|---|---|---|---|\n| 1 | 요구사항 질문 | 5 분 | 모델, 길이, QPS, 지연 목표를 숫자로 |\n| 2 | 용량 암산 | 5 분 | GPU 몇 장인지 |\n| 3 | 구조 | 10 분 | 상자 그림과 요청이 흐르는 길 |\n| 4 | 핵심 결정 | 10 분 | 선택 4 개와 각각의 대가 |\n| 5 | 우선순위 | 5 분 | 급한 요청과 안 급한 요청을 나누는 법 |\n| 6 | 장애와 운영 | 10 분 | 무엇이 먼저 무너지고 어떻게 알아채나 |\n\n- 5 번은 설계 연습 2 카드에 있다.\n\n## Q2: 처음 5 분에 무엇을 묻고, 어떤 가정을 세우나요?\n\n**30초 답**\n\n- 가장 먼저 \"500 ms 는 무엇의 시간인가\" 를 묻는다.\n- 요약 전체가 500 ms 에 나올 수는 없다. 300 토큰 × 25 ms = 7.5 초다.\n- 그래서 500 ms 는 TTFT 로 확인하고, TPOT 목표를 따로 받는다.\n\n**물을 것과 이 카드의 가정**\n\n| 질문 | 가정 | 정해지는 것 |\n|---|---|---|\n| 모델 크기는 | 파라미터 80 억 개, BF16 (숫자당 2 바이트) 로 16 GB | GPU 한 장에 들어가는지 |\n| 입력 길이는 | 8,000 토큰 (약 40 분 회의록) | prefill 계산량, KV 메모리 |\n| 출력 길이는 | 300 토큰 | decode 시간 |\n| 트래픽은 | 200 QPS | GPU 수 |\n| 지연 목표는 | TTFT p95 500 ms, TPOT 25 ms | 배치 상한 |\n| 실시간인가 | 회의가 끝난 뒤 한 번 | 목표를 풀 수 있는지 |\n| GPU 는 | H100 (메모리 80 GB) | 장당 처리량 |\n\n- 마지막에서 둘째 줄이 중요하다.\n  - 요약은 회의가 끝난 뒤에 본다.\n  - 500 ms 가 정말 필요한지 되물으면 비용을 크게 줄일 여지가 생긴다.\n\n## Q3: GPU 가 몇 장 필요한지 어떻게 암산하나요?\n\n**30초 답**\n\n- prefill 은 계산량으로, decode 는 메모리로 따로 센다.\n- prefill 64 장 + decode 30 장 = 94 장이다.\n- 여유분 30 % 를 더해 약 120 장으로 답한다.\n\n**쓰는 숫자**\n\n| 숫자 | 값 |\n|---|---|\n| H100 최대 연산 능력 | 1000 TFLOPS (1 TFLOP = 연산 1 조 번) |\n| 실제로 내는 연산 능력 | 400 TFLOPS (최대의 40 % 로 가정) |\n| H100 메모리 대역폭 | 3.35 TB/s |\n| 토큰 하나의 계산량 | 2 × 파라미터 수 = 160 억 FLOP |\n| 토큰 하나의 KV 캐시 | 0.13 MB |\n\n- 토큰 하나의 계산량: 가중치 하나마다 곱셈 1 번 + 덧셈 1 번이라 2 를 곱한다.\n- 토큰 하나의 KV 캐시: 32 층 × k, v 2 개 × 1024 숫자 × 2 바이트.\n  - 이 모델은 KV 헤드가 8 개, 헤드당 128 차원이라 1024 숫자다.\n\n**① prefill: 계산량으로 센다**\n\n| 단계 | 계산 | 결과 |\n|---|---|---|\n| 요청 하나의 계산량 | 8,000 토큰 × 160 억 FLOP | 128 TFLOP |\n| GPU 한 장에서 걸리는 시간 | 128 ÷ 400 | 0.32 초 |\n| 초당 필요한 계산량 | 200 QPS × 128 | 25,600 TFLOPS |\n| GPU 수 | 25,600 ÷ 400 | 64 장 |\n\n**② decode: 메모리로 센다**\n\n| 단계 | 계산 | 결과 |\n|---|---|---|\n| 요청 하나의 KV 캐시 | 8,300 토큰 × 0.13 MB | 약 1.1 GB |\n| KV 에 쓸 메모리 | 80 − 16 (가중치) − 여유 | 약 55 GB |\n| GPU 한 장의 동시 요청 수 | 55 ÷ 1.1 | 50 개 |\n| 스텝 하나의 시간 | (16 + 55) GB ÷ 3.35 TB/s | 약 21 ms |\n| 요청이 머무는 시간 | 300 토큰 × 25 ms | 7.5 초 |\n| 동시에 떠 있는 요청 수 | 200 QPS × 7.5 초 | 1,500 개 |\n| GPU 수 | 1,500 ÷ 50 | 30 장 |\n\n- 스텝 하나의 시간: decode 는 memory-bound 라 매 스텝 가중치와 KV 를 전부 읽는 시간이 바닥이다.\n  - memory-bound: 메모리에서 데이터를 가져오는 속도가 한계인 상태.\n- 동시에 떠 있는 요청 수 = 들어오는 속도 × 머무는 시간. 이 식 하나만 외우면 된다.\n\n**③ 합치고 점검한다**\n\n- 64 + 30 = 94 장. 여유분 30 % 를 더하면 약 120 장.\n- TTFT 점검: prefill 만 0.32 초다. 대기열에서 0.18 초 넘게 기다리면 500 ms 를 넘긴다.\n- 그래서 \"500 ms 는 빠듯하다\" 가 이 암산의 결론이다. Q5 의 결정이 여기서 나온다.\n- 뺀 것: attention 의 토큰 수 제곱 항. 8,000 토큰에서는 약 25 % 가 더 든다.\n\n## Q4: 구조를 그리고 요청 하나가 흐르는 길을 설명해보세요.\n\n**30초 답**\n\n- 게이트웨이 → 라우터 → 엔진 풀 순서로 흐른다.\n- 오토스케일러는 지표를 보고 엔진 수를 바꾼다.\n- 응답은 토큰이 나오는 대로 스트리밍으로 돌려준다.\n\n**그림**\n\n<div class=\"fig\">\n<svg viewBox=\"0 0 360 318\" width=\"100%\" style=\"max-width:520px\" font-size=\"12\" font-family=\"inherit\">\n<defs><marker id=\"sdA1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--ink-2)\"/><\/marker><\/defs>\n<g fill=\"var(--card-2)\" stroke=\"var(--ink-2)\" stroke-width=\"1.2\">\n<rect x=\"120\" y=\"6\" width=\"120\" height=\"30\" rx=\"6\"/>\n<rect x=\"80\" y=\"60\" width=\"200\" height=\"42\" rx=\"6\"/>\n<rect x=\"80\" y=\"126\" width=\"200\" height=\"42\" rx=\"6\"/>\n<rect x=\"16\" y=\"192\" width=\"328\" height=\"66\" rx=\"6\"/>\n<rect x=\"16\" y=\"282\" width=\"150\" height=\"30\" rx=\"6\"/>\n<rect x=\"194\" y=\"282\" width=\"150\" height=\"30\" rx=\"6\"/>\n<\/g>\n<g fill=\"var(--card)\" stroke=\"var(--ink-2)\" stroke-width=\"1\">\n<rect x=\"30\" y=\"220\" width=\"66\" height=\"28\" rx=\"4\"/>\n<rect x=\"108\" y=\"220\" width=\"66\" height=\"28\" rx=\"4\"/>\n<rect x=\"186\" y=\"220\" width=\"66\" height=\"28\" rx=\"4\"/>\n<rect x=\"264\" y=\"220\" width=\"66\" height=\"28\" rx=\"4\"/>\n<\/g>\n<g stroke=\"var(--ink-2)\" stroke-width=\"1.2\" fill=\"none\" marker-end=\"url(#sdA1)\">\n<path d=\"M180 36V58\"/><path d=\"M180 102V124\"/><path d=\"M180 168V190\"/>\n<path d=\"M90 258V280\"/><path d=\"M270 282V260\"/>\n<\/g>\n<g fill=\"var(--ink)\" text-anchor=\"middle\">\n<text x=\"180\" y=\"25\">클라이언트<\/text>\n<text x=\"180\" y=\"78\" font-weight=\"600\">게이트웨이<\/text>\n<text x=\"180\" y=\"94\" fill=\"var(--ink-2)\" font-size=\"11\">인증 · 한도 · 대기열<\/text>\n<text x=\"180\" y=\"144\" font-weight=\"600\">라우터<\/text>\n<text x=\"180\" y=\"160\" fill=\"var(--ink-2)\" font-size=\"11\">부하와 캐시를 보고 엔진 선택<\/text>\n<text x=\"180\" y=\"210\" font-weight=\"600\">엔진 풀 (vLLM, GPU 약 120 장)<\/text>\n<text x=\"63\" y=\"238\" font-size=\"11\">엔진<\/text><text x=\"141\" y=\"238\" font-size=\"11\">엔진<\/text>\n<text x=\"219\" y=\"238\" font-size=\"11\">엔진<\/text><text x=\"297\" y=\"238\" font-size=\"11\">…<\/text>\n<text x=\"91\" y=\"301\">오토스케일러<\/text>\n<text x=\"269\" y=\"301\">모델 저장소<\/text>\n<text x=\"118\" y=\"273\" fill=\"var(--ink-2)\" font-size=\"11\">지표<\/text>\n<text x=\"300\" y=\"273\" fill=\"var(--ink-2)\" font-size=\"11\">가중치<\/text>\n<\/g>\n<\/svg>\n<\/div>\n\n**요청 하나가 흐르는 길**\n\n| 순서 | 어디서 | 하는 일 |\n|---|---|---|\n| 1 | 게이트웨이 | 인증, 입력 토큰 수 확인, 한도 초과면 429 (요청이 너무 많다는 응답) |\n| 2 | 게이트웨이 대기열 | 엔진이 꽉 차면 여기서 기다림. 대기열 길이에 상한을 둠 |\n| 3 | 라우터 | 덜 바쁜 엔진, 같은 회의록의 KV 를 가진 엔진을 고름 |\n| 4 | 엔진 | prefill 뒤 decode. 연속 배칭으로 다른 요청과 같이 돎 |\n| 5 | 응답 길 | 토큰이 나오는 대로 클라이언트에 흘려보냄 |\n\n- 층마다 맡은 일과 실패 증상은 serving_system_design.md Q2 에 있다.\n\n## Q5: 핵심 결정 네 가지를 이 문항에서는 어떻게 고르나요?\n\n**30초 답**\n\n- 연속 배칭은 켠다.\n- P/D 분리는 chunked prefill 로 먼저 버텨 보고 지표를 본 뒤 정한다.\n- 프리픽스 캐시는 같은 회의를 여러 번 물을 때만 이득이다.\n- 양자화는 품질을 확인한 뒤 FP8 로 간다.\n\n**자세히**\n\n| 결정 | 이 문항에서의 선택 | 이유 | 대가 |\n|---|---|---|---|\n| 연속 배칭 | 켠다 | 요청마다 길이가 달라 고정 배치는 빈자리가 생김 | 배치가 크면 TPOT 가 늘어남. 상한 필요 |\n| P/D 분리 | 한 풀 + chunked prefill 로 시작 | 입력 8,000 에 출력 300 이라 prefill 이 무겁다. 긴 prefill 이 옆 요청의 decode 를 멈춰 세움 | 분리하면 요청당 KV 1.1 GB 를 옮겨야 함 |\n| 프리픽스 캐시 라우팅 | 회의 ID 로 같은 엔진에 보냄 | 요약, 할 일 목록, 질문 답이 같은 회의록을 공유. 두 번째부터 prefill 을 건너뜀 | 한 엔진에 몰릴 수 있어 부하도 같이 봄 |\n| 양자화 | FP8 가중치 | 가중치가 8 GB 로 줄어 KV 자리가 늘고 스텝이 빨라짐 | 요약 품질을 따로 검증해야 함 |\n\n- 내 경험을 넣는 자리: Amazon 프로젝트에서 입력 16K 와 32K 사이에서 분리의 이득이 뒤집혔다 (Story Deck A1, A2).\n- 다섯째 선택지: 요구사항을 푼다.\n  - TTFT 목표를 2 초로 풀면 배치를 키울 수 있어 GPU 수가 준다.\n  - 요약은 회의 뒤에 보므로 물어볼 만하다.\n\n## Q6: 장애와 운영에서 무엇을 말해야 하나요?\n\n**30초 답**\n\n- 여섯 가지를 짚는다: 노드 장애, 콜드 스타트, 긴 입력 폭주, 오토스케일, 버전 배포, 모니터링.\n- 오토스케일 기준은 GPU 사용률이 아니라 대기열 길이와 TTFT p95 다.\n\n**자세히**\n\n| 상황 | 무슨 일이 생기나 | 대응 |\n|---|---|---|\n| GPU 한 대가 죽음 | 그 엔진의 요청과 KV 가 사라짐 | 다른 엔진에서 처음부터 다시. 여유분이 이때 쓰임 |\n| 콜드 스타트 | 가중치 16 GB 를 읽고 엔진을 데우는 데 수십 초에서 분 단위 | 여유 레플리카를 미리 띄움. 준비가 끝나기 전에는 트래픽을 주지 않음 |\n| 긴 입력 폭주 | 3 만 토큰 요청 몇 개가 prefill 을 독차지 | 입력 길이 상한, chunked prefill, 긴 요청 전용 대기열 |\n| 오토스케일 | 늦게 늘리면 TTFT 가 터지고, 안 줄이면 밤에 GPU 가 놂 | 대기열 길이와 TTFT p95 로 늘림. 정시 피크는 미리 늘림 |\n| 버전 배포 | 새 모델이나 새 엔진이 느리거나 품질이 떨어질 수 있음 | 카나리로 5 % 만 먼저. 지표가 나쁘면 되돌림 |\n| 모니터링 | 평균만 보면 꼬리를 놓침 | TTFT · TPOT 의 p95, 대기열 길이, 요청 밀어내기 횟수, 429 비율 |\n\n- \"엔진을 데운다\" 는 것: 첫 요청이 느리지 않도록 CUDA graph 캡처와 컴파일을 미리 끝내는 일.\n  - CUDA graph: 커널 실행 순서를 녹화해 두고 한 번에 재생하는 기능.\n- GPU 사용률이 기준이 못 되는 이유: 적당히 바쁠 때도 과부하일 때도 100 % 근처다. 대기열이 쌓이는지, 지연이 늘었는지를 보여 주지 못한다.\n  - GPU 사용률 (nvidia-smi) 은 커널이 돌고 있던 시간의 비율이다. 요청이 몇 개만 있어도 금방 높아진다.\n\n## Follow-up: 2 시간 회의 (3 만 토큰) 가 들어오면 무엇이 달라지나요?\n\n**30초 답**\n\n- prefill 이 약 4 배 (1.2 초) 가 되어 500 ms 를 못 맞춘다.\n- KV 가 요청당 약 4 GB 가 되어 GPU 한 장의 동시 요청이 50 개에서 13 개로 준다.\n- 긴 요청을 따로 다루거나 입력을 잘라서 요약한다.\n\n**자세히**\n\n| 방법 | 하는 일 | 대가 |\n|---|---|---|\n| 긴 요청 전용 풀 | 짧은 요청과 긴 요청의 대기열과 GPU 를 나눔 | 풀이 둘이라 한쪽이 놀 수 있음 |\n| 나눠서 요약 | 회의록을 조각내 각각 요약한 뒤 요약들을 다시 요약 | 호출이 여러 번. 조각 사이 맥락을 잃을 수 있음 |\n| P/D 분리 다시 검토 | prefill 이 길수록 decode 를 막는 시간이 길어짐 | KV 4 GB 를 옮기는 시간 |\n| 목표를 길이별로 | 긴 입력은 TTFT 목표를 따로 둠 | 사용자에게 설명이 필요 |\n",

   "md": "> THEORY · design · T1  \n> 원리 → theory/inference/serving_system_design.md (Follow-up 2)\n\n- 문항: \"실시간 자막, 번역, 회의 요약을 한 GPU 풀에서 돌려라.\"\n- 문항과 숫자는 전부 가정이다. 설계 연습 1 과 다른 부분만 적는다.\n\n## 0. 먼저 알아둘 말\n\n| 말 | 뜻 |\n|---|---|\n| ASR | Automatic Speech Recognition. 음성을 글자로 바꾸는 모델 |\n| 스트리밍 | 입력이 끝나기를 기다리지 않고 조금씩 받아 조금씩 내보내는 방식 |\n| 청크 | 스트리밍에서 한 번에 보내는 조각. 예: 오디오 0.5 초 |\n| 실시간 배속 | GPU 가 오디오 1 초를 몇 초 만에 처리하나. 100 배속이면 0.01 초 |\n| 세션 | 회의 하나의 자막 스트림처럼 한동안 이어지는 연결 |\n| 세션 고정 | 같은 세션의 청크를 항상 같은 엔진에 보내는 것 (session affinity) |\n| 동적 배칭 | 요청을 몇 ms 모았다가 한 번에 GPU 에 넣는 것 |\n| 우선순위 클래스 | 요청을 급한 정도로 나눈 등급 |\n| preemption | 진행 중인 요청을 멈추고 자원을 뺏는 것 |\n| 예약 용량 | 특정 클래스만 쓰도록 떼어 둔 GPU |\n| 어드미션 컨트롤 | 요청을 받을지 말지 입구에서 정하는 것 |\n| 줄 막힘 | 앞의 긴 작업 때문에 뒤의 짧은 작업이 기다리는 현상 (head-of-line blocking) |\n| 단계적 성능 저하 | 과부하 때 덜 중요한 기능부터 끄거나 늦추는 것 (graceful degradation) |\n| SLO | 지키기로 한 구체적 목표값. 예: 자막 지연 p95 1 초 |\n\n## Q1: 세 작업은 무엇이 다른가요?\n\n**30초 답**\n\n- 자막은 짧은 청크가 끊임없이 들어오고 1 초 안에 답해야 한다.\n- 번역은 자막 뒤에 붙어 같은 속도로 따라간다.\n- 요약은 길고 무겁지만 몇 분 늦어도 된다.\n- 그래서 SLO 를 작업마다 따로 정하는 것이 첫 답이다.\n\n**자세히**\n\n| | 자막 (ASR) | 번역 | 요약 |\n|---|---|---|---|\n| 입력 | 오디오 청크 0.5 초씩 | 자막 한 문장 (수십 토큰) | 회의록 8,000 토큰 이상 |\n| 모델 | ASR 모델 (LLM 보다 훨씬 작음) | 번역 모델 또는 작은 LLM | 큰 LLM |\n| 지연 목표 | 말한 뒤 1 초 안 | 자막 뒤 0.5 초 안 | 회의 뒤 몇 분 안 |\n| 재는 지표 | 청크 지연 p95 | 문장 지연 p95 | 완료 시각, 비용 |\n| 부하 모양 | 회의 내내 일정 | 자막 × 켜 둔 언어 수 | 회의가 끝날 때 몰림 |\n| 상태 | 세션이 이어짐 | 문장마다 독립 | 요청마다 독립 |\n| 늦으면 | 바로 티가 남 | 바로 티가 남 | 거의 모름 |\n\n- 우선순위는 자막 > 번역 > 요약 이다.\n- 번역은 자막이 있어야 돌 수 있으므로 자막보다 앞설 수 없다.\n\n## Q2: 한 풀로 묶으면 무엇이 좋고 무엇이 위험한가요?\n\n**30초 답**\n\n- 좋은 점: 피크가 서로 엇갈려 같은 GPU 를 번갈아 쓴다.\n- 위험: 긴 요약이 자막을 막는 줄 막힘, 그리고 여러 모델의 메모리 다툼이다.\n\n**자세히**\n\n| | 내용 |\n|---|---|\n| 좋은 점 1 | 자막은 회의 중에, 요약은 회의가 끝난 뒤에 몰린다. 풀을 나누면 한쪽이 놀 때 다른 쪽이 못 쓴다 |\n| 좋은 점 2 | 장애용 여유분을 세 작업이 같이 쓴다 |\n| 위험 1 | 요약의 긴 prefill (입력 전체를 한 번에 처리하는 단계) 이 GPU 를 잡으면 자막 청크가 기다린다 |\n| 위험 2 | GPU 한 장에 모델 여러 개를 올리면 메모리가 모자라고 서로 느려진다 |\n| 위험 3 | GPU 를 다른 모델용으로 바꾸려면 가중치를 다시 읽어야 한다. 분 단위가 걸린다 |\n\n- 결론: 풀은 하나로 보되, GPU 한 장에는 모델 하나만 올린다.\n- 모델 사이의 경계 (어느 GPU 가 어느 모델인지) 를 천천히 옮긴다.\n\n## Q3: 구조를 그려보세요.\n\n**30초 답**\n\n- 입구에서 요청에 클래스를 붙인다.\n- 클래스별 대기열을 두고, 스케줄러가 급한 것부터 꺼낸다.\n- 풀은 자막 예약 구역과 공유 구역으로 나눈다.\n\n**그림**\n\n<div class=\"fig\">\n<svg viewBox=\"0 0 360 300\" width=\"100%\" style=\"max-width:520px\" font-size=\"12\" font-family=\"inherit\">\n<defs><marker id=\"sdA2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--ink-2)\"/><\/marker><\/defs>\n<g fill=\"var(--card-2)\" stroke=\"var(--ink-2)\" stroke-width=\"1.2\">\n<rect x=\"10\" y=\"6\" width=\"104\" height=\"44\" rx=\"6\"/>\n<rect x=\"128\" y=\"6\" width=\"104\" height=\"44\" rx=\"6\"/>\n<rect x=\"246\" y=\"6\" width=\"104\" height=\"44\" rx=\"6\"/>\n<rect x=\"10\" y=\"76\" width=\"104\" height=\"30\" rx=\"6\"/>\n<rect x=\"128\" y=\"76\" width=\"104\" height=\"30\" rx=\"6\"/>\n<rect x=\"246\" y=\"76\" width=\"104\" height=\"30\" rx=\"6\"/>\n<rect x=\"60\" y=\"134\" width=\"240\" height=\"42\" rx=\"6\"/>\n<rect x=\"10\" y=\"204\" width=\"340\" height=\"90\" rx=\"6\"/>\n<\/g>\n<g fill=\"var(--card)\" stroke=\"var(--ink-2)\" stroke-width=\"1\">\n<rect x=\"22\" y=\"230\" width=\"150\" height=\"54\" rx=\"4\"/>\n<rect x=\"188\" y=\"230\" width=\"150\" height=\"54\" rx=\"4\" stroke-dasharray=\"4 3\"/>\n<\/g>\n<g stroke=\"var(--ink-2)\" stroke-width=\"1.2\" fill=\"none\" marker-end=\"url(#sdA2)\">\n<path d=\"M62 50V74\"/><path d=\"M180 50V74\"/><path d=\"M298 50V74\"/>\n<path d=\"M62 106L120 132\"/><path d=\"M180 106V132\"/><path d=\"M298 106L240 132\"/>\n<path d=\"M180 176V202\"/>\n<\/g>\n<g fill=\"var(--ink)\" text-anchor=\"middle\">\n<text x=\"62\" y=\"24\" font-weight=\"600\">자막<\/text><text x=\"62\" y=\"41\" fill=\"var(--ink-2)\" font-size=\"11\">1 초 안<\/text>\n<text x=\"180\" y=\"24\" font-weight=\"600\">번역<\/text><text x=\"180\" y=\"41\" fill=\"var(--ink-2)\" font-size=\"11\">0.5 초 안<\/text>\n<text x=\"298\" y=\"24\" font-weight=\"600\">요약<\/text><text x=\"298\" y=\"41\" fill=\"var(--ink-2)\" font-size=\"11\">몇 분 안<\/text>\n<text x=\"62\" y=\"95\">대기열 1 순위<\/text>\n<text x=\"180\" y=\"95\">대기열 2 순위<\/text>\n<text x=\"298\" y=\"95\">대기열 3 순위<\/text>\n<text x=\"180\" y=\"152\" font-weight=\"600\">스케줄러<\/text>\n<text x=\"180\" y=\"168\" fill=\"var(--ink-2)\" font-size=\"11\">급한 대기열부터 꺼냄<\/text>\n<text x=\"180\" y=\"222\" font-weight=\"600\">GPU 풀<\/text>\n<text x=\"97\" y=\"252\">자막 예약 구역<\/text><text x=\"97\" y=\"270\" fill=\"var(--ink-2)\" font-size=\"11\">자막만 씀<\/text>\n<text x=\"263\" y=\"252\">공유 구역<\/text><text x=\"263\" y=\"270\" fill=\"var(--ink-2)\" font-size=\"11\">번역 · 요약, 경계가 움직임<\/text>\n<\/g>\n<\/svg>\n<\/div>\n\n**구역 나누기**\n\n| 구역 | 누가 쓰나 | 크기를 정하는 법 |\n|---|---|---|\n| 자막 예약 구역 | 자막만 | 평소 자막 부하 + 여유분. 절대 뺏기지 않음 |\n| 공유 구역 | 번역과 요약 | 번역이 먼저 쓰고 남는 만큼 요약이 씀 |\n| 경계 | 자막이 예약 구역을 넘치면 공유 구역의 GPU 를 자막용으로 바꿈 | 바꾸는 데 분 단위. 그래서 넘치기 전에 미리 옮김 |\n\n## Q4: 자막이 밀리기 시작하면 우선순위를 어떻게 지키나요?\n\n**30초 답**\n\n- 요약부터 늦춘다. 그다음 번역을 줄인다. 자막은 끝까지 지킨다.\n- 수단은 우선순위 대기열, 예약 용량, 요약 preemption, 입구에서 접수 늦추기다.\n\n**과부하 때 내려가는 순서**\n\n| 단계 | 하는 일 | 사용자가 느끼는 것 |\n|---|---|---|\n| 1 | 요약 접수를 늦추고 한가한 시간으로 미룸 | 요약이 몇 분 더 늦게 옴 |\n| 2 | 돌고 있던 요약을 멈추고 GPU 를 내줌 | 위와 같음. 멈춘 요약은 다시 계산 |\n| 3 | 번역을 더 작은 모델로, 또는 언어 수를 줄임 | 번역 품질이 조금 떨어짐 |\n| 4 | 자막 청크를 키워 GPU 호출 수를 줄임 | 자막이 조금 더 늦게 뜸 |\n| 5 | 새 자막 세션을 거절 | 새 회의에서 자막을 못 켬. 마지막 수단 |\n\n- 이미 켜진 자막은 끊지 않는다. 새로 받는 것을 막는다.\n- 손잡이별 대가는 serving_system_design.md Follow-up 2 표에 있다.\n- 클래스마다 지표를 따로 본다. 전체 평균을 보면 자막이 밀리는 것을 요약이 가린다.\n\n## Q5: 자막 스트리밍은 LLM 서빙과 무엇이 다른가요?\n\n**30초 답**\n\n- 세션이 이어진다. 그래서 같은 세션은 같은 엔진으로 보낸다.\n- 요청이 작고 많다. 그래서 몇 ms 모아 한 번에 넣는 동적 배칭이 핵심이다.\n- 용량은 \"동시 스트림 수 ÷ GPU 한 장이 받는 스트림 수\" 로 센다.\n\n**자세히**\n\n| 항목 | LLM 요약 | 자막 스트리밍 |\n|---|---|---|\n| 요청 모양 | 큰 요청 하나 | 작은 청크가 수천 번 |\n| 상태 | 요청이 끝나면 사라짐 | 직전 오디오 맥락을 세션 동안 들고 있음 |\n| 라우팅 | 덜 바쁜 엔진으로 | 세션 고정. 엔진이 죽으면 다른 엔진에서 맥락 몇 초를 잃고 이어감 |\n| 배칭 | 연속 배칭 (스텝마다 요청을 넣고 뺌) | 동적 배칭. 모으는 시간만큼 지연이 늘어남 |\n| 용량 단위 | 초당 토큰 수 | 동시 스트림 수 |\n| 결과 | 한 번 내면 끝 | 임시 자막을 먼저 띄우고 문장이 끝나면 고쳐 씀 |\n\n**청크 크기의 대가**\n\n| 청크 | 지연 | 정확도 | GPU 호출 수 |\n|---|---|---|---|\n| 작게 (0.2 초) | 짧음 | 맥락이 적어 떨어짐 | 많음 |\n| 크게 (2 초) | 긺 | 좋음 | 적음 |\n\n**용량 암산** (가정)\n\n| 단계 | 계산 | 결과 |\n|---|---|---|\n| 동시 자막 스트림 | 가정 | 10,000 개 |\n| GPU 한 장이 받는 스트림 | 실시간 100 배속으로 가정 | 100 개 |\n| 꽉 채웠을 때 GPU 수 | 10,000 ÷ 100 | 100 장 |\n| 실제로 잡는 수 | 사용률 50 % 목표 | 약 200 장 |\n\n- 실시간 작업은 사용률을 낮게 잡는다. 꽉 채우면 대기 시간이 급하게 늘어 지연 목표를 넘긴다.\n\n## Follow-up: 회의가 정시에 한꺼번에 시작하고 끝나면 어떻게 하나요?\n\n**30초 답**\n\n- 정시에는 자막 세션이 한꺼번에 열리고, 끝나는 시각에는 요약이 한꺼번에 들어온다.\n- 시각을 미리 알 수 있으므로 달력 기반으로 미리 늘린다.\n- 요약은 몇 분에 걸쳐 펴서 처리한다.\n\n**자세히**\n\n| 피크 | 대응 |\n|---|---|\n| 정시의 자막 시작 | 예약된 회의 수로 부하를 예측해 5-10 분 전에 자막 GPU 를 늘림. 지표를 보고 늘리면 콜드 스타트 (새 엔진이 준비되는 시간) 때문에 늦음 |\n| 종료 시각의 요약 | 대기열에 쌓아 두고 공유 구역이 비는 만큼 처리. 사용자에게는 \"몇 분 안에 도착\" 으로 약속 |\n| 둘이 겹침 (앞 회의 끝 + 다음 회의 시작) | 자막이 먼저. 요약은 자막 피크가 지난 뒤로 밀림 |\n\n- 회의가 정시에 몰린다는 것은 내 추정이다. 면접에서는 \"부하 모양을 먼저 확인하겠다\" 로 말한다.\n",

   "md": "> THEORY · design · T2  \n> 관련 → theory/design/llm_summary_serving.md (게이트웨이)\n\n- 문항: \"rate limiter 를 설계하라.\"\n- 일반 백엔드 문항이다. 얕게 한 번만 본다.\n\n## 0. 먼저 알아둘 말\n\n| 말 | 뜻 |\n|---|---|\n| rate limiter | 정해진 시간 안에 받을 요청 수를 제한하는 장치 |\n| 한도 | 허용하는 양. 예: 사용자당 1 분에 100 번 |\n| 창 (window) | 요청을 세는 시간 구간. 예: 1 분 |\n| 버스트 | 짧은 순간에 몰려 들어오는 요청 |\n| 429 | \"요청이 너무 많다\" 는 HTTP 응답 코드 |\n| Retry-After | \"몇 초 뒤에 다시 보내라\" 를 알려 주는 응답 헤더 |\n| Redis | 메모리에 값을 두는 빠른 저장소. 여러 서버가 카운터를 같이 볼 때 씀 |\n| 원자적 | 읽기와 쓰기가 중간에 끼어들 틈 없이 한 덩어리로 실행되는 것 |\n| Lua 스크립트 | Redis 안에서 여러 명령을 원자적으로 실행하게 해 주는 짧은 스크립트 |\n| TTL | 값이 자동으로 지워질 때까지 남은 시간 |\n| fail-open · fail-closed | 장치가 고장 나면 전부 통과시킴 · 전부 막음 |\n\n## Q1: 처음에 무엇을 묻나요?\n\n**30초 답**\n\n- 누구를 기준으로, 무엇을 세고, 넘으면 어떻게 하는지 묻는다.\n- 서버가 여러 대인지도 묻는다. 여기서 설계 난이도가 갈린다.\n\n**자세히**\n\n| 질문 | 선택지 | 정해지는 것 |\n|---|---|---|\n| 누구 기준인가 | 사용자, API 키, IP, 조직 | 카운터의 키 |\n| 무엇을 세나 | 요청 수, 바이트, LLM 이면 토큰 수 | 한 번에 깎는 양 |\n| 한도는 | 1 분에 100 번 같은 숫자 | 알고리즘의 값 |\n| 넘으면 | 거절 (429), 대기열에 넣기 | 응답 방식 |\n| 서버는 몇 대 | 한 대, 여러 대 | 공유 저장소가 필요한지 |\n| 얼마나 정확해야 하나 | 한 번도 안 넘김, 조금은 허용 | 지연과 정확도의 맞바꿈 |\n\n## Q2: 알고리즘은 무엇이 있고 무엇을 고르나요?\n\n**30초 답**\n\n- 다섯 가지가 있다. 보통 토큰 버킷을 고른다.\n- 토큰 버킷은 버스트를 어느 정도 허용하면서 평균 속도를 지키고, 키마다 숫자 2 개만 저장한다.\n\n**비교**\n\n| 알고리즘 | 방법 | 장점 | 단점 |\n|---|---|---|---|\n| 고정 창 | 1 분마다 카운터를 0 으로 | 가장 단순 | 창 경계에서 한도의 2 배가 통과 |\n| 슬라이딩 로그 | 요청 시각을 전부 저장하고 최근 1 분치를 셈 | 정확 | 메모리를 많이 씀 |\n| 슬라이딩 카운터 | 지금 창과 직전 창의 카운터를 비율로 섞음 | 메모리 적고 꽤 정확 | 근사값 |\n| 토큰 버킷 | 버킷에 토큰이 일정 속도로 차고, 요청이 하나씩 꺼내 감 | 버스트 허용, 저장 2 개 | 값 2 개 (속도, 용량) 를 맞춰야 함 |\n| 리키 버킷 | 요청을 대기열에 넣고 일정 속도로 내보냄 | 나가는 속도가 일정 | 버스트를 못 받음, 대기 지연 |\n\n- 고정 창의 2 배 문제: 0:59 에 100 번, 1:00 에 100 번이면 2 초 사이에 200 번이 통과한다.\n\n**토큰 버킷 그림**\n\n<div class=\"fig\">\n<svg viewBox=\"0 0 360 190\" width=\"100%\" style=\"max-width:520px\" font-size=\"12\" font-family=\"inherit\">\n<defs><marker id=\"sdA3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--ink-2)\"/><\/marker><\/defs>\n<path d=\"M130 50V140H230V50\" fill=\"var(--card-2)\" stroke=\"var(--ink-2)\" stroke-width=\"1.4\"/>\n<g fill=\"var(--rule-blue)\" stroke=\"var(--ink-2)\" stroke-width=\"1\">\n<circle cx=\"152\" cy=\"126\" r=\"9\"/><circle cx=\"180\" cy=\"126\" r=\"9\"/><circle cx=\"208\" cy=\"126\" r=\"9\"/>\n<circle cx=\"166\" cy=\"106\" r=\"9\"/><circle cx=\"194\" cy=\"106\" r=\"9\"/>\n<\/g>\n<g stroke=\"var(--ink-2)\" stroke-width=\"1.2\" fill=\"none\" marker-end=\"url(#sdA3)\">\n<path d=\"M180 14V44\"/><path d=\"M40 162H126\"/><path d=\"M234 162H320\"/>\n<\/g>\n<path d=\"M130 162H230\" stroke=\"var(--ink-2)\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/>\n<g fill=\"var(--ink)\" text-anchor=\"middle\">\n<text x=\"270\" y=\"24\">초당 r 개씩 채움<\/text>\n<text x=\"290\" y=\"96\">용량 b 개<\/text>\n<text x=\"290\" y=\"112\" fill=\"var(--ink-2)\" font-size=\"11\">넘치면 버림<\/text>\n<text x=\"70\" y=\"154\">요청<\/text>\n<text x=\"276\" y=\"154\">통과<\/text>\n<text x=\"180\" y=\"182\" fill=\"var(--ink-2)\" font-size=\"11\">토큰이 있으면 1 개 꺼내고 통과, 없으면 429<\/text>\n<\/g>\n<\/svg>\n<\/div>\n\n- 속도 r 이 평균 한도, 용량 b 가 허용하는 버스트 크기다.\n\n```cpp\nstruct Bucket { double tokens, last; };\n\n// rate: 초당 채우는 수, cap: 용량\nbool allow(Bucket& b, double now,\n           double rate, double cap) {\n    double add = (now - b.last) * rate;\n    b.tokens = min(cap, b.tokens + add);\n    b.last = now;\n    if (b.tokens < 1) return false;\n    b.tokens -= 1;\n    return true;\n}\n```\n\n- 타이머로 채우지 않는다. 요청이 올 때 지난 시간만큼 한꺼번에 채운다.\n\n## Q3: 서버가 여러 대면 어떻게 만드나요?\n\n**30초 답**\n\n- 게이트웨이 여러 대가 Redis 의 카운터 하나를 같이 본다.\n- 읽고 깎는 과정을 Lua 스크립트로 원자적으로 실행한다.\n- Redis 가 죽으면 보통 fail-open 으로 통과시킨다.\n\n**자세히**\n\n| 문제 | 왜 생기나 | 대응 |\n|---|---|---|\n| 경쟁 | 두 서버가 동시에 \"남은 1 개\" 를 읽고 둘 다 통과시킴 | 읽기와 깎기를 Lua 스크립트 하나로 |\n| 지연 | 요청마다 Redis 를 다녀오면 1 ms 안팎이 더해짐 | 서버마다 작은 버킷을 두고 주기적으로 Redis 와 맞춤. 정확도를 조금 내줌 |\n| Redis 장애 | 카운터를 못 읽음 | fail-open (서비스 유지) 또는 fail-closed (보호 우선). 서버별 임시 한도로 버팀 |\n| 메모리 | 키가 사용자 수만큼 생김 | 키에 TTL 을 걸어 안 쓰는 키를 지움 |\n| 여러 지역 | 지역마다 Redis 가 따로면 합계가 한도를 넘음 | 지역별로 한도를 나눠 주거나, 조금 넘는 것을 허용 |\n\n**거절할 때 돌려주는 것**\n\n| 항목 | 내용 |\n|---|---|\n| 상태 코드 | 429 |\n| Retry-After | 다음 토큰이 찰 때까지 남은 초 |\n| 남은 한도 헤더 | 한도, 남은 수, 초기화 시각 |\n\n## Q4: LLM API 의 rate limiter 는 무엇이 다른가요?\n\n**30초 답**\n\n- 요청마다 비용이 다르다. 그래서 요청 수가 아니라 토큰 수로 센다.\n- 출력 길이는 끝나야 안다. 그래서 먼저 예상치를 깎고 끝난 뒤 정산한다.\n- 스트리밍이 길어서 동시 요청 수도 따로 제한한다.\n\n**자세히**\n\n| 차이 | 일반 API | LLM API |\n|---|---|---|\n| 세는 단위 | 요청 수 | 분당 토큰 수 + 분당 요청 수 |\n| 비용을 아는 시점 | 요청이 들어올 때 | 입력은 들어올 때, 출력은 끝난 뒤 |\n| 깎는 법 | 1 개 | 입력 토큰 + 출력 상한을 먼저 깎고, 끝나면 안 쓴 만큼 돌려줌 |\n| 동시 요청 | 금방 끝나 신경 덜 씀 | 요청 하나가 수 초 동안 GPU 메모리를 잡으므로 동시 수 한도 필요 |\n| 등급 | 보통 하나 | 실시간과 묶음 처리의 한도를 따로 |\n\n- 입구에서 429 로 막는 것이 엔진 안에서 요청을 밀어내는 것보다 훨씬 싸다.\n- 밀어내면 그때까지 한 계산을 버리기 때문이다.\n\n## Follow-up: 작업 큐 설계를 물으면 무엇을 말하나요?\n\n**30초 답**\n\n- 작업 큐는 일을 넣어 두면 일꾼 프로세스 (worker) 가 꺼내 처리하는 구조다.\n- 핵심은 \"일꾼이 죽어도 일이 사라지지 않는다\" 와 \"같은 일이 두 번 돌아도 괜찮다\" 두 가지다.\n\n**자세히**\n\n| 항목 | 뜻 | 왜 필요한가 |\n|---|---|---|\n| 최소 한 번 전달 | 일을 끝냈다는 확인 (ack) 이 올 때까지 큐에서 지우지 않음 | 일꾼이 죽어도 일이 남음 |\n| 숨김 시간 | 꺼내 간 일을 잠시 다른 일꾼에게 안 보이게 함. 시간이 지나도 ack 이 없으면 다시 보임 | 죽은 일꾼의 일을 다른 일꾼이 이어받음 |\n| 멱등 | 같은 일을 두 번 해도 결과가 같게 만드는 것. 작업 ID 로 중복을 걸러냄 | 최소 한 번 전달은 중복이 생김 |\n| 재시도 간격 늘리기 | 실패할수록 다음 시도를 더 늦춤 | 고장 난 곳에 요청이 몰리지 않게 |\n| 실패 보관함 | 여러 번 실패한 일을 따로 모으는 큐 (dead letter queue) | 고장 난 일이 큐를 막지 않게 |\n| 우선순위 | 급한 일용 큐를 따로 둠 | 긴 일이 급한 일을 막지 않게 |\n",

<script id="app-js">
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("app-state").textContent);
var CARDS = DATA.cards, CATS = DATA.cats;
var CATNAME = {}; CATS.forEach(function(c){ CATNAME[c.key]=c.name; });
var KEY = "fc2.ui.v1";
var TRACKS = [["a","A 구두"],["b1","B-1 구현"],["b2","B-2 알고리즘"],["c","C AI 추론"]];
var TRACKNAME = {a:"A 도메인 구두", b1:"B-1 임베디드 구현", b2:"B-2 알고리즘", c:"C AI 추론"};
var IVS = (DATA.interviews||[]);
function laToday(){ try{ return new Date().toLocaleDateString("en-CA",{timeZone:"America/Los_Angeles"}); }catch(e){ return new Date().toISOString().slice(0,10); } }
function dleft(d){ return Math.round((Date.parse(d)-Date.parse(laToday()))/864e5); }
function liveIvs(){ return IVS.filter(function(v){ return dleft(v.date)>=0; }); }
function curIv(){ var v=null; liveIvs().forEach(function(x){ if(x.name===ui.iv) v=x; }); return v; }
function visTracks(){ var v=curIv(); return v ? TRACKS.filter(function(t){ return v.tracks.indexOf(t[0])>=0; }) : TRACKS; }
var TAGNAME = {A:"Amazon30d",B:"Blind75",N:"NC150",G:"Google",E:"Embedded"};
var ui = load(); if(!TRACKNAME[ui.track]) ui.track="a";
var root = document.getElementById("root"), study = document.getElementById("study");
var queue = [], pos = -1, flipped = false;

function load(){ try{ var r=localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return {seg:"star",cat:"all"}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ui)); }catch(e){} }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- theme ---------- */
function applyTheme(){
  var t = ui.theme;
  if(t==="dark"||t==="light") document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
}
function cycleTheme(){
  var order=["system","dark","light"], i=order.indexOf(ui.theme||"system");
  ui.theme = order[(i+1)%3]; save(); applyTheme(); render();
}

/* ---------- selection ---------- */
function cats(){ return CATS.filter(function(c){return c.track===ui.track;}); }
function catIdx(k){ for(var i=0;i<CATS.length;i++) if(CATS[i].key===k) return i; return 999; }
function tcards(){ return CARDS.filter(function(c){return c.track===ui.track;}); }
function segFilter(c){
  if(c.track!==ui.track) return false;
  if(ui.seg==="star") return !!c.pri;
  if(ui.seg==="review") return c.solved && c.review>0;
  if(ui.seg==="unsolved") return !c.solved;
  return true;
}
function numKey(n){ var m=String(n).match(/^([A-Z]*)(\d+)/); return m?[m[1],+m[2]]:["",0]; }
function selected(){
  var xs = CARDS.filter(function(c){ return segFilter(c) && (ui.cat==="all"||c.cat===ui.cat); });
  function base(a,b){
    var d = catIdx(a.cat)-catIdx(b.cat); if(d) return d;
    if(a.kind==="cpp"){ var ka=numKey(a.num), kb=numKey(b.num); return ka[0].localeCompare(kb[0]) || (ka[1]-kb[1]); }
    return a.title.localeCompare(b.title);
  }
  if(ui.seg==="review"){
    xs.sort(function(a,b){ return (b.review-a.review) || base(a,b); });
  }else{
    xs.sort(function(a,b){ return ((b.pri?1:0)-(a.pri?1:0)) || base(a,b); });
  }
  return xs;
}
function counts(){
  var s=0,r=0,u=0,xs=tcards();
  xs.forEach(function(c){ if(c.pri) s++; if(c.solved&&c.review>0) r++; if(!c.solved) u++; });
  return {star:s, review:r, all:xs.length, unsolved:u};
}

/* ---------- list ---------- */
function render(){
  var xs = selected(), k = counts(), all = tcards();
  var solved = all.filter(function(c){return c.solved;}).length;
  var themeIcon = ui.theme==="dark"?"●":ui.theme==="light"?"○":"◐";
  var isA = ui.track==="a" || ui.track==="c";

  var vt = visTracks();
  if(!vt.some(function(t){return t[0]===ui.track;})){ ui.track = vt[0][0]; ui.cat = "all"; save(); xs = selected(); k = counts(); all = tcards(); solved = all.filter(function(c){return c.solved;}).length; isA = ui.track==="a" || ui.track==="c"; }
  var h = '<div class="wrap"><div class="top">';
  h += '<div class="brand"><h1>'+esc(TRACKNAME[ui.track])+'</h1><span class="cnt mono">'+solved+' / '+all.length+' 완료</span><span class="grow"></span>';
  h += '<button class="theme" id="theme" title="테마" aria-label="테마 전환">'+themeIcon+'</button></div>';
  var lv = liveIvs();
  if(lv.length){
    h += '<div class="chips ivs" role="tablist">';
    h += '<button class="chip" data-iv="all" aria-pressed="'+(!curIv())+'">전체 면접</button>';
    lv.forEach(function(v){
      var d = dleft(v.date);
      h += '<button class="chip" data-iv="'+esc(v.name)+'" aria-pressed="'+(ui.iv===v.name)+'">'+esc(v.name)+'<em>'+(d?'D-'+d:'D-day')+'</em></button>';
    });
    h += '</div>';
  }
  h += '<div class="tracks" role="tablist" style="grid-template-columns:repeat('+vt.length+',1fr)">';
  vt.forEach(function(tr){
    var xs2 = CARDS.filter(function(c){return c.track===tr[0];});
    var n = xs2.filter(function(c){return !c.solved;}).length;
    h += '<button class="track" role="tab" data-track="'+tr[0]+'" aria-pressed="'+(ui.track===tr[0])+'">'+tr[1]+(n?'<em>'+n+'</em>':'')+'</button>';
  });
  h += '</div>';
  h += '<div class="seg" role="tablist">';
  [["star","★",k.star],["review","복습",k.review],["all","전체",k.all],["unsolved",isA?"미학습":"안 푼",k.unsolved]].forEach(function(s){
    h += '<button role="tab" data-seg="'+s[0]+'" aria-pressed="'+(ui.seg===s[0])+'">'+s[1]+'<em>'+s[2]+'</em></button>';
  });
  h += '</div>';
  var cs = cats();
  if(cs.length>1){
    h += '<div class="chips">';
    h += '<button class="chip" data-cat="all" aria-pressed="'+(ui.cat==="all")+'">전체</button>';
    cs.forEach(function(c){
      var n = CARDS.filter(function(x){ return x.cat===c.key && segFilter(x); }).length;
      if(!n && ui.cat!==c.key) return;
      h += '<button class="chip" data-cat="'+esc(c.key)+'" aria-pressed="'+(ui.cat===c.key)+'">'+esc(c.name)+'<em>'+n+'</em></button>';
    });
    h += '</div>';
  }
  h += '</div>';

  h += '<div class="list">';
  if(!xs.length){
    h += '<div class="empty">'+(ui.seg==="review"?"복습할 카드가 없습니다.":ui.seg==="star"?"★ 카드가 없습니다.":"해당하는 카드가 없습니다.")+'</div>';
  }else if(ui.seg==="review" && ui.cat==="all"){
    [3,2,1].forEach(function(lv){
      var g = xs.filter(function(c){return c.review===lv;});
      if(!g.length) return;
      h += '<div class="group"><div class="group-h">'+["","다시 보면 좋음","다시 볼 것","반드시 복습"][lv]+'<em>'+g.length+'</em></div><div class="rows">';
      g.forEach(function(c){ h += rowHTML(c); });
      h += '</div></div>';
    });
  }else{
    var cur=null;
    xs.forEach(function(c){
      if(c.cat!==cur){
        if(cur!==null) h += '</div></div>';
        cur=c.cat;
        var tot = xs.filter(function(x){return x.cat===cur;}).length;
        var sv  = xs.filter(function(x){return x.cat===cur && x.solved;}).length;
        h += '<div class="group"><div class="group-h">'+esc(CATNAME[cur]||cur)+'<em>'+sv+'/'+tot+'</em></div><div class="rows">';
      }
      h += rowHTML(c);
    });
    if(cur!==null) h += '</div></div>';
  }
  h += '</div></div>';
  root.innerHTML = h;
}
function rowHTML(c){
  var nf = c.followups && c.followups.length ? '<span class="fu-badge" title="꼬리질문">꼬리 '+c.followups.length+'</span>' : '';
  return '<button class="row'+(c.solved?"":" unsolved")+(c.pri?" pri":"")+'" data-id="'+esc(c.id)+'" data-r="'+(c.solved?c.review:0)+'">'
    + '<span class="n">'+esc(c.kind==="cpp"?c.num:((c.qs||[]).length?(c.qs.length+"Q"):""))+'</span>'
    + '<span class="t">'+esc(c.title)+(c.redo?' <span title="구글 대비 중 다시 풂">🔁</span>':'')+'</span>'
    + '<span class="meta">'+(c.solved?'<span class="done-badge">✓ 완료</span>':'')+(c.pri?'<span class="pri-badge">'+esc(c.pri)+'</span>':'')+nf+(c.diff?'<span class="diff '+esc(c.diff)+'">'+esc(c.diff)+'</span>':'')
    + '<span class="rv" data-r="'+(c.solved?c.review:0)+'"><i></i><i></i><i></i></span></span>'
    + '</button>';
}

/* ---------- study ---------- */
var DESK = window.matchMedia("(min-width:900px)");
function drawEmpty(){
  study.innerHTML = '<div class="s-empty"><div>왼쪽에서 카드를 고르면 여기에 열립니다<br><br><kbd>←</kbd> <kbd>→</kbd> 이동 · <kbd>Space</kbd> 뒤집기 · <kbd>Esc</kbd> 닫기</div></div>';
}
function open(id){
  queue = selected();
  pos = queue.findIndex(function(c){return c.id===id;});
  if(pos<0){ queue=tcards(); pos=queue.findIndex(function(c){return c.id===id;}); }
  flipped=false;
  study.classList.add("open"); study.setAttribute("aria-hidden","false");
  if(!DESK.matches) document.body.style.overflow="hidden";
  drawStudy(); remember();
}
function close(){
  study.classList.remove("open"); study.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
  if(DESK.matches) drawEmpty();
  delete ui.at; save();
}
function go(d){
  var n=pos+d; if(n<0||n>=queue.length) return;
  pos=n; flipped=false; drawStudy(); remember();
}
function flip(){ flipped=!flipped; study.querySelector(".card").classList.toggle("flipped",flipped); remember(); }
/* 보던 자리 기억: 새로고침·재발행 뒤에도 같은 카드·면·스크롤로 복원 */
function faceBody(){ return study.querySelector(flipped ? ".face.back .f-body" : ".face.front .f-body"); }
function remember(){
  if(!study.classList.contains("open") || !queue[pos]) return;
  var b = faceBody();
  ui.at = {id: queue[pos].id, f: flipped ? 1 : 0, y: b ? b.scrollTop : 0};
  save();
}
var remT = 0;
study.addEventListener("scroll", function(){ clearTimeout(remT); remT = setTimeout(remember, 150); }, true);
function restoreAt(){
  var at = ui.at; if(!at || !at.id) return;
  if(!DATA.cards.some(function(c){return c.id===at.id;})){ delete ui.at; save(); return; }
  var tr = at.id.split(":")[0];
  if(TRACKNAME[tr] && ui.track!==tr){ ui.track = tr; ui.cat = "all"; render(); }
  open(at.id);
  if(at.f){ flipped = true; var cd = study.querySelector(".card"); if(cd) cd.classList.add("flipped"); }
  var setY = function(){ var b = faceBody(); if(b) b.scrollTop = at.y || 0; };
  setY(); setTimeout(setY, 60); setTimeout(function(){ setY(); remember(); }, 400);
}

function noteHTML(s){
  if(!s) return "";
  var parts = String(s).split("```");
  var out = "";
  for(var i=0;i<parts.length;i++){
    var seg = parts[i];
    if(i%2===1){ out += '<div class="ncode">'+esc(seg.replace(/^\n/,"").replace(/\n$/,""))+'</div>'; }
    else{ var txt = seg.replace(/^\n/,"").replace(/\n$/,""); if(txt.trim()) out += '<div class="p">'+esc(txt)+'</div>'; }
  }
  return out;
}
// Q1 아래 굵은 소제목에 Q1-1, Q1-2 … 번호를 붙인다 (Follow-up 은 F-1, Follow-up 2 는 F2-1)
function numberSubs(html){
  return html.split(/(?=<h2)/).map(function(seg){
    var m = seg.match(/^<h2[^>]*>\s*(Q\d+|Follow-?up(?:\s*\d+)?)/i);
    if(!m) return seg;
    var tag = /^Q/i.test(m[1]) ? m[1].toUpperCase() : "F" + ((m[1].match(/\d+/)||[""])[0]);
    var n = 0;
    return seg.replace(/<p><strong>/g, function(){ n++; return '<p class="sub"><span class="subno">'+tag+'-'+n+'</span><strong>'; });
  }).join("");
}
var MDCACHE = {};
function mdHTML(c){ return mdRender(c.md, c.id); }
function mdRender(md, key){
  if(MDCACHE[key]) return MDCACHE[key];
  var out, math = [];
  var src = (md||"")
    .replace(/\$\$([\s\S]+?)\$\$/g, function(_,m){ math.push("$$"+m+"$$"); return "QQMATH"+(math.length-1)+"QQ"; })
    .replace(/\$([^$\n]+?)\$/g, function(_,m){ math.push("$"+m+"$"); return "QQMATH"+(math.length-1)+"QQ"; });
  if(window.marked && marked.parse){
    try{ out = marked.parse(src, {gfm:true, breaks:false}); }catch(e){ out = null; }
  }
  if(!out) out = noteHTML(src);
  out = out.replace(/QQMATH(\d+)QQ/g, function(_,i){ return esc(math[+i]); });
  out = numberSubs(out);
  out = out.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');
  MDCACHE[key] = out; return out;
}
function fuHTML(c){
  if(!c.followups || !c.followups.length) return "";
  var ans = c.fuAns || [];
  var nAns = ans.filter(function(a){ return a; }).length;
  return '<p class="b-label fu">꼬리질문 <span class="mono">'+c.followups.length+'</span>'
    + (nAns?'<span class="fu-sub">눌러서 답 보기</span>':'')+'</p><ol class="fulist">'
    + c.followups.map(function(q,i){
        if(!ans[i]) return '<li>'+esc(q)+'</li>';
        return '<li><details class="fu-q"><summary>'+esc(q)+'</summary><div class="md fu-ans">'+mdRender(ans[i], c.id+":fu"+i)+'</div></details></li>';
      }).join("") + '</ol>';
}
function barHTML(){
  return '<div class="s-bar"><button class="close" id="close2" aria-label="닫기">×</button><button id="prev"'+(pos===0?" disabled":"")+'>← 이전</button><button class="flip" id="flip">뒤집기</button><button id="next"'+(pos===queue.length-1?" disabled":"")+'>다음 →</button></div>';
}
function topHTML(c){
  return '<div class="s-top"><span class="pos">'+(pos+1)+' / '+queue.length+'</span><span class="cat">'+esc(c.catName||c.cat)+(c.role&&c.role!==c.catName?' · '+esc(c.role):'')+'</span><span class="grow"></span><button class="x" id="close" aria-label="닫기">×</button></div>';
}
function drawStudy(){
  var c = queue[pos]; if(!c) return;
  if(c.kind!=="cpp"){ drawStudyMD(c); return; }
  var r = c.solved ? c.review : 0;
  var tags = (c.tags||[]).map(function(t){ return '<span class="tag">'+esc(TAGNAME[t]||t)+'</span>'; }).join("");
  var isNum = /^\d+$/.test(String(c.num));
  var front = '<div class="face front">'
    + '<div class="f-body">'
    + '<div class="f-head"><div class="f-num mono">'+(isNum?'<small>#</small>':'')+esc(c.num)+'</div><div class="f-badges">'+(c.diff?'<span class="diff '+esc(c.diff)+'">'+esc(c.diff)+'</span>':'')+tags+'</div></div>'
    + '<h2 class="f-title">'+esc(c.title)+'</h2>'
    + (c.pri?'<span class="f-pri">★ 최소 세트</span>':'')
    + (c.solved?"":'<span class="f-unsolved">아직 안 푼 문제</span>')
    + '<p class="f-desc">'+esc(c.desc||"")+'</p>'
    + '<div class="f-foot">'+(c.link?'<a href="'+esc(c.link)+'" target="_blank" rel="noopener">LeetCode에서 열기 ↗</a>':'')
    + '<span class="f-file">'+esc(c.file)+'</span>'
    + (c.date?'<span class="mono">'+esc(c.date)+'</span>':'')
    + '<span class="hint">탭하면 뒤집힘</span></div>'
    + '</div></div>';

  var cx = "";
  if(c.time||c.space){
    cx = '<div class="cx">'+(c.time?'<span><b>time</b>'+esc(c.time)+'</span>':'')+(c.space?'<span><b>space</b>'+esc(c.space)+'</span>':'')+'</div>';
  }
  var ap = "";
  if(c.approaches && c.approaches.length){
    ap = '<details class="appr"><summary>풀이 접근법 <em class="mono" style="font-style:normal">'+c.approaches.length+'</em></summary>';
    c.approaches.forEach(function(a){
      ap += '<div class="ap"><div class="nm">'+esc(a.name)+'</div><div class="dt">'+esc(a.detail)+'</div><div class="c">'+esc(a.tc)+' · '+esc(a.sc)+'</div></div>';
    });
    ap += '</details>';
  }
  var back = '<div class="face back"><div class="f-body">'
    + '<p class="b-label">내 노트</p>'
    + cx
    + '<div class="note">'+noteHTML(c.note||"")+'</div>'
    + fuHTML(c)
    + (c.md?'<details class="appr rvnote"><summary>풀이 노트</summary><div class="md">'+mdRender(c.md, c.id+":rv")+'</div></details>':'')
    + ap
    + '</div></div>';

  study.innerHTML = topHTML(c)
    + '<div class="stage"><div class="card'+(flipped?" flipped":"")+'" data-r="'+r+'" id="card">'+front+back+'</div></div>'
    + barHTML();
  ui.last = c.id; save();
  study.querySelectorAll(".md").forEach(renderMath);
}
function drawStudyMD(c){
  var r = c.solved ? c.review : 0;
  var qs = (c.qs||[]).map(function(q){ return '<li>'+esc(q)+'</li>'; }).join("");
  var front = '<div class="face front"><div class="f-body">'
    + '<div class="f-head"><div class="f-cat">'+esc(c.catName)+'</div><div class="f-badges">'+(c.pri?'<span class="pri-badge">'+esc(c.pri)+'</span>':'')+'</div></div>'
    + '<h2 class="f-title">'+esc(c.title)+'</h2>'
    + (c.solved?"":'<span class="f-unsolved">아직 학습 전</span>')
    + (qs?'<ol class="f-qs">'+qs+'</ol>':'<p class="f-desc">'+esc(c.desc||"")+'</p>')
    + '<div class="f-foot"><span class="f-file">'+esc(c.file)+'</span>'
    + (c.date?'<span class="mono">'+esc(c.date)+'</span>':'')
    + '<span class="hint">탭하면 뒤집힘</span></div>'
    + '</div></div>';
  var back = '<div class="face back"><div class="f-body">'
    + '<p class="b-label">전문</p>'
    + '<div class="md">'+mdHTML(c)+'</div>'
    + '</div></div>';
  study.innerHTML = topHTML(c)
    + '<div class="stage"><div class="card'+(flipped?" flipped":"")+'" data-r="'+r+'" id="card">'+front+back+'</div></div>'
    + barHTML();
  ui.last = c.id; save();
  renderMath(study.querySelector(".md"));
}
function renderMath(el){
  if(!el || !window.renderMathInElement) return;
  try{ renderMathInElement(el, {delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}], throwOnError:false}); }catch(e){}
}
window.addEventListener("load", function(){ renderMath(study.querySelector(".md")); });

/* ---------- events ---------- */
root.addEventListener("click", function(e){
  var t=e.target;
  var b;
  if((b=t.closest("[data-iv]"))){ ui.iv=(b.dataset.iv==="all"?"":b.dataset.iv); ui.cat="all"; save(); render(); if(DESK.matches && !study.classList.contains("open")) drawEmpty(); return; }
  if((b=t.closest("[data-track]"))){ ui.track=b.dataset.track; ui.cat="all"; save(); render(); if(DESK.matches && !study.classList.contains("open")) drawEmpty(); return; }
  if((b=t.closest("[data-seg]"))){ ui.seg=b.dataset.seg; save(); render(); return; }
  if((b=t.closest("[data-cat]"))){ ui.cat=b.dataset.cat; save(); render(); return; }
  if((b=t.closest(".row"))){ open(b.dataset.id); return; }
  if(t.closest("#theme")){ cycleTheme(); return; }
});
study.addEventListener("click", function(e){
  var t=e.target;
  if(t.closest("a")) return;
  if(t.closest("#close")||t.closest("#close2")){ close(); return; }
  if(t.closest("#prev")){ go(-1); return; }
  if(t.closest("#next")){ go(1); return; }
  if(t.closest("#flip")){ flip(); return; }
  if(t.closest("summary")) return;
  if(t.closest("details")) return;
  if(t.closest(".face")){ flip(); return; }
});
document.addEventListener("keydown", function(e){
  if(!study.classList.contains("open")) return;
  if(e.key==="Escape") close();
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="ArrowRight") go(1);
  else if(e.key===" "||e.key==="Enter"){ if(!e.target.closest("summary,a,button")){ e.preventDefault(); flip(); } }
});
var tx=null, ty=null;
study.addEventListener("touchstart", function(e){ var p=e.changedTouches[0]; tx=p.clientX; ty=p.clientY; }, {passive:true});
study.addEventListener("touchend", function(e){
  if(tx===null) return;
  var p=e.changedTouches[0], dx=p.clientX-tx, dy=p.clientY-ty; tx=ty=null;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ go(dx<0?1:-1); }
}, {passive:true});

/* URL 해시: #b1 → 트랙, #b2:G01 또는 #a:android/binder.md → 카드 열기, 끝에 ! 붙이면 뒷면 */
(function(){
  var hsh = decodeURIComponent((location.hash||"").slice(1)); if(!hsh) return;
  var want = hsh.replace(/!$/,"");
  var tr = want.split(":")[0];
  if(TRACKNAME[tr]){ ui.track = tr; ui.cat = "all"; if(want.indexOf(":")>=0) ui.hashOpen = want; }
})();
applyTheme();
var sideBtn = document.getElementById("sideToggle");
function applySide(){
  document.body.classList.toggle("nolist", !!ui.hideList);
  sideBtn.textContent = ui.hideList ? "▶" : "◀";
  sideBtn.title = ui.hideList ? "목록 보이기" : "목록 숨기기";
  sideBtn.setAttribute("aria-label", sideBtn.title);
}
sideBtn.addEventListener("click", function(){ ui.hideList = !ui.hideList; save(); applySide(); });
applySide();
render();
if(DESK.matches) drawEmpty();
if(!ui.hashOpen) restoreAt();
if(ui.hashOpen){ var id = ui.hashOpen; delete ui.hashOpen; var fl = /!$/.test(location.hash); open(id); if(fl){ flipped=true; var cd=study.querySelector(".card"); if(cd) cd.classList.add("flipped"); } }
DESK.addEventListener("change", function(){
  if(DESK.matches){ document.body.style.overflow=""; if(!study.classList.contains("open")) drawEmpty(); }
  else if(!study.classList.contains("open")) study.innerHTML="";
});
})();
</script>

   ],
   "md": "## 기준 코드 — 계좌 이체\n\n이 파일의 Q1 부터 Follow-up 까지 **전부 이 코드 하나** 를 놓고 답한다.\n목록을 외우는 게 아니라, 이 코드에서 뭐가 어디에 있는지를 본다.\n\n```cpp\nstruct Account { int id; int balance; mutex mtx; };\nAccount acc1{1, 1000, {}};   // 락이 지키는 건 balance. mutex 자체는 자원이 아니다\nAccount acc2{2, 1000, {}};\n\nvoid transfer(Account& from, Account& to, int amount) {\n    from.mtx.lock();          // ①\n    to.mtx.lock();            // ②\n    from.balance -= amount;\n    to.balance   += amount;\n    to.mtx.unlock();\n    from.mtx.unlock();\n}\n\n// 두 스레드가 동시에\ntransfer(acc1, acc2, 100);   // 스레드1\ntransfer(acc2, acc1, 100);   // 스레드2\n```\n\n이 코드는 멈춘다.\n왜 멈추는지가 Q1, 어떻게 살릴지가 Q2, 정확히 어디서 엇갈리는지가 Q3 다.\n\n---\n\n## Q1: Deadlock이란? 발생 조건 4가지는?\n\n두 개 이상의 프로세스가 서로 상대방이 가진 자원을 기다리면서 무한히 대기하는 상태.\n\n**4가지 조건이 위 코드의 어디에 있는지:**\n\n| 조건 | 이 코드의 어디 |\n|---|---|\n| **Mutual Exclusion** | `mutex` 다. 한 번에 한 스레드만 그 계좌의 balance 를 건드린다 |\n| **Hold and Wait** | ① 을 쥔 채로 ② 를 기다린다. 놓지 않고 기다리는 게 핵심이다 |\n| **No Preemption** | 남이 쥔 `mtx` 를 뺏어올 방법이 없다. 놓을 때까지 기다릴 뿐이다 |\n| **Circular Wait** | 스레드1 은 acc2 를, 스레드2 는 acc1 을 기다린다. 화살표가 고리를 이룬다 |\n\n네 줄이 전부 이 6줄짜리 함수 안에 있다.\n그래서 이런 코드는 특별히 이상하지 않아도 데드락이 난다.\n\n### 외우는 법: PEACH 🍑\n\n```\nP   No Preemption      뺏을 수 없다\nE   Mutual Exclusion   나만 쓴다\nA   All four           넷 다 있어야 데드락이다\nC   Circular Wait      고리를 이룬다\nH   Hold and Wait      쥔 채로 기다린다\n```\n\n**A 는 조건이 아니라 성질이다.** ⭐️\n네 조건이 **전부** 모여야 데드락이 생긴다.\n뒤집으면 **하나만 깨도 안 생긴다.**\n\nA 를 빼먹으면 PEACH 는 그냥 외운 글자 네 개로 끝난다.\nA 가 있어야 Q2 가 성립한다 — **해결책이란 곧 \"넷 중 하나를 깨는 방법\" 이다.**\n\n---\n\n## Q2: Deadlock을 어떻게 해결하나요?\n\n같은 코드를 놓고, 네 가지 답이 있다.\n\n### P — Prevention (예방): 코드를 고쳐서 조건 하나를 없앤다\n\n**Circular Wait 를 깬다.** 인자 순서가 아니라 **id 순서** 로 잠근다.\n\n```cpp\nAccount& first  = (from.id < to.id) ? from : to;\nAccount& second = (from.id < to.id) ? to   : from;\nfirst.mtx.lock();\nsecond.mtx.lock();\n```\n\n누가 어떤 순서로 부르든 항상 id 작은 것부터 잠근다.\n고리가 생길 수 없다. → 자세한 건 Q3.\n\n### A — Avoidance (회피): 잠그기 전에 안전한지 계산한다\n\n이체 요청이 올 때마다 \"지금 이 둘을 잠그면 교착 가능성이 생기나\" 를 미리 따져보고 허락한다.\nBanker's Algorithm 이 이것이다.\n계좌 이체에는 과하다. 매 요청마다 계산 비용이 붙는다.\n\n### I — Ignorance (무시): 아무것도 안 한다\n\n그냥 둔다.\n멈추면 사람이 재시작한다.\n\n**실제 대부분의 OS 가 고르는 게 이것이다.** ⭐️\n데드락은 자주 안 나서 앞의 셋이 수지가 안 맞는다.\n모래에 머리 박는다고 **타조 알고리즘** 이라고 부른다.\n\n### D — Detection + Recovery (탐지 + 복구): 터진 뒤에 수습한다\n\n누가 누구를 기다리는지 그래프로 들고 있다가 사이클이 생기면 잡아낸다.\n잡으면 한쪽 `transfer` 를 강제로 취소하고 롤백한다.\nDB 엔진이 실제로 이렇게 한다.\n\n### 외우는 법: PAID 💰\n\n```\nP   Prevention            코드를 고쳐서 조건 하나를 없앤다\nA   Avoidance             잠그기 전에 안전한지 계산한다\nI   Ignorance             그냥 둔다        <- 실제 답\nD   Detection + Recovery  터지면 잡아서 롤백한다\n```\n\n네 글자에 네 전략이 정확히 맞는다. 채운 글자가 없다.\n\n뜻도 통한다. 결국 **비용을 어디에 치를 것인가** 의 선택이다.\n\n| | 값을 치르는 지점 |\n|---|---|\n| Prevention | 설계 단계. 제약이 세져서 자원 활용도가 떨어진다 |\n| Avoidance | 할당할 때마다. 매번 안전한지 계산해야 한다 |\n| Ignorance | 안 치른다. 대신 가끔 멈춘다 |\n| Detection | 터진 뒤에. 탐지 비용 + 롤백 대가 |\n\n데드락은 공짜로 못 없앤다.\n어디서 PAID 할지만 고를 수 있다.\n\n---\n\n## Q3: 정확히 어디서 엇갈리나?\n\n같은 `from.mtx.lock()` 한 줄인데, `from` 이 가리키는 게 호출마다 다르다.\n\n```\ntransfer(acc1, acc2)   ->  from = acc1,  to = acc2   ->  acc1 잠그고 acc2 기다림\ntransfer(acc2, acc1)   ->  from = acc2,  to = acc1   ->  acc2 잠그고 acc1 기다림\n```\n\n함수 안에서는 둘 다 \"내 것 먼저\" 라는 같은 규칙이다.\n바깥에서 보면 잠그는 순서가 정반대다.\n\n```\n나쁜 코드 :  인자 순서대로 잠근다    -> 호출자마다 순서가 달라짐\n좋은 코드 :  id 순서대로 잠근다      -> 누가 부르든 순서가 같음\n```\n\n**왜 하필 id 인가** ⭐️\n\"먼저 온 쪽\" 이나 \"잔액이 많은 쪽\" 같은 **호출 시점에 달린 기준이면 안 된다.**\n누가 언제 부르든 같은 답이 나오는 **고정된 전역 기준** 이어야 순서가 통일된다.\nid 는 계좌에 박혀 있어서 절대 안 변한다. 그래서 쓸 수 있다.\n\n먼저 잠글 것을 못 잡은 쪽은 **아무것도 안 쥔 채** 기다린다.\nHold and Wait 도 같이 깨진다.\n\n순서를 통일하기 어려우면 `lock(m1, m2)` 로 두 락을 한꺼번에 잡는 방법도 있다.\n\n⚠️ 전제는 **동시 실행** 이다.\n두 호출을 순차로 하면 락 구간이 안 겹쳐서 순서가 반대여도 데드락이 안 난다.\n\n---\n\n## Follow-up: Deadlock vs Livelock vs Starvation?\n\n같은 코드를 **잘못 고치면** Livelock 이 나온다.\n\n```cpp\nvoid transfer(Account& from, Account& to, int amount) {\n    while (true) {\n        from.mtx.lock();\n        if (to.mtx.try_lock()) break;   // 둘 다 잡았다 -> 진행\n        from.mtx.unlock();              // 못 잡았으면 내 것도 놓고 양보한다\n    }\n    ...\n}\n```\n\n\"쥔 채로 기다리지 말고 양보하자\" 는 발상 자체는 맞다.\n그런데 두 스레드의 박자가 맞으면 **잡고 → 실패 → 놓고 → 다시 잡고** 를 영원히 반복한다.\n\n**멈춰 있지 않다. CPU 도 계속 쓴다. 그런데 아무도 이체를 못 끝낸다.**\n\n| | 상태 | 누가 못 하나 |\n|---|---|---|\n| **Deadlock** | **멈춰 있다.** 아무도 안 움직인다 | 걸린 전원 |\n| **Livelock** | **계속 움직인다.** 상태는 바뀌는데 진행이 없다 | 걸린 전원 |\n| **Starvation** | 시스템은 잘 돌아간다 | **특정 하나만** 계속 밀린다 |\n\nDeadlock 과 Livelock 은 **아무도 진행 못 한다** 는 결과가 같다.\n다른 건 멈춰 있느냐 바쁘게 움직이느냐다.\n그래서 Livelock 이 더 찾기 어렵다 — CPU 가 돌고 있어서 멈춘 것처럼 안 보인다.\n\nStarvation 은 결이 다르다.\n남들은 다 잘 돌아가는데 특정 스레드만 계속 순서가 안 온다.\n→ `concurrency/reader_writer.md` 의 writer starvation 이 같은 이야기다.\n\n복도 비유로 묶으면:\n\n```\nDeadlock    서로 마주 서서 아무도 안 비킨다\nLivelock    서로 동시에 같은 쪽으로 비켜서 또 막힌다. 계속 움직이는데 못 지나간다\nStarvation  나만 계속 뒤로 밀린다. 남들은 잘 지나간다\n```\n",

    "Q1: IPC 가 뭐고, 왜 커널을 거쳐야 하나?",

   ],
   "md": "> 2026-10-27 작성. 10/26 Apple Core OS 스크린에서 \"Binder 외에 뭐가 있나\" 에 Binder 만 답했다.\n> 아래 Q2 표의 **첫 열을 순서대로 소리 내 읽을 수 있으면** 그 질문은 끝난다.\n\n---\n\n## Q1: IPC 가 뭐고, 왜 커널을 거쳐야 하나?\n\n주소 공간이 분리된 프로세스끼리 데이터나 신호를 주고받는 방법.\n스레드는 같은 주소 공간이라 IPC 가 필요 없다 (`process_vs_thread.md`).\n\n분리돼 있으니 한쪽이 쓴 메모리를 다른 쪽이 직접 못 본다.\n그래서 **커널이 중간에서 복사해주거나, 같은 물리 페이지를 양쪽에 매핑해준다.**\n전자가 파이프·소켓·메시지, 후자가 공유 메모리다.\n공유 메모리는 매핑을 만들 때만 커널이 끼고 그 뒤 읽고 쓰는 건 그냥 메모리 접근이다.\n\n---\n\n## Q2: IPC 종류를 말해보라\n\n**\"Binder 외에 뭐가 있나\" 의 답.** 첫 열을 위에서 아래로 읽는다. ⭐️\n\n| 종류 | 모양 | 커널 복사 | 쓰는 자리 |\n|---|---|---|---|\n| **파이프** | 한 방향 바이트 스트림. 경계 없음 | 2회 (쓰기 · 읽기) | 셸 `a \\| b`, 부모 → 자식 로그 |\n| **Unix 도메인 소켓** | 양방향 스트림 또는 데이터그램. **fd 를 넘길 수 있다** (SCM_RIGHTS) | 2회 | 데몬 ↔ 클라이언트의 기본. 같은 기계 안에서만 |\n| **공유 메모리** | 같은 물리 페이지를 둘 다 매핑 | **0** (매핑할 때만 개입) | 영상 프레임, 큰 버퍼. 동기화는 별도 |\n| **시그널** | 번호 하나. 데이터 없음 | 없음 | 종료 요청 (TERM), 자식 종료 알림 (CHLD), 타이머 |\n| **메시지 큐** | 경계 있는 메시지, 우선순위 | 2회 | POSIX mq. 실무에선 드묾 |\n| **Binder** | 동기 호출 (RPC). 객체 참조 · fd 전달 | 1회 (커널이 수신자 버퍼에 직접) | Android 의 모든 서비스 호출 |\n| **Mach 메시지** | 경계 있는 메시지. **포트 권한 자체를 담아 보낸다** | 1회 (큰 건 vm 매핑으로 0) | XNU 의 원시 IPC. 커널 객체도 포트로 다룬다 |\n| **XPC** | Mach 위의 직렬화 (dictionary) + 서비스 이름 해석 | Mach 와 같음 | Darwin 데몬 ↔ 앱의 표준. 요청 오면 launchd 가 그때 데몬을 띄움 |\n\n```c\n/* 기본 셋. 전부 POSIX, Darwin·Linux 둘 다 */\nint pfd[2]; pipe(pfd);                                   /* 파이프 */\nint sv[2];  socketpair(AF_UNIX, SOCK_STREAM, 0, sv);     /* Unix 소켓 */\nint shm = shm_open(\"/buf\", O_CREAT | O_RDWR, 0600);      /* 공유 메모리 */\nvoid *m = mmap(NULL, len, PROT_READ|PROT_WRITE, MAP_SHARED, shm, 0);\nkill(pid, SIGTERM);                                      /* 시그널 */\n```\n\n**Android ↔ Darwin 대응** (Core OS 면접이면 이 줄을 붙인다)\n\n| 자리 | Android | Darwin |\n|---|---|---|\n| 서비스 RPC | Binder. 이름 해석은 servicemanager | Mach 메시지 + XPC. 이름 해석은 launchd (bootstrap) |\n| 공유 메모리 | ashmem → memfd, Parcel 의 큰 blob | Mach `vm_remap`, IOSurface (GPU 버퍼) |\n| 로컬 소켓 | zygote 소켓, logd, adbd | syslogd, 많은 데몬의 로컬 포트 |\n| 시그널 | 같음 | 같음. launchd 가 TERM → KILL |\n\n---\n\n## Q3: 뭘 쓸지 어떻게 고르나?\n\n기준은 둘이다. **모양** 과 **양**.\n\n```\n모양   바이트 스트림이면 파이프·소켓\n       경계 있는 메시지면 mq·Binder·Mach\n       그냥 알림이면 시그널\n양     많으면 복사를 피해야 하니 공유 메모리.  IPC 로는 \"준비됐다\" 만 보낸다\n```\n\n큰 데이터를 소켓으로 보내면 복사 두 번(보내는 쪽 → 커널 → 받는 쪽)이 병목이다.\n그래서 Android 의 SurfaceFlinger 버퍼 큐, Darwin 의 IOSurface 는 프레임은 공유 메모리에 두고 핸들만 IPC 로 넘긴다.\n\n---\n\n## Q4: fd 를 다른 프로세스에 넘길 수 있는 건 뭔가?\n\n**Unix 소켓 (SCM_RIGHTS) · Binder · Mach 포트** 셋이다.\n파이프·시그널·mq 는 못 한다.\n\n\"열린 파일·소켓·공유 메모리 핸들을 다른 프로세스에 건네는\" 능력이 서비스 설계의 핵심이다.\n서비스가 클라이언트에 공유 메모리 fd 를 주는 패턴이 이걸로 된다.\n\nBinder 와 Mach 는 공통점이 하나 더 있다.\n**커널이 객체 참조를 센다.** 상대가 죽으면 커널이 알려준다 (Binder 의 death notification, Mach 의 dead-name notification).\n소켓은 EOF 로만 안다.\n\n```c\n/* Unix 소켓으로 fd 넘기기. 커널이 받는 쪽 fd 테이블에 새 번호로 복제해준다 */\nstruct msghdr mh = {0}; struct iovec io = { \"x\", 1 };\nchar cbuf[CMSG_SPACE(sizeof(int))];\nmh.msg_iov = &io; mh.msg_iovlen = 1; mh.msg_control = cbuf; mh.msg_controllen = sizeof cbuf;\nstruct cmsghdr *c = CMSG_FIRSTHDR(&mh);\nc->cmsg_level = SOL_SOCKET; c->cmsg_type = SCM_RIGHTS; c->cmsg_len = CMSG_LEN(sizeof(int));\nmemcpy(CMSG_DATA(c), &shm_fd, sizeof(int));\nsendmsg(sock, &mh, 0);\n```\n\n---\n\n## Follow-up: 공유 메모리가 제일 빠른데 왜 다 그걸로 안 하나?\n\n**동기화가 공짜가 아니다.**\n한쪽이 쓰는 중에 다른 쪽이 읽으면 깨진 데이터를 본다.\n프로세스 간 뮤텍스 (`PTHREAD_PROCESS_SHARED`), 세마포어, 또는 원자 연산 + 메모리 배리어가 따로 필요하다.\n\"공유 메모리로 빠르게\" 라고만 답하면 반쪽이다.\n\n### 틀리기 쉬운 것\n\n```\nX  파이프는 양방향          -> 한 방향. 양방향이면 파이프 두 개거나 socketpair\nX  시그널로 데이터를 보낸다   -> 번호만 간다 (sigqueue 로 int 하나). \"확인해봐\" 신호로만 쓰고 내용은 다른 채널로\nX  Mach 메시지 = 소켓 비슷   -> 핵심은 포트 권한(send right)이 capability 라는 것. 가진 프로세스만 말을 걸 수 있고, 샌드박스가 이걸로 제한한다\n```\n",

   "md": "## Q1: Mutex와 Semaphore 차이를 설명해보세요.\n\n| | Mutex | Semaphore |\n|---|-------|-----------|\n| 동시 접근 | 1개만 | N개까지 (counting) |\n| 소유권 | lock한 스레드만 unlock 가능 | 누구나 signal 가능 |\n| 목적 | 상호 배제 (mutual exclusion) | 리소스 카운팅 / 시그널링 |\n| 비유 | 화장실 열쇠 (1명) | 주차장 빈 자리 카운터 |\n\nBinary semaphore(값 0 or 1)와 mutex는 비슷해 보이지만, 소유권 개념이 다름.\n\n### 소유권이 왜 중요한가 — binary semaphore != mutex 인 이유\n\n```\nMutex      A가 lock    -> B가 unlock    X  (내가 잠근 건 나만 연다)\nSemaphore  A가 acquire -> B가 release   O\n```\n\n이 \"된다\"가 용도를 가른다. 소유자가 없어서 **서로 다른 스레드끼리 신호를 주고받을 수 있음**:\n\n```\nProducer 스레드:  버퍼에 넣고 -> sem.release()   \"하나 채웠다\"\nConsumer 스레드:  sem.acquire() -> 꺼냄          \"기다렸다 받는다\"\n```\n\nproducer_consumer.md 의 뼈대가 이것. Mutex로는 이 패턴이 안 만들어진다.\n\n-> Mutex = \"이 자원은 내 거\" (상호 배제)\n   Semaphore = \"몇 개 남았나 세기 + 남에게 신호\" (카운팅 + 시그널링)\n\n---\n\n## Q2: 각각 언제 쓰나요?\n\n**Mutex:**\n- Critical section 보호 (공유 변수 수정)\n- 파일 단독 접근\n- 하나의 자원을 하나의 스레드만 사용해야 할 때\n\n**Semaphore:**\n- Connection pool (최대 10개 연결 허용)\n- Producer-Consumer 패턴 (버퍼 빈 칸/찬 칸 카운트)\n- 스레드 간 순서 제어 (시그널링)\n\n---\n\n## Q3: C++에서의 사용 예시?\n\n**Mutex:**\n```cpp\nstd::mutex mtx;\n\nvoid critical() {\n    std::lock_guard<std::mutex> lock(mtx);\n    // 여기서 공유 자원 접근\n}  // 스코프 끝나면 자동 unlock\n```\n\n**Semaphore (C++20):**\n```cpp\nstd::counting_semaphore<3> sem(3);  // 최대 3개 동시 접근\n\nvoid access_resource() {\n    sem.acquire();     // 카운터 -1 (0이면 대기)\n    // 자원 사용\n    sem.release();     // 카운터 +1\n}\n```\n\n---\n\n## Follow-up: Spinlock이란?\n\n- Mutex의 변형. lock을 못 잡으면 sleep하지 않고 **busy-waiting** (반복 체크).\n- 장점: context switch 비용 없음\n- 단점: CPU 낭비\n- 용도: lock 보유 시간이 매우 짧을 때 (커널 내부, 멀티코어 환경)\n\n기준선: **lock 보유 시간 < context switch 비용(수 us)** 이면 spin이 이김.\n오래 잡을 거면 잠들어서 CPU를 남에게 양보하는 게 이득.\n(mutex로 대기 = 스레드가 blocked -> 스케줄러 개입 -> context switch.\n spinlock은 그걸 피하는 것. cf. user_kernel_mode.md Follow-up 2)\n",

   "md": "> 2026-10-27 작성. 10/26 Apple Core OS 스크린에서 \"pthreads 아세요\" 를 못 알아들었다.\n> 묻는 건 **이 함수들을 써 봤냐** 다. `deadlock.md` 의 계좌 이체 코드, `race_condition.md`, `mutex_vs_semaphore.md` 가 전부 이 API 다.\n\n---\n\n## Q1: pthreads 가 뭔가?\n\nC 에서 스레드를 만들고 동기화하는 **POSIX 표준 API**. 헤더 `pthread.h`.\nDarwin 은 libSystem 에 포함, Linux 는 glibc (옛 버전은 `-lpthread`).\n\n함수는 네 묶음이다. ⭐️\n\n| 묶음 | 함수 | 하는 일 |\n|---|---|---|\n| **생명주기** | `pthread_create` / `join` / `detach` / `exit` | 만들고, 기다리고, 떼어내고, 끝낸다 |\n| **상호 배제** | `pthread_mutex_*` / `rwlock_*` / `spin_*` | 한 번에 하나만 |\n| **대기·신호** | `pthread_cond_wait` / `signal` / `broadcast` | 조건이 될 때까지 재우고 깨운다 |\n| **부가** | `pthread_once` / `key_create` (TLS) / `attr_*` | 한 번만 초기화, 스레드별 저장소, 스택 크기 |\n\n```c\nint pthread_create(pthread_t *t, const pthread_attr_t *attr, void *(*fn)(void *), void *arg);\nint pthread_join(pthread_t t, void **ret);       /* 끝날 때까지 기다리고 반환값 수거 */\nint pthread_detach(pthread_t t);                 /* join 안 할 거면. 끝나면 알아서 정리 */\n\nint pthread_mutex_lock(pthread_mutex_t *m);      /* 잠근 스레드만 풀 수 있다 (소유자) */\nint pthread_mutex_trylock(pthread_mutex_t *m);   /* 못 잡으면 EBUSY, 안 기다림 */\nint pthread_mutex_unlock(pthread_mutex_t *m);\n\nint pthread_cond_wait(pthread_cond_t *c, pthread_mutex_t *m);  /* 뮤텍스를 풀고 잠들었다가, 깨면 다시 잡고 돌아옴 */\nint pthread_cond_signal(pthread_cond_t *c);      /* 하나 깨움 */\nint pthread_cond_broadcast(pthread_cond_t *c);   /* 전부 깨움 */\n```\n\n**오류 처리가 특이하다.** `errno` 를 안 쓰고 **반환값이 오류 코드** 다. 0 이 성공.\n`if (pthread_mutex_lock(&m) != 0)` 식으로 검사한다.\n\n---\n\n## Q2: `pthread_create` 의 인자 넷은? `join` 을 안 하면?\n\n| 인자 | 뜻 |\n|---|---|\n| `pthread_t *t` | 핸들 받을 곳 |\n| `attr` | 속성. NULL 이면 기본 (스택 크기 등) |\n| `void *(*fn)(void *)` | 실행할 함수. 인자 하나, 반환 하나, 둘 다 `void *` |\n| `void *arg` | 그 함수에 줄 인자. 여러 값이면 구조체 포인터 |\n\n```c\nstatic void *worker(void *arg) {\n    int id = *(int *)arg;\n    /* ... */\n    return NULL;            /* 반환값은 join 의 두 번째 인자로 전달됨 */\n}\npthread_t t; int id = 1;\npthread_create(&t, NULL, worker, &id);\npthread_join(t, NULL);\n```\n\n**join 을 안 하면** 스레드가 끝나도 스택·핸들이 남는다. 프로세스의 좀비와 같다.\n`join` 하거나 `detach` 해야 하고, 둘 다 안 하면 누수다.\n데몬에서 작업 스레드를 만들고 잊으면 핸들이 쌓인다.\n\n---\n\n## Q3: `cond_wait` 를 왜 `while` 로 감싸고, 왜 뮤텍스를 넘기나?\n\n```c\npthread_mutex_lock(&m);\nwhile (!ready)                      /* if 가 아니라 while */\n    pthread_cond_wait(&c, &m);      /* 뮤텍스를 넘긴다 */\n/* ready 가 참인 상태로 뮤텍스를 쥐고 있음 */\npthread_mutex_unlock(&m);\n```\n\n**while 인 이유: spurious wakeup.**\n신호 없이도 깰 수 있고, 깨서 뮤텍스를 다시 잡는 사이 다른 스레드가 조건을 바꿨을 수 있다.\n그래서 깨고 나서 조건을 다시 확인해야 한다.\n\n**뮤텍스를 넘기는 이유: lost wakeup.**\n\"조건 검사 → 잠들기\" 사이에 신호가 오면 영원히 못 깬다.\n`cond_wait` 는 **뮤텍스를 풀고 잠드는 것을 원자적으로** 해준다. 그래서 뮤텍스가 필요하다.\n\n조건 변수는 항상 **뮤텍스 + 조건 변수 + 상태 변수** 세 개가 한 묶음이다.\n조건 변수 혼자는 상태를 기억하지 않는다 (`producer_consumer.md`).\n\n---\n\n## Q4: Darwin 에서는 뭐가 다른가?\n\npthread 는 **Mach 스레드 위의 라이브러리** 다.\n커널(XNU)이 스케줄하는 건 Mach 스레드고, 뮤텍스 대기는 `psynch` 트랩으로 들어간다.\n\n| | Darwin | Linux |\n|---|---|---|\n| 커널 스레드 | Mach 스레드 | task (clone) |\n| 뮤텍스 대기 | psynch 트랩 | futex |\n| 기본 스택 | **512 KB** (메인은 8 MB) | 8 MB |\n| C11 threads | 지원 안 함 | glibc 2.28+ |\n\n기본 스택이 512 KB 라 작업 스레드에서 깊은 재귀가 메인보다 16 배 빨리 터진다.\n스택 크기는 `attr` 로 **create 전에** 정한다. 만든 뒤에는 못 바꾼다.\n\n---\n\n## Follow-up: 스레드가 있는 프로세스에서 fork 하면?\n\n**자식엔 fork 한 스레드만 복제된다.**\n다른 스레드가 잡고 있던 뮤텍스는 자식에서 영원히 잠긴 채다. 풀어줄 스레드가 없다.\n그래서 fork 뒤엔 바로 exec 하거나 async-signal-safe 함수만 쓴다.\n\n### 틀리기 쉬운 것\n\n```\nX  pthread_cancel 로 스레드를 끝낸다   -> 어디서 끊길지 몰라 뮤텍스를 잡은 채 죽을 수 있다. 플래그를 세우고 스스로 빠져나오게\nX  pthread_t 를 정수로 비교·출력      -> Darwin 은 포인터, Linux 는 unsigned long. 비교는 pthread_equal\nX  메인이 return 해도 스레드는 돈다    -> 메인이 return 하면 프로세스 전체가 끝난다 (exit). 메인은 join 하거나 pthread_exit 로 빠져야\nX  다른 스레드가 unlock 해도 된다     -> 기본 타입은 UB, errorcheck 타입은 EPERM. 소유자만 푼다. 세마포어와의 차이가 이것\n```\n",

   "md": "## Q1: 주요 스케줄링 알고리즘을 설명해보세요.\n\n| 알고리즘 | 방식 | 특징 |\n|----------|------|------|\n| FCFS | 먼저 온 순서대로 | 단순, Convoy effect 문제 |\n| SJF | 실행 시간 짧은 것 우선 | 평균 대기시간 최소. 실행 시간 예측 어려움 |\n| Round Robin | 시간 할당량(quantum)만큼 돌아가며 | 응답 시간 좋음. quantum 크기가 핵심 |\n| Priority | 우선순위 높은 것 먼저 | Starvation 가능 → aging으로 해결 |\n| MLFQ | 여러 큐 + 피드백 | 실제 OS에서 가장 많이 사용 |\n\n---\n\n## Q2: Preemptive vs Non-preemptive 차이는?\n\n- **Non-preemptive**: 프로세스가 자발적으로 CPU 반납할 때까지 대기. (FCFS, non-preemptive SJF)\n- **Preemptive**: OS가 강제로 CPU를 빼앗을 수 있음. (RR, preemptive SJF, priority)\n\n현대 OS는 대부분 preemptive. 하나의 프로세스가 CPU 독점하는 걸 방지.\n\n---\n\n## Q3: Round Robin에서 time quantum을 어떻게 정하나요?\n\n- **너무 작으면** → context switch 오버헤드가 실행 시간보다 커짐\n- **너무 크면** → FCFS랑 다를 게 없음 (응답 시간 증가)\n- 일반적으로 10~100ms, 전체 CPU burst의 80%가 quantum 내에 끝나도록 설정하는 게 규칙.\n\n---\n\n## Follow-up: Starvation과 Aging이란?\n\n- **Starvation**: 낮은 우선순위 프로세스가 영원히 실행 못 하는 상황\n- **Aging**: 대기 시간이 길어질수록 우선순위를 점진적으로 올려주는 기법, Starvation 방지.\n",

   "md": "> 2026-09-08 재작성. 목록을 외우는 대신 `printf` 한 줄에 전부 매단다.\n> 세 번(2/5, 3/5, 1.5/5) 낮은 점수가 나온 이유가 \"3가지 / 2x2 / 약자 3개\"를 따로 외우려 한 것이었음.\n> 2026-10-27 보강. 10/26 Apple Core OS 스크린에서 \"커널로 들어가는 경로\" 를 못 답해 다섯 단계 표와 Darwin 디테일을 그림 바로 아래에 추가.\n\n---\n\n## 기준점: `printf(\"hello\")` 가 화면에 찍히기까지\n\n```\nprintf(\"hello\")\n   |\n   |  libc 의 write() 래퍼            <- 아직 user mode. 그냥 함수 호출일 뿐\n   |\n   |  syscall 명령어  (= trap)         <- ★ 여기서 CPU 가 mode bit 을 뒤집는다\n   |     - 복귀 주소 + flags 저장\n   |     - 커널 스택으로 교체\n   |     - 커널이 등록해둔 진입점으로 점프\n   |\n   |  커널의 sys_write() 실행 -> 하드웨어 I/O\n   |\n   |  sysret -> 저장해둔 곳으로 복귀, mode bit 원상복구\n   v\nprintf 다음 줄\n```\n\n**이 그림 하나에서 아래가 전부 파생된다.**\n\n### 그림을 다섯 단계로 끊으면 (10/26 Apple 스크린에서 못 답한 질문)\n\n\"유저 코드가 커널로 들어가는 경로를 설명해보라\" 는 위 그림을 **다섯 단어** 로 말하는 것이다.\n**트랩 명령 · 모드 전환 · 커널 스택 · 번호 디스패치 · 복귀.** 이 순서대로만 말하면 된다. ⭐️\n\n| 단계 | 누가 | 하는 일 |\n|---|---|---|\n| 1 래퍼 | libc | 시스템 콜 **번호** 와 인자를 약속된 레지스터에 싣는다. 프로그램은 raw 트랩을 직접 안 쓴다 |\n| 2 트랩 | CPU | `svc` (arm64) / `syscall` (x86-64) 한 줄. 모드를 커널로 바꾸고, PC 를 커널 진입점(벡터 테이블)으로, 복귀 주소와 유저 상태를 보관 |\n| 3 저장·스택 교체 | 커널 진입 asm | 유저 레지스터 전부 저장. 스택을 그 스레드의 **커널 스택** 으로 교체. 유저 스택은 못 믿는다 |\n| 4 디스패치 | 커널 C | 번호가 범위 안인지 검사 → 테이블에서 핸들러 → 포인터 인자는 `copyin` 으로 검증하며 복사 → 실행 |\n| 5 복귀 | 커널 → CPU | 결과를 레지스터에, 레지스터 복원, `eret` / `sysret` 로 유저 모드. 시그널이 쌓여 있으면 복귀 직전에 핸들러로 |\n\n```asm\n; write(1, \"hi\\n\", 3) 이 Darwin arm64 에서 실제로 거치는 길\nmov  x16, #4        ; 1. 번호 (write = 4) 는 x16 에\nmov  x0,  #1        ;    fd\nadr  x1,  msg       ;    buf\nmov  x2,  #3        ;    len\nsvc  #0x80          ; 2. 트랩. 여기서 EL0 -> EL1\n                    ; 3-4. 커널: 레지스터 저장 -> 커널 스택 -> sysent[4] -> 결과 x0\n                    ; 5. eret. 다시 EL0. 래퍼가 x0 를 반환값으로, 오류면 errno 세팅\n```\n\n**틀리기 쉬운 두 가지**\n\n```\nX  \"시스템 콜 = 컨텍스트 스위치\"    -> 같은 스레드 안에서 모드만 바뀐다 (Q4). 커널 안에서 블록돼 다른 스레드로 넘어가면 그때 추가로 일어날 뿐\nX  \"커널이 유저 스택을 그대로 쓴다\"  -> 유저 스택은 조작돼 있을 수 있다. 스레드마다 별도 커널 스택이 있고, 포인터 인자도 copyin 으로 복사해서 쓴다\n```\n\n**Darwin 디테일 (Core OS 면접용)**\n\n| | Darwin (XNU) | Linux |\n|---|---|---|\n| 번호 공간 | 양수 = BSD 콜 (write, open, mmap), 음수 = Mach 트랩 (mach_msg, vm_allocate). 두 커널 계층이 한 입구를 나눠 쓴다 | 테이블 하나 |\n| 공개 ABI | libSystem 만. raw 번호는 릴리즈마다 바뀔 수 있어 정적 링크·직접 `svc` 는 깨진다 | 번호가 안정 ABI |\n| 관찰 | `dtruss -p PID`, `fs_usage` | `strace -p PID`, `perf trace` |\n\n비용은 모드 전환 자체가 수십 ns, 레지스터 저장·복원과 캐시·TLB 오염, Meltdown 이후 커널 페이지 테이블 분리까지 합치면 수백 ns 에서 1 µs.\n그래서 `read` 를 1 바이트씩 루프에서 부르면 느리고 stdio 버퍼링이 존재한다.\n`gettimeofday` 같은 건 커널이 읽기 전용 페이지를 유저에 매핑해둬서(Linux vDSO, Darwin commpage) 트랩 없이 읽는다.\n\n---\n\n## Q1: User mode 와 Kernel mode 의 차이는?\n\n| | User Mode | Kernel Mode |\n|---|-----------|-------------|\n| 권한 | 제한적, 하드웨어 직접 접근 불가 | 모든 명령어 + 하드웨어 접근 가능 |\n| 메모리 접근 | 자기 address space 만 | 모든 메모리 접근 가능 |\n| 실패 시 | 해당 프로세스만 crash | 전체 시스템 crash (kernel panic) |\n| 예시 | 앱 코드 실행 | 드라이버, 스케줄러, 메모리 관리 |\n\nCPU 의 mode bit 으로 구분 (0 = kernel, 1 = user).\n유저 코드는 이 비트를 **직접 못 쓴다.** 그런 명령어가 user mode 에서 금지되어 있다.\n\n---\n\n## Q2: 왜 `call` 이 아니라 `syscall` 인가?\n\n위 그림에서 제일 중요한 줄.\n\n```asm\ncall sys_write     ; X  점프할 주소를 내가 적는다\nsyscall            ; O  주소를 안 적는다. CPU 가 커널이 등록해둔 곳으로 보낸다\n```\n\n**문은 하나뿐이고, 그 문 위치는 커널이 정한다.**\n유저는 \"들어가겠다\"는 의사표시만 할 수 있다. 이게 보호(protection)의 핵심.\n\n`trap` = 이렇게 일부러 커널로 들어가려고 실행하는 명령어.\n**전환의 네 번째 종류가 아니라, syscall 이 들어가는 방법이다.** (Q3 과 헷갈리지 말 것)\n\n---\n\n## Q3: User -> Kernel 전환이 일어나는 경우는?\n\n`printf` 는 그중 **첫 번째** 경우일 뿐이다. 나머지 둘은 이렇게 갈린다:\n\n- **내가 부탁했나** -> **System call** (printf, file open, fork)\n- **내가 사고쳤나** -> **Exception** (divide by zero, page fault, segfault)\n- **밖에서 찔렀나** -> **Interrupt** (키보드, 타이머, 디스크 완료)\n\n부탁 / 사고 / 찔림. 앞의 둘은 **내 명령어가 원인**이고, interrupt 만 외부에서 온다.\n\n> 참고: 축 2개(의도적·비의도적 x 동기·비동기)로 보면 4칸 중 3칸만 찬다.\n> \"외부에서 오는 걸 내가 의도할 수는 없으니\" 그 칸이 빈다.\n> 다만 이건 정리용이지, 이걸 외워서 3개를 끄집어내려 하면 매번 하나씩 빠진다.\n> **부탁 / 사고 / 찔림으로 세는 게 낫다.**\n\n---\n\n## Q4: Mode switch 와 Context switch 는 다른가?\n\n**다르다. 세 번 다 여기서 틀렸다.**\n\n맨 위 `printf` 그림을 다시 보면, 저 흐름 어디에도 **\"프로세스를 바꾼다\"는 단계가 없다.**\n같은 프로세스가 권한만 잠깐 올렸다 내리는 것뿐.\n\n| | Mode switch | Context switch |\n|---|---|---|\n| 바뀌는 것 | 같은 프로세스의 **권한 레벨만** | **프로세스 자체**가 교체 |\n| 메모리 지도 | 그대로 | 통째로 교체 |\n| 비용 | 수백 ns | 수 us (수십 배) |\n\n### 반복해서 틀린 오답 두 개\n\n```\nX  \"저장을 안 해서 싸다\"        -> 저장한다. 안 하면 돌아갈 곳을 모른다\nX  \"비트 하나만 바꿔서 싸다\"     -> 복귀 주소 + flags 저장 + 스택 교체까지 한다\nO  \"프로세스를 안 바꿔서 싸다\"   -> 메모리 지도를 갈아끼울 필요가 없다\n```\n\n### 면접 한 줄\n\n> Mode switch 는 같은 프로세스에서 권한만 바뀌는 거라 주소공간이 그대로입니다.\n> Context switch 는 프로세스가 바뀌어서 페이지 테이블을 교체하고 캐시를 날려야 해서 훨씬 비쌉니다.\n\n---\n\n## Follow-up: 왜 이렇게 분리해놨나?\n\n**Protection.** 악의적이거나 버그 있는 프로그램이:\n- 다른 프로세스 메모리를 건드리는 것 방지\n- 하드웨어를 직접 조작하는 것 방지\n- OS 자체를 손상시키는 것 방지\n\n대가: mode 전환 비용 (수백 ns). 그래서 빈번한 system call 은 성능에 영향.\n\n---\n\n## 참고 (외우지 말 것)\n\nQ4 의 \"메모리 지도 교체\"가 실제로 무슨 일인지. **면접에서 이 약자들까지 묻는 경우는 드물다.**\nQ4 를 위 표 수준으로 말할 수 있으면 충분하고, 아래는 그 배경일 뿐이다.\n\n| 약자 | 원말 | 한 줄 |\n|---|---|---|\n| CR3 | Control Register 3 | \"지금 프로세스의 메모리 지도(페이지 테이블)가 어디 있는지\" 가리키는 레지스터 |\n| TLB | Translation Lookaside Buffer | 그 지도를 매번 보기 느려서 만든 캐시 |\n| PCB | Process Control Block | 프로세스 하나의 신상명세서 (지도 위치·레지스터·우선순위·열어둔 파일) |\n\n비유: CR3 = 지도책이 책장 어디 꽂혔는지 적힌 쪽지 / TLB = 자주 찾는 페이지를 적어둔 메모지.\n**지도책을 바꾸면 메모지는 전부 쓰레기** -> 버려야 함(TLB flush) -> 한동안 느려짐.\n이게 context switch 가 비싼 이유의 실체.\n\ncf. `context_switch.md`, `virtual_memory.md`\n",

   "md": "## Q1: Virtual memory란?\n\n각 프로세스에게 연속적이고 독립적인 메모리 공간이 있는 것처럼 보이게 하는 추상화.\n실제 물리 메모리(RAM)보다 큰 주소 공간을 제공.\n\n핵심 아이디어: 프로세스의 전체 메모리가 RAM에 있을 필요 없음. 지금 쓰는 부분만 RAM에, 나머지는 디스크(swap)에.\n\n---\n\n## Q2: Paging이 뭔가요?\n\n- Virtual memory를 고정 크기 **page** (보통 4KB)로 나눔\n- Physical memory를 같은 크기 **frame**으로 나눔\n- **Page table**이 virtual page → physical frame 매핑을 관리\n- 연속적인 virtual address가 불연속적인 physical address에 매핑될 수 있음\n\n장점: external fragmentation 없음 (고정 크기라서)\n\n---\n\n## Q3: Page fault가 뭐고, 어떻게 처리되나요?\n\n접근하려는 page가 RAM에 없을 때 발생하는 인터럽트.\n\n처리 순서:\n1. CPU가 page table에서 valid bit 확인 → invalid (RAM에 없음)\n2. Page fault trap 발생 → OS에 제어 넘어감\n3. 디스크에서 해당 page를 빈 frame에 로드\n4. Page table 업데이트 (valid bit 설정, frame 번호 기록)\n5. 중단됐던 명령어 재실행\n\nRAM이 꽉 차면? → Page replacement algorithm (LRU, FIFO, Clock 등)으로 victim page 선택 후 swap out.\n\n---\n\n## Follow-up: TLB란?\n\n**Translation Lookaside Buffer** - page table의 캐시.\n\n- Page table은 메모리에 있음 → 매 메모리 접근마다 page table 조회 = 2번 메모리 접근\n- TLB는 최근 사용된 page-frame 매핑을 CPU 내부에 캐시\n- TLB hit → 1번 메모리 접근으로 해결\n",

<script id="app-js">
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("app-state").textContent);
var CARDS = DATA.cards, CATS = DATA.cats;
var CATNAME = {}; CATS.forEach(function(c){ CATNAME[c.key]=c.name; });
var KEY = "fc2.ui.v1";
var TRACKS = [["a","A 구두"],["b1","B-1 구현"],["b2","B-2 알고리즘"]];
var TRACKNAME = {a:"A 도메인 구두", b1:"B-1 임베디드 구현", b2:"B-2 알고리즘"};
var TAGNAME = {A:"Amazon30d",B:"Blind75",N:"NC150",G:"Google",E:"Embedded"};
var ui = load(); if(!TRACKNAME[ui.track]) ui.track="a";
var root = document.getElementById("root"), study = document.getElementById("study");
var queue = [], pos = -1, flipped = false;

function load(){ try{ var r=localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return {seg:"star",cat:"all"}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ui)); }catch(e){} }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- theme ---------- */
function applyTheme(){
  var t = ui.theme;
  if(t==="dark"||t==="light") document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
}
function cycleTheme(){
  var order=["system","dark","light"], i=order.indexOf(ui.theme||"system");
  ui.theme = order[(i+1)%3]; save(); applyTheme(); render();
}

/* ---------- selection ---------- */
function cats(){ return CATS.filter(function(c){return c.track===ui.track;}); }
function catIdx(k){ for(var i=0;i<CATS.length;i++) if(CATS[i].key===k) return i; return 999; }
function tcards(){ return CARDS.filter(function(c){return c.track===ui.track;}); }
function segFilter(c){
  if(c.track!==ui.track) return false;
  if(ui.seg==="star") return !!c.pri;
  if(ui.seg==="review") return c.solved && c.review>0;
  if(ui.seg==="unsolved") return !c.solved;
  return true;
}
function numKey(n){ var m=String(n).match(/^([A-Z]*)(\d+)/); return m?[m[1],+m[2]]:["",0]; }
function selected(){
  var xs = CARDS.filter(function(c){ return segFilter(c) && (ui.cat==="all"||c.cat===ui.cat); });
  function base(a,b){
    var d = catIdx(a.cat)-catIdx(b.cat); if(d) return d;
    if(a.kind==="cpp"){ var ka=numKey(a.num), kb=numKey(b.num); return ka[0].localeCompare(kb[0]) || (ka[1]-kb[1]); }
    return a.title.localeCompare(b.title);
  }
  if(ui.seg==="review"){
    xs.sort(function(a,b){ return (b.review-a.review) || base(a,b); });
  }else{
    xs.sort(function(a,b){ return ((b.pri?1:0)-(a.pri?1:0)) || base(a,b); });
  }
  return xs;
}
function counts(){
  var s=0,r=0,u=0,xs=tcards();
  xs.forEach(function(c){ if(c.pri) s++; if(c.solved&&c.review>0) r++; if(!c.solved) u++; });
  return {star:s, review:r, all:xs.length, unsolved:u};
}

/* ---------- list ---------- */
function render(){
  var xs = selected(), k = counts(), all = tcards();
  var solved = all.filter(function(c){return c.solved;}).length;
  var themeIcon = ui.theme==="dark"?"●":ui.theme==="light"?"○":"◐";
  var isA = ui.track==="a";

  var h = '<div class="wrap"><div class="top">';
  h += '<div class="brand"><h1>'+esc(TRACKNAME[ui.track])+'</h1><span class="cnt mono">'+solved+' / '+all.length+' 완료</span><span class="grow"></span>';
  h += '<button class="theme" id="theme" title="테마" aria-label="테마 전환">'+themeIcon+'</button></div>';
  h += '<div class="tracks" role="tablist">';
  TRACKS.forEach(function(tr){
    var xs2 = CARDS.filter(function(c){return c.track===tr[0];});
    var n = xs2.filter(function(c){return !c.solved;}).length;
    h += '<button class="track" role="tab" data-track="'+tr[0]+'" aria-pressed="'+(ui.track===tr[0])+'">'+tr[1]+(n?'<em>'+n+'</em>':'')+'</button>';
  });
  h += '</div>';
  h += '<div class="seg" role="tablist">';
  [["star","★",k.star],["review","복습",k.review],["all","전체",k.all],["unsolved",isA?"미학습":"안 푼",k.unsolved]].forEach(function(s){
    h += '<button role="tab" data-seg="'+s[0]+'" aria-pressed="'+(ui.seg===s[0])+'">'+s[1]+'<em>'+s[2]+'</em></button>';
  });
  h += '</div>';
  var cs = cats();
  if(cs.length>1){
    h += '<div class="chips">';
    h += '<button class="chip" data-cat="all" aria-pressed="'+(ui.cat==="all")+'">전체</button>';
    cs.forEach(function(c){
      var n = CARDS.filter(function(x){ return x.cat===c.key && segFilter(x); }).length;
      if(!n && ui.cat!==c.key) return;
      h += '<button class="chip" data-cat="'+esc(c.key)+'" aria-pressed="'+(ui.cat===c.key)+'">'+esc(c.name)+'<em>'+n+'</em></button>';
    });
    h += '</div>';
  }
  h += '</div>';

  h += '<div class="list">';
  if(!xs.length){
    h += '<div class="empty">'+(ui.seg==="review"?"복습할 카드가 없습니다.":ui.seg==="star"?"★ 카드가 없습니다.":"해당하는 카드가 없습니다.")+'</div>';
  }else if(ui.seg==="review" && ui.cat==="all"){
    [3,2,1].forEach(function(lv){
      var g = xs.filter(function(c){return c.review===lv;});
      if(!g.length) return;
      h += '<div class="group"><div class="group-h">'+["","다시 보면 좋음","다시 볼 것","반드시 복습"][lv]+'<em>'+g.length+'</em></div><div class="rows">';
      g.forEach(function(c){ h += rowHTML(c); });
      h += '</div></div>';
    });
  }else{
    var cur=null;
    xs.forEach(function(c){
      if(c.cat!==cur){
        if(cur!==null) h += '</div></div>';
        cur=c.cat;
        var tot = all.filter(function(x){return x.cat===cur;}).length;
        var sv  = all.filter(function(x){return x.cat===cur && x.solved;}).length;
        h += '<div class="group"><div class="group-h">'+esc(CATNAME[cur]||cur)+'<em>'+sv+'/'+tot+'</em></div><div class="rows">';
      }
      h += rowHTML(c);
    });
    if(cur!==null) h += '</div></div>';
  }
  h += '</div></div>';
  root.innerHTML = h;
}
function rowHTML(c){
  var nf = c.followups && c.followups.length ? '<span class="fu-badge" title="꼬리질문">꼬리 '+c.followups.length+'</span>' : '';
  return '<button class="row'+(c.solved?"":" unsolved")+(c.pri?" pri":"")+'" data-id="'+esc(c.id)+'" data-r="'+(c.solved?c.review:0)+'">'
    + '<span class="n">'+esc(c.kind==="cpp"?c.num:((c.qs||[]).length?(c.qs.length+"Q"):""))+'</span>'
    + '<span class="t">'+esc(c.title)+'</span>'
    + '<span class="meta">'+(c.pri?'<span class="pri-badge">'+esc(c.pri)+'</span>':'')+nf+(c.diff?'<span class="diff '+esc(c.diff)+'">'+esc(c.diff)+'</span>':'')
    + '<span class="rv" data-r="'+(c.solved?c.review:0)+'"><i></i><i></i><i></i></span></span>'
    + '</button>';
}

/* ---------- study ---------- */
var DESK = window.matchMedia("(min-width:900px)");
function drawEmpty(){
  study.innerHTML = '<div class="s-empty"><div>왼쪽에서 카드를 고르면 여기에 열립니다<br><br><kbd>←</kbd> <kbd>→</kbd> 이동 · <kbd>Space</kbd> 뒤집기 · <kbd>Esc</kbd> 닫기</div></div>';
}
function open(id){
  queue = selected();
  pos = queue.findIndex(function(c){return c.id===id;});
  if(pos<0){ queue=tcards(); pos=queue.findIndex(function(c){return c.id===id;}); }
  flipped=false;
  study.classList.add("open"); study.setAttribute("aria-hidden","false");
  if(!DESK.matches) document.body.style.overflow="hidden";
  drawStudy();
}
function close(){
  study.classList.remove("open"); study.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
  if(DESK.matches) drawEmpty();
}
function go(d){
  var n=pos+d; if(n<0||n>=queue.length) return;
  pos=n; flipped=false; drawStudy();
}
function flip(){ flipped=!flipped; study.querySelector(".card").classList.toggle("flipped",flipped); }

function noteHTML(s){
  if(!s) return "";
  var parts = String(s).split("```");
  var out = "";
  for(var i=0;i<parts.length;i++){
    var seg = parts[i];
    if(i%2===1){ out += '<div class="ncode">'+esc(seg.replace(/^\n/,"").replace(/\n$/,""))+'</div>'; }
    else{ var txt = seg.replace(/^\n/,"").replace(/\n$/,""); if(txt.trim()) out += '<div class="p">'+esc(txt)+'</div>'; }
  }
  return out;
}
var MDCACHE = {};
function mdHTML(c){
  if(MDCACHE[c.id]) return MDCACHE[c.id];
  var out, math = [];
  var src = (c.md||"")
    .replace(/\$\$([\s\S]+?)\$\$/g, function(_,m){ math.push("$$"+m+"$$"); return "QQMATH"+(math.length-1)+"QQ"; })
    .replace(/\$([^$\n]+?)\$/g, function(_,m){ math.push("$"+m+"$"); return "QQMATH"+(math.length-1)+"QQ"; });
  if(window.marked && marked.parse){
    try{ out = marked.parse(src, {gfm:true, breaks:false}); }catch(e){ out = null; }
  }
  if(!out) out = noteHTML(src);
  out = out.replace(/QQMATH(\d+)QQ/g, function(_,i){ return esc(math[+i]); });
  out = out.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');
  MDCACHE[c.id] = out; return out;
}
function fuHTML(c){
  if(!c.followups || !c.followups.length) return "";
  return '<p class="b-label fu">꼬리질문 <span class="mono">'+c.followups.length+'</span></p><ol class="fulist">'
    + c.followups.map(function(q){ return '<li>'+esc(q)+'</li>'; }).join("") + '</ol>';
}
function barHTML(){
  return '<div class="s-bar"><button class="close" id="close2" aria-label="닫기">×</button><button id="prev"'+(pos===0?" disabled":"")+'>← 이전</button><button class="flip" id="flip">뒤집기</button><button id="next"'+(pos===queue.length-1?" disabled":"")+'>다음 →</button></div>';
}
function topHTML(c){
  return '<div class="s-top"><span class="pos">'+(pos+1)+' / '+queue.length+'</span><span class="cat">'+esc(c.catName||c.cat)+(c.role&&c.role!==c.catName?' · '+esc(c.role):'')+'</span><span class="grow"></span><button class="x" id="close" aria-label="닫기">×</button></div>';
}
function drawStudy(){
  var c = queue[pos]; if(!c) return;
  if(c.kind!=="cpp"){ drawStudyMD(c); return; }
  var r = c.solved ? c.review : 0;
  var tags = (c.tags||[]).map(function(t){ return '<span class="tag">'+esc(TAGNAME[t]||t)+'</span>'; }).join("");
  var isNum = /^\d+$/.test(String(c.num));
  var front = '<div class="face front">'
    + '<div class="f-body">'
    + '<div class="f-head"><div class="f-num mono">'+(isNum?'<small>#</small>':'')+esc(c.num)+'</div><div class="f-badges">'+(c.diff?'<span class="diff '+esc(c.diff)+'">'+esc(c.diff)+'</span>':'')+tags+'</div></div>'
    + '<h2 class="f-title">'+esc(c.title)+'</h2>'
    + (c.pri?'<span class="f-pri">★ 최소 세트</span>':'')
    + (c.solved?"":'<span class="f-unsolved">아직 안 푼 문제</span>')
    + '<p class="f-desc">'+esc(c.desc||"")+'</p>'
    + '<div class="f-foot">'+(c.link?'<a href="'+esc(c.link)+'" target="_blank" rel="noopener">LeetCode에서 열기 ↗</a>':'')
    + '<span class="f-file">'+esc(c.file)+'</span>'
    + (c.date?'<span class="mono">'+esc(c.date)+'</span>':'')
    + '<span class="hint">탭하면 뒤집힘</span></div>'
    + '</div></div>';

  var cx = "";
  if(c.time||c.space){
    cx = '<div class="cx">'+(c.time?'<span><b>time</b>'+esc(c.time)+'</span>':'')+(c.space?'<span><b>space</b>'+esc(c.space)+'</span>':'')+'</div>';
  }
  var ap = "";
  if(c.approaches && c.approaches.length){
    ap = '<details class="appr"><summary>풀이 접근법 <em class="mono" style="font-style:normal">'+c.approaches.length+'</em></summary>';
    c.approaches.forEach(function(a){
      ap += '<div class="ap"><div class="nm">'+esc(a.name)+'</div><div class="dt">'+esc(a.detail)+'</div><div class="c">'+esc(a.tc)+' · '+esc(a.sc)+'</div></div>';
    });
    ap += '</details>';
  }
  var back = '<div class="face back"><div class="f-body">'
    + '<p class="b-label">내 노트</p>'
    + cx
    + '<div class="note">'+noteHTML(c.note||"")+'</div>'
    + fuHTML(c)
    + ap
    + '</div></div>';

  study.innerHTML = topHTML(c)
    + '<div class="stage"><div class="card'+(flipped?" flipped":"")+'" data-r="'+r+'" id="card">'+front+back+'</div></div>'
    + barHTML();
  ui.last = c.id; save();
}
function drawStudyMD(c){
  var r = c.solved ? c.review : 0;
  var qs = (c.qs||[]).map(function(q){ return '<li>'+esc(q)+'</li>'; }).join("");
  var front = '<div class="face front"><div class="f-body">'
    + '<div class="f-head"><div class="f-cat">'+esc(c.catName)+'</div><div class="f-badges">'+(c.pri?'<span class="pri-badge">'+esc(c.pri)+'</span>':'')+'</div></div>'
    + '<h2 class="f-title">'+esc(c.title)+'</h2>'
    + (c.solved?"":'<span class="f-unsolved">아직 학습 전</span>')
    + (qs?'<ol class="f-qs">'+qs+'</ol>':'<p class="f-desc">'+esc(c.desc||"")+'</p>')
    + '<div class="f-foot"><span class="f-file">'+esc(c.file)+'</span>'
    + (c.date?'<span class="mono">'+esc(c.date)+'</span>':'')
    + '<span class="hint">탭하면 뒤집힘</span></div>'
    + '</div></div>';
  var back = '<div class="face back"><div class="f-body">'
    + '<p class="b-label">전문</p>'
    + '<div class="md">'+mdHTML(c)+'</div>'
    + '</div></div>';
  study.innerHTML = topHTML(c)
    + '<div class="stage"><div class="card'+(flipped?" flipped":"")+'" data-r="'+r+'" id="card">'+front+back+'</div></div>'
    + barHTML();
  ui.last = c.id; save();
  renderMath(study.querySelector(".md"));
}
function renderMath(el){
  if(!el || !window.renderMathInElement) return;
  try{ renderMathInElement(el, {delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}], throwOnError:false}); }catch(e){}
}
window.addEventListener("load", function(){ renderMath(study.querySelector(".md")); });

/* ---------- events ---------- */
root.addEventListener("click", function(e){
  var t=e.target;
  var b;
  if((b=t.closest("[data-track]"))){ ui.track=b.dataset.track; ui.cat="all"; save(); render(); if(DESK.matches && !study.classList.contains("open")) drawEmpty(); return; }
  if((b=t.closest("[data-seg]"))){ ui.seg=b.dataset.seg; save(); render(); return; }
  if((b=t.closest("[data-cat]"))){ ui.cat=b.dataset.cat; save(); render(); return; }
  if((b=t.closest(".row"))){ open(b.dataset.id); return; }
  if(t.closest("#theme")){ cycleTheme(); return; }
});
study.addEventListener("click", function(e){
  var t=e.target;
  if(t.closest("a")) return;
  if(t.closest("#close")||t.closest("#close2")){ close(); return; }
  if(t.closest("#prev")){ go(-1); return; }
  if(t.closest("#next")){ go(1); return; }
  if(t.closest("#flip")){ flip(); return; }
  if(t.closest("summary")) return;
  if(t.closest(".face")){ flip(); return; }
});
document.addEventListener("keydown", function(e){
  if(!study.classList.contains("open")) return;
  if(e.key==="Escape") close();
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="ArrowRight") go(1);
  else if(e.key===" "||e.key==="Enter"){ if(!e.target.closest("summary,a,button")){ e.preventDefault(); flip(); } }
});
var tx=null, ty=null;
study.addEventListener("touchstart", function(e){ var p=e.changedTouches[0]; tx=p.clientX; ty=p.clientY; }, {passive:true});
study.addEventListener("touchend", function(e){
  if(tx===null) return;
  var p=e.changedTouches[0], dx=p.clientX-tx, dy=p.clientY-ty; tx=ty=null;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ go(dx<0?1:-1); }
}, {passive:true});

/* URL 해시: #b1 → 트랙, #b2:G01 또는 #a:android/binder.md → 카드 열기, 끝에 ! 붙이면 뒷면 */
(function(){
  var hsh = decodeURIComponent((location.hash||"").slice(1)); if(!hsh) return;
  var want = hsh.replace(/!$/,"");
  var tr = want.split(":")[0];
  if(TRACKNAME[tr]){ ui.track = tr; ui.cat = "all"; if(want.indexOf(":")>=0) ui.hashOpen = want; }
})();
applyTheme();
render();
if(DESK.matches) drawEmpty();
if(ui.hashOpen){ var id = ui.hashOpen; delete ui.hashOpen; var fl = /!$/.test(location.hash); open(id); if(fl){ flipped=true; var cd=study.querySelector(".card"); if(cd) cd.classList.add("flipped"); } }
DESK.addEventListener("change", function(){
  if(DESK.matches){ document.body.style.overflow=""; if(!study.classList.contains("open")) drawEmpty(); }
  else if(!study.classList.contains("open")) study.innerHTML="";
});
})();
</script>

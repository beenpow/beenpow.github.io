   "md": "> 2026-11-12 작성. Google 면접 1 준비.\n> 근거: Blind v77qsn8s \"Don't forget about volatile\", 레지스터 비트 필드 추출 (Apple 질문 은행 B18), dataford \"상태 비트 폴링에서 volatile 이 최적화를 어떻게 막는가\".\n> 구글 임베디드 라운드 빈도 최상위 묶음이다.\n\n---\n\n## Q1: volatile 은 컴파일러에게 무엇을 말하나?\n\n\"이 객체는 **프로그램 밖에서 바뀔 수 있고, 접근 자체가 부작용** 이다. 소스에 적힌 모든 읽기·쓰기를 적힌 횟수와 순서대로 실제로 수행하라.\"\n\n컴파일러가 하지 않게 되는 것:\n- 루프 밖으로 읽기를 끌어내기 (hoisting), 레지스터에 캐싱.\n- 결과를 안 쓰는 읽기 제거, 같은 값 연속 쓰기 합치기.\n- volatile 접근끼리의 순서 바꾸기.\n\nvolatile 이 **보장하지 않는 것**:\n- CPU 의 실행 순서 재배치 (메모리 배리어 아님).\n- 원자성. `volatile uint64_t` 는 32비트 MCU 에서 두 번에 나눠 읽힌다.\n- 캐시 일관성. 다른 코어나 DMA 가 보는 값과 같다는 보장 없음.\n- 다른 volatile 아닌 접근과의 순서.\n\n---\n\n## Q2: 메모리맵 레지스터 접근 코드는 어떻게 쓰고, 어디서 깨지나?\n\n```c\n#define UART_BASE   0x40011000u\n#define UART_SR     (*(volatile uint32_t *)(UART_BASE + 0x00))   /* status */\n#define UART_DR     (*(volatile uint32_t *)(UART_BASE + 0x04))   /* data   */\n#define SR_TXE      (1u << 7)\n\nvoid uart_putc(char c) {\n    while (!(UART_SR & SR_TXE)) { }     /* volatile 없으면 컴파일러가 한 번만 읽고 무한 루프로 바꾼다 */\n    UART_DR = (uint32_t)c;\n}\n```\n\n| 함정 | 설명 |\n|---|---|\n| 상태 비트 폴링 | volatile 없으면 `while(!(SR & TXE))` 가 `if(!(SR & TXE)) for(;;);` 로 최적화된다 |\n| 읽기 부작용 | read-to-clear 레지스터 (읽으면 플래그가 지워짐). 디버거로 보기만 해도 상태가 바뀐다. `x = REG; y = REG;` 를 합치면 안 되니 volatile 필수 |\n| 쓰기 전용 | write-only 레지스터는 읽으면 쓰레기. 읽기 수정 쓰기 패턴 금지. 드라이버가 섀도 변수를 둔다 |\n| 비트 수정 경쟁 | `REG \\|= BIT` 는 읽기·수정·쓰기 3단계. 중간에 ISR 이 같은 레지스터를 고치면 하나가 사라진다. 인터럽트 마스킹, 또는 하드웨어의 SET/CLR 전용 레지스터 (`REG_SET = BIT`) 사용 |\n| 접근 폭 | 32비트 레지스터를 8비트로 쓰면 버스 오류나 무시. 레지스터 폭 그대로 접근 |\n| 구조체 비트필드 | `struct { uint32_t en:1; ... }` 로 레지스터를 매핑하면 접근 폭·순서·패킹이 구현 정의라 이식성이 없다. 마스크·시프트로 직접 한다 |\n\n**비트 필드 추출·설정 (Apple B18 유형)**\n\n```c\nstatic inline uint32_t reg_get(volatile uint32_t *reg, unsigned shift, unsigned width) {\n    uint32_t mask = (width == 32) ? 0xFFFFFFFFu : ((1u << width) - 1u);\n    return (*reg >> shift) & mask;\n}\nstatic inline void reg_set(volatile uint32_t *reg, unsigned shift, unsigned width, uint32_t val) {\n    uint32_t mask = ((width == 32) ? 0xFFFFFFFFu : ((1u << width) - 1u)) << shift;\n    uint32_t v = *reg;                 /* 읽기 */\n    v = (v & ~mask) | ((val << shift) & mask);\n    *reg = v;                          /* 쓰기. 사이에 ISR 이 끼면 경쟁 */\n}\n```\n\n`1u << 32` 는 미정의 동작이라 width 32 를 따로 처리한다.\nLinux 커널은 이 역할을 `readl/writel`, `FIELD_GET/FIELD_PREP` 매크로가 한다.\n\n---\n\n## Q3: volatile 로 스레드 동기화를 하면 왜 안 되나?\n\n- C/C++ 표준에서 두 스레드가 동기화 없이 같은 변수에 쓰고 읽으면 **data race = 미정의 동작**. volatile 은 이걸 바꾸지 않는다.\n- CPU 가 순서를 바꾼다. `data = 1; volatile flag = 1;` 에서 다른 코어가 flag 를 보고 data 를 읽어도 옛 값일 수 있다 (ARM 약한 순서). 배리어나 release/acquire 가 필요하다 ([memory_ordering.md](memory_ordering.md)).\n- 그래서 C++11 이후 스레드 간 플래그는 `std::atomic<bool>`. volatile 의 정당한 용도는 셋뿐이다. **MMIO, 시그널 핸들러와 공유하는 `volatile sig_atomic_t`, setjmp/longjmp 사이의 지역 변수.**\n- ISR 과 공유하는 단일 코어 MCU 에서는 volatile + 인터럽트 마스킹 조합이 전통적 답이다. 단일 코어라 CPU 재배치 문제가 안 보이지만, 원자성은 여전히 마스킹이 책임진다.\n\n---\n\n## Q4: MMIO 영역은 메모리 속성이 뭐가 다르고, 유저 공간에서 어떻게 접근하나?\n\n- MMU 가 그 영역을 **device / non-cacheable** 로 매핑한다. 캐시되면 레지스터 쓰기가 캐시에만 남고 장치에 안 간다.\n- Linux 드라이버는 `ioremap()` 으로 매핑하고 `readl/writel` 로 접근한다. 이 접근자는 컴파일러 배리어와 필요한 CPU 배리어를 포함한다.\n- 유저 공간: `/dev/mem` 을 mmap (루트, 보안상 보통 막음), 또는 UIO 드라이버. Android 에선 HAL 이 커널 드라이버를 통해서만 장치를 만진다.\n- ARM 에선 device 메모리 접근도 순서가 보장되지 않는 경우가 있어 `dsb` 를 끼운다 (예: DMA 시작 레지스터 쓰기 전 버퍼 쓰기 완료 보장).\n\n---\n\n## Follow-up: 아래 코드의 문제를 전부 찾아라\n\n```c\nuint8_t *buf = (uint8_t *)0x20000000;     /* DMA 수신 버퍼 */\nint ready = 0;                            /* ISR 이 1 로 세움 */\nvoid dma_isr(void) { ready = 1; }\nvoid wait(void) { while (!ready) { } process(buf); }\n```\n\n1. `ready` 가 volatile 이 아니라 `while(!ready)` 가 한 번만 읽힌다.\n2. ISR 이 `ready = 1` 을 쓰기 전에 DMA 가 버퍼 쓰기를 끝냈다는 보장은 DMA 완료 인터럽트가 해 주지만, CPU 캐시에 옛 버퍼 내용이 있으면 `process` 가 stale 데이터를 읽는다. 캐시 invalidate 또는 non-cacheable 버퍼 ([dma_cache.md](dma_cache.md)).\n3. 멀티코어라면 `ready` 를 atomic 으로 하고 acquire 로 읽어야 한다.\n4. `ready` 를 다시 0 으로 내리는 쪽과 ISR 이 경쟁하면 이벤트를 놓친다. 카운터나 링버퍼로 바꾼다.\n",

   "md": "## Q1: Context switch란?\n\nCPU가 현재 실행 중인 프로세스/스레드를 멈추고, 다른 프로세스/스레드로 전환하는 과정.\n\n순서:\n1. 현재 프로세스 상태를 PCB에 저장 (레지스터, PC, stack pointer)\n2. 스케줄러가 다음 프로세스 선택\n3. 선택된 프로세스의 PCB에서 상태 복원\n4. 실행 재개\n\n---\n\n## Q2: Context switch의 비용은?\n\n**직접 비용:**\n- 레지스터 저장/복원\n- 메모리 매핑 변경 (page table 교체)\n- 커널 모드 진입/복귀\n\n**간접 비용 (더 큼):**\n- CPU cache 무효화 (cache cold start)\n- TLB flush (프로세스 전환 시)\n- Pipeline flush\n\n일반적으로 수 마이크로초 ~ 수십 마이크로초. 빈번하면 성능에 큰 영향.\n\n---\n\n## Q3: 스레드 간 context switch가 프로세스 간보다 빠른 이유는?\n\n같은 프로세스 내 스레드는:\n- 같은 address space 공유 → page table 교체 불필요\n- TLB flush 불필요\n- 캐시 hit 확률 높음 (공유 메모리)\n\n저장/복원할 것: 레지스터, PC, stack pointer 정도만.\n\n---\n\n## Follow-up: Context switch가 언제 발생하나요?\n\n- **Timer interrupt** - time slice 만료 (preemptive scheduling)\n- **I/O 요청** - 현재 프로세스가 blocking I/O 호출\n- **System call** - 커널 서비스 요청\n- **Higher priority process** - 더 높은 우선순위 프로세스가 ready 상태로 전환\n",

   "qs": [
    "Q1: Deadlock이란? 발생 조건 4가지는?",
    "Q2: Deadlock을 어떻게 해결하나요?",
    "Q3: 정확히 어디서 엇갈리나?",

   "md": "## 기준 코드 — 계좌 이체\n\n이 파일의 Q1 부터 Follow-up 까지 **전부 이 코드 하나** 를 놓고 답한다.\n목록을 외우는 게 아니라, 이 코드에서 뭐가 어디에 있는지를 본다.\n\n```cpp\nstruct Account { int id; int balance; mutex mtx; };\nAccount acc1{1, 1000, {}};   // 락이 지키는 건 balance. mutex 자체는 자원이 아니다\nAccount acc2{2, 1000, {}};\n\nvoid transfer(Account& from, Account& to, int amount) {\n    from.mtx.lock();          // ①\n    to.mtx.lock();            // ②\n    from.balance -= amount;\n    to.balance   += amount;\n    to.mtx.unlock();\n    from.mtx.unlock();\n}\n\n// 두 스레드가 동시에\ntransfer(acc1, acc2, 100);   // 스레드1\ntransfer(acc2, acc1, 100);   // 스레드2\n```\n\n이 코드는 멈춘다.\n왜 멈추는지가 Q1, 어떻게 살릴지가 Q2, 정확히 어디서 엇갈리는지가 Q3 다.\n\n---\n\n## Q1: Deadlock이란? 발생 조건 4가지는?\n\n두 개 이상의 프로세스가 서로 상대방이 가진 자원을 기다리면서 무한히 대기하는 상태.\n\n**4가지 조건이 위 코드의 어디에 있는지:**\n\n| 조건 | 이 코드의 어디 |\n|---|---|\n| **Mutual Exclusion** | `mutex` 다. 한 번에 한 스레드만 그 계좌의 balance 를 건드린다 |\n| **Hold and Wait** | ① 을 쥔 채로 ② 를 기다린다. 놓지 않고 기다리는 게 핵심이다 |\n| **No Preemption** | 남이 쥔 `mtx` 를 뺏어올 방법이 없다. 놓을 때까지 기다릴 뿐이다 |\n| **Circular Wait** | 스레드1 은 acc2 를, 스레드2 는 acc1 을 기다린다. 화살표가 고리를 이룬다 |\n\n네 줄이 전부 이 6줄짜리 함수 안에 있다.\n그래서 이런 코드는 특별히 이상하지 않아도 데드락이 난다.\n\n### 외우는 법: PEACH 🍑\n\n```\nP   No Preemption      뺏을 수 없다\nE   Mutual Exclusion   나만 쓴다\nA   All four           넷 다 있어야 데드락이다\nC   Circular Wait      고리를 이룬다\nH   Hold and Wait      쥔 채로 기다린다\n```\n\n**A 는 조건이 아니라 성질이다.** ⭐️\n네 조건이 **전부** 모여야 데드락이 생긴다.\n뒤집으면 **하나만 깨도 안 생긴다.**\n\nA 를 빼먹으면 PEACH 는 그냥 외운 글자 네 개로 끝난다.\nA 가 있어야 Q2 가 성립한다 — **해결책이란 곧 \"넷 중 하나를 깨는 방법\" 이다.**\n\n---\n\n## Q2: Deadlock을 어떻게 해결하나요?\n\n같은 코드를 놓고, 네 가지 답이 있다.\n\n### P — Prevention (예방): 코드를 고쳐서 조건 하나를 없앤다\n\n**Circular Wait 를 깬다.** 인자 순서가 아니라 **id 순서** 로 잠근다.\n\n```cpp\nAccount& first  = (from.id < to.id) ? from : to;\nAccount& second = (from.id < to.id) ? to   : from;\nfirst.mtx.lock();\nsecond.mtx.lock();\n```\n\n누가 어떤 순서로 부르든 항상 id 작은 것부터 잠근다.\n고리가 생길 수 없다. → 자세한 건 Q3.\n\n### A — Avoidance (회피): 잠그기 전에 안전한지 계산한다\n\n이체 요청이 올 때마다 \"지금 이 둘을 잠그면 교착 가능성이 생기나\" 를 미리 따져보고 허락한다.\nBanker's Algorithm 이 이것이다.\n계좌 이체에는 과하다. 매 요청마다 계산 비용이 붙는다.\n\n### I — Ignorance (무시): 아무것도 안 한다\n\n그냥 둔다.\n멈추면 사람이 재시작한다.\n\n**실제 대부분의 OS 가 고르는 게 이것이다.** ⭐️\n데드락은 자주 안 나서 앞의 셋이 수지가 안 맞는다.\n모래에 머리 박는다고 **타조 알고리즘** 이라고 부른다.\n\n### D — Detection + Recovery (탐지 + 복구): 터진 뒤에 수습한다\n\n누가 누구를 기다리는지 그래프로 들고 있다가 사이클이 생기면 잡아낸다.\n잡으면 한쪽 `transfer` 를 강제로 취소하고 롤백한다.\nDB 엔진이 실제로 이렇게 한다.\n\n### 외우는 법: PAID 💰\n\n```\nP   Prevention            코드를 고쳐서 조건 하나를 없앤다\nA   Avoidance             잠그기 전에 안전한지 계산한다\nI   Ignorance             그냥 둔다        <- 실제 답\nD   Detection + Recovery  터지면 잡아서 롤백한다\n```\n\n네 글자에 네 전략이 정확히 맞는다. 채운 글자가 없다.\n\n뜻도 통한다. 결국 **비용을 어디에 치를 것인가** 의 선택이다.\n\n| | 값을 치르는 지점 |\n|---|---|\n| Prevention | 설계 단계. 제약이 세져서 자원 활용도가 떨어진다 |\n| Avoidance | 할당할 때마다. 매번 안전한지 계산해야 한다 |\n| Ignorance | 안 치른다. 대신 가끔 멈춘다 |\n| Detection | 터진 뒤에. 탐지 비용 + 롤백 대가 |\n\n데드락은 공짜로 못 없앤다.\n어디서 PAID 할지만 고를 수 있다.\n\n---\n\n## Q3: 정확히 어디서 엇갈리나?\n\n같은 `from.mtx.lock()` 한 줄인데, `from` 이 가리키는 게 호출마다 다르다.\n\n```\ntransfer(acc1, acc2)   ->  from = acc1,  to = acc2   ->  acc1 잠그고 acc2 기다림\ntransfer(acc2, acc1)   ->  from = acc2,  to = acc1   ->  acc2 잠그고 acc1 기다림\n```\n\n함수 안에서는 둘 다 \"내 것 먼저\" 라는 같은 규칙이다.\n바깥에서 보면 잠그는 순서가 정반대다.\n\n```\n나쁜 코드 :  인자 순서대로 잠근다    -> 호출자마다 순서가 달라짐\n좋은 코드 :  id 순서대로 잠근다      -> 누가 부르든 순서가 같음\n```\n\n**왜 하필 id 인가** ⭐️\n\"먼저 온 쪽\" 이나 \"잔액이 많은 쪽\" 같은 **호출 시점에 달린 기준이면 안 된다.**\n누가 언제 부르든 같은 답이 나오는 **고정된 전역 기준** 이어야 순서가 통일된다.\nid 는 계좌에 박혀 있어서 절대 안 변한다. 그래서 쓸 수 있다.\n\n먼저 잠글 것을 못 잡은 쪽은 **아무것도 안 쥔 채** 기다린다.\nHold and Wait 도 같이 깨진다.\n\n순서를 통일하기 어려우면 `lock(m1, m2)` 로 두 락을 한꺼번에 잡는 방법도 있다.\n\n⚠️ 전제는 **동시 실행** 이다.\n두 호출을 순차로 하면 락 구간이 안 겹쳐서 순서가 반대여도 데드락이 안 난다.\n\n---\n\n## Follow-up: Deadlock vs Livelock vs Starvation?\n\n같은 코드를 **잘못 고치면** Livelock 이 나온다.\n\n```cpp\nvoid transfer(Account& from, Account& to, int amount) {\n    while (true) {\n        from.mtx.lock();\n        if (to.mtx.try_lock()) break;   // 둘 다 잡았다 -> 진행\n        from.mtx.unlock();              // 못 잡았으면 내 것도 놓고 양보한다\n    }\n    ...\n}\n```\n\n\"쥔 채로 기다리지 말고 양보하자\" 는 발상 자체는 맞다.\n그런데 두 스레드의 박자가 맞으면 **잡고 → 실패 → 놓고 → 다시 잡고** 를 영원히 반복한다.\n\n**멈춰 있지 않다. CPU 도 계속 쓴다. 그런데 아무도 이체를 못 끝낸다.**\n\n| | 상태 | 누가 못 하나 |\n|---|---|---|\n| **Deadlock** | **멈춰 있다.** 아무도 안 움직인다 | 걸린 전원 |\n| **Livelock** | **계속 움직인다.** 상태는 바뀌는데 진행이 없다 | 걸린 전원 |\n| **Starvation** | 시스템은 잘 돌아간다 | **특정 하나만** 계속 밀린다 |\n\nDeadlock 과 Livelock 은 **아무도 진행 못 한다** 는 결과가 같다.\n다른 건 멈춰 있느냐 바쁘게 움직이느냐다.\n그래서 Livelock 이 더 찾기 어렵다 — CPU 가 돌고 있어서 멈춘 것처럼 안 보인다.\n\nStarvation 은 결이 다르다.\n남들은 다 잘 돌아가는데 특정 스레드만 계속 순서가 안 온다.\n→ `concurrency/reader_writer.md` 의 writer starvation 이 같은 이야기다.\n\n복도 비유로 묶으면:\n\n```\nDeadlock    서로 마주 서서 아무도 안 비킨다\nLivelock    서로 동시에 같은 쪽으로 비켜서 또 막힌다. 계속 움직이는데 못 지나간다\nStarvation  나만 계속 뒤로 밀린다. 남들은 잘 지나간다\n```\n",

   ],
   "md": "> 2026-10-27 작성. 10/26 Apple Core OS 스크린에서 \"Binder 외에 뭐가 있나\" 에 Binder 만 답했다.\n> 아래 Q2 표의 **첫 열을 순서대로 소리 내 읽을 수 있으면** 그 질문은 끝난다.\n\n---\n\n## Q1: IPC 가 뭐고, 왜 커널을 거쳐야 하나?\n\n주소 공간이 분리된 프로세스끼리 데이터나 신호를 주고받는 방법.\n스레드는 같은 주소 공간이라 IPC 가 필요 없다 (`process_vs_thread.md`).\n\n분리돼 있으니 한쪽이 쓴 메모리를 다른 쪽이 직접 못 본다.\n그래서 **커널이 중간에서 복사해주거나, 같은 물리 페이지를 양쪽에 매핑해준다.**\n전자가 파이프·소켓·메시지, 후자가 공유 메모리다.\n공유 메모리는 매핑을 만들 때만 커널이 끼고 그 뒤 읽고 쓰는 건 그냥 메모리 접근이다.\n\n---\n\n## Q2: IPC 종류를 말해보라\n\n**\"Binder 외에 뭐가 있나\" 의 답.** 첫 열을 위에서 아래로 읽는다. ⭐️\n\n| 종류 | 모양 | 커널 복사 | 쓰는 자리 |\n|---|---|---|---|\n| **파이프** | 한 방향 바이트 스트림. 경계 없음 | 2회 (쓰기 · 읽기) | 셸 `a \\| b`, 부모 → 자식 로그 |\n| **Unix 도메인 소켓** | 양방향 스트림 또는 데이터그램. **fd 를 넘길 수 있다** (SCM_RIGHTS) | 2회 | 데몬 ↔ 클라이언트의 기본. 같은 기계 안에서만 |\n| **공유 메모리** | 같은 물리 페이지를 둘 다 매핑 | **0** (매핑할 때만 개입) | 영상 프레임, 큰 버퍼. 동기화는 별도 |\n| **시그널** | 번호 하나. 데이터 없음 | 없음 | 종료 요청 (TERM), 자식 종료 알림 (CHLD), 타이머 |\n| **메시지 큐** | 경계 있는 메시지, 우선순위 | 2회 | POSIX mq. 실무에선 드묾 |\n| **Binder** | 동기 호출 (RPC). 객체 참조 · fd 전달 | 1회 (커널이 수신자 버퍼에 직접) | Android 의 모든 서비스 호출 |\n| **Mach 메시지** | 경계 있는 메시지. **포트 권한 자체를 담아 보낸다** | 1회 (큰 건 vm 매핑으로 0) | XNU 의 원시 IPC. 커널 객체도 포트로 다룬다 |\n| **XPC** | Mach 위의 직렬화 (dictionary) + 서비스 이름 해석 | Mach 와 같음 | Darwin 데몬 ↔ 앱의 표준. 요청 오면 launchd 가 그때 데몬을 띄움 |\n\n```c\n/* 기본 셋. 전부 POSIX, Darwin·Linux 둘 다 */\nint pfd[2]; pipe(pfd);                                   /* 파이프 */\nint sv[2];  socketpair(AF_UNIX, SOCK_STREAM, 0, sv);     /* Unix 소켓 */\nint shm = shm_open(\"/buf\", O_CREAT | O_RDWR, 0600);      /* 공유 메모리 */\nvoid *m = mmap(NULL, len, PROT_READ|PROT_WRITE, MAP_SHARED, shm, 0);\nkill(pid, SIGTERM);                                      /* 시그널 */\n```\n\n### Q2 코드 1: 파이프 (부모 ← 자식, 한 방향)\n\n> 2026-11-14 추가. 실제로 컴파일해 돌린 코드와 출력.\n\n자식이 `dup2` 로 fd 1 을 파이프 쓰는 쪽으로 바꾸면, 평범한 `printf` 가 화면 대신 부모에게 간다.\n셸의 `ls | grep` 이 이 구조에 `exec` 를 더한 것이다.\n\n```c\nint main() {\n    int p[2];\n    pipe(p);                    // p[0] = 3 (파이프 읽는 쪽), p[1] = 4 (파이프 쓰는 쪽)\n                                //   fd 0 키보드 | fd 1 화면 | fd 3 파이프 읽기 | fd 4 파이프 쓰기\n\n    if (fork() == 0) {          // 자식. fd 표가 그대로 복사됨\n        dup2(p[1], 1);          // dup2(4, 1). fd 1 칸을 fd 4 내용으로 덮어씀\n                                //   fd 0 키보드 | fd 1 파이프 쓰기 | fd 3 파이프 읽기 | fd 4 파이프 쓰기\n        close(p[0]);            // fd 3 닫음. 자식은 읽지 않음\n        close(p[1]);            // fd 4 닫음. 같은 입구가 fd 1 에 있으니 남는 복사본\n                                //   fd 0 키보드 | fd 1 파이프 쓰기\n        printf(\"사과\\n\");        // printf 는 fd 1 에 씀 → 파이프로 들어감\n        printf(\"바나나\\n\");\n        return 0;               // 자식 끝. fd 1 도 닫힘 → 쓰는 쪽이 0개\n    }\n\n    close(p[1]);                // 부모. fd 4 닫음. 부모는 읽기만\n                                //   fd 0 키보드 | fd 1 화면 | fd 3 파이프 읽기\n    char buf[64] = {0};\n    int n, total = 0;\n    while ((n = read(p[0], buf + total, sizeof buf - 1 - total)) > 0)\n        total += n;             // fd 3 에서 읽음. 쓰는 쪽이 0개가 되면 read 가 0 → 반복 끝\n    wait(NULL);\n    printf(\"부모가 파이프에서 받은 것:\\n%s\", buf);   // 부모 fd 1 은 화면 그대로\n}\n/* 출력:\n   부모가 파이프에서 받은 것:\n   사과\n   바나나 */\n```\n\n- `dup2(A, B)` 는 B 번호도 A 가 가리키는 곳에 연결한다. 왼쪽 인자에서 오른쪽 칸으로 덮어쓴다.\n- 비어 있는 파이프를 `read` 하면 데이터가 올 때까지 멈춘다 (블로킹). 부모·자식 관계와 상관없이 파이프 fd 의 성질이다.\n- 안 쓰는 끝은 닫는다. 쓰는 쪽이 하나라도 열려 있으면 읽는 쪽이 EOF 를 못 받고 계속 기다린다.\n\n### Q2 코드 2: Unix 도메인 소켓 (부모 ↔ 자식, 양방향)\n\n> 2026-11-14 추가. 실제로 컴파일해 돌린 코드와 출력.\n\n같은 컴퓨터 안에서만 쓰는 소켓이다.\n코드 1 의 `pipe` 를 `socketpair` 로 바꾸면, 양쪽 끝 모두 읽고 쓸 수 있다.\n\n```c\nint main() {\n    setvbuf(stdout, NULL, _IONBF, 0);\n    int s[2];\n    socketpair(AF_UNIX, SOCK_STREAM, 0, s);    // 소켓 한 쌍. s[0] 과 s[1] 둘 다 읽기·쓰기 가능\n\n    if (fork() == 0) {                         // 자식은 s[1] 만 씀\n        close(s[0]);\n        char buf[16] = {0};\n        read(s[1], buf, sizeof buf);           // 부모가 보낸 것 읽기\n        printf(\"자식이 받음: %s\\n\", buf);\n        write(s[1], \"pong\", 4);                // 같은 s[1] 로 답장 보내기\n        return 0;\n    }\n\n    close(s[1]);                               // 부모는 s[0] 만 씀\n    write(s[0], \"ping\", 4);                    // 보내기\n    char buf[16] = {0};\n    read(s[0], buf, sizeof buf);               // 같은 s[0] 으로 답장 받기\n    printf(\"부모가 받음: %s\\n\", buf);\n    wait(NULL);\n}\n/* 출력:\n   자식이 받음: ping\n   부모가 받음: pong */\n```\n\n| | 파이프 | Unix 도메인 소켓 |\n|---|---|---|\n| 방향 | 한 방향. `p[0]` 은 읽기만, `p[1]` 은 쓰기만 | 양방향. `s[0]`, `s[1]` 둘 다 읽고 씀 |\n| 각자 가지는 끝 | 부모는 쓰는 끝, 자식은 읽는 끝 | 부모는 `s[0]`, 자식은 `s[1]` |\n| 답장하려면 | 파이프를 하나 더 만들어야 함 | 같은 fd 로 바로 답장 |\n\n### Q2 정리: Android ↔ Darwin 대응\n\nCore OS 면접이면 이 줄을 붙인다.\n\n| 자리 | Android | Darwin |\n|---|---|---|\n| 서비스 RPC | Binder. 이름 해석은 servicemanager | Mach 메시지 + XPC. 이름 해석은 launchd (bootstrap) |\n| 공유 메모리 | ashmem → memfd, Parcel 의 큰 blob | Mach `vm_remap`, IOSurface (GPU 버퍼) |\n| 로컬 소켓 | zygote 소켓, logd, adbd | syslogd, 많은 데몬의 로컬 포트 |\n| 시그널 | 같음 | 같음. launchd 가 TERM → KILL |\n\n---\n\n## Q3: 뭘 쓸지 어떻게 고르나?\n\n기준은 둘이다. **모양** 과 **양**.\n\n```\n모양   바이트 스트림이면 파이프·소켓\n       경계 있는 메시지면 mq·Binder·Mach\n       그냥 알림이면 시그널\n양     많으면 복사를 피해야 하니 공유 메모리.  IPC 로는 \"준비됐다\" 만 보낸다\n```\n\n큰 데이터를 소켓으로 보내면 복사 두 번(보내는 쪽 → 커널 → 받는 쪽)이 병목이다.\n그래서 Android 의 SurfaceFlinger 버퍼 큐, Darwin 의 IOSurface 는 프레임은 공유 메모리에 두고 핸들만 IPC 로 넘긴다.\n\n---\n\n## Q4: fd 를 다른 프로세스에 넘길 수 있는 건 뭔가?\n\n**Unix 소켓 (SCM_RIGHTS) · Binder · Mach 포트** 셋이다.\n파이프·시그널·mq 는 못 한다.\n\n\"열린 파일·소켓·공유 메모리 핸들을 다른 프로세스에 건네는\" 능력이 서비스 설계의 핵심이다.\n서비스가 클라이언트에 공유 메모리 fd 를 주는 패턴이 이걸로 된다.\n\nBinder 와 Mach 는 공통점이 하나 더 있다.\n**커널이 객체 참조를 센다.** 상대가 죽으면 커널이 알려준다 (Binder 의 death notification, Mach 의 dead-name notification).\n소켓은 EOF 로만 안다.\n\n```c\n/* Unix 소켓으로 fd 넘기기. 커널이 받는 쪽 fd 테이블에 새 번호로 복제해준다 */\nstruct msghdr mh = {0}; struct iovec io = { \"x\", 1 };\nchar cbuf[CMSG_SPACE(sizeof(int))];\nmh.msg_iov = &io; mh.msg_iovlen = 1; mh.msg_control = cbuf; mh.msg_controllen = sizeof cbuf;\nstruct cmsghdr *c = CMSG_FIRSTHDR(&mh);\nc->cmsg_level = SOL_SOCKET; c->cmsg_type = SCM_RIGHTS; c->cmsg_len = CMSG_LEN(sizeof(int));\nmemcpy(CMSG_DATA(c), &shm_fd, sizeof(int));\nsendmsg(sock, &mh, 0);\n```\n\n---\n\n## Follow-up: 공유 메모리가 제일 빠른데 왜 다 그걸로 안 하나?\n\n**동기화가 공짜가 아니다.**\n한쪽이 쓰는 중에 다른 쪽이 읽으면 깨진 데이터를 본다.\n프로세스 간 뮤텍스 (`PTHREAD_PROCESS_SHARED`), 세마포어, 또는 원자 연산 + 메모리 배리어가 따로 필요하다.\n\"공유 메모리로 빠르게\" 라고만 답하면 반쪽이다.\n\n### 틀리기 쉬운 것\n\n```\nX  파이프는 양방향          -> 한 방향. 양방향이면 파이프 두 개거나 socketpair\nX  시그널로 데이터를 보낸다   -> 번호만 간다 (sigqueue 로 int 하나). \"확인해봐\" 신호로만 쓰고 내용은 다른 채널로\nX  Mach 메시지 = 소켓 비슷   -> 핵심은 포트 권한(send right)이 capability 라는 것. 가진 프로세스만 말을 걸 수 있고, 샌드박스가 이걸로 제한한다\n```\n",

   "md": "## Q1: Mutex와 Semaphore 차이를 설명해보세요.\n\n| | Mutex | Semaphore |\n|---|-------|-----------|\n| 동시 접근 | 1개만 | N개까지 (counting) |\n| 소유권 | lock한 스레드만 unlock 가능 | 누구나 signal 가능 |\n| 목적 | 상호 배제 (mutual exclusion) | 리소스 카운팅 / 시그널링 |\n| 비유 | 화장실 열쇠 (1명) | 주차장 빈 자리 카운터 |\n\nBinary semaphore(값 0 or 1)와 mutex는 비슷해 보이지만, 소유권 개념이 다름.\n\n### 소유권이 왜 중요한가 — binary semaphore != mutex 인 이유\n\n```\nMutex      A가 lock    -> B가 unlock    X  (내가 잠근 건 나만 연다)\nSemaphore  A가 acquire -> B가 release   O\n```\n\n이 \"된다\"가 용도를 가른다. 소유자가 없어서 **서로 다른 스레드끼리 신호를 주고받을 수 있음**:\n\n```\nProducer 스레드:  버퍼에 넣고 -> sem.release()   \"하나 채웠다\"\nConsumer 스레드:  sem.acquire() -> 꺼냄          \"기다렸다 받는다\"\n```\n\nproducer_consumer.md 의 뼈대가 이것. Mutex로는 이 패턴이 안 만들어진다.\n\n-> Mutex = \"이 자원은 내 거\" (상호 배제)\n   Semaphore = \"몇 개 남았나 세기 + 남에게 신호\" (카운팅 + 시그널링)\n\n---\n\n## Q2: 각각 언제 쓰나요?\n\n**Mutex:**\n- Critical section 보호 (공유 변수 수정)\n- 파일 단독 접근\n- 하나의 자원을 하나의 스레드만 사용해야 할 때\n\n**Semaphore:**\n- Connection pool (최대 10개 연결 허용)\n- Producer-Consumer 패턴 (버퍼 빈 칸/찬 칸 카운트)\n- 스레드 간 순서 제어 (시그널링)\n\n---\n\n## Q3: C++에서의 사용 예시?\n\n**Mutex:**\n```cpp\nstd::mutex mtx;\n\nvoid critical() {\n    std::lock_guard<std::mutex> lock(mtx);\n    // 여기서 공유 자원 접근\n}  // 스코프 끝나면 자동 unlock\n```\n\n**Semaphore (C++20):**\n```cpp\nstd::counting_semaphore<3> sem(3);  // 최대 3개 동시 접근\n\nvoid access_resource() {\n    sem.acquire();     // 카운터 -1 (0이면 대기)\n    // 자원 사용\n    sem.release();     // 카운터 +1\n}\n```\n\n---\n\n## Follow-up: Spinlock이란?\n\n- Mutex의 변형. lock을 못 잡으면 sleep하지 않고 **busy-waiting** (반복 체크).\n- 장점: context switch 비용 없음\n- 단점: CPU 낭비\n- 용도: lock 보유 시간이 매우 짧을 때 (커널 내부, 멀티코어 환경)\n\n기준선: **lock 보유 시간 < context switch 비용(수 us)** 이면 spin이 이김.\n오래 잡을 거면 잠들어서 CPU를 남에게 양보하는 게 이득.\n(mutex로 대기 = 스레드가 blocked -> 스케줄러 개입 -> context switch.\n spinlock은 그걸 피하는 것. cf. user_kernel_mode.md Follow-up 2)\n",

   "md": "> 2026-10-27 작성. 10/26 Apple Core OS 스크린에서 \"pthreads 아세요\" 를 못 알아들었다.\n> 묻는 건 **이 함수들을 써 봤냐** 다. `deadlock.md` 의 계좌 이체 코드, `race_condition.md`, `mutex_vs_semaphore.md` 가 전부 이 API 다.\n\n---\n\n## Q1: pthreads 가 뭔가?\n\nC 에서 스레드를 만들고 동기화하는 **POSIX 표준 API**. 헤더 `pthread.h`.\nDarwin 은 libSystem 에 포함, Linux 는 glibc (옛 버전은 `-lpthread`).\n\n함수는 네 묶음이다. ⭐️\n\n| 묶음 | 함수 | 하는 일 |\n|---|---|---|\n| **생명주기** | `pthread_create` / `join` / `detach` / `exit` | 만들고, 기다리고, 떼어내고, 끝낸다 |\n| **상호 배제** | `pthread_mutex_*` / `rwlock_*` / `spin_*` | 한 번에 하나만 |\n| **대기·신호** | `pthread_cond_wait` / `signal` / `broadcast` | 조건이 될 때까지 재우고 깨운다 |\n| **부가** | `pthread_once` / `key_create` (TLS) / `attr_*` | 한 번만 초기화, 스레드별 저장소, 스택 크기 |\n\n```c\nint pthread_create(pthread_t *t, const pthread_attr_t *attr, void *(*fn)(void *), void *arg);\nint pthread_join(pthread_t t, void **ret);       /* 끝날 때까지 기다리고 반환값 수거 */\nint pthread_detach(pthread_t t);                 /* join 안 할 거면. 끝나면 알아서 정리 */\n\nint pthread_mutex_lock(pthread_mutex_t *m);      /* 잠근 스레드만 풀 수 있다 (소유자) */\nint pthread_mutex_trylock(pthread_mutex_t *m);   /* 못 잡으면 EBUSY, 안 기다림 */\nint pthread_mutex_unlock(pthread_mutex_t *m);\n\nint pthread_cond_wait(pthread_cond_t *c, pthread_mutex_t *m);  /* 뮤텍스를 풀고 잠들었다가, 깨면 다시 잡고 돌아옴 */\nint pthread_cond_signal(pthread_cond_t *c);      /* 하나 깨움 */\nint pthread_cond_broadcast(pthread_cond_t *c);   /* 전부 깨움 */\n```\n\n**오류 처리가 특이하다.** `errno` 를 안 쓰고 **반환값이 오류 코드** 다. 0 이 성공.\n`if (pthread_mutex_lock(&m) != 0)` 식으로 검사한다.\n\n---\n\n## Q2: `pthread_create` 의 인자 넷은? `join` 을 안 하면?\n\n| 인자 | 뜻 |\n|---|---|\n| `pthread_t *t` | 핸들 받을 곳 |\n| `attr` | 속성. NULL 이면 기본 (스택 크기 등) |\n| `void *(*fn)(void *)` | 실행할 함수. 인자 하나, 반환 하나, 둘 다 `void *` |\n| `void *arg` | 그 함수에 줄 인자. 여러 값이면 구조체 포인터 |\n\n```c\nstatic void *worker(void *arg) {\n    int id = *(int *)arg;\n    /* ... */\n    return NULL;            /* 반환값은 join 의 두 번째 인자로 전달됨 */\n}\npthread_t t; int id = 1;\npthread_create(&t, NULL, worker, &id);\npthread_join(t, NULL);\n```\n\n**join 을 안 하면** 스레드가 끝나도 스택·핸들이 남는다. 프로세스의 좀비와 같다.\n`join` 하거나 `detach` 해야 하고, 둘 다 안 하면 누수다.\n데몬에서 작업 스레드를 만들고 잊으면 핸들이 쌓인다.\n\n---\n\n## Q3: `cond_wait` 를 왜 `while` 로 감싸고, 왜 뮤텍스를 넘기나?\n\n```c\npthread_mutex_lock(&m);\nwhile (!ready)                      /* if 가 아니라 while */\n    pthread_cond_wait(&c, &m);      /* 뮤텍스를 넘긴다 */\n/* ready 가 참인 상태로 뮤텍스를 쥐고 있음 */\npthread_mutex_unlock(&m);\n```\n\n**while 인 이유: spurious wakeup.**\n신호 없이도 깰 수 있고, 깨서 뮤텍스를 다시 잡는 사이 다른 스레드가 조건을 바꿨을 수 있다.\n그래서 깨고 나서 조건을 다시 확인해야 한다.\n\n**뮤텍스를 넘기는 이유: lost wakeup.**\n\"조건 검사 → 잠들기\" 사이에 신호가 오면 영원히 못 깬다.\n`cond_wait` 는 **뮤텍스를 풀고 잠드는 것을 원자적으로** 해준다. 그래서 뮤텍스가 필요하다.\n\n조건 변수는 항상 **뮤텍스 + 조건 변수 + 상태 변수** 세 개가 한 묶음이다.\n조건 변수 혼자는 상태를 기억하지 않는다 (`producer_consumer.md`).\n\n---\n\n## Q4: Darwin 에서는 뭐가 다른가?\n\npthread 는 **Mach 스레드 위의 라이브러리** 다.\n커널(XNU)이 스케줄하는 건 Mach 스레드고, 뮤텍스 대기는 `psynch` 트랩으로 들어간다.\n\n| | Darwin | Linux |\n|---|---|---|\n| 커널 스레드 | Mach 스레드 | task (clone) |\n| 뮤텍스 대기 | psynch 트랩 | futex |\n| 기본 스택 | **512 KB** (메인은 8 MB) | 8 MB |\n| C11 threads | 지원 안 함 | glibc 2.28+ |\n\n기본 스택이 512 KB 라 작업 스레드에서 깊은 재귀가 메인보다 16 배 빨리 터진다.\n스택 크기는 `attr` 로 **create 전에** 정한다. 만든 뒤에는 못 바꾼다.\n\n---\n\n## Follow-up: 스레드가 있는 프로세스에서 fork 하면?\n\n**자식엔 fork 한 스레드만 복제된다.**\n다른 스레드가 잡고 있던 뮤텍스는 자식에서 영원히 잠긴 채다. 풀어줄 스레드가 없다.\n그래서 fork 뒤엔 바로 exec 하거나 async-signal-safe 함수만 쓴다.\n\n### 틀리기 쉬운 것\n\n```\nX  pthread_cancel 로 스레드를 끝낸다   -> 어디서 끊길지 몰라 뮤텍스를 잡은 채 죽을 수 있다. 플래그를 세우고 스스로 빠져나오게\nX  pthread_t 를 정수로 비교·출력      -> Darwin 은 포인터, Linux 는 unsigned long. 비교는 pthread_equal\nX  메인이 return 해도 스레드는 돈다    -> 메인이 return 하면 프로세스 전체가 끝난다 (exit). 메인은 join 하거나 pthread_exit 로 빠져야\nX  다른 스레드가 unlock 해도 된다     -> 기본 타입은 UB, errorcheck 타입은 EPERM. 소유자만 푼다. 세마포어와의 차이가 이것\n```\n",

   "md": "## Q1: 주요 스케줄링 알고리즘을 설명해보세요.\n\n| 알고리즘 | 방식 | 특징 |\n|----------|------|------|\n| FCFS | 먼저 온 순서대로 | 단순, Convoy effect 문제 |\n| SJF | 실행 시간 짧은 것 우선 | 평균 대기시간 최소. 실행 시간 예측 어려움 |\n| Round Robin | 시간 할당량(quantum)만큼 돌아가며 | 응답 시간 좋음. quantum 크기가 핵심 |\n| Priority | 우선순위 높은 것 먼저 | Starvation 가능 → aging으로 해결 |\n| MLFQ | 여러 큐 + 피드백 | 실제 OS에서 가장 많이 사용 |\n\n---\n\n## Q2: Preemptive vs Non-preemptive 차이는?\n\n- **Non-preemptive**: 프로세스가 자발적으로 CPU 반납할 때까지 대기. (FCFS, non-preemptive SJF)\n- **Preemptive**: OS가 강제로 CPU를 빼앗을 수 있음. (RR, preemptive SJF, priority)\n\n현대 OS는 대부분 preemptive. 하나의 프로세스가 CPU 독점하는 걸 방지.\n\n---\n\n## Q3: Round Robin에서 time quantum을 어떻게 정하나요?\n\n- **너무 작으면** → context switch 오버헤드가 실행 시간보다 커짐\n- **너무 크면** → FCFS랑 다를 게 없음 (응답 시간 증가)\n- 일반적으로 10~100ms, 전체 CPU burst의 80%가 quantum 내에 끝나도록 설정하는 게 규칙.\n\n---\n\n## Follow-up: Starvation과 Aging이란?\n\n- **Starvation**: 낮은 우선순위 프로세스가 영원히 실행 못 하는 상황\n- **Aging**: 대기 시간이 길어질수록 우선순위를 점진적으로 올려주는 기법, Starvation 방지.\n",

   "md": "> 2026-09-08 재작성. 목록을 외우는 대신 `printf` 한 줄에 전부 매단다.\n> 세 번(2/5, 3/5, 1.5/5) 낮은 점수가 나온 이유가 \"3가지 / 2x2 / 약자 3개\"를 따로 외우려 한 것이었음.\n> 2026-10-27 보강. 10/26 Apple Core OS 스크린에서 \"커널로 들어가는 경로\" 를 못 답해 다섯 단계 표와 Darwin 디테일을 그림 바로 아래에 추가.\n\n---\n\n## 기준점: `printf(\"hello\")` 가 화면에 찍히기까지\n\n```\nprintf(\"hello\")\n   |\n   |  libc 의 write() 래퍼            <- 아직 user mode. 그냥 함수 호출일 뿐\n   |\n   |  syscall 명령어  (= trap)         <- ★ 여기서 CPU 가 mode bit 을 뒤집는다\n   |     - 복귀 주소 + flags 저장\n   |     - 커널 스택으로 교체\n   |     - 커널이 등록해둔 진입점으로 점프\n   |\n   |  커널의 sys_write() 실행 -> 하드웨어 I/O\n   |\n   |  sysret -> 저장해둔 곳으로 복귀, mode bit 원상복구\n   v\nprintf 다음 줄\n```\n\n**이 그림 하나에서 아래가 전부 파생된다.**\n\n### 그림을 다섯 단계로 끊으면 (10/26 Apple 스크린에서 못 답한 질문)\n\n\"유저 코드가 커널로 들어가는 경로를 설명해보라\" 는 위 그림을 **다섯 단어** 로 말하는 것이다.\n**트랩 명령 · 모드 전환 · 커널 스택 · 번호 디스패치 · 복귀.** 이 순서대로만 말하면 된다. ⭐️\n\n| 단계 | 누가 | 하는 일 |\n|---|---|---|\n| 1 래퍼 | libc | 시스템 콜 **번호** 와 인자를 약속된 레지스터에 싣는다. 프로그램은 raw 트랩을 직접 안 쓴다 |\n| 2 트랩 | CPU | `svc` (arm64) / `syscall` (x86-64) 한 줄. 모드를 커널로 바꾸고, PC 를 커널 진입점(벡터 테이블)으로, 복귀 주소와 유저 상태를 보관 |\n| 3 저장·스택 교체 | 커널 진입 asm | 유저 레지스터 전부 저장. 스택을 그 스레드의 **커널 스택** 으로 교체. 유저 스택은 못 믿는다 |\n| 4 디스패치 | 커널 C | 번호가 범위 안인지 검사 → 테이블에서 핸들러 → 포인터 인자는 `copyin` 으로 검증하며 복사 → 실행 |\n| 5 복귀 | 커널 → CPU | 결과를 레지스터에, 레지스터 복원, `eret` / `sysret` 로 유저 모드. 시그널이 쌓여 있으면 복귀 직전에 핸들러로 |\n\n```asm\n; write(1, \"hi\\n\", 3) 이 Darwin arm64 에서 실제로 거치는 길\nmov  x16, #4        ; 1. 번호 (write = 4) 는 x16 에\nmov  x0,  #1        ;    fd\nadr  x1,  msg       ;    buf\nmov  x2,  #3        ;    len\nsvc  #0x80          ; 2. 트랩. 여기서 EL0 -> EL1\n                    ; 3-4. 커널: 레지스터 저장 -> 커널 스택 -> sysent[4] -> 결과 x0\n                    ; 5. eret. 다시 EL0. 래퍼가 x0 를 반환값으로, 오류면 errno 세팅\n```\n\n**틀리기 쉬운 두 가지**\n\n```\nX  \"시스템 콜 = 컨텍스트 스위치\"    -> 같은 스레드 안에서 모드만 바뀐다 (Q4). 커널 안에서 블록돼 다른 스레드로 넘어가면 그때 추가로 일어날 뿐\nX  \"커널이 유저 스택을 그대로 쓴다\"  -> 유저 스택은 조작돼 있을 수 있다. 스레드마다 별도 커널 스택이 있고, 포인터 인자도 copyin 으로 복사해서 쓴다\n```\n\n**Darwin 디테일 (Core OS 면접용)**\n\n| | Darwin (XNU) | Linux |\n|---|---|---|\n| 번호 공간 | 양수 = BSD 콜 (write, open, mmap), 음수 = Mach 트랩 (mach_msg, vm_allocate). 두 커널 계층이 한 입구를 나눠 쓴다 | 테이블 하나 |\n| 공개 ABI | libSystem 만. raw 번호는 릴리즈마다 바뀔 수 있어 정적 링크·직접 `svc` 는 깨진다 | 번호가 안정 ABI |\n| 관찰 | `dtruss -p PID`, `fs_usage` | `strace -p PID`, `perf trace` |\n\n비용은 모드 전환 자체가 수십 ns, 레지스터 저장·복원과 캐시·TLB 오염, Meltdown 이후 커널 페이지 테이블 분리까지 합치면 수백 ns 에서 1 µs.\n그래서 `read` 를 1 바이트씩 루프에서 부르면 느리고 stdio 버퍼링이 존재한다.\n`gettimeofday` 같은 건 커널이 읽기 전용 페이지를 유저에 매핑해둬서(Linux vDSO, Darwin commpage) 트랩 없이 읽는다.\n\n---\n\n## Q1: User mode 와 Kernel mode 의 차이는?\n\n| | User Mode | Kernel Mode |\n|---|-----------|-------------|\n| 권한 | 제한적, 하드웨어 직접 접근 불가 | 모든 명령어 + 하드웨어 접근 가능 |\n| 메모리 접근 | 자기 address space 만 | 모든 메모리 접근 가능 |\n| 실패 시 | 해당 프로세스만 crash | 전체 시스템 crash (kernel panic) |\n| 예시 | 앱 코드 실행 | 드라이버, 스케줄러, 메모리 관리 |\n\nCPU 의 mode bit 으로 구분 (0 = kernel, 1 = user).\n유저 코드는 이 비트를 **직접 못 쓴다.** 그런 명령어가 user mode 에서 금지되어 있다.\n\n---\n\n## Q2: 왜 `call` 이 아니라 `syscall` 인가?\n\n위 그림에서 제일 중요한 줄.\n\n```asm\ncall sys_write     ; X  점프할 주소를 내가 적는다\nsyscall            ; O  주소를 안 적는다. CPU 가 커널이 등록해둔 곳으로 보낸다\n```\n\n**문은 하나뿐이고, 그 문 위치는 커널이 정한다.**\n유저는 \"들어가겠다\"는 의사표시만 할 수 있다. 이게 보호(protection)의 핵심.\n\n`trap` = 이렇게 일부러 커널로 들어가려고 실행하는 명령어.\n**전환의 네 번째 종류가 아니라, syscall 이 들어가는 방법이다.** (Q3 과 헷갈리지 말 것)\n\n---\n\n## Q3: User -> Kernel 전환이 일어나는 경우는?\n\n`printf` 는 그중 **첫 번째** 경우일 뿐이다. 나머지 둘은 이렇게 갈린다:\n\n- **내가 부탁했나** -> **System call** (printf, file open, fork)\n- **내가 사고쳤나** -> **Exception** (divide by zero, page fault, segfault)\n- **밖에서 찔렀나** -> **Interrupt** (키보드, 타이머, 디스크 완료)\n\n부탁 / 사고 / 찔림. 앞의 둘은 **내 명령어가 원인**이고, interrupt 만 외부에서 온다.\n\n> 참고: 축 2개(의도적·비의도적 x 동기·비동기)로 보면 4칸 중 3칸만 찬다.\n> \"외부에서 오는 걸 내가 의도할 수는 없으니\" 그 칸이 빈다.\n> 다만 이건 정리용이지, 이걸 외워서 3개를 끄집어내려 하면 매번 하나씩 빠진다.\n> **부탁 / 사고 / 찔림으로 세는 게 낫다.**\n\n---\n\n## Q4: Mode switch 와 Context switch 는 다른가?\n\n**다르다. 세 번 다 여기서 틀렸다.**\n\n맨 위 `printf` 그림을 다시 보면, 저 흐름 어디에도 **\"프로세스를 바꾼다\"는 단계가 없다.**\n같은 프로세스가 권한만 잠깐 올렸다 내리는 것뿐.\n\n| | Mode switch | Context switch |\n|---|---|---|\n| 바뀌는 것 | 같은 프로세스의 **권한 레벨만** | **프로세스 자체**가 교체 |\n| 메모리 지도 | 그대로 | 통째로 교체 |\n| 비용 | 수백 ns | 수 us (수십 배) |\n\n### 반복해서 틀린 오답 두 개\n\n```\nX  \"저장을 안 해서 싸다\"        -> 저장한다. 안 하면 돌아갈 곳을 모른다\nX  \"비트 하나만 바꿔서 싸다\"     -> 복귀 주소 + flags 저장 + 스택 교체까지 한다\nO  \"프로세스를 안 바꿔서 싸다\"   -> 메모리 지도를 갈아끼울 필요가 없다\n```\n\n### 면접 한 줄\n\n> Mode switch 는 같은 프로세스에서 권한만 바뀌는 거라 주소공간이 그대로입니다.\n> Context switch 는 프로세스가 바뀌어서 페이지 테이블을 교체하고 캐시를 날려야 해서 훨씬 비쌉니다.\n\n---\n\n## Follow-up: 왜 이렇게 분리해놨나?\n\n**Protection.** 악의적이거나 버그 있는 프로그램이:\n- 다른 프로세스 메모리를 건드리는 것 방지\n- 하드웨어를 직접 조작하는 것 방지\n- OS 자체를 손상시키는 것 방지\n\n대가: mode 전환 비용 (수백 ns). 그래서 빈번한 system call 은 성능에 영향.\n\n---\n\n## 참고 (외우지 말 것)\n\nQ4 의 \"메모리 지도 교체\"가 실제로 무슨 일인지. **면접에서 이 약자들까지 묻는 경우는 드물다.**\nQ4 를 위 표 수준으로 말할 수 있으면 충분하고, 아래는 그 배경일 뿐이다.\n\n| 약자 | 원말 | 한 줄 |\n|---|---|---|\n| CR3 | Control Register 3 | \"지금 프로세스의 메모리 지도(페이지 테이블)가 어디 있는지\" 가리키는 레지스터 |\n| TLB | Translation Lookaside Buffer | 그 지도를 매번 보기 느려서 만든 캐시 |\n| PCB | Process Control Block | 프로세스 하나의 신상명세서 (지도 위치·레지스터·우선순위·열어둔 파일) |\n\n비유: CR3 = 지도책이 책장 어디 꽂혔는지 적힌 쪽지 / TLB = 자주 찾는 페이지를 적어둔 메모지.\n**지도책을 바꾸면 메모지는 전부 쓰레기** -> 버려야 함(TLB flush) -> 한동안 느려짐.\n이게 context switch 가 비싼 이유의 실체.\n\ncf. `context_switch.md`, `virtual_memory.md`\n",

   "md": "## Q1: Virtual memory란?\n\n각 프로세스에게 연속적이고 독립적인 메모리 공간이 있는 것처럼 보이게 하는 추상화.\n실제 물리 메모리(RAM)보다 큰 주소 공간을 제공.\n\n핵심 아이디어: 프로세스의 전체 메모리가 RAM에 있을 필요 없음. 지금 쓰는 부분만 RAM에, 나머지는 디스크(swap)에.\n\n---\n\n## Q2: Paging이 뭔가요?\n\n- Virtual memory를 고정 크기 **page** (보통 4KB)로 나눔\n- Physical memory를 같은 크기 **frame**으로 나눔\n- **Page table**이 virtual page → physical frame 매핑을 관리\n- 연속적인 virtual address가 불연속적인 physical address에 매핑될 수 있음\n\n장점: external fragmentation 없음 (고정 크기라서)\n\n---\n\n## Q3: Page fault가 뭐고, 어떻게 처리되나요?\n\n접근하려는 page가 RAM에 없을 때 발생하는 인터럽트.\n\n처리 순서:\n1. CPU가 page table에서 valid bit 확인 → invalid (RAM에 없음)\n2. Page fault trap 발생 → OS에 제어 넘어감\n3. 디스크에서 해당 page를 빈 frame에 로드\n4. Page table 업데이트 (valid bit 설정, frame 번호 기록)\n5. 중단됐던 명령어 재실행\n\nRAM이 꽉 차면? → Page replacement algorithm (LRU, FIFO, Clock 등)으로 victim page 선택 후 swap out.\n\n---\n\n## Follow-up: TLB란?\n\n**Translation Lookaside Buffer** - page table의 캐시.\n\n- Page table은 메모리에 있음 → 매 메모리 접근마다 page table 조회 = 2번 메모리 접근\n- TLB는 최근 사용된 page-frame 매핑을 CPU 내부에 캐시\n- TLB hit → 1번 메모리 접근으로 해결\n",

   "md": "## 앵커: 이 네 줄이 전부다\n\n```cpp\n// 생산자 (ISR)\nbuf_[5] = 99;      // 데이터를 쓴다\ntail_ = 6;         // \"5번 칸 채웠다\" 는 신호\n\n// 소비자 (메인 루프)\nif (tail_ == 6)    // 신호를 본다\n    x = buf_[5];   // 데이터를 읽는다\n```\n\n소비자가 `tail_ == 6` 은 봤는데 `buf_[5]` 에서 **이전 바퀴에 쓰였던 값** 이 나올 수 있다.\n생산자가 두 줄을 다 실행했는데도 그렇다.\n\n아래 내용은 전부 이 네 줄을 고치는 이야기다.\n\n---\n\n## 1. 빌드 옵션만 바꿔 재현됐다\n\n| | 20만 바이트 SPSC 테스트 |\n|---|---|\n| `-O0` | 통과 |\n| `-O2` | 2회 연속 실패 (개수 불일치 · 순서 깨짐) |\n\n`-O0` 은 소스를 그대로 기계어로 옮기니 재배치도 캐싱도 없다.\n**우연히 돌아간 것이지 올바른 코드라서가 아니다.**\n\n실무 증상으로는 이렇게 나타난다.\n\n```\n디버그 빌드    잘 돌아감\n릴리즈 빌드    가끔 멈추거나 값이 이상함\n```\n\n-> 검증은 반드시 `-O2` 와 ThreadSanitizer 로 한다. `-O0` 통과는 증거가 아니다.\n\n---\n\n## 2. 컴파일러 잘못이 아니다\n\n최적화는 **\"한 스레드만 있다고 치고\"** 판단한다.\n\n평범한 `size_t head_` 는 다른 스레드가 건드린다는 정보를 담고 있지 않다.\n그래서 컴파일러는 \"이 루프 안에서 `head_` 를 바꾸는 코드가 없네\" 라고 보고 레지스터에 올려둔다.\n\nC++ 표준 규칙이다.\n\n> 두 스레드가 같은 변수에 접근하고 하나라도 쓰기면 -> **데이터 레이스**\n> 데이터 레이스가 있으면 -> **미정의 동작**\n\n미정의 동작이면 컴파일러는 뭘 해도 된다.\n**코드의 결함이지 컴파일러의 결함이 아니다.**\n\n---\n\n## 3. 적이 둘이다\n\n| | 증상 | 범인 |\n|---|---|---|\n| ① 캐싱 | 갱신이 **안 보임** | 컴파일러가 레지스터에 담아두고 재사용 |\n| ② 재배치 | 순서가 **뒤바뀜** | 컴파일러·CPU 가 명령 순서를 바꿈 |\n\n②가 앵커의 그 상황이다.\n`buf_[5] = 99` 보다 `tail_ = 6` 이 먼저 전달되면 소비자가 쓰레기를 읽는다.\n\n---\n\n## 4. volatile 로는 절반만 해결된다\n\n| | ① 캐싱 | ② 재배치 |\n|---|---|---|\n| `volatile` | 막음 | **못 막음** |\n| `atomic` | 막음 | 막음 |\n\n`volatile` = \"매번 메모리에서 읽고 써라\". **컴파일러에게만** 하는 말이다.\n\n두 가지가 남는다.\n\n- `volatile` 은 **volatile 끼리의 순서** 만 지킨다. `buf_[5] = 99` 는 평범한 쓰기라 울타리 밖이다\n- **CPU 에게는 아무 말도 안 한다.** 멀티코어에서 하드웨어가 순서를 바꾸면 그대로 당한다\n\n⚠️ C++ 의 `volatile` 은 **동기화 도구가 아니다.**\nJava 의 `volatile` 은 순서까지 보장해서 뜻이 다르다. 헷갈리기 쉬운 지점.\n\n---\n\n## 5. 왜 락을 못 쓰나\n\n문제 제약이 이렇다.\n\n```\npush 는 ISR 에서, pop 은 스레드에서 동시에 불릴 수 있다. 서로 기다리지 않는다\n블로킹 금지 (ISR 에서 호출된다)\n```\n\n**ISR** = Interrupt Service Routine. 하드웨어 신호가 오면 CPU 가 하던 일을 멈추고 뛰어가 실행하는 함수.\n여기서는 생산자가 ISR, 소비자가 메인 루프다.\n\nISR 안에서 뮤텍스를 잡으면 안 된다.\n\n```\n메인이 뮤텍스를 쥔 채 인터럽트에 가로채임\n   -> ISR 이 그 뮤텍스를 기다림\n   -> 뮤텍스를 쥔 메인은 ISR 때문에 진행 못 함\n   -> 영구 정지\n```\n\n그래서 이 문제는 **lock-free** 다.\n`#pragma` 도 답이 아니다. 컴파일러에게만 말하는 거라 `volatile` 과 같은 한계를 갖는다.\n\n---\n\n## 6. 답은 atomic + release/acquire\n\n`atomic` 만이 **컴파일러와 CPU 양쪽에** 동시에 말한다.\n\n```cpp\natomic<size_t> tail_{0};\n\ntail_.store(6, memory_order_release);   // 생산자\ntail_.load(memory_order_acquire)        // 소비자\n```\n\n각 줄의 뜻.\n\n```\nstore(6, release)   tail_ 에 6 을 쓴다.\n                    이 줄 위에서 쓴 값들을 먼저 전달하고 6 을 전달하라.\n\nload(acquire)       tail_ 을 읽는다.\n                    읽은 값이 6 이면, 상대가 6 을 쓰기 전에 쓴 값들도 전부 읽을 수 있게 하라.\n```\n\n**짝으로만 작동한다.**\n\n| | 결과 |\n|---|---|\n| 생산자만 release | 소비자 코어가 순서를 바꿈 |\n| 소비자만 acquire | 생산자 코어가 순서를 바꿈 |\n| 둘 다, **같은 변수** 에 | 보장됨 |\n\n변수가 다르면 연결되지 않는다.\n생산자가 `tail_` 에 release 로 쓰고 소비자가 `head_` 를 acquire 로 읽으면 아무 관계도 안 생긴다.\n\n링버퍼에는 쌍이 두 개 생긴다.\n\n| 변수 | 쓰는 쪽 | 읽는 쪽 | 전달하는 것 |\n|---|---|---|---|\n| `tail_` | 생산자 release | 소비자 acquire | \"데이터 넣었다\" |\n| `head_` | 소비자 release | 생산자 acquire | \"자리 비웠다\" |\n\n생산자도 `full()` 을 판단하려면 소비자가 얼마나 꺼냈는지 알아야 하므로 양방향이다.\n\n---\n\n## 7. 왜 기본값을 안 쓰나\n\n`atomic` 의 기본은 `seq_cst` (순차 일관성) 로 가장 강하고 가장 느리다.\n\n```\nseq_cst            모든 코어가 같은 순서로 봄.   무거운 배리어\nrelease/acquire    한 방향만 보장.             충분하고 빠름\nrelaxed            순서 보장 없음.             카운터 증가 같은 데만\n```\n\n링버퍼에 필요한 건 \"데이터 -> 인덱스\" 한 방향뿐이다.\n**ISR 은 빨리 끝나야 하므로 필요한 만큼만 쓴다.**\n\n---\n\n## 막혔던 자리 (중간 실패 기록)\n\n| 증상 | 원인 |\n|---|---|\n| `push(1)` 뒤 `size()` 가 4 | `%` 대신 `/` 를 씀 |\n| `pop` 이 `4` 를 먼저 반환 | 꺼내는 위치가 틀림 |\n| `size()` 가 `18446744073709551615` | `size_t` 는 부호 없음. 음수가 되면 큰 수로 돌아옴 |\n| `-O0` 통과 후 `-O2` 실패 | 위 1~6 번 내용 |",

    "생산자가 ISR 이고 소비자가 메인 루프일 때 이 코드가 안전한 조건은 무엇인가? 락 없이 되는 이유를 말해보라.",

   "fuAns": [
    "**안전 조건.** 생산자 하나, 소비자 하나 (SPSC).\n이 전제를 벗어나 부르면 바이트가 사라지거나 순서가 꼬인다.\n\n**락 없이 되는 이유.** 변수마다 쓰는 쪽이 한 명뿐이다.\n\n| | 쓰는 변수 | 읽기만 |\n|---|---|---|\n| `push` | `tail` | `head` |\n| `pop` | `head` | `tail` |\n\n- 버퍼 칸도 같다. 빈 칸은 생산자만 쓰고 찬 칸은 소비자만 읽는다. `tail` 을 올리는 순간 그 칸이 소비자 쪽으로 넘어간다\n- 락은 같은 자리에 쓰는 사람이 둘일 때 필요하다. 여기는 없다\n- 남는 건 가시성과 순서뿐 → 6절 release/acquire. 락은 필요 없지만 atomic 은 필요하다\n\n**ISR 에서 뮤텍스를 못 쓰는 이유.** ISR 이 도는 동안 메인 루프는 멈춰 있다 (5절).\n\n**걸린 곳.**\n- \"싱글톤으로 들고 있어야\" → 세는 대상은 버퍼 개수가 아니라 생산자·소비자 수\n- \"push 와 pop 이 실제로 동시에 불리진 않는다\" → 불린다. 멀티코어는 같은 순간에, ISR 은 pop 중간에 끼어든다\n- 내 코드의 `magnet` 은 push·pop 양쪽이 쓴다. 이 규칙 위반",
    "| 정책 | 맞는 상황 | 예시 |\n|---|---|---|\n| 새것 버림 | 중간이 빠지면 전체가 망가지는 데이터 | UART 명령 패킷 |\n| 옛것 덮어씀 | 최신 값만 의미 있는 데이터 | 센서 값, logcat 버퍼 |\n\n**구현 차이가 핵심.** 덮어쓰려면 `push` 가 `head` 를 올려야 한다.\n- `head` 에 쓰는 쪽이 둘이 된다 → 1번의 쓰기 주체 하나 규칙이 깨짐\n- 소비자가 읽는 칸을 생산자가 덮어쓸 수 있다\n- 그래서 lock-free 가 어렵다. 싱글코어면 `pop` 에서 인터럽트를 잠깐 끄고, 아니면 `head` 를 CAS 로",
    "8비트 CPU 는 16비트 값을 두 번에 나눠 읽는다.\nISR 은 아무 때나 끼어든다.\n\n```\ntail = 0x00FF\n  메인: 하위 바이트 → 0xFF\n  (ISR: push. tail = 0x0100)\n  메인: 상위 바이트 → 0x01\n  읽은 값 = 0x01FF (511). 옛 값 255 도 새 값 256 도 아님\n```\n\n**torn read** 라고 부른다.\n이 값으로 `size()` 를 구하면 256개가 더 있다고 착각한다.\n\n**volatile 로는 안 된다.** \"매번 메모리에서 읽어라\" 일 뿐, 두 바이트를 한 번에 읽게 해주지 못한다.\n\n| 고치는 법 | 내용 |\n|---|---|\n| 인터럽트 끄고 읽기 | 가장 흔한 답 |\n| 인덱스를 8비트로 | 버퍼 256 이하면 한 번에 읽힘 |\n| 두 번 읽어 비교 | 상위·하위·다시 상위. 상위가 같을 때만 채택 |",
    "2026-11-12 정리. 풀이 노트 6·7절 (이 파일 위쪽 6·7절).",
    "**깨지는 곳.** `tail`.\n둘 다 `tail` 을 5 로 읽으면 같은 칸에 쓰고, 둘 다 6 으로 올려서 한 바이트가 사라진다.\n\n**스레드 생산자면.** 칸 쓰기 + `tail` 올리기를 뮤텍스로 감싼다. `pop` 은 그대로.\n\n**ISR 생산자면.** 뮤텍스 불가 → CAS (Compare-And-Swap).\n\n```\nCAS(tail, 5, 6)\n  tail 이 아직 5 면 → 6 으로 바꾸고 성공\n  누가 바꿨으면    → 아무것도 안 하고 실패. 다시 읽고 재시도\n```\n\n비교와 교체가 CPU 명령 하나다 (x86 `lock cmpxchg`, ARM `ldxr`/`stxr`).\nC++ 은 `compare_exchange_weak`.\n\n**함정. 칸 확보와 공개를 분리해야 한다.**\nCAS 는 변수 하나만 다룬다.\n순서가 \"CAS 로 칸 확보 → 칸에 쓰기\" 가 되고, 그 사이에 틈이 생긴다.\n틈에서 소비자가 `tail` 을 보면 아직 안 쓴 칸의 옛 값을 꺼낸다.\n→ 칸마다 `ready_` 플래그. 생산자는 쓰고 나서 release 로 켜고, 소비자는 `tail` 이 아니라 `ready_[head]` 를 acquire 로 본다.\n\n```cpp\nbool push(uint8_t v) {\n    size_t t = tail_.load(memory_order_relaxed);\n    do {\n        if (t - head_.load(memory_order_acquire) == N) return false;\n    } while (!tail_.compare_exchange_weak(t, t + 1));   // 칸 확보\n    buf_[t & (N - 1)] = v;\n    ready_[t & (N - 1)].store(true, memory_order_release); // 공개\n    return true;\n}\nbool pop(uint8_t& out) {\n    size_t h = head_.load(memory_order_relaxed);\n    if (!ready_[h & (N - 1)].load(memory_order_acquire)) return false;\n    out = buf_[h & (N - 1)];\n    ready_[h & (N - 1)].store(false, memory_order_relaxed);\n    head_.store(h + 1, memory_order_release);\n    return true;\n}\n// atomic<size_t> tail_, head_;  atomic<bool> ready_[N];\n```\n\n`-O2`, 생산자 둘 × 20만 바이트 × 20회 통과 (2026-11-14).\nThreadSanitizer 는 이 맥에서 시작 즉시 죽어 미확인.\n싱글코어 임베디드면 `push` 동안 인터럽트를 끄는 게 더 간단하다.\n\n**걸린 곳.**\n- \"store/release 는 O2 때만\" → 항상 필요. O2 에서 드러났을 뿐 (1절)\n- CAS 가 buf 쓰기까지 하는 줄 알았다 → 변수 하나만. 먼저 쓰고 CAS 하면 다른 생산자가 같은 칸을 덮어쓴다\n- 칸 확보만 하고 공개를 안 하면 소비자가 옛 값을 읽는다",
    "**이유 1. 속도.** `x % N` → `x & (N - 1)`.\n- `%` 는 나눗셈. x86 수십 사이클, 나눗셈 회로 없는 MCU (Cortex-M0, AVR) 는 소프트웨어로 수십-수백 사이클. `&` 는 1 사이클\n- 마스크는 N - 1. N = 128 이면 `0x7F` (`0xFF` 는 256 용)\n\n**이유 2. 계속 올리기 인덱스.**\n`tail`·`head` 를 되돌리지 않고 올리기만 하고, 칸은 쓸 때 `& (N - 1)` 로 구한다.\n\n```\n비었다   tail == head\n꽉 찼다  tail - head == N\n개수     tail - head\n```\n\n플래그 없이 N 칸을 전부 쓴다.\n`tail` 이 타입 끝에서 넘쳐도 부호 없는 뺄셈은 맞게 나오는데, 칸 위치까지 맞으려면 N 이 2³² 를 나눠야 한다 → 2의 거듭제곱.\n\n**아닐 때.** `if (++tail == N) tail = 0;` 로 되돌린다.\n그러면 `tail == head` 가 빈 것과 꽉 찬 것 둘 다라서\n- 플래그를 하나 두거나 (내 `magnet`)\n- 한 칸을 비워두고 N - 1 칸만 쓴다. 문제 제약의 \"N - 1 개만 쓰는 구현\" 이 이것\n\n**걸린 곳.**\n- `%` 를 곱셈으로 기억 → 나눗셈. 상수 N 이면 컴파일러가 곱셈+시프트로 바꿔줄 뿐\n- 계속 올리면 `tail` 이 N 을 넘어서 체크가 필요하다고 생각 → 칸은 항상 `& (N - 1)` 로 구하니 불필요"

   "qs": [
    "Q1: kernel · grid · block 을 설명하고, 왜 launch 자체에 비용이 드나요?",
    "Q2: kernel fusion 은 무엇을 없애나요? LayerNorm + residual 을 합치면 왜 빨라지나요?",
    "Q3: CUDA graph 는 어떤 오버헤드를 없애나요? 왜 decode 에 특히 효과가 있나요?",
    "Q4: Triton 은 CUDA 와 무엇이 다르고 왜 쓰나요?",
    "Follow-up: 작은 배치에서 GPU 가 놀고 있다면 어디를 의심하나요?"
   ],
   "md": "> THEORY · gpu · T2  \n> 구현 → engine/vllm/cuda_graphs_torch_compile.md\n\n## 0. 먼저 알아둘 말\n\n| 말 | 뜻 |\n|---|---|\n| CUDA | NVIDIA GPU 로 병렬 계산을 하게 해 주는 프로그래밍 플랫폼 (언어 확장 + 컴파일러 + 라이브러리) |\n| SM | Streaming Multiprocessor. GPU 안에서 스레드를 실제로 실행하는 하드웨어 유닛 |\n| HBM | GPU 의 큰 메모리 (global memory 가 여기). 크지만 오가는 데 시간이 듦 |\n| 레지스터 | 스레드가 계산 중인 값을 두는 가장 빠른 저장 공간 |\n| μs · ms | 마이크로초 (100 만분의 1 초) · 밀리초 (1000 분의 1 초) |\n| prefill · decode | 프롬프트 전체를 한 번에 처리하는 단계 · 토큰을 하나씩 생성하는 단계 |\n| decode 스텝 | 모델을 한 번 통과시켜 토큰 1 개를 만드는 것 |\n| matmul | 행렬 × 행렬 |\n| elementwise | 원소마다 따로 하는 연산 (덧셈, 활성화 함수 등) |\n| memory-bound | 메모리에서 데이터를 가져오는 속도가 한계인 상태. 이때는 옮기는 바이트 수가 곧 시간 |\n| 7B | 가중치 70 억 개짜리 모델. BF16 (숫자당 2 바이트) 이면 14 GB |\n| vLLM | LLM 추론 서버 엔진 (오픈소스) |\n\n## Q1: kernel · grid · block 을 설명하고, 왜 launch 자체에 비용이 드나요?\n\n**30초 답**\n\n- kernel 은 GPU 에서 여러 스레드가 같이 실행하는 함수다.\n- block 은 SM 하나에 같이 올라가 shared memory 를 공유하는 스레드 묶음이고, grid 는 kernel 한 번 실행에 쓰이는 block 전체다.\n- launch 는 CPU 가 드라이버를 거쳐 GPU 에 실행을 요청하는 일이라 5-10 μs 가 든다.\n\n**용어**\n\n| 용어 | 뜻 |\n|---|---|\n| kernel | GPU 에서 실행하는 함수. 실행 주체가 아니고 OS 커널과도 다른 말 |\n| thread | kernel 코드를 실행하는 단위 하나 |\n| warp | 같은 block 안 스레드 32 개 묶음. 하드웨어가 실제로 실행하는 단위 |\n| block | 협업하는 스레드 묶음. shared memory 와 `__syncthreads()` 를 같이 씀 |\n| grid | kernel 한 번 실행의 block 전체 |\n\n**스레드가 맡을 칸은 코드가 정한다**\n\n```cpp\n// 예: block 1, 블록 크기 4, thread 2 → 1 * 4 + 2 = 6\nint i = blockIdx.x * blockDim.x + threadIdx.x;\n```\n\n- 스레드 번호와 배열 인덱스는 자동으로 연결되지 않는다.\n- 보통 위 식으로 스레드마다 한 칸씩 맡긴다.\n\n**메모리 두 가지**\n\n| 종류 | 누가 보나 | 특징 |\n|---|---|---|\n| global memory | 모든 block | 크고 느림. block 끼리 주고받는 통로 |\n| shared memory | 같은 block 만 | 작고 빠름. 여러 번 쓰는 데이터를 올려두는 작업대 |\n\n- shared memory 에 나눠 쓴 뒤 서로 읽으려면 `__syncthreads()` 배리어로 기다린다.\n- 배리어는 \"모두 도착할 때까지 대기\", 뮤텍스는 \"한 번에 하나만 들어감\" 이다.\n- `__syncthreads()` 는 block 안에서만 기다린다. 일부 스레드만 들어가는 if 안에 두면 안 된다.\n\n**launch 비용이 문제인 이유**\n\n- kernel 하나가 1 μs 짜리면 launch 가 본체보다 길다.\n- decode 한 스텝은 kernel 수백 개다 (레이어마다 matmul · norm · attention · activation).\n- 그래서 launch 만 수 ms 가 된다.\n- 7B 모델의 decode 스텝은 이론상 가장 빨라도 약 4 ms 다 (가중치 14 GB 를 3.35 TB/s 로 읽는 시간).\n- launch 가 그만큼 걸리면 GPU 는 시간의 절반을 논다.\n\n## Q2: kernel fusion 은 무엇을 없애나요? LayerNorm + residual 을 합치면 왜 빨라지나요?\n\n**30초 답**\n\n- 중간 결과를 HBM 에 쓰고 다시 읽는 왕복과 launch 횟수를 없앤다.\n- residual 과 norm 을 합치면 x + f(x) 를 계산한 값을 레지스터에 둔 채 바로 정규화하고 한 번만 쓴다.\n\n**바이트 계산**\n\n| | 읽기 | 쓰기 | launch |\n|---|---|---|---|\n| 따로 (residual 커널 + norm 커널) | 2 + 1 = 3 | 1 + 1 = 2 | 2 |\n| 합침 | 2 | 1 | 1 |\n\n- 읽기 · 쓰기는 HBM 을 오가는 횟수다 (x 와 f(x) 읽기, 결과 쓰기).\n- elementwise 연산은 전부 memory-bound 라 줄어든 바이트가 그대로 시간이다. ⭐️\n- 가장 쉬운 예: `x + 1` 커널과 `* 2` 커널을 `(x + 1) * 2` 한 커널로.\n- 합치는 주체는 개발자 또는 `torch.compile` 같은 도구다. nvcc (CUDA 컴파일러) 가 알아서 합치지는 않는다.\n\n**vLLM 예시**\n\n| 함수 | 합치는 것 |\n|---|---|\n| `fused_add_rms_norm` | residual 덧셈 + RMSNorm |\n| `silu_and_mul` | SiLU(a) * b (SwiGLU 라는 활성화 구조의 앞부분) |\n\n- residual: `x + f(x)`. Transformer 블록마다 있다.\n- LayerNorm 은 평균을 빼고 분산으로 나눈다. RMSNorm 은 평균을 빼지 않고 제곱평균의 제곱근으로 나눈다.\n- SiLU(x) = x · sigmoid(x). ReLU 와 달리 음수를 조금 남기고 부드럽다.\n\n## Q3: CUDA graph 는 어떤 오버헤드를 없애나요? 왜 decode 에 특히 효과가 있나요?\n\n**30초 답**\n\n- kernel launch 열 전체를 한 번 녹화(capture)해두고, 다음부터는 \"이 그래프 재생\" 요청 한 번으로 수백 개 kernel 을 띄운다.\n- CPU launch 오버헤드가 스텝당 1 번으로 준다.\n- GPU 계산량 자체는 그대로다.\n\n**무엇인가**\n\n- GPU 작업과 의존관계를 미리 등록한 DAG 다. 예: A → B → C.\n- 의존 있는 작업은 순서대로, 독립 작업은 병렬로 돈다.\n- kernel 을 연속 호출한다고 저절로 그래프가 되지는 않는다. capture 해야 한다.\n\n**fusion 과의 차이**\n\n| | 하는 일 | 줄이는 것 |\n|---|---|---|\n| fusion | kernel 자체를 하나로 합침 | launch 횟수 + HBM 왕복 |\n| CUDA graph | 별도 kernel 들을 묶어 한 번에 요청 | launch 요청 비용만 |\n\n**왜 decode 인가**\n\n- decode 는 매 스텝 같은 kernel 열을 같은 모양으로 돌린다. 달라지는 건 배치 크기뿐이다.\n- 그래서 배치 크기별로 그래프를 미리 잡아두고 재생한다.\n- prefill 은 프롬프트 길이가 매번 달라 모양이 바뀌므로 잡기 어렵다.\n- 작은 배치 decode 에서 CPU 오버헤드가 GPU 시간보다 클 때 2-3 배 빨라진다.\n\n**배치 크기별 그래프** (헷갈렸던 부분)\n\n- 배치 크기 = 같이 처리하는 요청 수. 그래프 수나 kernel 수가 아니다.\n- \"8 용 그래프\" 는 요청 8 개분 데이터를 처리하도록 잡은 그래프 하나다.\n- 8 용과 16 용은 같은 모델 계산을 다른 크기로 잡은 별도 그래프다.\n\n```text\n요청 8 개분 입력 → [A → B → C] → 결과 8 개\n(그래프 하나, 재생 한 번)\n```\n\n**대가: 입력 주소 고정**\n\n- 그래프는 읽을 메모리 주소까지 기억한다.\n- 그래서 입력 버퍼를 미리 할당해두고 주소는 그대로, 내용만 바꿔 넣는다.\n- 그 버퍼만큼 메모리를 계속 잡아둬야 한다.\n- CPU 의 pinned memory (디스크로 밀려나지 않게 고정한 CPU 메모리) 와는 다른 얘기다.\n\n## Q4: Triton 은 CUDA 와 무엇이 다르고 왜 쓰나요?\n\n**30초 답**\n\n- GPU kernel 을 Python 기반 전용 문법으로 쓰는 언어 + 컴파일러다.\n- 스레드 하나가 아니라 타일 (데이터 묶음) 단위로 연산을 쓴다.\n- 스레드 배치, coalescing (warp 가 인접 주소를 읽어 전송 횟수를 줄이는 것), shared memory 관리는 컴파일러가 맡는다.\n\n**CUDA vs Triton**\n\n| | CUDA | Triton |\n|---|---|---|\n| 쓰는 단위 | 스레드 하나의 코드 | \"이 블록이 이 타일을 처리\" |\n| 메모리 접근 | warp 의 32 스레드가 어떤 주소를 읽는지 사람이 맞춤 | 컴파일러가 접근 코드 생성 |\n| 성능 | 세밀한 튜닝 가능. FlashAttention 같은 최고 성능 커널은 여전히 CUDA 가 우세 | 높은 성능 가능, 작업 따라 다름 |\n| 개발 속도 | 느림 | fusion 커널, 양자화 (숫자를 더 적은 비트로 저장) 커널을 하루에 |\n\n- 일반 Python 코드가 GPU 에서 도는 게 아니다. 작성하는 건 여전히 GPU kernel 이다.\n- 개발자는 데이터 범위와 연산을 정한다. 접근 패턴은 여전히 성능에 중요하다.\n- vLLM 의 attention 백엔드 (attention 계산 구현체) 하나와 MoE 커널 일부가 Triton 이다.\n- MoE: Mixture of Experts. 토큰마다 여러 전문가 층 중 일부만 골라 쓰는 모델 구조.\n\n## Follow-up: 작은 배치에서 GPU 가 놀고 있다면 어디를 의심하나요?\n\n**30초 답**\n\n- CPU 쪽(launch · Python · 스케줄링)이 늦어서 GPU 가 다음 kernel 을 기다리는 상태를 의심한다.\n- 프로파일에서 kernel 사이 빈 틈(gap)으로 보인다.\n\n**확인**\n\n- 프로파일러에서 GPU kernel 사이 빈 구간과 같은 시점의 CPU 활동을 같이 본다.\n- 배치 1 decode 는 kernel 하나가 수 μs 라 launch 5 μs 가 그대로 틈이 된다.\n- GPU 사용률이 낮다는 것만으로 단정하지 않는다. 낮은데 느리면 거의 이것이지만 틈을 확인한다.\n\n**처방**\n\n| 처방 | 효과 |\n|---|---|\n| CUDA graph | kernel 마다 보내던 요청을 그래프 재생 한 번으로 |\n| kernel fusion | kernel 수 자체를 줄여 요청 횟수 + HBM 왕복 감소 |\n| CPU 작업 분리 | 준비 작업을 다른 프로세스로. 예: vLLM V1 이 EngineCore (스케줄링과 GPU 실행 담당) 를 별도 프로세스로 분리 |\n\n- 분리해도 준비 작업은 없어지지 않는다. 다른 코어가 병렬로 맡을 뿐이다.\n- 준비가 끝나야 GPU 작업을 실행할 수 있다는 의존관계도 그대로다.\n",

   "md": "> THEORY · gpu · T1\n\n## 0. 먼저 알아둘 말\n\n| 말 | 뜻 |\n|---|---|\n| SM | Streaming Multiprocessor. GPU 안에서 스레드를 실제로 실행하는 하드웨어 유닛. H100 SXM 은 132 개 |\n| thread block | \"블록\" 의 정식 이름. 프로그래머가 정한 스레드 묶음. 하드웨어 부품이 아니라 자원을 배정받는 대상 |\n| warp | 블록의 스레드를 32 개씩 자른 묶음. SM 이 스케줄링하는 단위 |\n| HBM | High Bandwidth Memory. GPU 의 큰 메모리 (글로벌 메모리). 가중치와 KV 캐시가 여기 있음 |\n| SRAM | SM 안의 작고 빠른 메모리. shared memory 가 여기에 잡힘 |\n| 대역폭 | 초당 옮길 수 있는 데이터 양 (byte/s). 지연시간 (요청한 데이터가 도착하기까지의 시간) 과는 다른 값 |\n| 텐서 | 숫자를 담는 다차원 배열. 벡터와 행렬도 텐서 |\n| matmul | matrix multiplication. 행렬 × 행렬 |\n| matvec | matrix-vector multiplication. 행렬 × 벡터. matmul 의 특별한 경우 |\n| FLOP | 부동소수점 연산 1 번. 덧셈 1 번, 곱셈 1 번이 각각 1 FLOP |\n| FLOPS | 초당 FLOP 수. TFLOPS 는 초당 1 조 번 |\n| BF16 · FP32 · FP8 | 부동소수점 숫자 형식. 숫자 하나에 각각 16 · 32 · 8 비트 |\n\n## Q1: SM · warp · thread block 의 관계를 설명해보세요. warp 가 32 인 게 왜 중요한가요?\n\n**30초 답**\n\n- SM 은 스레드를 실행하는 하드웨어 유닛이다 (H100 은 132 개).\n- thread block 은 프로그래머가 짠 스레드 묶음이고, 블록 하나는 SM 하나에 올라간다.\n- 블록의 스레드는 32 개씩 warp 로 잘려 실행된다. warp 32 개 스레드는 같은 명령을 함께 실행한다.\n\n**구조**\n\n```text\nGPU (H100: SM 132 개)\n└─ SM 0\n   ├─ block A (스레드 64 개)\n   │    ├─ warp 0 (32 개)\n   │    └─ warp 1 (32 개)\n   └─ block B (스레드 64 개)\n        ├─ warp 0 (32 개)\n        └─ warp 1 (32 개)\n```\n\n- \"블록이 SM 에 올라간다\" = SM 이 그 블록 스레드들이 쓸 레지스터와 shared memory 를 확보한다는 뜻이다.\n- SM 은 실행 준비가 된 warp 를 골라 실행한다.\n- 한 SM 에 블록 여러 개가 올라갈 수 있다. 단, SM 의 레지스터 · shared memory · 스레드 수 한도 안에서다.\n\n**누가 정하나**\n\n| 값 | 정하는 쪽 | 예 |\n|---|---|---|\n| 블록당 스레드 수 | 개발자 | 64 |\n| warp 크기 | 하드웨어 고정 | 32 |\n| 블록당 warp 수 | 스레드 수 ÷ 32 올림 | 64 → 2 개, 33 → 2 개 (둘째 warp 는 1 개만 활성) |\n\n**32 가 왜 중요한가** ⭐️\n\n- warp 의 32 개 스레드는 같은 명령을 함께 실행한다 (SIMT: Single Instruction, Multiple Threads).\n- 32 개가 같은 길로 가야 빠르다. if 로 갈라지면 (divergence) 양쪽 경로를 차례로 돌아 느려진다.\n- 메모리도 32 개가 연속 주소를 읽어야 적은 전송으로 가져온다 (coalescing).\n- 그래서 32 가 성능을 따질 때의 기본 단위다.\n\n**자원을 많이 쓰면 왜 느려지나**\n\n- SM 의 자원 총량은 고정이다.\n- 블록 하나가 레지스터나 shared memory 를 많이 쓰면 같이 올릴 수 있는 블록 · warp 수가 준다.\n- 한 warp 가 메모리를 기다릴 때 대신 돌릴 warp 가 적으면 대기 시간을 숨기기 어렵다 (Q4 참고).\n- 점유율 (occupancy) = SM 에 실제 올라간 warp 수 ÷ 최대로 올릴 수 있는 warp 수.\n- 점유율이 높다고 항상 빠른 것은 아니다.\n\n## Q2: HBM · L2 · shared memory(SRAM) · register 의 크기와 대역폭을 대략 말해보세요 (H100 기준).\n\n**30초 답**\n\n- HBM 80 GB · 3.35 TB/s.\n- L2 캐시 50 MB.\n- shared memory 는 SM 당 최대 228 KB, register 는 SM 당 256 KB.\n- 아래로 갈수록 작고 가깝다. HBM 왕복을 줄이는 게 커널 최적화의 핵심이다.\n\n**자세히**\n\n| 층 | 역할 | 크기 (H100 SXM) | 대역폭 |\n|---|---|---|---|\n| HBM | 가중치 · KV 캐시 등 큰 데이터. 글로벌 메모리 | 80 GB | 약 3.35 TB/s |\n| L2 캐시 | HBM 에서 가져온 데이터를 자동으로 캐시 | 50 MB | 수 TB/s 수준 |\n| shared memory (SRAM) | 같은 블록 스레드들이 함께 쓰는 공간. 프로그래머가 직접 쓰는 캐시 | SM 당 최대 228 KB | 여러 SM 합산 수십 TB/s 수준 |\n| register | 각 스레드가 계산 중인 값 | SM 당 256 KB | 가장 가까움. 수치는 외우지 않음 |\n\n- shared memory 와 register 용량은 스레드나 블록 하나당이 아니라 SM 전체 기준이다.\n- 접근 지연시간은 register → shared memory → L2 → HBM 순으로 커진다.\n- 이 순서는 지연시간 순위다. 대역폭 순위로 읽으면 안 된다 (SM 당 수치와 GPU 전체 수치는 기준이 다르다).\n- 가까운 메모리에 올려 두고 재사용해 HBM 왕복을 줄이면 빨라진다. FlashAttention 이 이 방식이다.\n- 출처: NVIDIA H100 datasheet, CUDA C Programming Guide.\n\n## Q3: tensor core 는 무엇을 빨리 하나요? 어떤 연산은 혜택이 없나요?\n\n**30초 답**\n\n- tensor core 는 GPU 안의 실제 연산 회로다. 작은 행렬 묶음의 곱셈과 누적 덧셈을 한 번에 한다.\n- 그래서 matmul 만 빨라진다.\n- softmax · LayerNorm · 원소별 (elementwise) 연산은 혜택이 없다.\n\n**자세히**\n\n- 텐서는 데이터 구조이고, tensor core 는 하드웨어다. 이름만 비슷하다.\n- 큰 행렬 전체를 한 번에 끝내는 게 아니다. 작은 타일 단위 곱을 한 명령으로 처리하고, 그걸 반복한다.\n- matmul 을 아무리 빨리 해도 나머지 연산과 HBM 왕복이 병목으로 남는다. 그래서 fusion 이 중요하다.\n\n**BF16 입력, FP32 누적**\n\n- 입력은 BF16 (16 비트) 으로 받고, 곱한 결과는 FP32 (32 비트) 누적값에 더해 간다.\n- BF16 입력의 이유: 숫자당 바이트가 적어 전송량이 줄고, tensor core 가 이 형식을 높은 처리량으로 계산하도록 설계됐다.\n- FP32 누적의 이유: 여러 곱을 더할 때 쌓이는 오차를 줄인다.\n- BF16 으로 받으면서 이미 잃은 정밀도가 복구되는 것은 아니다.\n\n**숫자 (H100 SXM, 이론상 최대)**\n\n| 연산 장치 · 형식 | 처리량 |\n|---|---|\n| tensor core, BF16 dense | 약 990 TFLOPS |\n| tensor core, FP8 dense | BF16 의 약 2 배 |\n| 일반 CUDA core, FP32 | 약 67 TFLOPS |\n\n- 990 과 67 은 장치와 형식이 둘 다 다르다. \"BF16 이라서 15 배 빠르다\" 는 뜻이 아니다.\n- FP8 의 2 배도 이론상 최대치다. 실제 속도나 정확도를 보장하지 않는다.\n\n## Q4: GPU 와 CPU 가 근본적으로 다른 설계 목표는?\n\n**30초 답**\n\n- CPU 는 작업 하나의 지연시간을 줄이도록 설계했다.\n- GPU 는 많은 병렬 작업의 전체 처리량을 높이도록 설계했다.\n- GPU 는 메모리 대기를 없애지 않고, 그동안 다른 warp 를 돌려서 숨긴다.\n\n**자세히**\n\n| 관점 | CPU | GPU |\n|---|---|---|\n| 목표 | 개별 작업의 지연시간 ↓ | 전체 처리량 ↑ |\n| 설계 | 큰 캐시, 분기 예측, 복잡한 실행 제어 | 많은 연산 장치, 높은 메모리 대역폭, 많은 warp |\n| 잘 맞는 일 | 분기가 많거나 순서 의존이 큰 일 | 많은 데이터에 같은 계산 |\n| LLM 서빙에서 | 토큰화, 스케줄링 | 큰 행렬곱 |\n\n- 지연시간 숨기기 (latency hiding): 한 warp 가 데이터를 기다리는 동안 준비된 다른 warp 의 명령을 실행한다.\n- 데이터가 빨리 오는 게 아니다. 기다리는 시간에 다른 계산을 하는 것이다.\n\n## Follow-up: 메모리 대역폭 3.35 TB/s 와 연산 ~1000 TFLOPS 가 뜻하는 ridge point 는 어디인가요?\n\n**30초 답**\n\n- 약 295 FLOP/byte 다.\n- 읽은 바이트 하나당 295 번 계산해야 연산 장치가 꽉 찬다.\n- 그보다 적게 계산하는 작업은 메모리 대역폭이 한계다.\n\n**계산**\n\n```text\nridge point = 최대 연산 처리량 ÷ 메모리 대역폭\n            = 990 × 10¹² FLOP/s ÷ (3.35 × 10¹² byte/s)\n            ≈ 295 FLOP/byte\n```\n\n- ridge point 는 메모리 대역폭 한계와 연산 한계가 만나는 경계다.\n- 작업이 바이트당 몇 번 계산하는지 (arithmetic intensity) 를 295 와 비교한다.\n  - 작으면 메모리 대역폭이 한계 (memory-bound).\n  - 크면 연산 능력이 한계 (compute-bound).\n- \"메모리가 병목\" 은 용량 부족이 아니다. 데이터를 공급하는 속도가 처리 속도를 제한한다는 뜻이다.\n  - 예: 전송 10 초 + 계산 1 초인 작업은 계산을 0.5 초로 줄여도 전송 10 초가 그대로다.\n\n**배치 1 decode 가 왜 memory-bound 인가**\n\n- decode 전체가 matvec 하나라는 뜻이 아니다. decode 안의 선형 계층 (가중치 행렬을 곱하는 부분) 계산이 matvec 이다.\n\n| 선형 계층에서의 상황 | 입력 | 계산 형태 |\n|---|---|---|\n| prefill (여러 토큰을 한 번에) | 토큰 벡터들을 모은 행렬 | matmul |\n| 배치 1 decode (현재 토큰 하나) | 토큰 벡터 하나 | matvec |\n| 여러 요청의 decode 를 묶음 | 요청별 벡터를 모은 행렬 | matmul |\n\n```text\nmatvec 예:\n[1 2 3]   [10]   [140]      140 = 1×10 + 2×20 + 3×30\n[4 5 6] × [20] = [320]      320 = 4×10 + 5×20 + 6×30\n          [30]\n```\n\n- matvec 에서는 BF16 가중치 하나 (2 바이트) 를 읽어 곱셈 1 번 + 덧셈 1 번 (2 FLOP) 에 쓴다.\n- 그래서 약 1 FLOP/byte 다. 295 보다 훨씬 낮다.\n- 배치를 B 로 키우면 같은 가중치를 벡터 B 개에 재사용하므로 약 B FLOP/byte 가 된다.\n- 단순 모델로는 배치 295 근처가 경계다. 실제로는 KV 캐시 전송, 커널 효율 등이 있어 정확한 값은 아니다.\n- 이 숫자 하나가 \"decode 는 배치를 키워야 한다\" 의 근거다.\n",

   "md": "> THEORY · gpu · T1\n\n## 0. 먼저 알아둘 말\n\n| 말 | 뜻 |\n|---|---|\n| FLOP | 부동소수점 연산 1 번 (덧셈 1 번, 곱셈 1 번이 각각 1 FLOP) |\n| FLOPS | 초당 FLOP 수. peak FLOPS 는 하드웨어의 이론상 최대치 (H100 BF16 약 990 TFLOPS) |\n| 대역폭 | 메모리가 초당 공급할 수 있는 바이트 수 (H100 HBM 약 3.35 TB/s) |\n| arithmetic intensity | 연산 집약도. 메모리에서 옮긴 바이트 하나당 몇 번 계산하는지 (FLOP/byte) |\n| memory-bound | 메모리 대역폭이 속도를 제한하는 상태. 연산 장치는 데이터를 기다리며 논다 |\n| compute-bound | 연산 능력이 속도를 제한하는 상태 |\n| matmul | 행렬 × 행렬 |\n| matvec | 행렬 × 벡터. 배치 1 decode 의 선형 계층 (가중치 행렬을 곱하는 부분) 계산이 이것 |\n| prefill | 프롬프트 토큰 전체를 한 번에 처리하는 단계 |\n| decode | 토큰을 하나씩 생성하는 단계. 한 스텝에 요청당 토큰 1 개 |\n| HBM | GPU 의 큰 메모리. 가중치와 KV 캐시가 여기 있음 |\n| ridge point | memory-bound 와 compute-bound 가 갈리는 경계값 (H100 BF16 약 295 FLOP/byte) |\n\n## Q1: arithmetic intensity(FLOPs/byte) 를 정의하고 ridge point 가 무엇인지 설명해보세요.\n\n**30초 답**\n\n- arithmetic intensity = 작업이 옮긴 바이트 하나당 계산을 몇 번 하는가 (FLOP/byte). 작업의 값이다.\n- ridge point = GPU 의 최대 연산량 ÷ GPU 의 메모리 대역폭. GPU 의 값이다. H100 은 약 300 FLOP/byte.\n- 작업의 intensity 가 ridge point 보다 작으면 memory-bound, 크면 compute-bound 다. ⭐️\n\n**두 식** (모양은 같고, 넣는 숫자의 주인이 다르다)\n\n```text\nintensity   = 작업의 FLOP ÷ 작업의 바이트\nridge point = GPU 의 최대 연산량 ÷ GPU 의 대역폭\n```\n\n| 값 | 누구의 값 | 어떻게 정해지나 |\n|---|---|---|\n| intensity | 작업 (커널) | 그 작업이 바이트당 계산을 몇 번 하는지. 작업마다 다름 |\n| ridge point | 하드웨어 | GPU 를 정하면 고정되는 기준선 |\n\n- 쉽게 세는 법: \"가중치를 한 번 읽고 몇 번 재사용하나\" 가 곧 intensity 다. ⭐️\n\n| 작업 | 재사용 횟수 = intensity | H100 (약 300) 과 비교 |\n|---|---|---|\n| decode, 배치 1 | 약 1 | memory-bound |\n| decode, 배치 32 | 약 32 | memory-bound |\n| prefill, 토큰 8,000 개 | 약 8,000 | compute-bound |\n\n- 배치 B 개든 토큰 N 개든 GPU 에게는 같은 일이다. 같은 가중치로 계산을 여러 번 한다.\n\n**단위 구분**\n\n| 단위 | 뜻 |\n|---|---|\n| 바이트 | 옮기는 데이터 양 |\n| FLOP | 계산 횟수. 덧셈 1 번, 곱셈 1 번이 각각 1 FLOP. `a * 2 + 1` 은 2 FLOP |\n| FLOPS | 초당 계산 횟수 (속도). FLOP 이 거리라면 FLOPS 는 속력 |\n| FLOP/byte | 바이트 하나당 계산 횟수 |\n\n- FLOP 과 바이트 사이에 정해진 관계식은 없다. 그 관계를 정하는 것이 작업이고, 그 값이 intensity 다.\n- 같은 100 바이트를 읽어도 계산을 200 번 하는 작업이 있고 5000 번 하는 작업이 있다.\n\n**왜 메모리와 계산을 같이 보나**\n\n- 작업 하나가 끝나려면 \"데이터 옮기기\" 와 \"계산하기\" 가 둘 다 끝나야 한다.\n- 느린 쪽이 전체 속도를 정한다.\n\n| 상황 | 무슨 일이 생기나 | 이름 |\n|---|---|---|\n| 계산은 준비됐는데 데이터가 늦게 옴 | 연산 장치가 데이터를 기다리며 논다 | memory-bound |\n| 데이터는 빨리 왔는데 계산이 못 따라감 | 데이터가 쌓여 기다린다 | compute-bound |\n\n**장난감 GPU 예시**\n\n| 장난감 GPU 의 능력 | 값 |\n|---|---|\n| 메모리 대역폭 | 1 초에 10 바이트 |\n| 최대 연산량 | 1 초에 100 FLOP |\n| ridge point | 100 ÷ 10 = 10 FLOP/byte |\n\n| 작업 | 옮기는 시간 | 계산 시간 | intensity | 결론 |\n|---|---|---|---|---|\n| 200 바이트, 600 FLOP | 200 ÷ 10 = 20 초 | 600 ÷ 100 = 6 초 | 600 ÷ 200 = 3 | 3 < 10, memory-bound |\n| 100 바이트, 1000 FLOP | 10 초 | 10 초 | 10 | 딱 ridge point |\n| 50 바이트, 2000 FLOP | 5 초 | 20 초 | 2000 ÷ 50 = 40 | 40 > 10, compute-bound |\n\n- 판단 방법은 두 가지고 답은 항상 같다.\n  - 시간 비교: 옮기는 시간과 계산 시간 중 긴 쪽이 병목.\n  - intensity 비교: ridge point 보다 작으면 memory-bound, 크면 compute-bound.\n- intensity 비교가 더 편하다. 작업 크기를 몰라도 \"바이트당 계산 몇 번\" 만 알면 된다.\n\n**진짜 GPU 로 옮기면**\n\n| | 장난감 GPU | H100 |\n|---|---|---|\n| 대역폭 | 10 바이트/초 | 약 3.35 TB/초 |\n| 최대 연산량 | 100 FLOP/초 | 약 1000 TFLOPS (정확히는 990) |\n| ridge point | 10 | 1000 ÷ 3.35 ≈ 300 |\n\n- 외울 것은 1000 TFLOPS 와 3.35 TB/s 두 숫자다. 295 자체는 안 외워도 된다.\n- 면접에서는 \"대략 300 FLOP/byte\" 라고 말하면 충분하다.\n- 예: 배치 1 decode 는 intensity 가 약 1 이라 압도적으로 memory-bound 다. 연산 장치가 논다.\n\n**roofline 그래프: 서로 다른 두 한계를 한 장에 그리는 법**\n\n- 메모리 쪽 한계를 계산 속도 단위로 바꾼다.\n- 대역폭 (byte/s) × intensity (FLOP/byte) = FLOP/s. \"데이터가 이 속도로 들어올 때 낼 수 있는 최대 계산 속도\" 다.\n- 그러면 y 축을 \"낼 수 있는 계산 속도\" 하나로 통일할 수 있다.\n\n| intensity | 메모리가 허락하는 속도 (3.35 × intensity) | 연산 장치가 허락하는 속도 | 실제 한계 (둘 중 작은 쪽) |\n|---|---|---|---|\n| 1 | 3.35 TFLOPS | 990 | 3.35 (메모리가 한계) |\n| 100 | 335 TFLOPS | 990 | 335 (메모리가 한계) |\n| 295 | 990 TFLOPS | 990 | 990 (ridge point) |\n| 1000 | 3350 TFLOPS | 990 | 990 (연산이 한계) |\n\n```text\n달성 FLOPS\n  ^\n  |        _____________  ← peak FLOPS\n  |       /                 (compute-bound)\n  |      /\n  |     /  ← 대역폭 × intensity\n  |    /     (memory-bound)\n  +---+-----------------> intensity\n     ridge point (295)     (FLOP/byte)\n```\n\n- 왼쪽 기울어진 선: 메모리 한계. intensity 에 비례해 올라간다.\n- 오른쪽 평평한 선: 연산 한계.\n- 실제 성능은 두 선 중 낮은 쪽을 따라간다. 그 모양이 지붕 (roof) 같아서 roofline 이다.\n\n**ridge point 는 몇 개인가**\n\n- 조건을 하나로 정하면 1 개다. 나눗셈 한 번이라 답이 하나다.\n- 조건이 바뀌면 값이 달라진다.\n\n| 바뀌는 조건 | 예 | ridge point |\n|---|---|---|\n| 연산 방식 · 숫자 형식 | H100 tensor core BF16 (약 990 TFLOPS) | 약 295 |\n| | H100 일반 연산 FP32 (약 67 TFLOPS) | 약 20 |\n| GPU 종류 | H100, A100 | GPU 마다 다름 |\n\n- 면접에서 말하는 300 은 \"H100, BF16, HBM 기준\" 이다. LLM 이 실제로 쓰는 조건이다.\n- ridge point 를 넘은 작업은 전부 연산 장치를 꽉 채운다. ridge point 는 그 구간이 시작되는 점이다.\n\n## Q2: 큰 matmul 과 decode 의 matvec 은 roofline 어디에 떨어지나요? 왜?\n\n**30초 답**\n\n- 큰 matmul 과 prefill 은 오른쪽 (compute-bound) 이다.\n- 배치 1 decode 의 matvec 은 맨 왼쪽 (memory-bound) 이다.\n- 차이는 한 번 읽은 가중치를 몇 번 재사용하느냐다. ⭐️\n- decode 는 토큰 하나를 만들 때마다 가중치 전체를 읽는데, 그걸 배치 크기만큼만 재사용한다.\n\n**matvec 의 intensity 가 1 인 이유**\n\n- matvec 은 가중치 하나를 읽어 곱셈 1 번 + 덧셈 1 번을 한다.\n\n| 가중치 1,000 개짜리 matvec | 계산 | 값 |\n|---|---|---|\n| 읽는 양 | 1,000 개 × 2 바이트 (BF16) | 2,000 바이트 |\n| 연산 | 1,000 개 × 2 FLOP | 2,000 FLOP |\n| intensity | 2,000 ÷ 2,000 | 1 FLOP/byte |\n\n**배치를 키우면**\n\n- 가중치는 배치 전체가 같이 쓴다. 그래서 한 번만 읽는다.\n- 연산만 배치 크기만큼 늘어난다.\n\n| 배치 4 | 계산 | 값 |\n|---|---|---|\n| 읽는 양 | 그대로 | 2,000 바이트 |\n| 연산 | 2,000 × 4 | 8,000 FLOP |\n| intensity | 8,000 ÷ 2,000 | 4 FLOP/byte |\n\n- 자주 틀리는 곳: 읽는 양에 4 를 곱하지 않는다. 가중치는 요청마다 따로 있지 않다.\n\n**어디에 떨어지나** (H100, ridge point 약 300)\n\n| 작업 | 재사용 횟수 = intensity | 위치 | 더 키우면 |\n|---|---|---|---|\n| decode, 배치 1 | 약 1 | 맨 왼쪽, memory-bound | 스텝 시간 그대로, 토큰 수만 늘어남 |\n| decode, 배치 32 | 약 32 | memory-bound | 위와 같음 |\n| decode, 배치 약 300 | 약 300 | 딱 ridge point | 여기서 공짜가 끝남 |\n| decode, 배치 600 | 약 600 | compute-bound | 스텝 시간이 배치에 비례해 늘어남 |\n| prefill, 토큰 8,000 개 | 약 8,000 | 한참 오른쪽, compute-bound | 시간이 토큰 수에 비례 |\n| 큰 matmul (4096 × 4096 끼리) | 약 1365 | compute-bound | |\n\n- 배치 B 개든 토큰 N 개든 GPU 에게는 같은 일이다. 같은 가중치로 계산을 여러 번 한다.\n- 배치 32 면 연산 장치는 능력의 약 10 분의 1 만 쓴다 (32 ÷ 300).\n- \"decode 는 배치를 키우면 처리량이 거의 공짜로 는다\" 의 근거가 이것이다.\n\n**실제로는 배치 300 까지 못 가는 이유**\n\n| 이유 | 설명 |\n|---|---|\n| KV 캐시도 읽는다 | KV 캐시 (지나간 토큰의 계산 결과 저장분) 는 요청마다 따로라 배치만큼 읽는 양이 늘어난다. 실제 intensity 는 B 보다 천천히 오른다 |\n| 메모리가 먼저 찬다 | 8,000 토큰짜리 요청은 KV 가 약 1 GB 라 H100 한 장에 50 개쯤이 한계다 |\n| 토큰 간격 목표 | 배치가 크면 스텝이 길어져 토큰 하나가 늦게 나온다 |\n\n**매 스텝 읽는 것** (파라미터 80 억 개 모델)\n\n| 읽는 것 | 크기 | 비고 |\n|---|---|---|\n| 가중치 전체 | 16 GB | 항상 전부. decode 가 memory-bound 인 주된 이유 |\n| KV 캐시 | 요청당 약 1 GB (8,000 토큰) | 배치가 커지면 비중이 커진다 |\n\n**양자화는 어느 쪽을 빠르게 하나**\n\n- 양자화: 가중치를 더 적은 비트로 저장하는 것. 보통 16 비트 → 8 비트.\n- 대상은 주로 가중치다. Q, K, V 가 아니다.\n\n| | 한계 | 양자화 효과 |\n|---|---|---|\n| decode | 메모리 | 읽을 바이트가 절반. 스텝 시간이 거의 절반 |\n| prefill | 연산 | 바이트가 줄어도 연산은 그대로라 바로 빨라지지 않는다 |\n\n- prefill 도 8 비트용 tensor core (작은 행렬곱 전용 회로) 를 쓰면 빨라진다. 이유는 \"바이트가 줄어서\" 가 아니라 \"8 비트 연산이 더 빨라서\" 다.\n\n**면접용 한 줄**\n\n- \"decode 는 배치 수백까지 memory-bound 라 배치를 키우는 게 거의 공짜다. 실제 상한은 ridge point 가 아니라 KV 메모리와 토큰 간격 목표가 정한다.\"\n\n**일반식** (후속 질문용)\n\n- M×K 행렬과 K×N 행렬을 곱하면:\n  - 연산: 2MNK FLOP (곱셈 MNK 번 + 덧셈 MNK 번).\n  - 메모리: (MK + KN + MN) 개 숫자 × 2 바이트.\n- 큰 matmul: 2 × 4096³ ÷ (3 × 4096² × 2) = 4096 ÷ 3 ≈ 1365.\n\n## Q3: attention 은 compute-bound 인가요 memory-bound 인가요? 시퀀스 길이에 따라 어떻게 바뀌나요?\n\n**30초 답** (이 세 줄만 가져가면 된다)\n\n- 표준 attention 은 n × n 점수 표를 큰 메모리 (HBM) 에 쓰고 읽기를 반복해서 memory-bound 쪽이다. 길이가 늘어도 그대로다.\n- FlashAttention 은 그 표를 큰 메모리에 쓰지 않는다. 계산량은 그대로다.\n- 그래서 빨라진 이유는 계산이 아니라 메모리 이동이 줄어서다. ⭐️\n\n**attention 이 하는 일** (n = 토큰 수)\n\n| 단계 | 하는 일 | 만들어지는 것 |\n|---|---|---|\n| 1 | 모든 토큰 쌍의 점수를 계산 | n × n 점수 표 |\n| 2 | 점수 표를 비율로 바꿈 (softmax) | n × n 비율 표 |\n| 3 | 비율대로 값을 섞음 | 토큰마다 결과 벡터 1 개 |\n\n- n × n 인 이유: 토큰 i 의 q 하나가 모든 토큰 j 의 k 와 점수를 낸다 (n 개). 이걸 모든 i 에 대해 한다.\n- 토큰이 8,000 개면 표는 6,400 만 칸이다.\n\n**표준과 FlashAttention**\n\n| | 표준 attention | FlashAttention |\n|---|---|---|\n| 점수 표 | 전체를 큰 메모리에 쓰고 다시 읽음 | 작은 조각으로 나눠 빠른 메모리 안에서 처리하고 버림 |\n| 큰 메모리에서 오가는 것 | q, k, v + n × n 표 | q, k, v 와 결과뿐 |\n| 계산량 | 같음 | 같음 |\n| 결과 | 같음 | 같음 (근사 아님) |\n| roofline 위치 | memory-bound 쪽. 길이와 무관 | 길어질수록 compute-bound 쪽으로 |\n\n- FlashAttention 은 새 모델이나 새 수식이 아니다. 같은 계산을 GPU 에서 돌리는 방식만 바꿨다.\n- 조각만 보면 softmax 에 필요한 행 전체의 합을 모른다.\n  - 그래서 지금까지의 최댓값과 합을 들고 다니며 새 조각마다 고쳐 쓴다.\n  - 이 방법이 online softmax 다.\n- 자세한 방법은 flash_attention 카드에 있다.\n\n**면접용 한 줄**\n\n- \"FlashAttention 은 n × n 점수 표를 큰 메모리에 쓰지 않고, 조각마다 online softmax 로 그 자리에서 끝낸다. 계산량은 같고 메모리 이동이 줄어서 빨라진다.\"\n\n**숫자를 물으면** (외울 필요 없음)\n\n- 표준 attention 의 intensity 는 헤드 차원 수준이다. 보통 128 이라 ridge point 300 아래다.\n  - 헤드 차원: 헤드 하나의 벡터 길이. 모델의 벡터 길이 ÷ 헤드 수. 모델마다 다르지만 128 이 흔하다.\n- 길이와 무관한 이유: 칸이 늘면 계산과 메모리 이동이 같은 비율로 늘어난다.\n\n## Q4: MFU 와 MBU 는 무엇을 재고 어떻게 계산하나요?\n\n**30초 답**\n\n- 둘 다 \"GPU 를 몇 % 썼나\" 를 재는 숫자다. roofline 의 두 한계에 하나씩 대응한다.\n- MFU 는 연산 장치를, MBU 는 메모리 대역폭을 몇 % 썼는지다.\n- decode 는 MBU 가 높고 MFU 가 낮은 게 정상이다. prefill 은 반대다.\n- memory-bound 작업인데 MBU 가 낮으면 GPU 밖에서 원인을 찾는다. ⭐️\n\n**식**\n\n| 지표 | 풀이 | 식 |\n|---|---|---|\n| MFU | Model FLOPS Utilization | 실제로 낸 초당 연산 ÷ GPU 의 최대 초당 연산 |\n| MBU | Model Bandwidth Utilization | 실제로 옮긴 초당 바이트 ÷ GPU 의 최대 대역폭 |\n\n**계산 예** (파라미터 70 억 개 모델, H100, 배치 1 decode)\n\n| 지표 | 계산 | 결과 |\n|---|---|---|\n| MBU | 스텝마다 가중치 14 GB × 초당 200 스텝 = 2.8 TB/s. 최대 3.35 TB/s 로 나눔 | 84 % |\n| MFU | 토큰당 140 억 FLOP × 초당 200 토큰 = 2.8 TFLOPS. 최대 990 TFLOPS 로 나눔 | 0.3 % |\n\n- 토큰당 FLOP: 가중치 70 억 개마다 곱셈 1 번 + 덧셈 1 번이라 140 억 FLOP 이다.\n- 스텝당 읽는 바이트: 가중치 70 억 개 × 2 바이트 (BF16) = 14 GB. decode 는 스텝마다 전부 읽는다.\n- MFU 가 0.3 % 라도 고장이 아니다. 메모리가 이미 84 % 로 한계라서 그렇다.\n- 배치를 키우면 MBU 는 그대로고 MFU 만 올라간다.\n\n**두 숫자를 같이 읽는 법**\n\n| MFU | MBU | 뜻 |\n|---|---|---|\n| 낮음 | 높음 | memory-bound 로 이미 한계. decode 의 정상 모습 |\n| 높음 | 낮음 | compute-bound 로 이미 한계. prefill 의 정상 모습 |\n| 낮음 | 낮음 | GPU 가 정말 놀고 있음. GPU 밖을 의심 |\n\n- \"MFU 가 낮다\" 만으로는 첫째 줄과 셋째 줄을 구분하지 못한다. 그래서 둘을 같이 본다.\n- nvidia-smi 의 GPU 사용률은 MFU 와 다른 숫자다. 커널이 돌고 있던 시간의 비율이다.\n\n| 지표 | decode 가 잘 돌 때 | CPU 가 늦을 때 |\n|---|---|---|\n| GPU 사용률 (nvidia-smi) | 높음 | 낮음 |\n| MFU | 낮음 | 낮음 |\n| MBU | 높음 | 낮음 |\n\n**예: decode 인데 MFU 2 %, MBU 30 %**\n\n- 셋째 줄이다. decode 가 잘 돌면 MBU 가 80 % 안팎이어야 하는데 30 % 다.\n- 자주 틀리는 곳: \"여유가 있으니 요청을 더 넣자\" 로 바로 가지 않는다.\n\n| 순서 | 할 일 |\n|---|---|\n| 1 | 왜 30 % 밖에 못 쓰는지 찾는다. 보통 CPU 쪽이 늦다 (커널 실행 요청 비용, Python 처리, 스케줄링) |\n| 2 | 고친다. CUDA graph (커널 실행 순서를 녹화해 한 번에 재생), kernel fusion (커널 여러 개를 하나로 합침) |\n| 3 | 그다음에 배치를 키워 MFU 를 올린다 |\n\n- 원인을 안 고치고 요청만 더 넣으면 CPU 가 늦는 문제는 그대로 남는다.\n- 같은 상황이 cuda_basics 카드 Follow-up 에 있다.\n\n## Follow-up: memory-bound 인 커널을 빠르게 하는 방법은 무엇뿐인가요?\n\n**30초 답**\n\n- 옮기는 바이트를 줄이는 것뿐이다.\n- 계산 횟수 (FLOP) 를 줄여도 빨라지지 않는다. ⭐️\n- 반대로 compute-bound 면 계산을 줄이거나 계산을 더 빠르게 해야 한다.\n\n**왜 계산을 줄여도 안 빨라지나**\n\n```text\nmemory-bound 일 때\n시간 = 옮기는 바이트 ÷ 대역폭\n```\n\n- 대역폭은 GPU 가 정해지면 못 바꾼다. 줄일 수 있는 건 바이트뿐이다.\n- 장난감 GPU (1 초에 10 바이트, 1 초에 100 FLOP) 로 보면:\n\n| 작업 | 옮기는 시간 | 계산 시간 | 실제 시간 |\n|---|---|---|---|\n| 200 바이트, 600 FLOP | 20 초 | 6 초 | 20 초 |\n| 계산을 절반으로 (300 FLOP) | 20 초 | 3 초 | 20 초 |\n| 바이트를 절반으로 (100 바이트) | 10 초 | 6 초 | 10 초 |\n\n- 느린 쪽이 전체 시간을 정한다. 계산을 줄이면 연산 장치가 노는 시간만 늘어난다.\n- 자주 틀리는 곳: \"횟수가 줄면 당연히 빨라진다\" 는 compute-bound 일 때만 맞다.\n\n**바이트를 줄이는 방법**\n\n- 일을 나누는 것이 아니다. 같은 일을 하면서 메모리를 덜 오가게 만드는 것이다.\n\n| 방법 | 바이트를 어떻게 줄이나 |\n|---|---|\n| 양자화 | 숫자 하나의 바이트 수를 줄임 (BF16 2 바이트 → FP8 1 바이트) |\n| kernel fusion | 커널 (GPU 함수) 을 합쳐 중간 결과를 HBM 에 쓰지 않음 |\n| 배치 키우기 | 한 번 읽은 가중치로 더 많은 요청을 계산. 요청 하나당 바이트가 줄어듦 |\n| 빠른 메모리에 올려두기 | 여러 번 쓸 데이터를 shared memory (블록 안의 작고 빠른 메모리) 에 두고 재사용 |\n\n**바운드별 처방**\n\n| 상태 | 예 | 빨라지는 것 | 소용없는 것 |\n|---|---|---|---|\n| memory-bound | decode | 옮기는 바이트 줄이기 | 계산 횟수 줄이기 |\n| compute-bound | prefill | 계산 횟수 줄이기, tensor core (작은 행렬곱 전용 회로) 와 낮은 정밀도로 계산 자체를 빠르게 | 바이트만 줄이기 |\n\n**면접용 한 줄**\n\n- \"이 커널은 memory-bound 라서 FLOP 을 줄이는 최적화는 의미가 없다. 옮기는 바이트를 줄여야 한다.\"\n",

   "md": "> THEORY · gpu · T2\n\n## 0. 먼저 알아둘 말\n\n| 말 | 뜻 |\n|---|---|\n| 프로파일링 | 프로그램이 어디에 시간을 쓰는지 재는 일 |\n| 커널 | GPU 에서 실행하는 함수 하나 |\n| launch | CPU 가 GPU 에 \"이 커널을 실행해라\" 고 요청하는 일. 요청마다 수 μs 가 듦 |\n| memory-bound · compute-bound | 메모리 대역폭이 한계인 상태 · 연산 능력이 한계인 상태 |\n| roofline | 커널이 위 둘 중 어느 쪽인지 판단하는 모델 (roofline 카드) |\n| nvidia-smi | GPU 사용률과 메모리 사용량을 보여 주는 기본 명령 |\n| nsys · ncu | NVIDIA 프로파일러 두 종류. 전체 타임라인용 · 커널 하나의 내부용 |\n| torch profiler | PyTorch 내장 프로파일러. Python 호출과 GPU 커널을 한 타임라인에 보여 줌 |\n| Kineto · CUPTI | torch profiler 가 내부에서 쓰는 수집 라이브러리 · 그 아래의 NVIDIA 계측 인터페이스 |\n| py-spy | Python 프로그램이 어느 함수에서 시간을 쓰는지 보여 주는 도구 |\n| 동기화 | CPU 가 GPU 작업이 끝날 때까지 멈춰 기다리는 것 |\n| NCCL · all-reduce | GPU 끼리 통신하는 라이브러리 · 여러 GPU 의 값을 합쳐 다시 나눠 주는 통신 |\n| TP | Tensor Parallelism. 모델 하나를 GPU 여러 장에 쪼개 올리는 것. GPU 간 통신이 생김 |\n| JIT | 실행 중에 코드를 컴파일하는 방식. 첫 호출이 느려지는 원인 |\n\n## Q1: 느린 추론 서버를 받았습니다. IO · CPU · GPU · 통신 중 어디가 병목인지 어떤 순서로 가르나요?\n\n**30초 답**\n\n- 먼저 GPU 사용률과 커널 사이의 빈 틈을 본다.\n- GPU 가 꽉 차 있으면 커널 안쪽을 본다 (연산이 한계인가, 메모리가 한계인가).\n- GPU 가 비어 있으면 CPU · IO · 통신 중 누가 GPU 를 기다리게 하는지 찾는다.\n\n**가르는 순서**\n\n```text\nGPU 사용률 (nvidia-smi)\n  ├─ 높음 (90 % 이상) → 커널 내부 문제\n  │      ncu 로 memory-bound 인지 compute-bound 인지 확인\n  └─ 낮음 → GPU 가 일감을 기다리는 중\n         ├─ CPU  : py-spy, torch profiler 의 CPU 트랙\n         ├─ 통신 : NCCL 커널 시간\n         └─ IO   : 디스크 · 네트워크 대기\n```\n\n| 의심 대상 | 보는 것 | 전형적 원인 |\n|---|---|---|\n| CPU | Python 함수가 길게 잡힘 | Python 오버헤드, 토큰화 |\n| 통신 | all-reduce 시간이 김 | TP 를 너무 크게 잡음, 느린 링크 |\n| IO | 디스크 · 네트워크 대기 | 모델 로드, KV 캐시 전송 |\n\n- 한 번에 가설 하나만 세운다.\n- 그 가설이 맞다면 보여야 할 숫자를 먼저 정한다.\n- 그 숫자가 안 나오면 다음 가설로 간다.\n\n## Q2: nsys 와 ncu 는 각각 무엇을 보여주나요?\n\n**30초 답**\n\n- nsys (Nsight Systems) 는 타임라인이다. 어느 커널이 언제 얼마나 돌았고, 그 사이에 뭐가 있었나.\n- ncu (Nsight Compute) 는 커널 하나의 내부다. 메모리 대역폭과 연산 유닛을 각각 몇 % 썼나.\n\n**자세히**\n\n| 도구 | 보여 주는 것 | 쓸 때 |\n|---|---|---|\n| nsys | 전체 타임라인, 커널별 시간, 커널 사이 틈 | 처음. 어느 커널이 시간을 먹는지 찾을 때 |\n| ncu | 커널 하나의 하드웨어 사용률 | nsys 로 좁힌 뒤. roofline 어디에 있는지 볼 때 |\n| torch profiler | Python 호출 + GPU 커널을 한 타임라인에 | 둘의 중간. Python 쪽 원인을 볼 때 |\n\n- ncu 는 커널을 여러 번 다시 실행해서 재므로 느리다. 그래서 nsys 로 후보를 먼저 좁힌다.\n\n## Q3: torch profiler 트레이스에서 'GPU idle 구간' 을 보면 무엇을 의심하나요?\n\n**30초 답**\n\n- CPU 가 다음 커널을 아직 안 넘겼다는 뜻이다.\n- 원인은 셋 중 하나다: Python 오버헤드, launch 비용, 동기화.\n\n**자세히**\n\n| 트레이스 모습 | 범인 |\n|---|---|\n| GPU 트랙에 커널이 띄엄띄엄, CPU 트랙에 Python 함수가 길게 | Python 오버헤드 |\n| 작은 커널이 아주 많고 사이마다 짧은 틈. CPU 트랙에는 launch 호출이 빽빽함 | launch 비용 (커널 하나를 실행 요청하는 데 5-10 μs) |\n| CPU 트랙도 비어 있음 | 동기화 (`cudaStreamSynchronize` 등) |\n\n- 동기화를 부르는 코드: `.item()`, `.cpu()`. GPU 값을 CPU 로 가져오려면 GPU 가 끝날 때까지 기다려야 한다.\n- `.item()` 하나가 스텝마다 CPU 를 세워 GPU 를 기다리게 한다.\n- 처방:\n  - CUDA graph (커널 여러 개를 한 번의 요청으로 실행. launch 비용 제거).\n  - 동기화 호출 제거.\n  - CPU 에서 하던 연산을 GPU 로 옮기기.\n\n## Q4: Python 오버헤드가 GPU 를 굶기는 상황을 어떻게 확인하나요?\n\n**30초 답**\n\n- 같은 모델을 배치 1 과 배치 32 로 돌려 본다.\n- 스텝 시간이 거의 같으면 CPU 가 한계다 (CPU-bound).\n- GPU 가 한계라면 배치에 비례해 시간이 늘어야 한다.\n\n**자세히**\n\n- 더 직접적인 방법: torch profiler 에서 CPU 시간 합과 GPU 시간 합을 비교한다.\n  - CPU 합이 더 길면 GPU 는 그 차이만큼 놀았다.\n- py-spy 로 Python 의 어디에서 시간이 가는지 본다.\n  - 흔히 나오는 것: 토큰화, 스케줄링, 메타데이터 생성.\n- vLLM 의 실제 사례 (이 측정에서 나온 개선):\n  - V1 이 EngineCore (스케줄링과 GPU 실행을 맡는 부분) 를 별도 프로세스로 분리했다.\n  - ModelRunner V2 가 스텝마다 하는 입력 준비를 줄였다.\n\n## Q5: 커널 하나의 시간을 정확히 재려면 무엇을 조심하나요? 첫 호출은 왜 느린가요?\n\n**30초 답**\n\n- GPU 는 비동기로 돈다. CPU 는 커널을 요청만 하고 끝나기를 기다리지 않고 다음 줄로 넘어간다.\n- 그래서 CPU 타이머로 그냥 재면 요청 (launch) 시간만 잰다.\n- 워밍업을 먼저 돌리고, CUDA event (GPU 쪽에 찍는 시간 표식) 나 동기화로 GPU 가 끝난 시점에서 잰다.\n- 여러 번 반복해 중앙값을 쓰고, 결과가 맞는지도 같이 확인한다.\n\n**자세히**\n\n| 함정 | 증상 | 처방 |\n|---|---|---|\n| 비동기 | `time.time()` 이 μs 단위로 비현실적으로 짧음 | 같은 스트림에 CUDA event 기록, 또는 전후 `torch.cuda.synchronize()` |\n| 첫 호출 | 첫 1 회만 수십 ms 에서 수 초 | 워밍업 (재기 전에 몇 번 미리 실행). 원인: JIT 컴파일 (Triton, torch.compile), 라이브러리 초기화 (cuBLAS: NVIDIA 행렬 연산 라이브러리), CUDA graph 캡처, 메모리 할당 |\n| L2 캐시 | 같은 데이터를 반복해 쓰면 GPU 의 L2 캐시에 남아 실제보다 빠르게 나옴 | 반복 사이 L2 비우기 (`triton.testing.do_bench` 가 해 줌) |\n| 편차 | 회마다 시간이 다름 (GPU 클럭 속도 변화, 발열) | 여러 번 돌려 중앙값과 p90 (느린 쪽 10 % 경계) 을 봄. 필요하면 클럭 고정 |\n| 정확성 | 일을 덜 한 커널이 가장 빠름 | 기준 구현과 출력 비교를 측정에 포함 |\n\n```python\nfor _ in range(10): f()                      # 워밍업\ns = torch.cuda.Event(enable_timing=True)\ne = torch.cuda.Event(enable_timing=True)\ns.record()\nfor _ in range(100): f()\ne.record(); torch.cuda.synchronize()\nms = s.elapsed_time(e) / 100\n```\n\n**CUDA event 대 Kineto (torch profiler)**\n\n| | CUDA event | Kineto |\n|---|---|---|\n| 재는 것 | 두 지점 사이 GPU 시간 하나 | 커널별 시간 + CPU 트랙 (CUPTI) |\n| 오버헤드 | 거의 없음 | 있음 |\n| 쓸 때 | 커널·구간 하나의 숫자 | 어디서 시간이 새는지 구조 파악 |\n\n## Follow-up: 실측 없이 '아마 메모리 때문' 이라 말하면 왜 안 되나요?\n\n**30초 답**\n\n- 메모리 · 연산 · CPU · 통신 중 무엇이 원인이든 증상은 똑같이 \"느리다\" 로 나온다.\n- 그래서 가설만으로 고르면 처방이 틀릴 확률이 높다.\n- 틀린 처방은 시간만 쓰고 효과가 없다.\n\n**자세히**\n\n- 내 사례: vLLM PR #54483 (roadmap-19, KV 복사 호출을 묶는 변경).\n- 리뷰어가 \"메모리가 느는데 최악은?\" 을 물었다. 추정 대신 실측으로 답했다.\n- 방법: `.pth` 파일 (Python 시작 때 자동 실행되는 파일) 로 계측 코드를 주입했다.\n- 잰 것: 순간 메모리, 호출 횟수, 출력이 바뀌지 않았는지.\n- 낸 숫자: \"512 토큰에서 8.0 배, 8K 토큰에서 1.4 배, 절대량은 10.5 MiB 이하\".\n- 그 숫자가 approve 를 받았다. ⭐️\n- \"측정했다\" 와 \"그럴 것 같다\" 는 면접에서도 다르게 들린다.\n\n---\n\n### 손댄 곳\n\n- roadmap-19 실측 (9/22): .pth 로 계측 주입, 순간 메모리·호출 횟수·출력 동일성 측정, 리뷰어 질문에 데이터로 답함 · vllm-study/01-issues/roadmap-19-h2d-copy-coalescing/experiment/\n",

   "md": "> THEORY · inference · T1  \n> 구현 → engine/vllm/paged_attention_block_manager.md\n\n---\n\n## 0-1. 개념: Q, K, V 가 뭔가\n\n\"가중치\" 라는 말이 두 가지로 쓰이니 먼저 가른다.\n\n| 용어 | 뭔가 | 바뀌나 |\n|---|---|---|\n| W_Q, W_K, W_V | 학습된 모델 파라미터. 행렬 3개 | 학습 끝나면 고정 |\n| w₁, w₂, w₃ | attention 점수를 softmax 한 값. \"얼마나 볼지\" 비율 | 토큰마다 새로 계산 |\n\n- 토큰마다 입력 벡터 x 에 세 행렬을 곱해 벡터 3개를 만든다\n  - q = x·W_Q, k = x·W_K, v = x·W_V\n- 도서관 비유\n\n```\nq (query)  = 지금 토큰이 던지는 질문      \"나 앞에 뭐가 있었지?\"\nk (key)    = 각 과거 토큰이 붙인 라벨     \"나는 주어야\" \"나는 목적어야\"\nv (value)  = 각 과거 토큰이 실제로 주는 내용\n```\n\n- 계산 순서\n  - 지금 토큰의 q 를 과거 토큰들의 k 와 하나씩 내적. 크면 연관성 높음\n  - 그 점수를 softmax 로 비율 w 로 바꿈. 합이 1\n  - 그 비율대로 v 를 섞음. 이게 attention 출력\n- \"가장 연관성 높은 하나를 고른다\" 가 아니라 **연관성 비율대로 과거 토큰들의 v 를 가중 평균**\n\n예시: \"나는 밥을 먹\" 에서 \"먹\" 토큰\n\n```\n\"먹\" 의 q₃:  \"누가 뭘 먹는 거지?\"\n\n        k₁ \"나는\"(주어)     k₂ \"밥을\"(목적어)     k₃ \"먹\"(자기)\n연관성      높음               높음                 낮음\nw           0.4                0.5                  0.1\n\n출력 = 0.4·v₁ + 0.5·v₂ + 0.1·v₃\n     = \"나는\" 과 \"밥을\" 의 정보를 많이 섞은 벡터\n```\n\n- KV 캐시와의 연결\n  - 비교 대상 k 와 섞을 재료 v 는 과거 토큰 것을 매번 다시 씀 → 이 둘만 저장\n  - q 는 지금 토큰이 던지는 질문이라 한 번 쓰고 버림\n\n---\n\n## 0-2. 예시: 숫자로 보는 KV 캐시\n\n- 설정: 레이어 1개, 헤드 1개, 벡터 길이 2.\n- \"라벨\" \"내용\" 은 비유고, 실체는 둘 다 숫자 벡터다.\n- 차이는 쓰임새 하나: k 는 q 와 **내적** 되고 (같은 자리끼리 곱해서 더함), v 는 점수대로 **더해진다**.\n\n상황 설정.\n\n| 구분 | 토큰 | 뭘 하나 |\n|---|---|---|\n| 이미 처리됨 (프롬프트) | \"나는\" \"밥을\" \"먹\" | 단계 1 - 3. k, v 를 만들어 캐시에 쌓음 |\n| 지금 생성 중 | \"는다\" (4번째) | 단계 4. 자기 q, k, v 만 새로 계산, 캐시의 k, v 로 attention |\n\n**단계 1. 토큰마다 k, v 가 나온다**\n\n```\nx₁ = [1, 0]   \"나는\"   →   k₁ = [2, 0]      v₁ = [5, 1]\nx₂ = [0, 1]   \"밥을\"   →   k₂ = [0, 2]      v₂ = [1, 7]\nx₃ = [1, 1]   \"먹\"     →   k₃ = [1, 1]      v₃ = [3, 3]     q₃ = [1, 3]\n```\n\n**단계 2. \"먹\" 의 attention**\n\n```\n점수:  q₃·k₁ = 1·2 + 3·0 = 2\n       q₃·k₂ = 1·0 + 3·2 = 6      ← \"밥을\" 쪽이 더 맞는다\n       q₃·k₃ = 1·1 + 3·1 = 4\n\nsoftmax → w ≈ (0.02, 0.86, 0.12)\n출력 = 0.02·v₁ + 0.86·v₂ + 0.12·v₃  ≈ 거의 v₂, \"밥을\" 의 정보\n```\n\n**단계 3. 여기까지 처리한 뒤 캐시에 남은 것**\n\n```\n   K = [ 2, 0 ]  ← k₁ \"나는\"      V = [ 5, 1 ]  ← v₁\n       [ 0, 2 ]  ← k₂ \"밥을\"          [ 1, 7 ]  ← v₂\n       [ 1, 1 ]  ← k₃ \"먹\"            [ 3, 3 ]  ← v₃\n\n   q₁ q₂ q₃ 는 없음. 쓰고 버렸음.\n```\n\n숫자 12개. 이게 캐시 전부다.\n\n**단계 4. 4번째 토큰 \"는다\" 생성**\n\n```\nx₄ = [1, 1]  ──► 새로 계산:  q₄ = [2, 1]   k₄ = [1, 2]   v₄ = [0, 4]\n\n캐시에 k₄, v₄ 한 행씩만 추가\n\n   K = [ 2, 0 ]      V = [ 5, 1 ]\n       [ 0, 2 ]          [ 1, 7 ]\n       [ 1, 1 ]          [ 3, 3 ]\n       [ 1, 2 ] ◄new     [ 0, 4 ] ◄new\n\n점수 = q₄ 와 K 의 각 행 내적 = [4, 2, 3, 4]\nsoftmax → w ≈ [0.37, 0.05, 0.14, 0.37]\n출력 = Σ wᵢ · vᵢ   (V 의 네 행을 그 비율로 섞음)\n```\n\n**단계 5. 캐시가 없었다면**\n\n```\nx₁ ──► k₁ v₁   ┐\nx₂ ──► k₂ v₂   │  이 6개를 또 계산. 결과는 단계 3 의 표와 똑같음\nx₃ ──► k₃ v₃   ┘\nx₄ ──► q₄ k₄ v₄\n```\n\n- 4번째 토큰에서 벡터 6개를 아낌. 100번째에서는 198개\n- 안 아끼면 총량 O(n²)\n- 정리: KV 캐시 = **지금까지 토큰들의 k 행, v 행을 두 행렬에 쌓아둔 것**. 새 토큰은 자기 k, v 한 행씩만 붙임\n- 위는 레이어 1개 기준. 레이어 32개면 \"나는\" 하나에 k₁ 이 32개, v₁ 이 32개 (레이어마다 x₁ 이 다른 벡터로 변해 들어감)\n\n---\n\n## Q1: KV 캐시는 왜 필요한가요? 없으면 토큰 하나 생성에 얼마가 드나요?\n\n**30초 답**\n\n- 이전 토큰들의 k 와 v 는 바뀌지 않는다. 그래서 저장해 두고 다시 쓴다.\n- 새 토큰은 자기 q, k, v 만 계산한다. k 와 v 는 캐시에 한 줄씩 붙이고, q 는 한 번 쓰고 버린다.\n- 한 줄 요약: 계산을 메모리로 바꾼 것이다. ⭐️\n\n**새 토큰 하나가 들어오면**\n\n| 순서 | 하는 일 |\n|---|---|\n| 1 | 새 토큰의 벡터 x 에서 q, k, v 를 만든다 |\n| 2 | 새 k, v 를 캐시 맨 끝에 한 줄씩 붙인다 |\n| 3 | 새 q 를 캐시의 모든 k 와 비교해 점수를 낸다 |\n| 4 | 점수대로 캐시의 v 들을 섞는다 |\n| 5 | q 는 버린다 |\n\n- 자주 틀리는 곳 1: q 는 입력 토큰 자체가 아니다. q, k, v 셋 다 같은 x 에서 같이 만들어진다.\n- 자주 틀리는 곳 2: q 가 캐시를 \"업데이트\" 하지 않는다. 저장된 k, v 는 절대 안 바뀌고, 새 줄이 붙을 뿐이다.\n- q 를 버려도 되는 이유: q 는 지금 토큰이 던지는 질문이라 그 차례에만 쓴다. k 와 v 는 뒤에 오는 모든 토큰이 계속 참고한다.\n\n**prefill 과 decode**\n\n| 단계 | 모델에 넣는 것 | 모든 층 통과 | 점수 표 | 나오는 것 |\n|---|---|---|---|---|\n| prefill | 입력 토큰 n 개 전부, 한 번에 | 1 번 | n × n | 토큰 n 개의 k, v (캐시에 저장) + 첫 출력 토큰 |\n| decode 한 스텝 | 방금 만든 토큰 1 개 | 1 번 | 1 × n | 그 토큰의 k, v (캐시에 추가) + 다음 토큰 1 개 |\n\n- 교과서의 QKᵀ 는 prefill 모양이다. decode 에서는 Q 가 지금 토큰의 q 한 줄이다.\n- 어느 쪽이든 q 는 점수를 내는 데만 쓰이고 저장되지 않는다.\n- 출력 300 토큰이면 모든 층 통과는 prefill 1 번 + decode 약 300 번이다.\n\n| 예: \"나는 밥을\" 다음 | 넣는 것 | 나오는 것 |\n|---|---|---|\n| prefill | \"나는\", \"밥을\" | \"먹\" |\n| decode 1 | \"먹\" | \"는다\" |\n| decode 2 | \"는다\" | \".\" |\n\n**캐시가 없으면**\n\n| | 100 번째 토큰을 만들 때 | n 개를 다 만들 때 총량 |\n|---|---|---|\n| 캐시 없음 | 토큰 100 개를 모든 층에 다시 통과 | 1 + 2 + … + n. n² 에 비례 |\n| 캐시 있음 | 새 토큰 1 개만 통과 + 캐시 읽기 | n 에 비례 |\n\n---\n\n## Q2: KV 캐시 크기 공식을 써보세요. 어떤 변수가 지배하나요?\n\n**30초 답**\n\n- 캐시 전체 = 토큰당 크기 × 토큰 수 × 배치.\n- 토큰당 크기는 모델을 정하면 고정이다.\n- 지배하는 건 토큰 수 × 배치다. 요청이 길어지고 많아질수록 커진다. ⭐️\n\n**공식**\n\n```text\n캐시 전체 = 토큰당 크기 × 토큰 수 × 배치\n\n토큰당 크기 = 2 × 층 수 × KV 헤드 수\n              × 헤드 차원 × 숫자당 바이트\n```\n\n| 곱하는 것 | 뜻 | Llama 3 8B |\n|---|---|---|\n| 2 | K 와 V 두 벌 | 2 |\n| 층 수 (L) | 층마다 k, v 가 따로 생김 | 32 |\n| KV 헤드 수 (n_kv_heads) | 한 층 안에서 k, v 를 몇 벌 만드나 | 8 |\n| 헤드 차원 (head_dim) | 벡터 하나의 숫자 개수 | 128 |\n| 숫자당 바이트 | FP32 4, BF16 2, FP8 1 | 2 |\n| 토큰 수 (seq) | 지금까지 토큰 수. 프롬프트 + 생성 모두 | |\n| 배치 (batch) | 동시에 처리 중인 요청 수 | |\n\n- Llama 3 8B 의 토큰당 크기: 2 × 32 × 8 × 128 × 2 = 약 13 만 바이트 = 0.13 MB.\n- 층 = 토큰 하나를 뽑는 파이프라인의 단계. 토큰을 32 번 만드는 게 아니다.\n- 헤드 = 한 층 안에서 동시에 보는 눈 여러 개.\n\n**왜 배치를 곱하나** (자주 빠뜨리는 곳)\n\n- KV 캐시는 요청마다 따로 있다. A 의 대화와 B 의 대화는 토큰이 달라 서로 못 쓴다.\n\n| | 요청끼리 공유하나 | 배치가 커지면 |\n|---|---|---|\n| 가중치 | 공유. 한 벌 | 그대로 |\n| KV 캐시 | 따로. 요청마다 한 벌 | 배치만큼 늘어남 |\n\n**계산 예** (Llama 3 8B)\n\n| 상황 | 계산 | 크기 |\n|---|---|---|\n| 요청 1 개, 8,000 토큰 | 0.13 MB × 8,000 | 약 1 GB |\n| 요청 50 개, 각 8,000 토큰 | 1 GB × 50 | 약 50 GB |\n\n- 가중치는 16 GB 인데 캐시는 50 GB 다.\n\n---\n\n## Q3: 7B · 32 layer · 4096 컨텍스트 · BF16 · batch 1 의 KV 캐시는 대략 몇 GB 인가요?\n\n**30초 답**\n\n- 약 2 GB.\n\n- Llama-2-7B: L=32, n_kv_heads=32, head_dim=128, BF16 2 바이트\n  - MHA (Multi-Head Attention, 헤드마다 k v 를 따로 갖는 기본 구조) 라서 n_kv_heads 가 헤드 수 32 와 같다\n- 토큰당 = 2 × 32 × 32 × 128 × 2 = 524,288 B = **512 KB**\n- 4096 토큰 → 512 KB × 4096 = **2 GB**\n- 비교: 가중치 14 GB 에 요청 하나가 2 GB 추가\n  - 배치 8 이면 16 GB 로 가중치보다 커짐\n\n---\n\n## Q4: KV 캐시를 줄이는 방법 4가지와 각각의 대가는?\n\n**30초 답**\n\n- 헤드를 줄인다 (GQA · MLA).\n- 숫자당 바이트를 줄인다 (양자화).\n- 겹치는 부분을 공유한다 (prefix caching).\n- 못 줄이면 GPU 밖으로 내린다 (offload).\n\n**외우는 법**\n\n- 공식의 값을 하나씩 짚으면 방법이 나온다.\n\n| 공식의 값 | 방법 |\n|---|---|\n| KV 헤드 수 | GQA |\n| 숫자당 바이트 | KV 양자화 |\n| 토큰 수 × 배치 | prefix caching |\n| (못 줄임) | offload |\n| 층 수 | 서빙에서는 안 씀. 층을 빼면 다른 모델이 된다 |\n\n**자세히**\n\n| 방법 | 뭘 하나 | 줄이는 값 | 대가 |\n|---|---|---|---|\n| GQA / MQA (Grouped-Query · Multi-Query Attention) | 헤드 32 개가 k, v 를 각자 만들지 않고 몇 개가 하나를 공유. Llama 3 는 헤드 32 개가 k, v 8 벌만 씀 | KV 헤드 수 (32 → 8, 4 분의 1) | 품질 소폭 저하, 모델을 만들 때 정해야 함 |\n| MLA (Multi-head Latent Attention, DeepSeek) | k, v 를 작은 벡터 (latent) 로 눌러 저장하고 쓸 때 복원 | KV 헤드 수 × 헤드 차원 묶음 | 복원 연산 추가, 전용 커널 |\n| KV 양자화 (FP8 / INT8) | 숫자를 BF16 대신 8 비트로 저장 | 숫자당 바이트 (2 → 1) | 미세한 품질 저하, 스케일 관리 |\n| Prefix caching | 요청 여러 개가 같은 앞부분 (시스템 프롬프트) 을 공유하면 그 k, v 를 한 번만 저장 | 토큰 수 × 배치 합계 (공유 구간은 1 벌) | 해시 관리, 앞부분이 안 겹치면 이득 없음 |\n| Offload (CPU / SSD) | GPU 메모리 대신 CPU 메모리나 SSD 에 둠 | 없음. 두는 곳만 바꿈 | 다시 올릴 때 PCIe (CPU 메모리와 GPU 를 잇는 느린 통로) 대역폭 |\n\n---\n\n## Follow-up: 긴 컨텍스트에서 가중치보다 KV 캐시가 더 큰 메모리를 먹는 지점은 어디인가요?\n\n**30초 답**\n\n- GPU 가 동시에 들고 있는 총 토큰 수 (토큰 수 × 배치) 가 \"가중치 크기 ÷ 토큰당 KV 크기\" 를 넘는 순간부터다.\n\n**계산**\n\n| 모델 | 가중치 | 토큰당 KV | 넘는 지점 |\n|---|---|---|---|\n| Llama 3 8B (GQA) | 16 GB | 0.13 MB | 16,000 MB ÷ 0.13 MB = 약 12 만 토큰 |\n| Llama 2 7B (GQA 없음) | 14 GB | 0.5 MB | 14,000 MB ÷ 0.5 MB = 약 2.8 만 토큰 |\n\n- 8B 예: 8,000 토큰짜리 요청 15 개면 캐시가 가중치와 같아진다.\n- 7B 예: 4,000 토큰짜리 요청 7 개, 또는 요청 하나가 2.8 만 토큰이면 같아진다.\n- GQA 유무로 지점이 4 배쯤 차이 난다.\n- 결론: 긴 컨텍스트 서빙은 모델 크기보다 KV 메모리 싸움이다.\n",

   "md": "> THEORY · inference · T1  \n> 구현 → engine/vllm/scheduler.md\n\n## 0. 먼저 알아둘 말\n\n| 말 | 뜻 |\n|---|---|\n| 배치 | GPU 에서 한 번에 같이 처리하는 요청 묶음 |\n| prefill | 프롬프트 토큰 전체를 한 번에 처리하는 단계. 첫 토큰이 나오기 전까지 |\n| decode | 토큰을 하나씩 생성하는 단계 |\n| 스텝 (iteration) | 모델을 한 번 통과시키는 것. decode 스텝 한 번에 요청마다 토큰 1 개가 나옴 |\n| KV 캐시 | 지나간 토큰들의 k, v 벡터를 저장해 둔 것. 요청마다 따로 있고, 길어질수록 커짐 |\n| 블록 | KV 캐시를 담는 고정 크기 메모리 조각 (vLLM 은 토큰 16 개분) |\n| ITL | Inter-Token Latency. 토큰과 다음 토큰 사이 간격 |\n| preemption | 진행 중인 요청을 멈추고 자원을 뺏는 것 |\n| PCIe | CPU 메모리와 GPU 를 잇는 통로. GPU 내부 메모리보다 훨씬 느림 |\n\n## Q1: static batching 은 GPU 를 왜 낭비하나요? 구체적 예로 설명해보세요.\n\n**30초 답**\n\n- static batching 은 배치 안의 모든 요청이 끝날 때까지 기다린다.\n- 짧은 요청이 먼저 끝나도 그 자리가 빈 채로 돈다.\n\n**예**\n\n- 요청 8 개를 묶었다. 하나는 2000 토큰, 일곱은 100 토큰을 생성한다.\n\n| 구간 | 일하는 자리 | 효율 |\n|---|---|---|\n| 처음 100 스텝 | 8 / 8 | 100 % |\n| 나머지 1900 스텝 | 1 / 8 | 12.5 % |\n\n- 빈 일곱 자리에 새 요청을 못 넣는다.\n- GPU 는 바쁘게 도는데 쓸모 있는 토큰은 거의 안 나온다.\n\n## Q2: continuous(iteration-level) batching 은 무엇을 바꿨나요?\n\n**30초 답**\n\n- 스케줄링 단위를 \"요청\" 에서 \"스텝\" 으로 내렸다.\n- 매 스텝마다 끝난 요청을 빼고 대기 중인 요청을 넣는다.\n\n**자세히**\n\n- 빈 자리가 생기는 순간 채워지므로 배치가 항상 꽉 찬다.\n- Orca 논문 (OSDI '22) 이 제안했다.\n- vLLM 이 PagedAttention (KV 캐시를 블록 단위로 관리하는 방식) 과 함께 기본 동작으로 만들었다.\n- static batching 대비 처리량이 수 배에서 열 배 이상 는다고 보고된다. 수치는 워크로드에 따라 크게 다르다. ⭐️\n\n## Q3: chunked prefill 은 어떤 문제를 풀나요? 긴 프롬프트 하나가 들어오면 decode 에 무슨 일이 생기나요?\n\n**30초 답**\n\n- 긴 prefill 하나가 스텝 하나를 통째로 길게 만든다.\n- 그동안 같은 배치의 decode 요청들은 토큰을 못 받는다 (ITL 이 튄다).\n- chunked prefill 은 긴 프롬프트를 조각으로 잘라 여러 스텝에 나눠 넣는다.\n\n**자세히**\n\n- prefill 은 토큰 N 개를 한 번에 처리한다. N 이 크면 그 스텝이 길어진다.\n- 스텝이 끝나야 decode 요청들이 다음 토큰을 받는다. 그래서 스트리밍이 잠깐 멈춘 것처럼 보인다.\n- 넣는 순서: 스텝당 토큰 예산 (vLLM 의 `max_num_batched_tokens`) 안에서\n  1. decode 토큰을 먼저 채운다.\n  2. 남는 자리에 prefill 조각을 넣는다.\n\n## Q4: 메모리가 모자라면 요청을 어떻게 처리하나요? (preemption: recompute vs swap)\n\n**30초 답**\n\n- 우선순위 낮은 요청을 멈추고 그 KV 블록을 회수한다 (preempt).\n- 그 요청은 대기열로 돌아가고, 나중에 처음부터 다시 계산한다 (recompute).\n\n**자세히**\n\n- KV 캐시는 요청이 끝나야 해제된다. 새 요청이 계속 들어오면 블록이 모자란다.\n- 이때 가장 늦게 온 요청을 멈추고 블록을 회수한다.\n\n| 되살리는 방법 | 하는 일 | 대가 |\n|---|---|---|\n| recompute | KV 를 버리고 prefill 부터 다시 계산 | 다시 계산하는 GPU 시간 |\n| swap | KV 를 CPU 메모리로 내렸다가 다시 올림 | PCIe 왕복 시간, 구현 복잡 |\n\n- vLLM V1 은 recompute 만 쓴다. PCIe 왕복보다 다시 계산하는 게 빠르고 단순해서다.\n\n## Follow-up: continuous batching 이 가능해진 전제 조건은 무엇인가요? (KV 캐시 관리와의 관계)\n\n**30초 답**\n\n- KV 캐시를 요청마다 큰 연속 메모리로 미리 잡지 않아야 한다.\n- 블록 단위로 그때그때 할당해야, 끝난 요청의 자리를 바로 새 요청에 줄 수 있다.\n\n**자세히**\n\n| 할당 방식 | 동작 | 결과 |\n|---|---|---|\n| 정적 할당 | 요청의 최대 길이만큼 미리 예약 | 빈 자리가 생겨도 새 요청을 못 넣음 |\n| PagedAttention | 블록 단위로 필요할 때 할당 | 끝난 요청의 블록을 바로 재사용 |\n\n- continuous batching 과 PagedAttention 은 한 쌍이다.\n",

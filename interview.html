<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interview Flashcards</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --card-back: #f8faff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 2px 8px rgba(15,23,42,0.07);
      --shadow-md: 0 8px 28px rgba(15,23,42,0.11);
      --radius: 14px;
      --t: #2563eb;
      --p: #ea580c;
      --l: #16a34a;
      --g: #9333ea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(900px 420px at 8% 4%, #dbeafe 0%, transparent 55%),
        radial-gradient(900px 420px at 95% 2%, #fef3c7 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      gap: 14px;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 20px;
      box-shadow: var(--shadow-sm);
    }

    h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }

    .mode-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
    }

    .mode-btn {
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      background: #f8fafc;
      color: var(--muted);
      transition: background 0.15s, color 0.15s;
    }

    .mode-btn.active { background: var(--text); color: #fff; }

    /* ── Filter bar ── */
    .filter-bar {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .cat-btn {
      padding: 5px 14px;
      font-size: 13px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      cursor: pointer;
      background: #fff;
      color: var(--muted);
      font-weight: 500;
      transition: all 0.15s;
    }

    .cat-btn:hover { border-color: #94a3b8; }
    .cat-btn.active { border-color: transparent; color: #fff; }
    .cat-btn[data-cat="All"].active            { background: var(--text); }
    .cat-btn[data-cat="Teamwork"].active       { background: var(--t); }
    .cat-btn[data-cat="Problem Solving"].active { background: var(--p); }
    .cat-btn[data-cat="Leadership"].active     { background: var(--l); }
    .cat-btn[data-cat="Growth"].active         { background: var(--g); }

    .star-toggle {
      margin-left: auto;
      padding: 5px 14px;
      font-size: 13px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      cursor: pointer;
      background: #fff;
      color: var(--muted);
      font-weight: 500;
      transition: all 0.15s;
    }

    .star-toggle.active {
      background: #fefce8;
      border-color: #fbbf24;
      color: #92400e;
    }

    /* ── Card ── */
    .card-area { width: 100%; max-width: 820px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 5px solid #cbd5e1;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 28px 32px;
      min-height: 320px;
      cursor: pointer;
      transition: box-shadow 0.2s, border-top-color 0.25s, background 0.25s;
      position: relative;
    }

    .card:hover { box-shadow: 0 12px 36px rgba(15,23,42,0.14); }
    .card[data-cat="Teamwork"]        { border-top-color: var(--t); }
    .card[data-cat="Problem Solving"] { border-top-color: var(--p); }
    .card[data-cat="Leadership"]      { border-top-color: var(--l); }
    .card[data-cat="Growth"]          { border-top-color: var(--g); }
    .card.back-face                   { background: var(--card-back); }

    /* ── Faces ── */
    .face { display: none; }
    .face.visible { display: block; animation: fadeUp 0.22s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Card header ── */
    .card-hdr {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 18px;
    }

    .card-id {
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      padding: 2px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f8fafc;
      white-space: nowrap;
    }

    .card-title {
      font-weight: 700;
      font-size: 17px;
      line-height: 1.35;
      flex: 1;
      min-width: 200px;
    }

    /* ── Badges ── */
    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
      align-items: center;
    }

    .lp-pill {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: #ede9fe;
      color: #5b21b6;
      border: 1px solid #ddd6fe;
    }

    .time-pill {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    /* ── Section labels ── */
    .sec-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .sec-text {
      font-size: 15px;
      line-height: 1.75;
      color: var(--text);
    }

    /* ── Divider ── */
    .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

    /* ── Action bullets ── */
    .action-list { list-style: none; display: flex; flex-direction: column; gap: 11px; }

    .action-list li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 15px;
      line-height: 1.65;
    }

    .action-list li::before {
      content: "•";
      color: #2563eb;
      font-size: 17px;
      font-weight: 700;
      flex-shrink: 0;
      line-height: 1.5;
    }

    /* ── Result box ── */
    .result-box {
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-left: 4px solid #16a34a;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 15px;
      line-height: 1.75;
    }

    /* ── Follow-up ── */
    .fq-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      margin-top: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .fq-toggle:hover { background: #f1f5f9; border-color: #94a3b8; color: var(--text); }
    .fq-toggle.open  { border-color: #94a3b8; color: var(--text); }

    .fq-content { display: none; margin-top: 14px; }
    .fq-content.open { display: block; animation: fadeUp 0.2s ease; }

    .fq-item { margin-bottom: 14px; }
    .fq-item:last-child { margin-bottom: 0; }

    .fq-q {
      font-size: 13.5px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 5px;
    }

    .fq-q::before { content: "Q  "; font-family: monospace; color: #94a3b8; }

    .fq-a {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text);
      padding-left: 22px;
    }

    /* ── Korean back sections ── */
    .kor-sections { display: flex; flex-direction: column; gap: 10px; }

    .kor-sec {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 8px;
      align-items: start;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
    }

    .kor-sec-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #475569;
      padding-top: 1px;
    }

    .kor-sec-text { font-size: 14px; line-height: 1.65; }

    /* ── STAR summary (English front) ── */
    .star-summary {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .star-row {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 10px;
      align-items: start;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #f8fafc;
    }

    .star-key {
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      font-size: 12px;
      font-weight: 700;
      color: #2563eb;
      padding-top: 1px;
      letter-spacing: 0.3px;
    }

    .star-val {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
    }

    .star-mini-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .star-mini-bullets li {
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text);
      display: flex;
      gap: 7px;
      align-items: flex-start;
    }

    .star-mini-bullets li::before {
      content: "•";
      color: #2563eb;
      font-weight: 700;
      flex-shrink: 0;
      line-height: 1.4;
    }

    /* ── Flip hint ── */
    .flip-hint {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 22px;
    }

    /* ── Nav bar ── */
    .nav-bar {
      width: 100%;
      max-width: 820px;
      display: flex;
      gap: 9px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 9px 20px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .nav-btn:hover { background: #f1f5f9; border-color: #94a3b8; }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .nav-btn.primary { background: var(--text); color: #fff; border-color: transparent; }
    .nav-btn.primary:hover { background: #1e293b; }

    /* ── Progress ── */
    .progress-area {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .progress-counter { font-size: 13px; color: var(--muted); }
    .progress-hint    { font-size: 12px; color: #94a3b8; }

    .progress-wrap {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #2563eb;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 70px 20px; color: var(--muted); }
    .empty p     { font-size: 16px; margin-bottom: 8px; }
    .empty small { font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>

  <header>
    <h1>Interview Flashcards</h1>
    <div class="mode-toggle">
      <button class="mode-btn"        id="btnKor" onclick="setMode('kor')">&#127472;&#127479; 한국어 STAR</button>
      <button class="mode-btn active" id="btnEng" onclick="setMode('eng')">&#127482;&#127480; English Speech</button>
    </div>
  </header>

  <div class="filter-bar">
    <button class="cat-btn active" data-cat="All"             onclick="setCat('All')">All</button>
    <button class="cat-btn"        data-cat="Teamwork"        onclick="setCat('Teamwork')">Teamwork</button>
    <button class="cat-btn"        data-cat="Problem Solving" onclick="setCat('Problem Solving')">Problem Solving</button>
    <button class="cat-btn"        data-cat="Leadership"      onclick="setCat('Leadership')">Leadership</button>
    <button class="cat-btn"        data-cat="Growth"          onclick="setCat('Growth')">Growth</button>
    <button class="star-toggle" id="starToggle" onclick="toggleStar()">&#11088; Starred Only</button>
  </div>

  <div class="card-area">
    <div class="card" id="mainCard" data-cat="Teamwork" onclick="flipCard()">
      <div class="face visible" id="frontFace"></div>
      <div class="face"         id="backFace"></div>
    </div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" id="btnPrev" onclick="navigate(-1)">&#8592; Prev</button>
    <button class="nav-btn primary"      onclick="navigate(1)">Next &#8594;</button>
    <button class="nav-btn"              onclick="goRandom()">&#128256; Random</button>
    <button class="nav-btn"              onclick="flipCard()">&#8617; Flip</button>
  </div>

  <div class="progress-area">
    <div class="progress-row">
      <span class="progress-counter" id="counter">1 / 12</span>
      <span class="progress-hint">&#8592; &#8594; navigate &nbsp;&middot;&nbsp; &#8595; back &nbsp;&middot;&nbsp; &#8593; front &nbsp;&middot;&nbsp; Space toggle</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-fill" id="progressFill" style="width:8.33%"></div>
    </div>
  </div>

  <script>
  /* ==========================================================
     DATA — Korean STAR (12 cards)
  ========================================================== */
  const korCards = [
    {
      id:"T1", star:true, cat:"Teamwork",
      title:"Samsung / Google: Issue Tracker 협업",
      ctx:"Samsung·Google Android 협업. 원인 불명 Galaxy 버그를 Pixel에서도 재현 확인 후 Google Issue Tracker에서 공동 분석.",
      sections:[
        {label:"Conflict",  text:"OS는 같지만 버전·환경이 달라 log mismatch, 책임 소재 불명확."},
        {label:"Action",    text:"dumpstate/trace로 repro test case 작성, Pixel 재현 확인, Issue Tracker에 공동 분석 thread 운영, root cause narrowing."},
        {label:"Outcome",   text:"10건 이상 Issue Tracker 등재, 여러 건 upstream fix → Galaxy 빌드 통합 개선."},
        {label:"Strength",  text:"precise cross-team communication, 외부 협력사와 async 협업 구조."}

        {label:"Outcome",    text:"PR round-trip 3 → 1~2로 감소, 승인 시간 절반. 이후 모든 cross-team 프로젝트에 적용."},
        {label:"Strength",   text:"피드백 수용 후 관점 전환 — 보고 vs. 공유 인식의 차이 학습."}

    {

    {
      id:"P1", star:true, cat:"Problem Solving",

        {label:"Problem",  text:"cold start 시 ART 초기화 비용 집중. 실행 전 선행 작업 필요, 리소스·안정성 리스크."},

    },
    {
      id:"L2", star:true, cat:"Leadership",
      title:"한국–Russia 팀 조율",
      ctx:"ART 모듈을 한국(유지보수)·Russia(신규 기능) 양 팀이 공동 개발. 6시간 시차.",
      sections:[
        {label:"Problem",  text:"원격 팀 간 일정·이슈·우선순위 공유 구조 부재."},
        {label:"Action",   text:"Russia 팀 주요 피처 코드 리뷰, 고객 이슈 Jira 직접 등록, 퇴근 전 async handoff 작성 → overnight 진행."},

        {label:"Strength", text:"cross-geo coordination, informal tech lead, 정보 흐름 책임."}
      ]
    },
    {
      id:"L3", star:false, cat:"Leadership",
      title:"ART 메모리·성능 옵션 문서화",
      ctx:"ART 설정 반복 문의 (월 5건+). 선택 기준 없어 매번 full walkthrough 필요.",
      sections:[
        {label:"Problem",  text:"메모리·성능 trade-off 기준 없음, 반복 문의 대응 비용 높음."},
        {label:"Action",   text:"ART 옵션 문서화: 각 옵션 설명, trade-off, 시나리오별 선택 기준, 패치 가이드 포함."},

        {label:"Strength", text:"반복 문제 구조화, 결정을 쉽게 하는 기준 제공."}
      ]
    },
    {
      id:"L1", star:true, cat:"Leadership",
      title:"Dumpstate 리뷰 보드·품질 기준",
      ctx:"공용 Dumpstate 모듈에 여러 팀이 무분별 추가 → 유지보수 어려워짐.",

  /* ==========================================================
     STATE
  ========================================================== */
  var mode       = "eng";
  var activeCat  = "All";
  var starOnly   = false;
  var isFlipped  = false;
  var currentIdx = 0;
  var filtered   = [];

  function getPool() {
    var data = mode === "kor" ? korCards : engCards;
    var indices = [];
    for (var i = 0; i < data.length; i++) {
      if (activeCat !== "All" && data[i].cat !== activeCat) continue;
      if (starOnly && !data[i].star) continue;
      indices.push(i);
    }
    return {data: data, indices: indices};
  }

  /* ==========================================================
     CONTROLS
  ========================================================== */
  function setMode(m) {
    mode = m; isFlipped = false;
    document.getElementById("btnKor").classList.toggle("active", m === "kor");
    document.getElementById("btnEng").classList.toggle("active", m === "eng");
    refresh(true);
  }

  function setCat(cat) {
    activeCat = cat; isFlipped = false;
    document.querySelectorAll(".cat-btn").forEach(function(b) {
      b.classList.toggle("active", b.dataset.cat === cat);
    });
    refresh(true);
  }

  function toggleStar() {
    starOnly = !starOnly; isFlipped = false;
    document.getElementById("starToggle").classList.toggle("active", starOnly);
    refresh(true);
  }

  function flipCard() {
    if (!filtered.length) return;
    isFlipped = !isFlipped;
    renderFaces();
  }

  function navigate(dir) {
    if (!filtered.length) return;
    currentIdx = (currentIdx + dir + filtered.length) % filtered.length;
    isFlipped = false;
    renderCard();
  }

  function goRandom() {
    if (!filtered.length) return;
    var next = currentIdx;
    if (filtered.length > 1) {
      while (next === currentIdx) next = Math.floor(Math.random() * filtered.length);
    }
    currentIdx = next; isFlipped = false;
    renderCard();
  }

  /* ==========================================================
     RENDER
  ========================================================== */
  function refresh(resetIdx) {
    var pool = getPool();
    filtered = pool.indices;
    if (resetIdx) currentIdx = 0;
    renderCard();
  }

  function renderCard() {
    var pool      = getPool();
    var card      = document.getElementById("mainCard");
    var counter   = document.getElementById("counter");
    var fill      = document.getElementById("progressFill");
    var btnPrev   = document.getElementById("btnPrev");
    var frontFace = document.getElementById("frontFace");
    var backFace  = document.getElementById("backFace");

    if (!filtered.length) {
      card.setAttribute("data-cat","");
      card.classList.remove("back-face");
      frontFace.className = "face visible";
      backFace.className  = "face";
      frontFace.innerHTML = "<div class=\"empty\"><p>No cards match the current filter.</p><small>Try removing the &#11088; filter or selecting a different category.</small></div>";
      backFace.innerHTML  = "";
      counter.textContent = "0 / 0";
      fill.style.width    = "0%";
      btnPrev.disabled    = true;
      return;
    }

    if (currentIdx >= filtered.length) currentIdx = 0;
    var c = pool.data[filtered[currentIdx]];

    card.setAttribute("data-cat", c.cat);
    card.classList.toggle("back-face", isFlipped);
    counter.textContent = (currentIdx + 1) + " / " + filtered.length;
    fill.style.width    = ((currentIdx + 1) / filtered.length * 100) + "%";
    btnPrev.disabled    = filtered.length <= 1;

    frontFace.className = isFlipped ? "face" : "face visible";
    backFace.className  = isFlipped ? "face visible" : "face";

    if (!isFlipped) { frontFace.innerHTML = buildFront(c); }
    else            { backFace.innerHTML  = buildBack(c);  }
  }

  function renderFaces() {
    var pool = getPool();
    if (!filtered.length) return;
    var c    = pool.data[filtered[currentIdx]];
    var card = document.getElementById("mainCard");
    var fF   = document.getElementById("frontFace");
    var bF   = document.getElementById("backFace");

    card.classList.toggle("back-face", isFlipped);
    fF.className = isFlipped ? "face" : "face visible";
    bF.className = isFlipped ? "face visible" : "face";

    if (!isFlipped) { fF.innerHTML = buildFront(c); }
    else            { bF.innerHTML = buildBack(c);  }
  }

  /* ── front ── */
  function buildFront(c) {
    var star = c.star ? " &#11088;" : "";
    if (mode === "kor") {
      return "<div class=\"card-hdr\"><span class=\"card-id\">" + c.id + "</span>"
           + "<span class=\"card-title\">" + esc(c.title) + star + "</span></div>"
           + "<span class=\"sec-label\">Context</span>"
           + "<p class=\"sec-text\">" + esc(c.ctx) + "</p>"
           + "<p class=\"flip-hint\">&#128432; 카드 클릭 또는 Flip 버튼으로 뒤집기</p>";
    } else {
      // Summary: first sentence of S/T, first 8 words per action, first sentence of R
      var pills    = c.lp.map(function(l){ return "<span class=\"lp-pill\">" + esc(l) + "</span>"; }).join("");
      var stSnip   = esc(firstSentence(c.st));
      var aBullets = c.actions.map(function(a){
        return "<li>" + esc(firstWords(a, 9)) + "</li>";
      }).join("");
      var rSnip    = esc(firstSentence(c.r));

      return "<div class=\"card-hdr\"><span class=\"card-id\">" + c.id + "</span>"
           + "<span class=\"card-title\">" + esc(c.title) + star + "</span></div>"
           + "<div class=\"badge-row\">" + pills + "<span class=\"time-pill\">&#9201; " + esc(c.time) + "</span></div>"
           + "<div class=\"star-summary\">"
           +   "<div class=\"star-row\"><span class=\"star-key\">S/T</span><span class=\"star-val\">" + stSnip + "</span></div>"
           +   "<div class=\"star-row\"><span class=\"star-key\">A</span><ul class=\"star-mini-bullets\">" + aBullets + "</ul></div>"
           +   "<div class=\"star-row\"><span class=\"star-key\">R</span><span class=\"star-val\">" + rSnip + "</span></div>"
           + "</div>"
           + "<p class=\"flip-hint\">&#128432; Click card or Flip to see the full story</p>";
    }
  }

  function firstSentence(s) {
    var m = String(s).match(/^.+?[.!?](?:\s|$)/);
    return m ? m[0].trim() : String(s).split(" ").slice(0, 18).join(" ") + "…";
  }

  function firstWords(s, n) {
    var words = String(s).split(" ");
    return words.length <= n ? s : words.slice(0, n).join(" ") + "…";
  }

  /* ── back ── */
  function buildBack(c) {
    var star = c.star ? " &#11088;" : "";
    var hdr  = "<div class=\"card-hdr\"><span class=\"card-id\">" + c.id + "</span>"
             + "<span class=\"card-title\">" + esc(c.title) + star + "</span></div>";

    if (mode === "kor") {
      var secs = c.sections.map(function(s){
        return "<div class=\"kor-sec\"><span class=\"kor-sec-label\">" + esc(s.label) + "</span>"
             + "<span class=\"kor-sec-text\">" + esc(s.text) + "</span></div>";
      }).join("");
      return hdr + "<div class=\"kor-sections\">" + secs + "</div>";
    } else {
      var bullets = c.actions.map(function(a){ return "<li>" + esc(a) + "</li>"; }).join("");
      var fqs = c.followup.map(function(fq){
        return "<div class=\"fq-item\"><p class=\"fq-q\">" + esc(fq.q) + "</p>"
             + "<p class=\"fq-a\">&#8594; " + esc(fq.a) + "</p></div>";
      }).join("");
      return hdr
           + "<span class=\"sec-label\">Situation / Task</span>"
           + "<p class=\"sec-text\" style=\"margin-bottom:0\">" + esc(c.st) + "</p>"
           + "<hr class=\"divider\" />"
           + "<span class=\"sec-label\">Action</span>"
           + "<ul class=\"action-list\">" + bullets + "</ul>"
           + "<hr class=\"divider\" />"
           + "<span class=\"sec-label\">Result</span>"
           + "<div class=\"result-box\">" + esc(c.r) + "</div>"
           + "<hr class=\"divider\" />"
           + "<button class=\"fq-toggle\" id=\"fqBtn\" onclick=\"event.stopPropagation();toggleFQ()\">&#9654; Follow-up Q&amp;A</button>"
           + "<div class=\"fq-content\" id=\"fqBox\">" + fqs + "</div>";
    }
  }

  function toggleFQ() {
    var btn = document.getElementById("fqBtn");
    var box = document.getElementById("fqBox");
    if (!btn || !box) return;
    var open = box.classList.toggle("open");
    btn.classList.toggle("open", open);
    btn.innerHTML = (open ? "&#9660;" : "&#9654;") + " Follow-up Q&amp;A";
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /* ==========================================================
     KEYBOARD
  ========================================================== */
  document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowLeft")  { e.preventDefault(); navigate(-1); }
    if (e.key === "ArrowRight") { e.preventDefault(); navigate(1);  }
    if (e.key === "ArrowDown")  { e.preventDefault(); if (!isFlipped) flipCard(); }
    if (e.key === "ArrowUp")    { e.preventDefault(); if (isFlipped)  flipCard(); }
    if (e.key === " ")          { e.preventDefault(); flipCard();   }
  });

  /* init */
  refresh(true);
  </script>
</body>
</html>
